  const goCat = (id) => { setSelectedCat(id); setPage("cat"); setSelectedConcept(null); jump(); };
  const goConcept = (id) => {
    const c = byId(id);
    setSelectedConcept(id);
    if (c && c.cat) setSelectedCat(c.cat);
    setPage("concept");
    jump();
  };

  function jump() { window.scrollTo({ top: 0, behavior: "smooth" }); }

  const catObj = selectedCat ? CATEGORIES.find(c => c.id === selectedCat) : null;

  return (
    <div className="min-h-screen text-stone-100 selection:bg-amber-500/30"
      style={{ background: "radial-gradient(1000px 480px at 12% -10%, rgba(217,119,6,.1), transparent 60%), #0c0a09" }}>
      <div className="max-w-3xl mx-auto px-5 sm:px-8 py-9">

        {/* ヘッダー領域 */}
        <div className="mb-7 flex items-start justify-between flex-wrap gap-4">
          <div>
            <h1 className="text-[22px] font-bold tracking-tight text-white flex items-center gap-2 cursor-pointer" onClick={goHome}>
              📜 日本史 知識図鑑 ─ 昭和史編
            </h1>
            <p className="text-[13px] text-stone-400 mt-1">激動の64年「戦争・復興・発展」を「5つの視点」で読み解く</p>
          </div>
          <button onClick={goTimeline}
            className={`px-4 py-2 rounded-xl text-[13px] font-bold ring-1 transition flex items-center gap-1.5 ${
              page === "timeline"
                ? "bg-amber-600 text-white ring-amber-400"
                : "bg-amber-500/10 text-amber-300 ring-amber-500/30 hover:bg-amber-500/20"
            }`}>
            📅 昭和年表で全体を確認する
          </button>
        </div>

        {/* パンくずリスト */}
        <div className="flex items-center gap-2 text-[13px] text-stone-400 mb-8 flex-wrap">
          <button onClick={goHome} className="hover:text-stone-200 transition">図鑑トップ</button>
          {page === "timeline" && (
            <>
              <span className="text-stone-600">/</span>
              <span className="text-amber-400 font-semibold">昭和史年表</span>
            </>
          )}
          {selectedCat && page !== "timeline" && (
            <>
              <span className="text-stone-600">/</span>
              <button onClick={() => goCat(selectedCat)} className="hover:text-stone-200 transition">
                {catObj ? catObj.name : selectedCat}
              </button>
            </>
          )}
          {concept && page === "concept" && (
            <>
              <span className="text-stone-600">/</span>
              <span className="text-amber-400 font-semibold">{concept.title}</span>
            </>
          )}
        </div>

        {/* ---------------- L1: TOP カテゴリー一覧 ---------------- */}
        {page === "home" && (
          <div className="rise space-y-4">
            <div className="text-[12px] font-bold text-stone-400 mb-1">カテゴリーを選択してください</div>
            {CATEGORIES.map(cat => {
              const count = CONCEPTS.filter(c => c.cat === cat.id).length;
              return (
                <div key={cat.id} onClick={() => goCat(cat.id)}
                  className="group cursor-pointer rounded-xl p-5 bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] hover:ring-amber-500/40 transition flex items-center gap-5">
                  <div className="flex-shrink-0 p-2 rounded-lg bg-stone-900/80 border border-white/5">
                    <SvgIcon type={cat.icon} className="w-14 h-14" />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-1.5">
                      <h2 className="text-[17px] font-bold text-white group-hover:text-amber-300 transition">{cat.name}</h2>
                      <span className="text-[12px] font-semibold px-2.5 py-0.5 rounded-full bg-white/10 text-stone-300">{count} 項目</span>
                    </div>
                    <p className="text-[13.5px] text-stone-400 leading-relaxed">{cat.description}</p>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ---------------- L2: カテゴリー内 概念リスト ---------------- */}
        {page === "cat" && catObj && (
          <div className="rise">
            <div className="mb-6 p-5 rounded-2xl bg-amber-500/[.05] ring-1 ring-amber-500/20 flex items-center gap-4">
              <SvgIcon type={catObj.icon} className="w-12 h-12 flex-shrink-0" />
              <div>
                <h2 className="text-2xl font-bold text-white mb-1">{catObj.name}</h2>
                <p className="text-[14px] text-stone-300 leading-relaxed">{catObj.description}</p>
              </div>
            </div>
            <div className="space-y-3">
              {CONCEPTS.filter(c => c.cat === selectedCat).map(c => (
                <button key={c.id} onClick={() => goConcept(c.id)}
                  className="w-full text-left rounded-xl p-4 bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] hover:ring-amber-500/40 transition flex items-center gap-4">
                  <div className="flex-shrink-0 p-1.5 rounded-lg bg-stone-900/80 border border-white/5">
                    <SvgIcon type={c.icon} className="w-10 h-10" />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <div className="font-bold text-[17px] text-white">{c.title}</div>
                      <span className="text-[11px] text-stone-500 font-mono">{c.era}</span>
                    </div>
                    <div className="text-[13.5px] text-amber-300 mt-0.5 truncate">{c.headline}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ---------------- L3: 概念詳細ページ（5つの視点） ---------------- */}
        {page === "concept" && concept && (
          <div className="rise space-y-6">
            <div className="flex items-start gap-5 p-5 rounded-2xl bg-white/[.03] ring-1 ring-white/10">
              <div className="flex-shrink-0 p-3 rounded-xl bg-stone-900/90 border border-white/10">
                <SvgIcon type={concept.icon} className="w-16 h-16" />
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between text-[12px] text-stone-400 mb-1">
                  <span>{catObj ? catObj.name : ""}</span>
                  <span className="font-mono text-amber-300">{concept.era}</span>
                </div>
                <h2 className="text-[28px] leading-tight font-bold text-white">{concept.title}</h2>
                <p className="text-[15px] font-semibold text-amber-200 mt-1">{concept.headline}</p>
                <p className="text-[14px] leading-relaxed text-stone-300 mt-3">{concept.summary}</p>
              </div>
            </div>

            {concept.perspectives && (
              <div className="space-y-4">
                
                {/* 1. 人物 & 2. 時代 */}
                <div className="grid sm:grid-cols-2 gap-4">
                  {/* 👤 人物 */}
                  {concept.perspectives.person && (
                    <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
                      <h3 className="text-amber-300 font-bold text-[14px] mb-2.5 flex items-center gap-1.5 border-b border-white/10 pb-2">
                        👤 人物・関係者
                      </h3>
                      <div className="space-y-2 text-[13px]">
                        {concept.perspectives.person.map((p, i) => (
                          <div key={i} className="flex items-start gap-2">
                            <span className="text-stone-400 font-semibold min-w-[65px]">{p.label}:</span>
                            {p.targetId ? (
                              <button onClick={() => goConcept(p.targetId)} className="text-amber-300 underline hover:text-amber-100 text-left font-semibold">
                                {p.name || p.desc}
                              </button>
                            ) : (
                              <span className="text-stone-200">{p.desc || p.name}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* ⏳ 時代 */}
                  {concept.perspectives.era && (
                    <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
                      <h3 className="text-orange-300 font-bold text-[14px] mb-2.5 flex items-center gap-1.5 border-b border-white/10 pb-2">
                        ⏳ 時代背景・情勢
                      </h3>
                      <div className="space-y-2 text-[13px]">
                        {concept.perspectives.era.map((e, i) => (
                          <div key={i} className="flex items-start gap-2">
                            <span className="text-stone-400 font-semibold min-w-[65px]">{e.label}:</span>
                            {e.targetId ? (
                              <button onClick={() => goConcept(e.targetId)} className="text-orange-300 underline hover:text-orange-100 text-left">
                                {e.text}
                              </button>
                            ) : (
                              <span className="text-stone-200">{e.text}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* 3. 因果 */}
                {concept.perspectives.causality && (
                  <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
                    <h3 className="text-red-300 font-bold text-[14px] mb-3 flex items-center gap-1.5 border-b border-white/10 pb-2">
                      🔄 因果（なぜ？どうして？）
                    </h3>
                    <div className="space-y-3 text-[13px]">
                      {concept.perspectives.causality.map((c, i) => (
                        <div key={i} className="border-l-2 border-red-500/40 pl-3 space-y-0.5">
                          <div className="font-semibold text-red-200">Q. {c.q}</div>
                          <div className="text-stone-300 leading-relaxed">{c.a}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 4. 場所 & 5. 関連年表 */}
                <div className="grid sm:grid-cols-2 gap-4">
                  {/* 📍 関連場所 */}
                  {concept.perspectives.places && (
                    <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
                      <h3 className="text-emerald-300 font-bold text-[14px] mb-2.5 flex items-center gap-1.5 border-b border-white/10 pb-2">
                        📍 舞台・ゆかりの地
                      </h3>
                      <div className="flex flex-wrap gap-2 text-[12.5px]">
                        {concept.perspectives.places.map((pl, i) => (
                          <span key={i} className="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
                            {pl.name}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 📜 年表 */}
                  {concept.perspectives.timeline && (
                    <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
                      <h3 className="text-purple-300 font-bold text-[14px] mb-2.5 flex items-center gap-1.5 border-b border-white/10 pb-2">
                        📜 関連略年表
                      </h3>
                      <div className="space-y-1.5 text-[12.5px]">
                        {concept.perspectives.timeline.map((t, i) => (
                          <div key={i} className="flex items-center gap-2">
                            <span className="font-mono text-purple-300 text-[11px] min-w-[65px]">{t.year}</span>
                            <span className="text-stone-300 truncate">{t.event}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

              </div>
            )}
          </div>
        )}

        {/* ---------------- L4: 全体年表ページ ---------------- */}
        {page === "timeline" && (
          <div className="rise space-y-6">
            <div className="p-5 rounded-2xl bg-amber-500/[.05] ring-1 ring-amber-500/20">
              <h2 className="text-xl font-bold text-white mb-1">昭和史 主要年表</h2>
              <p className="text-[13.5px] text-stone-300">昭和改元から激動の戦争、復興、高度成長、昭和の終焉まで</p>
            </div>
            <div className="relative pl-6 space-y-6 before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-amber-500/30">
              {TIMELINE.map((item, idx) => (
                <div key={idx} className="relative group flex items-start justify-between gap-4 p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] transition">
                  <div className="absolute -left-[19px] top-5 w-2.5 h-2.5 rounded-full bg-amber-500 ring-4 ring-[#0c0a09]" />
                  <div>
                    <span className="font-mono text-[12px] font-bold text-amber-400 block mb-0.5">{item.year}</span>
                    <h3 className="font-bold text-[15px] text-white">{item.title}</h3>
                  </div>
                  {item.conceptId && (
                    <button onClick={() => goConcept(item.conceptId)} className="flex-shrink-0 px-3 py-1 rounded-lg text-[12px] font-semibold bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition border border-amber-500/30">
                      詳細を見る
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
