        <div className="flex-1 p-3 rounded-xl bg-emerald-400/10 ring-1 ring-emerald-400/30 text-center">
          <div className="text-[11px] font-bold text-emerald-300">最東端</div>
          <div className="text-[15px] font-bold text-white">インダス川流域</div>
          <div className="text-[11px] text-slate-400 mt-1">兵士の拒否で帰還決定</div>
        </div>
      </div>

      {/* 勝利の理由と遺産 */}
      <div className="grid sm:grid-cols-2 gap-3 text-[12.5px]">
        <div className="p-3.5 rounded-xl bg-white/[.04] ring-1 ring-white/10">
          <div className="font-bold text-cyan-300 mb-1">⚔️ 戦術の核心：王頭切り</div>
          <p className="text-slate-300">ファランクス（槍ぶすま長槍兵）で敵の前衛を止め、自ら騎兵率いて敵王ダレイオス3世の本陣へ一直線に突撃した。</p>
        </div>
        <div className="p-3.5 rounded-xl bg-white/[.04] ring-1 ring-white/10">
          <div className="font-bold text-rose-300 mb-1">🌏 歴史的インパクト：東西融合</div>
          <p className="text-slate-300">ギリシャ文化とオリエント世界が合体し「ヘレニズム」が誕生。仏教美術（ガンダーラ美術）など世界中へ広がる。</p>
        </div>
      </div>
    </figure>
  );
}

function FigPhiloSequence() {
  return (
    <figure className="space-y-4">
      <p className="text-[15px] font-bold text-white">ギリシャ哲学 思考の受け継がれ方（直系師弟関係）</p>
      <div className="space-y-2">
        {[
          { name:"ソクラテス", role:"街頭の対話者", core:"「無知の知」─ 問いかけで概念を揺さぶる", color:"border-l-4 border-emerald-400 bg-emerald-400/[.05]" },
          { name:"プラトン", role:"弟 子", core:"「イデア論」─ 天上に存在する完全な真理世界を追究", color:"border-l-4 border-cyan-400 bg-cyan-400/[.05]" },
          { name:"アリストテレス", role:"孫弟子", core:"「経験主義」─ 地上の観察と分析で分類・学問化（万学の祖）", color:"border-l-4 border-amber-400 bg-amber-400/[.05]" },
          { name:"アレクサンドロス", role:"教え子", core:"「世界帝国」─ 哲学と思想を剣とともに世界中へ広める", color:"border-l-4 border-rose-400 bg-rose-400/[.05]" },
        ].map((item,i)=>(
          <div key={i} className={`p-3 rounded-r-xl ring-1 ring-white/10 ${item.color} flex items-center justify-between`}>
            <div>
              <span className="text-[14px] font-bold text-white">{item.name}</span>
              <span className="text-[11px] text-slate-400 ml-2">({item.role})</span>
              <div className="text-[12px] text-slate-300 mt-0.5">{item.core}</div>
            </div>
            {i < 3 && <span className="text-slate-500 font-bold text-lg hidden sm:inline">↓</span>}
          </div>
        ))}
      </div>
    </figure>
  );
}

function FigWarVs() {
  return (
    <figure className="space-y-4">
      <p className="text-[15px] font-bold text-white">アテネ vs スパルタ 国家モデルの対立</p>
      <div className="grid sm:grid-cols-2 gap-3">
        <div className="p-4 rounded-xl bg-cyan-500/10 ring-1 ring-cyan-500/30">
          <div className="text-[14px] font-bold text-cyan-300 mb-2">🌊 アテネモデル（海洋国家）</div>
          <ul className="text-[12px] text-slate-200 space-y-1.5">
            <li>• <b>政治：</b> 直接民主政（市民全員による討議）</li>
            <li>• <b>経済：</b> 海上貿易とデロス同盟の金銭集積</li>
            <li>• <b>軍事：</b> 三段櫂船を中核とした巨大海軍</li>
            <li>• <b>価値観：</b> 言論の自由、学問・芸術、個人の才能</li>
          </ul>
        </div>
        <div className="p-4 rounded-xl bg-rose-500/10 ring-1 ring-rose-500/30">
          <div className="text-[14px] font-bold text-rose-300 mb-2">🛡️ スパルタモデル（陸上軍事国家）</div>
          <ul className="text-[12px] text-slate-200 space-y-1.5">
            <li>• <b>政治：</b> 少数のスパルタ市民による軍事寡頭政</li>
            <li>• <b>経済：</b> 農奴（ヘイロータイ）に耕作させる農業</li>
            <li>• <b>軍事：</b> 最強のファランクス（重装歩兵集団）</li>
            <li>• <b>価値観：</b> 規律、服従、質実剛健、過度な質素さ</li>
          </ul>
        </div>
      </div>
    </figure>
  );
}

function FigHellenism() {
  return (
    <figure className="space-y-4">
      <p className="text-[15px] font-bold text-white">「ヘレニズム文化」二つの要素の合流</p>
      <div className="flex items-center gap-2">
        <div className="flex-1 p-3 rounded-lg bg-cyan-500/10 ring-1 ring-cyan-500/30 text-center">
          <div className="text-[13px] font-bold text-cyan-300">ギリシャ文化</div>
          <div className="text-[11px] text-slate-400 mt-1">理性・人体美・民主思考</div>
        </div>
        <span className="text-xl font-bold text-slate-500">+</span>
        <div className="flex-1 p-3 rounded-lg bg-amber-500/10 ring-1 ring-amber-500/30 text-center">
          <div className="text-[13px] font-bold text-amber-300">オリエント文化</div>
          <div className="text-[11px] text-slate-400 mt-1">専制王権・神秘主義・巨大造形</div>
        </div>
      </div>
      <div className="text-center text-slate-500 font-bold">↓</div>
      <div className="p-3.5 rounded-xl bg-gradient-to-r from-cyan-500/20 via-purple-500/20 to-amber-500/20 ring-1 ring-white/20 text-center">
        <div className="text-[15px] font-bold text-white">ヘレニズム文化の誕生</div>
        <div className="text-[12px] text-slate-300 mt-1">「ミロのヴィーナス」「ラオコーン」、世界市民（コスモポリタン）意識の台頭</div>
      </div>
    </figure>
  );
}

const FIGS = {
  athens: FigAthens,
  sparta: FigWarVs,
  persia: FigWarVs,
  pelop: FigWarVs,
  socrates: FigPhiloSequence,
  plato: FigPhiloSequence,
  aris: FigPhiloSequence,
  alex: FigAlex,
  hellen: FigHellenism,
  rome: FigHellenism
};

/* ============================================================
   MAIN APP
   ============================================================ */
function App() {
  const [page, setPage] = useState("home"); // "home" | "cat" | "concept" | "timeline"
  const [selectedCat, setSelectedCat] = useState(null);
  const [selectedConcept, setSelectedConcept] = useState(null);
  const [openBody, setOpenBody] = useState(false);

  const concept = selectedConcept ? byId(selectedConcept) : null;

  const goHome = () => { setPage("home"); setSelectedCat(null); setSelectedConcept(null); jump(); };
  const goTimeline = () => { setPage("timeline"); jump(); };
  const goCat = (id) => { setSelectedCat(id); setPage("cat"); setSelectedConcept(null); jump(); };
  const goConcept = (id) => {
    const c = byId(id);
    if (!c) return;
    setSelectedConcept(id);
    setSelectedCat(c.cat);
    setPage("concept");
    setOpenBody(false);
    jump();
  };

  function jump() { window.scrollTo({ top: 0, behavior: "smooth" }); }

  const catObj = selectedCat ? CATEGORIES.find(c => c.id === selectedCat) : null;
  const Fig = concept ? FIGS[concept.visualization] : null;

  return (
    <div className="min-h-screen text-slate-100 selection:bg-cyan-500/30"
      style={{ background: "radial-gradient(1000px 480px at 12% -10%, rgba(56,189,248,.07), transparent 60%), #0b0f1a" }}>
      <div className="max-w-3xl mx-auto px-5 sm:px-8 py-9">

        {/* ヘッダー領域 */}
        <div className="mb-7 flex items-start justify-between flex-wrap gap-4">
          <div>
            <h1 className="text-[22px] font-bold tracking-tight text-white flex items-center gap-2">
              🏛️ 古代ギリシャ知識図鑑
            </h1>
            <p className="text-[13px] text-slate-400 mt-1">歴史の概念をつないで、西洋文明の源流を対話的に探求する</p>
          </div>
          {/* 年表切り替えボタン */}
          <button onClick={goTimeline}
            className={`px-4 py-2 rounded-xl text-[13px] font-bold ring-1 transition flex items-center gap-1.5 ${
              page === "timeline"
                ? "bg-cyan-400 text-slate-950 ring-cyan-300"
                : "bg-cyan-400/10 text-cyan-300 ring-cyan-400/30 hover:bg-cyan-400/20"
            }`}>
            📅 年表で全体を確認する
          </button>
        </div>

        {/* パンくずリスト */}
        <div className="flex items-center gap-2 text-[13px] text-slate-400 mb-8 flex-wrap">
          <button onClick={goHome} className="hover:text-slate-200 transition">図鑑トップ</button>
          {page === "timeline" && (
            <>
              <span className="text-slate-600">/</span>
              <span className="text-cyan-300 font-semibold">歴史年表ビュー</span>
            </>
          )}
          {selectedCat && page !== "timeline" && (
            <>
              <span className="text-slate-600">/</span>
              <button onClick={() => goCat(selectedCat)} className="hover:text-slate-200 transition">
                {catObj ? catObj.name : selectedCat}
              </button>
            </>
          )}
          {concept && page === "concept" && (
            <>
              <span className="text-slate-600">/</span>
              <span className="text-cyan-300 font-semibold">{concept.title}</span>
            </>
          )}
        </div>

        {/* ---------------- L1: TOP カテゴリー一覧 ---------------- */}
        {page === "home" && (
          <div className="rise space-y-4">
            <div className="text-[12px] font-bold text-slate-400 mb-1">大見出しカテゴリー一覧（クリックで詳細へ）</div>
            {CATEGORIES.map(cat => {
              const count = CONCEPTS.filter(c => c.cat === cat.id).length;
              return (
                <div key={cat.id} onClick={() => goCat(cat.id)}
                  className="group cursor-pointer rounded-xl p-5 bg-white/[.04] ring-1 ring-white/10 hover:bg-white/[.07] hover:ring-cyan-400/40 transition">
                  <div className="flex items-center justify-between mb-1.5">
                    <h2 className="text-[17px] font-bold text-white group-hover:text-cyan-300 transition">{cat.name}</h2>
                    <span className="text-[12px] font-semibold px-2.5 py-0.5 rounded-full bg-white/10 text-slate-300">{count} 概念</span>
                  </div>
                  <p className="text-[13.5px] text-slate-400 leading-relaxed">{cat.description}</p>
                </div>
              );
            })}
          </div>
        )}

        {/* ---------------- L2: カテゴリー内 概念リスト ---------------- */}
        {page === "cat" && catObj && (
          <div className="rise">
            <div className="mb-6 p-5 rounded-2xl bg-cyan-400/[.05] ring-1 ring-cyan-400/20">
              <h2 className="text-2xl font-bold text-white mb-2">{catObj.name}</h2>
              <p className="text-[14px] text-slate-300 leading-relaxed">{catObj.description}</p>
            </div>
            <div className="space-y-3">
              {CONCEPTS.filter(c => c.cat === selectedCat).map(c => (
                <button key={c.id} onClick={() => goConcept(c.id)}
                  className="w-full text-left rounded-xl p-5 bg-white/[.04] ring-1 ring-white/10 hover:bg-white/[.07] hover:ring-cyan-400/40 transition">
                  <div className="flex items-center justify-between">
                    <div className="font-bold text-[17px] text-white">{c.title}</div>
                    <span className="text-[11px] text-slate-500 font-mono">{c.era}</span>
                  </div>
                  <div className="text-[14px] text-cyan-300 mt-1">{c.headline}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ---------------- L3: 概念詳細ページ（図解 + 根拠解説 + 関連リンク） ---------------- */}
        {page === "concept" && concept && (
          <div className="rise">
            <div className="flex items-center justify-between text-[12px] text-slate-400 mb-1">
              <span>{catObj ? catObj.name : ""}</span>
              <span className="font-mono text-cyan-300">{concept.era}</span>
            </div>
            <h2 className="text-[30px] leading-tight font-bold mb-2 text-white">{concept.title}</h2>
            <p className="text-[17px] leading-snug font-semibold text-cyan-200 mb-8">{concept.headline}</p>

            {/* 図解コンポーネント */}
            {Fig ? (
              <div className="mb-8 p-5 rounded-2xl bg-white/[.03] ring-1 ring-white/12">
                <Fig />
              </div>
            ) : (
              <div className="mb-8 p-6 rounded-xl ring-1 ring-white/10 text-slate-400 text-[14px]">（図解準備中）</div>
            )}

            {/* 概要要約 */}
            <p className="text-[14px] leading-[1.95] text-slate-300 mb-8">{concept.summary}</p>

            {/* 関連概念チェーン */}
            <div className="mb-8">
              <div className="text-[12px] font-bold text-slate-400 mb-3 tracking-wide">関連する概念 ── たどって歴史の因果関係を歩く</div>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="rounded-full px-3.5 py-1.5 text-[13px] font-bold bg-white/12 text-white ring-1 ring-white/20">
                  {concept.title}
                </span>
                <span className="text-slate-500 text-[15px]">→</span>
                {concept.related.map(relId => {
                  const r = byId(relId);
                  return (
                    <button key={relId} onClick={() => goConcept(relId)}
                      className="rounded-full px-3.5 py-1.5 text-[13px] font-semibold bg-cyan-400/15 text-cyan-100 ring-1 ring-cyan-400/40 hover:bg-cyan-400/25 transition">
                      {r ? r.title : relId}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 深掘り折りたたみ（根拠と論点） */}
            <div className="rounded-2xl bg-white/[.03] ring-1 ring-white/10 mb-8">
              <button onClick={() => setOpenBody(o => !o)}
                className="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-white/[.04] transition">
                <span className="text-[14px] font-bold text-slate-200">🔍 もっと詳しく ── 歴史的背景と論点</span>
                <span className="text-cyan-300 text-[13px] font-bold">{openBody ? "閉じる −" : "開く ＋"}</span>
              </button>
              {openBody && (
                <div className="px-5 pb-6 pt-2 space-y-3 border-t border-white/10">
                  {concept.body.map((b, i) => (
                    <div key={i} className="rounded-xl bg-white/[.03] ring-1 ring-white/10 p-4">
                      <div className="text-[13px] font-bold text-cyan-300 mb-1">{b.label}</div>
                      <p className="text-[14px] leading-[1.85] text-slate-300">{b.text}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {/* ---------------- 年表（TIMELINE）ページ ---------------- */}
        {page === "timeline" && (
          <div className="rise">
            <h2 className="text-2xl font-bold mb-2 text-white">古代ギリシャ 歴史年表</h2>
            <p className="text-[13px] text-slate-400 mb-7">出来事をクリックすると、関連する知識図鑑の概念ページへ移動します。</p>

            <div className="relative border-l-2 border-cyan-500/30 ml-3 space-y-6">
              {TIMELINE.map((item, idx) => {
                const target = byId(item.conceptId);
                return (
                  <div key={idx} className="relative pl-6 group">
                    {/* ドット */}
                    <span className="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-cyan-400 ring-4 ring-slate-950 group-hover:scale-125 transition" />
                    <div className="text-[12px] font-mono font-bold text-cyan-400">{item.year}</div>
                    <button onClick={() => goConcept(item.conceptId)}
                      className="text-left mt-0.5 group-hover:translate-x-1 transition">
                      <div className="text-[16px] font-bold text-white group-hover:text-cyan-300 transition">
                        {item.title}
                      </div>
                      {target && (
                        <div className="text-[12px] text-slate-400 mt-0.5">
                          ↳ 解説ページ：<span className="text-slate-300 underline">{target.title}</span> （{target.headline}）
                        </div>
                      )}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
