 -750, "endYear": -700, "eraLabel": "古代ギリシア（前8世紀頃に文字化）", "creator": "ホメロス（実在は不確か）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Homer_British_Museum.jpg?width=1000", "imageCredit": "JW1805, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Homer_British_Museum.jpg", "body": [{"label": "口承文学から文字文学へ", "text": "二作品は元々、吟遊詩人が竪琴の伴奏で暗誦・即興的に語り継いだ口承詩だったと考えられている。定型句の多用は、長大な物語を暗記して語るための記憶術の名残とされる。"}, {"label": "「オデュッセイア」が生んだ普遍的モチーフ", "text": "苦難の末に故郷へ帰る旅路という構造は「オデッセイ」という言葉自体が一般名詞化するほど後世の文学に定着し、現代の小説・映画にも繰り返し引用される物語の型になった。"}], "relatedTopics": [{"concept": "epic-of-gilgamesh", "relation": "関連"}, {"concept": "greek-tragedy", "relation": "源流"}, {"concept": "ancient-greek-sculpture", "relation": "関連"}, {"concept": "virgil-aeneid", "relation": "関連"}], "referencedBy": [{"id": "ancient-greek-sculpture", "title": "古代ギリシア彫刻", "field": "art"}, {"id": "epic-of-gilgamesh", "title": "ギルガメシュ叙事詩", "field": "literature"}, {"id": "greek-tragedy", "title": "ギリシア悲劇", "field": "literature"}, {"id": "virgil-aeneid", "title": "ウェルギリウスの『アエネイス』", "field": "literature"}]}, {"id": "humanism", "title": "ヒューマニズム", "aka": "Humanism", "field": "thought", "area": "近代思想の源流", "headline": "神や運命より、人間の理性と尊厳を中心に置く思想", "summary": "ヒューマニズム（人文主義）は、中世の神中心的な世界観に対して、人間の理性・尊厳・可能性を重んじ、古代ギリシア・ローマの古典に学びながら人間性を肯定的に捉え直そうとした思想的立場。ルネサンス期に開花し、その後の啓蒙思想や近代的な人権思想の土台の一つになった。", "keyPoint": "「人間には特別な尊厳と可能性がある」という前提が、その後の人権思想全体を下支えしている。", "body": [{"label": "古典の再発見", "text": "ルネサンス期のヒューマニストは、忘れられていたギリシア・ローマの古典を再発見し、そこに人間性への深い洞察を見出した。"}, {"label": "人間の尊厳", "text": "ピコ・デラ・ミランドラは「人間の尊厳について」で、人間は自らの意志で自分の在り方を選び取れる特別な存在だと論じた。"}], "relatedTopics": [{"concept": "enlightenment-thought", "relation": "関連"}], "referencedBy": [{"id": "american-transcendentalism", "title": "アメリカ超越主義", "field": "thought"}, {"id": "enlightenment-thought", "title": "啓蒙思想", "field": "thought"}]}, {"id": "husserl-phenomenology", "title": "フッサールの現象学", "aka": "Husserl's Phenomenology", "field": "philosophy", "area": "西洋哲学史（近代〜現代）", "headline": "先入観を排し、意識に現れるがままの経験そのものを厳密に記述する方法", "summary": "フッサールが創始した現象学は、「事象そのものへ！」を合言葉に、外界が実在するかどうかといった既存の理論的前提をいったん保留（エポケー／現象学的還元）し、私たちの意識に直接与えられている経験そのものをありのままに厳密に記述しようとする哲学的方法。あらゆる意識は常に「何かについての」意識であるという「志向性」の概念が中心にある。", "keyPoint": "「エポケー」によって自然な思い込みをかっこに入れることで、経験がどのように意識の中で構成されているかを、先入観抜きに見つめ直すことができる。", "body": [{"label": "志向性", "text": "人間の意識は決して対象なしに存在せず、常に「何かについて」の意識（知覚、想起、想像など）であるとする考え方。フッサールはこの志向性の構造を精密に分析することを現象学の中心課題とした。"}, {"label": "後世への影響", "text": "フッサールの現象学は弟子のハイデガーを経て、サルトルやメルロ=ポンティらのフランス実存主義・現象学に大きな影響を与え、20世紀の大陸哲学の主要な源流の一つとなった。"}], "relatedTopics": [{"concept": "heidegger-being-and-time", "relation": "源流"}, {"concept": "existentialism", "relation": "源流"}], "referencedBy": [{"id": "heidegger-being-and-time", "title": "ハイデガーの存在と時間", "field": "philosophy"}, {"id": "nishida-kyoto-school", "title": "西田幾多郎の京都学派", "field": "thought"}]}, {"id": "idea-of-progress", "title": "進歩史観", "aka": "Idea of progress", "field": "thought", "area": "近代思想の源流", "headline": "歴史は良い方向へ進んでいくという発想", "summary": "進歩史観とは、人類の歴史は知識・技術・道徳・自由の面で全体として着実に向上していくものだ、とする歴史観。啓蒙思想はこの発想を強く後押しし、コンドルセらは人類の理性の進歩に限りはないと楽観的に論じた。20世紀の戦争や環境破壊は、この楽観的な進歩史観に大きな疑問を投げかけた。", "keyPoint": "「進歩」を疑わない態度そのものが、20世紀の悲劇を経て批判的に検討し直された。", "body": [{"label": "啓蒙のもう一つの遺産", "text": "理性の力で無知や不正を乗り越えられるという啓蒙の信念は、「歴史は進歩する」という物語と表裏一体だった。"}, {"label": "進歩史観への懐疑", "text": "二度の世界大戦や大量破壊兵器の登場は、技術の進歩が必ずしも道徳の進歩を伴わないことを示し、単純な進歩史観への疑いを強めた。"}], "relatedTopics": [{"concept": "enlightenment-thought", "relation": "源流"}], "referencedBy": [{"id": "eschatology-christian", "title": "終末論", "field": "religion"}, {"id": "hegel-dialectic", "title": "ヘーゲルの弁証法", "field": "philosophy"}, {"id": "positivism-and-its-critics", "title": "実証主義とその批判", "field": "thought"}, {"id": "postmodernism", "title": "ポストモダン", "field": "thought"}]}, {"id": "ie-system-anthropology", "title": "家（イエ）制度の人類学", "aka": "Anthropology of the Ie System", "field": "culture-anthropology", "area": "日本文化人類学とフィールドワーク", "headline": "血縁だけでなく経営体としての性格も持つ、日本の伝統的な家族・世帯の仕組み", "summary": "日本の伝統的な「家（イエ）」制度は、単なる血縁関係の集まりというより、家業や田畑といった財産を代々継承していく経営体としての性格を強く持ち、跡継ぎには必ずしも実子でなく、能力のある養子や婿養子を迎え入れることも広く行われた点で、純粋な血統原理に基づく西洋の「家族」とは異なる独自の社会組織であると、日本の家族人類学は明らかにしてきた。", "keyPoint": "イエは経営体としての存続を最優先するため、直系の子孫であっても能力が不十分と判断されれば継承者から外され、逆に血縁のない者が養子として家督を継ぐこともある、実力主義的で柔軟な側面を持っていた。", "body": [{"label": "直系家族と傍系の分離", "text": "イエ制度では、家督と財産を継ぐのは原則として一人の跡取り（多くは長男）に限られ、それ以外の子供たちは分家するか他家に嫁ぐ・婿入りするなどして本家から独立し、家産の分割を防ぎながら世代を超えて経営体を維持する仕組みが取られた。"}, {"label": "擬制的親族関係", "text": "血縁のない奉公人や弟子を「家族」の一員として位置づける、あるいは能力のある人物を養子に迎えて家督を継がせるといった慣行は、イエが血縁原理よりも経営体としての存続を優先する柔軟な社会組織であったことを示す。"}], "relatedTopics": [{"concept": "kinship-and-family", "relation": "具体例"}, {"concept": "the-modern-family", "relation": "対立する"}], "referencedBy": []}, {"id": "immigrants-and-ethnic-community", "title": "移民とエスニックコミュニティ", "aka": "Immigrants and Ethnic Community", "field": "sociology", "area": "都市社会学とグローバル化", "headline": "移民が新天地で形成する、出身地の文化やネットワークを保つ共同体", "summary": "異なる国・地域へ移動した移民は、しばしば同じ出身地や民族的背景を持つ人々が集住し、言語・宗教・食文化などを共有する「エスニックコミュニティ」（例えばチャイナタウン）を形成する。こうしたコミュニティは、新しい社会への適応を助ける相互扶助のネットワークとして機能する一方、受け入れ社会との間に文化的な摩擦や分断を生む場合もある。", "keyPoint": "エスニックコミュニティは同化（受け入れ社会の文化に溶け込む）か隔離かという単純な二択ではなく、両方の要素を併せ持つ複雑な適応の形態として理解される。", "body": [{"label": "相互扶助機能", "text": "言語の壁や差別に直面しやすい移民にとって、同郷者のネットワークは仕事の紹介、住居の確保、情報共有などの実際的な支援を提供し、移住直後の生活基盤を支える重要な役割を果たす。"}, {"label": "世代間の変化", "text": "一世は出身文化への帰属意識が強い一方、受け入れ社会で生まれ育った二世・三世は複数の文化的アイデンティティの間で独自のバランスを模索することが多く、コミュニティのあり方も世代を経て変化していく。"}], "relatedTopics": [{"concept": "ethnicity", "relation": "関連"}, {"concept": "diaspora", "relation": "なかま"}], "referencedBy": [{"id": "diaspora", "title": "ディアスポラ", "field": "culture-anthropology"}, {"id": "transnationalism", "title": "トランスナショナリズム", "field": "sociology"}]}, {"id": "impermanence-and-non-self", "title": "無常と無我（三法印）", "aka": "Impermanence and Non-self", "field": "religion", "area": "仏教", "headline": "すべては移り変わり、不変の実体としての「私」も存在しないという仏教の世界観", "summary": "仏教の根本的な世界観を示す三法印のうち、「諸行無常」はあらゆる現象は絶えず生滅変化し、永遠不変のものは何一つないという考え、「諸法無我」はどんな存在にも固定的で不変な実体（我）は存在しないという考えを指す（三法印の3つ目は「涅槃寂静」）。この無常・無我の理解を欠いたまま執着することが苦の根源とされる。", "keyPoint": "「私」という実体的な自我への執着そのものが苦しみの源であるとする無我の教えは、インド思想における実体的な自己（アートマン）の観念と鋭く対立する。", "body": [{"label": "諸行無常", "text": "人も物も社会も、瞬間ごとに変化し続けており、永久に同じ状態を保つものは何もないとする考え。この無常性を理解せず、変わらないものを求めて執着することが苦しみを生むとされる。"}, {"label": "諸法無我", "text": "ヒンドゥー思想が説くような、輪廻を通じて存続する不変の霊魂（アートマン）を仏教は否定し、「私」とは五蘊（色・受・想・行・識）という要素が縁起によって仮に結びついたものにすぎないとする。"}], "relatedTopics": [{"concept": "dependent-origination", "relation": "関連"}, {"concept": "afterlife-and-reincarnation", "relation": "対立する"}], "referencedBy": [{"id": "dependent-origination", "title": "縁起", "field": "religion"}]}, {"id": "impressionism", "title": "印象派", "aka": "Impressionism (Monet, Renoir)", "field": "art", "area": "近代美術（ロマン主義〜印象派）", "section": "", "headline": "アトリエを飛び出し、光の一瞬の印象を描いた革命", "summary": "19世紀後半、モネらの画家たちはアトリエでの入念な仕上げよりも、屋外で移ろう光や大気の効果を素早い筆致でとらえることを重視した。輪郭線をぼかし、絵の具を混ぜずに並置して光の振動を表現するこの手法は、伝統的なサロン（官展）の審査基準から外れ酷評されたが、モネの「印象、日の出」がグループ展の名称の由来となり、やがて西洋美術史を代表する運動として定着した。", "keyPoint": "「印象派」はもともと批評家がこの絵を「単なる印象にすぎない」と揶揄した言葉——批判の言葉が運動の名前になった。", "startYear": 1874, "endYear": 1886, "eraLabel": "印象派（1874〜1886年、8回のグループ展）", "creator": "クロード・モネ、ピエール＝オーギュスト・ルノワール", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Monet_-_Impression%2C_Sunrise.jpg?width=1000", "imageCredit": "Claude Monet, 1872年, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Monet_-_Impression,_Sunrise.jpg", "body": [{"label": "「印象、日の出」", "text": "ル・アーヴル港の日の出を素早い筆致でとらえたこの作品が1874年の第1回グループ展に出品され、批評家ルイ・ルロワが「印象しか描いていない」と皮肉ったことから「印象派」という呼称が定着した。"}, {"label": "光を描くための技法", "text": "絵の具を混ぜて中間色を作るのではなく、純色の絵の具を画面上に並べて置き、離れて見たときに視覚的に混色させる手法（筆触分割）で、自然光の振動感を表現した。"}], "relatedTopics": [{"concept": "realism-art-courbet", "relation": "源流"}, {"concept": "post-impressionism", "relation": "なかま"}, {"concept": "japonisme", "relation": "関連"}], "referencedBy": [{"id": "japonisme", "title": "ジャポニスム", "field": "art"}, {"id": "nihonga-yoga-debate", "title": "日本画と洋画の論争", "field": "art"}, {"id": "post-impressionism", "title": "後期印象派", "field": "art"}, {"id": "realism-art-courbet", "title": "写実主義（クールベ）", "field": "art"}]}, {"id": "international-institutions-and-global-governance", "title": "国際機構とグローバルガバナンス", "aka": "International Institutions and Global Governance", "field": "politics", "area": "国際政治", "headline": "主権国家を超えて、国際的な課題を協調的に統治する仕組みの模索", "summary": "国連・WTO・IMFといった国際機構や、気候変動枠組条約のような国際的な取り決めを通じて、単一の世界政府が存在しない中でも、環境問題・貿易・金融危機・感染症といった一国では対処できない地球規模の課題に、複数の国家やNGO・企業などの多様な主体が協調して対処していく統治のあり方を「グローバルガバナンス」と呼ぶ。主権国家体系を前提にしながらも、それを補完・調整する国際的な協調の枠組みとして機能する。", "keyPoint": "グローバルガバナンスは主権国家に取って代わる「世界政府」ではなく、主権国家同士や多様なアクターが協調するための、拘束力に濃淡のあるネットワーク的な統治の形態である。", "body": [{"label": "リベラリズムの制度論", "text": "国際政治のリベラリズム学派は、国家は必ずしも力の対立だけでなく、国際機構や条約といった制度を通じて協力することで、互いの利益になる持続的な協調関係を築けると論じ、国際機構の存在意義を理論的に支えている。"}, {"label": "実効性の課題", "text": "国際機構には各国の主権を制限する強制力が乏しいことが多く、気候変動対策のように各国の合意はできても実際の履行が各国の自主性に委ねられ、実効性の確保が常に大きな課題となる。"}], "relatedTopics": [{"concept": "collective-security", "relation": "なかま"}, {"concept": "sovereignty", "relation": "関連"}], "referencedBy": [{"id": "collective-security", "title": "集団安全保障", "field": "politics"}, {"id": "realism-and-liberalism-ir", "title": "リアリズムとリベラリズム（国際政治理論）", "field": "politics"}]}, {"id": "international-style-architecture", "title": "国際様式", "aka": "International Style Architecture (Mies van der Rohe)", "field": "architecture", "area": "産業革命〜近代建築（モダニズム）", "section": "", "headline": "「Less is more」、鉄とガラスの箱が世界の摩天楼の標準になった", "summary": "1930年代以降、モダニズム建築が国境を越えて広がる中で確立した様式。装飾を徹底的に排除し、鉄骨構造とガラスのカーテンウォールで構成されたシンプルな直方体のビルという、どの国のどの都市でも通用する普遍的な形式を追求した。ミース・ファン・デル・ローエの「Less is more（少ないほど豊かである）」という言葉に象徴されるこの様式は、戦後アメリカの高層オフィスビル建築の標準的な文法となり、世界中の都市の景観を一変させた。", "keyPoint": "国際様式の「どこでも同じ箱」というアプローチは、都市の個性を均質化してしまうとして、後にポストモダン建築からの強い批判の対象にもなった。", "startYear": 1930, "endYear": 1970, "eraLabel": "国際様式（1930年代〜1970年代）", "creator": "ミース・ファン・デル・ローエ、フィリップ・ジョンソン", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Seagrambuilding.JPG?width=1000", "imageCredit": "Mies van der Rohe, 1958年（「シーグラム・ビル」）, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Seagrambuilding.JPG", "body": [{"label": "「シーグラム・ビル」", "text": "ニューヨークのパーク街に建つこの38階建てオフィスビルは、ブロンズの柱型とガラスのカーテンウォールだけで構成された、装飾を一切排したミニマルな外観で国際様式の完成形とされる。"}, {"label": "「Less is more」の思想", "text": "ミースのこの言葉は、装飾を削ぎ落とすほど本質的な美が際立つという近代建築の理念を象徴し、以後多くの建築家に引用される20世紀建築を代表するフレーズとなった。"}], "relatedTopics": [{"concept": "bauhaus", "relation": "源流"}, {"concept": "le-corbusier-five-points", "relation": "なかま"}, {"concept": "skyscraper-development", "relation": "なかま"}, {"concept": "postmodern-architecture", "relation": "対立する"}], "referencedBy": [{"id": "bauhaus", "title": "バウハウス", "field": "architecture"}, {"id": "frank-lloyd-wright-organic-architecture", "title": "フランク・ロイド・ライトの有機的建築", "field": "architecture"}, {"id": "le-corbusier-five-points", "title": "ル・コルビュジエの近代建築五原則", "field": "architecture"}, {"id": "postmodern-architecture", "title": "ポストモダン建築", "field": "architecture"}, {"id": "skyscraper-development", "title": "摩天楼の発展（シカゴ派）", "field": "architecture"}, {"id": "tange-kenzo-modern-architecture", "title": "丹下健三と日本の近代建築", "field": "architecture"}]}, {"id": "intersectionality", "title": "交差性（インターセクショナリティ）", "aka": "Intersectionality", "field": "thought", "area": "フェミニズムとポストコロニアル思想", "headline": "人種・階級・ジェンダーなど複数の抑圧が重なり合う経験を捉える視点", "summary": "交差性（インターセクショナリティ）は、キンバリー・クレンショーが提唱した概念で、人種・階級・ジェンダー・性的指向といった複数の社会的なカテゴリーによる抑圧は、単純に足し合わされるのではなく、互いに交差し掛け合わさることで、それぞれの軸だけでは捉えきれない固有の経験を生み出すと論じる。例えば黒人女性の経験は、人種差別と性差別を別々に足し合わせただけでは理解できない独自の構造を持つとされる。", "keyPoint": "「女性」や「黒人」といった単一のカテゴリーで語られがちな差別の議論に対し、複数の軸が交差する地点にいる人々の経験が見落とされやすいという問題提起が出発点にある。", "body": [{"label": "クレンショーの問題提起", "text": "クレンショーは、雇用差別訴訟において黒人女性が「人種差別」か「性差別」かのどちらか一方の枠組みでしか訴えを認められず、両者が交差する固有の差別経験が法制度上見落とされてしまう事例を分析し、この概念を提唱した。"}, {"label": "第三波フェミニズムへの影響", "text": "交差性の視点は、単一の「女性」というカテゴリーを前提としてきた従来のフェミニズムを内側から批判し、人種・階級による経験の違いを重視する第三波以降のフェミニズムの重要な理論的支柱となった。"}], "relatedTopics": "summary": "ジェイムズの真理のプラグマティズム論は、ある観念が真であるとは、それを信じて行動することが実際の経験の中でうまく機能し、私たちの経験をよりよく整理し役立つことだ、とする真理観。真理を事実と観念の一致という静的な性質ではなく、経験の中で「うまくいく」という動的なプロセスとして捉え直した。", "keyPoint": "真理を「あらかじめ確定した事実との一致」ではなく、「信じて行動してみてうまくいくかどうか」というプロセスとして捉え直した。", "body": [{"label": "「現金価値」という比喩", "text": "ジェイムズは観念の真理性を、実際に引き出して使える「現金価値」にたとえ、経験の中で実際に役立ち検証される観念こそが真であると論じた。"}, {"label": "批判と擁護", "text": "「役に立てば何でも真になるのか」という批判に対し、ジェイムズは、経験全体と長期的に整合し続けることを条件としており、単なるご都合主義ではないと反論した。"}], "relatedTopics": [{"concept": "peirce-pragmatic-maxim", "relation": "なかま"}, {"concept": "skepticism", "relation": "対立する"}], "referencedBy": [{"id": "peirce-pragmatic-maxim", "title": "プラグマティズムの格率(パース)", "field": "thought"}, {"id": "radical-empiricism-james", "title": "徹底的経験論", "field": "thought"}]}, {"id": "japanese-bureaucracy", "title": "官僚制（日本型）", "aka": "Japanese-style Bureaucracy", "field": "politics", "area": "日本政治", "headline": "政治家以上に強い政策立案の実権を担ってきたとされる日本の中央官庁の仕組み", "summary": "日本型官僚制は、明治以来の伝統を持つ中央省庁のキャリア官僚が、法律の立案から予算編成、許認可行政に至るまで極めて高い専門性と実務能力を発揮し、政治家（大臣）に代わって実質的な政策決定を主導してきたとされる統治のあり方を指す。「官僚主導」と呼ばれるこの構造は、政治主導への改革がたびたび叫ばれながらも、専門知識の蓄積という官僚制の強みゆえに根強く残存してきたと論じられる。", "keyPoint": "官僚と特定分野に強い影響力を持つ「族議員」、そして業界団体という三者が結びつく「鉄の三角形（政官業の癒着）」構造が、日本型官僚制の政策決定を特徴づけるとしばしば指摘される。", "body": [{"label": "稟議制と根回し", "text": "日本の官庁の意思決定は、下位の担当者が起案した文書を関係部署に順に回して事前に合意を取り付けていく「稟議制」と「根回し」の慣行に特徴づけられ、この非公式な事前調整の過程が実質的な政策決定を左右するとされる。"}, {"label": "政治主導改革", "text": "1990年代以降、官僚主導からの脱却を目指し、内閣官房・内閣府の機能強化や、政治家が政策決定を主導する仕組みづくりが繰り返し試みられてきたが、専門的な政策立案能力を持つ官僚組織への実質的な依存は今なお続いているとされる。"}], "relatedTopics": [{"concept": "1955-system", "relation": "関連"}, {"concept": "weber-bureaucracy-and-rationalization", "relation": "なかま"}], "referencedBy": [{"id": "1955-system", "title": "55年体制", "field": "politics"}, {"id": "seikan-relations", "title": "政官関係（族議員と省庁）", "field": "politics"}]}, {"id": "japanese-constitution-government-structure", "title": "日本国憲法の統治機構", "aka": "Governmental Structure under the Constitution of Japan", "field": "politics", "area": "日本政治", "headline": "国民主権・基本的人権の尊重・平和主義を柱に、三権分立を定めた戦後日本の国家の骨格", "summary": "1946年に公布された日本国憲法は、国民主権・基本的人権の尊重・平和主義を三大原則とし、統治機構としては国会を「国権の最高機関」とする国会中心主義のもと、内閣が国会の信任に基づいて行政を担う議院内閣制、そして独立した裁判所が法律の違憲審査権を持つという三権分立の枠組みを定めた。天皇は「国政に関する権能を有しない」象徴として位置づけられ、旧憲法下の統治体制から大きく転換した。", "keyPoint": "議院内閣制のもとでは国会（特に衆議院）の多数派が内閣を組織するため、大統領制に比べて立法と行政が一体的に機能しやすい一方、国会の信任を失えば内閣不信任という形で行政の責任が問われる仕組みになっている。", "body": [{"label": "議院内閣制", "text": "内閣総理大臣は国会議員の中から国会の議決で指名され、内閣は国会に対して連帯して責任を負う。衆議院で内閣不信任決議が可決されれば、内閣は総辞職するか衆議院を解散して国民の信を問わなければならない。"}, {"label": "違憲審査制", "text": "裁判所は、国会が制定した法律や行政の処分が憲法に違反していないかを審査する違憲審査権を持ち、最高裁判所はその終審裁判所として「憲法の番人」の役割を担うとされるが、実際には違憲判断に慎重な司法消極主義がしばしば指摘される。"}], "relatedTopics": [{"concept": "separation-of-powers", "relation": "具体例"}, {"concept": "pacifism-and-article-nine", "relation": "関連"}], "referencedBy": [{"id": "pacifism-and-article-nine", "title": "平和主義と第九条", "field": "politics"}, {"id": "symbolic-emperor-system", "title": "象徴天皇制", "field": "politics"}]}, {"id": "japonisme", "title": "ジャポニスム", "aka": "Japonisme (Influence of Ukiyo-e on Western Art)", "field": "art", "area": "近代美術（ロマン主義〜印象派）", "section": "", "headline": "浮世絵が西洋絵画に与えた、構図と色彩の衝撃", "summary": "19世紀後半、開国した日本の浮世絵版画が陶磁器の包装紙などを通じてヨーロッパに流入し、画家たちに大きな衝撃を与えた。西洋の伝統的な遠近法や陰影法とは異なる、大胆な構図の切り取り方、平坦な色面、輪郭線を活かした表現は、モネ、ドガ、ゴッホら印象派・後期印象派の画家たちに直接的な影響を与え、西洋美術がそれまでの規範から抜け出す一つのきっかけになった。", "keyPoint": "ジャポニスムは単なる異国趣味ではなく、西洋絵画の構図法そのものを揺さぶった技術的な衝撃だった。", "startYear": 1856, "endYear": 1900, "eraLabel": "ジャポニスム（19世紀後半）", "creator": "葛飾北斎、歌川広重ほか（浮世絵師）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Katsushika_Hokusai_-_The_Great_Wave_off_the_Coast_of_Kanagawa.jpg?width=1000", "imageCredit": "Katsushika Hokusai, 1831年頃, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Katsushika_Hokusai_-_The_Great_Wave_off_the_Coast_of_Kanagawa.jpg", "body": [{"label": "「神奈川沖浪裏」", "text": "巨大な波と富士山を大胆な構図で描いたこの木版画は西洋で最も知られる日本美術作品のひとつとなり、ドビュッシーの音楽やゴッホの模写など、絵画の枠を超えて西洋文化全体に影響を与えた。"}, {"label": "ゴッホの浮世絵模写", "text": "ゴッホは歌川広 ", "field": "religion"}]}, {"id": "kafka-absurdism", "title": "カフカと不条理文学", "aka": "Kafka and Literary Absurdism", "field": "literature", "area": "20世紀〜現代文学", "section": "", "headline": "ある朝目覚めたら虫になっていた——理由なき不条理を描く", "summary": "プラハ出身の作家フランツ・カフカは、『変身』『審判』『城』といった作品で、理由も説明もないまま不条理な状況に投げ込まれた個人の無力感と孤独を、乾いた文体で淡々と描いた。主人公が巨大な虫に変身する『変身』や、理由の分からない罪で起訴される『審判』は、近代官僚制度や個人と社会の疎外関係の寓意として読まれることが多く、「カフカ的（カフカエスク）」という形容詞が「不条理で理不尽な状況」を指す一般語として定着するほどの影響力を持った。", "keyPoint": "カフカは生前ほとんど無名で、死後に友人が遺言に反して原稿を焼却せず出版したことで、その評価が世に知られるようになった——文学史上有数の「死後に発見された天才」。", "startYear": 1912, "endYear": 1924, "eraLabel": "不条理文学の先駆（1912〜1924年執筆）", "creator": "フランツ・カフカ", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Kafka1906_cropped.jpg?width=1000", "imageCredit": "Atelier Jacobi, 1906年（カフカの肖像写真）, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Kafka1906_cropped.jpg", "body": [{"label": "『変身』の衝撃的な冒頭", "text": "「ある朝、グレゴール・ザムザが不安な夢から目覚めると、自分がベッドの中で一匹の巨大な虫に変わっているのに気づいた」という有名な一文から始まるこの中編は、理由の説明を一切与えないまま不条理な事態を淡々と描写する手法の原点とされる。"}, {"label": "「カフカエスク」という形容詞", "text": "個人が巨大で不透明な組織やシステムに翻弄され、理不尽な状況から逃れられない様子を指す「カフカエスク」という言葉は、現代社会の官僚制批判の文脈でも頻繁に使われる一般語になった。"}], "relatedTopics": [{"concept": "modernist-novel-proust-joyce", "relation": "なかま"}, {"concept": "existentialist-literature-camus-sartre", "relation": "源流"}], "referencedBy": [{"id": "existentialist-literature-camus-sartre", "title": "実存主義文学（カミュ・サルトル）", "field": "literature"}, {"id": "modernist-novel-proust-joyce", "title": "モダニズム小説（プルースト・ジョイス）", "field": "literature"}]}, {"id": "kano-school", "title": "狩野派", "aka": "Kano School", "field": "art", "area": "日本美術史", "section": "", "headline": "室町から江戸まで400年、日本画壇を支配した専門絵師集団", "summary": "室町時代後期に興り、江戸幕府の御用絵師として明治時代まで約400年にわたり日本の画壇の主流であり続けた専門絵師の一門。水墨画の技法を基盤にしつつ、金箔地に極彩色で描く豪華絢爛な障壁画（城郭や寺院の襖・屏風絵）を大成し、権力者の威光を視覚化する巨大な様式美を確立した。徒弟制度による技法の継承システムを整え、日本で最も組織化された絵師集団になった。", "keyPoint": "狩野派の成功の鍵は「個人の天才」よりも、様式と技法を組織的に継承する徒弟制度というシステムにあった。", "startYear": 1543, "endYear": 1868, "eraLabel": "室町後期〜江戸時代（16〜19世紀）", "creator": "狩野永徳ほか狩野家歴代当主", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Kano_Eitoku_-_Cypress_Trees.jpg?width=1000", "imageCredit": "狩野永徳, 16世紀（「檜図屏風」）, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Kano_Eitoku_-_Cypress_Trees.jpg", "body": [{"label": "「檜図屏風」", "text": "金地に一本の巨大な檜を大胆に配置した屏風絵。狩野永徳が確立した、権力者の居城にふさわしい豪壮な装飾性（豪華で力強い「大画様式」）を代表する作品。"}, {"label": "城郭・寺院の障壁画", "text": "織田信長の安土城、豊臣秀吉の大坂城などの内部装飾を狩野派が一手に担い、金箔地の豪華な絵画様式が天下人の権威を視覚的に演出する道具として機能した。"}], "relatedTopics": [{"concept": "suiboku-ink-painting", "relation": "源流"}, {"concept": "rinpa-school", "relation": "なかま"}, {"concept": "castle-architecture-japan", "relation": "なかま"}], "referencedBy": [{"id": "castle-architecture-japan", "title": "城郭建築", "field": "architecture"}, {"id": "rinpa-school", "title": "琳派", "field": "art"}, {"id": "ukiyo-e", "title": "浮世絵", "field": "art"}]}, {"id": "kant-critical-philosophy", "title": "カントの批判哲学", "aka": "Kant's Critical Philosophy", "field": "philosophy", "area": "西洋哲学史（近代〜現代）", "headline": "認識は対象に従うのではなく、対象が認識の枠組みに従うという転回", "summary": "カントは、人間の理性がどこまで正しく認識しうるかを吟味する「批判」の哲学を打ち立てた。従来、認識は外にある対象をそのまま写し取ると考えられていたのに対しカントは、人間には生まれつき備わった時間・空間や因果律といった認識の枠組み（カテゴリー）があり、対象はその枠組みを通してしか認識できないとした。これを自らコペルニクス的転回と呼んだ。", "keyPoint": "私たちが認識できるのは物自体ではなく、人間の認識の枠組みを通して構成された「現象」にすぎないという限界づけが、独断論と懐疑論の両方を乗り越える道を開いた。", "body": [{"label": "コペルニクス的転回", "text": "天動説から地動説への転換になぞらえ、「認識が対象に従う」のではなく「対象が認識に従う」と発想を逆転させた。人間の心が持つアプリオリな形式（時間・空間・カテゴリー）を通して初めて経験が成立すると考える。"}, {"label": "物自体と現象", "text": "私たちが認識できるのはあくまで人間の認識能力を通して現れた「現象」であり、その背後にある「物自体」そのものは原理的に認識できないとし、理性が扱える範囲に謙虚な限界を引いた。"}], "relatedTopics": [{"concept": "epistemology-what-is-knowledge", "relation": "関連"}, {"concept": "positive-and-negative-liberty", "relation": "関連"}], "referencedBy": []}, {"id": "kinship-and-family", "title": "家族", "aka": "Family and kinship", "field": "culture-anthropology", "area": "文化人類学の基礎概念", "headline": "「自然な単位」に見える家族も、実は文化によって形が大きく異なる", "summary": "家族や親族は生物学的なつながり（血縁）だけで決まると思われがちだが、文化人類学は、誰を「親族」とみなすか、誰と結婚できるか、子どもをどの集団に属させるかといったルールが社会ごとに大きく異なることを明らかにしてきた。核家族が「自然で普遍的な単位」だという見方自体、近代西洋社会に特有の前提にすぎない可能性がある。", "keyPoint": "「家族の自然な形」というものはなく、家族の形もまた文化的に構築されている。", "body": [{"label": "親族名称のバリエーション", "text": "父方のおじと母方のおじを全く別の言葉で呼び分ける社会もあれば、同じ言葉で呼ぶ社会もあり、親族の分類の仕方自体が文化ごとに違う。"}, {"label": "拡大家族と核家族", "text": "祖父母・おじおば・いとこまでを含む拡大家族を基本単位とする社会も多く、夫婦と子どもだけの核家族は歴史的にも文化的にも一つの形にすぎない。"}], "relatedTopics": [{"concept": "what-is-culture", "relation": "関連"}], "referencedBy": [{"id": "ethnicity", "title": "民族", "field": "culture-anthropology"}, {"id": "filial-piety", "title": "孝（儒教の家族倫理）", "field": "religion"}, {"id": "ie-system-anthropology", "title": "家（イエ）制度の人類学", "field": "culture-anthropology"}, {"id": "nuclear-family-and-extended-family", "title": "核家族化", "field": "sociology"}, {"id": "the-modern-family", "title": "近代家族", "field": "sociology"}]}, {"id": "kula-exchange", "title": "クラ交換", "aka": "Kula Exchange", "field": "culture-anthropology", "area": "経済人類学と交換", "headline": "実用性のない装身具を、儀礼的に環状に贈り合うメラネシアの交換制度", "summary": "クラ交換は、メラネシアのトロブリアンド諸島の島々の間で、赤い貝の首飾りと白い貝の腕輪という実用性の乏しい装身具を、決まった方向へ次々と贈り合う儀礼的な交換制度。人類学者マリノフスキーがフィールドワークによって詳細に記録し、経済人類学の出発点の一つとなった。", "keyPoint": "実用性がなくても、交換という行為そのものが遠く離れた島々の同盟関係と信頼を作り出す――経済を「モノのやり取り」だけで見てはいけない好例。", "body": [{"label": "マリノフスキーの参与観察", "text": "マリノフスキーは長期のフィールドワークでトロブリアンド諸島に住み込み、危険を冒してカヌーで海を渡ってまでクラ交換を行う島民の営みを詳細に記録し、参与観察という人類学の方法を確立した。"}, {"label": "実用的交換との併走", "text": "クラ交換の航海には、儀礼的な装身具の交換とは別に、日用品の実用的な物々交換(ギムワリ)も同時に行われており、儀礼と実用が併存する複合的な交換システムだった。"}], "relatedTopics": [{"concept": "gift-theory-mauss", "relation": "なかま"}, {"concept": "reciprocity", "relation": "具体例"}], "referencedBy": []}, {"id": "language-anthropology", "title": "言語", "aka": "Language (anthropological view)", "field": "culture-anthropology", "area": "文化人類学の基礎概念", "headline": "言語は世界を映す鏡であると同時に、世界の見え方を形づくる型でもある", "summary": "文化人類学や言語人類学は、言語をたんなるコミュニケーションの道具としてだけでなく、その言語を話す人々がどう世界を分類し、経験しているかを映し出すものとして研究する。サピア＝ウォーフの仮説は、話す言語の構造が話者のものの見方や思考の枠組みに影響を与える可能性を提起し、強い形は批判されつつも、言語と認知の関係は今も研究が続く重要な論点である。", "keyPoint": "言葉の違いは単なる音の違いではなく、世界の切り取り方そのものの違いを反映していることがある。", "body": [{"label": "語彙による世界の分節", "text": "ある言語には存在する色や親族関係の区別が、別の言語には存在しないことがあり、言語ごとに世界の「切り分け方」が異なる。"}, {"label": "サピア＝ウォーフ仮説", "text": "言語の構造が思考のあり方を決定するという「強い仮説」は批判されたが、言語が思考に一定の影響を与えるという「弱い仮説」は今も議論の対象。"}], "relatedTopics": [{"concept": "what-is-culture", "relation": "関連"}], "referencedBy": [{"id": "speech-act-theory", "title": "言語行為論", "field": "philosophy"}]}, {"id": "lascaux-cave-paintings", "title": "ラスコー洞窟壁画", "aka": "Lascaux Cave Paintings", "field": "art", "area": "古代〜中世美術", "section": "", "headline": "現生人類最古級の絵画、約1万7000年前の洞窟壁画", "summary": "フランス南西部ラスコー洞窟の壁に描かれた、馬・鹿・野牛など約2000点の動物壁画群。1940年に少年たちが偶然発見した。文字のない旧石器時代に人類がすでに高い観察力と表現技術を持っていたことを示す、人類最古級の「絵画」とされる。狩猟対象の動物を生き生きと描いた目的は儀式的・呪術的なものだったと考えられているが、確定した答えはない。", "keyPoint": "「美術史はここから始まる」というときの、その起点そのもの。文字より先に絵があった。", "startYear": -17000, "endYear": -15000, "eraLabel": "旧石器時代後期（約1万7000年前）", "creator": "不明（クロマニョン人）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Lascaux2.jpg?width=1000", "imageCredit": "Lascaux cave painting, public domain (faithful reproduction of a PD work of art)", "imageLink": "https://commons.wikimedia.org/wiki/File:Lascaux2.jpg", "body": [{"label": "なぜ描かれたのか", "text": "壁画の多くは狩猟の対象となる動物で、実際に狩っていた獲物の比率とは一致しない点から、豊猟祈願や通過儀礼など呪術的・儀式的な意味が込められていたとする説が有力。ただし文字資料がないため確証はなく、諸説が併存する。"}, {"label": "保存の危機と「ラスコーII」", "text": "一般公開後、大勢の見学者が持ち込む二酸化炭素や湿気でカビが発生し壁画が劣化したため、1963年に非公開化。現在は精巧なレプリカ「ラスコーII」などで鑑賞できる。"}], "relatedTopics": [{"concept": "ancient-egyptian-art", "relation": "関連"}], "referencedBy": [{"id": "ancient-egyptian-art", "title": "古代エジプト美術", "field": "art"}]}, {"id": "le-corbusier-five-points", "title": "ル・コルビュジエの近代建築五原則", "aka": "Le Corbusier's Five Points of Architecture", "field": "architecture", "area": "産業革命〜近代建築（モダニズム）", "section": "", "headline": "鉄筋コンクリートが可能にした、住宅設計の5つの新原則", "summary": "鉄筋コンクリート構造の普及により壁が建物を支える必要がなくなったことに着目し、ル・コルビュジエは近代住宅建築の5つの基本原則を提唱した——建物を地上 le": "保守主義", "field": "politics"}, {"id": "democracy", "title": "民主主義", "field": "politics"}, {"id": "fascism", "title": "ファシズム", "field": "politics"}, {"id": "fukuzawa-yukichi-civilization", "title": "福沢諭吉の文明論", "field": "thought"}, {"id": "libertarianism-and-communitarianism", "title": "リバタリアニズムとコミュニタリアニズム", "field": "politics"}, {"id": "positive-and-negative-liberty", "title": "積極的自由と消極的自由", "field": "politics"}, {"id": "socialism", "title": "社会主義", "field": "politics"}]}, {"id": "libertarianism-and-communitarianism", "title": "リバタリアニズムとコミュニタリアニズム", "aka": "Libertarianism and Communitarianism", "field": "politics", "area": "政治哲学史", "headline": "個人の自由を最優先する立場と共同体を重視する立場の対立", "summary": "リバタリアニズムは、他者の権利を侵害しない限り個人の自由な選択(私有財産や自己決定)を最大限尊重すべきだとし、国家の役割を最小限に限定しようとする立場。コミュニタリアニズムは、個人はあらかじめ共同体の伝統や関係性の中に埋め込まれた存在であり、共同体の価値や善を無視した抽象的な個人の権利論には限界があると批判する立場である。", "keyPoint": "「個人をどこまで共同体から切り離して考えられるか」をめぐる対立が両者の中心にある。", "body": [{"label": "最小国家論", "text": "ノージックに代表されるリバタリアニズムは、国家の役割を治安や契約の履行など最小限の機能に限定すべきだとし、再分配を目的とした課税を個人の権利侵害とみなす。"}, {"label": "「負荷なき自己」への批判", "text": "サンデルらコミュニタリアンは、ロールズの正義論が想定する「あらかじめ何にも縛られていない自己」という前提そのものを批判し、人は共同体の物語や関係の中で初めて自己を形成すると論じた。"}], "relatedTopics": [{"concept": "rawls-theory-of-justice", "relation": "批判する"}, {"concept": "liberalism", "relation": "なかま"}], "referencedBy": [{"id": "rawls-theory-of-justice", "title": "正義論(ロールズ)", "field": "politics"}]}, {"id": "linear-perspective-invention", "title": "線遠近法の発明", "aka": "Invention of Linear Perspective (Masaccio, Brunelleschi)", "field": "art", "area": "ルネサンス〜バロック美術", "section": "", "headline": "消失点ひとつで奥行きを作る、絵画の数学的革命", "summary": "15世紀初頭のフィレンツェで、建築家ブルネレスキが発見した「線遠近法」の原理を、画家マサッチオが絵画に応用した。すべての線が画面奥の一点（消失点）に収束するよう幾何学的に計算して描くことで、平面の壁に本物のような奥行き空間を出現させることに初めて成功した。この発明により、絵画は「装飾」から「三次元空間の科学的な記録」へと役割を広げ、ルネサンス美術全体の基礎技法になった。", "keyPoint": "遠近法は美的センスではなく、幾何学の応用として「発明」された技術だった。", "startYear": 1425, "endYear": 1428, "eraLabel": "初期ルネサンス（1425〜1428年）", "creator": "マサッチオ（原理の発見はブルネレスキ）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Masaccio_trinity.jpg?width=1000", "imageCredit": "Masaccio, 1425年頃, フレスコ画, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Masaccio_trinity.jpg", "body": [{"label": "「聖三位一体」の衝撃", "text": "サンタ・マリア・ノヴェッラ聖堂の壁に描かれたこの作品は、平らな壁面の奥にあたかも本物の礼拝堂が実在するかのような錯覚を生み出し、当時の人々を驚かせた。"}, {"label": "ブルネレスキの実験", "text": "建築家ブルネレスキはフィレンツェの洗礼堂を鏡に映して描いた実験的なパネルで、消失点の原理を数学的に実証したとされる。この技法をマサッチオが絵画に持ち込んだ。"}], "relatedTopics": [{"concept": "gothic-art", "relation": "源流"}, {"concept": "high-renaissance-art", "relation": "関連"}, {"concept": "brunelleschi-florence-dome", "relation": "なかま"}], "referencedBy": [{"id": "brunelleschi-florence-dome", "title": "ブルネレスキとフィレンツェ大聖堂ドーム", "field": "architecture"}, {"id": "high-renaissance-art", "title": "盛期ルネサンス美術", "field": "art"}]}, {"id": "linguistic-turn", "title": "言語論的転回", "aka": "Linguistic Turn", "field": "thought", "area": "20世紀の思想", "headline": "哲学の関心が、世界そのものから「言語」の分析へと大きく転換した", "summary": "言語論的転回とは、20世紀の哲学において、意識や存在そのものを直接論じるのではなく、私たちがそれについて語る「言語」の構造や使い方を分析することが哲学の中心的な仕事になった、という大きな方法論的転換を指す。分析哲学から構造主義まで、20世紀思想の広い範囲に及ぶ転換だった。", "keyPoint": "「世界とは何か」を問う前に、まず「世界について語る言葉とは何か」を問うようになった、というのが言語論的転回。", "body": [{"label": "分析哲学における展開", "text": "フレーゲやラッセル、後期ウィトゲンシュタインらは、哲学的な混乱の多くが言語の誤用や不明瞭さから生じると考え、言語の論理的・日常的な用法の分析を哲学の中心課題に据えた。"}, {"label": "構造主義との合流", "text": "言語を実体ではなく差異の体系として捉えるソシュール以降の言語学は、大陸哲学側でも構造主義・ポスト構造主義という形で言語論的転回と合流した。"}], "relatedTopics": [{"concept": "structuralism", "relation": "関連"}, {"concept": "semiotics", "relation": "関連"}], "referencedBy": []}, {"id": "list-of-major-biases", "title": "主なバイアス一覧", "aka": "List of common cognitive biases", "field": "psychology", "area": "心理学の基礎概念", "headline": "判断を歪める代表的な認知バイアスの早見表", "summary": "心理学・行動経済学で繰り返し確認されている代表的な認知バイアスを一覧にしたもの。個々の理論を深追いする前に「どんな種類のズレがあるか」を俯瞰するための早見表として使う。実際の意思決定では複数のバイアスが同時に働くことも多い。", "keyPoint": "バイアスを知っているだけでは免れない（バイアス盲点）が、名前を知っていると気づくきっかけにはなる。", "body": [{"label": "確証バイアス", "text": "自分の考えを支持する情報ばかり集め、反する情報を無視・軽視する傾向。"}, {"label": "アンカリング効果", "text": "最初に提示された数値や情報（アンカー）に、その後の判断が引きずられる傾向。"}, {"label": "代表性ヒューリスティック", "text": "全体の確率よりも「典型的なイメージに似ているか」で判断してしまう傾向。"}, {"label": "利用可能性ヒューリスティック", "text": "思い出しやすい（印象に残っている）事例ほど、実際より頻度が高いと錯覚する傾向。"}, {"label": "後知恵バイアス", "text": "結果を知った後で「最初からそうなると分かっていた」と感じてしまう傾向。"}, {"label": "現状維持バイアス", "text": "変化を避け、今の状態にとどまろうとする傾向。"}, {"label": "サンクコスト効果", "text": "すでに投じて戻らないコストを惜しみ、非合理的に続行・追加投資してしまう傾向。"}, {"label": "ダニング=クルーガー効果", "text": "能力の低い人ほど自分の能力を過大評価しやすい傾向。"}, {"label": "内集団バイアス", "text": "自分が属する集団を、外の集団より好意的・優秀だと評価する傾向。"}, {"label": "自己奉仕バイアス", "text": "成功は自分の能力のおかげ、失敗は外的要因のせいだと解釈する傾向。"}, {"label": "損失回避", "text": "同じ大きさでも、得る喜びより失う痛みの方を強く感じる傾向（プロスペクト理論の核）。"}, {"label": "バイアス盲点", "text": "他人のバイアスには気づきやすいのに、自分自身のバイアスには気づきにくいという、いわば「バイアスについてのバイアス」。"}], "relatedTopics": [{"concept": "cognitive-bias-what-is", "relation": "関連"}, {"concept": "heuristics-and-decision-making", "relation": "関連"}], "referencedBy": [{"id": "cognitive-bias-what-is", "title": "認知バイアスとは何か", "field": "psychology"}, {"id": "heuristics-and-decision-making", "title": "ヒューリスティック", "field": "psychology"}]}, {"id": "logical-fallacies", "title": "論理的誤謬", "aka": "Logical Fallacies", "field": "philosophy", "area": "論理学・言語哲学", "headline": "一見もっともらしいが実は妥当でない推論のパターン集", "summary": "論理的誤謬とは、一見すると説得力があるように見えながら、論理的には妥当でない推論のパターンのこと。人身攻撃(相手の人格を攻撃して主張を退ける)、藁人形論法(相手の主張を歪めて攻撃する)、早まった一般化など、日常の議論や広告、政治的レトリックに頻繁に紛れ込む。", "keyPoint": "主張の内容そのものではなく、推論の「形」に欠陥があるのが論理的誤謬。", "body": [{"label": "藁人形論法", "text": "相手の主張を、実際より極端で攻撃しやすい形に歪めてから反論する誤謬。反論には成功したように見えても、元の主張には反論できていない。"}, {"label": "早まった一般化", "text": "少数の事例だけから「すべて〜だ」という一般的な結論を導いてしまう誤謬。帰納の質が不十分なまま結論を急ぐことで生じる。"}], "relatedTopics": [{"concept": "deduction-and-induction", "relation": "なかま"}, {"concept": "skepticism", "relation": "関連"}], "referencedBy": [{"id": "deduction-and-induction", "title": "演繹と帰納", "field": "philosophy"}]}, {"id": "logical-paradoxes", "title": "論理的パラドックス", "aka": "Logical Paradoxes", "field": "philosophy", "area": "論理学・言語哲学", "headline": "正しく見える前提から矛盾が導かれてしまう論理の難問", "summary": "論理的パラドックスとは、一見正しそうな前提や推論規則から出発しているのに、矛盾した結論に行き着いてしまう議論のこと。「この文は偽である」というウソつきのパラドックスや、「自分自身を要素として含まない集合の集合」を考えるラッセルのパラドックスが代表例で、論理学や数学の基礎そのものを問い直すきっかけになった。", "keyPoint": "パラドックスは単なる「頭の体操」ではなく、論理体系そのものの限界や前提の見直しを迫る。", "body": [{"label": "ウソつきのパラドックス", "text": "「この文は偽である」という文は、真だと仮定すると偽になり、偽だと仮定すると真になってしまい、真偽が確定できない。自己言及が引き起こす典型的なパラドックス。"}, {"label": "ラッセルのパラドックス", "text": "「自分自身を含まないすべての集合」からなる集合を考えると、それが自分自身を含むとしても含まないとしても矛盾が生じる。この発見は素朴集合論の限界を明らかにし、公理的集合論の整備を促した。"}], "relatedTopics": [{"concept": "deduction-and-induction", "relation": "関連"}, {"concept": "skepticism", "relation": "なかま"}], "referencedBy": []}, {"id": "magic-and-science", "title": "呪術と科学", "aka": "Magic and Science", "field": "culture-anthropology", "area": "宗教人類学", "headline": "自然を操作しようとする点で呪術と科学は似ているという視点", "summary": "人類学者フレイザーは『金枝篇』で、呪術は宗教とは異なり、超自然的な存在への祈願ではなく、特定の行為が特定の結果を機械的にもたらすという「因果法則」を前提としている点で、実は科学的思考と発想を共有していると論じた。呪術は誤った自然法則の理解にすぎず、やがて宗教を経て科学に取って代わられるという進化論的な図式を示した。", "keyPoint": "呪術は「非合理」なだけでなく、因果法則を信じて自然を操作しようとする点で科学と発想の型を共有している。", "body": [{"label": "類感呪術と感染呪術", "text": "フレイザーは呪術を、似たものが似た結果を生むという「類感呪術」と、一度触れたものは離れても影響し合うという「感染呪術」に分類し、いずれも一種の(誤った)自然法則の適用だとした。"}, {"label": "進化論的図式への批判", "text": "フレイザーの「呪術→宗教→科学」という単線的な進化図式は、後の人類学者から西洋中心的で単純化しすぎているとの批判を受けたが、呪術的思考を分析する視点そのものは影響を残した。"}], "relatedTopics": [{"concept": "what-is-religion", "relation": "関連"}, {"concept": "secularization", "relation": "関連"}], "referencedBy": [{"id": "yokai-studies", "title": "妖怪学", "field": "culture-anthropology"}]}, {"id": "magic-realism-garcia-marquez", "title": "マジックリアリズム（ガルシア＝マルケス）", "aka": "Magic Realism (García Márquez)", "field": "literature", "area": "20世紀〜現代文学", "section": "", "headline": "空飛ぶ絨毯も幽霊も、当たり前の顔で日常に溶け込む", "summary": "20世紀半ば以降、ラテンアメリカ文学から生まれた潮流で、超自然的・幻想的な出来事を、驚きも説明もなく日常の現実の一部として淡々と描く語りの手法。コロンビアの作家ガブリエル・ガルシア＝マルケスの『百年の孤独』は、ある一族の7世代にわたる興亡を、不眠症の伝染病や空へ舞い上がる美女といった幻想的な出来事を歴史的事実と同じ調子で描き、ラテンアメリカ文学を世界文学の中心舞台に押し上げた金字塔的作品となった。", "keyPoint": "マジックリアリズムの語り手は、超自然的な出来事に驚かない wiki/File:Stonehenge,_UK.jpg", "body": [{"label": "どう運んだのか", "text": "内側の環を成す「ブルーストーン」は約200km離れたウェールズの採石場から運ばれたとする説が有力で、当時の人々の組織力・輸送技術の高さを物語る。"}, {"label": "天文学的な配置", "text": "主軸は夏至の日の出、冬至の日没の方向と一致するように設計されており、単なる墓や記念碑ではなく暦・祭祀装置としての機能を持っていたと考えられている。"}], "relatedTopics": [{"concept": "egyptian-pyramid-architecture", "relation": "関連"}], "referencedBy": [{"id": "egyptian-pyramid-architecture", "title": "古代エジプトのピラミッド建築", "field": "architecture"}]}, {"id": "meiji-western-architecture", "title": "明治の擬洋風建築", "aka": "Meiji-era Western-style Architecture", "field": "architecture", "area": "日本建築史", "section": "", "headline": "西洋建築を見よう見まねで作った、和洋折衷の過渡期様式", "summary": "明治維新後、西洋建築の技術者・様式が本格的に導入される一方、当初は日本の大工が西洋建築の外観を写真や絵から見よう見まねで再現する「擬洋風建築」が全国各地に建てられた。やがて政府はイギリス人建築家ジョサイア・コンドルらを招き、東京駅を設計した辰野金吾のように本格的な西洋建築教育を受けた日本人建築家が育ち、赤煉瓦の洋風建築が近代国家の威信を象徴する建物として各地に建てられるようになった。", "keyPoint": "明治建築は「西洋を模倣する時代」から「西洋建築を自国の建築家が使いこなす時代」へと、わずか数十年で急速に移行した稀有な例。", "startYear": 1868, "endYear": 1914, "eraLabel": "明治時代（19世紀後半〜20世紀初頭）", "creator": "辰野金吾、ジョサイア・コンドル", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Tokyo_Station_(Marunouchi_Building).jpg?width=1000", "imageCredit": "東京駅丸の内駅舎, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Tokyo_Station_(Marunouchi_Building).jpg", "body": [{"label": "東京駅丸の内駅舎", "text": "「日本近代建築の父」とも呼ばれる辰野金吾が設計した赤煉瓦造りの駅舎は、1914年完成。近代国家の玄関口にふさわしい威厳を、西洋建築の様式を消化しきった上で表現した明治建築の到達点とされる。"}, {"label": "お雇い外国人建築家", "text": "明治政府は工部大学校にジョサイア・コンドルら外国人建築家を教師として招聘し、本格的な西洋建築教育を行った。辰野金吾はコンドルの最初期の教え子であり、その後日本建築界を牽引した。"}], "relatedTopics": [{"concept": "nihonga-yoga-debate", "relation": "なかま"}, {"concept": "fukuzawa-yukichi-civilization", "relation": "関連"}], "referencedBy": [{"id": "modern-japanese-literature-birth", "title": "近代文学の誕生（夏目漱石・森鴎外）", "field": "literature"}]}, {"id": "metaethics", "title": "メタ倫理学", "aka": "Metaethics", "field": "philosophy", "area": "倫理学", "headline": "「善い」とはそもそも何を意味するのかを問う一段上の倫理学", "summary": "メタ倫理学は、「何をすべきか」という規範的な問いそのものではなく、「道徳的な言葉や判断はそもそも何を意味し、どんな性質を持つのか」を問う倫理学の一分野。「善い」という言葉は客観的事実を指すのか、それとも単なる感情の表現に過ぎないのかといった問いを扱う。", "keyPoint": "規範倫理学が「何が善いか」を問うのに対し、メタ倫理学は「『善い』とは何を意味するか」を問う一段上の視点。", "body": [{"label": "道徳実在論と反実在論", "text": "道徳的な善悪が人間の認識とは独立に客観的に存在するとする道徳実在論と、道徳は感情の表明や社会的な取り決めに過ぎないとする反実在論(情動主義など)が対立する。"}, {"label": "自然主義的誤謬", "text": "ムーアは、「善い」を快楽や欲求充足のような自然的性質に還元して定義しようとする試みを「自然主義的誤謬」と呼び批判した。"}], "relatedTopics": [{"concept": "moral-relativism", "relation": "関連"}, {"concept": "epistemology-what-is-knowledge", "relation": "関連"}], "referencedBy": [{"id": "moral-relativism", "title": "道徳的相対主義", "field": "philosophy"}]}, {"id": "mind-body-problem", "title": "心身問題", "aka": "Mind-body problem", "field": "philosophy", "area": "哲学の基本問題", "headline": "心と体はどう関係しているのかという難問", "summary": "痛みや喜びのような主観的な心の状態（クオリア）と、脳の中の物理的な神経活動は、どのような関係にあるのか。両者は別種の実体だとする二元論（デカルト）、心は物理的なものに還元できるとする物理主義、両者は一つの実体の異なる側面だとする一元論など、決定打のない論争が続いている。", "keyPoint": "「脳がすべてを説明できるか」という問いは、AIや意識の科学とも直結する現在進行形の哲学問題。", "body": [{"label": "デカルトの二元論", "text": "心（思考する実体）と体（延長を持つ実体）はまったく別の種類のものだと考え、両者がどう相互作用するかという「相互作用問題」を残した。"}, {"label": "クオリアと物理主義", "text": "脳の状態を完全に記述しても、「赤を見る感じ」そのもの（クオリア）は説明し尽くせないのではないか、という反論が物理主義に向けられる。"}], "relatedTopics": [{"concept": "free-will-and-determinism", "relation": "関連"}, {"concept": "ontology-what-is-being", "relation": "関連"}], "referencedBy": [{"id": "consciousness-and-unconscious", "title": "意識と無意識", "field": "psychology"}, {"id": "descartes-cogito", "title": "デカルトのコギト", "field": "philosophy"}, {"id": "free-will-and-determinism", "title": "自由意志と決定論", "field": "philosophy"}, {"id": "private-language-argument", "title": "私的言語論", "field": "philosophy"}, {"id": "psychology-major-approaches", "title": "心の主要アプローチ（学派）", "field": "psychology"}, {"id": "radical-empiricism-james", "title": "徹底的経験論", "field": "thought"}, {"id": "what-is-psychology", "title": "心理学とは何か", "field": "psychology"}]}, {"id": "modern-japanese-literature-birth", "title": "近代文学の誕生（夏目漱石・森鴎外）", "aka": "The Birth of Modern Japanese Literature (Natsume Sōseki, Mori Ōgai)", "field": "literature", "area": "日本文学史", "section": "", "headline": "西洋の「小説」概念を輸入し、日本語で個人の内面を描く", "summary": "明治維新後、西洋文学の「小説（ノベル）」という概念とリアリズムの手法が本格的に導入され、日本文学は大きな転換点を迎えた。夏目漱石はイギリス留学の経験を踏まえ、近代的自我の孤独や知識人の葛藤を、時にユーモアを交えながら描く独自の文体を確立した。森鴎外は軍医・官僚という要職を務めながら、ドイツ留学経験を活かした知的で格調高い文体で近代人の理性と情熱の相克を描き、二人はともに日本近代文学の礎を築いた双璧とされる。", "keyPoint": "「言文一致体」（話し言葉に近い文体で書く運動）の確立とともに、日本語で個人の内面を精密に描写するという近代小説の基盤が、この時期にようやく整った。", "startYear": 1900, "endYear": 1916, "eraLabel": "明治〜大正時代（20世紀初頭）", "creator": "夏目漱石、森鴎外", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Natsume_Soseki_photo.jpg?width=1000", "imageCredit": "夏目漱石の肖像写真, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Natsume_Soseki_photo.jpg", "body": [{"label": "『こころ』の孤独", "text": "漱石晩年の代表作は、親友を裏切った過去の罪の意識に苛まれ続ける「先生」という人物を通じて、近代的な個人主義がもたらす孤独と倫理的な葛藤を深く掘り下げた。"}, {"label": "言文一致体の確立", "text": "それまでの文語体に代わり、話し言葉に近い文体で小説を書く「言文一致体」運動が明治期に進み、二葉亭四迷らの先駆的な試みを経て、漱石・鴎外の時代にはほぼ現代日本語の文体の基盤が完成していた。"}], "relatedTopics": [{"concept": "nihonga-yoga-debate", "relation": "なかま"}, {"concept": "meiji-western-architecture", "relation": "関連"}], "referencedBy": [{"id": "postwar-japanese-literature", "title": "戦後文学", "field": "literature"}]}, {"id": "modernist-novel-proust-joyce", "title": "モダニズム小説（プルースト・ジョイス）", "aka": "Modernist Novel (Proust, Joyce)", "field": "literature", "area": "20世紀〜現代文学", "section": "", "headline": "筋書きより「意識の流れ」、小説の形式そのものを解体する", "summary": "20世紀初頭、それまでの小説が前提としてきた明快な筋立てと時系列に沿った語りを大胆に解体する実験的な小説群が登場した。プルーストは『失われた時を求めて』で、一口の菓子から無意識に呼び覚まされる過去の記憶（無意志的記憶）を起点に、時間と記憶そのものを主題にした長大な内省を展開した。ジョイスは『ユリシーズ』で、ダブリンのある一日を、登場人物の頭の中を流れる思考をそのまま文字化する「意識の流れ」という手法で描き切り、小説の文体・構造の可能性を根底から広げた。", "keyPoint": "『ユリシーズ』の一日という短い時間に膨大なページ数を費やす構成は、「何が起きたか」より「どう体験されたか」を描くことこそが小説の本質だという、モダニズム文学の宣言そのものだった。", "startYear": 1913, "endYear": 1927, "eraLabel": "モダニズム文学（1913〜1927年）", "creator": "マルセル・プルースト、ジェイムズ・ジョイス", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Marcel_Proust_1895.jpg?width=1000", "imageCredit": "Otto Wegener, 1895年（プルーストの肖像写真）, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Marcel_Proust_1895.jpg", "body": [{"label": "「無意志的記憶」", "text": "紅茶に浸したマドレーヌの味から幼少期の記憶が鮮やかに蘇る場面は、意図的な想起ではなく感覚的な刺激から不意に呼び覚まされる記憶のあり方を描いた、文学史上もっとも有名な場面の一つ。"}, {"label": "「意識の流れ」という文体", "text": "文法的な整合性や論理的な順序を無視し、登場人物の頭の中に浮かぶ思考・感覚・記憶の断片をそのまま連ねていく手法は、心理学の「意識の流れ」概念を文学表現に応用したもので、以後の実験小説に大きな影響を与えた。"}], "relatedTopics": [{"concept": "symbolist-poetry", "relation": "源流"}, {"concept": "kafka-absurdism", "relation": "なかま"}, {"concept": "consciousness-and-unconscious", "relation": "関連"}], "referencedBy": [{"id": "kafka-absurdism", "title": "カフカと不条理文学", "field": "literature"}]}, {"id": "moliere-comedy", "title": "モリエールの喜劇", "aka": "Molière's Comedies", "field": "literature", "area": "ルネサンス〜啓蒙時代の文学", "section": "", "headline": "笑いを武器に、偽善と人間の愚かさを容赦なく暴く", "summary": "フランス古典主義演劇を代表する劇作家モリエールは、貴族や聖職者、成金といった当時の社会階層の偽善・強欲・見栄をコメディの形式で痛烈に風刺した。『タルチュフ』では信心深さを装う偽善者を、『守銭奴』では強欲に取り憑かれた老人を描き、単なる笑いのための喜劇にとどまらず、人間性の普遍的な弱点を鋭く抉り出す社会批評としての機能を喜劇というジャンルに持たせた。", "keyPoint": "モリエールの喜劇はしばしば当時の権力者を刺激し、『タルチュフ』は聖職者の反発で一時上演禁止処分を受けるなど、笑いが社会批判として本気で恐れられた稀有な例。", "startYear": 1660, "endYear": 1673, "eraLabel": "フランス古典主義演劇（17世紀後半）", "creator": "モリエール", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Jean-Baptiste_Poquelin_dit_Moli%C3%A8re.jpg?width=1000", "imageCredit": "モリエールの肖像, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Jean-Baptiste_Poquelin_dit_Moli%C3%A8re.jpg", "body": [{"label": "『タルチュフ』の上演禁止", "text": "信仰を装って裕福な家庭に取り入る偽善者タルチュフを描いたこの作品は、聖職者団体の強い反発を受けて上演禁止となり、モリエールは国王ルイ14世の庇護を得て何度も改訂の末にようやく公演にこぎつけた。"}, {"label": "喜劇と悲劇の地位", "text": "当時の演劇界では悲劇が高尚なジャンル、喜劇は低俗なジャンルとみなされがちだったが、モリエールは喜劇にも深い人間観察と社会批評を持ち込み、そのジャンルの地位そのものを引き上げた。"}], "relatedTopics": [{"concept": "enlightenment-satire-voltaire", "relation": "関連"}, {"concept": "greek-tragedy", "relation": "対立する"}], "referencedBy": [{"id": "enlightenment-satire-voltaire", "title": "啓蒙思想を映す風刺文 個人によって異なり、唯一の基準はないとする立場", "summary": "道徳的相対主義は、何が正しく何が悪いかという道徳的基準は、普遍的・絶対的なものではなく、文化・社会・時代・個人によって異なるとする立場。異なる社会の慣習を自分たちの基準だけで裁くことに慎重であるべきだと説く一方、「何でも許される」という相対主義への批判も根強い。", "keyPoint": "「正しさは一つ」ではなく「正しさは立場によって異なる」と考えるのが道徳的相対主義。", "body": [{"label": "文化相対主義との関係", "text": "文化人類学における文化相対主義(異文化を自文化の基準で評価しない態度)が、道徳の領域に適用されたものが道徳的相対主義に近い。"}, {"label": "批判：普遍的人権との緊張", "text": "道徳的相対主義を徹底すると、他文化の慣習(たとえば人権侵害)を「その文化の価値観だから」と批判できなくなるという問題が指摘される。"}], "relatedTopics": [{"concept": "cultural-relativism", "relation": "なかま"}, {"concept": "metaethics", "relation": "関連"}], "referencedBy": [{"id": "dao-and-wuwei", "title": "道と無為自然（老荘思想）", "field": "religion"}, {"id": "metaethics", "title": "メタ倫理学", "field": "philosophy"}, {"id": "nietzsche-eternal-recurrence", "title": "ニーチェの永劫回帰と超人", "field": "philosophy"}]}, {"id": "motoori-norinaga-kokugaku", "title": "本居宣長の国学", "aka": "Motoori Norinaga's Kokugaku", "field": "thought", "area": "日本思想史", "headline": "儒教・仏教が入る前の日本古来の心情「もののあはれ」を古典に見出す学問", "summary": "本居宣長は、中国から伝わった儒教や仏教の理論的な「漢意（からごころ）」によって覆われる以前の、日本人固有の自然な感情のあり方を、『源氏物語』や『古事記』などの古典を実証的に読み解くことで明らかにしようとした国学の大成者。物事に触れて心が動かされる自然な情感を「もののあはれ」と呼び、これを理解し表現することこそ文学の本質であるとした。", "keyPoint": "宣長は道徳的な教訓を文学に読み込もうとする儒教的な解釈を退け、善悪の判断を離れた「もののあはれ」を知ることそのものに価値を置いた。", "body": [{"label": "漢意批判", "text": "宣長は、理性や道徳で物事を割り切ろうとする中国由来の思考様式（漢意）を、日本古来のありのままの心情を見えなくしてしまうものとして批判し、古典に立ち返ることで漢意以前の日本人の心（真心）を取り戻そうとした。"}, {"label": "『古事記伝』", "text": "宣長は生涯をかけて『古事記』を注釈した『古事記伝』を著し、それまで漢文的な解釈に埋もれていた『古事記』の言葉を文献学的に読み解き、日本の神話や古代の精神を再発見しようとした。"}], "relatedTopics": [{"concept": "shinto-kami-and-yaoyorozu", "relation": "関連"}], "referencedBy": [{"id": "genji-monogatari", "title": "『源氏物語』", "field": "literature"}]}, {"id": "myth", "title": "神話", "aka": "Myth", "field": "culture-anthropology", "area": "文化人類学の基礎概念", "headline": "世界や人間の起源を語る、共同体の根本の物語", "summary": "神話とは、世界・人間・社会の秩序がどのように始まったかを語る、共同体にとって根本的な意味を持つ物語。単なる作り話ではなく、その社会が世界をどう理解し、どんな秩序や価値観を正当なものと見なすかを支える機能を持つ。人類学者レヴィ＝ストロースは、一見バラバラに見える世界各地の神話に共通する二項対立の構造（生と死、自然と文化など）を見出した。", "ke le": "ロシア文学（ドストエフスキー・トルストイ）", "field": "literature"}, {"id": "symbolist-poetry", "title": "象徴主義詩（ボードレール）", "field": "literature"}]}, {"id": "neo-confucianism", "title": "朱子学（宋明理学）", "aka": "Neo-Confucianism", "field": "religion", "area": "儒教・道教・神道", "headline": "儒教に宇宙論と修養論を組み込み、体系的な哲学として再構築した思想", "summary": "朱子学（宋学）は、宋代の朱熹が、それまでの儒教の実践的な倫理説に、万物の根本原理である「理」とその物質的な現れである「気」からなる壮大な宇宙論、および理を窮めて自らの本性を実現する修養論（格物致知）を組み込んで体系化した新しい儒教。江戸幕府の官学として採用され、日本の思想・教育制度にも大きな影響を与えた。", "keyPoint": "「理気二元論」によって、人間の道徳的本性（性即理）と宇宙の秩序を同じ「理」によって統一的に説明しようとした点が最大の特徴。", "body": [{"label": "理気二元論", "text": "あらゆる事物は、その存在根拠であり道徳的な当為でもある「理」と、それが具体的な形をとって現れる素材である「気」の2つの要素からなるとし、人間の本性もまた理そのもの（性即理）であるとした。"}, {"label": "格物致知", "text": "『大学』に由来するこの言葉を、朱熹は個々の事物に内在する理を一つひとつ窮め尽くしていくことで、最終的に自らの心の理（本性）を明らかにするという修養の方法として体系的に解釈した。"}], "relatedTopics": [{"concept": "ren-and-li-confucianism", "relation": "源流"}], "referencedBy": [{"id": "ren-and-li-confucianism", "title": "仁と礼（儒教の中心概念）", "field": "religion"}]}, {"id": "neoclassical-architecture-18c", "title": "18世紀新古典主義建築", "aka": "18th-Century Neoclassical Architecture", "field": "architecture", "area": "ルネサンス〜近世建築", "section": "", "headline": "ロココの過剰装飾への反動、古代への回帰で理性の時代を象徴する", "summary": "18世紀後半、ロココの華美な装飾への反動と、ポンペイなど古代遺跡の発掘ブームが重なり、古代ギリシア・ローマの様式に忠実に回帰しようとする新古典主義建築が広まった。啓蒙思想の理性重視の精神とも呼応し、装飾を控えた明快な柱と幾何学的な量感を特徴とする。パリのパンテオン（元は教会として建設）はこの様式を代表する建物で、革命後は偉人を祀る霊廟に転用されるなど、政治的な意味も帯びるようになった。", "keyPoint": "新古典主義建築の「装飾を削ぎ落とした理性的な古典」は、啓蒙思想が建築の姿として結晶した様式だった。", "startYear": 1755, "endYear": 1830, "eraLabel": "新古典主義建築（18世紀後半〜19世紀初頭）", "creator": "ジャック＝ジェルマン・スフロ（パリのパンテオン）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Pantheon_-_Paris.jpg?width=1000", "imageCredit": "パリのパンテオン, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Pantheon_-_Paris.jpg", "body": [{"label": "パリのパンテオン", "text": "もとは聖ジュヌヴィエーヴ教会として建設されたが、フランス革命後に世俗化され、ヴォルテールやルソーら啓蒙思想家の遺骸を祀る国立の霊廟に転用された。建築様式そのものが宗教から世俗理性への時代転換を体現している。"}, {"label": "考古学的発掘の影響", "text": "18世紀に本格化したポンペイ・ヘル : "この生をそのまま何度でも繰り返したいと肯定できるかを問う思想実験", "summary": "ニーチェは「永劫回帰」という思考実験——この人生の一瞬一瞬をまったく同じ形で無限に繰り返すとしたら、あなたはそれに耐えられるかという問い——を通じて、人生を全面的に肯定する態度を求めた。既存の道徳やキリスト教的価値観（弱者のルサンチマンに由来するとされる）を乗り越え、自ら新しい価値を創造して生きる理想像を「超人（ユーバーメンシュ）」と呼んだ。", "keyPoint": "「神は死んだ」という宣言は、絶対的な価値の基盤が失われた時代に、人間が自ら価値を創造する責任を負うことを意味した。", "body": [{"label": "ルサンチマン", "text": "ニーチェは既存のキリスト教道徳を、強者への嫉妬や怨恨（ルサンチマン）から弱者が自分たちの弱さを「善」、強者の力強さを「悪」と価値転倒させたものだと批判し、そうした受動的な道徳から脱却することを説いた。"}, {"label": "力への意志", "text": "生きとし生けるものの根底には、単なる自己保存ではなく、自らを高め拡大しようとする「力への意志」があるとし、超人とはこの力への意志を肯定的に発揮し、既存の価値を超えて自ら新しい価値を創造する存在とされる。"}], "relatedTopics": [{"concept": "existentialism", "relation": "源流"}, {"concept": "moral-relativism", "relation": "関連"}], "referencedBy": []}, {"id": "nihonga-yoga-debate", "title": "日本画と洋画の論争", "aka": "Nihonga vs. Yōga Debate (Meiji Era)", "field": "art", "area": "日本美術史", "section": "", "headline": "明治維新後、「日本の絵とは何か」を問い直した論争", "summary": "明治維新後、西洋の油彩画（洋画）が本格的に流入すると、伝統的な日本の絵画技法（日本画）をどう位置づけるかが大きな論争になった。西洋人フェノロサが日本の伝統絵画の価値を再評価し「日本画」という概念自体を打ち立てる一方、黒田清輝ら洋画家は西洋のアカデミックな写実技法をそのまま導入し、日本の近代美術は「日本画」と「洋画」という2つの流れが並走・対抗しながら展開する独特の構造を持つことになった。", "keyPoint": "「日本画」という言葉自体が、西洋画の流入に対抗して明治になって初めて作られた新しい概念だった——それ以前は単に「絵」だった。", "startYear": 1868, "endYear": 1912, "eraLabel": "明治時代（19世紀後半〜20世紀初頭）", "creator": "黒田清輝（洋画）、フェノロサ・岡倉天心（日本画の再評価）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Woman_Reading_(Kuroda_Seiki).jpg?width=1000", "imageCredit": "黒田清輝, 明治期, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Woman_Reading_(Kuroda_Seiki).jpg", "body": [{"label": "フェノロサと岡倉天心", "text": "来日したアメリカ人研究者フェノロサは、西洋化の波の中で軽視されつつあった日本の伝統絵画の価値を再評価し、弟子の岡倉天心とともに東京美術学校を設立するなど、日本画の地位を制度的に確立する運動を主導した。"}, {"label": "黒田清輝と洋画の確立", "text": "フランスに留学し外光派（印象派に近い明るい色調の写実）を学んだ黒田清輝は、帰国後、日本に西洋式の油彩画の教育制度を根づかせ、洋画を日本の近代美術の正式な一分野として確立した。"}], "relatedTopics": [{"concept": "ukiyo-e", "relation": "関連"}, {"concept": "impressionism", "relation": "関連"}, {"concept": "fukuzawa-yukichi-civilization", "relation": "関連"}], "referencedBy": [{"id": "meiji-western-architecture", "title": "明治の擬洋風建築", "field": "architecture"}, {"id": "modern-japanese-literature-birth", "title": "近代文学の誕生（夏目漱石・森鴎外）", "field": "literature"}]}, {"id": "nirvana", "title": "涅槃", "aka": "Nirvana", "field": "religion", "area": "仏教", "headline": "煩悩の炎が吹き消され、苦しみが完全に滅した安らぎの境地", "summary": "涅槃（ニルヴァーナ）とは、元来「（炎が）吹き消された状態」を意味し、渇愛や執着といった煩悩の炎が消え去り、苦しみの輪廻から解放された究極の安らぎの境地を指す仏教の理想。生きているうちに煩悩が消えた状態を「有余涅槃」、肉体の死によって一切の残りが消える状態を「無余涅槃」と区別することもある。", "keyPoint": "涅槃は死後に得られる別世界のような場所ではなく、煩悩が消えた「心の状態」として理解される点が、他宗教の天国のイメージと異なる。", "body": [{"label": "三法印の涅槃寂静", "text": "諸行無常・諸法無我と並ぶ仏教の三つの根本的な特徴づけ（三法印）の一つが「涅槃寂静」であり、涅槃こそがあらゆる苦しみを離れた真に静かな境地であるとされる。"}, {"label": "有余涅槃と無余涅槃", "text": "ブッダ自身は悟りを開いた時点で煩悩を滅したが肉体はなお存続しており、これを「有余涅槃」と呼び、80歳で入滅した際に肉体の制約からも完全に解放された状態を「無余涅槃（般涅槃）」と呼んで区別する。"}], "relatedTopics": [{"concept": "four-noble-truths-eightfold-path", "relation": "関連"}, {"concept": "soteriology", "relation": "なかま"}], "referencedBy": [{"id": "four-noble-truths-eightfold-path", "title": "四諦八正道", "field": "religion"}]}, {"id": "nishida-kyoto-school", "title": "西田幾多郎の京都学派", "aka": "Nishida Kitarō and the Kyoto School", "field": "thought", "area": "日本思想史", "headline": "主観と客観に分かれる前の純粋な経験を根本原理とする独自の哲学", "summary": "西田幾多郎は、西洋哲学の主観・客観という二分法が成立する以前の、いまだ主客未分の直接的な経験のあり方を「純粋経験」と呼び、これをあらゆる実在の根本に置く独自の哲学体系を築いた。後年はさらに、対立し矛盾するものがそのまま同一であるとする「絶対矛盾的自己同一」や、あらゆる有・無を包み込む究極の場としての「無の場所」といった概念を展開し、西洋哲学と東洋（禅）の思想を融合させようとした。", "keyPoint": "西田を中心に京都大学に集った哲学者たちは「京都学派」と呼ばれ、西洋哲学の概念装置を用いながら東洋的な直観や禅の思想を体系的に哲学化しようとした点で、日本発の独自の哲学として国際的にも評価されている。", "body": [{"label": "純粋経験", "text": "西田は主著『善の研究』で、「花を見て美しいと感じる」ような、まだ「私が花を見ている」という主客の分裂が生じる前の直接的な経験を「純粋経験」と呼び、これこそが最も根源的な実在のあり方であるとした。"}, {"label": "無の場所", "text": "後期の西田は、あらゆる存在（有）とその欠如（無）の両方をそこにおいて成り立たせる、いわば究極の背景としての「無の場所」という概念を提示し、西洋哲学の「実体」中心の存在論とは異なる、東洋的な「場」の論理を打ち出した。"}], "relatedTopics": [{"concept": "husserl-phenomenology", "relation": "関連"}, {"concept": "zen-buddhism", "relation": "関連"}], "referencedBy": [{"id": "zen-buddhism", "title": "禅（禅 opics": [{"concept": "the-modern-family", "relation": "具体例"}, {"concept": "kinship-and-family", "relation": "関連"}], "referencedBy": [{"id": "the-modern-family", "title": "近代家族", "field": "sociology"}]}, {"id": "oligarchy", "title": "寡頭制", "aka": "Oligarchy", "field": "politics", "area": "政治体制とイデオロギー", "headline": "少数の富裕層・有力者が私的な利益のために支配する体制", "summary": "寡頭制とは、少数の富裕層や有力者の集団が、公共の利益ではなく自分たちの利益のために国家権力を握る政治体制。アリストテレスの分類では貴族政の堕落形態とされる。現代の政治学でも、形式上は民主政や共和政であっても、実質的に一部のエリート層が政治・経済を支配している状態を指して用いられる。", "keyPoint": "「誰が統治するか」だけでなく「誰の利益のために統治するか」が寡頭制を貴族政と分ける基準。", "body": [{"label": "現代の寡頭制論", "text": "20世紀の政治学では、形式的には選挙制度を備えた国家でも、実質的な意思決定が少数の富裕層・特権階級によってなされている状態を「寡頭制」と呼ぶ用法が広がった。"}, {"label": "権威主義との重なり", "text": "少数の権力者集団が制度を私物化する点で、寡頭制は権威主義体制としばしば重なり合う。"}], "relatedTopics": [{"concept": "aristocracy", "relation": "対立する"}, {"concept": "authoritarianism", "relation": "なかま"}, {"concept": "social-stratification", "relation": "関連"}], "referencedBy": [{"id": "aristocracy", "title": "貴族政", "field": "politics"}]}, {"id": "ontology-what-is-being", "title": "存在論とは何か", "aka": "Ontology", "field": "philosophy", "area": "哲学の基本問題", "headline": "「そもそも何が存在するのか」を問う哲学", "summary": "存在論は、机や心や数字や神といった「あるとされるもの」が本当に存在するのか、存在するとはどういうことかを問う哲学の一分野。物理的なモノだけでなく、性質・関係・可能性・集合のような抽象的なものまで、何を「実在する」と認めるかは立場によって大きく分かれる。", "keyPoint": "「何があるか」を数え上げる前に、「あるとはどういうことか」を問うのが存在論。", "body": [{"label": "存在するとは何か", "text": "「机がある」と「正義がある」では“ある”の意味が違って見える。存在論はこの“ある”の一義性・多義性そのものを問う。"}, {"label": "具体的個物と抽象的存在者", "text": "目の前の机（個物）と、数字の「3」（抽象的対象）は同じ意味で存在するのか、という問いが普遍論争へつながる。"}], "relatedTopics": [{"concept": "epistemology-what-is-knowledge", "relation": "関連"}, {"concept": "problem-of-universals", "relation": "なかま"}], "referencedBy": [{"id": "epistemology-what-is-knowledge", "title": "認識論とは何か", "field": "philosophy"}, {"id": "mind-body-problem", "title": "心身問題", "field": "philosophy"}, {"id": "platos-theory-of-forms", "title": "プラトンのイデア論", "field": "philosophy"}, {"id": "problem-of-universals", "title": "普遍論争", "field": "philosophy"}]}, {"id": "orientalism-said", "title": "オリエンタリズム（サイード）", "aka": "Orientalism (Said)", "field": "thought", "area": "フェミニズムとポストコロニアル思想", "headline": "西洋が「東洋」を神秘的で劣った他者として作り上げてきた知の権力構造", "summary": "エドワード・サイードが著書『オリエンタリズム』で提示した概念で、西洋の学問・文学・芸術が「東洋（オリエント）」を、理性的で進歩的な西洋とは対照的な、神秘的・停滞的・非合理的な「他者」として一方的に表象し、その知の体系そのものが植民地支配を正当化する権力の道具として機能してきたと論じた。単なる偏見ではなく、学問という「客観的」な形式をまとった支配の構造を批判した点が画期的だった。", "keyPoint": "オリエンタリズムは、西洋が東洋について「語る」立場を独占し、東洋自身が自らを語る声を奪ってきたという、知識と権力の結びつきを鋭く問い直した。", "body": [{"label": "知と権力の結びつき", "text": "サイードはフーコーの権力論を援用し、西洋の東洋学（オリエンタリズム）という一見中立な学問分野が、実際には東洋を支配し管理しやすい対象として構築する権力の実践だったと論じた。"}, {"label": "ポストコロニアル研究への影響", "text": "この著作は、文学・歴史学・人類学など幅広い分野で、西洋中心的な知の枠組みそのものを批判的に検証するポストコロニアル研究という新しい学問領域を切り開く出発点となった。"}], "relatedTopics": [{"concept": "postcolonialism", "relation": "源流"}, {"concept": "subaltern-spivak", "relation": "なかま"}], "referencedBy": [{"id": "postcolonialism", "title": "ポストコロニアリズム", "field": "thought"}, {"id": "subaltern-spivak", "title": "サバルタン（スピヴァク）", "field": "thought"}]}, {"id": "original-sin", "title": "原罪", "aka": "Original Sin", "field": "religion", "area": "キリスト教", "headline": "アダムとエバの罪を全人類が生まれながらに受け継ぐという教義", "summary": "原罪とは、旧約聖書でアダムとエバが禁断の果実を食べて神に背いた罪を、その子孫である全人類が生まれながらに受け継いでいるとするキリスト教の教義。人間は自力では罪から逃れられず、イエス・キリストの贖いによってのみ救われるという救済論の前提になっている。", "keyPoint": "「人は生まれつき罪を背負っている」という前提が、キリスト教の救済の物語全体を支えている。", "body": [{"label": "アウグスティヌスによる体系化", "text": "原罪の教義は、初期にはさまざまな理解があったが、アウグスティヌスが人間の意志の根源的な堕落として体系化し、西方教会の標準的な理解となった。"}, {"label": "救済論との結びつき", "text": "原罪ゆえに人間は自力で救われえないという前提があるからこそ、キリストの贖罪(身代わりの死)による救済が必要になる、という論理構造になっている。"}], "relatedTopics": [{"concept": "soteriology", "relation": "関連"}, {"concept": "trinity", "relation": "関連"}], "referencedBy": [{"id": "augustine-grace-and-free-will", "title": "アウグスティヌスの恩寵論", "field": "philosophy"}]}, {"id": "orikuchi-marebito-theory", "title": "折口信夫のまれびと論", "aka": "Orikuchi Shinobu's Marebito Theory", "field": "culture-anthropology", "area": "日本文化人類学とフィールドワーク", "headline": "異界から定期的に来訪する神が、共同体に祝福をもたらすという民俗宗教理解", "summary": "折口信夫は、日本各地の祭礼や来訪神信仰（秋田のナマハゲなど）を研究し、日本の神々のもともとの姿は、常世（異界）から定期的に人間の共同体を訪れ、祝福や豊穣をもたらしてまた去っていく来訪神＝「まれびと（客人）」であったとする独自の説を提唱した。柳田国男の常民に根ざした民俗学に対し、折口は神話・芸能・宗教的な儀礼のより深層的な構造の解明に関心を向けた。", "keyPoint": "まれびと論は、日本の芸能（田楽・能などの起源）や祭りの構造を、共同体の外から訪れる神聖な存在との交流という枠組みで統一的に理解しようとする、折口独自の壮大な仮説だった。", "body": [{"label": "来訪神信仰の事例", "text": "秋田のナマハゲや沖縄のアカマタ・クロマタのように、仮面をつけた者が異形の神に扮して家々を訪れ、祝福や戒めを与えて去っていく行事は、折口が「まれびと」の生きた実例として重視した来訪神信仰の代表的な事例とされる。"}, {"label": "芸能の起源論への応用", "text": "折口は、能や田楽といった日本の伝統芸能の起源も、もともとはまれびと（神）が人間の前に姿を現し語りかける宗教的な儀礼から発展したものだと考え、芸能史と宗教民俗学を横断する独自の理論を展開した。"}], "relatedTopics": [{"concept": "yanagita-kunio-folklore", "relation": "なかま"}, {"concept": "ritual", "relation": "関連"}], "referencedBy": [{"id": "yanagita-kunio-folklore", "title": "柳田国男の民俗学", "field": "culture-anthropology"}]}, {"id": "pacifism-and-article-nine", "title": "平和主義と第九条", "aka": "Pacifism and Article 9", "field": "politics", "area": "日本政治", "headline": "戦争放棄と戦力不保持を定めた日本国憲法の平和主義原則", "summary": "日本国憲法第9条は、国際紛争を解決する手段としての戦争と武力による威嚇・行使を永久に放棄し、そのための陸海空軍その他の戦力を保持しないと定め、日本国憲法の三大原則の一つ「平和主義」を具体化したものとされる。一方で自衛のための必要最小限度の実力組織として自衛隊が設けられており、第9条の解釈と自衛隊の存在・活動範囲（集団的自衛権を含む）をめぐる憲法解釈上の論争が戦後一貫して続いてきた。", "keyPoint": "「戦力を保持しない」という条文の文言と、実際に存在する自衛隊という組織の間の緊張関係が、日本の安全保障政策をめぐる憲法論議の中心的な争点であり続けている。", "body": [{"label": "自衛隊をめぐる解釈", "text": "政府は一貫して、自衛のための必要最小限度の実力組織である自衛隊は憲法が禁じる「戦力」にあたらないという立場をとってきたが、この解釈の是非をめぐっては学界・世論を二分する論争が続いている。"}, {"label": "集団的自衛権をめぐる議論", "text": "2014年、政府は従来「保有するが行使できない」としてきた集団的自衛権について、一定の要件のもとで行使を認める閣議決定を行い、2015年の安全保障関連法の成立につながったが、この解釈変更の妥当性をめぐって激しい議論が起きた。"}], "relatedTopics": [{"concept": "japanese-constitution-government-structure", "relation": "関連"}], "referencedBy": [{"id": "japanese-constitution-government-structure", "title": "日本国憲法の統治機構", "field": "politics"}]}, {"id": "palladian-architecture", "title": "パラーディオ様式", "aka": "Palladian Architecture", "field": "architecture", "area": "ルネサンス〜近世建築", "section": "", "headline": "シンメトリーと神殿風ポーチが世界中の邸宅建築の型になった", "summary": "16世紀のヴェネツィア周辺で活動した建築家アンドレーア・パラーディオは、古代ローマ建築の比例原理をさらに洗練させ、左右対称の平面構成と古代神殿を思わせる列柱ポーチ（ポルティコ）を組み合わせた明快な様式を確立した。彼の建築論『建築四書』は各国語に翻訳されて広まり、18世紀のイギリスやアメリカ（ジェファーソンのモンティチェロなど）の邸宅・公共建築にまで大きな影響を与える、西洋建築史上もっとも国際的に普及した様式のひとつになった。", "keyPoint": "パラーディオの影響力は建築物そのものより「本」を通じて広まった——理論書が様式を国境を越えて伝播させた稀有な例。", "startYear": 1550, "endYear": 1580, "eraLabel": "盛期ルネサンス後期（16世紀）", "creator": "アンドレーア・パラーディオ", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Villa_rotonda.JPG?width=1000", "imageCredit": "Andrea Palladio, 1567-1592年（「ヴィラ・ロトンダ」）, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Villa_rotonda.JPG", "body": [{"label": "「ヴィラ・ロトンダ」", "text": "四面すべてに神殿風のポーチを配し、中央に円形ドームを載せた対称性の極致のような別荘建築。実用性よりも幾何学的な完璧さそのものを追求した、パラーディオ様式の到達点とされる。"}, {"label": "「パラーディアニズム」の世界的普及", "text": "18世紀イギリスの貴族たちが自邸をパラーディオ風に建てる流行（パラーディアン・リヴァイヴァル）が起こり、さらにその流れがアメリカ植民地にも伝わり、独立後の公共建築の様式選択にも影響を与えた。"}], "relatedTopics": [{"concept": "classical-revival-architecture", "relation": "源流"}, {"concept": "baroque-architecture", "relation": "対立する"}, {"concept": "neoclassical-architecture-18c", "relation": "なかま"}], "referencedBy": [{"id": "baroque-architecture", "title": "バロック建築（ベルニーニ）", "field": "architecture"}, {"id": "classical-revival-architecture", "title": "古典様式の復興（アルベルティ）", "field": "architecture"}, {"id": "neoclassical-architecture-18c", "title": "18世紀新古典主義建築", "field": "architecture"}]}, {"id": "parametric-architecture", "title": "パラメトリック建築", "aka": "Parametric Architecture (Zaha Hadid)", "field": "architecture", "area": "20世紀後半〜現代建築", "section": "", "headline": "数式が形を生む、コンピューターアルゴリズムで設計する建築", "summary": "21世紀に入り、建築家が直接形を描くのではなく、変数（パラメーター）とアルゴリズムを設定し、コンピューターに膨大な形状パターンを生成・最適化させる設計手法が登場した。ザハ・ハディドが手がけたヘイダル・アリエフ・センターは、直線や直角を一切排し、地面から壁、屋根までがシームレスに流れるような一体化した曲面を実現し、人間の手描きでは到達できない複雑で流動的な造形を可能にした。", "keyPoint": "パラメトリック建築は「建築家がデザインする」から「建築家がデザインを生成するルールを設計する」への発想の転換を伴う。", "startYear": 2007, "endYear": 2012, "eraLabel": "パラメトリック建築（21世紀初頭、ヘイダル・アリエフ・センターは2012年完成）", "creator": "ザハ・ハディド", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Heydar_Aliyev_Center_1.1.jpg?width=1000", "imageCredit": "Zaha Hadid, 2012年（「ヘイダル・アリエフ・センター」）, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Heydar_Aliyev_Center_1.1.jpg", "body": [{"label": "シームレスな流動的形態", "text": "建物の壁・床・屋根の境界が曖昧に溶け合った波打つ外観は、ガラス繊維強化コンクリート（GFRC）パネルを一枚一枚異なる形状にコンピューター制御で加工することで実現された。"}, {"label": "「ザハ・ハディド・スタイル」の確立", "text": "直線的な近代建築とは対照的な、流線型で未来的な造形は「ザハ・ハディド・スタイル」として一つのブランドとなり、世界各都市がランドマーク建築として彼女の設計を競って誘致した。"}], "relatedTopics": [{"concept": "deconstructivism-architecture", "relation": "源流"}, {"concept": "starchitect-phenomenon", "relation": "なかま"}], "referencedBy": [{"id": "deconstructivism-architecture", "title": "脱構築主義建築", "field": "architecture"}, {"id": "starchitect-phenomenon", "title": "スターアーキテクト現象", "field": "architecture"}]}, {"id": "participant-observation", "title": "参与観察という方法", "aka": "Participant Observation", "field": "culture-anthropology", "area": "日本文化人類学とフィールドワーク", "headline": "研究者自身が対象社会の生活に入り込み、内側から理解しようとする調査方法", "summary": "参与観察とは、文化人類学の基本的な調査方法で、研究者が調査対象となる社会・集団の生活の場に実際に長期間身を置き、日常の活動に参加しながら人々の行動や語りを観察・記録することで、外部からは見えにくい文化の内側の論理を理解しようとする手法。マリノフスキーがトロブリアンド諸島でのフィールドワークを通じて確立した方法論的伝統が、現代人類学のフィールドワークの基本モデルとなっている。", "keyPoint": "参与観察は「観察者でありながら参加者でもある」という独特の立場に研究者を置くため、対象社会への感情移入と、それでも保つべき分析的な距離のバランスが常に問われる。", "body": [{"label": "マリノフスキーの方法論的革新", "text": "マリノフスキーは、それまでの人類学者が現地に赴かず伝聞情報や短期の視察に頼っていたのに対し、自ら現地の言語を学び、長期間住み込んで人々の日常生活に参加する調査を実践し、これを人類学の標準的な方法として確立した。"}, {"label": "日本の民俗学との接点", "text": "柳田国男の民俗学は文献学的な色彩が強かったのに対し、後続の日本の文化人類学者たちは、参与観察という西洋人類学の方法を取り入れながら、日本の農村・漁村の共同体研究を進めていった。"}], "relatedTopics": [{"concept": "yanagita-kunio-folklore", "relation": "関連"}, {"concept": "chicago-school-urban-ecology", "relation": "なかま"}], "referencedBy": [{"id": "chicago-school-urban-ecology", "title": "都市の生態学（シカゴ学派）", "field": "sociology"}]}, {"id": "patriarchy", "title": "家父長制", "aka": "Patriarchy", "field": "sociology", "area": "家族社会学", "headline": "男性が家族・社会の権威を握る構造とその歴史的形態", "summary": "家父長制とは、家族内外の権威や資源の分配において男性(特に年長の男性家長)が優越的な地位を占める社会構造を指す概念。フェミニズムはこれを自然な秩序ではなく歴史的に構築された権力構造として批判的に分析し、近代家族における性別役割分業もその一形態とみなされることが多い。", "keyPoint": "「家長が家族を統率するのは自然なこと」ではなく、歴史的に作られ再生産されてきた権力構造だとする見方が家父長制批判の核心。", "body": [{"label": "私的領域への権力の浸透", "text": "家父長制論は、権力は国家や職場だけでなく、家庭という「私的」とされる領域にも浸透していると指摘し、フェミニズムの「個人的なことは政治的なこと」というスローガンにつながった。"}, {"label": "形態の多様性と変化", "text": "家父長制の具体的な現れ方は時代・文化によって大きく異なり、法制度の変化や女性の社会進出によってその強度も変化してきたと論じられる。"}], "relatedTopics": [{"concept": "social-stratification", "relation": "関連"}, {"concept": "declining-birthrate-and-gender-roles", "relation": "関連"}], "referencedBy": [{"id": "declining-birthrate-and-gender-roles", "title": "少子化とジェンダー役割", "field": "sociology"}, {"id": "ecofeminism", "title": "エコフェミニズム", "field": "thought"}, {"id": "gender-and-sex-distinction", "title": "ジェンダーとセックスの区別", "field": "thought"}]}, {"id": "peirce-pragmatic-maxim", "title": "プラグマティズムの格率(パース)", "aka": "Peirce's Pragmatic Maxim", "field": "thought", "area": "プラグマティズムとアメリカ思想", "headline": "概念の意味はその実際的な効果によって決まるという原則", "summary": "パースが提唱したプラグマティズムの格率は、ある概念の意味を明確にするには、その概念を受け入れることでどんな実際的な効果・違いが生じるかを考えればよい、とする方法論的な原則。抽象的な議論を、経験の中で確かめられる具体的な帰結に翻訳することで明確にしようとする、プラグマティズム全体の出発点となった考え方。", "keyPoint": "「その概念が正しいとして、具体的に何が違ってくるのか」を問うことで意味を明確にするという発想の方法。", "body": [{"label": "意味の明確化の方法", "text": "パースは、ある対象の概念を完全に把握するには、その対象がどんな実際的な結果をもたらしうるかをすべて考えればよいとし、これを概念の意味を明確化する方法として提示した。"}, {"label": "後継者たちへの影響", "text": "この格率はジェイムズによって真理論に、デューイによって道具主義に、それぞれ独自の形で展開され、プラグマティズムという思想潮流全体の共通の土台になった。"}], "relatedTopics": [{"concept": "james-pragmatic-theory-of-truth", "relation": "なかま"}, {"concept": "fallibilism-peirce", "relation": "源流"}], "referencedBy": [{"id": "dewey-instrumentalism", "title": "デューイの道具主義", "field": "thought"}, {"id": "fallibilism-peirce", "title": "可謬主義", "field": "thought"}, {"id": "james-pragmatic-theory-of-truth", "title": "真理のプラグマティズム論(ジェイムズ)", "field": "thought"}]}, {"id": "personality-theory", "title": "パーソナリティ理論", "aka": "Personality theory / trait theory", "field": "psychology", "area": "心理学の基礎概念", "headline": "人はなぜそれぞれ違う性格を持つのかを説明する理論群", "summary": "パーソナリティ心理学は、個人の考え方・感じ方・行動の一貫したパターン（性格）を記述し、その個人差を説明しようとする分野。特性論では性格をいくつかの連続的な次元（特性）の組み合わせとして捉え、代表的なモデルが「ビッグファイブ」（開放性・誠実性・外向性・協調性・神経症的傾向）。類型論のようにタイプに分類する立場もあるが、現代の主流は特性論。", "keyPoint": "性格は「◯◯型」に分類するより、複数の特性の強弱の組み合わせとして捉える方が科学的に扱いやすい。", "body": [{"label": "ビッグファイブ", "text": "開放性・誠実性・外向性・協調性・神経症的傾向の5つの次元で性格を記述するモデルで、文化を超えて再現性が高いとされる現在の標準的な枠組み。"}, {"label": "遺伝と環境", "text": "双生児研究などから、性格特性のばらつきの一定割合は遺伝で説明されるが、残りは共有環境・非共有環境によるとされ、「氏か育ちか」は単純な二択ではない。"}], "relatedTopics": [{"concept": "psychology-major-approaches", "relation": "なかま"}], "referencedBy": []}, {"id": "platos-theory-of-forms", "title": "プラトンのイデア論", "aka": "Plato's Theory of Forms", "field": "philosophy", "area": "西洋哲学史（古代〜中世）", "headline": "感覚世界の背後に、真に実在する完全な原型があるという説", "summary": "プラトンのイデア論とは、私たちが感覚で捉える個々のものごと（例えば個々の美しいもの）は不完全な影にすぎず、その背後に「美そのもの」のような、完全で不変・永遠の原型＝イデアが真に実在するという考え方。イデアは理性によってのみ捉えられ、「洞窟の比喩」はこの構造を鮮やかに描いている。", "keyPoint": "感覚で見える世界を「本物」とせず、その奥にある理性的な原型こそ本物と考える発想の転換が、西洋哲学の基本枠組みを作った。", "body": [{"label": "洞窟の比喩", "text": "洞窟に鎖でつながれ壁に映る影しか見たことのない囚人が、外に出て太陽の下の実物を見て初めて真実を知るという寓話。壁の影は感覚世界、外の実物はイデア界の比喩であり、哲学者の役割は洞窟の外に出て人々を導くことにあるとされる。"}, {"label": "善のイデア", "text": "数多いイデアの頂点に位置するのが「善のイデア」で、太陽が万物を照らし見えるようにするのと同様に、善のイデアが他のあらゆるイデアを存在させ認識可能にすると説かれる。"}], "relatedTopics": [{"concept": "socratic-method", "relation": "源流"}, {"concept": "problem-of-universals", "relation": "源流"}, {"concept": "ontology-what-is-being", "relation": "関連"}], "referencedBy": [{"id": "aristotle-four-causes", "title": "アリストテレスの四原因説", "field": "philosophy"}, {"id": "socratic-method", "title": "ソクラテスの問答法", "field": "philosophy"}]}, {"id": "pop-art", "title": "ポップアート", "aka": "Pop Art (Warhol, Lichtenstein)", "field": "art", "area": "20世紀〜現代美術", "section": "", "headline": "スープ缶や漫画のコマを「高級芸術」に持ち込んだ挑発", "summary": "1950年代後半から60年代にかけて、大量消費社会の広告・漫画・有名人の肖像といった大衆文化のイメージを、そのまま高級芸術の題材として扱った運動。ウォーホルはスープ缶のラベルやマリリン・モンローの写真をシルクスクリーンで反復印刷し、「独創的な一点物」という伝統的な芸術観そのものを皮肉った。抽象表現主義の内面的・情緒的な絵画への反動として、大衆文化と芸術の境界を意図的に曖昧にした。", "keyPoint": "ウォーホルの「同じ絵を機械的に量産する」という手法は、「芸術＝作家の唯一無二の魂の表現」という近代的な芸術観への根本的な挑戦だった。", "startYear": 1956, "endYear": 1970, "eraLabel": "ポップアート（1950年代後半〜1960年代）", "creator": "アンディ・ウォーホル、ロイ・リキテンスタイン", "body": [{"label": "シルクスクリーンによる複製", "text": "ウォーホルは印刷技術のシルクスクリーンを用いて同一のイメージを繰り返し量産し、大量生産・大量消費社会そのものを制作手法のレベルで体現した（代表作は著作権保護期間中のため本レコードに画像は掲載していない）。"}, {"label": "漫画を絵画に", "text": "リキテンスタインは新聞や漫画のコマを拡大し、印刷の網点（ベンデイ・ドット）まで手描きで再現することで、大衆的な印刷イメージを絵画の題材として昇格させた。"}], "relatedTopics": [{"concept": "abstract-expressionism", "relation": "対立する"}, {"concept": "conceptual-art", "relation": "関連"}], "referencedBy": [{"id": "abstract-expressionism", "title": "抽象表現主義", "field": "art"}, {"id": "conceptual-art", "title": "コンセプチュアル・アート", "field": "art"}]}, {"id": "populism", "title": "ポピュリズム", "aka": "Populism", "field": "politics", "area": "政治体制とイデオロギー", "headline": "「腐敗したエリート」対「純粋な人民」という対立軸で政治を語る手法", "summary": "ポピュリズムは、社会を「堕落した一部のエリート」と「本来の意思を代表されていない善良な人民」との対立として描き、既存の政治体制やエリート層を批判しながら、指導者が「人民」の声を直接体現すると主張する政治スタイル・思想。左右を問わず現れ、既存の代議制民主主義への不満を背景に台頭する。", "keyPoint": "特定の政策内容というより「エリート対人民」という対立の描き方そのものが、ポピュリズムを定義する特徴。", "body": [{"label": "薄いイデオロギー", "text": "政治学では、ポピュリズムはそれ自体で完結した体系的な世界観(厚いイデオロギー)ではなく、社会主義やナショナリズムなど他の思想と結びつく「薄いイデオロギー」だとされることが多い。"}, {"label": "代議制民主主義との緊張", "text": "ポピュリズムは、議会や司法、報道機関といった「人民の意思」を仲介・制約する中間団体を「エリートの道具」とみなして攻撃しがちで、これが自由主義的な民主主義の制度と緊張を生む。"}], "relatedTopics": [{"concept": "democracy", "relation": "関連"}, {"concept": "nationalism", "relation": "関連"}], "referencedBy": []}, {"id": "positive-and-negative-liberty", "title": "積極的自由と消極的自由", "aka": "Positive and Negative Liberty", "field": "politics", "area": "政治哲学史", "headline": "「〜からの自由」と「〜への自由」という二つの自由概念", "summary": "バーリンが整理した消極的自由は、他者からの干渉や強制を受けないという「〜からの自由」を指し、積極的自由は、自分自身を主人として自己を実現していく「〜への自由」を指す。バーリンは、積極的自由の理念がしばしば「真の自己実現のため」という名目で個人への抑圧を正当化する危険をはらむと警告し、消極的自由の擁護を重視した。", "keyPoint": "「邪魔されない自由」と「自己実現する自由」は別物であり、後者は時に抑圧を正当化する危険もはらむ。", "body": [{"label": "消極的自由の擁護", "text": "バーリンは、他者の干渉を受けない範囲を確保する消極的自由こそが、多様な価値観を持つ個人の自律を守る上で優先されるべきだと論じた。"}, {"label": "積極的自由の危うさ", "text": "「真に自由であるとは理性に従うことだ」といった積極的自由の理念は、指導者や国家が「本当のあなたのため」だとして個人を強制する全体主義的な論理に転化しうるとバーリンは警戒した。"}], "relatedTopics": [{"concept": "liberalism", "relation": "関連"}, {"concept": "authoritarianism", "relation": "対立する"}], "referencedBy": [{"id": "kant-critical-philosophy", "title": "カントの批判哲学", "field": "philosophy"}]}, {"id": "positivism-and-its-critics", "title": "実証主義とその批判", "aka": "Positivism and Its Critics", "field": "thought", "area": "20世紀の思想", "headline": "自然科学の方法を社会にも適用できるとする立場と、それへの反発", "summary": "実証主義は、観察と実験によって検証可能な事実だけを知識の基礎とし、自然科学の方法を社会現象の研究にも一貫して適用できるとする立場。コントが社会学の礎として提唱したが、20世紀にはフランクフルト学派や解釈的な社会科学から、人間の意味世界を数量データに還元しすぎるという批判を受けた。", "keyPoint": "「社会も自然と同じ方法で科学的に解明できる」という発想への信頼と、その限界をめぐる論争の一部始終。", "body": [{"label": "コントの実証主義", "text": "社会学の祖とされるコントは、人間の知識が神学的・形而上学的段階を経て、観察可能な事実に基づく実証的段階へと進歩すると論じ、社会の科学的研究(社会学)を構想した。"}, {"label": "実証主義論争", "text": "20世紀にはポパーらの批判的合理主義とフランクフルト学派の間で「実証主義論争」が起こり、社会科学が価値判断からどこまで自由でありうるかが激しく議論された。"}], "relatedTopics": [{"concept": "frankfurt-school-critical-theory", "relation": "対立する"}, {"concept": "idea-of-progress", "relation": "関連"}], "referencedBy": [{"id": "dewey-instrumentalism", "title": "デューイの道具主義", "field": "thought"}]}, {"id": "post-impressionism", "title": "後期印象派", "aka": "Post-Impressionism (Van Gogh, Cézanne, Gauguin)", "field": "art", "area": "近代美術（ロマン主義〜印象派）", "section": "", "headline": "光の再現を超え、感情と構造を絵に込めた次の世代", "summary": "印象派が光の一瞬の効果の再現に専念したのに対し、その後に続いた画家たちはそれぞれ独自の方向で絵画を発展させた。ゴッホは激しい感情そのものを渦巻くような筆致と強烈な色彩に込め、セザンヌは自然を円筒・球・円錐といった幾何学的形態に還元して捉え直し、ゴーギャンは西洋文明を離れタヒチで象徴的・装飾的な色面の絵画を追求した。この多様な模索が、20世紀のフォーヴィスムやキュビスムへの道を開いた。", "keyPoint": "後期印象派は一つの様式ではなく、「印象派の次に何をすべきか」への異なる回答の集まりだった。", "startYear": 1886, "endYear": 1905, "eraLabel": "後期印象派（1886年〜1905年頃）", "creator": "フィンセント・ファン・ゴッホ、ポール・セザンヌ、ポール・ゴーギャン", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Van_Gogh_Starry_Night.jpg? 。サイードのオリエンタリズム論を大きな源流とし、文学研究・歴史学など幅広い分野に展開した。", "keyPoint": "植民地支配の「終わり」は、政治的な独立と、文化的・心理的な脱植民地化が必ずしも一致しないことを、ポストコロニアリズムは繰り返し指摘する。", "body": [{"label": "内面化された植民地主義", "text": "フランツ・ファノンは、植民地支配下の被支配者が、支配者の価値観や美的基準を自ら内面化し、自分自身の文化を劣ったものとみなしてしまう心理的なメカニズムを早くから分析し、ポストコロニアリズムの重要な先駆けとなった。"}, {"label": "ハイブリディティ論", "text": "ホミ・バーバらは、植民地の文化と宗主国の文化が単純に対立するのではなく、両者が接触する中で新しい混淆的な文化形態（ハイブリディティ）が生まれることに注目し、支配と被支配という単純な二項対立を超えた分析を試みた。"}], "relatedTopics": [{"concept": "orientalism-said", "relation": "源流"}, {"concept": "cultural-hybridity", "relation": "なかま"}], "referencedBy": [{"id": "cultural-hybridity", "title": "文化変容とハイブリディティ", "field": "culture-anthropology"}, {"id": "orientalism-said", "title": "オリエンタリズム（サイード）", "field": "thought"}]}, {"id": "postmodern-architecture", "title": "ポストモダン建築", "aka": "Postmodern Architecture (Michael Graves)", "field": "architecture", "area": "20世紀後半〜現代建築", "section": "", "headline": "「装飾は罪ではない」、モダニズムの禁欲主義への反乱", "summary": "1970年代以降、国際様式の「装飾を排したガラスの箱」が世界中の都市を均質化してしまったことへの反動として、歴史的な様式やユーモア、鮮やかな色彩を意図的に引用・混在させるポストモダン建築が台頭した。マイケル・グレイヴスが設計したポートランド・ビルは、古典建築の柱型やキーストーンといったモチーフを、皮肉やユーモアを込めて誇張的に配置し、モダニズムが否定した「装飾」と「意味」を建築に取り戻そうとした。", "keyPoint": "ポストモダン建築の様式引用は懐古趣味ではなく、「モダニズムの単一の正しさ」そのものを疑う、ある種の批評的な身振りだった。", "startYear": 1966, "endYear": 1990, "eraLabel": "ポストモダン建築（1970年代〜1980年代）", "creator": "マイケル・グレイヴス、フィリップ・ジョンソン、ロバート・ヴェンチューリ", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Portland_Building_1982.jpg?width=1000", "imageCredit": "Michael Graves, 1982年（「ポートランド・ビル」）, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Portland_Building_1982.jpg", "body": [{"label": "「ポートランド・ビル」", "text": "巨大な柱型のような装飾やリボンを結んだような意匠を外壁に配した市庁舎ビル。国際様式のガラスの箱が支配していた当時のオフィス建築の常識に真っ向から挑戦し、賛否両論を呼びながらポストモダン建築の象徴的作品になった。"}, {"label": "「非合理性」の肯定", "text": "建築家ロバート・ヴェンチューリの著書『建築の多様性と対立性』は「Less is a bore（少ないことは退屈だ）」とミースの標語をもじり、複雑さや矛盾を積極的に肯定する理論的支柱となった。"}], "relatedTopics": [{"concept": "international-style-architecture", "relation": "対立する"}, {"concept" て定着した。", "keyPoint": "「一つの正しい進歩の物語」を疑い、多様で断片的な物語の並存を肯定する態度がポストモダンの核。", "body": [{"label": "大きな物語の終焉", "text": "リオタールは、マルクス主義の革命史観や科学の絶対的な進歩といった、近代を正当化してきた「大きな物語」がもはや説得力を失ったと論じた。"}, {"label": "進歩史観との対比", "text": "啓蒙思想以来の直線的な進歩史観を素朴に信じられなくなった状況として、ポストモダンはしばしば進歩史観の「その後」として位置づけられる。"}], "relatedTopics": [{"concept": "post-structuralism", "relation": "なかま"}, {"concept": "idea-of-progress", "relation": "批判する"}], "referencedBy": [{"id": "post-structuralism", "title": "ポスト構造主義", "field": "thought"}, {"id": "postmodern-architecture", "title": "ポストモダン建築", "field": "architecture"}, {"id": "postmodern-literature", "title": "ポストモダン文学", "field": "literature"}, {"id": "rorty-neopragmatism", "title": "ローティの新プラグマティズム", "field": "thought"}, {"id": "simulacra-baudrillard", "title": "シミュラークル", "field": "sociology"}]}, {"id": "postwar-japanese-literature", "title": "戦後文学", "aka": "Postwar Japanese Literature", "field": "literature", "area": "日本文学史", "section": "", "headline": "敗戦の虚無と再生を、退廃と美の両極端に描く", "summary": "第二次世界大戦の敗戦は、日本文学に大きな断絶と新しい主題をもたらした。太宰治は『人間失格』で、戦後の価値観の崩壊の中で自己の弱さと社会からの疎外感を赤裸々に告白する「無頼派」の文学を確立し、若い世代の共感を集めた。三島由紀夫は対照的に、耽美的で完璧に構築された文体と肉体・美への強い意識を通じて、失われた伝統的価値への郷愁とその崩壊を描いた。両者とも戦後日本の精神的な混乱と再生の模索を、それぞれ異なる極端な形で体現した作家といえる。", "keyPoint": "太宰治の「恥の多い生涯を送ってきました」という『人間失格』の書き出しは、戦後日本人の自己否定的な心情を代弁する言葉として、時代を超えて読み継がれている。", "startYear": 1945, "endYear": 1970, "eraLabel": "戦後文学（1945〜1970年頃）", "creator": "太宰治、三島由紀夫", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Dazai_Osamu.jpg?width=1000", "imageCredit": "太宰治の肖像写真, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Dazai_Osamu.jpg", "body": [{"label": "「無頼派」という潮流", "text": "太宰治や坂口安吾ら、既存の道徳や社会規範に反発し、自らの弱さや退廃をあえて曝け出す作風を持つ作家群は「無頼派（新戯作派）」と呼ばれ、価値観が崩壊した戦後の混乱期の精神を色濃く反映していた。"}, {"label": "三島由紀夫の美意識と最期", "text": "三島は『金閣寺』などで滅びゆく美への耽溺を描いた一方、1970年に自衛隊駐屯地で割腹自殺を遂げるという衝撃的な最期を迎え、その生と死そのものが作品世界と分かちがたく結びついた稀有な作家として記憶されている。"}], "relatedTopics": [{"concept": "existentialist-literature-camus-sartre", "relation": "関連"}, {"concept": "modern-japanese-literature-birth", "relation": "なかま"}], "referencedBy": [{"id": "contemporary-japanese-literature", "title": "現代日本文学（村上春樹など）", "field": "literature"}]}, {"id": "postwar-japanese-party-politics", "title": "戦後日本の政党政治（保守合同と分裂）", "aka": "Postwar Japanese Party Politics", "field": "politics", "area": "日本政治", "headline": "保守勢力の合同と分裂、55年体制の崩壊を経て流動化してきた戦後の政党の変遷", "summary": "戦後日本の政党政治は、1955年の自由党と民主党の「保守合同」による自民党結成という統合の動きと、1993年の自民党分裂による55年体制崩壊、さらにその後の新党結成・離合集散を繰り返す流動的な展開をたどってきた。政権交代可能な二大政党制を目指す選挙制度改革（小選挙区比例代表並立制の導入）が行われたが、実際には自民党が多くの期間で政権を維持し続け、野党の再編・分裂も繰り返されている。", "keyPoint": "選挙制度を変えれば政党システムも変わるという制度論的な期待に対し、日本の実際の政党政治は文化的・組織的な要因も絡み、必ずしも単純な二大政党制には収斂してこなかった。", "body": [{"label": "保守合同", "text": "1955年、左右に分裂していた社会党の再統一に対抗する形で保守勢力の自由党と民主党が合同し自由民主党を結成した「保守合同」は、以後38年続く自民党長期政権の出発点となった。"}, {"label": "選挙制度改革と政党再編", "text": "1994年に導入された小選挙区比例代表並立制は、政権交代可能な二大政党制を促すことを狙いとしたが、実際には野党の分裂・再編が繰り返され、政権交代は2009年の民主党政権誕生など限られた局面にとどまっている。"}], "relatedTopics": [{"concept": "1955-system", "relation": "源流"}], "referencedBy": []}, {"id": "potlatch", "title": "ポトラッチ", "aka": "Potlatch", "field": "culture-anthropology", "area": "経済人類学と交換", "headline": "気前よく富を分配・破壊することで、名誉と地位を競い合う儀礼的贈与", "summary": "ポトラッチは、北米北西海岸の先住民社会に見られた、首長や有力者が盛大な祝宴を開いて大量の財を気前よく他者に分配し、時にはあえて破壊さえすることで、自らの富と気前のよさを誇示し、社会的な地位と名誉を競い合う儀礼的な贈与の制度。", "keyPoint": "「多くを与えられる者ほど偉い」という、蓄財とは正反対の価値観に基づく経済のあり方を示す代表例。", "body": [{"label": "競覇的贈与", "text": "ポトラッチでは、贈与を受けた側は同等かそれ以上の返礼をしなければ面目を失うため、贈与合戦がエスカレートしていく「競覇的贈与」の性格を持つことがある。"}, {"label": "贈与論における位置づけ", "text": "モースは、ポトラッチを「全体的給付体系」の極端な一例として取り上げ、贈与が単なる経済行為ではなく、地位・名誉・宗教的意味までも巻き込む「全体的な社会現象」であることを示す証拠とした。"}], "relatedTopics": [{"concept": "gift-theory-mauss", "relation": "具体例"}, {"concept": "ritual", "relation": "関連"}], "referencedBy": []}, {"id": "power", "title": "権力", "aka": "Power", "field": "politics", "area": "政治の基本概念", "headline": "他者の意志や行動を左右する力", "summary": "権力とは、相手の抵抗があってもなお自分の意志を通し、他者の行動を左右できる能力のこと。ウェーバーは権力を「抵抗を排してでも自分の意志を貫徹できる可能性」と定義し、フーコーはさらに、権力は国家のような特定の場所に集中しているのではなく、学校・病院・日常会話など社会のあらゆる関係に分散して存在すると論じた。", "keyPoint": "権力は「誰かが持っている物」というより、関係の中で絶えず作動している働きとして捉えると理解しやすい。", "body": [{"label": "ウェーバーの定義", "text": "権力は暴力だけでなく、経済力・知識・カリスマなど多様な源泉から生じ、必ずしも公式の地位に結びつかない。"}, {"label": "フーコーの権力論", "text": "権力は上から一方的に押しつけられるだけでなく、規律や知の体系を通じて人々の身体や思考のすみずみにまで浸透していると論じた。"}], "relatedTopics": [{"concept": "the-state", "relation": "関連"}], "referencedBy": [{"id": "the-state", "title": "国家", "field": "politics"}]}, {"id": "predestination", "title": "予定説", "aka": "Predestination", "field": "religion", "area": "キリスト教", "headline": "誰が救われるかは、あらかじめ神によって定められているとする教義", "summary": "予定説は、人が救われるか否かは、その人の信仰や行いに先立って、神によってあらかじめ永遠に定められているとする教義。カルヴァンによって体系化され、改革派(カルヴァン派)プロテスタントの中心教義となった。", "keyPoint": "人間の意志や努力より先に、神の絶対的な主権が救いを決定しているとする、恩恵の教義の極限形態。", "body": [{"label": "カルヴァンの二重予定説", "text": "カルヴァンは、救われる者(選び)だけでなく滅びる者もあらかじめ神によって定められているとする二重予定説を説き、神の主権を徹底して強調した。"}, {"label": "「プロテスタンティズムの倫理」との関係", "text": "社会学者ウェーバーは、救いが予定されているという不安から、自分が選ばれた証を求めて禁欲的に勤勉に働く倫理観が生まれ、それが資本主義の精神を準備したと論じた。"}], "relatedTopics": [{"concept": "justification-by-faith", "relation": "関連"}, {"concept": "weber-protestant-ethic", "relation": "関連"}], "referencedBy": [{"id": "augustine-grace-and-free-will", "title": "アウグスティヌスの恩寵論", "field": "philosophy"}, {"id": "pure-land-faith", "title": "浄土信仰", "field": "religion"}, {"id": "weber-protestant-ethic", "title": "ウェーバーのプロテスタンティズムの倫理", "field": "sociology"}]}, {"id": "private-language-argument", "title": "私的言語論", "aka": "Private Language Argument", "field": "philosophy", "area": "論理学・言語哲学", "headline": "自分だけにしか分からない言語は成立しないという議論", "summary": "後期ウィトゲンシュタインの私的言語論は、他人には原理的に確認しようのない、自分ひとりの内的な感覚だけを指す「私的言語」は成立しえないと論じる議論。言葉の意味は公共的な使用の規則によって支えられており、正しい使用と間違った使用を第三者が確認できなければ、「意味がある」ということ自体が成り立たないとされる。", "keyPoint": "言葉の意味は一人だけでは成立せず、正しさを確認できる公共的な実践に支えられている。", "body": [{"label": "規則に従うというパラドックス", "text": "ある規則に「正しく」従っているかどうかは、それを確認する外部の基準や実践があって初めて意味を持つ。完全に一人だけの規則には、正誤を区別する基準がそもそも存在しない。"}, {"label": "使用説とのつながり", "text": "この議論は、意味とは指示対象ではなく公共的な使用のされ方であるという後期ウィトゲンシュタインの言語観を支える中心的な論拠になっている。"}], "relatedTopics": [{"concept": "theory-of-meaning", "relation": "関連"}, {"concept": "mind-body-problem", "relation": "関連"}], "referencedBy": []}, {"id": "problem-of-universals", "title": "普遍論争", "aka": "Problem of universals", "field": "philosophy", "area": "哲学の基本問題", "headline": "「赤いもの」に共通する「赤さ」は実在するか", "summary": "個々の赤いリンゴや赤い服には共通して「赤さ」という性質（普遍者）があるように見えるが、この普遍者は個物とは別に実在するのか、それとも人間が言葉でまとめているだけの名前（唯名）にすぎないのか。中世スコラ哲学で激しく争われ、実在論・唯名論・概念論に分かれた。", "keyPoint": "この論争は言語・数学の対象（例えば「数」）が実在するかという現代の議論にも直結している。", "body": [{"label": "実在論", "text": "普遍者（赤さ、人間性など）は個物とは独立に実在するとする立場。プラトンのイデア論が源流。"}, {"label": "唯名論", "text": "実在するのは個物だけで、「普遍」は共通の名前を与えているにすぎないとする立場。オッカムが代表的論者。"}], "relatedTopics": [{"concept": "ontology-what-is-being", "relation": "なかま"}], "referencedBy": [{"id": "ontology-what-is-being", "title": "存在論とは何か", "field": "philosophy"}, {"id": "platos-theory-of-forms", "title": "プラトンのイデア論", "field": "philosophy"}]}, {"id": "psychology-major-approaches", "title": "心の主要アプローチ（学派）", "aka": "Major perspectives in psychology", "field": "psychology", "area": "心理学の基礎概念", "headline": "同じ「心」を説明する、いくつもの理論的立場", "summary": "心理学には単一の統合理論がなく、心をどう説明するかについて複数のアプローチが並立してきた。行動そのものだけを扱う行動主義、頭の中の情報処理に注目する認知アプローチ、無意識の葛藤を重視する精神分析、脳と神経に還元する生物学的アプローチ、人間の成長可能性を強調する人間性心理学など。同じ現象（例えば不安）も、学派によって説明も治療法もまったく異なる。", "keyPoint": "「心理学」とひとくちに言っても、学派によって心の捉え方も研究方法もまったく違う。", "body": [{"label": "行動主義", "text": "ワトソンやスキナーに代表され、観察できない「心」ではなく、観察可能な刺激と反応（行動）だけを科学の対象とすべきだと主張した。"}, {"label": "認知革命以降", "text": "1950〜60年代の「認知革命」により、行動主義が避けてきた記憶・注意・思考といった内的な情報処理過程が、再び正当な研究対象として扱われるようになった。"}], "relatedTopics": [{"concept": "mind-body-problem", "relation": "関連"}, {"concept": "consciousness-and-unconscious", "relation": "なかま"}], "referencedBy": [{"id": "consciousness-and-unconscious", "title": "意識と無意識", "field": "psychology"}, {"id": "personality-theory", "title": "パーソナリティ理論", "field": "psychology"}]}, {"id": "public-sphere-habermas", "title": "公共圏（ハーバーマス）", "aka": "Public Sphere aka": "Quran and Hadith", "field": "religion", "area": "イスラーム", "headline": "神の啓示そのものと預言者の言行の記録という二層の典拠", "summary": "クルアーンは、預言者ムハンマドを通じて神(アッラー)から下されたとされる啓示そのものを記した聖典で、イスラームにおいて絶対的な権威を持つ。ハディースはムハンマドの言行や黙認を弟子たちが伝承した記録で、クルアーンを補い具体的な生活規範を導くための第二の法源として用いられる。", "keyPoint": "クルアーンは「神の言葉そのもの」、ハディースは「預言者についての伝承」という性格の違いがある。", "body": [{"label": "啓典としてのクルアーン", "text": "クルアーンはムハンマドが天使ガブリエルを通じて受けた啓示を集成したものとされ、一言一句が神の言葉であるとみなされるため、翻訳は解釈にすぎないとされる。"}, {"label": "伝承としてのハディース", "text": "ハディースは伝承の鎖(イスナード)の信頼性によって真正性が評価され、真正性の高い集成が編纂されて、クルアーンとともにシャリーアの法源をなす。"}], "relatedTopics": [{"concept": "six-articles-and-five-pillars", "relation": "源流"}, {"concept": "revealed-religion", "relation": "なかま"}], "referencedBy": [{"id": "six-articles-and-five-pillars", "title": "六信五行", "field": "religion"}]}, {"id": "radical-empiricism-james", "title": "徹底的経験論", "aka": "James's Radical Empiricism", "field": "thought", "area": "プラグマティズムとアメリカ思想", "headline": "経験されたものの「あいだの関係」まで実在とみなす立場", "summary": "ジェイムズの徹底的経験論は、経験の中に現れる個々の事物だけでなく、それらの「あいだ」にある関係(つながり・移行・連続性)そのものも、同じく直接経験される実在の一部とみなす立場。心と物、主観と客観といった伝統的な二元論を、経験という一元的な素材の中で捉え直そうとする野心的な試みだった。", "keyPoint": "「もの」だけでなく、ものとものを結ぶ「関係」そのものも経験の実在的な一部だと考えた。", "body": [{"label": "二元論の乗り越え", "text": "従来の哲学が心と物質を別々の実体として分けてきたのに対し、ジェイムズは両者を「純粋経験」という一元的な素材が異なる文脈に置かれたものとして説明しようとした。"}, {"label": "プラグマティズムとの関係", "text": "徹底的経験論はジェイムズの真理論を存在論的に支える土台であり、経験を離れた抽象的な実在を持ち出さずに世界を説明しようとする点でプラグマティズム全体の姿勢と一致する。"}], "relatedTopics": [{"concept": "james-pragmatic-theory-of-truth", "relation": "なかま"}, {"concept": "mind-body-problem", "relation": "関連"}], "referencedBy": []}, {"id": "rawls-theory-of-justice", "title": "正義論(ロールズ)", "aka": "Rawls's Theory of Justice", "field": "politics", "area": "政治哲学史", "headline": "無知のヴェールの下で選ばれる公正な分配原理という発想", "summary": "ロールズの正義論は、自分が社会でどんな立場(裕福か貧しいか、才能があるかないか)に置かれるかを一切知らない「無知のヴェール」の下で、人々が合意するであろう分配の原理こそが公正な正義の原理だとする議論。基本的自由の平等な保障を優先しつつ、格差は最も不遇な人々の利益になる場合にのみ許容されるとする「格差原理」を導いた。", "keyPoint": "「自分がどんな立場になるか分からない」という条件で選ぶ原理こそ、公平だとみなせるというアイデア。", "body":
