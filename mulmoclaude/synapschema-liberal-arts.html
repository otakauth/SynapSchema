opics": [{"concept": "monotheism-and-polytheism", "relation": "関連"}], "referencedBy": [{"id": "quran-and-hadith", "title": "クルアーンとハディース", "field": "religion"}]}, {"id": "right-of-resistance", "title": "抵抗権・革命権", "aka": "Right of Resistance", "field": "politics", "area": "政治哲学史", "headline": "統治者が信託に反したとき人民が抵抗しうるという権利", "summary": "抵抗権・革命権は、統治者が人民との信託(社会契約)に反して権力を濫用し、生命・自由・財産という自然権を著しく侵害したとき、人民には統治者への抵抗、さらには政府を打倒する権利があるとする考え方。ロックの統治論に由来し、アメリカ独立宣言やフランス人権宣言にも影響を与えた。", "keyPoint": "統治の正当性は「信託」に基づいており、それが破られたとき、人民の側に抵抗する権利が生まれるという発想。", "body": [{"label": "ロックの信託論", "text": "ロックは、政府の権力は人民から「信託」されたものにすぎず、統治者がその信託に反して権利を侵害するなら、人民はその信託を取り戻し、政府を変更する権利を持つと論じた。"}, {"label": "独立宣言への影響", "text": "この抵抗権の思想は、アメリカ独立宣言における「政府が人民の権利を破壊するようになった場合、人民はそれを改廃する権利を持つ」という一節に色濃く反映されている。"}], "relatedTopics": [{"concept": "social-contract-theory", "relation": "源流"}, {"concept": "general-will", "relation": "関連"}], "referencedBy": []}, {"id": "rinpa-school", "title": "琳派", "aka": "Rinpa School", "field": "art", "area": "日本美術史", "section": "", "headline": "師弟関係を超え、様式への私淑で受け継がれた装飾美術", "summary": "17世紀の俵屋宗達に始まり、尾形光琳、19世紀の酒井抱一へと、直接の師弟関係なしに約100年おきに私淑（作品を通じて学ぶこと）によって様式が受け継がれてきた特異な流派。『伊勢物語』などの古典文学を主題に、金地を背景にした大胆なデザイン性の高い装飾表現を特徴とし、絵画だけでなく蒔絵や陶芸など工芸デザインの分野にも大きな影響を与えた。", "keyPoint": "琳派は「流派」という名でありながら、直接教えを受けた弟子ではなく作品への憧れだけで様式が継承された、極めて珍しい美術の系譜。", "startYear": 1615, "endYear": 1900, "eraLabel": "江戸時代〜明治（17〜19世紀）", "creator": "俵屋宗達、尾形光琳、酒井抱一", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Irises_screen_2.jpg?width=1000", "imageCredit": "尾形光琳, 1701-1705年頃（「燕子花図屏風」）, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Irises_screen_2.jpg", "body": [{"label": "「燕子花図屏風」", "text": "『伊勢物語』の一場面（三河国八橋）を、写実的な背景を一切排し、燕子花（かきつばた）の花と葉だけを金地の上にリズミカルに反復配置して描いた作品。日本のグラフィックデザインの源流とも評される。"}, {"label": "私淑による様式の継承", "text": "尾形光琳は俵屋宗達の作品に直接感銘を受けて自らの様式を確立し、さらに約100年後の酒井抱一が光琳作品を模写・研究することで様式を受け継いだ。血縁でも師弟関係でもない、「作品を通じた継承」という珍しい系譜。"}], "relatedTopics": [{"concept": "kano-school", "relation": "なかま"}], "referencedBy": [{"id": "kano-school", "title": "狩野派", "field": "art"}]}, {"id": "rise-of-the-novel", "title": "近代小説の誕生（デフォー）", "aka": "The Rise of the Novel (Defoe)", "field": "literature", "area": "ルネサンス〜啓蒙時代の文学", "section": "", "headline": "実話のふりをした虚構、リアリズム小説の出発点", "summary": "18世紀初頭のイギリスで、ダニエル・デフォーが著した『ロビンソン・クルーソー』は、無人島に漂着した男の孤独なサバイバルを、まるで実在の航海記録であるかのような一人称の詳細な語りで描いた。神話や騎士道物語の誇張された筋立てから離れ、個人の具体的で日常的な経験をリアリズムの手法で描くこの手法は、勃興しつつあった中産階級の読者層に支持され、以後の近代小説（ノベル）というジャンルの原型を確立した。", "keyPoint": "『ロビンソン・クルーソー』が本当らしく感じられたのは、フィクションでありながら実話のような詳細な事実の積み重ねで語られたから——この手法が「小説的リアリズム」の出発点になった。", "startYear": 1719, "endYear": 1719, "eraLabel": "1719年（『ロビンソン・クルーソー』刊行）", "creator": "ダニエル・デフォー", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Portrait_of_Daniel_Defoe_Wellcome_M0012948.jpg?width=1000", "imageCredit": "ダニエル・デフォーの肖像, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Portrait_of_Daniel_Defoe_Wellcome_M0012948.jpg", "body": [{"label": "「本当らしさ」の技法", "text": "主人公が漂着した島でどう食料を確保し、どう住居を作ったかという実務的な描写を執拗に積み重ねることで、荒唐無稽な設定にもかかわらず読者にリアリティを感じさせる語りの技法を確立した。"}, {"label": "中産階級の読者と出版市場", "text": "印刷技術の普及とともに読み書きできる中産階級が拡大し、彼らが手に取りやすい価格の小説を求めるようになったことが、ノベルというジャンルの商業的な成立を後押しした。"}], "relatedTopics": [{"concept": "cervantes-don-quixote", "relation": "源流"}, {"concept": "epistolary-novel-and-sentimentalism", "relation": "なかま"}], "referencedBy": [{"id": "cervantes-don-quixote", "title": "セルバンテス『ドン・キホーテ』", "field": "literature"}, {"id": "epistolary-novel-and-sentimentalism", "title": "書簡体小説と感傷主義文学", "field": "literature"}, {"id": "victorian-novel", "title": "ヴィクトリア朝小説（ディケンズ）", "field": "literature"}]}, {"id": "rites-of-passage", "title": "通過儀礼", "aka": "Rites of Passage", "field": "culture-anthropology", "area": "宗教人類学", "headline": "人生の節目で社会的な身分の移行を確認し合う儀礼", "summary": "通過儀礼は、ファン・ヘネップが提唱した概念で、誕生・成人・結婚・死といった人生の重要な節目において、個人がそれまでの社会的な身分から新たな身分へと移行することを、共同体全体で儀礼的に確認し演出する営みを指す。多くの文化に共通して見られる普遍的な社会的仕組みとして分析される。", "keyPoint": "通過儀礼は個人の人生の節目を、社会がその身分の変化として公式に承認する仕組みでもある。", "body": [{"label": "分離・過渡・統合の三段階", "text": "ファン・ヘネップは通過儀礼を、元の身分から切り離される「分離」、どちらの身分にも属さない「過渡(リミナリティ)」、新しい身分に迎え入れられる「統合」の三段階として分析した。"}, {"label": "リミナリティという状態", "text": "特に中間の「過渡」の段階は、通常の社会秩序や規範から一時的に自由になる特殊な期間であり、後にターナーがこの状態を掘り下げてコミュニタスの概念を展開した。"}], "relatedTopics": [{"concept": "ritual", "relation": "なかま"}, {"concept": "communitas-and-liminality", "relation": "具体例"}], "referencedBy": [{"id": "communitas-and-liminality", "title": "コミュニタス", "field": "culture-anthropology"}, {"id": "hare-and-ke", "title": "ハレとケ", "field": "culture-anthropology"}]}, {"id": "ritual", "title": "儀礼", "aka": "Ritual", "field": "culture-anthropology", "area": "文化人類学の基礎概念", "headline": "決まった型を反復することで意味を作り出す行為", "summary": "儀礼とは、結婚式・成人式・葬儀のように、決まった順序と型にしたがって反復される象徴的な行為の体系。儀礼は単なる形式ではなく、人の社会的な立場の変化（子どもから大人へ、独身から既婚へ）を共同体全体に認めさせ、当人にも自覚させる働きを持つ。人類学者ファン・ヘネップは、こうした通過儀礼が「分離・過渡・統合」という共通の三段階構造を持つことを示した。", "keyPoint": "儀礼は「型どおり」に見えるからこそ、変化を社会全体に確実に認めさせることができる。", "body": [{"label": "通過儀礼の三段階", "text": "元の状態からの「分離」、どちらでもない不安定な「過渡（リミナリティ）」、新しい状態への「統合」という流れを多くの通過儀礼が共有する。"}, {"label": "リミナリティ", "text": "過渡の段階にある人は、社会的な地位が宙づりの状態（子どもでも大人でもない）に置かれ、特別な扱いを受けることが多い。"}], "relatedTopics": [{"concept": "myth", "relation": "なかま"}], "referencedBy": [{"id": "communitas-and-liminality", "title": "コミュニタス", "field": "culture-anthropology"}, {"id": "myth", "title": "神話", "field": "culture-anthropology"}, {"id": "orikuchi-marebito-theory", "title": "折口信夫のまれびと論", "field": "culture-anthropology"}, {"id": "potlatch", "title": "ポトラッチ", "field": "culture-anthropology"}, {"id": "rites-of-passage", "title": "通過儀礼", "field": "culture-anthropology"}, {"id": "sacrament", "title": "秘跡", "field": "religion"}]}, {"id": "rococo-architecture", "title": "ロココ建築", "aka": "Rococo Architecture", "field": "architecture", "area": "ルネサンス〜近世建築", "section": "", "headline": "バロックの重厚さから、軽やかで繊細な曲線装飾へ", "summary": "18世紀前半、バロックの荘重で威圧的な様式への反動として、より軽やかで優美、私的な親密さを感じさせるロココ様式が興った。貝殻や植物をモチーフにした非対称の曲線装飾（ロカイユ）を多用し、パステルカラーと金の細かな装飾で室内を埋め尽くす。宮殿建築だけでなく、南ドイツ・オーストリアの巡礼教会にも独自の展開を見せ、白と金を基調にした天井まで届く光あふれる祝祭的な宗教空間を生み出した。", "keyPoint": "ロココは公的な威厳を示すバロックに対し、より私的でくつろいだ空間（サロン文化）のための様式として広まった。", "startYear": 1715, "endYear": 1774, "eraLabel": "ロココ（18世紀前半）", "creator": "ドミニクス・ツィンマーマン（ヴィース教会）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Wieskirche_rococo_interior.jpg?width=1000", "imageCredit": "Wieskirche（巡礼教会）内部, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Wieskirche_rococo_interior.jpg", "body": [{"label": "ヴィース教会の光の演出", "text": "バイエルンの草原に建つこの巡礼教会は、外観の簡素さとは対照的に、内部は白と金の華麗な装飾と天井のフレスコ画で埋め尽くされ、世界遺産にも登録されている南ドイツ・ロココの最高傑作とされる。"}, {"label": "サロン文化との結びつき", "text": "フランス宮廷ではヴェルサイユの威圧的な公的空間に代わり、貴族の邸宅の私的なサロン（客間）を優美なロココ装飾で飾ることが流行し、より小規模で親密な社交空間の建築が発展した。"}], "relatedTopics": [{"concept": "versailles-absolutism-architecture", "relation": "源流"}, {"concept": "neoclassical-architecture-18c", "relation": "対立する"}], "referencedBy": [{"id": "neoclassical-architecture-18c", "title": "18世紀新古典主義建築", "field": "architecture"}, {"id": "versailles-absolutism-architecture", "title": "ヴェルサイユ宮殿と絶対王政の建築", "field": "architecture"}]}, {"id": "role-and-status", "title": "役割と地位", "aka": "Role and status", "field": "sociology", "area": "社会学の基礎概念", "headline": "人は場面ごとに違う「役」を演じている", "summary": "社会的地位とは学生・親・上司のように社会の中で占める位置のことで、役割とはその地位に結びついて期待される行動パターンを指す。人は複数の地位を同時に持ち、その分だけ複数の役割の間で調整（時には対立）を経験する。ゴフマンは日常生活そのものを一種の演劇にたとえ、人は状況に応じて自己を「演じ分け」ていると論じた。", "keyPoint": "「本当の自分」を探すより、状況ごとに異なる役割を演じ分けることが社会生活の実態に近い。", "body": [{"label": "役割葛藤", "text": "「上司としての厳しさ」と「同僚としての親しみ」のように、複数の役割の期待が矛盾するとき生じる緊張。"}, {"label": "ドラマトゥルギー", "text": "ゴフマンは対人関係を舞台にたとえ、人は「表舞台」で望ましい自己像を演出し、「舞台裏」で素の自分に戻ると分析した。"}], "relatedTopics": [{"concept": "socialization", "relation": "関連"}], "referencedBy": [{"id": "simmel-formal-sociology", "title": "ジンメルの形式社会学", "field": "sociology"}, {"id": "socialization-of-care", "title": "ケアの社会化", "field": "sociology"}, {"id": "socialization", "title": "社会化", "field": "sociology"}]}, {"id": "roman-arch-and-dome", "title": "ローマ建築（アーチとドーム）", "aka": "Roman Arch and Dome", "field": "architecture", "area": "古代〜中世建築", "section": "", "headline": "コンクリートとアーチが生んだ、かつてない規模の内部空間", "summary": "古代ローマ建築最大の革新は、アーチ構造とローマン・コンクリートの発明だった。これにより柱を密に並べる必要がなくなり、水道橋・闘技場・浴場・そしてパンテオンのような巨大なドーム空間まで、それまでにない規模と自由度を持つ建築が可能になった。ギリシア建築が「美しい外観」を重視したのに対し、ローマ建築は「使える内部空間」を追求した点で大きく異なる。", "keyPoint": "パンテオンのドーム内径は約43mで、この記録はルネサンス期のフィレンツェ大聖堂ドームが登場するまで1300年以上破られなかった。", "startYear": -509, "endYear": 476, "eraLabel": "古代ローマ（前509年〜後476年、現存パンテオンは2世紀）", "creator": "不明（現存パンテオンはハドリアヌス帝治世の再建）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Pantheon_(Rome)_-_Dome_interior.jpg?width=1000", "imageCredit": "Livioandronico2013, CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Pantheon_(Rome)_-_Dome_interior.jpg", "body": [{"label": "パンテオンのオクルス", "text": "ドーム頂部には直径約9mの円窓（オクルス）が開いており、これが唯一の光源。窓のない壁で覆われた巨大な円形空間に光の柱が差し込む劇的な効果を生む。"}, {"label": "ローマン・コンクリートの発明", "text": "火山灰を混ぜたコンクリートは軽量かつ強靭で、型枠さえあれば複雑な曲面も自在に作れた。この技術がなければパンテオンの巨大ドームは実現しなかった。"}], "relatedTopics": [{"concept": "greek-temple-architecture", "relation": "源流"}, {"concept": "roman-portraiture-and-mosaic", "relation": "なかま"}, {"concept": "byzantine-architecture", "relation": "関連"}], "referencedBy": [{"id": "brunelleschi-florence-dome", "title": "ブルネレスキとフィレンツェ大聖堂ドーム", "field": "architecture"}, {"id": "byzantine-architecture", "title": "ビザンティン建築", "field": "architecture"}, {"id": "greek-temple-architecture", "title": "古代ギリシア神殿建築", "field": "architecture"}, {"id": "iron-and-glass-architecture", "title": "鉄とガラスの建築", "field": "architecture"}, {"id": "roman-portraiture-and-mosaic", "title": "ローマ美術（肖像彫刻とモザイク）", "field": "art"}, {"id": "skyscraper-development", "title": "摩天楼の発展（シカゴ派）", "field": "architecture"}]}, {"id": "roman-portraiture-and-mosaic", "title": "ローマ美術（肖像彫刻とモザイク）", "aka": "Roman Portraiture and Mosaic", "field": "art", "area": "古代〜中世美術", "section": "", "headline": "理想化を避けたリアルな肖像と、床を彩ったモザイク画", "summary": "ローマ美術はギリシア彫刻の様式を受け継ぎつつ、独自に個人の顔の特徴をそのまま写し取る写実的な肖像彫刻（ヴェリズモ）を発展させた。一方、皇帝の肖像は理想化して権威を演出するなど、政治的なプロパガンダとしても彫刻が使われた。また邸宅の床や壁を彩る精緻なモザイク画も発達し、ローマ人の日常や神話が色石のかけらで描かれた。", "keyPoint": "ローマ美術は「そっくりに写す写実」と「権威を演出する理想化」を使い分けた点がギリシアと異なる。", "startYear": -509, "endYear": 476, "eraLabel": "古代ローマ（前509年〜後476年）", "creator": "不明（宮廷彫刻家の工房）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Augustus_of_Prima_Porta.jpg?width=1000", "imageCredit": "Till Niermann ほか、public domain / CC BY-SA（撮影者により異なる）", "imageLink": "https://commons.wikimedia.org/wiki/File:Augustus_of_Prima_Porta.jpg", "body": [{"label": "プリマポルタのアウグストゥス", "text": "初代皇帝アウグストゥスを、老いを感じさせない若々しい理想化された姿で描いた等身大彫刻（前1世紀）。鎧に刻まれた図像は帝国の栄光を寓意的に表し、彫刻が政治宣伝の道具として使われた典型例。"}, {"label": "庶民の写実的肖像", "text": "一方で市民階級の肖像彫刻には、しわや禿頭までありのまま写し取る徹底した写実（ヴェリズモ）の伝統もあり、権威像とは対照的な「もう一つのローマ美術」を見せる。"}], "relatedTopics": [{"concept": "ancient-greek-sculpture", "relation": "源流"}, {"concept": "roman-arch-and-dome", "relation": "なかま"}, {"concept": "byzantine-icon-art", "relation": "関連"}], "referencedBy": [{"id": "ancient-greek-sculpture", "title": "古代ギリシア彫刻", "field": "art"}, {"id": "byzantine-icon-art", "title": "ビザンティン美術（イコン）", "field": "art"}, {"id": "roman-arch-and-dome", "title": "ローマ建築（アーチとドーム）", "field": "architecture"}]}, {"id": "romanesque-architecture", "title": "ロマネスク建築", "aka": "Romanesque Architecture", "field": "architecture", "area": "古代〜中世建築", "section": "", "headline": "分厚い壁と小さな窓、巡礼路が生んだ「石の要塞」教会", "summary": "11〜12世紀の西ヨーロッパで広まった建築様式。ローマ建築のアーチ技術を再評価しつつ、石造の重厚な天井（ヴォールト）を支えるために壁を極めて厚くし、窓を小さくせざるを得なかった。その結果、堅牢で薄暗い、要塞のような重厚さが特徴になった。巡礼路沿いに多くの教会・修道院が建てられ、巡礼者を受け入れる大規模な空間設計も発達した。", "keyPoint": "ロマネスク建築の「厚い壁・小さな窓」という制約が、後のゴシック建築の技術革新（飛梁）を生む動機になった。", "startYear": 1000, "endYear": 1150, "eraLabel": "ロマネスク期（11〜12世紀）", "creator": "不明（各地の修道院工房）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Pisa_Cathedral_%26_Leaning_Tower_of_Pisa.jpg?width=1000", "imageCredit": "Florian Hirzinger, CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Pisa_Cathedral_%26_Leaning_Tower_of_Pisa.jpg", "body": [{"label": "ピサ大聖堂と斜塔", "text": "イタリア・ピサの大聖堂群（大聖堂・洗礼堂・鐘楼）はロマネスク建築の代表例。付属の鐘楼（ピサの斜塔）は建設中から地盤沈下で傾き始め、意図せず世界的に有名な建造物になった。"}, {"label": "なぜ壁が厚いのか", "text": "石造の重い屋根（ヴォールト）を支えるには、側面の壁が横方向への力（推力）に耐える厚さを持つ必要があった。この構造的制約が窓の小ささ＝内部の薄暗さに直結していた。"}], "relatedTopics": [{"concept": "byzantine-architecture", "relation": "関連"}, {"concept": "romanesque-art", "relation": "なかま"}, {"concept": "gothic-architecture", "relation": "関連"}], "referencedBy": [{"id": "byzantine-architecture", "title": "ビザンティン建築", "field": "architecture"}, {"id": "gothic-architecture", "title": "ゴシック建築", "field": "architecture"}, {"id": "romanesque-art", "title": "ロマネスク美術", "field": "art"}]}, {"id": "romanesque-art", "title": "ロマネスク美術", "aka": "Romanesque Art", "field": "art", "area": "古代〜中世美術", "section": "", "headline": "巡礼路の教会を飾った、素朴で力強い彫刻群", "summary": "11〜12世紀、西ヨーロッパの巡礼路沿いの教会を中心に発展した美術様式。人体プロポーションの写実性よりも、見る者に強い感情的インパクトを与える誇張された表現を特徴とし、特に教会入口の半円形装飾（タンパン）には「最後の審判」など恐怖と救済を訴える彫刻が刻まれた。文字を読めない民衆に信仰内容を伝える「石の聖書」としての役割も担った。", "keyPoint": "ロマネスクの彫刻はプロポーションが崩れていても「稚拙」ではなく、感情を伝えるための意図的なデフォルメ。", "startYear": 1000, "endYear": 1150, "eraLabel": "ロマネスク期（11〜12世紀）", "creator": "ジスレベルトゥス（オータン大聖堂タンパン）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Autun_St_Lazare_Tympanon.jpg?width=1000", "imageCredit": "Lamettrie, CC BY-SA 3.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Autun_St_Lazare_Tympanon.jpg", "body": [{"label": "オータン大聖堂の「最後の審判」", "text": "フランス・オータンの聖ラザール大聖堂正面タンパンに刻まれた、天秤で魂の重さを量るキリストと、天国へ昇る魂・地獄へ引きずられる魂を描いた大作。制作者ジスレベルトゥスの署名が残る、中世では珍しい「作者が分かる」作品。"}, {"label": "「石の聖書」としての教会彫刻", "text": "文字を読めない当時の民衆にとって、教会の彫刻や壁画は聖書の物語や罪と救済の教えを視覚的に伝える最大のメディアだった。"}], "relatedTopics": [{"concept": "byzantine-icon-art", "relation": "関連"}, {"concept": "romanesque-architecture", "relation": "なかま"}, {"concept": "gothic-art", "relation": "関連"}], "referencedBy": [{"id": "gothic-art", "title": "ゴシック美術", "field": "art"}, {"id": "romanesque-architecture", "title": "ロマネスク建築", "field": "architecture"}]}, {"id": "romanticism-painting", "title": "ロマン主義絵画", "aka": "Romantic Painting (Delacroix, Goya)", "field": "art", "area": "近代美術（ロマン主義〜印象派）", "section": "", "headline": "理性より感情、劇的な色彩とうねる構図で情熱を描く", "summary": "新古典主義の理性的で静的な構図に反発し、19世紀前半に台頭したロマン主義絵画は、劇的な事件、異国情緒、激しい感情の表出を、鮮烈な色彩と躍動的な構図で描いた。ドラクロワは同時代の政治的事件を寓意的な女神像とともに描き、ゴヤは戦争の残酷さを容赦なく直視する作品を残すなど、理性では割り切れない人間の情念や社会の暴力性に正面から向き合った点が特徴。", "keyPoint": "ロマン主義絵画にとって「絵の具の乱れた筆致」自体が、感情の激しさを伝える表現手段だった。", "startYear": 1800, "endYear": 1850, "eraLabel": "ロマン主義（19世紀前半）", "creator": "ウジェーヌ・ドラクロワ、フランシスコ・デ・ゴヤ", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Eug%C3%A8ne_Delacroix_-_Le_28_Juillet._La_Libert%C3%A9_guidant_le_peuple.jpg?width=1000", "imageCredit": "Eugène Delacroix, 1830年, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Eug%C3%A8ne_Delacroix_-_Le_28_Juillet._La_Libert%C3%A9_guidant_le_peuple.jpg", "body": [{"label": "「民衆を導く自由の女神」", "text": "1830年の七月革命を題材に、半裸の女神「自由」が三色旗を掲げ民衆を率いる姿を描いた作品。歴史的事件と寓意的人物を組み合わせる手法は、ロマン主義の代表的な語り口となった。"}, {"label": "ゴヤの「戦争の惨禍」", "text": "ロマン主義の先駆けとされるゴヤは、ナポレオン軍の侵攻による虐殺を生々しく描いた連作版画「戦争の惨禍」で、英雄的な戦争画とは正反対の、戦争の悲惨さそのものを直視する表現を切り開いた。"}], "relatedTopics": [{"concept": "neoclassicism-art", "relation": "対立する"}, {"concept": "realism-art-courbet", "relation": "関連"}, {"concept": "romanticism", "relation": "なかま"}], "referencedBy": [{"id": "english-romantic-poetry", "title": "イギリス・ロマン派詩人（ワーズワース・バイロン）", "field": "literature"}, {"id": "goethe-sturm-und-drang", "title": "ゲーテと疾風怒濤・『若きウェルテルの悩み』", "field": "literature"}, {"id": "neoclassicism-art", "title": "新古典主義美術", "field": "art"}, {"id": "realism-art-courbet", "title": "写実主義（クールベ）", "field": "art"}]}, {"id": "romanticism", "title": "ロマン主義", "aka": "Romanticism", "field": "thought", "area": "近代思想の源流", "headline": "理性より感情・個性・自然を重んじた反啓蒙の潮流", "summary": "ロマン主義は18世紀末〜19世紀にヨーロッパで広がった思想・芸術運動で、啓蒙思想が重んじた普遍的理性や合理的秩序に対し、個人の感情・想像力・民族固有の伝統・自然の崇高さを対置した。理性で割り切れない情熱や内面性を肯定し、後のナショナリズムや実存主義にも影響を与えた。", "keyPoint": "「理性で測れないもの」に価値を見出した点で、ロマン主義は啓蒙思想への強い反動だった。", "body": [{"label": "感情と個性の称揚", "text": "啓蒙が普遍的な「人類」を語ったのに対し、ロマン主義は「かけがえのない個人」の感情や創造性を重視した。"}, {"label": "民族文化への注目", "text": "各民族固有の言語・神話・伝説を「その民族の魂の表現」として重んじる姿勢が、のちのナショナリズムの文化的土台になった。"}], "relatedTopics": [{"concept": "enlightenment-thought", "relation": "対立する"}], "referencedBy": [{"id": "american-transcendentalism", "title": "アメリカ超越主義", "field": "thought"}, {"id": "goethe-sturm-und-drang", "title": "ゲーテと疾風怒濤・『若きウェルテルの悩み』", "field": "literature"}, {"id": "romanticism-painting", "title": "ロマン主義絵画", "field": "art"}]}, {"id": "rorty-neopragmatism", "title": "ローティの新プラグマティズム", "aka": "Rorty's Neopragmatism", "field": "thought", "area": "プラグマティズムとアメリカ思想", "headline": "「真理との対応」という発想そのものを手放す現代の議論", "summary": "ローティの新プラグマティズムは、20世紀後半にジェイムズやデューイの発想を受け継ぎつつ、「知識は世界をありのままに映す鏡である」という伝統的な認識論の前提そのものを手放そうとする立場。真理を世界との対応関係としてではなく、その時代・共同体の中で「有用な会話の継続」を支えるものとして捉え直し、ポストモダンの相対主義とも重なる議論を展開した。", "keyPoint": "「知識は世界を正しく映す鏡だ」という発想自体を疑い、真理を共同体内の有用な会話として捉え直した。", "body": [{"label": "「自然の鏡」批判", "text": "ローティは著書『哲学と自然の鏡』で、精神が世界を正確に映し出す鏡であるという近代認識論の基本的な比喩そのものを批判し、認識論中心の哲学からの脱却を提唱した。"}, {"label": "リベラル・アイロニー", "text": "ローティは、自分の信じる価値観が最終的な根拠を持たないと自覚しながらも、それでもリベラルな価値へのコミットメントを続ける「リベラル・アイロニスト」という生き方を提案した。"}], "relatedTopics": [{"concept": "dewey-instrumentalism", "relation": "なかま"}, {"concept": "postmodernism", "relation": "関連"}], "referencedBy": []}, {"id": "rule-of-law", "title": "法の支配", "aka": "Rule of Law", "field": "politics", "area": "政治哲学史", "headline": "権力者も含め誰もが法に従うべきだとする統治の原則", "summary": "法の支配は、統治者を含むすべての人が、恣意的な権力ではなくあらかじめ定められた法に従わなければならないとする原則。「人の支配」(統治者の意のままの支配)と対比され、権力の恣意的な行使から個人の自由と権利を守るための、近代立憲主義の根幹をなす考え方である。", "keyPoint": "「誰が統治するか」ではなく「統治者も法に従うかどうか」が自由な社会を支える。", "body": [{"label": "人の支配との対比", "text": "「人の支配」の下では統治者の意思そのものが法になりうるのに対し、「法の支配」の下では統治者自身もあらかじめ定められた法に拘束される点が決定的に異なる。"}, {"label": "立憲主義との結びつき", "text": "法の支配は、権力を憲法によって制限し、権力分立や司法審査によってその実効性を担保しようとする立憲主義の考え方と密接に結びついている。"}], "relatedTopics": [{"concept": "separation-of-powers", "relation": "なかま"}, {"concept": "sovereignty", "relation": "関連"}], "referencedBy": [{"id": "separation-of-powers", "title": "権力分立", "field": "politics"}]}, {"id": "russian-literature-dostoevsky-tolstoy", "title": "ロシア文学（ドストエフスキー・トルストイ）", "aka": "Russian Literature (Dostoevsky, Tolstoy)", "field": "literature", "area": "ロマン主義〜写実主義・自然主義文学（19世紀）", "section": "", "headline": "魂の深淵と歴史の大河を同時に描く、19世紀最高峰の小説", "summary": "19世紀後半のロシアは、世界文学史上でも屈指の巨匠を輩出した。ドストエフスキーは『罪と罰』『カラマーゾフの兄弟』で、殺人・信仰・自由意志といった極限的なテーマを通じて人間の魂の深い葛藤を描き出し、実存主義文学の先駆けともされる。トルストイは『戦争と平和』『アンナ・カレーニナ』で、個人の運命と歴史的事件（ナポレオン戦争など）を壮大なスケールで織り合わせ、19世紀リアリズム小説の頂点の一つを築いた。両者とも西欧のリアリズムを吸収しつつ、ロシア独自の宗教的・道徳的な問いを深く掘り下げた点が特徴。", "keyPoint": "ドストエフスキーとトルストイは対照的な作風でありながら、いずれも「人はいかに生きるべきか」という道徳的な問いを小説という形式で真正面から追求した点で共通する。", "startYear": 1860, "endYear": 1880, "eraLabel": "ロシア文学黄金時代（19世紀後半）", "creator": "フョードル・ドストエフスキー、レフ・トルストイ", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Dostoevsky_1872.jpg?width=1000", "imageCredit": "Vasily Perov, 1872年（ドストエフスキーの肖像）, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Dostoevsky_1872.jpg", "body": [{"label": "『罪と罰』の実験", "text": "「非凡な人間には法を超える権利がある」という思想に取り憑かれた青年が老婆を殺害した後の良心の呵責を追う物語は、犯罪心理の描写を通じて人間の倫理と自由意志の問題を根源から問い直した。"}, {"label": "『戦争と平和』の歴史観", "text": "トルストイは英雄個人の意志ではなく無数の人々の小さな行動の集積こそが歴史を動かすという独自の歴史観を作中で展開し、単なる歴史小説を超えた壮大な思想的スケールを持つ作品に仕上げた。"}], "relatedTopics": [{"concept": "naturalism-literature-zola", "relation": "なかま"}, {"concept": "existentialist-literature-camus-sartre", "relation": "源流"}], "referencedBy": [{"id": "existentialist-literature-camus-sartre", "title": "実存主義文学（カミュ・サルトル）", "field": "literature"}, {"id": "naturalism-literature-zola", "title": "自然主義文学（ゾラ）", "field": "literature"}]}, {"id": "sacrament", "title": "秘跡", "aka": "Sacrament", "field": "religion", "area": "キリスト教", "headline": "目に見える儀式を通して神の恵みが与えられるとするカトリックの制度", "summary": "秘跡(サクラメント)とは、洗礼・聖体(ミサ)・堅信・告解・叙階・婚姻・終油といった、目に見える儀式的な行為を通して、神の目に見えない恵みが実際に信者にもたらされるとするカトリック・正教会の制度。プロテスタントの多くは洗礼と聖餐の二つに限定する。", "keyPoint": "「儀式そのものに恵みを媒介する力がある」とみなす点が、信仰のみを強調するプロテスタントとの違い。", "body": [{"label": "七つの秘跡", "text": "カトリック教会は洗礼・堅信・聖体・告解(ゆるし)・叙階・婚姻・病者の塗油の七つを秘跡と定め、人生の節目ごとに教会が介在する仕組みを作った。"}, {"label": "儀礼としての普遍性", "text": "儀式を通じて聖なるものと関わるという構造は、宗教人類学でいう「儀礼」の機能と重なり、秘跡はキリスト教における儀礼の代表例といえる。"}], "relatedTopics": [{"concept": "ritual", "relation": "具体例"}, {"concept": "justification-by-faith", "relation": "対立する"}], "referencedBy": [{"id": "justification-by-faith", "title": "信仰義認", "field": "religion"}]}, {"id": "sacred-and-profane", "title": "聖と俗", "aka": "Sacred and profane", "field": "religion", "area": "宗教学の基礎概念", "headline": "世界を「特別な領域」と「日常」に分ける宗教の基本構造", "summary": "宗教学者エリアーデらは、人間が世界を「聖なるもの」（特別な力を持ち日常から区別された領域）と「俗なるもの」（ありふれた日常）に分けて経験することが、宗教現象の核にあると論じた。神殿・儀礼・特定の時間（祭りの日）などは聖の領域に属し、そこに踏み込むには特別な作法が求められる。", "keyPoint": "「聖」を区切ることで、日常（俗）にリズムと意味を与えるのが宗教の一つの働き。", "body": [{"label": "聖なる空間と時間", "text": "神社の境内や教会堂のような「聖なる空間」、正月や祭礼のような「聖なる時間」は、日常の空間・時間から明確に区切られる。"}, {"label": "通過儀礼との関係", "text": "成人式や結婚式のような通過儀礼は、聖の力を借りて人の社会的な立場を切り替える装置として機能する。"}], "relatedTopics": [{"concept": "what-is-religion", "relation": "なかま"}], "referencedBy": [{"id": "taboo", "title": "タブー", "field": "culture-anthropology"}, {"id": "what-is-religion", "title": "宗教とは何か", "field": "religion"}]}, {"id": "secularization", "title": "世俗化", "aka": "Secularization", "field": "religion", "area": "宗教学の基礎概念", "headline": "近代社会で宗教の影響力が後退していく過程", "summary": "世俗化とは、近代化・産業化にともなって、政治・教育・科学などの社会領域が宗教的権威から独立し、個人の生活における宗教の役割も相対的に縮小していく過程を指す社会学の概念。ただし近年は、世俗化が一直線に進むとする単純な図式には批判も多く、宗教の「復権」や新しい形の信仰も各地で観察されている。", "keyPoint": "「宗教は近代化とともに消えていく」という単純な予測は、現実の多様さの前で修正を迫られている。", "body": [{"label": "世俗化テーゼ", "text": "ウェーバーらは近代化が宗教的な世界観を「脱魔術化」し、合理性が社会を覆っていくと論じた。"}, {"label": "世俗化への反論", "text": "アメリカなど宗教的活力が高い社会の存在や、宗教復興の事例から、世俗化は普遍的な法則ではないという再検討が進んでいる。"}], "relatedTopics": [{"concept": "what-is-religion", "relation": "関連"}], "referencedBy": [{"id": "magic-and-science", "title": "呪術と科学", "field": "culture-anthropology"}, {"id": "reformation-doctrinal-disputes", "title": "宗教改革の教義的対立", "field": "religion"}, {"id": "theocracy", "title": "神権政治", "field": "politics"}, {"id": "uchimura-kanzo-non-church", "title": "内村鑑三の無教会主義", "field": "thought"}]}, {"id": "security-dilemma", "title": "安全保障のジレンマ", "aka": "Security Dilemma", "field": "politics", "area": "国際政治", "headline": "自国の防衛のための軍備増強が、かえって他国を刺激し緊張を高めてしまう逆説", "summary": "安全保障のジレンマとは、ある国が純粋に自衛の目的で軍事力を増強しても、その意図を正確に知りえない周辺国はそれを脅威とみなして自らも軍備を増強し、結果として双方の安全が高まるどころか、互いへの不信と緊張がエスカレートしてしまうという国際政治の構造的な逆説を指す。軍拡競争が誰も望まないまま進んでしまう典型的なメカニズムとして説明される。", "keyPoint": "このジレンマの根本原因は、他国の軍事力が「防御用か攻撃用か」を外部から確実に見分けることが難しいという、意図の不透明性にある。", "body": [{"label": "意図の不透明性", "text": "ある国が新型兵器を配備した際、それが純粋な防衛目的であっても、他国からは将来の攻撃の準備と映る可能性があり、この意図の見分けにくさが、双方に疑心暗鬼と軍拡競争を招く根本的な要因となる。"}, {"label": "冷戦期の軍拡競争", "text": "米ソ冷戦期の核軍拡競争は、安全保障のジレンマの典型例としてしばしば引用され、双方が「相手に核で劣後してはならない」という自衛の論理から核兵器を増やし続けた結果、世界を何度も滅ぼせるほどの核戦力が積み上がった。"}], "relatedTopics": [{"concept": "balance-of-power", "relation": "関連"}, {"concept": "realism-and-liberalism-ir", "relation": "関連"}], "referencedBy": [{"id": "balance-of-power", "title": "勢力均衡", "field": "politics"}]}, {"id": "seikan-relations", "title": "政官関係（族議員と省庁）", "aka": "Politician-Bureaucrat Relations (Zoku Giin)", "field": "politics", "area": "日本政治", "headline": "特定政策分野に精通した国会議員が、担当省庁と密接に結びつき影響力を行使する構造", "summary": "政官関係とは、政治家（特に与党議員）と官僚機構との間の協力・緊張を含んだ相互作用の全体を指すが、日本ではとりわけ、農林・建設・厚生といった特定の政策分野に精通し、担当省庁や業界団体と長年にわたり密接な関係を築いた「族議員」が、その分野の政策形成・予算配分に強い影響力を行使する構造がしばしば注目されてきた。", "keyPoint": "族議員は専門知識を蓄積し政策の質を高める側面を持つ一方、業界団体の既得権益を代弁し、改革を阻む抵抗勢力になりやすいという両義的な評価を受けてきた。", "body": [{"label": "鉄の三角形", "text": "特定分野の族議員、担当省庁の官僚、業界団体の三者が、互いの利益（議員の集票・献金、官僚の予算・権限、業界の保護）のために協力し合う構造は「鉄の三角形」と呼ばれ、既得権益の温存につながりやすいと批判されてきた。"}, {"label": "改革の試み", "text": "派閥政治や族議員の影響力を弱め、首相官邸主導で政策決定を行う体制を強化する試みが橋本行革以降繰り返し行われてきたが、専門分野に精通した族議員の影響力そのものを完全になくすことは容易ではないとされる。"}], "relatedTopics": [{"concept": "japanese-bureaucracy", "relation": "なかま"}, {"concept": "1955-system", "relation": "関連"}], "referencedBy": []}, {"id": "seken-theory-abe-kinya", "title": "世間論（阿部謹也）", "aka": "Abe Kinya's Theory of Seken", "field": "culture-anthropology", "area": "日本文化人類学とフィールドワーク", "headline": "「社会」とは別に、日本人の行動を規定してきた身近な人間関係の圧力「世間」", "summary": "西洋中世史家の阿部謹也は、西洋の個人主義的な「社会（ソサエティ）」概念がそのまま日本に根付いているわけではなく、日本人の行動は実際には、自分と直接・間接につながりのある身近な人々からなる「世間」という、明文化されない独自の規範やしがらみによって強く規定されていると論じた。「世間体」「世間様に申し訳ない」といった言葉に表れるように、個人の行為の善悪よりも「世間からどう見られるか」が行動の判断基準になりやすいと指摘した。", "keyPoint": "阿部は、西洋近代由来の「個人」や「社会」という概念を無批判に日本にあてはめるのではなく、日本社会を実際に動かしている「世間」という固有の枠組みをまず正確に見極める必要があると訴えた。", "body": [{"label": "世間と社会の違い", "text": "「社会」が見知らぬ他者も含む抽象的で普遍的な公共の領域を指すのに対し、「世間」はあくまで自分と何らかの縁でつながった具体的な人間関係の網であり、その内部での評判や体面を強く気にする点が、日本的な人間関係の特徴として論じられる。"}, {"label": "贈与交換との関連", "text": "阿部は、世間の内部でお中元・お歳暮のような贈答儀礼が律儀に守られる背景に、モースが分析したような贈与の互酬性の原理が働いていると指摘し、日本の「世間」を人類学的な贈与論の視点からも読み解いた。"}], "relatedTopics": [{"concept": "what-is-society", "relation": "対立する"}, {"concept": "reciprocity", "relation": "関連"}], "referencedBy": []}, {"id": "semiotics", "title": "記号論", "aka": "Semiotics", "field": "thought", "area": "20世紀の思想", "headline": "言葉に限らず、あらゆる「記号」がどう意味を作るかを研究する学問", "summary": "記号論は、言語だけでなく、ファッション・広告・身振りなど、あらゆる「記号」が指し示すもの(意味されるもの)と結びつく仕組みを研究する学問。ソシュールの言語学とパースの記号論を源流に持ち、構造主義的な文化分析の重要な道具になった。", "keyPoint": "世界のあらゆる文化的な事象を、意味を生み出す「記号のシステム」として読み解く視点。", "body": [{"label": "シニフィアンとシニフィエ", "text": "ソシュールは、音や文字といった記号の形式面(シニフィアン)と、それが指し示す概念(シニフィエ)の結びつきは恣意的であり、社会的な約束事によって成り立つと論じた。"}, {"label": "バルトの神話作用", "text": "バルトは広告やレスリングのような大衆文化の記号を分析し、そこに歴史的・社会的に作られたイデオロギーが「自然な意味」であるかのように偽装されていく仕組み(神話作用)を暴いた。"}], "relatedTopics": [{"concept": "structuralism", "relation": "なかま"}, {"concept": "myth", "relation": "関連"}], "referencedBy": [{"id": "cultural-studies", "title": "カルチュラル・スタディーズ", "field": "sociology"}, {"id": "linguistic-turn", "title": "言語論的転回", "field": "thought"}, {"id": "structuralism", "title": "構造主義", "field": "thought"}, {"id": "theory-of-meaning", "title": "意味の理論", "field": "philosophy"}]}, {"id": "separation-of-powers", "title": "権力分立", "aka": "Separation of Powers", "field": "politics", "area": "政治哲学史", "headline": "立法・行政・司法を分けて互いに抑制させる統治の設計", "summary": "権力分立は、モンテスキューが体系化した統治原理で、立法権・行政権・司法権を異なる機関に分散させ、互いに抑制し合う(チェック・アンド・バランス)ことで、一つの機関に権力が集中し濫用されることを防ごうとする制度設計の考え方。近代立憲主義国家のほとんどがこの原理を統治機構の基本として採用している。", "keyPoint": "権力を「誰が使うか」ではなく「一箇所に集めないこと」自体によって濫用を防ごうとする発想。", "body": [{"label": "モンテスキューの分析", "text": "モンテスキューは『法の精神』で、イギリスの統治のあり方を分析し、立法・行政・司法の三権が分立し互いを牽制することで、自由が守られると論じた。"}, {"label": "チェック・アンド・バランス", "text": "各権力機関が互いの行き過ぎを監視・抑制する仕組み(チェック・アンド・バランス)を組み込むことで、権力の集中と濫用を制度的に防ぐことを目指す。"}], "relatedTopics": [{"concept": "the-state", "relation": "関連"}, {"concept": "rule-of-law", "relation": "なかま"}], "referencedBy": [{"id": "japanese-constitution-government-structure", "title": "日本国憲法の統治機構", "field": "politics"}, {"id": "rule-of-law", "title": "法の支配", "field": "politics"}]}, {"id": "shakespeare-drama", "title": "シェイクスピア劇", "aka": "Shakespearean Drama", "field": "literature", "area": "ルネサンス〜啓蒙時代の文学", "section": "", "headline": "人間心理の深淵を描き尽くした、英語文学最大の劇作家", "summary": "エリザベス朝イングランドで活躍したシェイクスピアは、『ハムレット』『マクベス』『オセロー』『リア王』の四大悲劇をはじめ、喜劇・史劇を含む約37篇の戯曲を残し、英語文学史上最も影響力の大きい作家とされる。復讐・嫉妬・野心・老いといった普遍的な人間の情念を、韻文の卓越した言語表現と重層的な人物造形で描き出し、後世の文学・演劇・映画に至るまで、あらゆる物語創作の参照点であり続けている。", "keyPoint": "シェイクスピアが生み出した表現・言い回しの多くは現代英語に定着しており、彼は文学者であると同時に「英語という言語そのものを作った人物」でもある。", "startYear": 1590, "endYear": 1613, "eraLabel": "エリザベス朝〜ジェームズ朝（1590〜1613年頃）", "creator": "ウィリアム・シェイクスピア", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/ShakespeareFXD.jpg?width=1000", "imageCredit": "シャンドス肖像（伝ウィリアム・シェイクスピア）, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:ShakespeareFXD.jpg", "body": [{"label": "四大悲劇", "text": "『ハムレット』（優柔不断と復讐）、『マクベス』（野心と罪悪感）、『オセロー』（嫉妬）、『リア王』（老いと忘恩）は、それぞれ異なる人間の弱さを主題にしながら、いずれも普遍的な悲劇性に到達しているとされる。"}, {"label": "ファースト・フォリオ", "text": "シェイクスピアの死後7年目の1623年、同僚俳優たちの手によって編纂された戯曲全集「ファースト・フォリオ」がなければ、『マクベス』を含む彼の戯曲の約半数はそもそも現存していなかったとされる。"}], "relatedTopics": [{"concept": "boccaccio-decameron", "relation": "関連"}, {"concept": "greek-tragedy", "relation": "源流"}, {"concept": "cervantes-don-quixote", "relation": "なかま"}], "referencedBy": [{"id": "boccaccio-decameron", "title": "ボッカッチョ『デカメロン』", "field": "literature"}, {"id": "cervantes-don-quixote", "title": "セルバンテス『ドン・キホーテ』", "field": "literature"}]}, {"id": "shamanism", "title": "シャーマニズム", "aka": "Shamanism", "field": "culture-anthropology", "area": "宗教人類学", "headline": "トランス状態で霊的世界と交信する専門家をめぐる信仰", "summary": "シャーマニズムは、シャーマンと呼ばれる専門的な媒介者が、トランス(恍惚)状態に入ることで精霊や祖先の霊など超自然的な存在と直接交信し、共同体のために病気治療や占い、儀礼を行う信仰・実践の体系を指す。シベリアの狩猟民族の研究に起源を持つ概念だが、世界各地の類似した宗教現象を分析する枠組みとして広く用いられている。", "keyPoint": "制度化された聖職者ではなく、トランス状態で霊的世界と直接交信する個人を中心に成り立つ信仰の型。", "body": [{"label": "脱魂型と憑依型", "text": "シャーマンの霊的交信は、シャーマン自身の魂が肉体を離れて霊界へ赴く「脱魂型」と、霊がシャーマンの身体に乗り移る「憑依型」に大別されることが多い。"}, {"label": "共同体における役割", "text": "シャーマンは病気治療、失われた魂の回収、狩猟の成否の占いなど、共同体の実際的な問題解決を担う存在として機能し、単なる宗教的権威にとどまらない社会的役割を持つ。"}], "relatedTopics": [{"concept": "what-is-religion", "relation": "なかま"}, {"concept": "animism", "relation": "関連"}], "referencedBy": [{"id": "animism", "title": "アニミズム", "field": "culture-anthropology"}]}, {"id": "sharia", "title": "シャリーア", "aka": "Sharia", "field": "religion", "area": "イスラーム", "headline": "クルアーンとハディースに基づくイスラームの法体系", "summary": "シャリーアは、クルアーンと預言者の言行(ハディース)を根本の法源とするイスラームの包括的な規範体系。刑事・民事にとどまらず、礼拝や食事、婚姻など生活全般を律する点で、宗教と法が分離した近代西洋の法概念とは前提が大きく異なる。", "keyPoint": "シャリーアは「宗教法」であると同時に生活規範そのものであり、政教分離を前提とする世俗法とは発想の出発点が違う。", "body": [{"label": "法源と解釈(フィクフ)", "text": "クルアーン・ハディースを一次法源とし、そこから法学者が推論して具体的な規則を導く営みをフィクフ(イスラーム法学)と呼び、学派ごとに解釈が異なる。"}, {"label": "現代国家との関係", "text": "シャリーアをどこまで国家の実定法に組み込むかは国によって大きく異なり、世俗法との併存や部分的適用など多様な形をとっている。"}], "relatedTopics": [{"concept": "natural-law", "relation": "関連"}, {"concept": "jihad", "relation": "関連"}], "referencedBy": [{"id": "jihad", "title": "ジハードの多義性", "field": "religion"}, {"id": "theocracy", "title": "神権政治", "field": "politics"}]}, {"id": "shinto-buddhist-syncretism", "title": "神仏習合", "aka": "Shinbutsu-shūgō", "field": "religion", "area": "儒教・道教・神道", "headline": "日本古来の神々と外来の仏教信仰が融合し、共存してきた宗教的なあり方", "summary": "神仏習合とは、仏教が日本に伝来して以降、在来の神道の神々と仏教の仏・菩薩が対立せず融合していった宗教現象を指す。神は仏が人々を救うために仮に姿を現したもの（権現）とする「本地垂迹説」が代表的な理論で、明治初期の神仏分離令・廃仏毀釈によって制度的に分けられるまで、多くの神社と寺院は一体的に運営されていた。", "keyPoint": "明治政府による神仏分離は、この千年以上続いた融合状態を国家神道の確立のために人為的に断ち切った近代の政治的な出来事だった点に注意が必要。", "body": [{"label": "本地垂迹説", "text": "日本の神々は、仏や菩薩（本地）が衆生を救済するために日本の風土に合わせて仮の姿（垂迹）として現れたものだとする理論で、例えば天照大神は大日如来の化身とされるなど、神仏の対応関係が体系的に整理された。"}, {"label": "修験道", "text": "神仏習合を背景に、山岳信仰と仏教の密教的な要素が融合して成立したのが修験道であり、山伏と呼ばれる修行者が霊山での厳しい修行を通じて悟りや験力を得ようとした。"}], "relatedTopics": [{"concept": "shinto-kami-and-yaoyorozu", "relation": "関連"}, {"concept": "mahayana-and-theravada-buddhism", "relation": "関連"}], "referencedBy": [{"id": "shinto-kami-and-yaoyorozu", "title": "氏神と八百万の神", "field": "religion"}]}, {"id": "shinto-kami-and-yaoyorozu", "title": "氏神と八百万の神", "aka": "Ujigami and Yaoyorozu no Kami", "field": "religion", "area": "儒教・道教・神道", "headline": "あらゆる自然物・現象に神が宿るとするアニミズム的な神道の世界観", "summary": "神道は、山・川・岩・木といった自然物や、祖先、優れた功績を残した人物など、あらゆるものに神性（八百万の神）が宿りうるとする多神教的でアニミズム的な世界観を持つ。中でも「氏神」は、特定の地域や血縁集団（氏族）を守護する神であり、共同体の結びつきと信仰が一体になっている点が特徴。", "keyPoint": "神道には統一的な教義書や絶対的な唯一神がなく、地域ごとの自然崇拝と祖先崇拝が積み重なって多様な神々の体系を形作っている。", "body": [{"label": "氏神と鎮守の森", "text": "もともと氏神は特定の氏族の祖先神を指したが、後には地域の守護神一般を指すようになり、その地に住む人々（氏子）が神社を中心に共同体としてのまとまりを保つ役割を果たしてきた。"}, {"label": "神仏習合との関係", "text": "日本では長く神道の神々と仏教の仏・菩薩が同一視される神仏習合が進み、明治期の神仏分離令まで、多くの神社が寺院と一体的に運営されていた。"}], "relatedTopics": [{"concept": "animism", "relation": "なかま"}, {"concept": "shinto-buddhist-syncretism", "relation": "関連"}, {"concept": "monotheism-and-polytheism", "relation": "対立する"}], "referencedBy": [{"id": "motoori-norinaga-kokugaku", "title": "本居宣長の国学", "field": "thought"}, {"id": "shinto-buddhist-syncretism", "title": "神仏習合", "field": "religion"}, {"id": "shinto-shrine-architecture", "title": "神社建築（神明造・大社造）", "field": "architecture"}]}, {"id": "shinto-shrine-architecture", "title": "神社建築（神明造・大社造）", "aka": "Shinto Shrine Architecture", "field": "architecture", "area": "日本建築史", "section": "", "headline": "仏教伝来より前からの、日本固有の「素木」の建築様式", "summary": "仏教建築が朝鮮半島経由で伝わる以前から存在した日本固有の建築様式が神社建築。伊勢神宮に代表される「神明造」は、掘立柱・切妻屋根・素木のままの木肌を活かし、彩色や複雑な装飾を排した簡素さと清浄さを特徴とする。出雲大社の「大社造」など地域ごとの様式も存在し、これらは仏教建築の影響をほとんど受けない、日本列島固有の建築の古層を今に伝えている。", "keyPoint": "伊勢神宮は20年ごとに社殿を全く同じ形で建て替える「式年遷宮」という制度により、古代の建築様式そのものを1300年以上「新築」の状態で保存し続けている。", "startYear": -300, "endYear": 700, "eraLabel": "弥生〜飛鳥時代（起源は弥生時代の高床倉庫に遡るとされる）", "creator": "（伝統的な宮大工技術による）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/IseShrine.jpg?width=1000", "imageCredit": "伊勢神宮, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:IseShrine.jpg", "body": [{"label": "式年遷宮という制度", "text": "伊勢神宮は20年に一度、隣接する敷地に全く同じ形式の社殿を新たに建て、旧社殿を取り壊す。これにより建築様式だけでなく、宮大工の技術そのものも世代を超えて継承され続けている。"}, {"label": "掘立柱と切妻屋根", "text": "礎石を使わず柱を直接地面に埋め込む「掘立柱」形式と、本を伏せたような単純な三角形の「切妻屋根」の組み合わせは、日本建築のもっとも古い形態の一つとされる。"}], "relatedTopics": [{"concept": "buddhist-temple-architecture-japan", "relation": "対立する"}, {"concept": "shinto-kami-and-yaoyorozu", "relation": "なかま"}], "referencedBy": [{"id": "buddhist-temple-architecture-japan", "title": "寺院建築の伝来", "field": "architecture"}, {"id": "tange-kenzo-modern-architecture", "title": "丹下健三と日本の近代建築", "field": "architecture"}]}, {"id": "shoin-zukuri", "title": "書院造", "aka": "Shoin-zukuri", "field": "architecture", "area": "日本建築史", "section": "", "headline": "畳・床の間・襖、和室のイメージの原型を作った武家の住宅様式", "summary": "室町時代後期から江戸時代にかけて発展した、武家住宅の様式。床全体に畳を敷き詰め、絵や書を飾る「床の間」、棚を設けた「違い棚」、書見台を兼ねた「付書院」といった座敷飾りを整え、部屋を襖や障子で仕切る構成を確立した。現代日本人が「和室」としてイメージする空間の基本形は、この書院造にほぼ由来しており、寺院建築の要素（禅宗建築の付書院など）を住宅に取り込んで発展した点も特徴的。", "keyPoint": "「床の間に掛け軸を飾る」という今も続く日本の住空間の作法は、書院造の座敷飾りがその後何百年もかけて庶民の住宅にまで広がった結果である。", "startYear": 1400, "endYear": 1650, "eraLabel": "室町後期〜江戸初期（15〜17世紀）", "creator": "（武家住宅の様式として発展、特定の個人によらない）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Kuroshoin_of_Ninomaru-Goden_Hall_of_Nijo_Castle.JPG?width=1000", "imageCredit": "二条城 二の丸御殿 黒書院, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Kuroshoin_of_Ninomaru-Goden_Hall_of_Nijo_Castle.JPG", "body": [{"label": "二条城二の丸御殿", "text": "江戸幕府の京都の拠点として建てられたこの御殿群には、格式の高い「大広間」から将軍の私的空間「黒書院」まで、書院造の空間構成が段階的に整理された形でよく残っている。"}, {"label": "床の間・違い棚・付書院", "text": "この3つの座敷飾りは「三具足」とも呼ばれ、掛け軸や生花、書物や文具を飾ることで、部屋の主の教養や身分を可視化する装置として機能した。"}], "relatedTopics": [{"concept": "zen-buddhism", "relation": "源流"}, {"concept": "castle-architecture-japan", "relation": "なかま"}, {"concept": "sukiya-architecture", "relation": "対立する"}], "referencedBy": [{"id": "castle-architecture-japan", "title": "城郭建築", "field": "architecture"}, {"id": "sukiya-architecture", "title": "数寄屋建築", "field": "architecture"}]}, {"id": "simmel-formal-sociology", "title": "ジンメルの形式社会学", "aka": "Simmel's Formal Sociology", "field": "sociology", "area": "主要理論家", "headline": "社会の「中身」ではなく、人と人の関わり方の「型」を取り出して分析する", "summary": "ジンメルは、社会学が扱うべきなのは家族・国家といった具体的な集団の中身そのものではなく、支配と服従、競争、秘密の共有など、さまざまな集団に共通して現れる相互作用の「形式」であると論じ、都市生活や貨幣といった身近な現象を鋭く分析した。", "keyPoint": "「誰と誰の関係か」ではなく「どんな型の関係か」に注目するのがジンメルの形式社会学。", "body": [{"label": "大都市と精神生活", "text": "ジンメルは、大都市の住人が絶え間ない刺激から自分を守るために、他人に無関心な「冷淡な態度」を身につけると分析し、都市社会学の先駆けとなった。"}, {"label": "貨幣の哲学", "text": "貨幣によってあらゆるものの価値が数量に換算可能になることが、人間関係を計算高く、非人格的なものに変えていく、というジンメルの分析は消費社会論にも影響を与えた。"}], "relatedTopics": [{"concept": "social-structure", "relation": "関連"}, {"concept": "role-and-status", "relation": "関連"}], "referencedBy": []}, {"id": "simulacra-baudrillard", "title": "シミュラークル", "aka": "Simulacra (Baudrillard)", "field": "sociology", "area": "メディア・文化社会学", "headline": "オリジナルなきコピーが現実そのものに取って代わるという概念", "summary": "シミュラークルとは、ボードリヤールが用いた概念で、もはや何かの模造品・複製ではなく、オリジナルの存在しないコピー、あるいはコピーがオリジナルよりもリアルに感じられてしまう記号を指す。テーマパークやテレビの「現実」報道、ブランドイメージなどが、現実そのものよりも現実らしく感じられる状態を「ハイパーリアル」と呼び、現代社会では現実と虚構の境界そのものが融解していると論じた。", "keyPoint": "ディズニーランドをボードリヤールは「本物のアメリカ」の虚構性を隠すための偽物として例に挙げ、現実の方こそがシミュラークル的に構成されていると逆説的に論じた。", "body": [{"label": "シミュラークルの4段階", "text": "ボードリヤールはイメージが現実を「反映する」段階から、現実を「歪める」段階、現実の「不在を隠す」段階を経て、最終的に現実と何 せる行為そのものである。", "keyPoint": "言葉には「事実を述べる」だけでなく「発言することで何かを行う」働きがある。", "body": [{"label": "遂行文", "text": "オースティンは「私はこの船を○○号と命名する」のように、発言することがそのまま行為の実行になる文を遂行文と呼び、真偽を問える事実確認文と区別した。"}, {"label": "発語内行為", "text": "サールは発言の力を、発語行為(音を発する)・発語内行為(約束や命令として働く)・発語媒介行為(相手に実際の影響を与える)に分けて分析した。"}], "relatedTopics": [{"concept": "theory-of-meaning", "relation": "なかま"}, {"concept": "language-anthropology", "relation": "関連"}], "referencedBy": [{"id": "theory-of-meaning", "title": "意味の理論", "field": "philosophy"}]}, {"id": "spinoza-pantheism", "title": "スピノザの汎神論", "aka": "Spinoza's Pantheism", "field": "philosophy", "area": "西洋哲学史（近代〜現代）", "headline": "神と自然（宇宙）はイコールであり、唯一の実体しか存在しないという説", "summary": "スピノザは、デカルトが精神と物質を別々の実体としたのに対し、実体はただ一つ、それが「神即自然（デウス・シヴェ・ナトゥーラ）」であるとする一元論を唱えた。神とは人格を持って世界の外から創造する存在ではなく、あらゆる事物がそこから必然的に生じる自然そのものであり、精神も物質も、この唯一の実体の異なる現れ方（属性）にすぎないとした。", "keyPoint": "すべての出来事は神即自然の必然的な法則から生じるとする徹底した必然論に立ち、その必然性を理性で認識することこそが真の自由であるとした。", "body": [{"label": "一元論", "text": "デカルトの心身二元論を批判し、精神と物質は別々の実体ではなく、唯一無限の実体（神即自然）が持つ無数の属性のうち、人間が認識できる2つの側面（延長と思惟）にすぎないとした。"}, {"label": "「神即自然」への反響", "text": "人格神を否定するかに見えるこの汎神論は、当時「無神論」として激しい非難を浴びたが、後にロマン主義の詩人や哲学者たちからは、神と自然を一体とする神秘的な自然観として再評価された。"}], "relatedTopics": [{"concept": "descartes-cogito", "relation": "対立する"}, {"concept": "free-will-and-determinism", "relation": "関連"}], "referencedBy": []}, {"id": "starchitect-phenomenon", "title": "スターアーキテクト現象", "aka": "The \"Starchitect\" Phenomenon", "field": "architecture", "area": "20世紀後半〜現代建築", "section": "", "headline": "建築家の個人名がブランドになり、都市が競って誘致する時代", "summary": "1990年代以降、フランク・ゲーリーやザハ・ハディドのように、独自の造形言語を持つ一部の建築家がグローバルなメディアで著名人（スター）のように扱われ、その建築家の名前自体が都市や施設の価値を高めるブランドとして機能する現象が顕著になった。世界中の都市が「ビルバオ効果」の再現を狙って著名建築家に地標建築（ランドマーク）の設計を依頼する一方、建築が地域の文脈よりも建築家個人の作家性を優先しがちになるとして批判も呼んでいる。", "keyPoint": "スターアーキテクト現象は、建築を「都市計画の一部」から「観光資源としてのアイコン」へと位置づけを変えた、21世紀特有の現象。", "startYear": 1997, "endYear": 2020, "eraLabel": "スターアーキテクト現象（1990年代後半〜現在）", "creator": "フランク・ゲーリー、ザハ・ハディド、レム・コールハースほか", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Walt_Disney_Concert_Hall_2013.jpg?width=1000", "imageCredit": "Frank Gehry, 2003年（「ウォルト・ディズニー・コンサートホール」）, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Walt_Disney_Concert_Hall_2013.jpg", "body": [{"label": "「ウォルト・ディズニー・コンサートホール」", "text": "ロサンゼルスのランドマークとなったこのコンサートホールは、ビルバオ・グッゲンハイムと同じくゲーリーが手がけたステンレス製の波打つ外観を持ち、都市が著名建築家の作品を「顔」として求める傾向を象徴する一例。"}, {"label": "批判的視点", "text": "スターアーキテクト建築は建設費が予算を大幅に超過することが多く、また地域の伝統や周辺との調和よりも建築家の個性的な造形が優先されがちだとして、都市計画の専門家から批判の声も上がっている。"}], "relatedTopics": [{"concept": "deconstructivism-architecture", "relation": "なかま"}, {"concept": "parametric-architecture", "relation": "なかま"}, {"concept": "contemporary-art-market", "relation": "関連"}], "referencedBy": [{"id": "deconstructivism-architecture", "title": "脱構築主義建築", "field": "architecture"}, {"id": "parametric-architecture", "title": "パラメトリック建築", "field": "architecture"}]}, {"id": "stoicism", "title": "ストア派", "aka": "Stoicism", "field": "philosophy", "area": "西洋哲学史（古代〜中世）", "headline": "理性に従い、感情に動じない心の平静を目指す哲学", "summary": "ストア派はヘレニズム期にゼノンが創始した哲学で、宇宙は理性（ロゴス）に貫かれた秩序ある全体であり、人間もその理性に従って生きることこそ徳であると説く。自分の力でコントロールできることとできないことを区別し、コントロールできない外的な出来事に一喜一憂しない心の平静（アパテイア）を理想とした。", "keyPoint": "「変えられるものと変えられないものを区別し、変えられないものは受け入れる」という発想は、現代の認知行動療法にも影響を与えている。", "body": [{"label": "アパテイア", "text": "財産・名声・健康・死といった外的な出来事は自分の意志ではコントロールできないため、それに執着したり動揺したりすることは理性的でないとし、感情に振り回されない平静な心の状態（アパテイア）を理想とした。"}, {"label": "世界市民主義", "text": "ストア派は、すべての人間が共通の理性（ロゴス）を分かち持つ存在であるとして、出身や身分を超えた「世界市民（コスモポリタン）」という考え方の源流にもなった。"}], "relatedTopics": [{"concept": "epicureanism", "relation": "対立する"}, {"concept": "free-will-and-determinism", "relation": "関連"}, {"concept": "cosmopolitanism", "relation": "源流"}], "referencedBy": [{"id": "cosmopolitanism", "title": "コスモポリタニズム", "field": "culture-anthropology"}, {"id": "epicureanism", "title": "エピクロス派", "field": "philosophy"}]}, {"id": "structuralism", "title": "構造主義", "aka": "Structuralism", "field": "thought", "area": "20世紀の思想", "headline": "個人の主体性より、その背後にある無意識の「構造」に注目する思想", "summary": "構造主義は、人間の思考や行動、文化的な現象は、個々人の自由な意志(主体)によってではなく、その背後にある言語・親族関係・神話などの目に見えない体系的な「構造」によって規定されていると考える20世紀の思想潮流。ソシュールの言語学を出発点に、レヴィ=ストロースが人類学に応用して広まった。", "keyPoint": "「私が考える」のではなく「構造が私を通して考えさせる」という、主体中心の近代思想へのラディカルな異議申し立て。", "body": [{"label": "ソシュールの言語学", "text": "ソシュールは、言葉の意味は他の言葉との違い(差異)の体系の中で決まるのであり、個々の語が単独で意味を持つわけではないと論じ、構造主義の方法論的な基礎を築いた。"}, {"label": "レヴィ=ストロースと親族・神話", "text": "レヴィ=ストロースは、一見バラバラに見える諸民族の親族関係や神話にも共通する構造的な規則があることを示し、実存主義的な主体中心の思想に対抗した。"}], "relatedTopics": [{"concept": "existentialism", "relation": "対立する"}, {"concept": "myth", "relation": "関連"}, {"concept": "semiotics", "relation": "なかま"}], "referencedBy": [{"id": "linguistic-turn", "title": "言語論的転回", "field": "thought"}, {"id": "post-structuralism", "title": "ポスト構造主義", "field": "thought"}, {"id": "semiotics", "title": "記号論", "field": "thought"}]}, {"id": "subaltern-spivak", "title": "サバルタン（スピヴァク）", "aka": "Subaltern (Spivak)", "field": "thought", "area": "フェミニズムとポストコロニアル思想", "headline": "支配的な言説の中で、自らの声で語ることを許されない従属的な人々", "summary": "「サバルタン」はもともとグラムシが下層階級を指した軍事用語だが、ガヤトリ・スピヴァクは植民地状況下の被支配者、特に植民地の女性のように、支配的な言説の構造そのものによって声を奪われ、自ら語る主体として認識されない存在を指す概念として発展させた。論文「サバルタンは語ることができるか」で、西洋の知識人がサバルタンを「代弁」しようとする行為自体が、彼らを再び客体化してしまう危うさを鋭く指摘した。", "keyPoint": "善意で他者を代弁しようとする行為でさえ、その他者を再び「語られる客体」に押し込めてしまう危険があるという、代弁の政治学の根本的な逆説を提起した。", "body": [{"label": "代弁の逆説", "text": "知識人がサバルタンの声を代弁しようとすればするほど、その代弁行為自体が「代弁する側」と「代弁される側」という非対称な権力関係を再生産してしまい、サバルタン自身の言葉で語る可能性がかえって塞がれてしまうというジレンマをスピヴァクは指摘した。"}, {"label": "複合的な従属性", "text": "スピヴァクは特に植民地における女性を、植民地支配とジェンダー支配という二重の従属関係に置かれた存在として注目し、単一の抑圧軸だけでは捉えられない複合的な権力構造を分析する必要性を訴えた。"}], "relatedTopics": [{"concept": "orientalism-said", "relation": "なかま"}, {"concept": "intersectionality", "relation": "関連"}], "referencedBy": [{"id": "intersectionality", "title": "交差性（インターセクショナリティ）", "field": "thought"}, {"id": "orientalism-said", "title": "オリエンタリズム（サイード）", "field": "thought"}]}, {"id": "subculture-theory", "title": "サブカルチャー論", "aka": "Subculture Theory", "field": "sociology", "area": "メディア・文化社会学", "headline": "主流文化の枠外で、特定の集団が独自の価値観やスタイルを作る現象を読み解く", "summary": "サブカルチャー論は、パンク、モッズ、ヒップホップといった、主流社会（メインカルチャー）とは異なる独自の価値観・ファッション・音楽・言語を持つ若者集団の文化を研究する社会学の分野。バーミンガム学派のカルチュラル・スタディーズは、サブカルチャーを単なる若者の逸脱行動としてではなく、階級的な不満やアイデンティティの模索に対する象徴的・創造的な「抵抗」の表現として読み解いた。", "keyPoint": "サブカルチャーは服装や音楽といったスタイルを通じて、既存の意味を組み替え、独自のアイデンティティを主張する「ブリコラージュ（有り合わせのものからの創造）」の実践として分析される。", "body": [{"label": "抵抗としてのスタイル", "text": "ディック・ヘブディジらは、パンクの安全ピンや破れた服といった一見無意味に見えるスタイルが、既存の秩序や中産階級的な価値観に対する象徴的な異議申し立てとして機能していると論じた。"}, {"label": "サブカルチャーの商業化", "text": "当初は反抗的・周縁的だったサブカルチャーのスタイルも、時間が経つとファッション産業に取り込まれて商品化され、当初の反抗的な意味合いが薄れていくという「主流への回収」の過程もしばしば指摘される。"}], "relatedTopics": [{"concept": "cultural-studies", "relation": "源流"}, {"concept": "deviance", "relation": "関連"}], "referencedBy": [{"id": "cultural-studies", "title": "カルチュラル・スタディーズ", "field": "sociology"}]}, {"id": "sufism", "title": "スーフィズム", "aka": "Sufism", "field": "religion", "area": "イスラーム", "headline": "神との直接的な合一を求めるイスラーム神秘主義", "summary": "スーフィズムは、儀礼や法の遵守だけでなく、瞑想や唱念(ズィクル)、旋回舞踊などの実践を通じて神との内的・直接的な合一を目指すイスラームの神秘主義的潮流。教団(タリーカ)を中心に師から弟子へと修行が伝えられ、詩人ルーミーなど豊かな文学的伝統も生み出した。", "keyPoint": "外面的な戒律の遵守だけでなく、内面での神との合一体験を重視する点が特徴。", "body": [{"label": "唱念(ズィクル)と旋回舞踊", "text": "神の名を繰り返し唱えるズィクルや、トルコのメヴレヴィー教団に代表される旋回舞踊(セマー)は、恍惚状態の中で神との一体感を得るための実践として知られる。"}, {"label": "法学者との緊張関係", "text": "法(シャリーア)の厳格な遵守を重視する法学者たちとの間には歴史的に緊張関係もあったが、多くのスーフィー教団はシャリーアの実践を前提とした上で内的な深化を目指した。"}], "relatedTopics": [{"concept": "soteriology", "relation": "関連"}, {"concept": "six-articles-and-five-pillars", "relation": "なかま"}], "referencedBy": []}, {"id": "suiboku-ink-painting", "title": "水墨画（雪舟）", "aka": "Suiboku Ink Painting (Sesshū)", "field": "art", "area": "日本美術史", "section": "", "headline": "墨一色の濃淡だけで、山水の奥行きと精神性を描く", "summary": "鎌倉〜室町時代、禅宗とともに中国から伝わった水墨画は、色彩を用いず墨の濃淡・筆致だけで自然の風景や精神性を表現する様式として日本で独自に発展した。禅僧でもあった雪舟は中国（明）に渡って本場の技法を学んだ上で、日本の自然観に根ざした独自の水墨山水画を確立し、以後の日本絵画の精神的な基盤の一つとなった。", "keyPoint": "水墨画にとって「余白」は描かれていない空白ではなく、それ自体が意 , "area": "都市社会学とグローバル化", "headline": "移民が出身国と移住先の両方に生活の基盤を持ち続ける生き方", "summary": "トランスナショナリズムとは、移民が移住先の社会に一方的に同化するのではなく、通信・交通技術の発達を背景に、出身国と移住先国の双方にまたがる社会的・経済的・文化的つながりを日常的に維持し続ける生き方や社会関係のあり方を指す社会学の概念。送金、頻繁な帰省、SNSでの故郷との交流などを通じて、国境を越えた「トランスナショナルな社会空間」が形成される。", "keyPoint": "従来の移民研究が「出身国か移住先か」という一方向的な同化を前提にしていたのに対し、トランスナショナリズムは複数の場所に同時に根を持つ生き方を正面から捉え直した。", "body": [{"label": "送金というつながり", "text": "移民が母国の家族に送る送金（remittance）は、多くの途上国にとって重要な外貨収入源となっており、個人の家族的なつながりが国家経済にまで影響を及ぼす、トランスナショナルなつながりの具体例として論じられる。"}, {"label": "デジタル技術の役割", "text": "SNSやビデオ通話の普及により、移民は物理的に離れていても母国の家族・友人と日常的にリアルタイムでつながり続けることが可能になり、これが同化の圧力を弱め、複数の帰属意識を保つことを後押ししているとされる。"}], "relatedTopics": [{"concept": "immigrants-and-ethnic-community", "relation": "なかま"}, {"concept": "diaspora", "relation": "なかま"}], "referencedBy": [{"id": "diaspora", "title": "ディアスポラ", "field": "culture-anthropology"}, {"id": "global-city-theory", "title": "グローバルシティ論", "field": "sociology"}, {"id": "transnational-community", "title": "トランスナショナル・コミュニティ", "field": "culture-anthropology"}]}, {"id": "trinity", "title": "三位一体", "aka": "Trinity", "field": "religion", "area": "キリスト教", "headline": "父・子・聖霊は三つの位格を持つ唯一の神であるとする教義", "summary": "三位一体は、父(神)・子(キリスト)・聖霊という三つの「位格」が、本質において分割不可能な唯一の神であるとするキリスト教の中心教義。人間の理性では説明しきれない神秘とされつつ、325年のニケア公会議などを経て正統教義として確立された。", "keyPoint": "「神は一つ、しかし位格は三つ」という、一神教のなかでも独特な神理解が三位一体。", "body": [{"label": "成立の経緯", "text": "イエスの神性をめぐる論争(アリウス派など)を経て、ニケア公会議(325年)やコンスタンティノープル公会議で三位一体論が正統教義として確立された。"}, {"label": "一神教としての位置づけ", "text": "イスラームやユダヤ教が神の単一性を厳格に保つのに対し、キリスト教は三位一体という形で唯一神信仰と、父・子・聖霊それぞれへの信仰を両立させている点が神学上の特徴。"}], "relatedTopics": [{"concept": "monotheism-and-polytheism", "relation": "関連"}, {"concept": "what-is-religion", "relation": "関連"}], "referencedBy": [{"id": "original-sin", "title": "原罪", "field": "religion"}]}, {"id": "trolley-problem", "title": "トロッコ問題", "aka": "Trolley Problem", "field": "philosophy", "area": "倫理学", "headline": "「一人を犠牲にして五人を救うべきか」を問う倫理学の思考実験", "summary": "トロッコ問題は、暴走するトロッコの進路を切り替えれば五人の作業員を救えるが、その先にいる一人を犠牲にすることになる、という状況で「レバーを引くべきか」を問う倫理学の代表的な思考実験。人を直接突き落として止める版など変奏があり、直観的な判断が帰結主義的な計算と食い違う点が議論の的になる。", "keyPoint": "「多数を救うために一人を犠牲にしてよいか」という帰結主義と義務論の対立を極限まで単純化した思考実験。", "body": [{"label": "レバー版と歩道橋版", "text": "レバーを引いて進路を変える版では多くの人が「引くべき」と答えるが、太った男を突き落として止める版では同じ「一人の犠牲で五人を救う」構造でも多くの人が拒否感を示す。この非対称性が倫理学の重要な論点になっている。"}, {"label": "自動運転への応用", "text": "近年は自動運転車が事故回避時に誰を優先すべきかという現実の設計問題として、トロッコ問題の枠組みが応用されている。"}], "relatedTopics": [{"concept": "consequentialism", "relation": "関連"}, {"concept": "deontology", "relation": "関連"}], "referencedBy": [{"id": "consequentialism", "title": "帰結主義", "field": "philosophy"}]}, {"id": "tyranny", "title": "僭主政", "aka": "Tyranny", "field": "politics", "area": "政治体制とイデオロギー", "headline": "非合法な手段で権力を奪い、独裁的に支配する古典的政体", "summary": "僭主政とは、古代ギリシアの政体論に由来する概念で、正統な手続きによらず実力や扇動によって権力を奪取した一人の支配者が、自己の利益のために独裁的に統治する体制。アリストテレスはこれを君主政(公共の利益のための一人支配)の堕落形態と位置づけた。現代の「独裁」概念の古典的な原型にあたる。", "keyPoint": "古代ギリシアの「僭主(テュランノス)」は、必ずしも暴虐な支配者を意味せず、当初は単に「非世襲・非合法に権力を得た者」を指す中立的な語だった。", "body": [{"label": "ポリスと僭主", "text": "古代ギリシアの都市国家(ポリス)では、貴族政や寡頭制への民衆の不満を背景に、人気を得た指導者が実力で権力を握る僭主政がしばしば出現した。"}, {"label": "近代への継承", "text": "「僭主政」という古典的な語彙は、近代以降「独裁」「全体主義」といった概念に引き継がれ、正統性を欠いた権力集中を批判する伝統的な枠組みを提供している。"}], "relatedTopics": [{"concept": "dictatorship-and-totalitarianism", "relation": "源流"}, {"concept": "monarchy", "relation": "対立する"}, {"concept": "aristocracy", "relation": "関連"}], "referencedBy": []}, {"id": "uchimura-kanzo-non-church", "title": "内村鑑三の無教会主義", "aka": "Uchimura Kanzō's Non-Church Movement", "field": "thought", "area": "日本思想史", "headline": "制度化された教会に頼らず、聖書と個人の信仰だけで結ばれるキリスト教のあり方", "summary": "内村鑑三は、洗礼や聖餐といった儀式や教会という組織を媒介にせず、聖書と個人の直接的な信仰の関係のみでキリスト者たりうるとする「無教会主義」を唱えた日本のキリスト教思想家。「二つのJ」（イエスと日本）を愛すると述べたように、西洋の教会制度にそのまま従うのではなく、日本人としての精神性を保ちながら独自にキリスト教を受容しようとした。", "keyPoint": "教育勅語への拝礼を拒否した「不敬事件」に象徴されるように、内村は国家権力や既成の権威に対しても、自らの信仰的良心を貫く姿勢を一貫して示した。", "body": [{"label": "無教会主義の背景", "text": "内村は、教会という制度そのものが権威主義化し、形式的な儀式が信仰の本質を覆い隠してしまう危険を批判し、聖書研究会などを通じて信徒同士が対等に学び合う、組織にとらわれない信仰共同体のあり方を模索した。"}, {"label": "不敬事件", "text": "1891年、教育勅語奉読式で天皇の署名に最敬礼をしなかったとして内村は激しい社会的批判にさらされたが、この事件は彼の信仰的な誠実さと、国家神道的な同調圧力に屈しない思想的独立性を象徴する出来事として記憶されている。"}], "relatedTopics": [{"concept": "soteriology", "relation": "関連"}, {"concept": "secularization", "relation": "対立する"}], "referencedBy": []}, {"id": "ukiyo-e", "title": "浮世絵", "aka": "Ukiyo-e", "field": "art", "area": "日本美術史", "section": "", "headline": "江戸の庶民文化が生んだ、木版画による大量生産美術", "summary": "江戸時代、都市に生きる庶民の日常・遊里・歌舞伎役者・風景といった「浮世（今を生きる現世）」を描いた版画・肉筆画のジャンル。木版画は絵師・彫師・摺師の分業体制により安価に大量生産することができ、庶民でも手が届く価格で流通した点が、王侯貴族のための一点物の絵画とは決定的に異なる。歌麿の美人画、写楽の役者絵、北斎・広重の風景画などジャンルごとに専門絵師が活躍し、19世紀後半には西洋美術にも大きな影響（ジャポニスム）を与えた。", "keyPoint": "浮世絵は「絵師の芸術」であると同時に、彫師・摺師の技術と版元（出版社）の商才が三位一体となって成立する、江戸のメディア産業でもあった。", "startYear": 1660, "endYear": 1868, "eraLabel": "江戸時代（17〜19世紀）", "creator": "喜多川歌麿、東洲斎写楽、葛飾北斎、歌川広重", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Toshusai_Sharaku-_Otani_Oniji,_1794.jpg?width=1000", "imageCredit": "東洲斎写楽, 1794年（「三代目大谷鬼次の奴江戸兵衛」）, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Toshusai_Sharaku-_Otani_Oniji,_1794.jpg", "body": [{"label": "写楽の役者絵", "text": "わずか10か月ほどの活動期間で140点余りの役者絵を残し忽然と姿を消した謎の絵師、写楽。役者の顔を誇張して描く「大首絵」の手法で、歌舞伎役者の個性を強烈に印象づけた。"}, {"label": "分業による版画制作", "text": "浮世絵版画は、下絵を描く絵師、それを版木に彫る彫師、色を重ねて刷る摺師という3つの専門職の分業で作られ、版元がこの全体をプロデュースする、高度に組織化された制作システムだった。"}], "relatedTopics": [{"concept": "kano-school", "relation": "対立する"}, {"concept": "japonisme", "relation": "なかま"}], "referencedBy": [{"id": "japonisme", "title": "ジャポニスム", "field": "art"}, {"id": "nihonga-yoga-debate", "title": "日本画と洋画の論争", "field": "art"}]}, {"id": "urbanization-and-anomie", "title": "都市化とアノミー", "aka": "Urbanization and Anomie", "field": "sociology", "area": "都市社会学とグローバル化", "headline": "都市への人口集中が伝統的な規範の緩みと無規制状態を生むという議論", "summary": "農村から都市への急速な人口移動（都市化）は、伝統的な共同体が持っていた密接な人間関係や共有された規範を弱め、人々を匿名的で流動的な社会関係の中に置く。デュルケームが指摘したように、こうした急激な社会変動の中で共通の規範が機能不全に陥る状態（アノミー）が生じやすく、都市部での犯罪や自殺率の上昇と関連づけて論じられてきた。", "keyPoint": "都 it": "Titian, 1520-1523年, public domain", "imageLink": "https://commons.wikimedia.org/wiki/File:Titian_Bacchus_and_Ariadne.jpg", "body": [{"label": "「バッカスとアリアドネ」", "text": "見捨てられたアリアドネのもとに酒神バッカスが駆けつける瞬間を、鮮烈な青と赤の対比で劇的に描いた代表作。輪郭を溶かし込むような色彩の扱いはヴェネツィア派の到達点を示す。"}, {"label": "油彩技法の革新", "text": "ヴェネツィア派は油絵具を薄く何層にも重ねる技法（グレーズ）を発達させ、これにより深みのある透明感のある色彩表現が可能になった。"}], "relatedTopics": [{"concept": "high-renaissance-art", "relation": "なかま"}, {"concept": "baroque-chiaroscuro", "relation": "関連"}], "referencedBy": [{"id": "baroque-chiaroscuro", "title": "バロックの明暗法（カラヴァッジオ）", "field": "art"}, {"id": "high-renaissance-art", "title": "盛期ルネサンス美術", "field": "art"}]}, {"id": "versailles-absolutism-architecture", "title": "ヴェルサイユ宮殿と絶対王政の建築", "aka": "Palace of Versailles and Absolutist Architecture", "field": "architecture", "area": "ルネサンス〜近世建築", "section": "", "headline": "「朕は国家なり」を、庭園と鏡の間で視覚化する", "summary": "フランス絶対王政の頂点ルイ14世が、狩猟用の館を世界最大級の宮殿に改築させたヴェルサイユ宮殿は、建築そのものが王権の絶対性を演出する政治装置だった。左右対称に整形された広大な庭園、太陽をモチーフにした装飾、そして「鏡の間」に代表される豪華絢爛な室内装飾は、訪れるすべての人に王の権威を体感させることを目的に設計されている。この様式は以後ヨーロッパ各国の宮廷建築の模範となった。", "keyPoint": "ヴェルサイユの庭園の幾何学的秩序は、自然さえも王の理性によって統制されるという絶対王政の世界観を空間で表現したもの。", "startYear": 1661, "endYear": 1715, "eraLabel": "フランス絶対王政期（17世紀後半〜18世紀初頭）", "creator": "ルイ・ル・ヴォー、ジュール・アルドゥアン＝マンサール（建築）、アンドレ・ル・ノートル（庭園）", "imageUrl": "https://commons.wikimedia.org/wiki/Special:FilePath/Hall_of_mirrors_at_Chateau_de_Versailles.jpg?width=1000", "imageCredit": "ヴェルサイユ宮殿「鏡の間」, Wikimedia Commons", "imageLink": "https://commons.wikimedia.org/wiki/File:Hall_of_mirrors_at_Chateau_de_Versailles.jpg", "body": [{"label": "「鏡の間」", "text": "全長73mの回廊に357枚の鏡を配し、庭園からの自然光を反射させて宮殿内を眩いばかりに照らすこの空間は、当時最先端だったガラス製造技術の粋を集めた、王の富と権力を象徴する舞台装置だった。"}, {"label": "幾何学式庭園", "text": "ル・ノートルが設計した庭園は、遠近法を計算し尽くした直線的な園路と幾何学模様の花壇で構成され、宮殿のバルコニーから見渡すと視覚的に無限に続くかのような効果を生み出す。"}], "relatedTopics": [{"concept": "baroque-architecture", "relation": "なかま"}, {"concept": "absolute-monarchy", "relation": "なかま"}, {"concept": "rococo-architecture", "relation": 性）だけから捉えるのではなく、モンスーン・砂漠・牧場という3つの類型に代表される気候・地理的環境（風土）との相互的な関わりの中で人間の精神性や文化が形作られるという「風土性」の観点から捉え直そうとした。", "keyPoint": "風土は単なる外的な自然環境ではなく、その中で生きる人間の自己理解や文化のあり方そのものを規定する、人間存在に内在する契機として捉えられる。", "body": [{"label": "モンスーン・砂漠・牧場", "text": "和辻は世界の風土を、湿潤で受容的・忍従的な性格を育む「モンスーン型」、乾燥した過酷な環境で対立的・戦闘的な性格を育む「砂漠型」、温和で自然を従順に統御する「牧場型」の3つに大別し、それぞれの気候が育む人間の精神性の違いを論じた。"}, {"label": "ハイデガーへの応答", "text": "和辻はハイデガーの現存在の分析が個人の時間性を中心にしていることに対し、人間は常に他者や自然環境との「間柄（あいだがら）」の中で存在しているとし、空間的・風土的な契機を補うことで日本的な人間観を哲学的に体系化しようとした。"}], "relatedTopics": [{"concept": "heidegger-being-and-time", "relation": "批判する"}], "referencedBy": [{"id": "heidegger-being-and-time", "title": "ハイデガーの存在と時間", "field": "philosophy"}]}, {"id": "waves-of-feminism", "title": "第一波〜第三波フェミニズム", "aka": "Waves of Feminism", "field": "thought", "area": "フェミニズムとポストコロニアル思想", "headline": "参政権から構造批判、多様性の承認へと広がってきたフェミニズムの歴史的展開", "summary": "フェミニズムは大きく波として語られる。19世紀末〜20世紀初頭の「第一波」は女性参政権など法的な権利の獲得を目指した。1960〜80年代の「第二波」は「個人的なことは政治的なこと」を掲げ、家庭や職場、性的規範に埋め込まれた構造的な男女不平等そのものを批判した。1990年代以降の「第三波」は、女性という括り自体の多様性（人種・階級・性的指向による違い）を重視し、単一の「女性の経験」を前提とすることに疑問を投げかけた。", "keyPoint": "波が進むごとに、フェミニズムの対象は「制度上の権利」から「見えない構造」、そして「女性というカテゴリー自体の多様性」へと掘り下げられていった。", "body": [{"label": "第二波の「個人的なことは政治的なこと」", "text": "家事分担、性暴力、身体の自己決定権といった一見「私的」な問題が、実は社会の権力構造によって形作られた政治的な問題であるという第二波フェミニズムのスローガンは、公私の境界そのものを問い直す大きな転換をもたらした。"}, {"label": "第三波と交差性", "text": "第三波フェミニズムは、白人中産階級の女性の経験を前提にしていた従来のフェミニズムを批判し、人種・階級・性的指向など複数の抑圧が交差する経験の違いを重視する交差性の視点を取り入れていった。"}], "relatedTopics": [{"concept": "intersectionality", "relation": "なかま"}, {"concept": "gender-and-sex-distinction", "relation": "関連"}], "referencedBy": [{"id": "ecofeminism", "title": "エコフェミニズム", "field": "thought"}, {"id": "gender-and-sex-distinction", "title": "ジェンダーとセックスの区別", "field": "thought"}, {"id": "intersectionality", "title": "交差性（インターセクショナリティ）", "field": "thought"}]}, {"id": "weber-bureaucracy-and-rationalization", "title": "ウェーバーの官僚制と合理化", "aka": "Weber's Bureaucracy and Rationalization", "field": "sociology", "area": "主要理論 const AREA_GUIDE = {
  "哲学の基本問題": "哲学はまず「そもそも何が存在するのか」という{{ontology-what-is-being}}から出発する。存在を問うと、次に「それをどうやって知ることができるのか」という{{epistemology-what-is-knowledge}}が浮かぶ——存在論と認識論は哲学の両輪。知る主体である「心」と、知られる対象である「身体・物質」の関係を突き詰めると{{mind-body-problem}}にたどり着く。心が物理法則に従うだけなら、人間の選択は本当に「自由」なのか——ここから{{free-will-and-determinism}}の対立が生まれる。\n\n一方、知識を積み上げるには「個々のもの」だけでなく「共通する性質」も扱う必要があり、その性質(普遍)が実在するかを争うのが{{problem-of-universals}}。出来事と出来事を結びつける「原因と結果」という発想そのものを疑うのが{{causality}}の議論で、最後にこれら全ての土台——「そもそも何かを確実に知ることなどできるのか」——を突き崩すのが{{skepticism}}。哲学の基本問題は、突き詰めるとどれも懐疑論に行き着く。",
  "倫理学": "「何が正しい行為か」を考える規範倫理学には大きく3つの立場がある。行為そのものが道徳法則に従っているかを問う{{deontology}}、行為者の人格や習慣の卓越性に注目する{{virtue-ethics}}、そして行為の結果の善さで判断する{{consequentialism}}。この3つの対立を具体的に体感させる思考実験が{{trolley-problem}}で、「1人を犠牲にして5人を救ってよいか」を巡って義務論と帰結主義の立場の違いが浮き彫りになる。\n\n一方、規範倫理学が「何が正しいか」を論じるのに対し、「そもそも道徳的な言明とは何なのか、真偽を持つのか」という一段上の問いを立てるのが{{metaethics}}。その延長で「正しさは文化や個人によって異なるのか」を問うのが{{moral-relativism}}であり、逆に「時代や文化を超えて成り立つ普遍的な道徳法則がある」と考える伝統が{{natural-law}}——古代から続く自然法思想は義務論の源流のひとつでもある。",
  "論理学・言語哲学": "正しく考えるための土台は「正しい推論の形式」を知ることにある。前提から必然的に結論を導く演繹と、個別事例から一般法則を推測する帰納の違いを押さえる{{deduction-and-induction}}を土台に、推論の形式が誤っている典型パターンをカタログ化したのが{{logical-fallacies}}。ここから関心は「そもそも言葉はどうやって意味を持つのか」という{{theory-of-meaning}}に移り、さらに「言葉は事実を述べるだけでなく、発言そのものが行為になる」ことを指摘した{{speech-act-theory}}(約束や宣言など)へと広がる。意味の理論を精密化する中で、「言葉の意味だけで真偽が決まる文」と「経験的事実で真偽が決まる文」を区別できるかを争うのが{{analytic-synthetic-distinction}}。\n\n一見正しそうな推論から矛盾が導かれる{{logical-paradoxes}}は論理と言語の限界を突きつけ、最後に「意味は個人の心の中だけで完結しうるか」を問い、私秘的な言語は成立しないと論じたのが{{private-language-argument}}——意味は本質的に公共的な営みだという結論に至る。",
  "西洋哲学史（古代〜中世）": "西洋哲学は対話によって無知を自覚させる{{socratic-method}}から本格的に始まる。弟子プラトンはここから、感覚を超えた完全な「イデア」こそが真の実在だとする{{platos-theory-of-forms}}を打ち立てた。さらに弟子のアリストテレスはイデア論を退け、個物に内在する原因を4種に整理する{{aristotle-four-causes}}で経験的・現実的な世界の理解を目指した。\n\nこの後、混乱の時代のヘレニズム期には「いかに心の平静を得て生きるか」という実践哲学が花開く——理性に従い感情に動じないことを説く{{stoicism}}と、快楽(特に精神的な平穏)を善とする{{epicureanism}}が並び立つ。時代がキリスト教に移ると、人間の意志と神の恩寵の関係を問う{{augustine-grace-and-free-will}}が中心課題となり、中世末期にはアリストテレス哲学とキリスト教信仰を体系的に統合する{{aquinas-scholasticism}}によって古代哲学と中世神学が一つの大きな知の体系にまとめ上げられる。",
  "西洋哲学史（近代〜現代）": "近代哲学は、あらゆることを疑った末に「疑っている自分の存在だけは疑えない」と辿り着いた{{descartes-cogito}}から出発する。ここから「確実な知識の基盤をどこに置くか」という近代認識論の探求が始まり、経験論と合理論の対立を批判的に統合したのが{{kant-critical-philosophy}}——人間の理性がどこまで認識できるかの限界を画定した。この後ヘーゲルは、対立するものが統合されて次の段階に進むという{{hegel-dialectic}}によって歴史そのものを理性の自己展開として描いた。なお時代を遡るが、デカルトと同じ合理論の系譜から、神と自然を同一視する独自の一元論{{spinoza-pantheism}}を唱えたスピノザも近代哲学の重要な分岐点として押さえておきたい。\n\n20世紀に入ると、既存の価値を根底から問い直すニーチェの{{nietzsche-eternal-recurrence}}が壮大な理性体系への反発として登場し、「意識に現れる通りに事象そのものを厳密に記述する」{{husserl-phenomenology}}が新しい方法論として確立、その弟子筋にあたるハイデガーは人間存在(現存在)の時間性を分析する{{heidegger-being-and-time}}へと展開させた。",
  "宗教学の基礎概念": "宗教学はまず「宗教とは何か」という定義そのものを問う{{what-is-religion}}から始まる。デュルケームらは宗教の核心を、日常(俗)から区別された特別な領域である{{sacred-and-profane}}(聖と俗)の区分に見出した。世界の宗教を比較する最初の軸は、唯一の神を信じるか多くの神々を信じるかという{{monotheism-and-polytheism}}であり、一神教の多くは神が人間に直接語りかけたとする{{revealed-religion}}(啓示宗教)の形をとる。\n\n宗教が人々に提供する中心的な機能が「苦しみからの解放・救い」であり、これが{{soteriology}}(救済論)というテーマに結晶する。救済がどこで実現するかという問いは、死後の世界や生まれ変わりをめぐる{{afterlife-and-reincarnation}}の多様な考え方につながる。近代に入ると、こうした宗教的世界観が社会の中で影響力を弱めていく{{secularization}}(世俗化)という現象が、宗教学最大のテーマのひとつとして立ち現れる。",
  "キリスト教": "キリスト教の教義の中心には、父・子・聖霊は一つの神の三つの位格であるという{{trinity}}(三位一体)がある。人間の側の状況を説明するのが、アダムの堕罪以来すべての人間が生まれながらに罪を負うとする{{original-sin}}で、そこからの救いは行いではなく信仰によって与えられるという{{justification-by-faith}}の教理が導かれる——これが宗教改革で{{reformation-doctrinal-disputes}}として爆発し、カトリックとプロテスタントの分裂を決定づけた。改革派の中でも、誰が救われるかはあらかじめ神によって定められているという{{predestination}}(予定説)のように立場はさらに分岐する。\n\n教会の実践面では、神の恩寵を目に見える形で伝える儀式である{{sacrament}}(秘跡)が信仰生活の中心を担い、最後に、世界と個人の歴史がどう終わり、どう完成するのかを描く{{eschatology-christian}}(終末論)がキリスト教の時間観を締めくくる。",
  "イスラーム": "イスラームの信仰と実践の骨格は{{six-articles-and-five-pillars}}(六信五行)にまとめられる——何を信じ、何を行うかがここで定義される。預言者ムハンマドの後継者(カリフ)の正統性をめぐる対立が{{sunni-and-shia}}という二大宗派の分岐を生んだ。信仰と実践の細部は生活全般を律する法体系である{{sharia}}(シャリーア)によって規定され、その法源となるのが啓典と預言者の言行録{{quran-and-hadith}}(クルアーンとハディース)。「努力・奮闘」を意味し、内面の修養から防衛的な戦いまで幅広い意味を持つのが{{jihad}}で、しばしば誤解される多義的な概念。\n\n一方、法や教義を超えて神との合一を内面の修行で目指す神秘主義の潮流が{{sufism}}。政治的にはムハンマドの後継として共同体を統べる{{caliphate}}(カリフ制)の制度が、宗派対立とも絡みながらイスラーム史を貫く統治の理念であり続けた。",
  "仏教": "仏教の出発点は、ブッダが悟った「苦の構造とそこからの道」である{{four-noble-truths-eightfold-path}}(四諦八正道)。その苦の根本原因を説明する世界観が、すべては移ろい、固定した自己などないとする{{impermanence-and-non-self}}(無常と無我)であり、なぜあらゆる現象が生じては滅するのかを論理的に説くのが{{dependent-origination}}(縁起)。\n\nこの教えの実践・救済のあり方をめぐり、出家者の個人的な解脱を重視する上座部と、すべての衆生の救済を目指す{{mahayana-and-theravada-buddhism}}(大乗仏教と上座部仏教)へと分岐した。大乗の中でも、坐禅による直接体験を重視する{{zen-buddhism}}(禅)と、自力ではなく阿弥陀仏の力にすがる{{pure-land-faith}}(浄土信仰)という対照的な二つの道が発展した。そしてすべての実践が目指す最終到達点が、煩悩の火が吹き消された状態である{{nirvana}}(涅槃)である。",
  "儒教・道教・神道": "東アジアの思想的伝統は、儒教・道教・神道という三つの柱で捉えると見通しがよい。儒教の核心は、他者への思いやり(仁)とそれを表す作法(礼)である{{ren-and-li-confucianism}}で、家族倫理としての{{filial-piety}}(孝)がその土台をなす。これと対照的に、人為を捨てて自然の流れに身を委ねよと説くのが道家の{{dao-and-wuwei}}(道と無為自然)。世界を説明する共通の枠組みとして両者が共有したのが{{yin-yang-and-five-phases}}(陰陽五行思想)で、後に儒教は仏教・道教の宇宙論を取り込んで形而上学的に精緻化した{{neo-confucianism}}(朱子学)へと発展する。\n\n一方、日本固有の信仰である神道は八百万の神々を祀る{{shinto-kami-and-yaoyorozu}}(氏神と八百万の神)を核とし、伝来した仏教とは排斥し合うのではなく神と仏を同一視する{{shinto-buddhist-syncretism}}(神仏習合)という融和の形で長く共存した。",
  "社会学の基礎概念": "社会学はまず、個人の集まりを超えた「社会」という独自の実在をどう捉えるかという{{what-is-society}}の問いから始まる。社会を、個人の意思を超えて人々の行動を規定するパターンとして捉える視点が{{social-structure}}(社会構造)で、その構造の中で人々が上下に序列化される仕組みが{{social-stratification}}(社会階層)。構造の中で個人が占める位置とそこに期待される振る舞いを整理する概念が{{role-and-status}}(役割と地位)であり、人が社会のルールや役割をどう内面化していくかを説明するのが{{socialization}}(社会化)。\n\nしかし社会化は常に成功するとは限らず、規範からの逸脱である{{deviance}}が生まれる。社会の規範そのものが弱まったり矛盾したりして人々が方向感覚を失う状態を、デュルケームは{{anomie}}(アノミー)と呼び、社会学の基礎語彙の到達点とした。",
  "主要理論家": "社会学の三大古典理論家を軸に押さえる。デュルケームは、社会をまとめる力の源を分業の進展に求める{{durkheim-division-of-labor}}(社会分業論)を説き、さらに個人の意識に還元できない、社会それ自体の実在性を{{durkheim-social-facts}}(社会的事実)という概念で理論化した。マルクスは社会変動の原動力を、生産手段を持つ者と持たない者の対立である{{marx-class-struggle}}(階級闘争)に見出し、資本主義のもとで労働者が労働の産物や自分自身から疎遠になる{{marx-alienation}}(疎外論)を批判の核とした。\n\nウェーバーは近代社会の特徴を、規則と効率にもとづく組織形態である{{weber-bureaucracy-and-rationalization}}(官僚制と合理化)の浸透に見て、なぜ資本主義が西欧で発達したかを禁欲的な宗教倫理から説明する{{weber-protestant-ethic}}(プロテスタンティズムの倫理)を提示した。ジンメルはこれら巨視的理論とは異なり、社会を「相互作用の形式」として微視的に分析する{{simmel-formal-sociology}}(形式社会学)という独自の視点を切り開いた。",
  "家族社会学": "家族社会学は、産業化とともに登場した「愛情で結ばれた私的領域としての家族」という{{the-modern-family}}(近代家族)のモデルを出発点にする。この近代家族像は、夫が稼ぎ手・妻が家事育児という性別役割分業と結びついていたが、それが{{declining-birthrate-and-gender-roles}}(少子化とジェンダー役割)という現代の課題を生む一因となった。家庭内で担われてきたケア労働を社会全体で担おうとする動きが{{socialization-of-care}}(ケアの社会化)であり、その背景には男性が家長として権力を握る{{patriarchy}}(家父長制)という伝統的な家族構造への問い直しがある。\n\n世帯構成の変化としては、拡大家族から夫婦と子のみの{{nuclear-family-and-extended-family}}(核家族化)への移行が進み、さらに近年は結婚そのものをしない・できない{{singlehood-and-marriage-decline}}(未婚化・非婚化)が広がっている。こうした変化の中で、仕事と家庭生活の両立をどう実現するかという{{work-life-balance}}が現代家族社会学の実践的な焦点になっている。",
  "都市社会学とグローバル化": "都市社会学の出発点は、都市化にともなって伝統的な共同体の絆が弱まり人々が孤立する{{urbanization-and-anomie}}(都市化とアノミー)という問題意識にある。この初期の問いに実証的に取り組んだのが、都市を生態系のように区分し分析した{{chicago-school-urban-ecology}}(シカゴ学派の都市の生態学)。都市には多様な背景の人々が集まり、{{immigrants-and-ethnic-community}}(移民とエスニックコミュニティ)を形成していく。\n\nグローバル化が進むと国境を越えた経済格差である{{globalization-and-inequality}}(グローバル化と格差)が可視化される。この格差構造を世界規模の分業体制として説明する理論が{{world-systems-theory}}(世界システム論)であり、その中でも金融・情報機能が集積する特権的な都市を分析するのが{{global-city-theory}}(グローバルシティ論)。人やモノ、アイデンティティが国境を越えて行き来する現象全体を捉える概念が{{transnationalism}}(トランスナショナリズム)で、都市社会学とグローバル化研究をつなぐ鍵となる。",
  "メディア・文化社会学": "メディアが社会に与える影響を考える出発点は、メディアが何を伝えるかによって人々が「何について考えるか」を左右するという{{mass-media-and-public-opinion}}(マスメディアと世論)の議論。市民が理性的に議論し世論を形成する場という理想を描いたのが{{public-sphere-habermas}}(公共圏)だが、現代社会ではその公共圏が広告やメディアに侵食されているとも指摘される。\n\n消費社会に入ると、人々はモノの機能ではなく記号的な意味を消費するという{{consumer-society-baudrillard}}(消費社会論)の視点が重要になり、それを突き詰めると現実よりもコピー(記号)の方がリアルに感じられる{{simulacra-baudrillard}}(シミュラークル)という事態に至る。一方、若者が主流文化とは異なる独自のスタイルを作り出す現象を分析するのが{{subculture-theory}}(サブカルチャー論)で、これはメディアと大衆文化を批判的に読み解く{{cultural-studies}}(カルチュラル・スタディーズ)の重要な対象となった。こうしたメディア環境の中で、些細な出来事が過剰に恐怖として増幅される{{moral-panic}}(モラル・パニック)という現象もしばしば起こる。",
  "近代思想の源流": "近代思想の源流は、理性の力によって迷信や旧弊を打破しようとした{{enlightenment-thought}}(啓蒙思想)にある。啓蒙思想は政治の領域では、国家の正統性を人々の合意に求める{{social-contract-theory}}(社会契約論)を生み、倫理の領域では「最大多数の最大幸福」を基準とする{{utilitarianism}}(功利主義)を生んだ。人間の理性や進歩を信じる楽観的な啓蒙観は、歴史は理性的に進歩していくという{{idea-of-progress}}(進歩史観)や、人間そのものの尊厳と可能性を重視する{{humanism}}(ヒューマニズム)へと受け継がれる。\n\n一方でこの理性中心・普遍主義的な啓蒙に反発し、感情・個性・民族の固有性を重んじる{{romanticism}}(ロマン主義)が19世紀に台頭した。さらに20世紀には、抽象的な理性や本質ではなく「今ここに存在する個人」の選択と責任から出発する{{existentialism}}(実存主義)が、啓蒙的な理性中心主義そのものへの根本的な問い直しとして展開する。",
  "20世紀の思想": "20世紀の思想は、個人の意識や意図ではなく、その背後にある無意識の「構造」(言語・社会・神話などの体系)が人間の思考を規定すると考える{{structuralism}}(構造主義)から大きく動き出す。この発想の土台には、記号がどう意味を生み出すかを研究する{{semiotics}}(記号論)があった。構造主義はやがて、固定した構造そのものを疑い、意味の絶えざるずれや脱中心化を強調する{{post-structuralism}}(ポスト構造主義)へと展開する。\n\n同時期、科学的方法だけを知の基準とする{{positivism-and-its-critics}}(実証主義とその批判)をめぐる論争が起こり、これを社会批判の理論として引き受けたのがマルクス主義と精神分析を統合した{{frankfurt-school-critical-theory}}(フランクフルト学派の批判理論)。こうした一連の潮流を貫くのが、哲学の中心課題が「意識」から「言語」へと移ったという{{linguistic-turn}}(言語論的転回)であり、その先に大きな物語(進歩や理性への信頼)の終焉を告げる{{postmodernism}}(ポストモダン)が20世紀思想の一つの到達点として現れる。",
  "プラグマティズムとアメリカ思想": "アメリカ独自の思想の下地には、制度や権威よりも個人の直感と自然との一体感を重んじた{{american-transcendentalism}}(アメリカ超越主義)がある。その後、パースが「ある概念の意味はその実際の効果によって決まる」という{{peirce-pragmatic-maxim}}(プラグマティズムの格率)を提示し、これがプラグマティズムという学派の出発点となった。パースはまた、いかなる知識も将来訂正されうるという{{fallibilism-peirce}}(可謬主義)の立場を取り、絶対確実な真理という発想を退けた。\n\nジェイムズはこの格率を真理概念に応用し、「役に立つ・実際にうまくいく信念こそが真」とする{{james-pragmatic-theory-of-truth}}(真理のプラグマティズム論)を展開し、経験そのものの中に関係やつながりも含まれるとする{{radical-empiricism-james}}(徹底的経験論)を打ち立てた。デューイはこれを教育・社会思想に応用し、知識や概念を「問題解決の道具」とみなす{{dewey-instrumentalism}}(道具主義)を確立。20世紀後半には、ローティが真理の対応説を退け、プラグマティズムを言語論的転回後の哲学として再生させる{{rorty-neopragmatism}}(新プラグマティズム)を提唱した。",
  "フェミニズムとポストコロニアル思想": "フェミニズム思想は歴史的に大きく三つの波として展開してきた——参政権を求めた第一波から、家庭・労働・性の政治性を問うた第二波、多様性を重視する第三波へという{{waves-of-feminism}}の流れ。この理論的土台となったのが、生物学的な性と社会的に構築された性を分ける{{gender-and-sex-distinction}}(ジェンダーとセックスの区別)である。フェミニズムはやがて、女性の経験は人種・階級によって異なるという{{intersectionality}}(交差性)の視点を取り込み、単一の「女性」像を前提にすることの限界を乗り越えていった。\n\n同じ時期、西洋が「東洋」を実際とは異なる形で表象し支配を正当化してきたと批判する{{orientalism-said}}(オリエンタリズム)が{{postcolonialism}}(ポストコロニアリズム)という研究領域を切り開き、その中でも被支配者・周縁化された者は自らの声で語ることができるのかを問う{{subaltern-spivak}}(サバルタン)論はジェンダーと植民地主義批判を結びつける重要な結節点となった。さらに、女性の抑圧と自然の搾取を同じ支配構造の現れとみる{{ecofeminism}}(エコフェミニズム)は、フェミニズムを環境思想にまで広げる。",
  "日本思想史": "日本思想史は、江戸期に儒教・仏教といった外来思想を排し日本固有の心性を『古事記』『源氏物語』などから読み解こうとした{{motoori-norinaga-kokugaku}}(本居宣長の国学)から一つの起点を見出せる。明治維新後は一転して西洋文明の摂取が課題となり、独立自尊の精神と近代化を説いた{{fukuzawa-yukichi-civilization}}(福沢諭吉の文明論)が啓蒙思想を主導した。西洋化が進む中で改めて日本(あるいは人間一般)の固有性を問い直す動きも生まれ、風土が人間の精神や文化を規定するとした{{watsuji-fudo-theory}}(和辻哲郎の風土論)や、西洋哲学の枠組みと東洋的な「無」の思想を融合させた{{nishida-kyoto-school}}(西田幾多郎の京都学派)が独自の哲学を作り上げた。\n\n同じ頃、無名の職人が作る日常品にこそ美が宿るとした{{yanagi-mingei-movement}}(柳宗悦の民藝運動)や、教会という制度に頼らずキリスト教信仰を貫こうとした{{uchimura-kanzo-non-church}}(内村鑑三の無教会主義)も、西洋思想を日本的に受け止め直した重要な試みである。戦後は、こうした近代日本の思想と行動様式全体を分析した{{maruyama-masao-political-thought}}(丸山眞男の日本政治思想史)が、日本近代思想史そのものを対象化する研究として結実した。",
  "政治の基本概念": "政治学はまず、他者の意思に反してでも自分の意思を通す能力である{{power}}(権力)という最も基本的な概念から始まる。権力が制度化され、一定の領域と国民を統治する組織にまで発展したものが{{the-state}}(国家)であり、その国家が対外的・対内的に最高・独立の権威を持つことを{{sovereignty}}(主権)と呼ぶ。\n\n誰がこの権力を行使すべきかという問いへの一つの答えが、国民自身が統治に参加すべきだとする{{democracy}}(民主主義)。この民主主義を実現する際の立場は大きく分かれ、個人の自由と権利を最優先する{{liberalism}}(自由主義)、平等の実現のため生産手段の共有を目指す{{socialism}}(社会主義)、急激な変化を避け伝統や既存の秩序を重んじる{{conservatism}}(保守主義)という三大イデオロギーが、以後の政治思想の基本的な座標軸を形作っていく。",
  "政治体制とイデオロギー": "『誰が、どのように統治するか』という古典的な政体分類から始めよう。一人の支配者が世襲で統治する{{monarchy}}(君主政)は、権力が制約なく集中すれば{{absolute-monarchy}}(絶対君主制)に、憲法によって権力が制限されれば{{constitutional-monarchy}}(立憲君主制)になる。少数の優れた者が統治すべきだとする理念が{{aristocracy}}(貴族政)で、これが公共の利益ではなく私利のための少数支配に堕落すると{{oligarchy}}(寡頭制)と呼ばれる。宗教的権威が統治の正統性の源となる{{theocracy}}(神権政治)、そして本来正統な支配者が不正な手段で権力を独占・濫用する状態が{{tyranny}}(僭主政)である。\n\nこれらと対置されるのが、世襲の支配者を持たず市民が公共善のために統治に参加する{{republicanism}}(共和政)——ここから近代の政体論が大きく展開する。20世紀には、共和政の枠組みの中でも一党や指導者が権力を独占し社会全体を統制する{{dictatorship-and-totalitarianism}}(独裁と全体主義)が現れ、それを支えるイデオロギーとして民族や国民の一体性を強調する{{nationalism}}や、それをさらに過激化させた{{fascism}}が台頭した。対極には、あらゆる強制的権力(国家そのもの)を否定する{{anarchism}}(アナキズム)がある。より穏健だが自由な政治参加を制限する{{authoritarianism}}(権威主義)、そしてエリートに対する「人民」の対立を煽り既存の政治制度を攻撃する{{populism}}(ポピュリズム)は、現代政治を読み解く上で欠かせない両輪である。",
  "政治哲学史": "近代政治哲学は、統治の正統性を「もし人々が特定の立場を知らない状態で合意するなら何を選ぶか」という思考実験から導く{{rawls-theory-of-justice}}(正義論、ロールズ)を軸に、20世紀後半に新たな展開を見せた。この正義論をめぐって、個人の自由と自己所有権を最優先すべきだとする立場と、共同体の価値や絆を重視すべきだとする立場の{{libertarianism-and-communitarianism}}(リバタリアニズムとコミュニタリアニズム)論争が起こる。\n\nこの対立の根には、そもそも「自由」とは何かという理解の違いがあり、他者からの干渉がない状態を指す消極的自由と、自己実現の能力を指す積極的自由という{{positive-and-negative-liberty}}の区別が鍵になる。より遡ると、ルソーは個人の私的な意志の総和ではなく、共同体全体の公共的な利益を志向する{{general-will}}(一般意志)にこそ主権の正統性を求めた。この一般意志(民意)が暴走しないための制度的な仕組みが権力を分散させる{{separation-of-powers}}(権力分立)であり、統治者も含めすべてが法に従うべきだとする{{rule-of-law}}(法の支配)である。それでも統治が正義を裏切るとき、人民には不正な権力に立ち向かう{{right-of-resistance}}(抵抗権・革命権)が認められるという思想が、近代民主主義の最後の砦として控えている。",
  "国際政治": "近代の国際秩序は、対等な主権国家が並び立ちどの国も他国に従属しないという{{westphalian-sovereign-state-system}}(主権国家体系、ウェストファリア体制)を土台に成り立っている。主権国家どうしの上位機関が存在しない中でどう平和を保つかという問いへの古典的な答えが、特定の一国が突出しないよう諸国が同盟でバランスを取る{{balance-of-power}}(勢力均衡)である。ある国が軍備を増強すると、それが他国の不安を呼び軍拡競争を招くという{{security-dilemma}}(安全保障のジレンマ)は、国家間の協調がいかに難しいかを示す。\n\nこの難しさを克服する制度的な試みが、一国への侵略を全参加国への攻撃とみなす{{collective-security}}(集団安全保障)や、条約・国際機関を通じてルールを共有する{{international-institutions-and-global-governance}}(国際機構とグローバルガバナンス)である。国際政治を理論として捉える際の大きな対立軸が、国家は自国の権力・安全保障を追求すると見る現実主義と、制度や協調で平和は実現しうると見る自由主義の{{realism-and-liberalism-ir}}(リアリズムとリベラリズム)であり、さらに、圧倒的な力を持つ覇権国の存在こそが国際秩序を安定させるという{{hegemonic-stability-theory}}(覇権安定論)は、勢力均衡論とは異なる角度から国際秩序の条件を説明する。",
  "日本政治": "戦後日本政治は、国民主権・基本的人権・平和主義を柱とする{{japanese-constitution-government-structure}}(日本国憲法の統治機構)を土台に組み立てられた。象徴的には天皇は「国政に関する権能を有しない」{{symbolic-emperor-system}}(象徴天皇制)へと位置づけ直され、対外的には戦争放棄を定めた{{pacifism-and-article-nine}}(平和主義と第九条)を国是に据える。\n\nこの憲法体制のもとで、保守合同によって成立した自民党の長期単独政権と社会党を中心とする野党が対峙する{{1955-system}}(55年体制)という独特の政党政治の枠組みが定着し、その内実を{{postwar-japanese-party-politics}}(戦後日本の政党政治)として詳しく見ていくと派閥政治の力学が浮かび上がる。この体制下で実際の政策形成を担ったのが専門性と継続性を持つ{{japanese-bureaucracy}}(官僚制、日本型)であり、政治家(特に特定分野に強い族議員)と官僚機構が密接に協力・時に緊張しながら政策を作る{{seikan-relations}}(政官関係)という構図が、日本政治の実態を理解する鍵となる。",
