/* ================================================================== */
function App() {
  const [items, setItems] = useState(null);
  const [err, setErr] = useState(null);
  const [nav, setNav] = useState({ v:"home" });

  async function load() {
    try {
      setItems(EITANGO_DATA.slice());
    } catch (e) { setErr(e.message); }
  }
  useEffect(() => { load(); }, []);

  const byId = useMemo(() => Object.fromEntries((items || []).map(r => [r.id, r])), [items]);
  const groupWords = (gid) => (items || []).filter(r => r.groupKey === gid || alsoOf(r).includes(gid));

  const bridges = useMemo(() => {
    if (!items) return [];
    const seen = {}, out = [];
    items.forEach(a => (a.related || []).forEach(e => {
      const b = byId[e.target];
      if (!b || b.track === a.track) return;
      const key = [a.id, b.id].sort().join("|");
      const daily = a.track === "daily" ? a : b;
      const toeic = a.track === "toeic" ? a : b;
      if (seen[key] !== undefined) { if (!out[seen[key]].note && e.note) out[seen[key]].note = e.note; return; }
      seen[key] = out.length;
      out.push({ daily, toeic, relation:e.relation, note:e.note || "" });
    }));
    return out.sort((x, y) => x.daily.word.localeCompare(y.daily.word, "en"));
  }, [items, byId]);

  if (err) return <div className="max-w-xl mx-auto mt-16 text-rose-300 text-sm">読み込めませんでした：{err}</div>;
  if (!items) return <div className="text-slate-400 p-8 text-sm">読み込み中…</div>;

  const jump = () => window.scrollTo({ top:0, behavior:"smooth" });
  const go = (patch) => { setNav(n => ({ ...n, ...patch })); jump(); };
  const goHome   = () => go({ v:"home", track:null, group:null, letter:null, word:null });
  const goBridge = () => go({ v:"bridge" });
  const goTrack  = (tid) => go({ v:"track", track:tid, group:null, letter:null, word:null });
  const goGroup  = (gid) => go({ v:"group", track:GROUP[gid].track, group:gid, letter:null, word:null });
  const goLetter = (gid, L) => go({ v:"letter", track:GROUP[gid].track, group:gid, letter:L, word:null });
  const openWord = (id) => {
    const w = byId[id]; if (!w) return;
    go({ v:"word", track:GROUP[w.groupKey].track, group:w.groupKey, letter:w.letter, word:id });
  };

  const trk = nav.track ? TRACK[nav.track] : null;
  const grp = nav.group ? GROUP[nav.group] : null;
  const word = nav.word ? byId[nav.word] : null;
  const ac = accentOf(nav.track || "toeic");

  const parent = () => {
    if (nav.v === "track" || nav.v === "bridge") return goHome;
    if (nav.v === "group") return () => goTrack(nav.track);
    if (nav.v === "letter") return () => goGroup(nav.group);
    if (nav.v === "word") return () => goLetter(nav.group, nav.letter);
    return null;
  };
  const back = parent();

  return (
    <div className="min-h-screen text-slate-100"
      style={{ background:"radial-gradient(1000px 480px at 12% -10%, rgba(14,165,233,.12), transparent 60%), #090d16" }}>
      <div className="max-w-3xl mx-auto px-5 sm:px-8 py-9">

        {/* ヘッダー */}
        <div className="mb-6 flex items-start justify-between flex-wrap gap-4">
          <div>
            <h1 onClick={goHome} className="text-[21px] font-bold tracking-tight text-white flex items-center gap-2 cursor-pointer">
              <span className="text-sky-400">◈</span> シナプスキーマ：英単語
            </h1>
            <p className="text-[12.5px] text-slate-400 mt-1">
              トラック → スコア帯・シチュエーション → アルファベット。単語どうしはリンクでつながっています。
              <span className="text-slate-600">（{items.length} 語）</span>
            </p>
          </div>
          <button onClick={goBridge}
            className={"px-4 py-2 rounded-xl text-[13px] font-bold ring-1 transition flex items-center gap-1.5 " +
              (nav.v === "bridge" ? "bg-sky-600 text-white ring-sky-400" : "bg-sky-500/10 text-sky-300 ring-sky-500/30 hover:bg-sky-500/20")}>
            🔀 つながりマップ
          </button>
        </div>

        {/* パンくず */}
        <div className="flex items-center gap-1.5 text-[12.5px] text-slate-500 mb-7 flex-wrap">
          {back && <button onClick={back} className="mr-1 px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">← 戻る</button>}
          <button onClick={goHome} className="hover:text-sky-300">ホーム</button>
          {nav.v === "bridge" && <><span className="text-slate-700">/</span><span className="text-sky-400 font-semibold">つながりマップ</span></>}
          {trk && nav.v !== "bridge" && <><span className="text-slate-700">/</span>
            <button onClick={() => goTrack(trk.id)} className="hover:text-sky-300">{trk.name}</button></>}
          {grp && (nav.v === "group" || nav.v === "letter" || nav.v === "word") && <><span className="text-slate-700">/</span>
            <button onClick={() => goGroup(grp.id)} className="hover:text-sky-300">{shortName(grp)}</button></>}
          {nav.letter && (nav.v === "letter" || nav.v === "word") && <><span className="text-slate-700">/</span>
            <button onClick={() => goLetter(grp.id, nav.letter)} className="hover:text-sky-300 font-mono">{nav.letter}</button></>}
          {word && nav.v === "word" && <><span className="text-slate-700">/</span>
            <span className="text-sky-400 font-semibold font-mono">{word.word}</span></>}
        </div>

        {/* ---- L1 ホーム ---- */}
        {nav.v === "home" && (
          <div className="rise space-y-4">
            <div className="text-[12px] font-bold text-slate-400">学習トラックを選ぶ</div>
            <div className="grid gap-3">
              {TRACKS.map(t => {
                const gs = GROUPS.filter(g => g.track === t.id);
                const wc = new Set();
                gs.forEach(g => groupWords(g.id).forEach(w => wc.add(w.id)));
                const a = accentOf(t.id);
                return (
                  <button key={t.id} onClick={() => goTrack(t.id)}
                    className="group text-left rounded-2xl p-5 bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] hover:ring-sky-500/40 transition">
                    <div className="flex items-center gap-4">
                      <div className={"w-12 h-12 rounded-xl text-2xl flex items-center justify-center ring-1 " + a.bg + " " + a.ring}>{t.icon}</div>
                      <div>
                        <div className="text-[17px] font-bold text-white group-hover:text-sky-200 transition">{t.name}</div>
                        <div className="text-[11.5px] text-slate-400">{gs.length} カテゴリ ／ {wc.size} 語</div>
                      </div>
                    </div>
                    <p className="text-[12.5px] leading-relaxed text-slate-300 mt-3">{t.blurb}</p>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* ---- L2 トラック内カテゴリ ---- */}
        {nav.v === "track" && trk && (
          <div className="rise">
            <div className={"mb-6 p-4 rounded-2xl ring-1 flex items-center gap-4 " + ac.bg + " " + ac.ring}>
              <div className={"w-12 h-12 rounded-xl bg-white/5 text-2xl flex items-center justify-center ring-1 " + ac.ring}>{trk.icon}</div>
              <div>
                <h2 className="text-xl font-bold text-white">{trk.name}</h2>
                <p className="text-[13px] text-slate-400">{trk.id === "toeic" ? "スコア帯を選んでください" : "シチュエーションを選んでください"}</p>
              </div>
            </div>
            <div className="space-y-3">
              {GROUPS.filter(g => g.track === trk.id).map(g => (
                <button key={g.id} onClick={() => goGroup(g.id)}
                  className="w-full text-left rounded-xl p-4 bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] hover:ring-sky-500/40 transition flex items-center justify-between gap-4">
                  <div>
                    <div className="text-[15px] font-bold text-white">{g.name}</div>
                    <div className="text-[12.5px] text-slate-400 mt-0.5">{g.sub}</div>
                  </div>
                  <div className="flex items-center gap-3 flex-shrink-0">
                    <span className={"text-[11px] px-2 py-0.5 rounded-full ring-1 " + ac.bg + " " + ac.text + " " + ac.ring}>{groupWords(g.id).length} 語</span>
                    <span className="text-slate-500 text-sm">→</span>
                  </div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ---- L3 アルファベット索引 ---- */}
        {nav.v === "group" && grp && (
          <div className="rise">
            <div className={"mb-6 p-4 rounded-2xl ring-1 " + ac.bg + " " + ac.ring}>
              <h2 className="text-xl font-bold text-white">{grp.name}</h2>
              <p className="text-[13px] text-slate-400">{grp.sub} ・ 頭文字から引く</p>
            </div>
            {(() => {
              const ws = groupWords(grp.id);
              const letters = [...new Set(ws.map(w => w.letter))].sort();
              return (
                <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                  {letters.map(L => (
                    <button key={L} onClick={() => goLetter(grp.id, L)}
                      className="rounded-xl p-4 bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] hover:ring-sky-500/40 transition flex flex-col items-center gap-1">
                      <span className="font-mono text-2xl font-bold text-white">{L}</span>
                      <span className="text-[11px] text-slate-400">{ws.filter(w => w.letter === L).length} 語</span>
                    </button>
                  ))}
                </div>
              );
            })()}
          </div>
        )}

        {/* ---- L3→ 単語リスト ---- */}
        {nav.v === "letter" && grp && nav.letter && (
          <div className="rise">
            <div className="mb-6 flex items-center gap-4">
              <div className={"w-12 h-12 rounded-xl font-mono text-2xl font-bold flex items-center justify-center ring-1 " + ac.bg + " " + ac.text + " " + ac.ring}>{nav.letter}</div>
              <div>
                <h2 className="text-lg font-bold text-white">{nav.letter} で始まる単語</h2>
                <p className="text-[12.5px] text-slate-400">{grp.name}</p>
              </div>
            </div>
            <div className="space-y-3">
              {groupWords(grp.id).filter(w => w.letter === nav.letter)
                .sort((a, b) => a.word.localeCompare(b.word, "en")).map(w => (
                <button key={w.id} onClick={() => openWord(w.id)}
                  className="w-full text-left rounded-xl p-4 bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] hover:ring-sky-500/40 transition flex items-center justify-between gap-4">
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-mono text-lg font-bold text-white">{w.word}</span>
                      {w.pos && <span className="text-[10.5px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300">{w.pos}</span>}
                    </div>
                    <div className={"text-[13.5px] mt-1 " + ac.text}>{w.meaning}</div>
                  </div>
                  <span className="text-slate-500 text-sm flex-shrink-0">詳細 →</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ---- L4 単語カード ---- */}
        {nav.v === "word" && word && (
          <WordCard word={word} accent={ac} byId={byId} openWord={openWord} goGroup={goGroup} />
        )}

        {/* ---- つながりマップ ---- */}
        {nav.v === "bridge" && (
          <div className="rise space-y-5">
            <div className="p-5 rounded-2xl bg-sky-500/[.05] ring-1 ring-sky-500/20">
              <h2 className="text-xl font-bold text-white mb-1">つながりマップ</h2>
              <p className="text-[13px] text-slate-300 leading-relaxed">
                <span className="text-emerald-300">日常会話</span>で覚えた単語と、
                <span className="text-sky-300"> TOEIC・ビジネス</span>で問われる単語は地続きです。
                トラックをまたぐ関連リンク（{bridges.length} 組）を橋渡しとして並べています。カードの単語をタップで詳細へ。
              </p>
            </div>
            <div className="space-y-3">
              {bridges.map((br, i) => (
                <div key={i} className="rounded-xl p-4 bg-white/[.03] ring-1 ring-white/10">
                  <div className="flex items-center gap-2 flex-wrap">
                    <button onClick={() => openWord(br.daily.id)}
                      className="px-3 py-1.5 rounded-lg font-mono text-[13px] font-bold bg-emerald-500/10 text-emerald-200 ring-1 ring-emerald-500/30 hover:bg-emerald-500/20 transition">
                      {br.daily.word}
                    </button>
                    <span className="text-slate-500 text-xs">⇄</span>
                    <button onClick={() => openWord(br.toeic.id)}
                      className="px-3 py-1.5 rounded-lg font-mono text-[13px] font-bold bg-sky-500/10 text-sky-200 ring-1 ring-sky-500/30 hover:bg-sky-500/20 transition">
                      {br.toeic.word}
                    </button>
                    <span className={"ml-1 text-[10.5px] px-2 py-0.5 rounded-full ring-1 " + (REL[br.relation] || "")}>{br.relation}</span>
                  </div>
                  <div className="text-[10.5px] text-slate-500 mt-2">
                    {shortName(GROUP[br.daily.groupKey])}（{br.daily.meaning}）　⇄　{shortName(GROUP[br.toeic.groupKey])}（{br.toeic.meaning}）
                  </div>
                  {br.note && <p className="text-[13px] text-slate-300 leading-relaxed mt-1.5">{br.note}</p>}
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

/* ---------------- 単語カード ---------------- */
function WordCard({ word, accent, byId, openWord, goGroup }) {
  const grp = GROUP[word.groupKey];
  const also = alsoOf(word).map(id => GROUP[id]).filter(Boolean);

  const links = {};
  (word.related || []).forEach(e => {
    if (!byId[e.target]) return;
    (links[e.relation] = links[e.relation] || []).push({ id:e.target, note:e.note });
  });
  (word.referencedBy || []).forEach(b => {
    const src = byId[b.id]; if (!src) return;
    const edge = (src.related || []).find(e => e.target === word.id);
    const rel = edge ? edge.relation : "類義語";
    links[rel] = links[rel] || [];
    if (!links[rel].some(x => x.id === b.id)) links[rel].push({ id:b.id, note:edge && edge.note });
  });
  const relTypes = REL_ORDER.filter(k => links[k] && links[k].length);

  return (
    <div className="rise space-y-5">
      {/* メイン */}
      <div className="p-6 rounded-2xl bg-white/[.03] ring-1 ring-white/10">
        <div className="flex items-center gap-2 text-[11px] mb-2 flex-wrap">
          <button onClick={() => goGroup(grp.id)}
            className={"px-2.5 py-0.5 rounded-full ring-1 font-semibold " + accent.bg + " " + accent.text + " " + accent.ring}>
            {TRACK[grp.track].name} ・ {shortName(grp)}
          </button>
          {also.map(g => (
            <button key={g.id} onClick={() => goGroup(g.id)}
              className="px-2.5 py-0.5 rounded-full bg-white/5 text-slate-300 ring-1 ring-white/10">
              ＋ {TRACK[g.track].name} ・ {shortName(g)}
            </button>
          ))}
          {word.pos && <span className="px-2 py-0.5 rounded bg-white/10 text-slate-300">{word.pos}</span>}
        </div>
        <h2 className="text-3xl font-bold text-white font-mono tracking-wide">{word.word}</h2>
        <p className={"text-lg font-bold mt-2 " + accent.text}>{word.meaning}</p>
        <p className="text-[14px] leading-relaxed text-slate-300 mt-3 border-t border-white/5 pt-3">{word.summary}</p>
      </div>

      {/* 基本データ + レベル/文型 */}
      <div className="grid sm:grid-cols-2 gap-4">
        <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
          <h3 className="text-sky-300 font-bold text-[14px] mb-2.5 border-b border-white/10 pb-2">📌 基本データ</h3>
          <div className="space-y-2 text-[13px]">
            {word.pronunciation && <Row label="発音" text={word.pronunciation} />}
            {word.derivatives && word.derivatives !== "—" && <Row label="派生語" text={word.derivatives} />}
          </div>
        </div>
        <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
          <h3 className="text-emerald-300 font-bold text-[14px] mb-2.5 border-b border-white/10 pb-2">📊 レベル・文型</h3>
          <div className="space-y-2 text-[13px]">
            {word.level && <Row label="目安" text={word.level} />}
            {word.usage && <Row label="よく使う形" text={word.usage} />}
          </div>
        </div>
      </div>

      {/* 使い分け Q&A */}
      {word.notes && word.notes.length > 0 && (
        <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
          <h3 className="text-amber-300 font-bold text-[14px] mb-3 border-b border-white/10 pb-2">💡 使い分け・注意点</h3>
          <div className="space-y-3 text-[13px]">
            {word.notes.map((c, i) => (
              <div key={i} className="border-l-2 border-amber-500/40 pl-3 space-y-0.5">
                <div className="font-semibold text-amber-200">Q. {c.q}</div>
                <div className="text-slate-300 leading-relaxed">{c.a}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* フレーズ + 例文 */}
      <div className="grid sm:grid-cols-2 gap-4">
        {word.phrases && word.phrases.length > 0 && (
          <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
            <h3 className="text-purple-300 font-bold text-[14px] mb-2.5 border-b border-white/10 pb-2">🗣️ 定番フレーズ</h3>
            <div className="space-y-2 text-[12.5px]">
              {word.phrases.map((p, i) => (
                <div key={i} className="px-2.5 py-1.5 rounded-lg bg-purple-500/10 text-purple-200 ring-1 ring-purple-500/20">{p.phrase}</div>
              ))}
            </div>
          </div>
        )}
        {word.examples && word.examples.length > 0 && (
          <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
            <h3 className="text-pink-300 font-bold text-[14px] mb-2.5 border-b border-white/10 pb-2">📝 例文</h3>
            <div className="space-y-2.5 text-[12.5px]">
              {word.examples.map((t, i) => (
                <div key={i}>
                  <div className="text-slate-200 leading-relaxed">{t.en}</div>
                  {t.ja && <div className="text-slate-500 mt-0.5">{t.ja}</div>}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* 関連する単語 */}
      {relTypes.length > 0 && (
        <div className="p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10">
          <h3 className="text-sky-300 font-bold text-[14px] mb-3 border-b border-white/10 pb-2">🔗 関連する単語</h3>
          <div className="space-y-3.5">
            {relTypes.map(rt => (
              <div key={rt}>
                <div className="text-[11px] font-semibold text-slate-400 mb-1.5">{rt}</div>
                <div className="flex flex-wrap gap-2">
                  {links[rt].map(({ id }) => {
                    const t = byId[id]; if (!t) return null;
                    return (
                      <button key={id} onClick={() => openWord(id)}
                        className={"px-3 py-1.5 rounded-lg text-[13px] font-mono font-semibold ring-1 transition " + (REL[rt] || "")}>
                        {t.word} <span className="opacity-60 font-sans">· {t.meaning.split("、")[0].split("／")[0]}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function Row({ label, text }) {
  return (
    <div className="flex items-start gap-2">
      <span className="text-slate-400 font-semibold min-w-[64px] flex-shrink-0">{label}</span>
      <span className="text-slate-200">{text}</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
