as9", "field": "molecular-biology"}]}, {"id": "redox", "title": "酸化還元反応", "aka": "Redox (oxidation–reduction)", "field": "chemistry", "area": "化学反応", "section": "反応の基本", "headline": "電子の受け渡しで、片方が酸化・片方が還元", "summary": "一方の物質が電子を失い（酸化）、もう一方が電子を受け取る（還元）反応。必ずペアで起きる。もとは『酸素と結びつくこと＝酸化』だったが、本質は電子の移動。鉄がさびる、電池が電気を出す、呼吸で栄養を燃やす、光合成——生命とエネルギーの根幹はほぼ酸化還元。", "easyHeadline": "電子の受け渡しで、片方が酸化・もう片方が還元", "easyBody": "一方の物質が電子を手放し(酸化)、もう一方がその電子を受け取る(還元)という反応で、この2つは必ずセットで起こります。鉄がさびるのも、電池が電気を作るのも、体の中で栄養からエネルギーを取り出すのも、すべてこの電子の受け渡しが元になっています。", "keyPoint": "『酸化される＝電子を渡す＝相手を還元する（還元剤）』。名前と役割が逆になるので注意。", "figure": "redox", "body": [{"label": "電池", "text": "酸化が起きる電極と還元が起きる電極を導線でつなぐと、電子の流れ＝電流になる。"}, {"label": "生体内", "text": "NAD⁺やFADが電子を運ぶ『電子の運び屋』として働き、最終的に酸素へ渡してATPを作る。"}], "relatedTopics": [{"concept": "chemical-reaction", "relation": "なかま"}, {"concept": "combustion", "relation": "なかま"}, {"concept": "enzyme", "relation": "はたらく相手"}, {"concept": "atom-structure", "relation": "関連"}], "referencedBy": [{"id": "catalysis", "title": "触媒", "field": "chemistry"}, {"id": "chemical-reaction", "title": "化学反応", "field": "chemistry"}, {"id": "combustion", "title": "燃焼", "field": "chemistry"}, {"id": "corrosion", "title": "腐食（さび）", "field": "chemistry"}, {"id": "electrochemical-cell", "title": "電池（化学電池）", "field": "chemistry"}, {"id": "electrolysis", "title": "電気分解", "field": "chemistry"}, {"id": "isotopes-radioactivity", "title": "同位体と放射線", "field": "chemistry"}, {"id": "metabolism", "title": "代謝", "field": "molecular-biology"}, {"id": "mitochondria-atp", "title": "ミトコンドリアとATP合成", "field": "molecular-biology"}, {"id": "photosynthesis", "title": "光合成", "field": "molecular-biology"}, {"id": "thermochemistry-enthalpy", "title": "反応熱とエンタルピー", "field": "chemistry"}]}, {"id": "reflection-refraction-diffraction-interference", "title": "反射・屈折・回折・干渉", "field": "physics", "area": "波・光・音", "section": "波の現象", "headline": "波が壁・境界・すきまに出会うと起きる4つの現象", "summary": "波が別の媒質との境界にぶつかると跳ね返る（反射）、境界で速さが変わり進む向きが曲がる（屈折）、すきまや障害物の陰に回り込む（回折）、複数の波が重なって強め合ったり弱め合ったりする（干渉）——これら4つは波に共通する基本的なふるまいで、光にも音にも水面波にも当てはまる。", "easyHeadline": "波が壁やすきまに出会うと起きる4つの現象", "easyBody": "波が何かにぶつかると跳ね返ったり(反射)、境界を通るときに曲がったり(屈折)、すきまの陰に回り込んだり(回折)、他の波と重なって強め合ったり弱め合ったりします(干渉)。これらはすべての波(光・音・水面の波)に共通する性質です。", "keyPoint": "干渉は「波」だけの性質。粒子は単純に足し算されるだけで、強め合い・弱め合いは起きない——だから干渉が見えることは、その対象が波であることの何よりの証拠になる。", "body": [{"label": "反射と屈折", "text": "波が異なる媒質の境界に達すると一部は跳ね返り（反射）、一部は媒質に入って進むが速さが変わるため進行方向が曲がる（屈折）。虹は水滴での光の屈折と反射の組み合わせで生まれる。"}, {"label": "回折", "text": "波はすきまや障害物の端で回り込むように広がる。すきまの幅が波長に近いほど回折は顕著になる——音は波長が長いので壁の陰でも聞こえるが、光は波長が短いのでくっきりした影ができる。"}, {"label": "干渉", "text": "2つの波が重なると、山と山が合えば強め合い（強め合う干渉）、山と谷が合えば打ち消し合う（弱め合う干渉）。ヤングの二重スリット実験で光の干渉縞が観測されたことは、光が波であることの決定的な証拠になった（後に量子力学で粒子性との二面性が明らかになる）。"}], "relatedTopics": [{"concept": "wave-basics-wavelength-period-speed", "relation": "関連"}, {"concept": "standing-waves-and-instruments", "relation": "原因と結果"}, {"concept": "xray-crystallography", "relation": "技術で見る", "note": "X線の回折パターンから分子の立体構造を割り出す"}, {"concept": "wave-particle-duality-of-light", "relation": "関連"}], "referencedBy": [{"id": "lenses-mirrors-and-imaging", "title": "レンズ・鏡と結像", "field": "physics"}, {"id": "standing-waves-and-instruments", "title": "定在波と楽器", "field": "physics"}, {"id": "wave-particle-duality-of-light", "title": "光は波か粒子か", "field": "physics"}]}, {"id": "rna-world-noncoding", "title": "RNAの多様な顔", "aka": "RNA (mRNA, tRNA, rRNA, miRNA, ribozyme)", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "情報を読み出す", "headline": "RNAは運び屋であり、道具であり、スイッチ", "summary": "RNAは『DNAの劣化版コピー』ではない。情報を運ぶmRNA、アミノ酸を運ぶtRNA、リボソームの本体で化学反応もするrRNA、遺伝子発現を抑えるmiRNA、酵素のように働くリボザイム——役割は多彩。生命の起源では、情報も触媒もRNAが1人で担っていた（RNAワールド仮説）と考えられている。", "easyHeadline": "RNAは運び屋でもあり、道具でもあり、スイッチでもある", "easyBody": "RNAは「DNAの下位互換のコピー」ではありません。情報を運ぶもの、材料を運ぶもの、化学反応そのものを行うもの、遺伝子を抑えるものなど、いろいろな役割を持ちます。生命が生まれたころは、情報の保存も反応もRNAが1人で担っていたと考えられています。", "keyPoint": "リボソームの反応中心がRNAであること自体が、『昔はRNAが主役だった』名残の強い証拠。", "body": [{"label": "RNA干渉", "text": "短いRNAが相補的なmRNAを狙って壊す／翻訳を止める。実験ツールにも医薬にもなった。"}, {"label": "mRNAワクチン", "text": "目的タンパク質のmRNAを体内に入れて作らせる。RNAが『情報』であることの実用化。"}], "relatedTopics": [{"concept": "central-dogma", "relation": "構成する"}, {"concept": "translation", "relation": "はたらく相手"}, {"concept": "transcription", "relation": "なかま"}, {"concept": "genetic-code", "relation": "関連"}], "referencedBy": [{"id": "transcription", "title": "転写", "field": "molecular-biology"}]}, {"id": "science-to-technology", "title": "科学が技術になるとき", "aka": "Science-to-technology pipeline / 基礎研究から応用へ", "field": "technology", "area": "科学と技術のあいだ", "section": "変遷の型", "headline": "基礎研究が応用され、発明になり、社会に広がる", "summary": "科学は「なぜそうなるか」を明らかにする営みで、技術は「それを使って何ができるか」を形にする営み。両者はしばしば別の時間軸で動く——ファラデーが電磁誘導を発見してから実用発電機が普及するまで数十年、量子力学の確立からトランジスタの発明までも数十年かかった。典型的な流れは「基礎研究（原理の発見）→応用研究（使えるかたちにする）→発明（装置・製品にする）→普及（安く・広く使えるようにする）」の4段階で、各段階に別の担い手（科学者・技術者・企業・社会）が関わる。すべての技術がこの順で生まれるわけではなく、逆に技術が先に存在し、あとから科学がその理由を説明する例（蒸気機関と熱力学、望遠鏡と光学）もある。", "keyPoint": "「発見」から「普及」までは一直線ではなく、しばしば何十年もかかる。", "figure": "tech-pipeline", "body": [{"label": "4段階の例：電気", "text": "電磁誘導の発見(1831、ファラデー) → 発電の原理を装置化(応用研究) → 実用発電機の発明(1870年代) → 電力網による普及(20世紀初頭)。"}, {"label": "逆向きの流れもある", "text": "蒸気機関は熱力学の理論より先に実用化された。あとから科学が『なぜ効率に上限があるのか』を説明した(熱力学第二法則)。"}], "relatedTopics": [{"concept": "technology-enables-science", "relation": "なかま"}, {"concept": "steam-engine", "relation": "関連"}, {"concept": "thermal-engines-and-second-law", "relation": "関連"}], "referencedBy": [{"id": "antibiotics", "title": "抗生物質", "field": "technology"}, {"id": "movable-type-printing", "title": "活版印刷", "field": "technology"}, {"id": "steam-engine", "title": "蒸気機関", "field": "technology"}, {"id": "technology-enables-science", "title": "技術が科学を進める", "field": "technology"}]}, {"id": "simple-harmonic-motion-and-resonance", "title": "単振動と共振", "field": "physics", "area": "波・光・音", "section": "振動と波", "headline": "「行ったり来たり」を支配する共通の数式", "summary": "バネにおもりをつけて引っ張って離す、振り子を揺らす——こうした「元の位置に戻ろうとする力」で起きる往復運動を単振動という。あらゆる振動はこの単振動の数式で近似でき、外から加える力の周期が物体固有の振動数と一致すると振幅が爆発的に増える「共振」が起きる。", "easyHeadline": "「行ったり来たり」を支配する共通のルール", "easyBody": "バネにつけたおもりや振り子のように、元の位置に戻ろうとする力ではたらく往復運動には共通のパターンがあります。外から揺らす力のタイミングが、そのものが元々揺れたがるタイミングとぴったり合うと、揺れがどんどん大きくなっていきます(共振)。ブランコを良いタイミングで押すとどんどん高くなるのと同じ理屈です。", "keyPoint": "復元力が変位に比例する（フックの法則型）とき、運動は必ずsin/cos型の単振動になる。", "body": [{"label": "復元力と単振動", "text": "バネの力F=-kx（変位に比例し逆向き）のように「ずれた分だけ元に戻そうとする力」がかかる系は、振幅・周期が一定の単振動を行う。周期は質量と復元力の強さだけで決まり、振れ幅の大きさにはよらない（等時性）。"}, {"label": "共振とは", "text": "すべての物体は固有の振動数（固有振動数）を持つ。外から加える力の周期がこれと一致すると、エネルギーが効率よく注ぎ込まれ振幅がどんどん増大する——これが共振。ブランコを「タイミングよく」押すと大きく揺れるのと同じ原理。"}, {"label": "崩壊した橋の教訓", "text": "1940年のタコマナローズ橋崩壊は、風が生む渦の周期が橋の固有振動数と一致し共振で振動が増幅、構造が持たなかった例として有名（近年は空力的な不安定現象という説明が主流だが、共振の危険性を示す象徴として語られる）。"}], "relatedTopics": [{"concept": "wave-basics-wavelength-period-speed", "relation": "構成する"}, {"concept": "newtons-laws-of-motion", "relation": "関連"}, {"concept": "standing-waves-and-instruments", "relation": "はたらく相手"}], "referencedBy": [{"id": "standing-waves-and-instruments", "title": "定在波と楽器", "field": "physics"}, {"id": "wave-basics-wavelength-period-speed", "title": "波の基本（波長・周期・速さ）", "field": "physics"}]}, {"id": "solubility-precipitation", "title": "溶解度と沈殿", "aka": "Solubility & precipitation", "field": "chemistry", "area": "溶液と混合物", "section": "混ざりものの性質", "headline": "溶ける量には限界があり、超えると出てくる", "summary": "ある温度で溶媒に溶けられる溶質の最大量が溶解度。それを超えた分は溶けきれずに固体として現れる（析出・沈殿）。多くの固体は高温ほどよく溶け、冷やすと結晶が出る（再結晶による精製に使う）。逆に気体は高温ほど溶けにくい（炭酸飲料、川の酸素）。", "easyHeadline": "溶ける量には上限があり超えると固体として現れる", "easyBody": "ある温度で溶かせる量には限界があり、それを超えた分は溶けきれずに固体として出てきます(沈殿)。多くの固体は温度が高いほどよく溶けるので、熱いうちに溶かしてゆっくり冷やすと、余った分が結晶として出てきます。", "keyPoint": "鍾乳洞、腎臓結石、ボイラーの湯垢——『溶けて運ばれ、条件が変わって出てくる』の繰り返しでできている。", "body": [{"label": "過飽和", "text": "そっと冷やすと溶解度を超えても溶けたまま。刺激で一気に結晶化する（使い捨てカイロの一部）。"}, {"label": "溶解度積", "text": "難溶性の塩がどれだけ溶けるかの目安。沈殿ができるかどうかの判定に使う。"}], "relatedTopics": [{"concept": "dissolution", "relation": "なかま"}, {"concept": "concentration-mole", "relation": "関連"}, {"concept": "phase-transition", "relation": "対比"}, {"concept": "crystals-amorphous", "relation": "関連"}], "referencedBy": [{"id": "colloid-mixture", "title": "コロイドと混合物", "field": "chemistry"}, {"id": "concentration-mole", "title": "濃度とモル", "field": "chemistry"}, {"id": "crystals-amorphous", "title": "結晶と非晶質", "field": "chemistry"}, {"id": "dissolution", "title": "溶解", "field": "chemistry"}]}, {"id": "sound-and-doppler-effect", "title": "音とドップラー効果", "field": "physics", "area": "波・光・音", "section": "波の現象", "headline": "救急車が近づくと高く、遠ざかると低く聞こえる理由", "summary": "音は空気の密度の濃淡（疎密）が伝わる縦波。音源と観測者が近づいているときは波が押し縮められて振動数が高く（音が高く）聞こえ、遠ざかっているときは波が引き伸ばされて振動数が低く聞こえる——これがドップラー効果で、救急車のサイレンや天体の光（赤方偏移）の観測にも応用される。", "easyHeadline": "救急車が近づくと高く、遠ざかると低く聞こえる理由", "easyBody": "音を出しているものがこちらに近づいてくると音の波が押し縮められて高い音に聞こえ、遠ざかっていくと波が伸びて低い音に聞こえます。これがドップラー効果で、救急車のサイレンだけでなく、遠くの星の光の観測にも使われています。", "keyPoint": "ドップラー効果は「波の速さ」ではなく「観測される振動数（波長）」が変わる現象——音速そのものは変化しない。", "body": [{"label": "音は縦波（疎密波）", "text": "音源が振動すると、その振動で空気が押されて密な部分と薄い部分（疎密）が交互にでき、それが伝わっていく。真空中では伝える媒質がないため音は伝わらない。"}, {"label": "ドップラー効果のしくみ", "text": "音源が観測者に近づいていると、次の波面が前の波面より近い位置から出るため波長が実質的に縮み振動数が上がる（高い音）。遠ざかると逆に波長が伸び振動数が下がる（低い音）。音源・観測者どちらが動いても同様の効果が起きる。"}, {"label": "応用：赤方偏移", "text": "同じ原理は光にも当てはまる。銀河が地球から遠ざかっていると、そこからの光の波長が伸びて赤い方へずれて見える（赤方偏移）。この観測がハッブル・ルメートルの法則＝宇宙膨張の発見につながった。"}], "relatedTopics": [{"concept": "wave-basics-wavelength-period-speed", "relation": "関連"}, {"concept": "standing-waves-and-instruments", "relation": "関連"}], "referencedBy": [{"id": "standing-waves-and-instruments", "title": "定在波と楽器", "field": "physics"}, {"id": "wave-basics-wavelength-period-speed", "title": "波の基本（波長・周期・速さ）", "field": "physics"}]}, {"id": "standing-waves-and-instruments", "title": "定在波と楽器", "field": "physics", "area": "波・光・音", "section": "波の現象", "headline": "逆向きの波が重なって「揺れない点」を作る", "summary": "弦や気柱の両端のように波が反射を繰り返す場では、進む波と反射で戻ってくる波が重なり合い、決して振動しない点（節）と最大に振動する点（腹）が固定されたパターン＝定在波ができる。弦楽器や管楽器はこの定在波の振動数（固有振動数）で特定の高さの音を鳴らしている。", "easyHeadline": "逆向きの波が重なって「揺れない点」をつくる", "easyBody": "弦や管の中では、行く波と跳ね返ってくる波が重なり合って、まったく揺れない場所とよく揺れる場所が固定されたパターンができます。弦楽器や管楽器は、この決まったパターンの振動を使って音の高さを鳴らしています。", "keyPoint": "弦や気柱の長さが決まると、そこに収まる定在波の波長も決まる——だから楽器の長さがそのまま音の高さを決める。", "figure": "standing-wave", "body": [{"label": "節と腹", "text": "逆方向に進む2つの波が重なると、常に振幅が0になる点（節）と最大振幅になる点（腹）が空間に固定されたまま振動する定在波ができる。弦の両端は固定されているので必ず節になる。"}, {"label": "固有振動数と倍音", "text": "弦の長さに整数個の半波長がちょうど収まる振動数だけが定在波として存在できる。一番低い振動数を基本振動、その整数倍を倍音といい、楽器の音色は基本振動と倍音の混ざり具合で決まる。"}, {"label": "弦楽器と管楽器", "text": "弦楽器は弦の長さ・張力・太さで固有振動数を、管楽器は気柱の長さ（穴の開閉やピストンで実効的な長さを変える）で固有振動数を調整して音程を作っている。"}], "relatedTopics": [{"concept": "simple-harmonic-motion-and-resonance", "relation": "はたらく相手"}, {"concept": "reflection-refraction-diffraction-interference", "relation": "原因と結果"}, {"concept": "sound-and-doppler-effect", "relation": "関連"}], "referencedBy": [{"id": "reflection-refraction-diffraction-interference", "title": "反射・屈折・回折・干渉", "field": "physics"}, {"id": "simple-harmonic-motion-and-resonance", "title": "単振動と共振", "field": "physics"}, {"id": "sound-and-doppler-effect", "title": "音とドップラー効果", "field": "physics"}]}, {"id": "states-of-matter", "title": "物質の三態", "aka": "States of matter", "field": "chemistry", "area": "物質の状態", "section": "状態と変化", "headline": "分子の動きの激しさで、固体・液体・気体", "summary": "同じ物質でも、温度と圧力によって固体・液体・気体の姿をとる。粒子（分子・原子・イオン）どうしの引力と、熱による運動の激しさのせめぎ合いで決まる。固体は粒子がびっしり並んで振動するだけ、液体は接触したまま流れる、気体はバラバラに飛び回る。さらに高温で電子がはがれた『プラズマ』を第四の状態と呼ぶ。", "easyHeadline": "粒の動きの激しさで、固体・液体・気体が決まる", "easyBody": "同じ水でも、氷・水・水蒸気という違う姿を見せるのは、粒(分子)どうしの引き合う力と、熱によって粒が動き回る激しさのバランスが変わるからです。固体は粒がびっしり並んでその場で震え、液体はくっついたまま流れ、気体はバラバラに飛び回っています。", "keyPoint": "三態の違いは『分子そのもの』ではなく『分子どうしの距離と動き』。水も水蒸気もH₂O分子は同じ。", "figure": "states", "body": [{"label": "気体の性質", "text": "体積の大半が空間。圧縮でき、温度を上げると膨張する（気体の法則）。"}, {"label": "プラズマ", "text": "宇宙の物質の大半はこの状態。炎の一番熱い部分もわずかに電離している。"}], "relatedTopics": [{"concept": "phase-transition", "relation": "原因と結果"}, {"concept": "intermolecular-forces", "relation": "原因と結果"}, {"concept": "flame-glow-plasma", "relation": "関連"}, {"concept": "chemical-bond", "relation": "関連"}], "referencedBy": [{ tle": "転写", "field": "molecular-biology"}, {"id": "ubiquitin-proteasome", "title": "ユビキチン・プロテアソーム系", "field": "molecular-biology"}]}, {"id": "ubiquitin-proteasome", "title": "ユビキチン・プロテアソーム系", "aka": "Ubiquitin–proteasome system", "field": "molecular-biology", "area": "タンパク質", "section": "合成と分解", "headline": "分解の目印を付けて、筒型シュレッダーへ", "summary": "要らなくなった・壊れたタンパク質を選んで壊す仕組み。小さなタンパク質『ユビキチン』を鎖状に付ける（ポリユビキチン化）と廃棄の目印になり、樽型の酵素複合体プロテアソームがその鎖を認識して基質を穴に引き込み、細かく切る。細胞周期・シグナル・品質管理を時間どおりに進めるのに不可欠。", "easyHeadline": "いらなくなったタンパク質に「捨てて」の目印を付けて分解する", "easyBody": "壊れた・不要になったタンパク質には「ユビキチン」という小さな目印が鎖のように付けられます。この目印が付いたタンパク質は、筒のような形をした分解装置に取り込まれて、細かく刻まれて処分されます。ゴミ出しのラベル付けのような仕組みです。", "keyPoint": "『作る』だけでなく『狙って壊す』こともタンパク質制御。2004年ノーベル化学賞。新薬モダリティのPROTACはこの仕組みを乗っ取って標的を分解させる。", "body": [{"label": "3段階の酵素", "text": "E1が活性化、E2が運搬、E3が基質を選んでユビキチンを渡す。E3の種類がターゲットの特異性を決める。"}, {"label": "プロテアソーム", "text": "26S。筒（20S）＋蓋（19S）。ATPで鎖をほどきながら中へ送る。"}, {"label": "医薬", "text": "ボルテゾミブ（多発性骨髄腫）はプロテアソーム阻害薬。PROTAC／分子接着剤は分解誘導の新分野。"}], "relatedTopics": [{"concept": "chaperone", "relation": "なかま"}, {"concept": "ptm", "relation": "なかま"}, {"concept": "translation", "relation": "対比"}, {"concept": "enzyme", "relation": "なかま"}], "referencedBy": [{"id": "apoptosis", "title": "アポトーシス", "field": "molecular-biology"}, {"id": "cell-cycle", "title": "細胞周期", "field": "molecular-biology"}, {"id": "chaperone", "title": "シャペロン", "field": "molecular-biology"}, {"id": "enzyme", "title": "酵素", "field": "molecular-biology"}, {"id": "organelles", "title": "細胞小器官", "field": "molecular-biology"}, {"id": "ptm", "title": "翻訳後修飾", "field": "molecular-biology"}, {"id": "translation", "title": "翻訳", "field": "molecular-biology"}]}, {"id": "universal-gravitation-and-orbits", "title": "万有引力と軌道", "aka": "Newton's law of universal gravitation", "field": "physics", "area": "力と運動", "section": "回転と重力", "headline": "質量があるもの同士は必ず引き合う", "summary": "ニュートンは、リンゴが落ちるのも月が地球を回り続けるのも同じ「万有引力」――質量を持つ物体同士が互いに引き合う力――で説明できることを示した。力の大きさは両者の質量の積に比例し、距離の2乗に反比例する。惑星や衛星が安定した軌道を描けるのは、重力がちょうど円（または楕円）運動に必要な向心力の役割を果たしているため。", "easyHeadline": "重さを持つもの同士は、必ず引き合っている", "easyBody": "リンゴが木から落ちるのも、月が地球の周りを回り続けるのも、実は同じ「引き合う力」で説明できます。人工衛星が軌道を回り続けているのは、実は「落ち続けているのに、地面の方が丸くカーブして逃げていくので、いつまでも地面にぶつからない」状態なのです。", "keyPoint": "「軌道を回る」とは、実は「落ち続けているのに、地面に届く前に地面のほうがカーブして逃げていく」状態。人工衛星は永遠に落下し続けている。", "figure": "gravity-orbit", "body": [{"label": "逆2乗則", "text": "距離が2倍になれば重力は1/4に。太陽系の惑星の運動（ケプラーの法則）もこの1つの式から導かれる。"}, {"label": "自由落下する宇宙ステーション", "text": "宇宙ステーション内が「無重力」に見えるのは重力が無いからではなく、乗組員も機体も同じ速度で落下し続けているため。"}], "relatedTopics": [{"concept": "circular-motion-and-centripetal-force", "relation": "構成する"}, {"concept": "angular-momentum-and-gyroscopes", "relation": "関連"}], "referencedBy": []}, {"id": "wave-basics-wavelength-period-speed", "title": "波の基本（波長・周期・速さ）", "field": "physics", "area": "波・光・音", "section": "振動と波", "headline": "波を特徴づける3つの数字", "summary": "波は「振動が空間を伝わる現象」で、山から山までの長さ（波長）・1回振動する時間（周期、または1秒間の振動回数=振動数）・波が進む速さの3つの量で特徴づけられる。これらは「速さ＝波長×振動数」という1本の式で結ばれ、音・光・水面波などあらゆる波に共通する。", "easyHeadline": "波を特徴づける3つの数字(長さ・時間・速さ)", "easyBody": "波には、山から山までの長さ(波長)、1回揺れるのにかかる時間(周期)、波が進む速さという3つの基本の数字があります。この3つは決まった式で結びついていて、音でも光でも水面の波でも同じルールが成り立ちます。", "keyPoint": "波が運ぶのは「物質」ではなく「エネルギーと形（振動のパターン）」——媒質の各点はその場で振動するだけ。", "body": [{"label": "横波と縦波", "text": "振動の向きが進行方向に垂直なら横波（光・水面波・弦の波）、進行方向と同じなら縦波（音波、疎密波）。媒質の各点自体は大きく移動せず、その場で振動を繰り返すだけで波形だけが進む。"}, {"label": "速さ＝波長×振動数", "text": "波長λ（1回の振動が占める空間の長さ）と振動数f（1秒あたりの振動回数）をかけると波の速さvになる（v=fλ）。同じ速さの波なら波長が長いほど振動数は小さい、というトレードオフがある。"}, {"label": "媒質と速さ", "text": "波の速さは基本的に伝わる媒質（空気・水・弦の張力など）で決まり、振動数を変えても速さは変わらない（波長の方が変わる）。光だけは真空中でも伝わり、真空中の速さは常に一定（光速）という特別な性質を持つ。"}], "relatedTopics": [{"concept": "simple-harmonic-motion-and-resonance", "relation": "構成する"}, {"concept": "sound-and-doppler-effect", "relation": "なかま"}, {"concept": "electromagnetic-spectrum", "relation": "なかま"}], "referencedBy": [{"id": "electromagnetic-spectrum", "title": "電磁波スペクトル", "field": "physics"}, {"id": "reflection-refraction-diffraction-interference", "title": "反射・屈折・回折・干渉", "field": "physics"}, {"id": "simple-harmonic-motion-and-resonance", "title": "単振動と共振", "field": "physics"}, {"id": "sound-and-doppler-effect", "title": "音とドップラー効果", "field": "physics"}]}, {"id": "wave-particle-duality-of-light", "title": "光は波か粒子か", "field": "physics", "area": "波・光・音", "section": "光", "headline": "光は波なのか、粒なのか——両方である", "summary": "干渉・回折という現象は光が「波」であることを示すが、光電効果（光を当てると金属から電子が飛び出す現象）はエネルギーの塊＝「粒子（光子）」としての性質を示す。20世紀初頭、光は状況に応じて波にも粒子にもふるまう「波と粒子の二重性」を持つことが明らかになり、これが量子力学誕生のきっかけになった。", "easyHeadline": "光は波なのか、粒なのか——実は両方の顔を持つ", "easyBody": "光は、重なり合って強め合ったり弱め合ったりする「波」らしい性質を見せる一方で、金属に当てると電子を弾き飛ばすという「粒」らしい性質も見せます。20世紀の初め、光はどちらか一方ではなく両方の性質を持つことが分かり、これが量子力学という新しい物理学の始まりになりました。", "keyPoint": "光電効果では、光の「強さ」ではなく「振動数（色）」が電子の飛び出しやすさを決める——これは光が波なら説明できず、光子1個ずつのエネルギーで説明するしかない。", "body": [{"label": "光が波である証拠", "text": "ヤングの二重スリット実験で見られる干渉縞は、光が重なり合って強め合ったり弱め合ったりする波の性質そのもの。19世紀にはマクスウェルの電磁気学で光は電磁波だと理論的にも確立した。"}, {"label": "光が粒子である証拠（光電効果）", "text": "金属に光を当てると電子が飛び出す現象で、電子が飛び出すかどうかは光の強さではなく振動数（色）で決まり、振動数が低いとどれだけ強い光を当てても電子は出ない。アインシュタインは光がエネルギーの決まった塊「光子」の集まりだと考えることでこれを説明し、後にノーベル賞を受けた。"}, {"label": "二重性の受け入れ", "text": "波としての性質（干渉・回折）と粒子としての性質（光電効果、決まったエネルギーの塊）は、日常の感覚では矛盾するが、光は状況に応じてどちらの姿も見せる。この二重性は後に電子など「粒子」とされてきたものにも見つかり（ド・ブロイの物質波）、量子力学全体の出発点になった。"}], "relatedTopics": [{"concept": "reflection-refraction-diffraction-interference", "relation": "関連"}, {"concept": "electromagnetic-spectrum", "relation": "関連"}, {"concept": "atom-structure", "relation": "関連", "note": "光と原子の相互作用の理解が量子力学の原子模型につながった"}], "referencedBy": [{"id": "electromagnetic-spectrum", "title": "電磁波スペクトル", "field": "physics"}, {"id": "reflection-refraction-diffraction-interference", "title": "反射・屈折・回折・干渉", "field": "physics"}]}, {"id": "why-programs-run", "title": "プログラムがなぜ動くのか", "aka": "Stored-program concept / CPUの実行サイクル", "field": "technology", "area": "計算とAI", "section": "情報を演算する", "year": 1945, "yearLabel": "1945年（ノイマン型：プログラム内蔵方式の提案）", "headline": "数値の命令をメモリに置き、CPUが1個ずつ順に実行する", "summary": "プログラムの正体は、「〜を足せ」「〜と比べて function App() {
  const [items, setItems] = useState(null);
  const [err, setErr] = useState(null);
  const [view, setView] = useState({ level:"home" });   // home | field | area | concept
  const [term, setTerm] = useState(null);
  const [openBody, setOpenBody] = useState({});
  const [easyMode, setEasyMode] = useState(false);

  function load() {
    try {
      const list = __EMBEDDED_DATA__.slice().sort((a,b)=> (a.title||"").localeCompare(b.title||"", "ja"));
      setItems(list);
    } catch (e) { setErr(e.message); }
  }
  useEffect(() => { load(); }, []);

  const byId = useMemo(() => Object.fromEntries((items||[]).map(r=>[r.id,r])), [items]);

  if (err) return <div className="max-w-xl mx-auto mt-16 text-rose-300 text-sm">読み込めませんでした：{err}</div>;
  if (!items) return <div className="text-slate-400 p-8 text-sm">読み込み中…</div>;

  const go = v => { setView(v); setOpenBody({}); setEasyMode(false); window.scrollTo(0,0); };
  const openConcept = id => byId[id] && go({ level:"concept", id });

  const inField = fid => items.filter(r=>r.field===fid);
  const inArea  = (fid,a) => items.filter(r=>r.field===fid && r.area===a);

  /* ---- パンくず ---- */
  const Crumbs = () => {
    const parts = [{ label:"シナプスキーマ", act:()=>go({level:"home"}) }];
    let backTo = null;
    if (view.level === "field") { parts.push({ label:FIELD[view.field].name }); backTo = {level:"home"}; }
    if (view.level === "timeline") {
      parts.push({ label:FIELD[view.field].name, act:()=>go({level:"field", field:view.field}) });
      parts.push({ label:"テクノロジー史" });
      backTo = {level:"field", field:view.field};
    }
    if (view.level === "area") {
      parts.push({ label:FIELD[view.field].name, act:()=>go({level:"field", field:view.field}) });
      parts.push({ label:view.area });
      backTo = {level:"field", field:view.field};
    }
    if (view.level === "concept") {
      const r = byId[view.id];
      parts.push({ label:FIELD[r.field].name, act:()=>go({level:"field", field:r.field}) });
      if (r.area) parts.push({ label:r.area, act:()=>go({level:"area", field:r.field, area:r.area}) });
      parts.push({ label:r.title });
      backTo = r.area ? {level:"area", field:r.field, area:r.area} : {level:"field", field:r.field};
    }
    return (
      <div className="flex flex-wrap items-center gap-1.5 text-[12px] text-slate-500 mb-5">
        {backTo && <button onClick={()=>go(backTo)} className="mr-1 px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">← 戻る</button>}
        {parts.map((p,i)=>(
          <Fragment key={i}>
            {i>0 && <span className="text-slate-700">/</span>}
            {p.act ? <button onClick={p.act} className="hover:text-sky-300">{p.label}</button> : <span className="text-slate-300">{p.label}</span>}
          </Fragment>
        ))}
      </div>
    );
  };

  /* ---- HOME (L1) ---- */
  const Home = () => (
    <div className="rise">
      <h1 className="text-[22px] font-bold text-slate-100">シナプスキーマ：サイエンス</h1>
      <p className="text-slate-400 text-[13px] mt-1.5 mb-7 leading-relaxed">
        分野 → 領域 → セクション → 概念と潜っていく知識マップ。概念どうしは分野をまたいでつながっている。
        <span className="text-slate-500">（{items.length} 概念）</span>
      </p>
      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        {FIELDS.map(f=>{
          const na = areasOf(f.id, items).length;
          return (
            <button key={f.id} onClick={()=>go({level:"field", field:f.id})}
              className="text-left rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/70 hover:border-slate-700 p-4 transition">
              <div className="flex items-baseline gap-2">
                <span className="text-[15px] font-bold" style={{color: f.accent}}>{f.name}</span>
                <span className="text-[10px] text-slate-600">{f.en}</span>

            </button>
          );

      </div>
    </div>
  );

  /* ---- FIELD (L2) ---- */
  const FieldView = () => {

    const areas = areasOf(f.id, items);
    return (
      <div className="rise">
        <Crumbs />
        <div className="flex items-center justify-between flex-wrap gap-2">
          <h2 className="text-[19px] font-bold" style={{color: f.accent}}>{f.name}</h2>
          {f.id === "technology" && (
            <button onClick={()=>go({level:"timeline", field:f.id})}

            </button>
          )}

        <p className="text-[11px] text-slate-600 mb-6">{f.en}</p>
        <div className="grid gap-2.5">

                <span className="absolute -left-5 top-4 w-2.5 h-2.5 rounded-full" style={{background:f.accent}} />
                <div className="text-[11px] font-semibold" style={{color:f.accent}}>{r.yearLabel || r.year}</div>
                <div className="flex items-baseline gap-2 mt-0.5">
                  <span className="text-[14px] font-semibold text-slate-100">{r.title}</span>
                  <span className="text-[10.5px] text-slate-600">{r.area}</span>
                </div>
                <p className="text-[12.5px] text-slate-400 mt-0.5">{r.headline}</p>
              </button>
            ))}
          </div>
        </div>
        {undated.length > 0 && (
          <p className="text-[11px] text-slate-600 mt-6">※ {undated.map(r=>r.title).join("・")} は特定の年代を持たない原理的な概念のため、年表には含めていません。</p>
        )}
      </div>
    );
  };

  /* ---- AREA (L3) ---- */
  const AreaView = () => {
    const f = FIELD[view.field];
    const rows = inArea(f.id, view.area);
    const groups = sectionsOf(f.id, view.area, rows)
      .map(sec => [sec, rows.filter(r=>(r.section||"")===sec)])
      .filter(([,list]) => list.length);
    const multi = groups.length > 1;
    return (
      <div className="rise">
        <Crumbs />
        <div className="flex items-baseline gap-2.5 mb-2">
          <h2 className="text-[19px] font-bold text-slate-100">{view.area}</h2>
          <span className="text-[11px]" style={{color:f.accent}}>{f.name}</span>
        </div>
        {AREA_BLURB[view.area] && <p className="text-[12px] text-slate-400 mb-6 leading-relaxed">{AREA_BLURB[view.area]}</p>}
        <div className="space-y-6">
          {groups.map(([sec,list])=>(
            <div key={sec}>
              {multi && sec && (
                <div className="text-[11px] font-semibold text-slate-500 mb-2 border-l-2 pl-2" style={{borderColor:f.accent}}>{sec}</div>

              <div className="grid gap-2.5">
                {list.map(r=>(
                  <button key={r.id} onClick={()=>openConcept(r.id)}
                    className="text-left rounded-lg border border-slate-800 bg-slate-900/60 hover:bg-slate-800/70 hover:border-slate-700 px-4 py-3 transition">
                    <div className="flex items-baseline gap-2">
                      <span className="text-[14px] font-semibold text-slate-100">{r.title}</span>

                    <p className="text-[12.5px] mt-0.5" style={{color:f.accent}}>{r.headline}</p>

              </div>
            </div>
          ))}
        </div>
      </div>
    );

  /* ---- CONCEPT (L4) ---- */
  const Concept = () => {
    const r = byId[view.id];
    if (!r) return <Crumbs />;
    const f = FIELD[r.field];
    const fig = r.figure && FIGS[r.figure];
    const rels = (r.relatedTopics||[]).filter(x=>x.concept && byId[x.concept]);
    const grouped = RELATION_ORDER
      .map(rel => [rel, rels.filter(x=>(x.relation||"関連")===rel)])
      .filter(([,arr]) => arr.length);
    const backs = (r.referencedBy||[]);

    return (
      <div className="rise max-w-3xl">
        <Crumbs />
        <div className="text-[11px] font-semibold tracking-wide mb-1" style={{color:f.accent}}>
          {f.name}<span className="text-slate-600 font-normal">{r.area ? " · " + r.area : ""}{r.section ? " · " + r.section : ""}{(r.yearLabel || r.year) ? " · " + (r.yearLabel || (r.year + "年")) : ""}</span>
        </div>

        <p className="text-[15px] font-semibold mt-3" style={{color:f.accent}}>{easyMode && r.easyHeadline ? r.easyHeadline : r.headline}</p>

          <div className="mt-3">

              {easyMode ? "🔬 元の説明に戻す" : "🍼 かみくだく"}
            </button>
            {easyMode && <span className="ml-2 text-[11px] text-emerald-400/70 align-middle">やさしい説明を表示中</span>}
          </div>
        )}

        {fig && (
          <figure className="mt-5 rounded-xl border border-slate-800 bg-slate-900/70 p-4">
            <fig.c />
            <figcaption className="text-[11.5px] text-slate-400 mt-2 leading-relaxed">{fig.cap}</figcaption>
          </figure>
        )}

        {grouped.length > 0 && (
          <div className="mt-6">
            <div className="text-[11px] font-semibold text-slate-500 mb-2">関連する概念</div>
            <div className="space-y-2">
              {grouped.map(([rel,arr])=>(
                <div key={rel} className="flex flex-wrap items-center gap-1.5">
                  <span className="text-[10.5px] text-slate-500 w-full sm:w-auto mr-1">
                    {rel}<span className="text-slate-700"> · {RELATION_HINT[rel]}</span>
                  </span>
                  {arr.map((x,i)=>{
                    const t = byId[x.concept];
                    const tf = FIELD[t.field];
                    return (
                      <button key={i} onClick={()=>openConcept(x.concept)}
                        className="text-[12px] px-2.5 py-1 rounded-full border border-slate-700 bg-slate-800/70 text-slate-200 hover:border-sky-600 hover:text-sky-200 transition">
                        {t.title}
                        {t.field!==r.field && <span className="ml-1 text-[9px]" style={{color:tf.accent}}>·{tf.name}</span>}
                      </button>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        )}

        {!easyMode && r.keyPoint && (
          <div className="mt-6 rounded-lg border-l-2 border-amber-500 bg-amber-500/10 px-4 py-3">
            <div className="text-[10.5px] font-semibold text-amber-400/90 mb-1">覚えておきたい一点</div>
            <p className="text-[13.5px] text-amber-100/90 leading-relaxed"><Linkify text={r.keyPoint} onTerm={setTerm}/></p>
          </div>
        )}

        <div className="mt-6">
          <div className="text-[11px] font-semibold text-slate-500 mb-1.5">{easyMode && r.easyBody ? "やさしく言うと" : "要するに"}</div>
          <p className="text-[14px] text-slate-200 leading-[1.85]">
            {easyMode && r.easyBody ? r.easyBody : <Linkify text={r.summary} onTerm={setTerm}/>}
          </p>
        </div>

        {!easyMode && (r.body||[]).length > 0 && (
          <div className="mt-6">
            <div className="text-[11px] font-semibold text-slate-500 mb-2">掘り下げ</div>
            <div className="rounded-lg border border-slate-800 divide-y divide-slate-800 overflow-hidden">
              {r.body.map((b,i)=>(
                <div key={i}>
                  <button onClick={()=>setOpenBody(s=>({...s,[i]:!s[i]}))}
                    className="w-full text-left px-4 py-2.5 flex items-center gap-2 hover:bg-slate-800/50">
                    <span className="text-slate-500 text-[11px]">{openBody[i] ? "−" : "+"}</span>
                    <span className="text-[13px] font-medium text-slate-200">{b.label}</span>
                  </button>
                  {openBody[i] && (
                    <div className="px-4 pb-3 pl-9 text-[13px] text-slate-300 leading-[1.8]">
                      <Linkify text={b.text} onTerm={setTerm}/>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {backs.length > 0 && (
          <div className="mt-6">
            <div className="text-[11px] font-semibold text-slate-500 mb-2">この概念に言及する概念</div>
            <div className="flex flex-wrap gap-1.5">
              {backs.map((b,i)=>(
                <button key={i} onClick={()=>openConcept(b.id)}
                  className="text-[12px] px-2.5 py-1 rounded-full border border-slate-800 bg-slate-900 text-slate-400 hover:text-slate-100 hover:border-slate-600 transition">
                  {b.title}
                </button>
              ))}
            </div>
          </div>
        )}


      </div>
    );
  };

  return (
    <div className="min-h-screen text-slate-300" style={{fontFamily:"system-ui, sans-serif"}}>
      <div className="max-w-5xl mx-auto px-5 py-8">
        {view.level==="home" && <Home/>}
        {view.level==="field" && <FieldView/>}
        {view.level==="timeline" && <TimelineView/>}
        {view.level==="area" && <AreaView/>}
        {view.level==="concept" && <Concept/>}
      </div>

      {term && GLOSSARY[term] && (
        <div onClick={()=>setTerm(null)} className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
          <div onClick={e=>e.stopPropagation()} className="max-w-md w-full rounded-xl border border-slate-700 bg-slate-900 p-5 rise">
            <div className="flex items-start justify-between gap-4">
              <h3 className="text-[15px] font-bold text-sky-300">{GLOSSARY[term].t}</h3>
              <button onClick={()=>setTerm(null)} className="text-slate-500 hover:text-slate-200 text-lg leading-none">×</button>
            </div>
            <p className="text-[13px] text-slate-300 mt-2.5 leading-[1.8]">{GLOSSARY[term].b}</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
