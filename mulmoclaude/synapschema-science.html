る。半径が小さくなれば回転速度が増して埋め合わせる。"}, {"label": "ジャイロの安定性", "text": "回転している物体はその回転軸を保とうとする性質（ジャイロ効果）があり、外力への応答も直感に反する方向（歳差運動）に現れる。"}], "relatedTopics": [{"concept": "circular-motion-and-centripetal-force", "relation": "なかま"}, {"concept": "momentum-and-impulse", "relation": "なかま"}, {"concept": "molecular-motor", "relation": "関連"}], "easyHeadline": "腕を縮めるとスピンが速くなる、回転の“勢い”の話", "easyBody": "フィギュアスケーターが回転しながら腕を縮めると、急にくるくると速く回りだします。これは新しい力を加えたわけではなく、体の縮み方に合わせて回転の速さが自動的に増えて、回転の「勢い」の合計が変わらないようにしているのです。高速で回るコマが倒れずに立っていられるのも、同じ仕組みのおかげです。", "referencedBy": [{"id": "universal-gravitation-and-orbits", "title": "万有引力と軌道", "field": "physics"}, {"id": "circular-motion-and-centripetal-force", "title": "円運動と向心力", "field": "physics"}, {"id": "momentum-and-impulse", "title": "運動量と力積", "field": "physics"}]}, {"id": "animal-body-plans", "title": "体制の基本——対称性と体腔", "aka": "Body plans: symmetry & coelom", "field": "biology", "area": "動物", "section": "動物の分類とからだ", "headline": "動物の体の設計図は対称性と体の中の空洞で決まる", "summary": "動物の体の基本構造（体制）を比較するとき、生物学では「対称性」と「体腔（たいこう、体の中にある空所）」という2つの軸がよく使われる。対称性には、どの方向に切っても同じ形になる放射相称（クラゲなど、周囲の環境からの刺激にどの方向からでも反応しやすい）と、体の左右が鏡合わせになる左右相称（多くの動物、前後・背腹の区別があり一方向への効率的な移動に向く）がある。体腔は、体壁と消化管の間にできる空間で、これがない動物、体腔もどきを持つ動物、本物の体腔（真体腔）を持つ動物に分けられ、真体腔があると内臓を保護しつつ自由に配置でき、循環系や複雑な器官を発達させやすくなる。こうした体制の違いは動物の系統関係を推定する手がかりにもなってきた。", "keyPoint": "体の「対称性」と「体腔の有無」は、動物がどんな暮らし方をするために体を設計したかを映す鏡である。", "body": [{"label": "放射相称と左右相称", "text": "放射相称の動物は水中を漂う・待ち伏せするような生活に向き、左右相称の動物は頭部に感覚器官を集中させて一定方向へ効率よく進む生活に向く。左右相称動物では前方に脳や口が集中する「頭化」が進みやすい。"}, {"label": "体腔が生んだ自由度", "text": "真体腔を持つ動物は、消化管が体壁から独立して動けるため、腸のぜん動運動が体全体の動きに干渉されにくくなる。この空間は血液やリンパ液を巡らせる循環系の通り道としても使われ、より大型で複雑な体を可能にした。"}], "relatedTopics": [{"concept": "vertebrate-classification", "relation": "なかま"}, {"concept": "invertebrate-diversity", "relation": "なかま"}, {"concept": "common-ancestry-phylogeny", "relation": "関連"}], "referencedBy": [{"id": "invertebrate-diversity", "title": "無脊椎動物の多様性", "field": "biology"}, {"id": "vertebrate-classification", "title": "脊椎動物の分 tion / ultraviolet catastrophe", "field": "quantum", "area": "量子のはじまり", "section": "前期量子論", "headline": "熱い物体が出す光の色を、古典物理は説明できなかった", "summary": "鉄を熱すると赤→白と色が変わるように、あらゆる物体は温度に応じた光（電磁波）を放つ。これを理想化したものが「黒体放射」で、19世紀末、この放射のエネルギー分布を当時の物理学（電磁気学と熱力学）で計算すると、波長が短くなるほどエネルギーが無限大に発散するという明らかにおかしな結果（紫外破綻）になった。実際の観測ではエネルギーは短波長側でむしろ小さくなる。この矛盾が、後にプランクの量子仮説を生む直接のきっかけとなった。", "keyPoint": "「紫外破綻」という名前は、計算がおかしくなるのが可視光より波長の短い紫外線側だったことに由来する。理論が予言する“無限大のエネルギー”は、当然ながら現実には存在しない。", "body": [{"label": "なぜ古典物理では説明できなかったのか", "text": "当時の理論（レイリー・ジーンズの法則）は、光を出す振動の一つひとつが自由に好きなエネルギーを持てるという前提に立っていた。この前提のもとでは、波長が短い振動ほど数が多くなり、それぞれが少しずつでもエネルギーを持てば合計は際限なく増えてしまう。"}, {"label": "実験との食い違い", "text": "実際に灼熱の物体から出る光を測定すると、ある波長でピークを迎えたあとエネルギーは減っていく。理論と実験のこのギャップは、当時の物理学の根本に何かが欠けていることを示す象徴的な問題として知られていた。"}], "relatedTopics": [{"concept": "planck-quantum-hypothesis", "relation": "原因と結果"}, {"concept": "photoelectric-effect", "relation": "なかま"}, {"concept": "electromagnetic-spectrum", "relation": "関連"}], "easyHeadline": "熱いものが光る色を、昔の物理学は説明できなかった", "easyBody": "鉄を熱していくと赤くなり、もっと熱すると白っぽく光ります。この「熱いものがどんな色に光るか」を当時の物理学の式で計算すると、なぜか答えが無限大になってしまうというおかしなことが起きました。まるで電卓が「熱いお湯の温度は無限度です」と答えるようなもので、明らかに何かが間違っていました。この謎を解く鍵が、次に出てくる「量子」という考え方です。", "referencedBy": [{"id": "planck-quantum-hypothesis", "title": "プランクの量子仮説（エネルギーは飛び飛び）", "field": "quantum"}]}, {"id": "blockchain-basics", "title": "ブロックチェーンの基本構造", "aka": "Blockchain", "field": "computer", "area": "暗号", "section": "安全に伝える仕組み", "headline": "改ざんを検知しやすい取引記録の鎖", "summary": "ブロックチェーンは、取引などのデータを「ブロック」という単位でまとめ、それぞれのブロックに直前のブロックのハッシュ値を組み込むことで鎖（チェーン）のようにつなげていくデータ構造である。もし過去のあるブロックの内容を書き換えると、そのブロックのハッシュ値が変わってしまい、それ以降すべてのブロックの整合性が崩れるため、改ざんが極めて発見されやすくなる。さらに、この鎖を1つの中央管理者ではなく、ネットワークに参加する多数のコンピュータがそれぞれ同じコピーを持ち合う「分散台帳」として運用することで、一部が改ざんされても多数派の正しい記録と食い違うため不正が成立しにくい。この「改ざんに強い分散型の記録簿」という性質が、仮想通貨だけでなく契約記録や来歴管理など幅広い分野で応用されている理由である。", "keyPoint": "各ブロックが前のブロックのハッシュ値を含むことで、過去の改ざんが連鎖的に発覚する構造になっている。", "body": [{"label": "ハッシュの連鎖という仕掛け", "text": "各ブロックには取引データに加えて直前のブロックのハッシュ値が記録されており、この連鎖が途切れなく続くことで記録全体の正しさが保証される。1つでも過去のブロックを改ざんすると、そこから先すべてのハッシュ値が一致しなくなる。"}, {"label": "分散台帳という運用形態", "text": "ブロックチェーンの記録は特定のサーバーが1つ管理するのではなく、参加者全員がほぼ同じコピーを持ち合う形で運用される。改ざんするには参加者の過半数を同時に書き換える必要があり、参加者が多いほど不正は現実的に困難になる。"}], "relatedTopics": [{"concept": "hash-functions", "relation": "構成する"}, {"concept": "distributed-systems-basics", "relation": "技術で見る"}, {"concept": "symmetric-vs-asymmetric-encryption", "relation": "関連"}], "referencedBy": [{"id": "hash-functions", "title": "ハッシュ関数——一方向の指紋", "field": "computer"}, {"id": "distributed-systems-basics", "title": "分散システムの基本", "field": "computer"}]}, {"id": "blood-cells", "title": "血球——赤血球・白血球・血小板", "aka": "Blood Cells", "field": "human-body", "area": "細胞", "section": "からだをつくる細胞", "headline": "酸素運搬・防御・止血を分担する血液中の働き手", "summary": "血液は液体成分の血漿と、その中に浮かぶ血球からできており、血球は大きく赤血球・白血球・血小板の3種類に分けられる。赤血球はヘモグロビンというタンパク質を大量に詰め込んだ細胞で、肺で受け取った酸素を全身の組織に届ける専門家である。白血球は複数の種類があり、細菌やウイルスを見つけて排除する免疫の主力部隊として働く。血小板は細胞というより細胞のかけらのような小さな粒で、血管が傷つくと集まって傷口をふさぎ出血を止める役割を担う。これら3種類はすべて骨の中心にある骨髄の幹細胞から作られ、それぞれ数日から数か月という寿命で入れ替わり続けている。", "keyPoint": "血液の主役は液体部分ではなく、酸素運搬・防御・止血をそれぞれ専門化した3種類の血球である。", "body": [{"label": "赤血球とヘモグロビン", "text": "赤血球は核を持たない特殊な細胞で、その内部空間のほとんどを酸素と結びつくヘモグロビンで満たしている。この構造のおかげで、体積あたりより多くの酸素を運べる。"}, {"label": "白血球の多様性", "text": "好中球やマクロファージのように病原体を直接飲み込むもの、T細胞やB細胞のように特定の敵を記憶して攻撃するものなど、白血球には役割の異なる複数の種類が存在する。"}, {"label": "すべて骨髄から生まれる", "text": "赤血球・白血球・血小板はいずれも骨髄にある造血幹細胞という一種類の細胞から分化して作られ、寿命が尽きた分は常に新しく補充されている。"}], "relatedTopics": [{"concept": "hemoglobin", "relation": "構成する"}, {"concept": "heart-circulation", "relation": "関連"}, {"concept": "immune-cell-lineup", "relation": "なかま"}, {"concept": "stem-cells", "relation": "原因と結果"}], "referencedBy": [{"id": "immune-cell-lineup", "title": "免疫細胞図鑑（好中球・マクロファージ・T細胞・B細胞）", "field": "human-body"}, {"id": "stem-cells", "title": "幹細胞と再生医療", "field": "human-body"}, {"id": "heart-circulation", "title": "心臓と血液循環", "field": "human-body"}, {"id": "tissue-types", "title": "組織の4タイプ（上皮・結合・筋・神経組織）", "field": "human-body"}, {"id": "lungs-gas-exchange", "title": "肺とガス交換", "field": "human-body"}]}, {"id": "blood-sugar-regulation", "title": "血糖調節——インスリンとグルカゴンの綱引き", "aka": "Blood Sugar Regulation", "field": "human-body", "area": "ホルモン", "section": "情報を血流で届ける", "headline": "インスリンとグルカゴンが押し合う血糖値の綱引き", "summary": "血糖値(血液中のブドウ糖濃度)は、膵臓から出る二つのホルモンの綱引きによって一定範囲に保たれている。食後に血糖値が上がると膵臓のβ細胞がインスリンを分泌し、細胞に糖を取り込ませたり肝臓に糖をグリコーゲンとして蓄えさせたりして血糖値を下げる。逆に空腹が続いて血糖値が下がると、膵臓のα細胞がグルカゴンを分泌し、肝臓に蓄えたグリコーゲンを糖に戻して血液中に放出させることで血糖値を上げる。この二つのホルモンが常に反対方向に働くことで、食事のタイミングに関わらず脳などに必要な糖を安定して供給できている。インスリンの作用が効きにくくなったり分泌が不足したりすると血糖値が下がらなくなり、これが糖尿病という病気の本質である。", "keyPoint": "血糖値は「上げるホルモン」と「下げるホルモン」の両方があって初めて安定する、綱引きの仕組みで保たれている。", "body": [{"label": "インスリンの働き", "text": "インスリンは筋肉や脂肪の細胞に糖を取り込む扉を開けさせるほか、肝臓に余った糖をグリコーゲンという貯蔵形に変えさせる働きを持つ。血糖値を下げる方向に働く唯一のホルモンである。"}, {"label": "グルカゴンとの綱引き", "text": "グルカゴンはインスリンとは正反対に、肝臓に蓄えたグリコーゲンを分解して糖を血液中に戻させる。空腹時にも脳へのエネルギー供給を絶やさないための仕組みである。"}, {"label": "バランスが崩れると", "text": "インスリンの分泌不足や効きにくさが続くと血糖値が下がらなくなり、血管や神経を傷つける糖尿病につながる。この病気の治療には、インスリンそのものを注射で補う方法がとられることもある。"}], "relatedTopics": [{"concept": "insulin", "relation": "はたらく相手"}, {"concept": "endocrine-system", "relation": "構成する"}, {"concept": "liver-metabolism-detox", "relation": "はたらく相手"}, {"concept": "hormone-feedback-loop", "relation": "なかま"}], "referencedBy": [{"id": "hormone-feedback-loop", "title": "フィードバック調節——出しすぎを止めるしくみ", "field": "human-body"}, {"id": "endocrine-system", "title": "内分泌系——血流を使った情報伝達", "field": "human-body"}, {"id": "digestive-system", "title": "消化管——分解と吸収の一本道", "field": "human-body"}, {"id": "liver-metabolism-detox", "title": "肝臓——代謝と解毒の工場", "field": "human-body"}]}, {"id": "bohr-atomic-model", "title": "線スペクトルとボーアの原子模型", "aka": "Bohr model / atomic spectral lines", "field": "quantum", "area": "量子のはじまり", "section": "前期量子論", "headline": "原子の中の電子は、決まった軌道しか回れない", "summary": "水素ガスを放電させると特定の波長の光だけが線状に見える「線スペクトル」が観測される。当時の物理学では、電子が原子核の周りを回る古典的な軌道運動をしていれば電磁波を出し続けてエネルギーを失い、あっという間に核に落ち込んでしまうはずで、原子は安定に存在できないはずだった。1913年、ニールス・ボーアはプランクの量子仮説を応用し、電子は特定の飛び飛びのエネルギーを持つ軌道しか取れず、軌道を移るときにその差分のエネルギーを1個の光子として放出・吸収すると仮定した。この模型は水素原子の線スペクトルの波長を驚くほど正確に説明した。", "keyPoint": "花火や街灯（ナトリウムランプの黄色、水銀灯の青白さ）の特有の色は、電子が特定の軌道間を飛び移るときに決まった波長の光を出すというボーアの考え方そのものの実例である。", "body": [{"label": "量子条件と定常状態", "text": "ボーアは電子の角運動量がある最小単位の整数倍しか取れないと仮定し、その条件を満たす軌道（定常状態）にいる限り電子はエネルギーを失わず安定に回り続けられるとした。"}, {"label": "模型の限界とその先へ", "text": "ボーアの模型は水素原子のような電子1個の系ではよく合うが、電子が複数ある原子には正確には当てはまらない。後にシュレディンガー方程式に基づくより精密な量子力学に置き換えられるが、「エネルギー準位は飛び飛び」という核心的な発想は現代の原子模型にも受け継がれている。"}], "relatedTopics": [{"concept": "planck-quantum-hypothesis", "relation": "原因と結果"}, {"concept": "atomic-orbitals-quantum-numbers", "relation": "原因と結果"}, {"concept": "laser-stimulated-emission", "relation": "関連"}, {"concept": "atom-structure", "relation": "関連"}], "easyHeadline": "電子は好きな高さではなく、決まった「棚」にしか乗れない", "easyBody": "原子の中の電子を、本棚に並ぶ本だと考えてください。本は棚と棚の間の空中には置けず、決まった段（棚板）の上にしか置けません。電子が上の棚から下の棚に「落ちる」とき、その高さの差に相当するエネルギーがピカッと光（特定の色の光）として飛び出します。この「決まった段しかない」という考え方で、原子から出る光の色がきっちり決まっている理由が説明できました。", "referencedBy": [{"id": "planck-quantum-hypothesis", "title": "プランクの量子仮説（エネルギーは飛び飛び）", "field": "quantum"}, {"id": "laser-stimulated-emission", "title": "レーザーと誘導放出", "field": "quantum"}, {"id": "atomic-orbitals-quantum-numbers", "title": "原子軌道と量子数", "field": "quantum"}, {"id": "quantum-sensors-atomic-clocks", "title": "量子センサー・原子時計", "field": "quantum"}]}, {"id": "brain-regions", "title": "脳の地図——大脳・小脳・脳幹", "aka": "Brain Regions", "field": "human-body", "area": "神経", "section": "情報を伝えるからだの配線", "headline": "大脳・小脳・脳幹に役割分担された脳の地図", "summary": "脳は一枚岩の臓器ではなく、大きく大脳・小脳・脳幹という部位に分かれ、それぞれ異なる役割を担っている。大脳は表面のしわの多い部分で、思考・言語・記憶・感情といった高度な精神活動と、意識的な運動の指令を担当する最も大きな領域である。小脳は大脳の後下部にある比較的小さな部位だが、運動の細かい調整やバランス、体の動きの学習を担い、ここが損傷するとふらつきや細かい動作の乱れが生じる。脳幹は脳の最も奥、脊髄につながる部分で、呼吸や心拍、体温調節といった生命維持に直結する自動的な機能を司っており、この部位の機能停止は「脳死」の判定に直結するほど重要である。このように脳は場所によって担当が明確に分かれた地図のような構造を持ち、MRIなどの医用画像技術によって、どの部位がどんな活動時に働くかを外から観察できるようになってきた。", "keyPoint": "脳は大脳(思考)・小脳(運動調整)・脳幹(生命維持)という役割の異なる部位の集合体である。", "body": [{"label": "大脳が担う高次機能", "text": "大脳の表面(大脳皮質)は場所ごとに視覚・聴覚・言語・運動などの担当が分かれており、この地図のような機能分担が思考や意識的な行動を可能にしている。"}, {"label": "小脳の縁の下の力持ち的な役割", "text": "小脳は意識に上りにくいが、歩く・字を書くといった細かい運動の微調整とバランス感覚を担っており、損傷すると動作がぎこちなくなる。"}, {"label": "脳幹という生命維持の中枢", "text": "脳幹は呼吸や心拍、血圧といった生きるために欠かせない自動機能をコントロールしており、この部位が機能を失うと自発呼吸すら維持できなくなる。"}], "relatedTopics": [{"concept": "neuron-synapse", "relation": "構成する"}, {"concept": "nervous-system-overview", "relation": "構成する"}, {"concept": "medical-imaging", "relation": "技術で見る"}, {"concept": "reflex-arc", "relation": "関連"}], "referencedBy": [{"id": "neuron-synapse", "title": "ニューロンとシナプス伝達", "field": "human-body"}, {"id": "reflex-arc", "title": "反射弓——考えるより速い反応", "field": "human-body"}, {"id": "nervous-system-overview", "title": "神経系の全体像——中枢と末梢", "field": "human-body"}, {"id": "cooking-hypothesis", "title": "調理が人類を進化させた説", "field": "food"}]}, {"id": "camera-mechanism", "title": "カメラの仕組み", "aka": "How cameras capture images", "field": "mechanisms", "area": "光・電波でとらえる", "section": "見る", "headline": "レンズで光を集め、素子が明るさを電気信号に変える", "summary": "カメラはまずレンズで被写体からの光を屈折させ、1点に集めて像(ピント)を結ぶ。デジタルカメラではその像をイメージセンサー(CMOSなど)が受け止め、無数の小さな光センサーが1つ1つ「そこに届いた光の強さ」を電気信号に変換する。それぞれの画素の前に赤・緑・青のフィルターを置くことで色の情報も得ており、これらの信号を並べて処理すると1枚のデジタル画像になる。絞り(光の量)とシャッター速度(光を受ける時間)を調整することで、明るさとブレの写り方を制御する。", "keyPoint": "カメラの心臓部は「光を屈折させて集めるレンズ」と「光の強さを電気に変えるセンサー」の2段構え。", "body": [{"label": "ピントが合う仕組み", "text": "レンズと素子の距離を変えると、像がきれいに1点に集まる位置(焦点)がずれ、ボケたりくっきりしたりする。"}, {"label": "フィルムとの違い", "text": "フィルムは光で化学変化する銀の粒を使うが、デジタルは光を直接電気信号として読み出す点が異なる。"}], "relatedTopics": [{"concept": "lenses-mirrors-and-imaging", "relation": "技術で見る"}, {"concept": "electromagnetic-spectrum", "relation": "関連"}, {"concept": "reflection-refraction-diffraction-interference", "relation": "はたらく相手"}], "easyHeadline": "レンズで光を集め、センサーが電気信号に変えている", "easyBody": "カメラはまずレンズで光を1点に集めてピントを合わせます。デジタルカメラでは、集まった光をセンサーの中の無数の小さな点が受け止め、それぞれの明るさと色を電気信号に変えることで、1枚の画像を作り出しています。", "referencedBy": []}, {"id": "canning-and-preservation-history", "title": "保存技術が変えた食と戦争", "aka": "History of food preservation and canning", "field": "food", "area": "食の歴史と栄養学", "section": "人類史を変えた食", "headline": "ナポレオンの懸賞金から生まれた缶詰保存技術", "summary": "遠征する軍隊にとって食料の腐敗は常に大きな課題で、1795年にフランスのナポレオンが「軍の食料を長期保存する方法」に懸賞金をかけると、菓子職人ニコラ・アペールが食品を瓶に詰めて加熱密封する方法を考案した。当時は微生物の存在すら知られておらず、加熱で「腐敗の原因となる空気の作用」を止めていると考えられていたが、後の時代にルイ・パスツールが加熱殺菌の原理(低温殺菌法)を科学的に解明したことで、なぜ缶詰・瓶詰めが腐らないのかがようやく説明された。ブリキ缶を使った現在型の「缶詰」もほぼ同時期にイギリスで発明され、遠洋航海や極地探検、戦場での食料供給を根本から変えた。", "keyPoint": "缶詰は、微生物学が確立するより半世紀以上前に、原理を知らないまま「経験的に効く方法」として発明された保存技術。", "body": [{"label": "皮肉な副作用", "text": "長期保存できる缶詰食料は壊血病の原因(ビタミンC不足)を解決しなかったため、19世紀の北極探検隊などでは十分な食料があるにもかかわらず壊血病で命を落とす例が続いた。"}, {"label": "冷凍・冷蔵への発展", "text": "缶詰の後、19世紀後半には人工冷凍技術が発達し、食肉や生鮮食品を長距離輸送できるようになったことで、世界の食料流通の姿がさらに大きく変わった。"}], "relatedTopics": [{"concept": "deficiency-diseases-history", "relation": "対比"}, {"concept": "fermentation-food", "relation": "なかま"}, {"concept": "germ-theory-vaccines", "relation": "原因と結果"}], "easyHeadline": "缶詰は、原因が分かる前に発明された保存技術だった", "easyBody": "ナポレオンが懸賞金をかけたことで生まれた瓶詰め・缶詰の保存技術は、なぜ食品が腐らなくなるのか(微生物の存在)が科学的に分かるより何十年も前に実用化されました。ただし壊血病は防げなかったため、探検隊が缶詰を持ちながら壊血病で亡くなる例もありました。", "referencedBy": [{"id": "deficiency-diseases-history", "title": "欠乏症が切り開いた栄養学", "field": "food"}]}, {"id": "carbon-bonding", "title": "炭素と有機化合物", "aka": "Carbon & organic compounds", "field": "chemistry", "area": "有機化学", "section": "炭素の骨格", "headline": "炭素は4方向に手を出し、骨格を無限につくれる", "summary": "有機化合物は炭素を骨格にした分子の総称。炭素は共有結合の手を4本持ち、しかも炭素どうしで安定に結合できるので、鎖・枝分かれ・環・立体網など際限なく多様な骨格を作れる。既知の化合物の大半が有機物なのはこのため。生命の分子（糖・脂質・タンパク質・核酸）もすべて炭素骨格。", "keyPoint": "『有機／無機』の境界は歴史的なもの。かつては生物しか作れないと思われたが、尿素の人工合成でこの壁が崩れた。", "figure": "carbon-shapes", "body": [{"label": "単・二重・三重結合", "text": "炭素間で電子対を1〜3組共有する。二重・三重結合は反応性が高い。"}, {"label": "炭化水素", "text": "炭素と水素だけの化合物。石油・天然ガスの主成分で、燃料と合成原料の出発点。"}], "relatedTopics": [{"concept": "chemical-bond", "relation": "構成する"}, {"concept": "functional-groups", "relation": "構成する"}, {"concept": "polymers", "relation": "なかま"}, {"concept": "amino-acids", "relation": "関連"}, {"concept": "combustion", "relation": "関連"}], "easyHeadline": "炭素は手が4本あり、どこまでも骨組みを伸ばせる", "easyBody": "炭素という原子は、他の原子とつながる「手」を4本持っていて、しかも炭素どうしでも安定につながることができます。そのため鎖のように長く伸びたり、枝分かれしたり、輪になったりと、ほとんど無限のバリエーションの骨組みを作れます。私たちの体や食べ物、プラスチックなど、身の回りのものの多くはこの炭素の骨組みでできています。", "referencedBy": [{"id": "functional-groups", "title": "官能基", "field": "chemistry"}, {"id": "isomerism", "title": "異性体", "field": "chemistry"}, {"id": "aromatic-benzene", "title": "芳香族とベンゼン環", "field": "chemistry"}, {"id": "polymers", "title": "高分子（ポリマー）", "field": "chemistry"}]}, {"id": "catalysis", "title": "触媒", "aka": "Catalysis", "field": "chemistry", "area": "化学反応", "section": "反応の基本", "headline": "自分は消費されず、反応の近道をつくる", "summary": "触媒は、反応の前後で自分は変化しないのに、活性化エネルギーの低い別の経路を提供して反応を速める物質。反応物と一時的に結合し、組み替えを助けて、また離れる。均一系（反応物と同じ相）と不均一系（固体触媒の表面で気体・液体を反応させる）がある。工業化学の8割以上、生体内の反応のほぼ全部が触媒反応。", "keyPoint": "触媒は平衡の位置を動かさず、正反応も逆反応も同じだけ速める。だから『作る』にも『壊す』にも同じ触媒が使える。", "body": [{"label": "身近な例", "text": "自動車の三元触媒（排ガス浄化）、アンモニア合成の鉄触媒（ハーバー・ボッシュ法、人類の食料を支えた）、酵素。"}, {"label": "被毒", "text": "触媒表面に不純物が吸着すると働かなくなる（鉛が排ガス触媒を殺すので無鉛ガソリンになった）。"}], "relatedTopics": [{"concept": "reaction-rate-equilibrium", "relation": "構成する"}, {"concept": "enzyme", "relation": "なかま"}, {"concept": "activation-vs-thermodynamics", "relation": "はたらく相手"}, {"concept": "redox", "relation": "関連"}], "easyHeadline": "自分は減らずに、反応の近道だけを教える", "easyBody": "触媒は、化学反応を速くする手助けをするのに、反応の前後で自分自身は変化せず残る特別な物質です。反応がスムーズに進む「近道」を用意してあげるようなイメージで、車の排ガスをきれいにする装置や、体の中の消化酵素などが代表例です。", "referencedBy": [{"id": "activation-vs-thermodynamics", "title": "速さと向きは別物", "field": "chemistry"}]}, {"id": "cell-cycle", "title": "細胞周期", "aka": "Cell cycle", "field": "molecular-biology", "area": "細胞のしくみ", "section": "分裂と死", "headline": "複製してから2つに分ける、監視付きのサイクル", "summary": "1個の細胞が2個になるまでの決まった順番。G1（成長）→S（DNA複製）→G2（分裂準備）→M（分裂）。各段階の境目に『チェックポイント』があり、DNAが傷ついていないか、複製が終わったか、染色体が正しく並んだかを確認してから次へ進む。この監視が壊れると、傷ついたゲノムが増殖する＝がん化につながる。", "keyPoint": "p53はこのチェックポイントの主役。『ゲノムの守護者』と呼ばれ、多くのがんでこの遺伝子が壊れている。", "body": [{"label": "サイクリン", "text": "段階ごとに現れて消えるタ bles-and-plant-parts", "title": "野菜は植物のどこを食べているか", "field": "food"}]}, {"id": "chromosome-chromatin", "title": "染色体とクロマチン", "aka": "Chromosome / chromatin", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "DNAという分子", "headline": "2mのDNAを核に畳む、階層的な巻き取り", "summary": "ヒト1細胞のDNAは伸ばすと約2m。これを直径わずか数µmの核に収めるため、DNAはヒストンというタンパク質に巻きついてビーズ状（ヌクレオソーム）になり、それがさらに何段にも折り畳まれてクロマチンをつくる。分裂期には最も凝縮して、顕微鏡で見える棒状の染色体になる。", "keyPoint": "畳み方はただの収納ではなく制御。きつく巻かれた領域は遺伝子が読めず、ゆるむと読める（エピジェネティクスの舞台）。", "body": [{"label": "ヒストン", "text": "正電荷に富み、負電荷のDNAとよく結合する。化学修飾で巻きのきつさが変わる。"}, {"label": "テロメアとセントロメア", "text": "染色体の末端を保護する部分、分裂時に引っ張られる把手の部分。"}], "relatedTopics": [{"concept": "dna-structure", "relation": "関連"}, {"concept": "epigenetics", "relation": "はたらく相手"}, {"concept": "gene-regulation", "relation": "関連"}, {"concept": "cell-cycle", "relation": "はたらく相手"}], "easyHeadline": "全長2mのDNAを、小さな核に畳んで収納する", "easyBody": "1個の細胞に入っているDNAは、伸ばすと約2mにもなります。これを目に見えないほど小さな核に収めるため、DNAはタンパク質に巻きついて何段階にも折り畳まれています。畳み方はただの収納ではなく、きつく巻かれた部分の遺伝子は使えず、ゆるんだ部分は使える、というスイッチにもなっています。", "referencedBy": [{"id": "epigenetics", "title": "エピジェネティクス", "field": "molecular-biology"}, {"id": "cell-cycle", "title": "細胞周期", "field": "molecular-biology"}, {"id": "gene-regulation", "title": "遺伝子発現の調節", "field": "molecular-biology"}]}, {"id": "circular-motion-and-centripetal-force", "title": "円運動と向心力", "aka": "Uniform circular motion and centripetal force", "field": "physics", "area": "力と運動", "section": "回転と重力", "headline": "等速円運動でも「中心向きの加速度」が要る", "summary": "速さが一定でも、向きが変わり続ける円運動は加速度運動である。この加速度は常に円の中心を向いており（向心加速度）、それを生む力が向心力。糸に石をつけて振り回すときの張力、カーブを曲がる車のタイヤの摩擦力、惑星を回らせる重力――どれも向心力の実例で、「新しい種類の力」ではなく既存の力が中心向きに働いているだけ。", "keyPoint": "「遠心力で外に飛ばされる」のは見かけの力（回転座標系の話）。外から見れば、実際に働いているのは常に中心向きの向心力だけ。", "figure": "centripetal-force", "body": [{"label": "速さ一定でも加速度あり", "text": "加速度は速度の「大きさ」だけでなく「向き」の変化でも生じる。向きが変わり続ける円運動は常に加速度運動。"}, {"label": "向心力の実例", "text": "糸の張力・タイヤの摩擦・重力――中身は違っても役割は同じ「中心へ引く力」。"}], "relatedTopics": [{"concept": "inertial-frames-and-fictitious-forces", "relation": "はたらく相手"}, {"concept": "angular-momentum-and-gyroscopes", "relation": "なかま"}, {"concept": "atom-structure", "relation": "対比"}], "easyHeadline": "同じ速さで回っていても、実は中心向きに引っぱられている", "easyBody": "ぐるぐる同じ速さで回る運動は、一見「変化していない」ように見えますが、向きがずっと変わり続けているので、実は中心に向かって引っぱられ続けています。糸につけた石を振り回すときの糸の張り、カーブを曲がる車のタイヤの摩擦は、どれもこの「中心へ引く力」の実例です。", "referencedBy": [{"id": "universal-gravitation-and-orbits", "title": "万有引力と軌道", "field": "physics"}, {"id": "inertial-frames-and-fictitious-forces", "title": "慣性系と見かけの力", "field": "physics"}, {"id": "angular-momentum-and-gyroscopes", "title": "角運動量とコマ・ジャイロ", "field": "physics"}]}, {"id": "clock-speed-parallelism", "title": "クロックとマルチコア——速さの限界", "aka": "Clock Speed & Multicore", "field": "computer", "area": "CPU", "section": "計算の仕組み", "headline": "周波数の限界をコア数で乗り越える", "summary": "CPUの速さはかつて「クロック周波数」（1秒間に何回動作するか）を上げることで伸びてきたが、2000年代半ばに発熱と消費電力の壁にぶつかり、単純な高速化は頭打ちになった。そこで登場したのが、1つのチップに複数の演算装置（コア）を並べて同時に別々の処理をさせる「マルチコア」という発想である。ただし複数のコアがあっても、プログラム側が仕事を分割して並列に実行できるように書かれていなければ性能は活かせず、並列化には向き不向きがある。この限界と工夫を知ると、「なぜ最近のCPUはGHz数がほとんど伸びず、コア数ばかり増えているのか」が理解できる。", "keyPoint": "クロックを上げる代わりにコアを増やして並列に処理する方向へ進化した。", "body": [{"label": "クロック競争の終わり", "text": "クロック周波数を上げるとトランジスタが1秒間により多く動作し発熱も比例して増えるため、放熱が追いつかなくなる限界（電力の壁）に突き当たった。この結果、2000年代半ば以降は単一コアの速度向上よりもコア数を増やす方向に設計の重心が移った。"}, {"label": "並列化できる仕事とできない仕事", "text": "動画のエンコードや大量データの集計のように独立した小さな仕事に分割できる処理はマルチコアの恩恵を受けやすい。一方、前の結果を待たないと次に進めない逐次的な処理は、コアを増やしても速くならない。"}], "relatedTopics": [{"concept": "cpu-architecture", "relation": "構成する"}, {"concept": "gpu-parallel-computing", "relation": "対比"}, {"concept": "digital-analog-difference", "relation": "関連"}], "referencedBy": [{"id": "cpu-architecture", "title": "CPUの中身——演算・制御・レジスタ", "field": "computer"}, {"id": "gpu-parallel-computing", "title": "GPU——並列計算に特化した頭脳", "field": "computer"}]}, {"id": "cloud-computing-basics", "title": "クラウドコンピューティングとは", "aka": "Cloud Computing", "field": "computer", "area": "クラウド", "section": "クラウドの考え方", "headline": "コンピュータを所有せず必要なだけ借りる発想", "summary": "クラウドコンピューティングとは、自分でサーバーやコンピュータを購入・管理する代わりに、インターネット経由で他社（クラウド事業者）が保有する巨大なデータセンターの計算資源を、必要な分だけ借りて使う仕組みである。電力を自家発電せず電力会社から必要な分だけ買うのと似た発想で、使った分だけ料金を払う「従量課金」が基本になっており、急にアクセスが増えたときは資源を増やし、減れば減らすといった柔軟な調整（スケーリング）が可能になる。この仕組みを支えているのが、1台の物理サーバーを複数の利用者で仮想的に分割して使う仮想化技術で、これによりクラウド事業者は大量のハードウェアを効率よく多数の顧客に配分できる。企業や個人が自前で高価な機材を用意しなくても、世界水準の計算資源にすぐアクセスできるようになった点が、クラウドが普及した最大の理由である。", "keyPoint": "クラウドは計算資源を『所有』ではなく『必要な分だけ借りる』ものに変えた仕組みである。", "body": [{"label": "従量課金という経済モデル", "text": "クラウドでは使った分だけ料金を払う従量課金が基本であり、あらかじめ大きな設備投資をせずにサービスを始められる。アクセスが急増したときも、自動または手動で計算資源を増やす「スケールアウト」によって対応できる。"}, {"label": "IaaS・PaaS・SaaSという階層", "text": "クラウドサービスには、サーバーそのものを貸すIaaS、アプリを動かす土台を提供するPaaS、完成したソフトを利用するだけのSaaSなど、抽象度の異なる階層がある。利用者は自分がどこまで管理したいかに応じて、適した階層のサービスを選ぶ。"}], "relatedTopics": [{"concept": "virtualization-containers", "relation": "構成する"}, {"concept": "distributed-systems-basics", "relation": "関連"}, {"concept": "filesystem-basics", "relation": "関連"}], "referencedBy": [{"id": "filesystem-basics", "title": "ファイルシステムの基本", "field": "computer"}, {"id": "virtualization-containers", "title": "仮想化とコンテナ", "field": "computer"}, {"id": "distributed-systems-basics", "title": "分散システムの基本", "field": "computer"}]}, {"id": "coevolution-symbiosis", "title": "共進化——花と昆虫、宿主と寄生者", "aka": "Coevolution", "field": "biology", "area": "進化", "section": "進化のしくみと生命史", "headline": "互いが互いの進化の圧力になり一緒に変化していく関係", "summary": "共進化とは、2種以上の生物が、互いに相手の存在を進化上の選択圧として受けながら、影響し合いながら変化していく現象のことである。代表例が花と送粉者（昆虫や鳥）の関係で、特定の昆虫だけが蜜を吸える細長い花筒を持つ花と、その花筒に届く長い口吻を持つ昆虫が、互いに相手に合わせて形を先鋭化させていくといった事例が知られている。宿主と寄生者・捕食者と被食者の間でも共進化は起こり、宿主が防御手段を進化させれば寄生者はそれを出し抜く手段を進化させるという「軍拡競争」のような関係が続くこともある。共進化は、自然選択が単独の種の中だけでなく、種と種の関係性そのものを舞台にしても働くことを示す典型例であり、生態系の中の多くの依存関係がこうした長い共進化の産物である。", "keyPoint": "花の形も昆虫の口の形も、単独で進化したのではなく、互いを鏡にしながら形作られてきた結果である。", "body": [{"label": "花と送粉者の軍拡競争", "text": "マダガスカルの蘭の一種は花筒の奥深くに蜜があり、これに合わせて非常に長い口吻を持つスズメガが進化したことがダーウィン自身によって予言され、後にそのガが実際に発見された有名な事例がある。このように特定の相手にだけ最適化が進む関係を「一対一の共進化」と呼ぶことがある。"}, {"label": "宿主と寄生者の終わらない競争", "text": "宿主が免疫や防御機構を進化させると、寄生者や病原体はそれをすり抜ける新しい手段を進化させ、これに宿主がさらに対抗するという終わりのない攻防が続く。この現象は「赤の女王仮説」と呼ばれ、立ち止まっているだけでは相対的に後退してしまうという進化のパターンを表している。"}], "relatedTopics": [{"concept": "fungi-symbiosis", "relation": "なかま"}, {"concept": "plant-reproduction", "relation": "関連"}, {"concept": "natural-selection", "relation": "関連"}], "referencedBy": [{"id": "invertebrate-diversity", "title": "無脊椎動物の多様性", "field": "biology"}, {"id": "natural-selection", "title": "自然選択と適応", "field": "biology"}, {"id": "plant-reproduction", "title": "花・種子・果実——植物の生活環", "field": "biology"}, {"id": "fungi-symbiosis", "title": "菌根と地衣類——分解と共生", "field": "biology"}]}, {"id": "collagen", "title": "コラーゲン", "aka": "Collagen", "headline": "体で最も多い、三本鎖ロープの構造材", "summary": "全タンパク質量の約3割を占める、体の建材。3本のポリペプチドが左巻きに伸び、それが右巻きに撚り合わさった三重らせん。この縄構造が引っ張りに強く、腱・骨・皮膚・軟骨・血管壁の土台になる。配列は『グリシン-X-Y』の繰り返しで、Yはしばしばヒドロキシプロリン。", "keyPoint": "3残基ごとのグリシン（最小のアミノ酸）が必須。らせんの中心はグリシンしか入る隙間がなく、変異すると骨形成不全症（脆い骨）になる。", "body": [{"label": "ヒドロキシル化とビタミンC", "text": "プロリンの水酸化に必要な酵素がビタミンC依存。欠乏（壊血病）でコラーゲンが弱り、歯茎出血や創傷治癒不全が起きる。"}, {"label": "細胞外での成熟", "text": "前駆体プロコラーゲンとして分泌され、両端が切られて自己集合し、架橋して繊維になる。"}, {"label": "加齢と応用", "text": "架橋の蓄積で硬く・もろくなる。ゼラチンは変性させたコラーゲン。"}], "relatedTopics": [{"concept": "alpha-helix-beta-sheet", "relation": "対比"}, {"concept": "protein-folding", "relation": "関連"}, {"concept": "ptm", "relation": "はたらく相手"}, {"concept": "molecular-motor", "relation": "対比"}], "field": "molecular-biology", "area": "タンパク質", "section": "代表的なタンパク質", "easyHeadline": "体の中でいちばん多い、丈夫な“ロープ”のタンパク質", "easyBody": "コラーゲンは体のタンパク質の中で最も量が多く、3本のひもが縄のようにより合わさった構造をしています。この丈夫な縄が、骨・皮膚・軟骨・血管などの土台となる材料になっています。", "referencedBy": [{"id": "molecular-motor", "title": "分子モーター", "field": "molecular-biology"}, {"id": "cytoskeleton", "title": "細胞骨格", "field": "molecular-biology"}, {"id": "polymers", "title": "高分子（ポリマー）", "field": "chemistry"}]}, {"id": "colligative-osmosis", "title": "束一的性質と浸透圧", "aka": "Colligative properties / osmosis", "field": "chemistry", "area": "溶液と混合物", "section": "混ざりものの性質", "headline": "溶けた粒の“数”だけで決まる、水の性質の変化", "summary": "溶媒に何かを溶かすと、沸点が上がり、凝固点が下がり、蒸気圧が下がり、浸透圧が生じる。これらは溶けている粒子の『種類』ではなく『数』だけで決まる（束一的性質）。半透膜を隔てて濃さが違うと、水は薄い方から濃い方へ移動する（浸透）。それを止めるのに必要な圧力が浸透圧。", "keyPoint": "凍結防止剤で道路の氷を溶かす、ナメクジに塩、点滴の濃度、植物が水を吸い上げる——全部これ。細胞は浸透圧のバランスの上で生きている。", "body": [{"label": "生体", "text": "真水に置いた細胞は膨れて破裂、濃い塩水では縮む。だから点滴は体液と同じ浸透圧にする。"}, {"label": "逆浸透", "text": "圧力をかけて逆向きに水を通すと、海水から真水が取れる（淡水化）。"}], "relatedTopics": [{"concept": "dissolution", "relation": "なかま"}, {"concept": "concentration-mole", "relation": "関連"}, {"concept": "membrane-transport", "relation": "関連"}, {"concept": "cell-membrane", "relation": "はたらく相手"}], "easyHeadline": "溶けている粒の“数”だけで、水の性質が変わる", "easyBody": "水に何かを溶かすと、凍りにくくなったり沸きにくくなったりしますが、これは溶けているものの種類ではなく「数」で決まります。濃さの違う水どうしを薄い膜越しに接すると、水は薄いほうから濃いほうへ移動しようとします(浸透)。点滴の濃さを体液に合わせているのも、この性質のためです。", "referencedBy": [{"id": "dissolution", "title": "溶解", "field": "chemistry"}]}, {"id": "colloid-mixture", "title": "コロイドと混合物", "aka": "Colloids & mixtures", "field": "chemistry", "area": "溶液と混合物", "section": "混ざりものの性質", "headline": "溶けてはいないが沈みもしない、宙に漂う中くらいの粒", "summary": "混合物には、成分が分子レベルで均一に混ざった溶液と、目に見えて分離する不均一混合物のほかに、その中間の『コロイド』がある。1〜1000ナノメートルの粒子が分散していて、沈殿もろ過もできないが、横から光を当てると通り道が光って見える（チンダル現象）。牛乳、霧、煙、絵の具、生クリーム、血液、細胞質。", "keyPoint": "『溶けている』と『濁っている』の間に広い中間地帯がある。生き物の中身（細胞質）はほぼコロイド。", "body": [{"label": "安定化", "text": "粒子が同種の電荷をまとって反発し合うことで、くっついて沈むのを防いでいる。"}, {"label": "凝集", "text": "電荷を打ち消すと粒子が集まって沈む。豆乳ににがり（豆腐）、川の泥が河口で堆積、浄水の凝集沈殿。"}], "relatedTopics": [{"concept": "dissolution", "relation": "対比"}, {"concept": "solubility-precipitation", "relation": "関連"}, {"concept": "states-of-matter", "relation": "関連"}, {"concept": "intermolecular-forces", "relation": "関連"}], "easyHeadline": "溶けてもいないし沈みもしない、宙に漂う中くらいの粒", "easyBody": "混ざりものには、完全に溶けているものと、目に見えて分かれてしまうものの間に「コロイド」という中間の状態があります。粒が小さすぎて沈まずに漂い続けるため、牛乳や霧、血液のように濁って見えるのに分離しないものになります。", "referencedBy": []}, {"id": "combustion", "title": "燃焼", "aka": "Combustion", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "燃料と酸素が結びつく、速い酸化反応", "summary": "燃焼は、燃料（炭素や水素を含む物質）が酸素と急速に反応して、二酸化炭素と水になり、大量の熱と光を出す酸化還元反応。始めるには着火のエネルギー（活性化エネルギー）が要るが、いったん始まると自分が出す熱で連鎖的に続く。燃料・酸素・熱の3つが『燃焼の三要素』で、どれか1つを断てば消える。", "keyPoint": "炎は『もの』ではなく『反応が進んでいる領域』。燃料の蒸気と空気が混ざって反応している空間そのもの。", "body": [{"label": "完全燃焼と不完全燃焼", "text": "酸素が足りないと一酸化炭素やすす（炭素の粒）が残る。すすが赤熱して見えるのが黄色い炎。"}, {"label": "消火の理屈", "text": "水（冷却）、二酸化炭素・泡（酸素遮断）、粉末（連鎖反応の停止）。"}], "relatedTopics": [{"concept": "redox", "relation": "構成する"}, {"concept": "chemical-reaction", "relation": "なかま"}, {"concept": "flame-structure", "relation": "原因と結果"}, {"concept": "reaction-rate-equilibrium", "relation": "関連"}], "easyHeadline": "燃料と酸素が結びついて、熱と光を出す", "easyBody": "燃焼とは、燃えるもの(燃料)が空気中の酸素と勢いよく結びついて、熱と光を出しながら別の物質に変わる反応です。いったん火がつくと、その熱でさらに反応が続いていきます。燃料・酸素・熱のどれか1つを取り除けば、火は消えます。", "referencedBy": [{"id": "engine-mechanism", "title": "エンジンの仕組み", "field": "mechanisms"}, {"id": "chemical-reaction", "title": "化学反応", "field": "chemistry"}, {"id": "thermochemistry-enthalpy", "title": "反応熱とエンタルピー", "field": "chemistry"}, {"id": "reaction-rate-equilibrium", "title": "反応速度と化学平衡", "field": "chemistry"}, {"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "field": "chemistry"}, {"id": "flame-structure", "title": "炎の構造", "field": "chemistry"}, {"id": "carbon-bonding", "title": "炭素と有機化合物", "field": "chemistry"}, {"id": "redox", "title": "酸化還元反応", "field": "chemistry"}]}, {"id": "common-ancestry-phylogeny", "title": "共通祖先と系統樹", "aka": "Common ancestry & phylogenetic trees", "field": "biology", "area": "進化", "section": "進化のしくみと生命史", "headline": "すべての生き物は一本の木のようにたどれる家系図でつながる", "summary": "系統樹とは、生物同士がどれだけ近い共通の祖先を持つかを、枝分かれする木のような図で表したものである。ダーウィンは「すべての生物は共通の祖先から由来する」という共通祖先説を提唱し、これは以後の分子生物学の発展、特にDNA配列の比較によって強力に裏付けられてきた。現在では、形態の似ている・似ていないだけでなく、DNAやタンパク質の配列を比較することで、より客観的で精度の高い系統関係を推定できるようになっている。系統樹をたどっていくと、人間とチンパンジーのような近い関係だけでなく、動物と植物、さらには細菌までもが、数十億年前にさかのぼれば一つの共通祖先（最終共通祖先、LUCA）に行き着くと考えられている。", "keyPoint": "系統樹をどこまでもさかのぼると、地球上のすべての生物が一つの共通祖先につながっているという結論に行き着く。", "body": [{"label": "形態からDNAへ", "text": "かつて系統樹は骨格や体の作りといった見た目の類似性を元に作られていたが、これは似た環境に適応した結果たまたま似た形になった「収斂進化」と本当に近縁な関係を見分けにくいという弱点があった。DNA配列の比較を使う分子系統学は、この弱点を大きく克服し、より正確な系統関係を明らかにしてきた。"}, {"label": "全生物をつなぐ最終共通祖先", "text": "系統樹の根元をたどっていくと、動物・植物・菌類・細菌・古細菌のすべてが行き着く単一の祖先生物（LUCA、最終共通祖先）が想定されている。すべての生物がほぼ共通の遺伝暗号を使っていることも、この単一起源説を支える強い証拠になっている。"}], "relatedTopics": [{"concept": "mass-extinction", "relation": "原因と結果"}, {"concept": "dna-sequencing", "relation": "技術で見る"}, {"concept": "rna-world-noncoding", "relation": "関連"}], "referencedBy": [{"id": "animal-body-plans", "title": "体制の基本——対称性と体腔", "field": "biology"}, {"id": "mass-extinction", "title": "大量絶滅——生命史の転換点", "field": "biology"}, {"id": "bacteria-archaea", "title": "細菌と古細菌——見えない生命の大部分", "field": "biology"}, {"id": "vertebrate-classification", "title": "脊椎動物の分類", "field": "biology"}, {"id": "genetic-drift-speciation", "title": "遺伝的浮動と種分化", "field": "biology"}]}, {"id": "compton-effect", "title": "コンプトン効果", "aka": "Compton scattering", "field": "quantum", "area": "量子のはじまり", "section": "前期量子論", "headline": "X線を物質にぶつけると、波長が伸びて跳ね返る", "summary": "1923年、アーサー・コンプトンはX線を物質（電子）に当てて散乱させると、散乱したX線の波長が入射時より長くなる現象を発見した。X線を単なる波と考えると波長が変化する理由を説明できないが、X線を運動量を持つ粒子（光子）と考え、光子と電子がビリヤードの球のように衝突してエネルギーと運動量をやり取りすると考えると、散乱角に応じた波長の伸びを正確に計算できた。この実験は光子が単なるエネルギーの塊であるだけでなく、質量はないが確かな「運動量」も持つ実在の粒子であることを決定づけた。", "keyPoint": "光電効果は光の粒子性の「間接的」な証拠だったが、コンプトン効果は光子とたった1個の電子の衝突を運動量保存則で直接計算できる、より直接的な証拠とされる。", "body": [{"label": "光子の運動量", "text": "質量を持たない光子でも、波長に反比例する運動量p=h/λを持つ。コンプトン効果は、この光子の運動量と電子の運動量の保存則（衝突の前後で合計が変わらない）を使って定量的に説明される。"}], "relatedTopics": [{"concept": "photoelectric-effect", "relation": "なかま"}, {"concept": "de-broglie-matter-waves", "relation": "原因と結果"}, {"concept": "electromagnetic-spectrum", "relation": "関連"}], "easyHeadline": "X線をぶつけると、光の粒がビリヤードのように跳ね返る", "easyBody": "光を粒（光子）だと考えると、ビリヤードの球をぶつけたときのように、ぶつかった相手（電子）にエネルギーの一部を渡して自分は少し勢いを失う、ということが起こるはずです。実際にX線を物質にぶつけると、跳ね返ったX線は波長が伸びて（＝エネルギーが少し減って）観測されました。これは光が本当に「玉」のように運動量を持つ粒子であることの、動かぬ証拠になりました。", "referencedBy": [{"id": "de-broglie-matter-waves", "title": "ド・ブロイの物質波", "field": "quantum"}, {"id": "photoelectric-effect", "title": "光電効果とアインシュタインの光量子", "field": "quantum"}]}, {"id": "computer-history", "title": "コンピュータの登場", "aka": "History of the computer", "field": "technology", "area": "計算とAI", "section": "情報を演算する", "headline": "弾道計算の道具が、あらゆる計算の万能機械になった", "summary": "初期のコンピュータ（1940年代のENIACなど）は、大砲の弾道表を作るための巨大な計算専用機で、真空管を1万本以上使い、部屋いっぱいの大きさだった。「プログラム内蔵方式」（計算手順そのものをデータとしてメモリに保存し、切り替えるだけで別の計算ができる）という考え方が確立したことで、専用機だったコンピュータが「何にでも使える万能な計算機」に変わった。トランジスタ、続いて集積回路の発明により小型化・高速化・低価格化が進み、1970年代にはパーソナルコンピュータとして個人の机の上に、2000年代にはスマートフォンとしてポケットに入るまでになった。", "keyPoint": "「専用の計算機」から「プログラムを変えれば何でもできる汎用機」への転換が最大の発明。", "body": [{"label": "プログラム内蔵方式", "text": "それ以前は配線を組み替えて計算内容を変えていた（配線変更に数日かかることも）。プログラムをメモリに置く方式になり、切り替えが一瞬になった。"}], "relatedTopics": [{"concept": "transistor-semiconductor", "relation": "はたらく相手"}, {"concept": "artificial-intelligence", "relation": "原因と結果"}, {"concept": "medical-imaging", "relation": "はたらく相手"}], "year": 1945, "yearLabel": "1945年ごろ（汎用電子計算機の登場）", "referencedBy": [{"id": "ai-winter-history", "title": "AIの歴史——ブームと冬の時代", "field": "ai"}, {"id": "transistor-semiconductor", "title": "トランジスタと半導体", "field": "technology"}, {"id": "fabless-foundry-model", "title": "ファブレスとファウンドリ", "field": "industry"}, {"id": "why-programs-run", "title": "プログラムがなぜ動くのか", "field": "technology"}, {"id": "memory-logic-semiconductor", "title": "メモリ半導体とロジック半導体", "field": "technology"}, {"id": "artificial-intelligence", "title": "人工知能（AI）", "field": "technology"}, {"id": "medical-imaging", "title": "医用画像技術", "field": "technology"}, {"id": "semiconductor-supply-chain", "title": "半導体サプライチェーンと地政学", "field": "industry"}]}, {"id": "concentration-mole", "title": "濃度とモル", "aka": "Concentration / the mole", "field": "chemistry", "area": "溶液と混合物", "section": "溶ける", "headline": "粒の数を“ダース”のように数える単位がモル", "summary": "原子や分子は小さすぎて1個ずつ数えられないので、6.02×10²³個をひとまとめにして『1モル』と数える（アボガドロ数）。物質1モルの質量は、その原子量・分子量にグラムを付けた値。溶液の濃さは、溶質が何モル溶けているか（モル濃度）で表すのが化学の標準。", "keyPoint": "モルは『反応式の係数どおりに物質を混ぜる』ための橋渡し。質量は測れるが、反応するのは“個数”の比だから。", "body": [{"label": "化学量論", "text": "反応式の係数＝モル比。過不足なく反応させる量や、生成物の理論量を計算できる。"}, {"label": "身近な濃度", "text": "質量パーセント、ppm、mol/L を使い分ける。"}], "relatedTopics": [{"concept": "chemical-reaction", "relation": "はたらく相手"}, {"concept": "dissolution", "relation": "関連"}, {"concept": "solubility-precipitation", "relation": "関連"}, {"concept": "atom-structure", "relation": "関連"}], "easyHeadline": "粒の数を“ダース”のようにまとめて数える単位がモル", "easyBody": "原子や分子は小さすぎて1個ずつ数えられないので、化学ではとても大きな決まった数をひとまとめにして「1モル」と呼び、単位として使います。溶液の濃さも、このモルを使って「何モル溶けているか」で表すのが基本です。", "referencedBy": [{"id": "colligative-osmosis", "title": "束一的性質と浸透圧", "field": "chemistry"}, {"id": "solubility-precipitation", "title": "溶解度と沈殿", "field": "chemistry"}]}, {"id": "containerization", "title": "コンテナ化", "aka": "Containerization", "field": "industry", "area": "物流", "section": "モノを届ける仕組み", "headline": "規格化された箱1つが世界貿易のコストを崩した", "summary": "1950年代に登場した規格化された金属製コンテナは、荷物を箱ごとトラック・鉄道・船へと積み替えられるようにし、それまで人手で1個ずつ積み下ろししていた港湾荷役の作業を劇的に効率化した。荷役時間とコストが桁違いに下がったことで、遠く離れた国で安く作った製品を世界中に運んでも採算が合うようになり、工場を人件費の安い国に移す「グローバルサプライチェーン」という現代の貿易構造そのものを可能にした。コンテナ船・港湾クレーン・トレーラーのサイズはすべて国際規格で統一されており、この標準化こそが世界中どこでも同じ効率で荷物を扱える仕組みの土台になっている。コンテナという単純な箱の発明が、20世紀後半のグローバル化を物流面から支えた縁の下の主役だったといえる。", "keyPoint": "コンテナは「箱」自体の発明というより「積み替えの規格を統一した」ことに価値があり、それが世界貿易のコスト構造を根本から変えた。", "body": [{"label": "港湾労働の激変", "text": "それまで多くの労働者が必要だった港湾荷役はクレーンによる自動化が進み、雇用数は大きく減少した一方、港ごとの処理能力は飛躍的に向上した。効率化の裏で労働構造が大きく変わった典型例である。"}, {"label": "巨大コンテナ船という規模の経済", "text": "1隻あたりに積めるコンテナ数が増えるほど1個あたりの輸送コストは下がるため、コンテナ船は年々巨大化し続けており、1隻で2万個以上のコンテナを運ぶ船も登場している。"}], "relatedTopics": [{"concept": "just-in-time-supply-chain", "relation": "なかま"}, {"concept": "last-mile-delivery", "relation": "対比"}, {"concept": "semiconductor-supply-chain", "relation": "関連"}], "referencedBy": [{"id": "just-in-time-supply-chain", "title": "ジャストインタイムとサプライチェーン", "field": "industry"}, {"id": "last-mile-delivery", "title": "ラストワンマイル配送の自動化", "field": "industry"}]}, {"id": "context-window-limits", "title": "コンテキストウィンドウとその限界", "aka": "Context Window", "field": "ai", "area": "LLM", "section": "LLMのしくみ", "headline": "モデルが一度に見渡せる文章量には上限がある", "summary": "コンテキストウィンドウとは、LLMが一度の応答生成において参照できるトークン数の上限のことで、会話履歴や添付文書、生成中の文章もすべてこの枠の中に収まる必要がある。初期のモデルは数千トークン程度だったが、現在では数十万トークンを扱えるモデルも登場し、長編小説や大量のコード全体を一度に読み込ませることも可能になってきた。ただし枠が広がっても、途中の情報を均等に活用できるとは限らず、長い文章の中盤にある情報を見落としやすい「lost in the middle」と呼ばれる現象が知られている。会話が長引いてこの上限を超えると、古いやり取りが自動的に切り捨てられたり要約されたりするため、モデルが以前の話を「忘れた」ように見えることがある。実用上は、必要な情報を絞り込んで渡す工夫や、RAGのように必要な部分だけを検索して読み込ませる設計が重要になる。", "keyPoint": "コンテキストウィンドウが広くても、中に詰め込んだ情報を均等に活用できるとは限らない。", "body": [{"label": "「忘れる」ように見える理由", "text": "LLM自体は会話を記憶する仕組みを持たず、毎回コンテキストウィンドウに収まった範囲のテキストだけを参照して応答を生成しているため、枠からあふれた過去のやり取りは単純に見えなくなる。"}, {"label": "長文活用の工夫", "text": "巨大な文書をそのまま流し込むよりも、要約や検索で関連部分だけを抽出して渡す方が、モデルが重要な情報を見落とさずに扱えることが多い。"}], "relatedTopics": [{"concept": "tokenization", "relation": "原因と結果"}, {"concept": "rag-retrieval-augmented", "relation": "対比"}, {"concept": "llm-basics", "relation": "構成する"}], "referencedBy": [{"id": "rag-retrieval-augmented", "title": "RAG——検索で知識を補うAI", "field": "ai"}, {"id": "tokenization", "title": "トークン化——文章を数に変える", "field": "ai"}, {"id": "hallucination", "title": "ハルシネーション——もっともらしい嘘", "field": "ai"}, {"id": "positional-encoding", "title": "位置エンコーディング——順序を教える工夫", "field": "ai"}]}, {"id": "cooking-as-chemistry-and-physics", "title": "料理は化学と物理の実験である", "aka": "Cooking as applied chemistry & physics", "field": "food", "area": "変える・味わう", "section": "料理", "headline": "「焼く・煮る・揚げる」は、熱と分子の変化の使い分け", "summary": "料理という行為は、熱・水・油を使って食材の分子構造を意図的に変える化学・物理の実験と言える。肉を焼くと表面のタンパク質と糖が反応して香ばしい茶色と香りを生む(メイラード反応)。卵をゆでるとタンパク質が熱で変性し、液体からゲル状の固体に変わる。野菜を煮ると細胞をつなぐ物質(ペクチン)が壊れて柔らかくなる。揚げ物は水を使わず高温の油に浸けることで、表面の水分を急速に蒸発させてカリッとした食感を作りつつ、内部は蒸し焼き状態で火を通す。調理法の違いは、どの分子をどう変化させたいかの選び方そのもの。", "keyPoint": "「おいしそうな焼き色と香り」の正体はメイラード反応――タンパク質と糖が熱で結びついてできる新しい化学物質群。", "body": [{"label": "メイラード反応とカラメル化の違い", "text": "メイラード反応はタン る部品で、実際には「演算装置（ALU）」「制御装置」「レジスタ」という3つの部分が連携して働いている。ALUは足し算や比較といった単純な計算を行い、制御装置はメモリから命令を読み出して次に何をすべきか指示を出し、レジスタはCPU内部にあるごく少量だが超高速に読み書きできる記憶場所として、計算中のデータを一時的に保持する。半導体でできたトランジスタを何十億個も集積してこれらの回路を作ることで、複雑に見える処理も突き詰めれば単純な論理演算の組み合わせに帰着する。CPUの設計思想を理解すると、なぜプログラムが「命令を1つずつ順番に実行する」だけで複雑な仕事をこなせるのかが見えてくる。", "keyPoint": "CPUは演算・制御・記憶という役割分担を持つ回路の集合体である。", "body": [{"label": "レジスタという特別な記憶", "text": "レジスタはメモリよりもCPUに物理的に近く、桁違いに高速にアクセスできる記憶場所だが、容量は数十〜数百バイト程度ととても小さい。計算のたびにメインメモリへアクセスしていては速度が出ないため、頻繁に使うデータだけをレジスタに置いておく工夫がなされている。"}, {"label": "制御装置が指揮者になる", "text": "制御装置は、メモリ上のプログラムから命令を1つ取り出し、それがどんな操作かを解読し、ALUやレジスタに実行を指示する。この一連の流れを高速に繰り返すことで、あたかも「考えて」動いているように見える処理が実現する。"}], "relatedTopics": [{"concept": "transistor-semiconductor", "relation": "構成する"}, {"concept": "clock-speed-parallelism", "relation": "関連"}, {"concept": "memory-logic-semiconductor", "relation": "関連"}, {"concept": "why-programs-run", "relation": "はたらく相手"}], "figure": "cpu-blocks", "referencedBy": [{"id": "gpu-parallel-computing", "title": "GPU——並列計算に特化した頭脳", "field": "computer"}, {"id": "clock-speed-parallelism", "title": "クロックとマルチコア——速さの限界", "field": "computer"}, {"id": "silicon-semiconductor-material", "title": "シリコンと半導体材料", "field": "computer"}, {"id": "memory-virtualization", "title": "メモリ管理と仮想化", "field": "computer"}]}, {"id": "crispr", "title": "CRISPR-Cas9", "aka": "CRISPR-Cas9", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "ゲノムを編集する・読む", "headline": "細菌の免疫を借りた、狙い撃ちの遺伝子ハサミ", "summary": "細菌がウイルスの配列を記憶して撃退する免疫システムを、ゲノム編集ツールに転用したもの。短い『ガイドRNA』に狙った配列を持たせると、Cas9タンパク質がその場所を探し当ててDNAを両断する。切れた場所を細胞が修復する過程で、遺伝子を壊したり書き換えたりできる。2020年ノーベル化学賞（ダウドナ、シャルパンティエ）。", "keyPoint": "以前の遺伝子編集はタンパク質を設計し直す必要があった。CRISPRは『ガイドRNAの20文字を変えるだけ』で標的を変えられるのが革命。", "figure": "crispr-cut", "body": [{"label": "修復経路", "text": "つなぐだけ（欠失が入りやすい＝遺伝子ノックアウト）と、鋳型を与えて正確に書き換える方法がある。"}, {"label": "医療応用", "text": "鎌状赤血球症・βサラセミアの治療薬が承認。標的外の切断（オフターゲット）の管理が課題。"}], "relatedTopics": [{"concept": "base-pairing", "relation": "はたらく相手"}, {"concept": "recombinan line": "形を保ち、荷物を運び、細胞を動かす骨組み", "easyBody": "細胞の中に張りめぐらされたタンパク質の繊維の網です。細胞の形を支え、中で荷物を運ぶレールになり、細胞そのものを動かす力も生みます。「骨格」といっても固定されたものではなく、数秒から数分で伸び縮みして必要な場所に作り替えられます。", "referencedBy": [{"id": "cell-cycle", "title": "細胞周期", "field": "molecular-biology"}]}, {"id": "dark-energy-acceleration", "title": "暗黒エネルギーと加速膨張", "aka": "Dark energy / accelerating expansion", "field": "space", "area": "宇宙のはじまりと構造", "section": "宇宙のはじまりと構造", "headline": "宇宙の膨張はブレーキがかかるどころか加速している", "summary": "重力は物質を引き合わせる力なので、かつて宇宙の膨張は時間とともに遅くなっていくと考えられていた。しかし1990年代末、遠くの超新星の観測から、宇宙の膨張速度はむしろ加速していることが発見された。この加速を引き起こしている正体不明の力（あるいはエネルギー）を「暗黒エネルギー（ダークエネルギー）」と呼ぶ。暗黒エネルギーの正体はまだ分かっていないが、宇宙全体のエネルギーの約7割を占めると見積もられており、宇宙の未来を左右する最大の謎の1つになっている。", "easyHeadline": "宇宙の膨張はブレーキではなくアクセルがかかっている", "easyBody": "物を引き合わせる重力があるので、宇宙の膨張は本来だんだん遅くなるはずでした。ところが実際に調べてみると、宇宙の膨張はむしろどんどん速くなっていることが分かりました。この加速の原因になっている正体不明の力を「暗黒エネルギー」と呼びます。まだ何なのか分かっていない、宇宙最大の謎の1つです。", "keyPoint": "この発見をしたチームは2011年にノーベル物理学賞を受賞した。「宇宙の膨張は遅くなっているはず」という予想を覆す、天文学史上最大級の驚きだった。", "body": [{"label": "Ia型超新星という物差し", "text": "常にほぼ同じ明るさで爆発するIa型超新星を「標準光源」として距離を測ることで、遠い過去の宇宙の膨張速度を調べることができた。"}], "relatedTopics": [{"concept": "hubble-lemaitre-law", "relation": "原因と結果"}, {"concept": "dark-matter", "relation": "対比"}, {"concept": "age-of-universe-horizon", "relation": "関連"}, {"concept": "entropy-and-irreversibility", "relation": "関連"}], "referencedBy": [{"id": "hubble-lemaitre-law", "title": "宇宙膨張とハッブル・ルメートルの法則", "field": "space"}, {"id": "dark-matter", "title": "暗黒物質（回転曲線・重力レンズ）", "field": "space"}]}, {"id": "dark-matter", "title": "暗黒物質（回転曲線・重力レンズ）", "aka": "Dark matter", "field": "space", "area": "宇宙のはじまりと構造", "section": "宇宙のはじまりと構造", "headline": "光を出さないのに重力だけで存在が分かる謎の物質", "summary": "銀河の外側にある星の回転速度を観測すると、目に見える物質（星やガス）の量だけでは説明できないほど速く回っていることが分かる。これは、目に見えない何らかの重力源が銀河全体を取り巻いていることを示唆しており、この正体不明の物質を「暗黒物質（ダークマター）」と呼ぶ。暗黒物質は光をまったく出さず、直接観測することはできないが、背景の銀河の光を重力でゆがめる「重力レンズ」効果などを通じて、その分布を間接的に確認できる。宇宙全体の質量の大部分は、実はこの暗黒物質が占めていると考えられている。", "easyHeadline": "光らないのに重力でその存在が分かる謎の物質", "easyBody": "銀河の外側の星の動きを調べると、目に見える星やガスの量だけでは説明できないほど速く回っています。これは、光らない何かが銀河を取り巻いて重力を及ぼしているためだと考えられ、この正体不明のものを「暗黒物質」と呼びます。宇宙にある物質の多くは、実はこの見えない暗黒物質だと考えられています。", "keyPoint": "宇宙全体の質量・エネルギーのうち、私たちが知っている普通の物質（原子でできたもの）はわずか約5%で、暗黒物質は約27%、残りは暗黒エネルギーだと見積もられている。", "body": [{"label": "銀河の回転曲線問題", "text": "ニュートン力学だけで予測すると、銀河の外側の星は中心から離れるほど遅く回るはずだが、実際の観測ではほぼ一定の速度で回っている。これが暗黒物質の存在を示す最初の手がかりになった。"}, {"label": "重力レンズ効果", "text": "重力は光の進路も曲げる。暗黒物質を含む重力源の背後にある銀河の光がゆがんで見えることから、暗黒物質の分布を地図化できる。"}], "relatedTopics": [{"concept": "galaxy-types", "relation": "関連"}, {"concept": "milky-way-local-group", "relation": "関連"}, {"concept": "large-scale-structure-inflation", "relation": "原因と結果"}, {"concept": "universal-gravitation-and-orbits", "relation": "はたらく相手"}, {"concept": "dark-energy-acceleration", "relation": "対比"}], "referencedBy": [{"id": "milky-way-local-group", "title": "天の川銀河と局部銀河群", "field": "space"}, {"id": "large-scale-structure-inflation", "title": "宇宙の大規模構造とインフレーション", "field": "space"}, {"id": "dark-energy-acceleration", "title": "暗黒エネルギーと加速膨張", "field": "space"}, {"id": "galaxy-types", "title": "銀河の種類（渦巻・楕円・不規則）", "field": "space"}]}, {"id": "de-broglie-matter-waves", "title": "ド・ブロイの物質波", "aka": "De Broglie matter waves / wave-particle duality of matter", "field": "quantum", "area": "量子のはじまり", "section": "前期量子論", "headline": "光だけでなく、電子のような「粒子」も波の性質を持つ", "summary": "光が波と粒子の二重性を持つことが明らかになった後、1924年にルイ・ド・ブロイは、逆に電子のような通常「粒子」とみなされているものも波としての性質を持つはずだと大胆に提唱した。あらゆる運動する物質には波長λ=h/p（hはプランク定数、pは運動量）で表される「物質波」が伴うという仮説で、この波長は運動量が大きいほど短くなる。この予言は数年後、電子線が結晶で回折・干渉を起こすことが実験で確認されて証明され、粒子と波の二重性が光だけでなく万物に共通する量子力学の基本原理であることが確定した。", "keyPoint": "私たちの体のような巨大な物体にも物質波の波長は原理上存在するが、あまりに短すぎて（プランク定数hが極小のため）誰も気づかない——これが日常で量子効果を感じない理由の一つ。", "body": [{"label": "電子顕微鏡への応用", "text": "電子の物質波の波長は可視光よりはるかに短くできるため、これを利用した電子顕微鏡は光学顕微鏡よりもはるかに高い分解能で観察でき、ウイルスやタンパク質の構造解析にも使われている。"}], "relatedTopics": [{"concept": "compton-effect", "relation": "原因と結果"}, {"concept": "double-slit-experiment", "relation": "なかま"}, {"concept": "wave-particle-duality-of-light", "relation": "対比"}, {"concept": "schrodinger-equation", "relation": "原因と結果"}, {"concept": "xray-crystallography", "relation": "技術で見る"}], "easyHeadline": "動いているものはすべて、少しだけ「波」でもある", "easyBody": "光が波であり粒でもあるなら、「物」だと思っている電子やボールも、実は少し波っぽい性質を持っているのでは、とド・ブロイは考えました。実際、電子を細い隙間に通すと、水面の波のように広がったり重なったりする様子が観察されます。あなたが歩くときにもごくごくわずかに波の性質が伴っているのですが、あまりにも波長が短すぎて誰にも気づかれないだけなのです。", "referencedBy": [{"id": "compton-effect", "title": "コンプトン効果", "field": "quantum"}, {"id": "schrodinger-equation", "title": "シュレディンガー方程式", "field": "quantum"}, {"id": "double-slit-experiment", "title": "二重スリット実験（1粒子ずつでも干渉）", "field": "quantum"}]}, {"id": "decoherence", "title": "デコヒーレンス（なぜ日常は「古典的」か）", "aka": "Quantum decoherence", "field": "quantum", "area": "量子のふしぎ", "section": "量子のふしぎ", "headline": "周りの環境との相互作用が、量子の不思議さを瞬時にかき消す", "summary": "電子1個のような小さな系では重ね合わせや干渉といった量子的な性質がはっきり現れるが、猫や人間のような無数の粒子からなる大きな物体では、そうした性質は観測されない。デコヒーレンスとは、対象が周囲の無数の粒子（空気分子や光子など）と絶えず相互作用することで、量子的な重ね合わせの情報が周囲の環境へと急速に拡散・漏れ出し、実質的に重ね合わせが壊れて古典的なふるまいしか見えなくなる過程のことである。これにより、量子力学の不思議な性質が原子や電子のようなミクロな世界だけに現れ、私たちの日常のマクロな世界では隠れてしまう理由が説明できる。", "keyPoint": "デコヒーレンスが起きる速さは物体が大きいほど桁違いに速く、猫程度の大きさの物体では想像を絶する短い時間（一説には10⁻²³秒程度）で量子的な重ね合わせが消えてしまうとされる——シュレディンガーの猫が生死の重ね合わせを保てない理由の現代的な説明。", "body": [{"label": "量子コンピュータにとっての最大の敵", "text": "量子コンピュータのqubit（量子ビット）は重ね合わせやもつれを計算に利用するため、デコヒーレンスによってそれが壊れてしまうことが最大の技術的課題であり、極低温にしたり外部からの振動・電磁波を徹底的に遮断したりする理由になっている。"}], "relatedTopics": [{"concept": "superposition-schrodingers-cat", "relation": "原因と結果"}, {"concept": "wavefunction-collapse", "relation": "対比"}, {"concept": "measurement-problem-interpretations", "relation": "関連"}, {"concept": "quantum-error-correction", "relation": "原因と結果"}], "easyHeadline": "まわりとぶつかりまくると、量子の不思議さはすぐ消える", "easyBody": "静かな部屋で1人だけならダンスの独特なステップ（量子っぽいふるまい）を続けられても、満員電車のようにまわりの人にひっきりなしにぶつかられ続けたら、あっという間に周りに合わせた普通の歩き方（古典的なふるまい）になってしまいますよね。猫や人間のような大きなものは、空気の分子や光など無数の「まわり」に常にぶつかられているので、量子らしい不思議な状態を一瞬たりとも保てません。これが、私たちの日常が量子力学的に見えない理由です。", "referencedBy": [{"id": "uncertainty-misconceptions", "title": "不確定性の誤解を解く", "field": "quantum"}, {"id": "measurement-problem-interpretations", "title": "測定問題と各種解釈（コペンハーゲン・多世界）", "field": "quantum"}, {"id": "wavefunction-collapse", "title": "観測による波束の収縮", "field": "quantum"}, {"id": "superposition-schrodingers-cat", "title": "重ね合わせとシュレディンガーの猫", "field": "quantum"}, {"id": "quantum-error-correction", "title": "量子誤り訂正", "field": "quantum"}]}, {"id": "deep-learning-breakthrough", "title": "ディープラーニングの躍進（ImageNetとAlexNet）", "aka": "AlexNet / ImageNet / Deep Learning", "field": "ai", "area": "AI史", "section": "AIの歴史", "headline": "画像認識コンペでの圧勝がAIの潮流を変えた", "summary": "2012年、画像認識の精度を競う国際コンペティション「ImageNet」で、トロント大学のチームが開発した「AlexNet」と呼ばれる深層ニューラルネットワークが、従来手法を大幅に上回る精度で優勝し、AI研究の潮流を大きく変える転換点となった。それまで画像認識では人間が特徴（エッジや色のパターンなど）を設計してプログラムに教える手法が主流だったが、AlexNetは大量の画像データとニューラルネットワークの層を深く積み重ねる「ディープラーニング（深層学習）」の手法により、特徴そのものをデータから自動的に学習することができた。この勝利の背景には、大量の画像データを含むImageNetデータセットの整備と、GPUを使った並列計算によって深いネットワークの学習を現実的な時間で行えるようになったことがある。この出来事を機に、画像認識だけでなく音声認識や自然言語処理など幅広い分野でディープラーニングへの移行が急速に進み、現在のLLMやTransformerに至るAI技術の土台が築かれていった。", "keyPoint": "2012年のAlexNetの勝利は、「特徴を人間が設計する」時代から「特徴をデータから自動学習する」時代への転換点になった。", "body": [{"label": "なぜAlexNetが画期的だったのか", "text": "従来の画像認識は専門家が手作業で「輪郭を検出する」「色の分布を見る」といった特徴抽出のルールを設計していたが、AlexNetは何層にも重ねたニューラルネットワークに大量の画像を学習させることで、有効な特徴そのものを自動的に発見させることに成功した。"}, {"label": "データと計算力という土台", "text": "100万枚を超える画像に注釈をつけたImageNetデータセットの存在と、GPUによる並列計算の活用が、深いネットワークを現実的な時間で学習させることを可能にし、理論だけでなく環境が整ったことがブレイクスルーの条件だった。"}], "relatedTopics": [{"concept": "ai-winter-history", "relation": "原因と結果"}, {"concept": "nvidia-ai-chips", "relation": "関連"}, {"concept": "alphago-milestone", "relation": "原因と結果"}, {"concept": "alphafold", "relation": "関連"}], "year": 2012, "yearLabel": "2012年（AlexNetがImageNetコンペで圧勝）", "referencedBy": [{"id": "ai-winter-history", "title": "AIの歴史——ブームと冬の時代", "field": "ai"}, {"id": "alphago-milestone", "title": "AlphaGoという転換点", "field": "ai"}, {"id": "symbolic-ai-expert-systems", "title": "記号主義AIとエキスパートシステム", "field": "ai"}]}, {"id": "deficiency-diseases-history", "title": "欠乏症が切り開いた栄養学", "aka": "Deficiency diseases and the history of nutrition science", "field": "food", "area": "食の歴史と栄養学", "section": "栄養学の基礎", "headline": "壊血病・脚気の解明が、ビタミンの発見につながった", "summary": "栄養学は「何を食べれば病気になるか」という欠乏症の研究から生まれた。長い航海で船乗りが歯茎の出血や倦怠感で次々と死ぬ壊血病は、1747年にイギリスの軍医ジェームズ・リンドが柑橘類を与える群だけ回復することを示し、後にビタミンC不足が原因と判明した。日本では白米中心の食事で手足がしびれ心不全に至る脚気が問題になり、海軍軍医の高木兼寛が麦飯を混ぜる食事で発症を減らせることを実証、その後オランダ人医師エイクマンと鈴木梅太郎らの研究で米ぬかに含まれる成分(後のビタミンB1)の欠乏が原因と分かった。「微量の未知物質が無いと病気になる」という発見の積み重ねが、1912年に化学者カジミール・フンクによる「ビタミン(vitamine)」という命名につながった。", "keyPoint": "ビタミンは最初から物質として発見されたのではなく、「これが無いと病気になる何か」として先に病気の側から見つかった。", "body": [{"label": "リンドの対照実験", "text": "壊血病患者を複数の食事グループに分け、柑橘類を与えた群だけが回復することを示した、栄養学史上最初期の対照実験のひとつとされる。"}, {"label": "脚気論争", "text": "当時は脚気を細菌感染症と考える説も有力で、高木兼寛の栄養説とドイツ医学の感染説が対立した。感染症としての病気観が主流だった時代に、食事内容だけで病気を防いだ点が画期的だった。"}], "relatedTopics": [{"concept": "vitamins-and-minerals", "relation": "原因と結果"}, {"concept": "germ-theory-vaccines", "relation": "対比"}, {"concept": "canning-and-preservation-history", "relation": "関連"}], "easyHeadline": "「これが無いと病気になる」の発見から、ビタミンが見つかった", "easyBody": "壊血病(ビタミンC不足)や脚気(ビタミンB1不足)は、原因の物質が特定される前に「これを食べさせると治る」という実験から病気の正体に迫った例です。この積み重ねが「ビタミン」という言葉と栄養学そのものを生みました。", "referencedBy": [{"id": "vitamins-and-minerals", "title": "ビタミンとミネラル", "field": "food"}, {"id": "canning-and-preservation-history", "title": "保存技術が変えた食と戦争", "field": "food"}]}, {"id": "denaturation", "title": "変性", "aka": "Denaturation", "headline": "熱・酸・洗剤で、形だけが壊れる", "summary": "立体構造がほどけて機能を失う現象。ペプチド結合（一次構造）は切れず、それを支えていた弱い相互作用（水素結合・疎水結合）が壊れる。ゆで卵、牛乳が酸で固まる、パーマ、アルコール消毒はどれも変性。多くは不可逆で、ほどけた鎖どうしが絡んで白く固まる（凝集）。", "keyPoint": "『一次構造は無事、高次構造だけ壊れる』——フォールディングが配列で決まることの裏返しの証拠。", "body": [{"label": "変性剤", "text": "熱、強酸・強アルカリ、尿素・グアニジン、SDS（洗剤）、有機溶媒、重金属。"}, {"label": "可逆と不可逆", "text": "小さく安定なタンパク質は条件を戻すと畳み直す（アンフィンセン）。大きいものは凝集して戻らない。"}, {"label": "応用", "text": "PCRの熱変性でDNA二本鎖を開く、調理、タンパク質電気泳動（SDS-PAGE）で鎖を一本ずつバラす。"}], "relatedTopics": [{"concept": "protein-folding", "relation": "対比"}, {"concept": "alpha-helix-beta-sheet", "relation": "関連"}, {"concept": "enzyme", "relation": "原因と結果"}], "field": "molecular-biology", "area": "タンパク質", "section": "構造", "easyHeadline": "熱や酸をかけると、タンパク質の形だけがくずれる", "easyBody": "卵を茹でると白身が固まって透明から白に変わりますが、あれがタンパク質の「変性」です。部品（アミノ酸）のつながり自体は切れていませんが、丸まっていた形がほどけてしまい、元の仕事ができなくなります。一度くずれた形は、多くの場合元に戻りません。", "referencedBy": [{"id": "pcr", "title": "PCR（ポリメラーゼ連鎖反応）", "field": "molecular-biology"}, {"id": "protein-structure-levels", "title": "タンパク質の四段階構造", "field": "molecular-biology"}, {"id": "protein-folding", "title": "フォールディング", "field": "molecular-biology"}, {"id": "cooking-as-chemistry-and-physics", "title": "料理は化学と物理の実験である", "field": "food"}, {"id": "phase-transition", "title": "状態変化", "field": "chemistry"}, {"id": "enzyme", "title": "酵素", "field": "molecular-biology"}, {"id": "fish-as-food", "title": "魚の身は筋肉である", "field": "food"}]}, {"id": "diffusion-models", "title": "拡散モデル——ノイズから画像を作る", "aka": "Diffusion Model", "field": "ai", "area": "生成AI", "section": "生成AIの広がり", "headline": "ランダムノイズを少しずつ整えて画像を作る仕組み", "summary": "拡散モデルは、画像生成AI（Stable DiffusionやMidjourneyなど）の中核をなす技術で、真っ白なノイズ（砂嵐のような乱雑な画像）から出発し、それを少しずつ「ノイズ除去」していくことで最終的に意味のある画像を作り上げる仕組みである。学習の際には逆に、実在する画像に段階的にノイズを加えていき、各段階でどれだけノイズが加わったかをモデルに予測させることで、ノイズを除去する能力を鍛える。生成時には、テキストで指定した内容（プロンプト）に沿うように、この除去のプロセスを何十回も繰り返しながら徐々に画像を鮮明にしていく。この手法は以前主流だった敵対的生成ネットワーク（GAN）よりも学習が安定しやすく、高解像度で多様な画像を生成できることから、2022年前後に画像生成AIの主流技術として急速に広まった。", "keyPoint": "拡散モデルは、ノイズを加える過程を学習した上で、それを逆再生するようにノイズを取り除いて画像を作り出す。", "body": [{"label": "学習と生成は逆向きのプロセス", "text": "学習時は「きれいな画像にノイズを加えていく」過程を大量に観察してノイズの予測能力を鍛え、生成時はその逆の「ノイズを少しずつ取り除く」過程を繰り返すことで、何もない状態から画像を作り出す。"}, {"label": "テキストとの結びつけ", "text": "プロンプトのテキストを埋め込みベクトルに変換し、ノイズ除去の各ステップでその情報を参照させることで、指定した内容に沿った画像が生成されるように誘導している。"}], "relatedTopics": [{"concept": "generative-ai-overview", "relation": "構成する"}, {"concept": "embeddings-vector-space", "relation": "技術で見る"}, {"concept": "multimodal-ai", "relation": "関連"}], "referencedBy": [{"id": "generative-ai-overview", "title": "生成AIとは——作り出すAI", "field": "ai"}]}, {"id": "digestive-system", "title": "消化管——分解と吸収の一本道", "aka": "Digestive System", "field": "human-body", "area": "臓器", "section": "からだを支える臓器", "headline": "食べ物を分解し吸収可能な形に変える一本の管", "summary": "消化管は口から肛門まで続く一本のトンネルで、食べ物を機械的に細かくしながら、酵素(化学反応を助けるタンパク質)によって栄養素を吸収できる小さな分子にまで分解していく。デンプンは唾液や膵液のアミラーゼでブドウ糖に、タンパク質は胃液や膵液のプロテアーゼでアミノ酸に、脂肪は胆汁の助けを借りたリパーゼで脂肪酸に分解される。分解された栄養素の大部分は小腸の壁一面にある無数の小さな突起(絨毛)から吸収され、その表面積は広げるとテニスコート1面分に匹敵するといわれる。消化管の壁の外側は食べ物が通過するだけの単純な管に見えるが、内部は消化液の分泌・吸収・免疫防御が同時に進む複雑な化学プラントである。実際、腸には体内の免疫細胞の相当な割合が集まっており、食べ物に紛れて入ってくる病原体への最前線の防御拠点にもなっている。", "keyPoint": "消化とは「大きな分子を、細胞が使える小さな分子に分解する」化学反応の連続である。", "body": [{"label": "部位ごとの役割分担", "text": "胃は強い酸とペプシンでタンパク質の分解を始め、小腸は膵臓と肝臓から分泌液を受け取りながら本格的な消化と吸収の大部分を担い、大腸は残った水分を吸収して便を形成する。"}, {"label": "酵素というはさみ", "text": "消化酵素はそれぞれ特定の栄養素だけを分解する専門のはさみのような存在で、デンプン用・タンパク質用・脂肪用がそれぞれ異なるタイミングと場所で働く。"}, {"label": "腸は免疫の最前線でもある", "text": "腸の壁には体内で最も多くの免疫細胞が集まっており、食べ物に混じって侵入する細菌やウイルスを常に監視している。"}], "relatedTopics": [{"concept": "liver-metabolism-detox", "relation": "はたらく相手"}, {"concept": "enzyme", "relation": "関連"}, {"concept": "blood-sugar-regulation", "relation": "原因と結果"}, {"concept": "innate-vs-adaptive-immunity", "relation": "関連"}], "figure": "digestive-pipeline", "referencedBy": [{"id": "liver-metabolism-detox", "title": "肝臓——代謝と解毒の工場", "field": "human-body"}, {"id": "kidney-homeostasis", "title": "腎臓——ろ過と体液の恒常性", "field": "human-body"}]}, {"id": "digital-analog-difference", "title": "デジタル・アナログの違い", "aka": "Digital vs Analog", "field": "technology", "area": "計算とAI", "section": "情報を演算する", "year": 1937, "yearLabel": "1937年（デジタル論理回路の理論的基礎）", "headline": "情報を「連続の値」で扱うか、「段階の数値」で扱うか", "summary": "アナログは音の大きさや電圧のように、値がなめらかに連続して変化する量をそのまま扱う方式。デジタルはその値を細かく区切り、0と1の組み合わせ（2進数）という有限個の数値に変換して扱う方式。デジタルは変換の際に情報をわずかに削るが、コピーしても劣化せず、多少ノイズが乗っても0か1かを読み直せば元通りに復元できる。この「劣化しない」「正確に複製できる」という性質が、コンピュータ・通信・記録メディアがそろってデジタル化した最大の理由。", "figure": "digital-analog", "keyPoint": "アナログは劣化する。デジタルは「読み直して0/1を確定させ に従ってエネルギーの低い軌道から順に詰まっていく。この詰まり方（電子配置）を元素ごとに書き並べると、化学の授業で暗記する周期表の縦の列（族、性質が似た元素が並ぶ）や横の行（周期）のパターンが、量子力学の必然的な帰結として自然に説明できる。特に、原子の一番外側の軌道にある電子（最外殻電子・価電子）の配置パターンが、その元素の反応のしやすさなど化学的性質のほとんどを決めている。", "keyPoint": "19世紀にメンデレーエフが量子力学を全く知らずに経験則だけで作った周期表の並びが、その半世紀以上後に確立した量子力学の電子配置の理論と寸分たがわず一致したことは、科学史上屈指の驚くべき符合とされる。", "body": [{"label": "貴ガスが反応しにくい理由", "text": "ヘリウムやネオンなどの貴ガスは、最外殻の軌道がちょうどぴったり電子で満たされた安定な電子配置になっているため、他の原子と電子をやり取りする必要がなく、極めて反応しにくい。"}], "relatedTopics": [{"concept": "pauli-exclusion-principle", "relation": "原因と結果"}, {"concept": "atomic-orbitals-quantum-numbers", "relation": "原因と結果"}, {"concept": "quantum-chemical-bonding", "relation": "原因と結果"}, {"concept": "periodic-table", "relation": "構成する"}, {"concept": "atom-structure", "relation": "関連"}], "easyHeadline": "周期表の並びは、電子の「席の埋まり方」の表", "easyBody": "周期表を初めて見たとき、なぜあんな不思議な形に元素が並んでいるのか疑問に思った人は多いはずです。実はあの並び方は、原子の中で電子が席（軌道）をどの順番で埋めていくかを、そのまま図にしたものなのです。同じ列に並ぶ元素は、一番外側の電子の並び方が似ているため、似たような化学反応の仕方をします。周期表の形は、量子力学のルールが目に見える形になったものと言えます。", "referencedBy": [{"id": "pauli-exclusion-principle", "title": "パウリの排他原理", "field": "quantum"}, {"id": "quantum-chemical-bonding", "title": "化学結合の量子論（結合性・反結合性軌道）", "field": "quantum"}, {"id": "atomic-orbitals-quantum-numbers", "title": "原子軌道と量子数", "field": "quantum"}]}, {"id": "embeddings-vector-space", "title": "埋め込みベクトル——意味を数の空間に", "aka": "Embeddings / Word Embeddings", "field": "ai", "area": "Transformer", "section": "Transformerの構造", "headline": "単語や文の意味を多次元の数値の並びで表す技術", "summary": "埋め込み（エンベディング）とは、単語や文章を、意味の近さが数値的な距離として表現される多次元のベクトル（数の並び）に変換する技術のことである。この空間では「王様」から「男性」を引いて「女性」を足すと「女王」に近いベクトルになる、というように、意味の関係が座標間の演算に対応することが知られている。LLMはまずトークン化された各トークンをこの埋め込みベクトルに変換し、その後Transformerの各層でアテンションなどの計算を経て文脈を反映した表現へと更新していく。埋め込みは検索エンジンでの類似文書検索や、RAGでの関連情報の抽出にも使われており、文章同士・画像同士、あるいは文章と画像の意味的な近さを測る汎用的な道具として活用されている。", "keyPoint": "埋め込みベクトルの世界では、意味の近さが数値空間上の距離の近さとして表現される。", "body": [{"label": "意味の演算ができる理由", "text": "大量のテキストを学習する過程で、似た文脈で使われる単語同士が自然と近い座標に配置されるよう調整されるため、結果として意味的な関係が空間内の位置関係として現れる。"}, {"label": "RA 的にも経済的にも現実味を帯びてきた。電力網（グリッド）側でも、需要と供給を常に一致させるための調整力として、大規模蓄電所や家庭用蓄電池、さらには電気自動車のバッテリーを分散型の蓄電資源として活用する構想が進んでいる。再生可能エネルギーの導入拡大は、この「電気を貯める」インフラへの投資と一体でなければ実現できないため、蓄電池産業は再エネ産業の裏側を支える成長分野として注目されている。", "keyPoint": "再生可能エネルギーの普及率は、発電設備の量だけでなく「余った電気をどれだけ貯められるか」という蓄電容量によって上限が決まる。", "body": [{"label": "系統用蓄電池という新しい市場", "text": "発電所や変電所に併設される大規模な系統用蓄電池は、再エネの出力変動を吸収するだけでなく、電力価格が安い時間に充電し高い時間に放電することで収益を上げるビジネスとしても成立し始めている。"}, {"label": "EVという「動く蓄電池」", "text": "電気自動車の普及が進むと、多数のEVバッテリーを束ねて電力網の需給調整に使う「V2G（Vehicle to Grid）」という発想が現実味を帯びる。自動車産業とエネルギー産業が重なり合う新しい領域である。"}], "relatedTopics": [{"concept": "renewable-energy-transition", "relation": "はたらく相手"}, {"concept": "ice-vs-ev", "relation": "関連"}, {"concept": "electric-generator-grid", "relation": "関連"}], "referencedBy": [{"id": "ice-vs-ev", "title": "内燃機関とEV", "field": "industry"}, {"id": "renewable-energy-transition", "title": "再生可能エネルギーへの転換", "field": "industry"}]}, {"id": "engine-mechanism", "title": "エンジンの仕組み", "aka": "Internal combustion engine", "field": "mechanisms", "area": "エネルギーを生み・蓄える", "section": "エンジン", "headline": "燃料を爆発させ、圧力の押す力を回転に変える", "summary": "自動車の内燃機関(エンジン)は、シリンダーという筒の中でガソリンと空気の混合気を圧縮し、点火して爆発的に燃焼させる。燃焼で急激に膨張した気体がピストンを押し出し、その直線の動きをクランクという仕組みが回転運動に変える。「吸気→圧縮→燃焼(爆発)→排気」の4行程を繰り返すことで、化学エネルギー(燃料)が連続した回転の動力に変わり続ける。", "keyPoint": "エンジンは「小さな爆発」を規則正しく連続させて、その圧力の押す力だけを取り出す装置。", "body": [{"label": "なぜ圧縮するのか", "text": "圧縮してから燃やすほど、同じ燃料からより大きな圧力=より大きな仕事を取り出せる(効率が上がる)。"}, {"label": "電気自動車との違い", "text": "電気モーターは電気エネルギーを直接回転に変えるため燃焼行程が無く、構造がずっとシンプル。"}], "relatedTopics": [{"concept": "combustion", "relation": "技術で見る"}, {"concept": "thermal-engines-and-second-law", "relation": "はたらく相手"}, {"concept": "work-and-kinetic-energy", "relation": "関連"}], "easyHeadline": "燃料の爆発の押す力を、回転する動きに変えている", "easyBody": "車のエンジンは、筒の中でガソリンと空気を圧縮してから爆発させ、その勢いでピストンを押し出します。ピストンの直線の動きは、クランクという部品によって回転する動きに変えられ、タイヤを回す力になります。", "referencedBy": []}, {"id": "entropy-and-irreversibility", "title": "エントロピーと不可逆性", "aka": "Entropy and the arrow of time", "field": "physics", "area": "エネルギーと熱", "section": "熱力学", "headline": "『時間の向き』を決めているのはエントロピー増大則", "summary": "孤立した系のエントロピー（取りうる状態の数の多さ）は自然には減ることがなく、増えるか変わらないかのどちらかしかない――これが熱力学第二法則。割れたコップが自然に元に戻らない、混ざった煙が自然には分離しない、といった「時間には向きがある」という日常感覚の物理的な正体はこれだと考えられている。化学反応が自発的に進むかどうかを決めるエントロピー（化学のギブズ自由エネルギーの一部）も、根はこの同じ原理。", "keyPoint": "ミクロな1つ1つの物理法則（ニュートンの法則など）には時間の向きの区別がないのに、無数の粒子が集まった結果として『時間の矢』が現れる――統計力学の驚くべき帰結。", "figure": "entropy-arrow", "body": [{"label": "統計的な意味", "text": "「散らばった状態」の方が「そろった状態」より圧倒的に実現の仕方（場合の数）が多いから、ひとりでにそちらへ向かう。"}, {"label": "生命とエントロピー", "text": "生物は体内の秩序を保つが、そのぶん周囲によりたくさんの熱・乱雑さを捨てている。全体では必ず増えている。"}], "relatedTopics": [{"concept": "thermal-engines-and-second-law", "relation": "構成する"}, {"concept": "energy-conservation-law", "relation": "対比"}, {"concept": "entropy", "relation": "なかま"}, {"concept": "newtons-laws-of-motion", "relation": "対比"}], "easyHeadline": "時間が一方向にしか進まないように感じる理由", "easyBody": "割れたコップがひとりでに元に戻ったり、混ざった煙がひとりでに分かれたりしないのは、「散らばった状態」の方が「そろった状態」よりも圧倒的に起こりやすいからです。この「放っておくと乱雑さが増える一方」という性質が、私たちが感じる「時間は一方向にしか進まない」という感覚の正体だと考えられています。", "referencedBy": [{"id": "dark-energy-acceleration", "title": "暗黒エネルギーと加速膨張", "field": "space"}, {"id": "thermal-engines-and-second-law", "title": "熱機関と効率・第二法則", "field": "physics"}]}, {"id": "entropy", "title": "エントロピー", "aka": "Entropy", "field": "chemistry", "area": "エネルギーと自発性", "section": "進む向き", "headline": "放っておくと、ものは散らばる方向に進む", "summary": "エントロピーは『取りうる状態の数の多さ＝乱雑さ』の尺度。孤立した系では、エントロピーが増える方向にしか自発的に変化しない（熱力学第二法則）。インクが水に広がる、熱が高温から低温へ流れる、部屋が散らかる——どれも『散らばった状態の方が圧倒的に場合の数が多い』から。時間の向きを決めているのはこの法則だとも言われる。", "keyPoint": "生き物は体内のエントロピーを下げているように見えるが、そのぶん周囲によりたくさんの熱と乱雑さを吐き出している。全体では必ず増える。", "body": [{"label": "ミクロな意味", "text": "分子の並べ方・エネルギーの配り方の数。多いほどエントロピーが高い。"}, {"label": "溶解や気化", "text": "固体→液体→気体でエントロピーは増える。だから加熱で状態が変わる。"}], "relatedTopics": [{"concept": "gibbs-free-energy", "relation": "構成する"}, {"concept": "phase-transition", "relation": "関連"}, {"concept": "thermochemistry-enthalpy", "relation": "なかま"}, {"concept": "dissolution", "relati biology"}]}, {"id": "exoplanet-detection", "title": "系外惑星の見つけ方（トランジット・視線速度）", "aka": "Exoplanet detection", "field": "space", "area": "太陽系", "section": "太陽系の成り立ち", "headline": "遠い星の惑星は、星のわずかな変化から間接的に見つける", "summary": "太陽系の外にある惑星（系外惑星）は非常に暗く、恒星の光にかき消されて直接見るのが難しい。そこで使われるのが間接的な方法で、代表例が2つある。「トランジット法」は、惑星が恒星の手前を横切るときにわずかに暗くなる明るさの変化を捉える方法。「視線速度法」は、惑星の重力に引っぱられて恒星がわずかにふらつく動きを、光のドップラー効果（スペクトルのずれ）として検出する方法。これらの技術によって、これまでに5000個を超える系外惑星が見つかっている。", "easyHeadline": "星のわずかな変化から見えない惑星を見つける", "easyBody": "遠くの星の周りにある惑星は暗すぎて直接は見えません。そこで、惑星が星の前を横切ったときに星が少し暗くなることや、惑星の重力で星がわずかにふらつくことを利用して、間接的に惑星を見つけます。この方法で、すでに5000個以上の惑星が見つかっています。", "keyPoint": "トランジット法で惑星を見つけるには、恒星がほんの1％程度暗くなる変化を検出する必要があり、これは遠くの街灯の前を1匹の蚊が横切る明るさの変化を検出するようなものにたとえられる。", "body": [{"label": "トランジット法の弱点", "text": "惑星の軌道面がちょうど地球から見て恒星の手前を通る向きでないと検出できないため、見つかる惑星に偏りが生じる。"}, {"label": "視線速度法の仕組み", "text": "惑星は恒星の周りだけを回っているのではなく、実際には惑星と恒星は共通の重心の周りを回っている。このわずかな恒星側の動きを検出する。"}], "relatedTopics": [{"concept": "habitable-zone", "relation": "関連"}, {"concept": "rocky-vs-gas-ice-planets", "relation": "技術で見る"}, {"concept": "spectroscopy-in-astronomy", "relation": "技術で見る"}, {"concept": "telescope-types", "relation": "関連"}], "referencedBy": [{"id": "spectroscopy-in-astronomy", "title": "スペクトルから分かること（組成・温度・運動）", "field": "space"}, {"id": "habitable-zone", "title": "ハビタブルゾーン", "field": "space"}, {"id": "rocky-vs-gas-ice-planets", "title": "岩石惑星とガス・氷惑星", "field": "space"}]}, {"id": "fabless-foundry-model", "title": "ファブレスとファウンドリ", "aka": "Fabless-Foundry Model (Horizontal Division of Labor)", "field": "industry", "area": "半導体", "section": "チップができるまで", "headline": "設計と製造を分業した半導体産業の勝ちパターン", "summary": "かつて半導体企業は設計から製造まで自社工場（ファブ）で一貫して行うのが普通だったが、工場建設費が兆円規模に膨らむと、設計だけを行い製造は外部に委託する「ファブレス」企業が主流になった。製造だけを専門に請け負う企業は「ファウンドリ」と呼ばれ、台湾のTSMCが世界最大手として君臨する。ファブレス企業（米国のクアルコムやエヌビディアなど）は巨額の工場投資を負わずに研究開発と設計に集中でき、ファウンドリは複数の顧客の注文を集めることで工場の稼働率を高め投資を回収する、という分業がお互いの利益になる。この水平分業モデルにより、半導体産業は垂直統合から「設計は米国、製造は台湾・韓国」という国際分業構造へと大きく姿を変えた。", "keyPoint": "「設計する会社」と「作る会社」を分けたことで、巨額の工場投資リスクを製造専業企業に集中させ、産業全体の効率を上げた。", "body": [{"label": "TSMCという特殊な立ち位置", "text": "TSMCは自社ブランドのチップを一切売らず、顧客企業と競合しない「純粋な製造請負業者」に徹することで、あらゆるファブレス企業から安心して発注される信頼を築いた。この「顧客と競争しない」という立ち位置がファウンドリビジネスの核心である。"}, {"label": "なお残る垂直統合企業", "text": "インテルやサムスンは設計から製造まで自社で行う「IDM（垂直統合型デバイスメーカー）」として今も存在し、最先端分野でファウンドリ事業に参入する動きも出ている。分業か統合かは、規模と技術力によって企業ごとに異なる戦略になる。"}], "relatedTopics": [{"concept": "semiconductor-manufacturing", "relation": "構成する"}, {"concept": "semiconductor-supply-chain", "relation": "関連"}, {"concept": "computer-history", "relation": "関連"}], "referencedBy": [{"id": "semiconductor-manufacturing", "title": "半導体はどう作られるか", "field": "industry"}, {"id": "semiconductor-supply-chain", "title": "半導体サプライチェーンと地政学", "field": "industry"}]}, {"id": "famine-and-history", "title": "飢饉が動かした歴史", "aka": "Famine and its historical impact", "field": "food", "area": "食の歴史と栄養学", "section": "人類史を変えた食", "headline": "特定の作物への依存が、大量の飢餓と移民を生んだ", "summary": "1845〜1852年のアイルランド大飢饉は、主食のジャガイモが疫病菌(ジャガイモ疫病)によって壊滅したことで発生し、約100万人が餓死、さらに約100万人が北米などへ移住するきっかけとなった。人口のほとんどが単一品種のジャガイモに依存する状況を作っていたのは、狭い土地で最も多くのカロリーを生産できる作物としてジャガイモが広まっていた背景があり、単一作物への依存(モノカルチャー)の危うさを象徴する事例とされる。同様に1943年のベンガル飢饉や20世紀の中国の大飢饉など、天候不順に政治的な失策(輸送の停止・強制的な穀物徴発など)が重なることで被害が拡大した例も多く、飢饉は自然災害であると同時にしばしば「人災」としての側面を持つ。", "keyPoint": "近代の大飢饉の多くは、単なる不作だけでなく、単一作物への依存や政治的な対応の失敗が重なって被害を拡大させている。", "body": [{"label": "緑の革命の動機", "text": "20世紀半ばに高収量品種の開発で食料増産を目指した『緑の革命』は、こうした大規模飢餓の再発を防ぐという明確な目的意識のもとで進められた。"}, {"label": "移民という副産物", "text": "アイルランド大飢饉による大量移住は、その後のアメリカ社会の人口構成や政治に長期的な影響を及ぼした、飢饉の歴史的な波及効果の一例。"}], "relatedTopics": [{"concept": "agricultural-revolution-diet", "relation": "原因と結果"}, {"concept": "green-revolution", "relation": "対比"}], "easyHeadline": "特定の作物だけに頼りすぎると、飢饉のリスクが跳ね上がる", "easyBody": "アイルランド大飢饉は、主食のジャガイモが病気で全滅したことで約100万人が餓死し、さらに多くの人が海外に移住するきっかけになりました。1つの作物に頼りすぎる状態(モノカルチャー)の危うさを示す代表例で、天候だけでなく政治の失敗が被害を広げることも少なくありません。", "referencedBy": [{"id": "agricultural-revolution-diet", "title": "農業革命と食生活の転換", "field": "food"}]}, {"id": "fermentation-food", "title": "発酵とは何か", "aka": "Fermentation in food", "field": "food", "area": "変える・味わう", "section": "発酵", "headline": "微生物が食材を分解し、うま味と保存性を生む", "summary": "発酵とは、酵母や乳酸菌、麹菌といった微生物が、食材に含まれるデンプンやタンパク質を自分の栄養として分解し、その過程でアルコールや酸、香り成分、うま味成分(アミノ酸)を作り出す現象。しょうゆ・味噌・納豆・ヨーグルト・パン・お酒はすべて発酵食品で、原料そのものには無い風味とうま味が加わる。同時に、乳酸や酢酸のような酸や、アルコールが増えることで他の雑菌が増えにくい環境になり、保存性が高まる――これが「腐敗」ではなく「発酵」として人に活用されてきた理由。", "keyPoint": "発酵と腐敗は同じ「微生物による分解」だが、人にとって有益な変化を発酵、有害な変化を腐敗と呼んでいるだけ。", "body": [{"label": "麹(こうじ)の役割", "text": "麹菌が出す酵素がデンプンをブドウ糖に、タンパク質をアミノ酸に分解し、それを別の微生物(酵母・乳酸菌)がさらに発酵させる、という2段階構造の発酵が多い(日本酒・味噌など)。"}, {"label": "うま味が増える理由", "text": "タンパク質が分解されて生じるグルタミン酸などのアミノ酸が、うま味成分そのもの。"}], "relatedTopics": [{"concept": "enzyme", "relation": "はたらく相手"}, {"concept": "metabolism", "relation": "原因と結果"}, {"concept": "seasonings-and-umami", "relation": "なかま"}], "easyHeadline": "微生物が食材を分解して、うま味と長持ちを生み出す", "easyBody": "発酵とは、酵母や乳酸菌などの微生物が食べ物のデンプンやタンパク質を分解して、うま味やアルコール、酸を作り出す現象です。同じ「微生物による分解」でも、人に都合の良い変化を発酵、都合の悪い変化を腐敗と呼び分けています。", "referencedBy": [{"id": "canning-and-preservation-history", "title": "保存技術が変えた食と戦争", "field": "food"}, {"id": "seasonings-and-umami", "title": "調味料とうま味", "field": "food"}]}, {"id": "filesystem-basics", "title": "ファイルシステムの基本", "aka": "File System", "field": "computer", "area": "OS", "section": "OSの役割", "headline": "ディスク上のデータを名前で管理する仕組み", "summary": "ディスク（HDDやSSD）は本来ただの巨大な記録領域にすぎず、そこには「0番地から何バイト」といった数字の羅列があるだけである。ファイルシステムは、この記録領域を「フォルダとファイル」という人間にわかりやすい階層構造で扱えるように整理するOSの仕組みで、ファイル名とディスク上の実際の場所を対応づける台帳（メタデータ）を管理している。ファイルを保存・削除・移動するたびにこの台帳が更新され、もし台帳が壊れるとデータ自体は残っていても見つけられなくなってしまう。普段何気なく行っている「ファイルを開く」という操作の裏側には、この名前解決の仕組みが必ず働いている。", "keyPoint": "ファイルシステムは、ディスク上の位置情報とファイル名を結びつける台帳を管理する仕組みである。", "body": [{"label": "メタデータという台帳", "text": "各ファイルには実際のデータとは別に、名前・サイズ・作成日時・ディスク上のどこに保存されているかといった「メタデータ」が記録されている。ファイルを削除しても実はこの台帳から情報を消すだけで、データ本体がすぐには上書きされないことも多い。"}, {"label": "階層構造というルール", "text": "フォルダ（ディレクトリ）の中にフォルダを入れ子にできる木構造は、人間が大量のファイルを整理しやすくするための約束事であり、ディスクの物理的な配置とは直接関係しない。"}], "relatedTopics": [{"concept": "os-role-kernel", "relation": "なかま"}, {"concept": "memory-logic-semiconductor", "relation": "関連"}, {"concept": "cloud-computing-basics", "relation": "関連"}], "referencedBy": [{"id": "os-role-kernel", "title": "OSの役割——カーネルとプロセス管理", "field": "computer"}, {"id": "cloud-computing-basics", "title": "クラウドコンピューティングとは", "field": "computer"}]}, {"id": "fish-as-food", "title": "魚の身は筋肉である", "aka": "Fish muscle and food science", "field": "food", "area": "食材を知る", "section": "魚", "headline": "刺身も焼き魚も、正体は魚の「筋肉」", "summary": "魚の「身」は、人間で言えば筋肉にあたる部分。魚は水中で体を支える骨格が軽くて済むため、筋肉のタンパク質繊維が動物の肉よりゆるく短い束で並んでおり、これが魚肉特有の柔らかい食感とほぐれやすさの理由になっている。刺身で食べられる新鮮さが重視されるのは、魚の筋肉には酵素や微生物がもともと多く、死後すぐに分解(自己消化)や腐敗が進みやすいため。加熱すると、筋肉のタンパク質が変性して繊維がギュッと縮み、身が締まって白く不透明になる。", "keyPoint": "魚が肉よりほぐれやすいのは、筋繊維の束が短く、つなぎ目(結合組織)が少ないため。", "body": [{"label": "白身魚と赤身魚の違い", "text": "赤身魚(マグロ・カツオ)は持久力のある筋肉で酸素を蓄えるミオグロビンが多く赤い。白身魚(タイ・ヒラメ)は瞬発力向けの筋肉でミオグロビンが少ない。"}, {"label": "うま味成分イノシン酸", "text": "魚の筋肉のエネルギー物質(ATP)が死後に分解されてイノシン酸に変わり、これがうま味のもとになる。"}], "relatedTopics": [{"concept": "denaturation", "relation": "原因と結果"}, {"concept": "molecular-motor", "relation": "なかま"}, {"concept": "mitochondria-atp", "relation": "技術で見る"}], "easyHeadline": "魚の身の正体は、泳ぐための筋肉そのもの", "easyBody": "刺身や焼き魚として食べている魚の身は、魚が泳ぐために使う筋肉です。陸の動物の肉より筋繊維の束が短くゆるいため、ほぐれやすい食感になります。加熱するとタンパク質が縮んで身が締まり、白っぽく変わります。", "referencedBy": []}, {"id": "flame-color", "title": "炎色反応", "aka": "Flame test / flame emission", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "金属ごとに決まった色で光る、原子の指紋", "summary": "炎に金属や金属塩を入れると、元素ごとに決まった色がつく。ナトリウムは黄、カリウムは紫、銅は青緑、リチウム・ストロンチウムは赤、バリウムは黄緑。炎の熱で金属原子の電子がいったん高いエネルギー状態に飛び上がり、元に戻るときに差額のエネルギーを特定の波長の光として放つため。花火の色はこの原理。", "keyPoint": "色（光の波長）は原子のエネルギー準位の差で決まり、元素ごとに固有。これを使えば遠くの星の成分もわかる（分光分析）。", "body": [{"label": "スペクトル", "text": "炎の光をプリズムで分けると、連続ではなく元素固有の輝線（決まった位置の細い線）になる。"}, {"label": "発見の歴史", "text": "この輝線からルビジウム・セシウム・ヘリウムなどが見つかった（ヘリウムは太陽の光から先に発見）。"}], "relatedTopics": [{"concept": "flame-structure", "relation": "なかま"}, {"concept": "atom-structure", "relation": "原因と結果"}, {"concept": "flame-glow-plasma", "relation": "対比"}, {"concept": "gfp", "relation": "対比"}], "easyHeadline": "金属ごとに決まった色で光る、原子の“指紋”", "easyBody": "炎の中に金属を入れると、金属の種類によって決まった色に光ります。ナトリウムは黄色、銅は青緑色というように、色は元素ごとに固有で変わりません。花火のさまざまな色は、この仕組みを利用してつけられています。", "referencedBy": [{"id": "atom-structure", "title": "原子の構造", "field": "chemistry"}, {"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "field": "chemistry"}, {"id": "flame-structure", "title": "炎の構造", "field": "chemistry"}]}, {"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "aka": "Flame luminosity & plasma", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "炎が光る理由は2つ、そして少しだけプラズマ", "summary": "炎の光には2種類の起源がある。黄色い炎は、すすの微粒子が高温で赤熱して出す光（熱放射・黒体放射）で、鉄が赤熱するのと同じ原理。青い炎は、燃焼中の分子の断片（C₂・CHなど）が化学反応のエネルギーで直接光る『化学発光』。さらに十分高温の炎では気体の一部の電子がはがれてイオンになっており、弱いながらプラズマ（第四の状態）でもある。", "keyPoint": "だから『炎はプラズマか？』の答えは“ほんの少しだけ”。ろうそくの炎の電離度はごくわずかで、大部分はただの熱い気体。", "body": [{"label": "黒体放射", "text": "熱い物体はすべて温度で決まる色の光を出す。500℃で鈍い赤、1500℃で黄白、太陽表面5500℃で白。"}, {"label": "炎が電気を通す", "text": "電離しているので、炎に電圧をかけると弱い電流が流れ、電場で炎が曲がる。"}], "relatedTopics": [{"concept": "flame-structure", "relation": "関連"}, {"concept": "states-of-matter", "relation": "なかま"}, {"concept": "flame-color", "relation": "対比"}, {"concept": "combustion", "relation": "原因と結果"}], "easyHeadline": "炎が光るのには理由が2つあり、ほんの少しだけプラズマ", "easyBody": "ろうそくの黄色い炎は、すすの粒が熱で真っ赤に光っている光です。一方、青い炎は反応そのものが直接光を出しています。さらに炎の中ではごくわずかに気体が電気を帯びた状態(プラズマ)にもなっていますが、その割合はとても小さいものです。", "referencedBy": [{"id": "flame-structure", "title": "炎の構造", "field": "chemistry"}, {"id": "flame-color", "title": "炎色反応", "field": "chemistry"}, {"id": "states-of-matter", "title": "物質の三態", "field": "chemistry"}]}, {"id": "flame-structure", "title": "炎の構造", "aka": "Flame structure", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "ろうそくの炎は、3つの層でできている", "summary": "ろうそくの炎をよく見ると層がある。中心の暗い『炎心』は溶けた蝋が気化しただけでまだ燃えていない部分。その外側の明るい『内炎』は酸素不足で、炭素の粒（すす）が高温で赤熱し黄色く光る。いちばん外の見えにくい『外炎』は酸素が十分でもっとも高温（約1400℃）、完全燃焼している。", "keyPoint": "いちばん熱いのは色が薄くて目立たない外炎。加熱にはここを使う。『明るい＝熱い』ではない。", "figure": "flame-zones", "body": [{"label": "上に伸びる理由", "text": "燃えて熱くなった気体は軽くなって上昇し、下から新しい空気を吸い込む（対流）。無重力では炎は球形になる。"}, {"label": "ガスコンロの青い炎", "text": "燃料と空気をあらかじめよく混ぜてあるので、すすができず完全燃焼して青く見える。"}], "relatedTopics": [{"concept": "combustion", "relation": "原因と結果"}, {"concept": "flame-color", "relation": "なかま"}, {"concept": "flame-glow-plasma", "relation": "関連"}, {"concept": "states-of-matter", "relation": "関連"}], "easyHeadline": "ろうそくの炎は、3つの層でできている", "easyBody": "ろうそくの炎をよく見ると、真ん中の暗い部分・その外側の明るく黄色い部分・いちばん外側の見えにくい部分の3つの層に分かれています。実はいちばん外側の見えにくい部分がいちばん高温で、しっかり燃えている場所です。明るく見える部分が必ずしも一番熱いわけではありません。", "referencedBy": [{"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "field": "chemistry"}, {"id": "flame-color", "title": "炎色反応", "field": "chemistry"}, {"id": "combustion", "title": "燃焼", "field": "chemistry"}]}, {"id": "forms-of-energy-and-conversion", "title": "エネルギーの形と変換", "aka": "Forms of energy and energy conversion", "field": "physics", "area": "エネルギーと熱", "section": "エネルギーの基本", "headline": "エネルギーは姿を変えながら移動する", "summary": "運動エネルギー・位置エネルギー・熱エネルギー・化学エネルギー・電気エネルギーなど、エネルギーにはさまざまな「姿」があるが、実体は同じ量で、ある形から別の形へ変換されるだけ。ジェットコースターは位置エネルギーと運動エネルギーを行き来し、電池は化学エネルギーを電気エネルギーに変える。「エネルギーを作る」「使い切る」という日常表現は便宜的なもので、物理的には常に総量が保たれたまま形が変わっているだけ。", "keyPoint": "「エネルギーを消費する」とは、便利な形（電気・運動）から使いにくい形（主に熱）へ変換すること。総量そのものは減らない。", "body": [{"label": "変換にはロスがつきもの", "text": "摩擦や電気抵抗などで一部は必ず熱として逃げる。100%の変換効率はまず実現しない。"}, {"label": "共通するのは『仕事をする能力』", "text": "どんな姿のエネルギーでも、共通するのは「他に対して仕事ができる能力」という点。"}], "relatedTopics": [{"concept": "energy-conservation-law", "relation": "なかま"}, {"concept": "work-and-kinetic-energy", "relation": "構成する"}, {"concept": "mitochondria-atp", "relation": "関連"}], "easyHeadline": "エネルギーは姿を変えながら移動しているだけ", "easyBody": "運動のエネルギー、高さのエネルギー、熱、電気――これらは姿が違うだけで、実は同じ「エネルギー」というものが形を変えながら移動しているにすぎません。ジェットコースターが高い所から下りるとき、高さのエネルギーが動きのエネルギーに変わっているのもこの一例です。", "referencedBy": [{"id": "energy-conservation-law", "title": "エネルギー保存則", "field": "physics"}]}, {"id": "fossil-fuel-power", "title": "火力発電のしくみ", "field": "industry", "area": "エネルギー", "section": "電力をつくり、蓄える", "headline": "燃やして沸かして回す、発電の一番シンプルな原理", "summary": "火力発電は石炭・石油・天然ガスを燃やして水を沸かし、発生した高圧の蒸気でタービンを回し、その回転運動を発電機で電気に変える仕組みで、20世紀の電力供給の主役を担ってきた。燃料さえ確保できれば天候に左右されず安定して発電量を調整できるため、電力需要の変動に細かく対応する「調整力」としての価値が今も大きい。一方で燃焼時に二酸化炭素を排出するため気候変動対策の観点で削減圧力が強く、電力会社にとっては「安定供給という強み」と「脱炭素という社会的要請」の板挟みという経営課題になっている。天然ガス火力は石炭より排出量が少ないため、再生可能エネルギーへの移行期を支える「つなぎの電源」として位置づけられることが多い。", "keyPoint": "火力発電の価値は発電量そのものより「必要な時に必要なだけ出力を調整できる」柔軟性にあり、これが再エネ普及後も残り続ける理由である。", "body": [{"label": "発電効率という競争軸", "text": "同じ燃料からどれだけ多くの電気を取り出せるかを示す発電効率は、最新のガスタービン複合発電（LNG火力）では60%を超える水準まで向上しており、燃料コストと排出量を同時に抑える技術革新が続いている。"}, {"label": "「調整力」としての生き残り", "text": "再生可能エネルギーが増えるほど、日照や風の変動を埋め合わせる調整電源の必要性が増す。火力発電所は主役の座を再エネに譲りながらも、この調整役として当面は残り続けると見られている。"}], "relatedTopics": [{"concept": "electric-generator-grid", "relation": "技術で見る"}, {"concept": "renewable-energy-transition", "relation": "対比"}, {"concept": "nuclear-power", "relation": "なかま"}], "referencedBy": [{"id": "renewable-energy-transition", "title": "再生可能エネルギーへの転換", "field": "industry"}, {"id": "nuclear-power", "title": "原子力発電", "field": "industry"}]}, {"id": "functional-groups", "title": "官能基", "aka": "Functional groups", "field": "chemistry", "area": "有機化学", "section": "炭素の骨格", "headline": "分子の性質は、骨格ではなく“付属パーツ”で決まる", "summary": "官能基は、有機分子について反応性や性質を決める特定の原子団。ヒドロキシ基（−OH、アルコール）、カルボニル基（C=O）、カルボキシ基（−COOH、酸）、アミノ基（−NH₂、塩基）など。同じ炭素骨格でも付いている官能基が違えば、においも溶けやすさも反応も別物になる。", "keyPoint": "有機化学は『骨格＋官能基』の組み合わせ論。教科書が官能基ごとに章立てされているのはそのため。", "body": [{"label": "反応の場", "text": "反応は多くの場合、骨格ではなく官能基のところで起きる。"}, {"label": "生体分子", "text": "アミノ酸はアミノ基とカルボキシ基を併せ持つ。糖はヒドロキシ基とカルボニル基の塊。"}], "relatedTopics": [{"concept": "carbon-bonding", "relation": "構成する"}, {"concept": "isomerism", "relation": "関連"}, {"concept": "acid-base", "relation": "はたらく相手"}, {"concept": "amino-acids", "relation": "関連"}, {"concept": "ptm", "relation": "対比"}], "easyHeadline": "分子の性質は、骨組みではなく“付属パーツ”で決まる", "easyBody": "有機分子の性質や反応のしやすさは、炭素の骨組みそのものよりも、そこにくっついている小さな部品(官能基)によって決まります。同じ形の骨組みでも、くっついている部品が違うだけで、においも溶けやすさも別物になります。", "referencedBy": [{"id": "chirality", "title": "キラリティ（鏡像異性）", "field": "chemistry"}, {"id": "carbon-bonding", "title": "炭素と有機化合物", "field": "chemistry"}, {"id": "isomerism", "title": "異性体", "field": "chemistry"}]}, {"id": "fungi-classification", "title": "菌類とは何か——動物でも植物でもない生き物", "aka": "Fungi (kingdom Fungi)", "field": "biology", "area": "菌類", "section": "分解者と共生者", "headline": "光合成せず体の外で消化する、菌類という第三の道", "summary": "菌類（キノコ・カビ・酵母など）は、かつて植物の一種として扱われていたが、実際には動物に近縁な独立した生物界を成す。植物のように光合成をせず、動物のように自ら養分を作れない点は動物と共通するが、動物のように食物を体内に取り込んで消化するのではなく、消化酵素を体外に分泌して周囲の有機物を分解し、溶けた養分を吸収するという独自の栄養獲得法（体外消化）を持つ。体は多くの場合、菌糸と呼ばれる細い糸状の構造が絡み合った菌糸体からなり、キノコはその一部が地上に出て胞子を作るための子実体にすぎない。生態系では枯れた植物や死んだ生物を分解し、炭素や窒素を土に還す分解者として、生態系の物質循環に欠かせない役割を果たしている。", "keyPoint": "キノコとして目にする部分は菌類の本体ではなく、地中や材木の中に広がる菌糸体が作る「花」のような一時的な器官である。", "body": [{"label": "体外消化という戦略", "text": "菌類は消化酵素を分泌物として外部に出し、木材や落ち葉、動物の死骸などを体の外で分解してから、溶けた栄養分を菌糸の表面から吸収する。この方法は自分より大きな固形物からでも栄養を得られる利点がある。"}, {"label": "動物に近い系統", "text": "分子系統解析からは、菌類は植物よりも動物に近い系統であることが分かっている。細胞壁の主成分がセルロース（植物）ではなくキチン（昆虫の外骨格と同じ成分）である点も、この近縁性を裏付けている。"}], "relatedTopics": [{"concept": "fungi-symbiosis", "relation": "なかま"}, {"concept": "bacteria-archaea", "relation": "対比"}, {"concept": "virus-nature", "relation": "対比"}], "referencedBy": [{"id": "bacteria-archaea", "title": "細菌と古細菌——見えない生命の大部分", "field": "biology"}, {"id": "fungi-symbiosis", "title": "菌根と地衣類——分解と共生", "field": "biology"}]}, {"id": "fungi-symbiosis", "title": "菌根と地衣類——分解と共生", "aka": "Mycorrhizae & lichens", "field": "biology", "area": "菌類", "section": "分解者と共生者", "headline": "菌類は分解者であると同時に植物と手を組む共生者", "summary": "菌類は枯れた有機物を分解する分解者として知られるが、生きた生物と密接な共生関係を結ぶことでも生態系を支えている。代表例が「菌根」で、菌類の菌糸が植物の根に入り込んだり絡みついたりして、土中の水やリン・窒素などの栄養分を植物に渡す代わりに、植物が光合成で作った糖を受け取る、双方に利益のある関係を築いている。陸上植物の8割以上がこの菌根を持つとされ、植物の陸上進出そのものを助けた関係だと考えられている。もう一つの代表例が「地衣類」で、これは菌類と光合成を行う藻類（またはシアノバクテリア）が一体化した複合体であり、菌がすみ
