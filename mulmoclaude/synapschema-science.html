function areasOf(fid, items) {
  const declared = Object.keys(STRUCTURE[fid] || {});
  const extra = [...new Set(items.filter(r=>r.field===fid).map(r=>r.area).filter(Boolean))].filter(a=>!declared.includes(a));
  return [...declared, ...extra];
}
function sectionsOf(fid, area, rows) {
  const declared = (STRUCTURE[fid] && STRUCTURE[fid][area]) || [];
  const extra = [...new Set(rows.map(r=>r.section).filter(Boolean))].filter(s=>!declared.includes(s));
  return [...declared, ...extra];
}

};

function orderBy(values, hint) {
  const seen = [...new Set(values)];
  if (!hint) return seen;
  const inHint = hint.filter(h=>seen.includes(h));
  const rest = seen.filter(s=>!hint.includes(s));
  return [...inHint, ...rest];
}

const TERM_KEYS = Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);

function Linkify({ text, onTerm }) {
  if (!text) return null;
  const nodes = [];
  let rest = String(text);
  let guard = 0;
  while (rest.length && guard++ < 4000) {
    let hitIdx = -1, hitKey = null;
    for (const k of TERM_KEYS) {
      const i = rest.indexOf(k);
      if (i !== -1 && (hitIdx === -1 || i < hitIdx)) { hitIdx = i; hitKey = k; }
    }
    if (hitIdx === -1) { nodes.push(rest); break; }
    if (hitIdx > 0) nodes.push(rest.slice(0, hitIdx));
    nodes.push(<span key={nodes.length} className="term" onClick={() => onTerm(hitKey)}>{hitKey}</span>);
    rest = rest.slice(hitIdx + hitKey.length);
  }
  return <Fragment>{nodes.map((n,i)=><Fragment key={i}>{n}</Fragment>)}</Fragment>;
}

function FigRadioModulation() {
  const wave = (y0, amp, cycles) => {
    const steps=120, x0=20, x1=540, pts=[];
    for (let i=0;i<=steps;i++){ const t=i/steps; const x=x0+(x1-x0)*t; const y=y0-amp*Math.sin(2*Math.PI*cycles*t); pts.push(x.toFixed(1)+","+y.toFixed(1)); }
    return pts.join(" ");
  };
  const amWave = (y0, carrierAmp, carrierCycles, msgCycles) => {
    const steps=220, x0=20, x1=540, pts=[];
    for (let i=0;i<=steps;i++){ const t=i/steps; const x=x0+(x1-x0)*t; const env=1+0.55*Math.sin(2*Math.PI*msgCycles*t); const y=y0-env*carrierAmp*Math.sin(2*Math.PI*carrierCycles*t); pts.push(x.toFixed(1)+","+y.toFixed(1)); }
    return pts.join(" ");
  };
  return (
    <svg viewBox="0 0 560 250" style={SW} className="w-full">
      <text x="20" y="20" fill="#fcd34d" fontSize="11" fontWeight="700">伝えたい音（メッセージ波）</text>

      <text x="20" y="170" fill="#fdba74" fontSize="11" fontWeight="700">AM：振幅が音の形にそって変化（＝情報が乗った）</text>

  );
}

なります。どのブロックをどんな順番で使うかによって、できあがるタンパク質の形やはたらきがまったく変わります。", "keyPoint": "側鎖が疎水性か親水性か——これがフォールディングの主役。水を嫌う側鎖が内側に隠れようとして鎖が畳まれる。", "body": [{"label": "ペプチド結合", "text": "隣り合うアミノ酸のカルボキシル基とアミノ基が水1分子を放って結合する。この繰り返しでできた主鎖を『ポリペプチド』と呼ぶ。"}, {"label": "必須アミノ酸", "text": "20種のうち9種はヒトが合成できず食事からとる必要がある。残りは体内で作れる。"}, {"label": "側鎖の分類", "text": "無電荷・酸性（負電荷）・塩基性（正電荷）・疎水性・特殊（システインのSH、プロリンの環、グリシンの最小側鎖）に大別される。"}], "relatedTopics": [{"concept": "protein-structure-levels", "relation": "構成する"}, {"concept": "protein-folding", "relation": "原因と結果"}, {"concept": "genetic-code", "relation": "関連"}, {"concept": "translation", "relation": "関連"}], "referencedBy": [{"id": "acid-base", "title": "酸と塩基", "field": "chemistry"}, {"id": "aromatic-benzene", "title": "芳香族とベンゼン環", "field": "chemistry"}, {"id": "carbon-bonding", "title": "炭素と有機化合物", "field": "chemistry"}, {"id": "chemical-bond", "title": "化学結合", "field": "chemistry"}, {"id": "chirality", "title": "キラリティ（鏡像異性）", "field": "chemistry"}, {"id": "enzyme", "title": "酵素", "field": "molecular-biology"}, {"id": "functional-groups", "title": "官能基", "field": "chemistry"}, {"id": "genetic-code", "title": "遺伝暗号（コドン）", "field": "molecular-biology"}, {"id": "hemoglobin", "title": "ヘモグロビン", "field": "molecular-biology"}, {"id": "isomerism", "title": "異性体", "field": "chemistry"}, {"id": "polymers", "title": "高分子（ポリマー）", "field": "chemistry"}, {"id": "protein-folding", "title": "フォールディング", "field": "molecular-biology"}, {"id": "protein-structure-levels", "title": "タンパク質の四段階構造", "field": "molecular-biology"}, {"id": "translation", "title": "翻訳", "field": "molecular-biology"}]}, {"id": "amyloid", "title": "アミロイド", "aka": "Amyloid fibril", "field": "molecular-biology", "area": "タンパク質", "section": "折りたたみと病気", "headline": "βシートが積み重なった、丈夫な異常繊維", "summary": "本来は可溶なタンパク質が、βストランドがはしご状に積み重なった『クロスβ』構造の不溶性繊維に変わって組織にたまる状態。アルツハイマー病のAβ・タウ、パーキンソン病のαシヌクレイン、全身性アミロイドーシスのトランスサイレチンなど、配列が違っても最終的に似た繊維になる。", "easyHeadline": "本来の形をくずして積み重なる、病気の原因になる繊維", "easyBody": "本来は正常な形で溶けていたタンパク質が、間違 ry", "area": "有機化学", "section": "かたちと異性", "headline": "電子が輪を回って、異常に安定な6角形", "summary": "ベンゼンは炭素6個が正六角形に並んだ分子。二重結合と単結合が交互にあるように描かれるが、実際は6個の電子が環全体に広がって（非局在化）どの結合も同等で、そのぶん飛び抜けて安定している。この『芳香族性』を持つ環は、染料・医薬・プラスチック・DNAの塩基まで、あらゆる所に現れる。", "easyHeadline": "電子がぐるっと回る、特別に安定な6角形の分子", "easyBody": "ベンゼンという分子は、炭素が6個つながって正六角形の輪になっています。輪の中の電子が1か所に固定されず輪全体をぐるぐる回っているようなイメージで、そのおかげで普通の分子よりずっと壊れにくく安定しています。香料や薬、プラスチックなど、身近なものにたくさん含まれる形です。", "keyPoint": "『安定＝反応しにくい』。ベンゼン環は二重結合を持つのに付加反応をあまりせず、環を保ったまま置換反応をする。", "figure": "benzene", "body": [{"label": "名前の由来", "text": "初期に見つかった芳香族化合物が良い匂いを持っていたため。今は匂いと無関係に構造で定義する。"}, {"label": "生体との関わり", "text": "フェニルアラニン・チロシン・トリプトファンの側鎖、DNA/RNAの塩基、多くの薬に芳香環がある。"}], "relatedTopics": [{"concept": "carbon-bonding", "relation": "関連"}, {"concept": "chemical-bond", "relation": "関連"}, {"concept": "polymers", "relation": "なかま"}, {"concept": "amino-acids", "relation": "関連"}], "referencedBy": [{"id": "polymers", "title": "高分子（ポリマー）", "field": "chemistry"}]}, {"id": "artificial-intelligence", "title": "人工知能（AI）", "aka": "Artificial Intelligence / 機械学習 / ニューラルネットワーク", "field": "technology", "area": "計算とAI", "section": "情報を演算する", "year": 1956, "yearLabel": "1956年（ダートマス会議・AIという言葉の誕生）", "headline": "大量のデータと計算力が、「学習する機械」を実用化した", "summary": "人工知能の研究自体は1950年代から続いてきたが、長らく理論と実用のあいだに大きな溝があった（複数回の「AIの冬」）。2010年代以降にAIが急速に実用化した背景には、(1) インターネットの普及で学習に使える大量のデータが手に入るようになったこと、(2) 半導体（特にGPU）の性能向上で膨大な計算を短時間でこなせるようになったこと、(3) ニューラルネットワークの学習方法（深層学習）が理論的に整備されたこと、という3つの要素が揃ったことがある。AlphaFoldがタンパク質の立体構造をアミノ酸配列から高精度に予測できるようになったのも、この計算力とデータの蓄積があったからこそ。AIは「科学の発見」というより「複数の技術（データ・半導体・アルゴリズム）が組み合わさって初めて実用化した」典型例で、逆に科学（構造生物学・創薬など）を加速するツールとしても働き始めている。", "keyPoint": "AIの実用化は1つの発見ではなく、データ・計算力・アルゴリズムという3つの技術が揃うのを待って起きた。", "body": [{"label": "AIの冬", "text": "1970年代・1980年代に、当時の計算力とデータ量ではAI研究の期待に実装が追いつかず、資金と関心が急減した時期が2度あった。"}, {"label": "科学へのフィードバック", "text": "AlphaFoldのように、AI自体がタンパク質構造解析という科学研究を加速する道具にもなっている——『技術が科学を進める』の現代版。"}], "relatedTopics": [{"concept": "computer-history", "relation": "原因と結果"}, {"concept が、複製と読み出しの土台", "summary": "DNAの塩基はA・T・G・Cの4種類。AはTと、GはCとだけ水素結合で対になる（相補性）。この単純な鍵と鍵穴のおかげで、1本の鎖の並びが決まれば相手の鎖の並びも自動的に決まる。複製・転写・PCR・CRISPRのガイド——遺伝子技術のほぼすべてがこのルールに乗っている。", "easyHeadline": "A対T、G対C ── 決まった相手としかくっつかない", "easyBody": "DNAの文字はA・T・G・Cの4種類で、AはTと、GはCとだけペアになります。相手が決まっているおかげで、片方の鎖の並びが分かればもう片方も自動的に決まります。DNAのコピーも遺伝子検査もゲノム編集も、ほとんどの技術がこの単純なルールの上に成り立っています。", "keyPoint": "G–Cは水素結合3本、A–Tは2本。GCの多いDNAほど熱で開きにくい（PCRの温度設計に効く）。", "body": [{"label": "遺伝暗号との関係", "text": "mRNAではTのかわりにUを使う。コドンの読み替えもこの対合が担う。"}, {"label": "変異", "text": "対合の間違いや化学的損傷が修復されずに残ると点変異になる。"}], "relatedTopics": [{"concept": "dna-structure", "relation": "構成する"}, {"concept": "central-dogma", "relation": "はたらく相手"}, {"concept": "genetic-code", "relation": "関連"}, {"concept": "pcr", "relation": "はたらく相手"}, {"concept": "crispr", "relation": "はたらく相手"}], "referencedBy": [{"id": "crispr", "title": "CRISPR-Cas9", "field": "molecular-biology"}, {"id": "dna-replication", "title": "DNA複製", "field": "molecular-biology"}, {"id": "dna-sequencing", "title": "DNAシーケンシング", "field": "molecular-biology"}, {"id": "dna-structure", "title": "DNAの二重らせん", "field": "molecular-biology"}, {"id": "pcr", "title": "PCR（ポリメラーゼ連鎖反応）", "field": "molecular-biology"}]}, {"id": "carbon-bonding", "title": "炭素と有機化合物", "aka": "Carbon & organic compounds", "field": "chemistry", "area": "有機化学", "section": "炭素の骨格", "headline": "炭素は4方向に手を出し、骨格を無限につくれる", "summary": "有機化合物は炭素を骨格にした分子の総称。炭素は共有結合の手を4本持ち、しかも炭素どうしで安定に結合できるので、鎖・枝分かれ・環・立体網など際限なく多様な骨格を作れる。既知の化合物の大半が有機物なのはこのため。生命の分子（糖・脂質・タンパク質・核酸）もすべて炭素骨格。", "easyHeadline": "炭素は手が4本あり、どこまでも骨組みを伸ばせる", "easyBody": "炭素という原子は、他の原子とつながる「手」を4本持っていて、しかも炭素どうしでも安定につながることができます。そのため鎖のように長く伸びたり、枝分かれしたり、輪になったりと、ほとんど無限のバリエーションの骨組みを作れます。私たちの体や食べ物、プラスチックなど、身の回りのものの多くはこの炭素の骨組みでできています。", "keyPoint": "『有機／無機』の境界は歴史的なもの。かつては生物しか作れないと思われたが、尿素の人工合成でこの壁が崩れた。", "figure": "carbon-shapes", "body": [{"label": "単・二重・三重結合", "text": "炭素間で電子対を1〜3組共有する。二重・三重結合は反応性が高い。"}, {"label": "炭化水素", "text": "炭素と水素だけの化合物。石油・天然ガスの主成分で、燃料と合成原料の出発点。"}], "related hysics"}, {"id": "universal-gravitation-and-orbits", "title": "万有引力と軌道", "field": "physics"}]}, {"id": "collagen", "title": "コラーゲン", "aka": "Collagen", "field": "molecular-biology", "area": "タンパク質", "section": "代表的なタンパク質", "headline": "体で最も多い、三本鎖ロープの構造材", "summary": "全タンパク質量の約3割を占める、体の建材。3本のポリペプチドが左巻きに伸び、それが右巻きに撚り合わさった三重らせん。この縄構造が引っ張りに強く、腱・骨・皮膚・軟骨・血管壁の土台になる。配列は『グリシン-X-Y』の繰り返しで、Yはしばしばヒドロキシプロリン。", "easyHeadline": "体の中でいちばん多い、丈夫な“ロープ”のタンパク質", "easyBody": "コラーゲンは体のタンパク質の中で最も量が多く、3本のひもが縄のようにより合わさった構造をしています。この丈夫な縄が、骨・皮膚・軟骨・血管などの土台となる材料になっています。", "keyPoint": "3残基ごとのグリシン（最小のアミノ酸）が必須。らせんの中心はグリシンしか入る隙間がなく、変異すると骨形成不全症（脆い骨）になる。", "body": [{"label": "ヒドロキシル化とビタミンC", "text": "プロリンの水酸化に必要な酵素がビタミンC依存。欠乏（壊血病）でコラーゲンが弱り、歯茎出血や創傷治癒不全が起きる。"}, {"label": "細胞外での成熟", "text": "前駆体プロコラーゲンとして分泌され、両端が切られて自己集合し、架橋して繊維になる。"}, {"label": "加齢と応用", "text": "架橋の蓄積で硬く・もろくなる。ゼラチンは変性させたコラーゲン。"}], "relatedTopics": [{"concept": "alpha-helix-beta-sheet", "relation": "対比"}, {"concept": "protein-folding", "relation": "関連"}, {"concept": "ptm", "relation": "はたらく相手"}, {"concept": "molecular-motor", "relation": "対比"}], "referencedBy": [{"id": "cytoskeleton", "title": "細胞骨格", "field": "molecular-biology"}, {"id": "molecular-motor", "title": "分子モーター", "field": "molecular-biology"}, {"id": "polymers", "title": "高分子（ポリマー）", "field": "chemistry"}]}, {"id": "colligative-osmosis", "title": "束一的性質と浸透圧", "aka": "Colligative properties / osmosis", "field": "chemistry", "area": "溶液と混合物", "section": "混ざりものの性質", "headline": "溶けた粒の“数”だけで決まる、水の性質の変化", "summary": "溶媒に何かを溶かすと、沸点が上がり、凝固点が下がり、蒸気圧が下がり、浸透圧が生じる。これらは溶けている粒子の『種類』ではなく『数』だけで決まる（束一的性質）。半透膜を隔てて濃さが違うと、水は薄い方から濃い方へ移動する（浸透）。それを止めるのに必要な圧力が浸透圧。", "easyHeadline": "溶けている粒の“数”だけで、水の性質が変わる", "easyBody": "水に何かを溶かすと、凍りにくくなったり沸きにくくなったりしますが、これは溶けているものの種類ではなく「数」で決まります。濃さの違う水どうしを薄い膜越しに接すると、水は薄いほうから濃いほうへ移動しようとします(浸透)。点滴の濃さを体液に合わせているのも、この性質のためです。", "keyPoint": "凍結防止剤で道路の氷を溶かす、ナメクジに塩、点滴の濃度、植物が水を吸い上げる——全部これ。細胞は浸透圧のバランスの上で生きている。", "body": [{"label": "生体", "text": "真水に置いた細胞は膨れて破裂、濃い塩水では縮む。だから点滴は体液と同じ浸透圧にする。"}, {"label": "逆浸透", "text": "圧力をかけて逆向きに水を通すと、海水から真水が取れる（淡水化）。"}], "relatedTopics": [{"concept": "dissolution", "relation": "なかま"}, {"concept": "concentration-mole", "relation": "関連"}, {"concept": "membrane-transport", "relation": "関連"}, {"concept": "cell-membrane", "relation": "はたらく相手"}], "referencedBy": [{"id": "dissolution", "title": "溶解", "field": "chemistry"}]}, {"id": "colloid-mixture", "title": "コロイドと混合物", "aka": "Colloids & mixtures", "field": "chemistry", "area": "溶液と混合物", "section": "混ざりものの性質", "headline": "溶けてはいないが沈みもしない、宙に漂う中くらいの粒", "summary": "混合物には、成分が分子レベルで均一に混ざった溶液と、目に見えて分離する不均一混合物のほかに、その中間の『コロイド』がある。1〜1000ナノメートルの粒子が分散していて、沈殿もろ過もできないが、横から光を当てると通り道が光って見える（チンダル現象）。牛乳、霧、煙、絵の具、生クリーム、血液、細胞質。", "easyHeadline": "溶けてもいないし沈みもしない、宙に漂う中くらいの粒", "easyBody": "混ざりものには、完全に溶けているものと、目に見えて分かれてしまうものの間に「コロイド」という中間の状態があります。粒が小さすぎて沈まずに漂い続けるため、牛乳や霧、血液のように濁って見えるのに分離しないものになります。", "keyPoint": "『溶けている』と『濁っている』の間に広い中間地帯がある。生き物の中身（細胞質）はほぼコロイド。", "body": [{"label": "安定化", "text": "粒子が同種の電荷をまとって反発し合うことで、くっついて沈むのを防いでいる。"}, {"label": "凝集", "text": "電荷を打ち消すと粒子が集まって沈む。豆乳ににがり（豆腐）、川の泥が河口で堆積、浄水の凝集沈殿。"}], "relatedTopics": [{"concept": "dissolution", "relation": "対比"}, {"concept": "solubility-precipitation", "relation": "関連"}, {"concept": "states-of-matter", "relation": "関連"}, {"concept": "intermolecular-forces", "relation": "関連"}], "referencedBy": []}, {"id": "combustion", "title": "燃焼", "aka": "Combustion", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "燃料と酸素が結びつく、速い酸化反応", "summary": "燃焼は、燃料（炭素や水素を含む物質）が酸素と急速に反応して、二酸化炭素と水になり、大量の熱と光を出す酸化還元反応。始めるには着火のエネルギー（活性化エネルギー）が要るが、いったん始まると自分が出す熱で連鎖的に続く。燃料・酸素・熱の3つが『燃焼の三要素』で、どれか1つを断てば消える。", "easyHeadline": "燃料と酸素が結びついて、熱と光を出す", "easyBody": "燃焼とは、燃えるもの(燃料)が空気中の酸素と勢いよく結びついて、熱と光を出しながら別の物質に変わる反応です。いったん火がつくと、その熱でさらに反応が続いていきます。燃料・酸素・熱のどれか1つを取り除けば、火は消えます。", "keyPoint": "炎は『もの』ではなく『反応が進んでいる領域』。燃料の蒸気と空気が混ざって反応している空間そのもの。", "body": [{"label": "完全燃焼と不完全燃焼", "text": "酸素が足りないと一酸化炭素やすす（炭素の粒）が残る。すすが赤熱して見えるのが黄色い炎。"}, {"label": "消火の理屈", "text": "水（冷却）、二酸化炭素・泡（酸素遮断）、粉末（連鎖反応の停止）。"}], "relatedTopics": [{"concept": "redox", "relation": "構成する"}, {"concept": "chemical-reaction", "relation": "なかま"}, {"concept": "flame-structure", "relation": "原因と結果"}, {"concept": "reaction-rate-equilibrium", "relation": "関連"}], "referencedBy": [{"id": "carbon-bonding", "title": "炭素と有機化合物", "field": "chemistry"}, {"id": "chemical-reaction", "title": "化学反応", "field": "chemistry"}, {"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "field": "chemistry"}, {"id": "flame-structure", "title": "炎の構造", "field": "chemistry"}, {"id": "reaction-rate-equilibrium", "title": "反応速度と化学平衡", "field": "chemistry"}, {"id": "redox", "title": "酸化還元反応", "field": "chemistry"}, {"id": "thermochemistry-enthalpy", "title": "反応熱とエンタルピー", "field": "chemistry"}]}, {"id": "computer-history", "title": "コンピュータの登場", "aka": "History of the computer", "field": "technology", "area": "計算とAI", "section": "情報を演算する", "year": 1945, "yearLabel": "1945年ごろ（汎用電子計算機の登場）", "headline": "弾道計算の道具が、あらゆる計算の万能機械になった", "summary": "初期のコンピュータ（1940年代のENIACなど）は、大砲の弾道表を作るための巨大な計算専用機で、真空管を1万本以上使い、部屋いっぱいの大きさだった。「プログラム内蔵方式」（計算手順そのものをデータとしてメモリに保存し、切り替えるだけで別の計算ができる）という考え方が確立したことで、専用機だったコンピュータが「何にでも使える万能な計算機」に変わった。トランジスタ、続いて集積回路の発明により小型化・高速化・低価格化が進み、1970年代にはパーソナルコンピュータとして個人の机の上に、2000年代にはスマートフォンとしてポケットに入るまでになった。", "keyPoint": "「専用の計算機」から「プログラムを変えれば何でもできる汎用機」への転換が最大の発明。", "body": [{"label": "プログラム内蔵方式", "text": "それ以前は配線を組み替えて計算内容を変えていた（配線変更に数日かかることも）。プログラムをメモリに置く方式になり、切り替えが一瞬になった。"}], "relatedTopics": [{"concept": "transistor-semiconductor", "relation": "はたらく相手"}, {"concept": "artificial-intelligence", "relation": "原因と結果"}, {"concept": "medical-imaging", "relation": "はたらく相手"}], "referencedBy": [{"id": "artificial-intelligence", "title": "人工知能（AI）", "field": "technology"}, {"id": "medical-imaging", "title": "医用画像技術", "field": "technology"}, {"id": "memory-logic-semiconductor", "title": "メモリ半導体とロジック半導体", "field": "technology"}, {"id": "transistor-semiconductor", "title": "トランジスタと半導体", "field": "technology"}, {"id": "why-programs-run", "title": "プログラムがなぜ動くのか", "field": "technology"}]}, {"id": "concentration-mole", "title": "濃度とモル", "aka": "Concentration / the mole", "field": "chemistry", "area": "溶液と混合物", "section": "溶ける", "headline": "粒の数を“ダース”のように数える単位がモル", "summary": "原子や分子は小さすぎて1個ずつ数えられないので、6.02×10²³個をひとまとめにして『1モル』と数える（アボガドロ数）。物質1モルの質量は、その原子量・分子量にグラムを付けた値。溶液の濃さは、溶質が何モル溶けているか（モル濃度）で表すのが化学の標準。", "easyHeadline": "粒の数を“ダース”のようにまとめて数える単位がモル", "easyBody": "原子や分子は小さすぎて1個ずつ数えられないので、化学ではとても大きな決まった数をひとまとめにして「1モル」と呼び、単位として使います。溶液の濃さも、このモルを使って「何モル溶けているか」で表すのが基本です。", "keyPoint": "モルは『反応式の係数どおりに物質を混ぜる』ための橋渡し。質量は測れるが、反応するのは“個数”の比だから。", "body": [{"label": "化学量論", "text": "反応式の係数＝モル比。過不足なく反応させる量や、生成物の理論量を計算できる。"}, {"label": "身近な濃度", "text": "質量パーセント、ppm、mol/L を使い分ける。"}], "relatedTopics": [{"concept": "chemical-reaction", "relation": "はたらく相手"}, {"concept": "dissolution", "relation": "関連"}, {"concept": "solubility-precipitation", "relation": "関連"}, {"concept": "atom-structure", "relation": "関連"}], "referencedBy": [{"id": "colligative-osmosis", "title": "束一的性質と浸透圧", "field": "chemistry"}, {"id": "solubility-precipitation", "title": "溶解度と沈殿", "field": "chemistry"}]}, {"id": "corrosion", "title": "腐食（さび）", "aka": "Corrosion", "field": "chemistry", "area": "電気化学", "section": "電子を流す", "headline": "金属が環境と作る“望まない電池”で溶けていく", "summary": "腐食は、金属が水や酸素と反応して酸化物などに変わり、劣化していく現象。鉄のさびが代表。実は局所的に電池ができていて、金属の一部が負極になって溶け出し、別の部分で酸素が還元される。塩分・湿気・不純物・応力があると進みやすい。世界のGDPの数%が腐食対策と損失に消えているとされる。", "easyHeadline": "金属が周りの環境と“望まない電池”を作って溶けていく", "easyBody": "金属がさびるのは、水や酸素と反応して溶け出す、一種の電池のような現象が起きているからです。鉄よりさびやすい金属をわざとくっつけておくと、そちらが身代わりになって溶け、大事な鉄を守ることができます(トタン板や船の船体など)。", "keyPoint": "『犠牲防食』——鉄より溶けやすい亜鉛やマグネシウムをくっつけておくと、そちらが身代わりに溶けて鉄を守る（トタン、船体、地下パイプライン）。", "body": [{"label": "アルミの逆説", "text": "アルミは鉄より反応性が高いのに錆びにくい。表面に緻密な酸化被膜ができて中を守るため。"}, {"label": "防食", "text": "めっき、塗装、ステンレス（クロムの酸化被膜）、犠牲陽極、環境の乾燥。"}], "relatedTopics": [{"concept": "redox", "relation": "構成する"}, {"concept": "electrochemical-cell", "relation": "なかま"}, {"concept": "electrolysis", "relation": "関連"}], "referencedBy": [{"id": "electrochemical-cell", "title": "電池（化学電池）", "field": "chemistry"}, {"id": "electrolysis", "title": "電気分解", "field": "chemistry"}]}, {"id": "crispr", "title": "CRISPR-Cas9", "aka": "CRISPR-Cas9", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "ゲノムを編集する・読む", "headline": "細菌の免疫を借りた、狙い撃ちの遺伝子ハサミ", "summary": "細菌がウイルスの配列を記憶して撃退する免疫システムを、ゲノム編集ツールに転用したもの。短い『ガイドRNA』に狙った配列を持たせると、Cas9タンパク質がその場所を探し当ててDNAを両断する。切れた場所を細胞が修復する過程で、遺伝子を壊したり書き換えたりできる。2020年ノーベル化学賞（ダウドナ、シャルパンティエ）。", "easyHeadline": "細菌の免疫を借りた、狙い撃ちの遺伝子ハサミ", "easyBody": "もともとは細菌がウイルスを撃退するための仕組みを、遺伝子を書き換える道具に応用したものです。「ここを切れ」という短い案内役に狙った場所の情報を持たせると、ハサミ役のタンパク質がその場所を見つけてDNAを切ります。案内役の文字を変えるだけで切る場所を変えられる手軽さが革命的でした。", "keyPoint": "以前の遺伝子編集はタンパク質を設計し直す必要があった。CRISPRは『ガイドRNAの20文字を変えるだけ』で標的を変えられるのが革命。", "figure": "crispr-cut", "body": [{"label": "修復経路", "text": "つなぐだけ（欠失が入りやすい＝遺伝子ノックアウト）と、鋳型を与えて正確に書き換える方法がある。"}, {"label": "医療応用", "text": "鎌状赤血球症・βサラセミアの治療薬が承認。標的外の切断（オフターゲット）の管理が課題。"}], "relatedTopics": [{"concept": "base-pairing", "relation": "はたらく相手"}, {"concept": "recombinant-dna", "relation": "なかま"}, {"concept": "gene-regulation", "relation": "はたらく相手"}, {"concept": "protein-design", "relation": "関連"}, {"concept": "hemoglobin", "relation": "関連"}], "referencedBy": [{"id": "base-pairing", "title": "塩基対と相補性", "field": "molecular-biology"}, {"id": "recombinant-dna", "title": "組換えDNA", "field": "molecular-biology"}]}, {"id": "cryo-em", "title": "クライオ電子顕微鏡", "aka": "Cryo-EM", "field": "molecular-biology", "area": "タンパク質", "section": "調べる・つくる技術", "headline": "凍らせた分子を電子で撮り、平均して立体に", "summary": "タンパク質溶液を極低温で瞬間凍結し、氷に閉じ込めた無数の分子を電子顕微鏡で撮影、向きの違う何十万枚もの像を計算機で合成して立体構造を再構成する。結晶化が要らないのが最大の利点。2010年代の検出器とソフトの進歩（分解能革命）で原子分解能に到達し、2017年ノーベル化学賞。", "easyHeadline": "分子を瞬間凍結して、電子顕微鏡でその形を撮影する技術", "easyBody": "タンパク質の溶液を一瞬で凍らせ、電子顕微鏡でたくさんの分子の写真を撮り、コンピューターで組み合わせることで立体の形を再現する方法です。結晶にしにくい大きなタンパク質でも観察できるのが強みです。", "keyPoint": "結晶にならない大きな複合体・膜タンパク質・複数状態を捉えられる。X線結晶解析の弱点をちょうど補完する。", "body": [{"label": "単粒子解析", "text": "個々の粒子像を分類・平均化。動きのある部分は複数の状態として分けて再構成できる。"}, {"label": "クライオ電子線トモグラフィー", "text": "細胞そのものを薄く切って、中のタンパク質をその場で見る。"}, {"label": "限界", "text": "小さいタンパク質（〜50 kDa以下）はコントラストが乏しく難しい。"}], "relatedTopics": [{"concept": "xray-crystallography", "relation": "対比"}, {"concept": "alphafold", "relation": "関連"}, {"concept": "membrane-transport", "relation": "技術で見る"}, {"concept": "molecular-motor", "relation": "技術で見る"}, {"concept": "amyloid", "relation": "技術で見る"}], "referencedBy": [{"id": "alphafold", "title": "AlphaFold", "field": "molecular-biology"}, {"id": "amyloid", "title": "アミロイド", "field": "molecular-biology"}, {"id": "lenses-mirrors-and-imaging", "title": "レンズ・鏡と結像", "field": "physics"}, {"id": "membrane-transport", "title": "膜輸送タンパク質", "field": "molecular-biology"}, {"id": "microscope", "title": "顕微鏡", "field": "technology"}, {"id": "xray-crystallography", "title": "X線結晶構造解析", "field": "molecular-biology"}]}, {"id": "crystals-amorphous", "title": "結晶と非晶質", "aka": "Crystalline & amorphous solids", "field": "chemistry", "area": "物質の状態", "section": "状態と変化", "headline": "並び方が整然か、バラバラのまま固まったか", "summary": "固体には、粒子が3次元的に規則正しく並んだ結晶と、液体のような乱れた配置のまま固まった非晶質（アモルファス）がある。結晶は決まった融点を持ち、割れ方に方向性がある。ガラスは代表的な非晶質で、明確な融点がなく、加熱すると徐々に軟らかくなる。", "easyHeadline": "粒がきちんと並んでいるか、バラバラのまま固まったか", "easyBody": "固体には、粒が規則正しく並んでできた「結晶」と、液体のような乱れた並びのまま固まった「非晶質(ガラスなど)」があります。結晶ははっきりした温度で溶けますが、ガラスは明確な融点がなく、温めるとだんだん柔らかくなっていきます。", "keyPoint": "結晶は結合の種類で4タイプ：イオン結晶（塩、硬くもろい）、金属結晶（電気を通す）、分子結晶（ドライアイス、低融点）、共有結合結晶（ダイヤ、極めて硬い）。", "body": [{"label": "多形", "text": "同じ物質が違う結晶構造をとる（炭素＝黒鉛とダイヤ、氷にも多くの型）。薬の効き目や溶けやすさにも影響。"}, {"label": "準結晶", "text": "規則的だが周期的でない、第3のタイプ（2011年ノーベル化学賞）。"}], "relatedTopics": [{"concept": "states-of-matter", "relation": "構成する"}, {"concept": "chemical-bond", "relation": "原因と結果"}, {"concept": "solubility-precipitation", "relation": "関連"}, {"concept": "xray-crystallography", "relation": "技術で見る"}], "referencedBy": [{"id": "solubility-precipitation", "title": "溶解度と沈殿", "field": "chemistry"}]}, {"id": "cytoskeleton", "title": "細胞骨格", "aka": "Cytoskeleton", "field": "molecular-biology", "area": "細胞のしくみ", "section": "区画としての細胞", "headline": "形を保ち、荷物を運び、細胞を動かす足場", "summary": "細胞の中に張りめぐらされたタンパク質の繊維網。アクチンフィラメント（細く、細胞の縁の運動や分裂のくびれ）、微小管（太く硬く、荷物輸送のレールと染色体の分配）、中間径フィラメント（丈夫で機械的強度）の3系統。常に組み立てと分解を繰り返し、必要な場所に素早く作り替えられる。", "easyHeadline": "形を保ち、荷物を運び、細胞を動かす骨組み", "easyBody": "細胞の中に張りめぐらされたタンパク質の繊維の網です。細胞の形を支え、中で荷物を運ぶレールになり、細胞そのものを動かす力も生みます。「骨格」といっても固定されたものではなく、数秒から数分で伸び縮みして必要な場所に作り替えられます。", "keyPoint": "『骨格』という名前だが静的ではない。数秒〜数分で伸び縮みする動的な構造で、そこにモータータンパク質が乗る。", "body": [{"label": "細胞分裂", "text": "微小管が紡錘体を作って染色体を2つの娘細胞に引き分ける。"}, {"label": "細胞移動", "text": "前縁でアクチンを重合させて膜を押し出し、免疫細胞やがんの転移に関わる。"}], "relatedTopics": [{"concept": "molecular-motor", "relation": "はたらく相手"}, {"concept": "membrane-trafficking", "relation": "はたらく相手"}, {"concept": "cell-cycle", "relation": "はたらく相手"}, {"concept": "collagen", "relation": "対比"}], "referencedBy": [{"id": "cell-cycle", "title": "細胞周期", "field": "molecular-biology"}]}, {"id": "denaturation", "title": "変性", "aka": "Denaturation", "field": "molecular-biology", "area": "タンパク質", "section": "構造", "headline": "熱・酸・洗剤で、形だけが壊れる", "summary": "立体構造がほどけて機能を失う現象。ペプチド結合（一次構造）は切れず、それを支えていた弱い相互作用（水素結合・疎水結合）が壊れる。ゆで卵、牛乳が酸で固まる、パーマ、アルコール消毒はどれも変性。多くは不可逆で、ほどけた鎖どうしが絡んで白く固まる（凝集）。", "easyHeadline": "熱や酸をかけると、タンパク質の形だけがくずれる", "easyBody": "卵を茹でると白身が固まって透明から白に変わりますが、あれがタンパク質の「変性」です。部品（アミノ酸）のつながり自体は切れていませんが、丸まっていた形がほどけてしまい、元の仕事ができなくなります。一度くずれた形は、多くの場合元に戻りません。", "keyPoint": "『一次構造は無事、高次構造だけ壊れる』——フォールディングが配列で決まることの裏返しの証拠。", "body": [{"label": "変性剤", "text": "熱、強酸・強アルカリ、尿素・グアニジン、SDS（洗剤）、有機溶媒、重金属。"}, {"label": "可逆と不可逆", "text": "小さく安定なタンパク質は条件を戻すと畳み直す（アンフィンセン）。大きいものは凝集して戻らない。"}, {"label": "応用", "text": "PCRの熱変性でDNA二本鎖を開く、調理、タンパク質電気泳動（SDS-PAGE）で鎖を一本ずつバラす。"}], "relatedTopics": [{"concept": "protein-folding", "relation": "対比"}, {"concept": "alpha-helix-beta-sheet", "relation": "関連"}, {"concept": "enzyme", "relation": "原因と結果"}], "referencedBy": [{"id": "enzyme", "title": "酵素", "field": "molecular-biology"}, {"id": "pcr", "title": "PCR（ポリメラーゼ連鎖反応）", "field": "molecular-biology"}, {"id": "phase-transition", "title": "状態変化", "field": "chemistry"}, {"id": "protein-folding", "title": "フォールディング", "field": "molecular-biology"}, {"id": "protein-structure-levels", "title": "タンパク質の四段階構造", "field": "molecular-biology"}]}, {"id": "digital-analog-difference", "title": "デジタル・アナログの違い", "aka": "Digital vs Analog", "field": "technology", "area": "計算とAI", "section": "情報を演算する", "year": 1937, "yearLabel": "1937年（デジタル論理回路の理論的基礎）", "headline": "情報を「連続の値」で扱うか、「段階の数値」で扱うか", "summary": "アナログは音の大きさや電圧のように、値がなめらかに連続して変化する量をそのまま扱う方式。デジタルはその値を細かく区切り、0と1の組み合わせ（2進数）という有限個の数値に変換して扱う方式。デジタルは変換の際に情報をわずかに削るが、コピーしても劣化せず、多少ノイズが乗っても0か1かを読み直せば元通りに復元できる。この「劣化しない」「正確に複製できる」という性質が、コンピュータ・通信・記録メディアがそろってデジタル化した最大の理由。", "keyPoint": "アナログは劣化する。デジタルは「読み直して0/1を確定させる」ことで、コピーしてもボケない。", "figure": "digital-analog", "body": [{"label": "量子化", "text": "連続した値を一定の間隔で区切り、それぞれを数値に置き換える操作。区切りが細かいほど元の値に近くなるが、完全には一致しない（量子化誤差）。"}, {"label": "なぜノイズに強いか", "text": "アナログ信号はノイズがそのまま値の一部として残ってしまう。デジタル信号は「0か1か」だけを判定すればよいので、多少ノイズが乗っても正しく読み直せる。"}, {"label": "2進数（ビット）", "text": "デジタルが0と1だけを使うのは、電気回路で「電圧が高いか低いか」の2状態だけを安定して区別しやすいから。桁（ビット数）を増やせば表せる数は指数的に増える。"}], "relatedTopics": [{"concept": "transistor-semiconductor", "relation": "はたらく相手"}, {"concept": "memory-logic-semiconductor", "relation": "なかま"}, {"concept": "why-programs-run", "relation": "なかま"}], "referencedBy": [{"id": "memory-logic-semiconductor", "title": "メモリ半導体とロジック半導体", "field": "technology"}, {"id": "why-programs-run", "title": "プログラムがなぜ動くのか", "field": "technology"}]}, {"id": "dissolution", "title": "溶解", "aka": "Dissolution / solvation", "field": "chemistry", "area": "溶液と混合物", "section": "溶ける", "headline": "極性は極性を、無極性は無極性を溶かす", "summary": "溶解は、溶質の粒子がばらけて溶媒の分子に取り囲まれる現象。水のような極性溶媒は、イオンや極性分子を水和して引き離せるが、油のような無極性分子は溶かせない。『似たものは似たものを溶かす』。溶けるかどうかは、粒子どうしの引力を切るコストと、溶媒に囲まれて得する分＋乱雑さの増加の綱引きで決まる。", "easyHeadline": "似たもの同士は溶け合い、性質が違うものは混ざらない", "easyBody": "ものが水に溶けるかどうかは、「似たものは似たものを溶かす」というルールでほぼ決まります。水はイオンや似た性質の分子を取り囲んで溶かせますが、油のような性質のものは溶かせません。砂糖や塩が水に溶けても、分子そのものが壊れているわけではなく、水の分子に取り囲まれているだけです。", "keyPoint": "砂糖が水に溶けても分子は壊れない（水和されるだけ）。塩はイオンにばらける。どちらも化学変化ではなく物理変化。", "figure": "dissolution", "body": [{"label": "水の特殊性", "text": "折れ曲がった形で強い極性を持ち、水素結合するため、非常に多くの物質を溶かす『万能溶媒』。"}, {"label": "細胞との関係", "text": "細胞膜が油の層なのは、水に溶ける物質を無差別に通さないため。"}], "relatedTopics": [{"concept": "intermolecular-forces", "relation": "原因と結果"}, {"concept": "chemical-bond", "relation": "関連"}, {"concept": "solubility-precipitation", "relation": "なかま"}, {"concept": "colligative-osmosis", "relation": "なかま"}, {"concept": "cell-membrane", "relation": "関連"}], "referencedBy": [{"id": "colligative-osmosis", "title": "束一的性質と浸透圧", "field": "chemistry"}, {"id": "colloid-mixture", "title": "コロイドと混合物", "field": "chemistry"}, {"id": "concentration-mole", "title": "濃度とモル", "field": "chemistry"}, {"id": "entropy", "title": "エントロピー", "field": "chemistry"}, {"id": "solubility-precipitation", "title": "溶解度と沈殿", "field": "chemistry"}]}, {"id": "dna-replication", "title": "DNA複製", "aka": "DNA replication", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "DNAという分子", "headline": "2本鎖をほどき、それぞれを鋳型に半分ずつ新品", "summary": "細胞分裂の前に、DNAを正確に2セットにする過程。二重らせんをほどき、開いた1本ずつを鋳型にして相補的な新しい鎖を合成する。できた2本のDNAはどちらも『古い鎖1本＋新しい鎖1本』（半保存的複製）。DNAポリメラーゼが担い、間違いは10億塩基に1回以下という正確さ。", "easyHeadline": "らせんをほどき、両側を手本に新しい鎖を作る", "easyBody": "細胞が分裂する前に、DNAをまるごと2セットに増やす作業です。二重らせんをファスナーのように開き、1本ずつを手本にして新しい相手の鎖を作ります。できあがった2本はどちらも「古い鎖1本＋新しい鎖1本」で、間違いは10億文字に1回以下という驚くべき正確さです。", "keyPoint": "ポリメラーゼは一方向にしか進めないため、片方の鎖は連続的、もう片方は細切れ（岡崎フラグメント）に作ってつなぐ。", "body": [{"label": "校正機能", "text": "DNAポリメラーゼは入れた塩基が間違っていると自分で外して入れ直す（プルーフリーディング）。"}, {"label": "複製起点", "text": "ゲノムの複数箇所から同時に始まり、双方向に進んで効率よく終わる。"}], "relatedTopics": [{"concept": "base-pairing", "relation": "はたらく相手"}, {"concept": "dna-structure", "relation": "はたらく相手"}, {"concept": "cell-cycle", "relation": "構成する"}, {"concept": "pcr", "relation": "対比"}, {"concept": "central-dogma", "relation": "関連"}], "referencedBy": [{"id": "cell-cycle", "title": "細胞周期", "field": "molecular-biology"}, {"id": "dna-structure", "title": "DNAの二重らせん", "field": "molecular-biology"}, {"id": "pcr", "title": "PCR（ポリメラーゼ連鎖反応）", "field": "molecular-biology"}]}, {"id": "dna-sequencing", "title": "DNAシーケンシング", "aka": "DNA sequencing", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "ゲノムを編集する・読む", "headline": "塩基の並びを、端から1文字ずつ読む", "summary": "DNAのA・T・G・Cの並び順を決定する技術。古典的なサンガー法は、伸長を途中で止める特殊な塩基を混ぜて長さ違いの断片を作り分けて読む。2000年代の次世代シーケンサーは、何億もの断片を同時並列に読んで劇的に高速・安価化し、ヒトゲノム解読のコストを30億ドルから数百ドルへ落とした。", "easyHeadline": "DNAの文字の並びを、端から読み取る", "easyBody": "DNAのA・T・G・Cがどんな順番で並んでいるかを読む技術です。昔は少しずつしか読めませんでしたが、今の機械は何億もの断片を一度に読むので、劇的に速く安くなりました。ヒトのゲノム全部を読むコストは30億ドルから数百ドルまで下がっています。", "keyPoint": "『読む』が安くなったことが、がんゲノム医療・進化研究・病原体の即時同定・個人ゲノムをすべて可能にした。", "body": [{"label": "ロングリード", "text": "1分子を長く（数万塩基）読む方式が普及し、繰り返し配列の多い領域も解けるように。"}, {"label": "応用", "text": "出生前検査、腸内細菌叢の解析、新型ウイルスのゲノム即時公開。"}], "relatedTopics": [{"concept": "pcr", "relation": "なかま"}, {"concept": "base-pairing", "relation": "はたらく相手"}, {"concept": "dna-structure", "relation": "技術で見る"}, {"concept": "genetic-code", "relation": "関連"}, {"concept": "alphafold", "relation": "関連"}], "referencedBy": [{"id": "pcr", "title": "PCR（ポリメラーゼ連鎖反応）", "field": "molecular-biology"}, {"id": "technology-enables-science", "title": "技術が科学を進める", "field": "technology"}]}, {"id": "dna-structure", "title": "DNAの二重らせん", "aka": "DNA double helix", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "DNAという分子", "headline": "相補的な2本鎖が、情報と複製の両方を担う", "summary": "DNAは2本の鎖がねじれて絡んだ二重らせん。外側は糖とリン酸の骨格、内側で塩基が対になって結ぶ。1953年にワトソンとクリックが（フランクリンのX線データを手がかりに）構造を提案した。2本が相補的だから、片方があればもう片方を復元できる——これが遺伝情報のコピーの仕組みそのもの。", "easyHeadline": "2本の鎖がねじれ合った「生命の設計図」", "easyBody": "DNAは2本のひもがらせん状にねじれ合った形をしています。2本はぴったり対になっているので、片方さえあればもう片方を作り直せます。この「対になっている」性質こそが、細胞が設計図をコピーして子孫に受け継いでいける秘密です。", "keyPoint": "『構造を見た瞬間に複製の仕組みが分かった』まれな例。形が機能を語る、というタンパク質と同じ話。", "figure": "dna-helix", "body": [{"label": "骨格と塩基", "text": "外側の糖-リン酸骨格は共有結合で丈夫、内側の塩基対は水素結合で必要なときにほどける。"}, {"label": "向き", "text": "2本の鎖は逆向き（逆平行）に走る。複製や転写の酵素はこの向きを利用する。"}], "relatedTopics": [{"concept": "base-pairing", "relation": "構成する"}, {"concept": "dna-replication", "relation": "原因と結果"}, {"concept": "central-dogma", "relation": "関連"}, {"concept": "intermolecular-forces", "relation": "関連"}, {"concept": "alpha-helix-beta-sheet", "relation": "対比"}], "referencedBy": [{"id": "base-pairing", "title": "塩基対と相補性", "field": "molecular-biology"}, {"id": "central-dogma", "title": "セントラルドグマ", "field": "molecular-biology"}, {"id": "chromosome-chromatin", "title": "染色体とクロマチン", "field": "molecular-biology"}, {"id": "dna-replication", "title": "DNA複製", "field": "molecular-biology"}, {"id": "dna-sequencing", "title": "DNAシーケンシング", "field": "molecular-biology"}, {"id": "epigenetics", "title": "エピジェネティクス", "field": "molecular-biology"}]}, {"id": "electric-generator-grid", "title": "発電と電力網", "aka": "Electric generator & power grid", "field": "technology", "area": "動力と産業革命", "section": "エネルギーを操る", "year": 1882, "yearLabel": "1882年（世界初の発電所・送電網）", "headline": "「電磁誘導」という現象が、家庭や工場を動かす電力に変わった", "summary": "1831年、ファラデーは磁石をコイルの中で動かすと電流が流れる現象（電磁誘導）を発見した。これは当初「面白い実験結果」に過ぎなかったが、40年ほどかけて実用発電機に発展し、蒸気機関やタービンで磁石（または電磁石）を回し続けて電流を作り出す仕組みとして工業化された。さらに交流を使えば変圧器で電圧を上げ下げでき、発電所から遠く離れた家庭まで電気を送れる（送電ロスを減らせる）ことが分かり、電力網が都市規模・国家規模に広がった。電気そのものは科学の発見だが、「発電し、送り、使う」という一連のインフラは工学・産業・都市計画にまたがる巨大な技術システムへと育った。", "keyPoint": "発見（電磁誘導）から実用化（家庭に電気が届く）まで約半世紀かかった。", "body": [{"label": "交流が勝った理由", "text": "直流は電圧を変えにくく遠距離送電で損失が大きい。交流は変圧器で電圧を上げて送り、使う場所で下げられるため、長距離送電に向いていた（直流・交流戦争）。"}], "relatedTopics": [{"concept": "industrial-revolution", "relation": "なかま"}, {"concept": "electrochemical-cell", "relation": "対比"}, {"concept": "transistor-semiconductor", "relation": "関連"}], "referencedBy": [{"id": "industrial-revolution", "title": "産業革命", "field": "technology"}, {"id": "telegraph-telephone", "title": "電信と電話", "field": "technology"}]}, {"id": "electrochemical-cell", "title": "電池（化学電池）", "aka": "Galvanic / voltaic cell", "field": "chemistry", "area": "電気化学", "section": "電子を流す", "headline": "酸化と還元を離して置き、電子を導線に通す", "summary": "酸化還元反応では電子が移動する。反応する2つの物質を直接混ぜず、空間的に分けて置き、電子の受け渡しを外の導線経由で行わせると、その電子の流れが電流になる——これが化学電池。電子を出す電極が負極、受け取る電極が正極。両者のイオンのやり取りは塩橋や隔膜が担う。", "easyHeadline": "電子のやりとりを離れた場所で行わせて電気を取り出す", "easyBody": "電池は、電子を渡す反応と受け取る反応をあえて別の場所に離しておき、その間を導線でつないで電子を流すことで電気を取り出す仕組みです。乾電池もリチウムイオン電池も、この基本の考え方は同じで、使っている物質が違うだけです。", "keyPoint": "乾電池・鉛蓄電池・リチウムイオン電池・燃料電池、すべて『酸化還元を空間的に分ける』という同じ原理。違うのは使う物質だけ。", "figure": "galvanic-cell", "body": [{"label": "起電力", "text": "2つの電極の『電子の欲しがり方』の差が電圧になる。差が大きい組み合わせほど高電圧。"}, {"label": "充電池", "text": "外から逆向きに電流を流して反応を巻き戻せるものが二次電池（充電できる電池）。"}], "relatedTopics": [{"concept": "redox", "relation": "構成する"}, {"concept": "electrolysis", "relation": "対比"}, {"concept": "corrosion", "relation": "なかま"}, {"concept": "mitochondria-atp", "relation": "関連"}], "referencedBy": [{"id": "corrosion", "title": "腐食（さび）", "field": "chemistry"}, {"id": "electric-generator-grid", "title": "発電と電力網", "field": "technology"}, {"id": "electrolysis", "title": "電気分解", "field": "chemistry"}]}, {"id": "electrolysis", "title": "電気分解", "aka": "Electrolysis", "field": "chemistry", "area": "電気化学", "section": "電子を流す", "headline": "電気を注ぎ込んで、進まない反応を無理やり進める", "summary": "電池が『反応で電気を作る』のに対し、電気分解は『電気で反応を起こす』逆向きの操作。外部電源で電流を流し込み、自発的には進まない酸化還元を強制する。水を水素と酸素に分ける、食塩水から塩素と水酸化ナトリウムを作る、アルミニウムを鉱石から取り出す、金属のめっき——工業化学の背骨。", "easyHeadline": "電気の力で、自然には起きない反応を無理やり起こす", "easyBody": "電池が「反応から電気を作る」のに対し、電気分解は「電気を使って反応を起こす」逆向きの仕組みです。外から電気を流し込むことで、放っておいては進まない反応を無理やり進めることができ、水から水素や酸素を取り出したり、金属をめっきしたりするのに使われます。", "keyPoint": "アルミが『電気の缶詰』と呼ばれるのは、精錬に大量の電気を食うから。リサイクルだと必要エネルギーは約1/30。", "body": [{"label": "ファラデーの法則", "text": "流した電気量に比例した物質量が電極で反応する。"}, {"label": "水素社会", "text": "再生可能エネルギーの電気で水を電気分解し、水素を貯める構想の中心技術。"}], "relatedTopics": [{"concept": "electrochemical-cell", "relation": "対比"}, {"concept": "redox", "relation": "構成する"}, {"concept": "corrosion", "relation": "関連"}], "referencedBy": [{"id": "corrosion", "title": "腐食（さび）", "field": "chemistry"}, {"id": "electrochemical-cell", "title": "電池（化学電池）", "field": "chemistry"}]}, {"id": "electromagnetic-spectrum", "title": "電磁波スペクトル", "field": "physics", "area": "波・光・音", "section": "光", "headline": "電波もX線も可視光もすべて同じ波の仲間", "summary": "電場と磁場が互いに生み出し合いながら空間を伝わる波を電磁波といい、光（可視光）はその一種にすぎない。波長の違いによって電波・マイクロ波・赤外線・可視光・紫外線・X線・γ線と呼び分けられるが、物理的な正体（電磁波であること）と真空中の速さ（光速）はすべて共通している。", "easyHeadline": "電波もX線も可視光も、すべて同じ波の仲間", "easyBody": "私たちが目で見る光(可視光)は、電波やX線と同じ「電磁波」という仲間の一員で、波の長さが違うだけです。波が短いものほどエネルギーが強く、X線やガンマ線は体を透過したり細胞を傷つけたりする力を持っています。", "keyPoint": "波長が短いほどエネルギーが高い——だからX線やγ線は物質を透過したり細胞を傷つけたりする力を持つ。", "figure": "em-spectrum", "body": [{"label": "電磁波とは何か", "text": "変化する電場が周りに変化する磁場を作り、その変化する磁場がまた電場を作る……というふうに、電場と磁場が互いに支え合いながら空間を伝わっていく波。マクスウェルの方程式から理論的に予言され、真空中でも伝わる横波。"}, {"label": "波長で並べたスペクトル", "text": "波長が長い方から、電波（通信・放送）、マイクロ波（電子レンジ・無線LAN）、赤外線（熱として感じる）、可視光（目に見える虹の色）、紫外線（日焼け・殺菌）、X線（レントゲン）、γ線（原子核から出る）の順に並ぶ。境界は厳密ではなく連続的。"}, {"label": "波長とエネルギーの関係", "text": "電磁波1個（光子）が運ぶエネルギーは波長に反比例する（波長が短いほど高エネルギー）。だから同じ電磁波でも赤外線は暖かく感じる程度だが、紫外線は日焼けを起こし、X線・γ線は細胞のDNAを傷つけるほどの力を持つ。"}], "relatedTopics": [{"concept": "wave-basics-wavelength-period-speed", "relation": "構成する"}, {"concept": "wave-particle-duality-of-light", "relation": "関連"}, {"concept": "xray-crystallography", "relation": "技術で見る", "note": "X線という短波長の電磁波を使って分子の構造を調べる"}], "referencedBy": [{"id": "medical-imaging", "title": "医用画像技術", "field": "technology"}, {"id": "radio-wave-modulation", "title": "電波に情報がのる仕組み", "field": "technology"}, {"id": "wave-basics-wavelength-period-speed", "title": "波の基本（波長・周期・速さ）", "field": "physics"}, {"id": "wave-particle-duality-of-light", "title": "光は波か粒子か", "field": "physics"}]}, {"id": "energy-conservation-law", "title": "エネルギー保存則", "aka": "Law of conservation of energy", "field": "physics", "area": "エネルギーと熱", "section": "エネルギーの基本", "headline": "孤立系の中でエネルギーの総量は変わらない", "summary": "あらゆる物理法則の中でも特に揺るぎないのがエネルギー保存則――孤立した系（外部とエネルギーのやり取りがない系）では、エネルギーの総量は形を変えても増減しない、という原則。永久機関（エネルギーを生み出し続ける装置）が原理的に作れないのはこの法則のため。20世紀にはネーターの定理により、この法則が「時間が経っても物理法則が変わらない」という対称性と表裏一体であることが示された。", "easyHeadline": "エネルギーは形を変えても、合計は減りも増えもしない", "easyBody": "外から何も足したり引いたりしていない状態では、エネルギーの合計は絶対に変わりません。エネルギーを無から作り出す「永久機関」が絶対に作れないのは、この決まりのためです。何かがおかしく見えるときは、たいてい見えないところに摩擦熱などの隠れた出入り口があります。", "keyPoint": "「エネルギー保存則が破れて見える」現象があれば、たいてい見えないところにエネルギーの出入り口（摩擦熱・放射など）が隠れている。", "body": [{"label": "永久機関がなぜ不可能か", "text": "外部からエネルギーを一切もらわずに仕事をし続ける装置は、エネルギーを無から生み出すことになり法則違反。"}, {"label": "対称性との関係", "text": "「今日の物理法則は明日も同じ」という時間並進対称性から、数学的にエネルギー保存則が導かれる（ネーターの定理）。"}], "relatedTopics": [{"concept": "forms-of-energy-and-conversion", "relation": "なかま"}, {"concept": "thermodynamics-first-law", "relation": "構成する"}, {"concept": "thermochemistry-enthalpy", "relation": "関連"}], "referencedBy": [{"id": "entropy-and-irreversibility", "title": "エントロピーと不可逆性", "field": "physics"}, {"id": "forms-of-energy-and-conversion", "title": "エネルギーの形と変換", "field": "physics"}, {"id": "thermodynamics-first-law", "title": "熱力学第一法則", "field": "physics"}]}, {"id": "entropy-and-irreversibility", "title": "エントロピーと不可逆性", "aka": "Entropy and the arrow of time", "field": "physics", "area": "エネルギーと熱", "section": "熱力学", "headline": "『時間の向き』を決めているのはエントロピー増大則", "summary": "孤立した系のエントロピー（取りうる状態の数の多さ）は自然には減ることがなく、増えるか変わらないかのどちらかしかない――これが熱力学第二法則。割れたコップが自然に元に戻らない、混ざった煙が自然には分離しない、といった「時間には向きがある」という日常感覚の物理的な正体はこれだと考えられている。化学反応が自発的に進むかどうかを決めるエントロピー（化学のギブズ自由エネルギーの一部）も、根はこの同じ原理。", "easyHeadline": "時間が一方向にしか進まないように感じる理由", "easyBody": "割れたコップがひとりでに元に戻ったり、混ざった煙がひとりでに分かれたりしないのは、「散らばった状態」の方が「そろった状態」よりも圧倒的に起こりやすいからです。この「放っておくと乱雑さが増える一方」という性質が、私たちが感じる「時間は一方向にしか進まない」という感覚の正体だと考えられています。", "keyPoint": "ミクロな1つ1つの物理法則（ニュートンの法則など）には時間の向きの区別がないのに、無数の粒子が集まった結果として『時間の矢』が現れる――統計力学の驚くべき帰結。", "figure": "entropy-arrow", "body": [{"label": "統計的な意味", "text": "「散らばった状態」の方が「そろった状態」より圧倒的に実現の仕方（場合の数）が多いから、ひとりでにそちらへ向かう。"}, {"label": "生命とエントロピー", "text": "生物は体内の秩序を保つが、そのぶん周囲によりたくさんの熱・乱雑さを捨てている。全体では必ず増えている。"}], "relatedTopics": [{"concept": "thermal-engines-and-second-law", "relation": "構成する"}, {"concept": "energy-conservation-law", "relation": "対比"}, {"concept": "entropy", "relation": "なかま"}, {"concept": "newtons-laws-of-motion", "relation": "対比"}], "referencedBy": [{"id": "thermal-engines-and-second-law", "title": "熱機関と効率・第二法則", "field": "physics"}]}, {"id": "entropy", "title": "エントロピー", "aka": "Entropy", "field": "chemistry", "area": "エネルギーと自発性", "section": "進む向き", "headline": "放っておくと、ものは散らばる方向に進む", "summary": "エントロピーは『取りうる状態の数の多さ＝乱雑さ』の尺度。孤立した系では、エントロピーが増える方向にしか自発的に変化しない（熱力学第二法則）。インクが水に広がる、熱が高温から低温へ流れる、部屋が散らかる——どれも『散らばった状態の方が圧倒的に場合の数が多い』から。時間の向きを決めているのはこの法則だとも言われる。", "easyHeadline": "放っておくと、ものは散らばる方向に進んでいく", "easyBody": "エントロピーは「ものの散らばり具合・乱雑さ」を表す量で、周りから何もされなければ、物事は自然と散らばる方向にしか進みません。インクが水の中に広がっていくのも、部屋が自然と散らかっていくのも、散らばった状態のほうが圧倒的に起こりやすいからです。", "keyPoint": "生き物は体内のエントロピーを下げているように見えるが、そのぶん周囲によりたくさんの熱と乱雑さを吐き出している。全体では必ず増える。", "body": [{"label": "ミクロな意味", "text": "分子の並べ方・エネルギーの配り方の数。多いほどエントロピーが高い。"}, {"label": "溶解や気化", "text": "固体→液体→気体でエントロピーは増える。だから加熱で状態が変わる。"}], "relatedTopics": [{"concept": "gibbs-free-energy", "relation": "構成する"}, {"concept": "phase-transition", "relation": "関連"}, {"concept": "thermochemistry-enthalpy", "relation": "なかま"}, {"concept": "dissolution", "relation": "関連"}], "referencedBy": [{"id": "entropy-and-irreversibility", "title": "エントロピーと不可逆性", "field": "physics"}, {"id": "gas-laws", "title": "気体の法則", "field": "chemistry"}, {"id": "gibbs-free-energy", "title": "ギブズ自由エネルギー", "field": "chemistry"}, {"id": "thermochemistry-enthalpy", "title": "反応熱とエンタルピー", "field": "chemistry"}]}, {"id": "enzyme", "title": "酵素", "aka": "Enzyme", "field": "molecular-biology", "area": "タンパク質", "section": "機能", "headline": "反応の山を低くする、生体触媒", "summary": "化学反応を速める（自身は変化しない）タンパク質。基質がぴったりはまる『活性部位』で、反応が通る峠＝活性化エネルギーを下げ、反応速度を百万〜十億倍にする。体温・中性という穏やかな条件で、細胞の全代謝を秒単位で回している。", "easyHeadline": "化学反応を、ものすごく速くする体内の“触媒”", "easyBody": "体の中の化学反応は、放っておくと信じられないほど遅い、または起こりにくいものがほとんどです。酵素はその反応が起きやすくなるように手助けする係で、自分自身は変化せず何度でも使えます。おかげで体温くらいの穏やかな条件でも、必要な反応が一瞬で進みます。", "keyPoint": "酵素は平衡の位置を動かさない——速くするだけ。どちら向きの反応を速めるかは基質の濃度で決まる。", "figure": "enzyme-energy", "body": [{"label": "鍵と鍵穴／誘導適合", "text": "基質が結合すると活性部位の形が少し変わって包み込む（誘導適合モデル）。"}, {"label": "補因子", "text": "金属イオンやビタミン由来の補酵素（NAD⁺, FAD, CoAなど）を必要とする酵素が多い。"}, {"label": "調節", "text": "阻害剤（薬の多くはこれ）、アロステリック調節、リン酸化などの翻訳後修飾でオン/オフされる。"}], "relatedTopics": [{"concept": "protein-folding", "relation": "関連"}, {"concept": "amino-acids", "relation": "構成する"}, {"concept": "molecular-motor", "relation": "なかま"}, {"concept": "receptor-signaling", "relation": "はたらく相手"}, {"concept": "denaturation", "relation": "原因と結果"}, {"concept": "ubiquitin-proteasome", "relation": "なかま"}], "referencedBy": [{"id": "activation-vs-thermodynamics", "title": "速さと向きは別物", "field": "chemistry"}, {"id": "catalysis", "title": "触媒", "field": "chemistry"}, {"id": "chemical-reaction", "title": "化学反応", "field": "chemistry"}, {"id": "denaturation", "title": "変性", "field": "molecular-biology"}, {"id": "metabolism", "title": "代謝", "field": "molecular-biology"}, {"id": "molecular-motor", "title": "分子モーター", "field": "molecular-biology"}, {"id": "protein-design", "title": "タンパク質デザイン", "field": "molecular-biology"}, {"id": "ptm", "title": "翻訳後修飾", "field": "molecular-biology"}, {"id": "reaction-rate-equilibrium", "title": "反応速度と化学平衡", "field": "chemistry"}, {"id": "receptor-signaling", "title": "受容体とシグナル伝達", "field": "molecular-biology"}, {"id": "redox", "title": "酸化還元反応", "field": "chemistry"}, {"id": "ubiquitin-proteasome", "title": "ユビキチン・プロテアソーム系", "field": "molecular-biology"}]}, {"id": "epigenetics", "title": "エピジェネティクス", "aka": "Epigenetics", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "情報を読み出す", "headline": "配列を変えずに、遺伝子のオン/オフを記憶する", "summary": "DNAの塩基配列そのものは変えずに、遺伝子の使われ方を変え、しかも細胞分裂を越えて受け継ぐ仕組み。DNAへのメチル基付加や、ヒストンの化学修飾で、クロマチンの巻きのきつさ＝遺伝子の読みやすさが変わる。食事・ストレス・喫煙などの環境が影響し、一部は世代を越えることもあるとされる。", "easyHeadline": "文字は変えず、遺伝子の使い方だけを覚えておく仕組み", "easyBody": "DNAの文字並びそのものは書き換えずに、「この遺伝子は使う／使わない」という設定を細胞が記憶し、分裂しても引き継ぐ仕組みです。DNAやその巻き取り役に小さな目印を付けることで、遺伝子の読みやすさを変えます。食事・ストレス・喫煙などの生活環境もこの目印に影響します。", "keyPoint": "一卵性双生児が年齢とともに違ってくる、同じゲノムの細胞が別々の運命を保つ——その『記憶』を担うのがこの層。", "body": [{"label": "DNAメチル化", "text": "プロモーターがメチル化されると多くの場合その遺伝子は沈黙する。"}, {"label": "がんとの関係", "text": "本来オフの遺伝子がオンに、オンの抑制遺伝子がオフに、という誤ったエピジェネティクスが発がんに関わる。"}], "relatedTopics": [{"concept": "chromosome-chromatin", "relation": "はたらく相手"}, {"concept": "gene-regulation", "relation": "なかま"}, {"concept": "ptm", "relation": "なかま"}, {"concept": "dna-structure", "relation": "関連"}], "referencedBy": [{"id": "chromosome-chromatin", "title": "染色体とクロマチン", "field": "molecular-biology"}, {"id": "gene-regulation", "title": "遺伝子発現の調節", "field": "molecular-biology"}]}, {"id": "flame-color", "title": "炎色反応", "aka": "Flame test / flame emission", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "金属ごとに決まった色で光る、原子の指紋", "summary": "炎に金属や金属塩を入れると、元素ごとに決まった色がつく。ナトリウムは黄、カリウムは紫、銅は青緑、リチウム・ストロンチウムは赤、バリウムは黄緑。炎の熱で金属原子の電子がいったん高いエネルギー状態に飛び上がり、元に戻るときに差額のエネルギーを特定の波長の光として放つため。花火の色はこの原理。", "easyHeadline": "金属ごとに決まった色で光る、原子の“指紋”", "easyBody": "炎の中に金属を入れると、金属の種類によって決まった色に光ります。ナトリウムは黄色、銅は青緑色というように、色は元素ごとに固有で変わりません。花火のさまざまな色は、この仕組みを利用してつけられています。", "keyPoint": "色（光の波長）は原子のエネルギー準位の差で決まり、元素ごとに固有。これを使えば遠くの星の成分もわかる（分光分析）。", "body": [{"label": "スペクトル", "text": "炎の光をプリズムで分けると、連続ではなく元素固有の輝線（決まった位置の細い線）になる。"}, {"label": "発見の歴史", "text": "この輝線からルビジウム・セシウム・ヘリウムなどが見つかった（ヘリウムは太陽の光から先に発見）。"}], "relatedTopics": [{"concept": "flame-structure", "relation": "なかま"}, {"concept": "atom-structure", "relation": "原因と結果"}, {"concept": "flame-glow-plasma", "relation": "対比"}, {"concept": "gfp", "relation": "対比"}], "referencedBy": [{"id": "atom-structure", "title": "原子の構造", "field": "chemistry"}, {"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "field": "chemistry"}, {"id": "flame-structure", "title": "炎の構造", "field": "chemistry"}]}, {"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "aka": "Flame luminosity & plasma", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "炎が光る理由は2つ、そして少しだけプラズマ", "summary": "炎の光には2種類の起源がある。黄色い炎は、すすの微粒子が高温で赤熱して出す光（熱放射・黒体放射）で、鉄が赤熱するのと同じ原理。青い炎は、燃焼中の分子の断片（C₂・CHなど）が化学反応のエネルギーで直接光る『化学発光』。さらに十分高温の炎では気体の一部の電子がはがれてイオンになっており、弱いながらプラズマ（第四の状態）でもある。", "easyHeadline": "炎が光るのには理由が2つあり、ほんの少しだけプラズマ", "easyBody": "ろうそくの黄色い炎は、すすの粒が熱で真っ赤に光っている光です。一方、青い炎は反応そのものが直接光を出しています。さらに炎の中ではごくわずかに気体が電気を帯びた状態(プラズマ)にもなっていますが、その割合はとても小さいものです。", "keyPoint": "だから『炎はプラズマか？』の答えは“ほんの少しだけ”。ろうそくの炎の電離度はごくわずかで、大部分はただの熱い気体。", "body": [{"label": "黒体放射", "text": "熱い物体はすべて温度で決まる色の光を出す。500℃で鈍い赤、1500℃で黄白、太陽表面5500℃で白。"}, {"label": "炎が電気を通す", "text": "電離しているので、炎に電圧をかけると弱い電流が流れ、電場で炎が曲がる。"}], "relatedTopics": [{"concept": "flame-structure", "relation": "関連"}, {"concept": "states-of-matter", "relation": "なかま"}, {"concept": "flame-color", "relation": "対比"}, {"concept": "combustion", "relation": "原因と結果"}], "referencedBy": [{"id": "flame-color", "title": "炎色反応", "field": "chemistry"}, {"id": "flame-structure", "title": "炎の構造", "field": "chemistry"}, {"id": "states-of-matter", "title": "物質の三態", "field": "chemistry"}]}, {"id": "flame-structure", "title": "炎の構造", "aka": "Flame structure", "field": "chemistry", "area": "炎とはなにか", "section": "炎とはなにか", "headline": "ろうそくの炎は、3つの層でできている", "summary": "ろうそくの炎をよく見ると層がある。中心の暗い『炎心』は溶けた蝋が気化しただけでまだ燃えていない部分。その外側の明るい『内炎』は酸素不足で、炭素の粒（すす）が高温で赤熱し黄色く光る。いちばん外の見えにくい『外炎』は酸素が十分でもっとも高温（約1400℃）、完全燃焼している。", "easyHeadline": "ろうそくの炎は、3つの層でできている", "easyBody": "ろうそくの炎をよく見ると、真ん中の暗い部分・その外側の明るく黄色い部分・いちばん外側の見えにくい部分の3つの層に分かれています。実はいちばん外側の見えにくい部分がいちばん高温で、しっかり燃えている場所です。明るく見える部分が必ずしも一番熱いわけではありません。", "keyPoint": "いちばん熱いのは色が薄くて目立たない外炎。加熱にはここを使う。『明るい＝熱い』ではない。", "figure": "flame-zones", "body": [{"label": "上に伸びる理由", "text": "燃えて熱くなった気体は軽くなって上昇し、下から新しい空気を吸い込む（対流）。無重力では炎は球形になる。"}, {"label": "ガスコンロの青い炎", "text": "燃料と空気をあらかじめよく混ぜてあるので、すすができず完全燃焼して青く見える。"}], "relatedTopics": [{"concept": "combustion", "relation": "原因と結果"}, {"concept": "flame-color", "relation": "なかま"}, {"concept": "flame-glow-plasma", "relation": "関連"}, {"concept": "states-of-matter", "relation": "関連"}], "referencedBy": [{"id": "combustion", "title": "燃焼", "field": "chemistry"}, {"id": "flame-color", "title": "炎色反応", "field": "chemistry"}, {"id": "flame-glow-plasma", "title": "炎の光とプラズマ", "field": "chemistry"}]}, {"id": "forms-of-energy-and-conversion", "title": "エネルギーの形と変換", "aka": "Forms of energy and energy conversion", "field": "physics", "area": "エネルギーと熱", "section": "エネルギーの基本", "headline": "エネルギーは姿を変えながら移動する", "summary": "運動エネルギー・位置エネルギー・熱エネルギー・化学エネルギー・電気エネルギーなど、エネルギーにはさまざまな「姿」があるが、実体は同じ量で、ある形から別の形へ変換されるだけ。ジェットコースターは位置エネルギーと運動エネルギーを行き来し、電池は化学エネルギーを電気エネルギーに変える。「エネルギーを作る」「使い切る」という日常表現は便宜的なもので、物理的には常に総量が保たれたまま形が変わっているだけ。", "easyHeadline": "エネルギーは姿を変えながら移動しているだけ", "easyBody": "運動のエネルギー、高さのエネルギー、熱、電気――これらは姿が違うだけで、実は同じ「エネルギー」というものが形を変えながら移動しているにすぎません。ジェットコースターが高い所から下りるとき、高さのエネルギーが動きのエネルギーに変わっているのもこの一例です。", "keyPoint": "「エネルギーを消費する」とは、便利な形（電気・運動）から使いにくい形（主に熱）へ変換すること。総量そのものは減らない。", "body": [{"label": "変換にはロスがつきもの", "text": "摩擦や電気抵抗などで一部は必ず熱として逃げる。100%の変換効率はまず実現しない。"}, {"label": "共通するのは『仕事をする能力』", "text": "どんな姿のエネルギーでも、共通するのは「他に対して仕事ができる能力」という点。"}], "relatedTopics": [{"concept": "energy-conservation-law", "relation": "なかま"}, {"concept": "work-and-kinetic-energy", "relation": "構成する"}, {"concept": "mitochondria-atp", "relation": "関連"}], "referencedBy": [{"id": "energy-conservation-law", "title": "エネルギー保存則", "field": "physics"}]}, {"id": "functional-groups", "title": "官能基", "aka": "Functional groups", "field": "chemistry", "area": "有機化学", "section": "炭素の骨格", "headline": "分子の性質は、骨格ではなく“付属パーツ”で決まる", "summary": "官能基は、有機分子について反応性や性質を決める特定の原子団。ヒドロキシ基（−OH、アルコール）、カルボニル基（C=O）、カルボキシ基（−COOH、酸）、アミノ基（−NH₂、塩基）など。同じ炭素骨格でも付いている官能基が違えば、においも溶けやすさも反応も別物になる。", "easyHeadline": "分子の性質は、骨組みではなく“付属パーツ”で決まる", "easyBody": "有機分子の性質や反応のしやすさは、炭素の骨組みそのものよりも、そこにくっついている小さな部品(官能基)によって決まります。同じ形の骨組みでも、くっついている部品が違うだけで、においも溶けやすさも別物になります。", "keyPoint": "有機化学は『骨格＋官能基』の組み合わせ論。教科書が官能基ごとに章立てされているのはそのため。", "body": [{"label": "反応の場", "text": "反応は多くの場合、骨格ではなく官能基のところで起きる。"}, {"label": "生体分子", "text": "アミノ酸はアミノ基とカルボキシ基を併せ持つ。糖はヒドロキシ基とカルボニル基の塊。"}], "relatedTopics": [{"concept": "carbon-bonding", "relation": "構成する"}, {"concept": "isomerism", "relation": "関連"}, {"concept": "acid-base", "relation": "はたらく相手"}, {"concept": "amino-acids", "relation": "関連"}, {"concept": "ptm", "relation": "対比"}], "referencedBy": [{"id": "carbon-bonding", "title": "炭素と有機化合物", "field": "chemistry"}, {"id": "chirality", "title": "キラリティ（鏡像異性）", "field": "chemistry"}, {"id": "isomerism", "title": "異性体", "field": "chemistry"}]}, {"id": "gas-laws", "title": "気体の法則", "aka": "Gas laws / kinetic theory", "field": "chemistry", "area": "物質の状態", "section": "状態と変化", "headline": "圧力・体積・温度・分子数は、1本の式で結びつく", "summary": "気体は、圧力を上げると縮み（ボイルの法則）、温度を上げると膨らむ（シャルルの法則）。これらをまとめると、理想気体の状態方程式 PV = nRT になる。気体分子はほとんどの時間を何もない空間で過ごし、たまに壁や互いにぶつかるだけ——という分子運動論のモデルで、圧力も温度もうまく説明できる。", "easyHeadline": "圧力・体積・温度・粒の数は1つの式でつながっている", "easyBody": "気体を押しつぶすと体積が減り、温めると膨らみます。これらの関係をまとめると、圧力・体積・温度・気体の粒の数が1つの式で結びつくことがわかります。温度が高いということは、それだけ気体の粒が激しく動き回っているということです。", "keyPoint": "温度とは『分子の運動エネルギーの平均』。同じ温度なら、軽い分子ほど速く飛んでいる（だから水素は宇宙へ逃げ、重い気体は地表に残る）。", "figure": "gas-laws", "body": [{"label": "理想と現実", "text": "高圧・低温では分子の大きさや引力が効いて式からずれる（実在気体）。"}, {"label": "応用", "text": "気球、内燃機関、スプレー缶、潜水の減圧症、天気（気圧と気温）。"}], "relatedTopics": [{"concept": "states-of-matter", "relation": "構成する"}, {"concept": "phase-transition", "relation": "関連"}, {"concept": "intermolecular-forces", "relation": "対比"}, {"concept": "entropy", "relation": "関連"}], "referencedBy": []}, {"id": "gene-regulation", "title": "遺伝子発現の調節", "aka": "Gene regulation", "field": "molecular-biology", "area": "遺伝子とゲノム", "section": "情報を読み出す", "headline": "全細胞が同じゲノム、違うのはどれをオンにするか", "summary": "体のどの細胞も同じDNAを持つのに、神経細胞と肝細胞がまるで違うのは、発現する遺伝子の組み合わせが違うから。転写因子というタンパク質がプロモーターやエンハンサーというDNA配列に結合して、近くの遺伝子の転写を強めたり抑えたりする。外界の刺激・発生段階・体内時計などがこのスイッチを動かす。", "easyHeadline": "同じ設計図でも、どこをオンにするかで別の細胞になる", "easyBody": "体のどの細胞も同じDNAを持っているのに、神経細胞と肝臓の細胞がまるで違うのは、使っている遺伝子の組み合わせが違うからです。特定のタンパク質がDNAの決まった場所にくっついて、近くの遺伝子のスイッチを入れたり切ったりします。体が作られていく過程は、このスイッチのパターンが少しずつ切り替わっていくことそのものです。", "keyPoint": "発生とは『遺伝子スイッチのパターンが時間・場所ごとに切り替わっていく過程』。iPS細胞は数個の転写因子を強制発現して細胞の運命を巻き戻す。", "body": [{"label": "調節の階層", "text": "転写 → RNA加工 → 翻訳 → タンパク質の修飾・分解、と各段階で調節できる。"}, {"label": "ネットワーク", "text": "転写因子が別の転写因子を制御し合い、安定した細胞状態をつくる。"}], "relatedTopics": [{"concept": "transcription", "relation": "はたらく相手"}, {"concept": "epigenetics", "relation": "なかま"}, {"concept": "chromosome-chromatin", "relation": "関連"}, {"concept": "receptor-signaling", "relation": "原因と結果"}, {"concept": "ptm", "relation": "なかま"}], "referencedBy": [{"id": "chromosome-chromatin", "title": "染色体とクロマチン", "field": "molecular-biology"}, {"id": "crispr", "title": "CRISPR-Cas9", "field": "molecular-biology"}, {"id": "epigenetics", "title": "エピジェネティクス", "field": "molecular-biology"}, {"id": "transcription", "title": "転写", "field": "molecular-biology"}]}, {"id": "genetic-code", "title": "遺伝暗号（コドン）", "aka": "Genetic code / codon", "field": "molecular-biology", "area": "タンパク質", "section": "合成と分解", "headline": "3塩基で1アミノ酸、生物ほぼ共通の対応表", "summary": "DNA/RNAの4種類の塩基を3つ並べた『コドン』64通りが、20種のアミノ酸＋終止シグナルに割り当てられている。1961年以降に解読された。ほぼ全生物で共通（普遍性）で、複数のコドンが同じアミノ酸を指す（縮重）。この共通性のおかげで、ある生物の遺伝子を別の生物に入れて同じタンパク質を作らせられる。", "easyHeadline": "DNAの3文字の暗号が、アミノ酸1つに対応する", "easyBody": "DNAやRNAの文字（A・T/U・G・C）を3つずつ組にして読むと、それが「どのアミノ酸を使うか」の指示になっています。この対応表はほぼすべての生き物で共通なので、ある生き物の遺伝子を別の生き物に入れても、同じタンパク質を作らせることができます。", "keyPoint": "『縮重』は保険。3文字目が変わっても同じアミノ酸になることが多く、点変異の影響を和らげる。", "body": [{"label": "開始と終止", "text": "AUG（メチオニン）で開始、UAA・UAG・UGAで終止。"}, {"label": "普遍性の例外", "text": "ミトコンドリアや一部の生物でわずかにずれる。"}, {"label": "応用", "text": "大腸菌でヒトインスリンを作る、GFPを他生物で光らせる——すべて暗号の共通性が前提。"}], "relatedTopics": [{"concept": "translation", "relation": "構成する"}, {"concept": "amino-acids", "relation": "はたらく相手"}, {"concept": "insulin", "relation": "関連"}, {"concept": "gfp", "relation": "関連"}], "referencedBy": [{"id": "alphafold", "title": "AlphaFold", "field": "molecular-biology"}, {"id": "amino-acids", "title": "アミノ酸", "field": "molecular-biology"}, {"id": "base-pairing", "title": "塩基対と相補性", "field": "molecular-biology"}, {"id": "central-dogma", "title": "セントラルドグマ", "field": "molecular-biology"}, {"id": "dna-sequencing", "title": "DNAシーケンシング", "field": "molecular-biology"}, {"id": "gfp", "title": "GFP（緑色蛍光タンパク質）", "field": "molecular-biology"}, {"id": "insulin", "title": "インスリン", "field": "molecular-biology"}, {"id": "recombinant-dna", "title": "組換えDNA", "field": "molecular-biology"}, {"id": "rna-world-noncoding", "title": "RNAの多様な顔", "field": "molecular-biology"}, {"id": "translation", "title": "翻訳", "field": "molecular-biology"}]}, {"id": "germ-theory-vaccines", "title": "細菌説とワクチン", "aka": "Germ theory & vaccination", "field": "technology", "area": "見る技術と医学", "section": "見えないものを見る、治す", "year": 1861, "yearLabel": "1861年ごろ（パスツールの実験）", "headline": "「病気は目に見えない生き物が起こす」という発見が医学を変えた", "summary": "19世紀半ばまで、病気は「悪い空気（瘴気）」や体液の乱れで起こると考えられていた。パスツールとコッホが、顕微鏡で観察できる微生物（細菌）が特定の病気の原因であることを実証し（細菌説）、これが感染症を「防ぐ・治す」という発想の土台になった。ジェンナーはそれ以前の1796年、牛痘に感染した人が天然痘にかからないことに着目してワクチン接種を考案しており、細菌説確立後はこの仕組みが「弱毒化・不活化した病原体を先に体に見せて免疫を訓練する」科学として整理された。手洗い・滅菌・上下水道の整備といった公衆衛生策も細菌説から生まれ、平均寿命を大きく押し上げた。", "keyPoint": "感染症対策の多くは「目に見えない敵の存在を証明できた」ことから始まった。", "body": [{"label": "パスツールの実証", "text": "白鳥の首フラスコ実験で『微生物は自然発生しない、外から入ってくる』ことを示し、自然発生説に終止符を打った。"}], "relatedTopics": [{"concept": "microscope", "relation": "技術で見る"}, {"concept": "antibiotics", "relation": "なかま"}, {"concept": "antibody", "relation": "関連"}], "referencedBy": [{"id": "antibiotics", "title": "抗生物質", "field": "technology"}, {"id": "microscope", "title": "顕微鏡", "field": "technology"}]}, {"id": "gfp", "title": "GFP（緑色蛍光タンパク質）", "aka": "Green Fluorescent Protein", "field": "molecular-biology", "area": "タンパク質", "section": "代表的なタンパク質", "headline": "生きた細胞で光る、生物学を変えた目印", "summary": "オワンクラゲ由来の、紫外〜青色光を当てると緑に光るタンパク質。特別な基質を必要とせず、βバレル構造の内部で自分自身の3アミノ酸が化学変化して発色団になる。調べたい遺伝子にGFPをつなげば、そのタンパク質が『いつ・どこで・どれだけ』作られるかを生きたまま可視化できる。2008年ノーベル化学賞。", "easyHeadline": "光を当てると緑に光る、生き物観察の目印タンパク質", "easyBody": "クラゲから見つかったこのタンパク質は、光を当てると緑色に光ります。調べたい遺伝子にこの光るタンパク質をくっつけておくと、その遺伝子がいつ・どこではたらいているかを、生きた細胞のまま光で見ることができます。", "keyPoint": "『遺伝子でコードできる標識』であることが革命的。細胞を殺さず、リアルタイムで、特定分子だけを光らせられる。", "body": [{"label": "βバレル", "text": "11本のβストランドが筒をつくり、その中心軸に発色団を守るように抱える。"}, {"label": "カラーパレット", "text": "変異や近縁種から青・シアン・黄・赤（mCherryなど）が作られ、多重標識が可能に。"}, {"label": "応用", "text": "遺伝子発現レポーター、タンパク質局在、細胞系譜追跡、バイオセンサー（カルシウム、電位）。"}], "relatedTopics": [{"concept": "alpha-helix-beta-sheet", "relation": "構成する"}, {"concept": "protein-folding", "relation": "関連"}, {"concept": "genetic-code", "relation": "はたらく相手"}, {"concept": "antibody", "relation": "対比"}], "referencedBy": [{"id": "flame-color", "title": "炎色反応", "field": "chemistry"}, {"id": "genetic-code", "title": "遺伝暗号（コドン）", "field": "molecular-biology"}, {"id": "recombinant-dna", "title": "組換えDNA", "field": "molecular-biology"}]}, {"id": "gibbs-free-energy", "title": "ギブズ自由エネルギー", "aka": "Gibbs free energy", "field": "chemistry", "area": "エネルギーと自発性", "section": "進む向き", "headline": "熱の損得と乱雑さの綱引きで、反応の向きが決まる", "summary": "反応が自発的に進むかどうかは、エンタルピー（熱の損得ΔH）とエントロピー（乱雑さの変化ΔS）の両方で決まる。これをまとめたのがギブズ自由エネルギー変化 ΔG = ΔH − TΔS。ΔGが負なら自発的に進み、正なら進まない（逆向きが自発的）、ゼロなら平衡。温度Tが効くので、低温では進まない反応が高温で進むこともある。", "easyHeadline": "熱の損得と“散らばりやすさ”の綱引きで向きが決まる", "easyBody": "化学変化が自然に進むかどうかは、「熱が出るか吸うか」だけでなく「散らばりやすさが増えるか」も合わせて決まります。この2つをまとめた指標がマイナスになるとき、その変化は自然に進みます。熱を吸う変化でも、散らばりが大きく増えれば自然に起こることがあります(氷が溶けるのがその一例です)。", "keyPoint": "『発熱するかどうか』だけでは向きは決まらない。吸熱でも乱雑さが大きく増えれば自発的に進む（氷が溶ける、塩が水に溶けて冷える）。", "figure": "gibbs", "body": [{"label": "平衡との関係", "text": "ΔGがゼロに近づいた所で反応は見かけ上止まる（化学平衡）。"}, {"label": "生体内", "text": "ATPの加水分解はΔGが大きく負。これを不利な反応と組み合わせて（共役）体は仕事をする。"}], "relatedTopics": [{"concept": "thermochemistry-enthalpy", "relation": "構成する"}, {"concept": "entropy", "relation": "構成する"}, {"concept": "reaction-rate-equilibrium", "relation": "関連"}, {"concept": "metabolism", "relation": "関連"}], "referencedBy": [{"id": "activation-vs-thermodynamics", "title": "速さと向きは別物", "field": "chemistry"}, {"id": "entropy", "title": "エントロピー", "field": "chemistry"}, {"id": "thermochemistry-enthalpy", "title": "反応熱とエンタルピー", "field": "chemistry"}, {"id": "work-and-kinetic-energy", "title": "仕事と運動エネルギー", "field": "physics"}]}, {"id": "heat-transfer-modes", "title": "熱の伝わり方（伝導・対流・放射）", "aka": "Conduction, convection, and radiation", "field": "physics", "area": "エネルギーと熱", "section": "熱と伝わり方", "headline": "熱は伝導・対流・放射の3通りで移動する", "summary": "熱が高温部から低温部へ移動する経路は3つに大別される。伝導は物質中を分子どうしの衝突で伝わる（金属のスプーンが熱くなる）。対流は温められた流体そのものが移動して熱を運ぶ（エアコンの風、鍋の中の水の循環）。放射は物質を介さず電磁波として熱が伝わる（太陽の熱が真空の宇宙を渡って届く）。3つは同時に起きることが多く、断熱材の設計はこの3経路すべてを塞ぐ工夫。", "easyHeadline": "熱が伝わる道は3通り(伝導・対流・放射)", "easyBody": "熱いスプーンを触ると熱く感じるのは「伝導」、エアコンの風で部屋が暖まるのは「対流」、太陽の熱が何もない宇宙を渡ってくるのは「放射」です。この3つの道のどれかで、熱は必ず温かい方から冷たい方へ移動していきます。", "keyPoint": "太陽の熱が地球に届くのは、間に何もない宇宙空間を「放射」で渡ってくるから。伝導・対流には物質が要るが、放射だけは真空でも起こる。", "figure": "heat-transfer", "body": [{"label": "伝導の担い手", "text": "金属は自由電子が熱も運ぶため、熱伝導率が高い。"}, {"label": "放射は温度の4乗に比例", "text": "高温の物体ほど放射で失う熱は急激に増える（黒体放射の考え方につながる）。"}], "relatedTopics": [{"concept": "heat-vs-temperature", "relation": "なかま"}, {"concept": "thermal-engines-and-second-law", "relation": "関連"}], "referencedBy": [{"id": "heat-vs-temperature", "title": "熱と温度の違い", "field": "physics"}]}, {"id": "heat-vs-temperature", "title": "熱と温度の違い", "aka": "Heat vs. temperature", "field": "physics", "area": "エネルギーと熱", "section": "熱と伝わり方", "headline": "熱は移動するエネルギー、温度はその『勢い』の指標", "summary": "日常では混同しがちだが、熱と温度は別物。温度は分子の平均的な運動の激しさを表す指標であり、熱は温度差によって移動するエネルギーそのもの。小さいカップの熱湯より大きいプールのぬるま湯のほうが、温度は低くても持っている熱エネルギーの総量は多い、といったことが起こる。熱は必ず高温側から低温側へ流れ、逆向きには自然には流れない。", "easyHeadline": "「熱」は移動する量、「温度」はその勢いを表す指標", "easyBody": "熱と温度はよく混同されますが別物です。温度は「粒がどれだけ激しく動いているか」を表す指標で、熱はその差によって移動するエネルギーそのものです。小さいカップの熱湯より大きなプールのぬるま湯の方が、温度は低くても持っている熱の総量は多い、ということが起こります。", "keyPoint": "「熱い」は温度が高いことであって、熱をたくさん持っていることとは違う。量（熱）と強さ（温度）を混同しない。", "body": [{"label": "比熱の違い", "text": "同じ熱量を加えても、物質によって温度の上 の第一号", "summary": "膵臓が分泌し、血中の糖を細胞に取り込ませて血糖値を下げる小さなタンパク質ホルモン（51アミノ酸、A鎖・B鎖がジスルフィド結合）。1921年に発見され糖尿病治療を変えた。1951年にサンガーが史上初めて全アミノ酸配列を決定し、『タンパク質は決まった配列を持つ』ことを証明した。1982年には遺伝子組換えで作られた最初の医薬品に。", "easyHeadline": "血液中の糖を下げる、体のホルモン", "easyBody": "インスリンは膵臓から出るホルモンで、血液中の糖分を細胞に取り込ませて血糖値を下げるはたらきがあります。糖尿病の治療薬としても使われている、身近で重要なタンパク質です。", "keyPoint": "一つのタンパク質が、生化学（配列）・医学（糖尿病）・バイオ産業（組換え生産）の三つの歴史的な最初になった。", "body": [{"label": "プロセシング", "text": "プレプロインスリン→プロインスリン→C-ペプチドが切り出されて活性型に。翻訳後修飾／切断の教科書例。"}, {"label": "作用", "text": "細胞膜の受容体型チロシンキナーゼに結合し、糖輸送体GLUT4を細胞表面に呼び出す。"}, {"label": "製剤の進化", "text": "ブタ・ウシ由来→ヒト型組換え→作用時間を変えたアナログ製剤。"}], "relatedTopics": [{"concept": "receptor-signaling", "relation": "はたらく相手"}, {"concept": "ptm", "relation": "原因と結果"}, {"concept": "membrane-transport", "relation": "原因と結果"}, {"concept": "genetic-code", "relation": "技術で見る"}], "referencedBy": [{"id": "genetic-code", "title": "遺伝暗号（コドン）", "field": "molecular-biology"}, {"id": "ptm", "title": "翻訳後修飾", "field": "molecular-biology"}, {"id": "receptor-signaling", "title": "受容体とシグナル伝達", "field": "molecular-biology"}, {"id": "recombinant-dna", "title": "組換えDNA", "field": "molecular-biology"}]}, {"id": "intermolecular-forces", "title": "分子間力", "aka": "Intermolecular forces", "field": "chemistry", "area": "物質の状態", "section": "状態と変化", "headline": "分子どうしを弱く引き合わせる、控えめな力", "summary": "分子の中の原子は強い共有結合で結ばれているが、分子と分子のあいだにも弱い引力がはたらく。電子のゆらぎで生じるファンデルワールス力、電荷の偏りによる双極子引力、特に強いものとして水素結合がある。これらの合計が、沸点の高さ、水の表面張力、ヤモリが壁を登れる理由、そしてタンパク質やDNAが決まった形をとる理由を決める。", "easyHeadline": "分子どうしを弱く引き合わせる、控えめな力", "easyBody": "分子の中の結びつきは強いですが、分子と分子のあいだにもごく弱い引き合う力がはたらいています。1つ1つはとても弱い力ですが、たくさん集まると、水の性質や、タンパク質・DNAが決まった形を保つ理由になるほどの強さになります。", "keyPoint": "1本1本は共有結合の10〜100分の1と弱い。でも大量に集まると、生き物の形を決めるほどの力になる。", "body": [{"label": "水素結合", "text": "H が N・O・F につながっているとき特に強い。水の異常な性質（高い沸点・氷が浮く）の原因。"}, {"label": "生命との関係", "text": "タンパク質の折りたたみ、DNAの二重らせん、細胞膜——どれも分子間力で組み上がっている。"}], "relatedTopics": [{"concept": "chemical-bond", "relation": "対比"}, {"concept": "phase-transition", "relation": "原因と結果"}, {"concept": "states-of-matter", "relation": "原因と結果"}, {"concept": "protein-folding", "relation": "関連"}, {"concept": "alpha-helix-beta-sheet", "relation": "関連"}], "referencedBy": [{"id": "acid-base", "title": "酸と塩基", "field": "chemistry"}, {"id": "cell-membrane", "title": "細胞膜", "field": "molecular-biology"}, {"id": "chemical-bond", "title": "化学結合", "field": "chemistry"}, {"id": "colloid-mixture", "title": "コロイドと混合物", "field": "chemistry"}, {"id": "dissolution", "title": "溶解", "field": "chemistry"}, {"id": "dna-structure", "title": "DNAの二重らせん", "field": "molecular-biology"}, {"id": "gas-laws", "title": "気体の法則", "field": "chemistry"}, {"id": "phase-transition", "title": "状態変化", "field": "chemistry"}, {"id": "states-of-matter", "title": "物質の三態", "field": "chemistry"}]}, {"id": "internet-origin", "title": "インターネットの誕生", "aka": "ARPANET / TCP-IP / World Wide Web", "field": "technology", "area": "伝える技術", "section": "情報を複製し、送る", "year": 1969, "yearLabel": "1969年（ARPANET）", "headline": "軍事研究のネットワークが、世界をつなぐ基盤になった", "summary": "インターネットの起源は1969年に米国防総省が作ったARPANET――核攻撃で一部が壊れても迂回して通信を続けられる「分散型」ネットワークの研究。1970年代にTCP/IPという共通の通信規約が確立し、異なる種類のコンピュータ網どうしをつなげられるようになったことで「ネットワークのネットワーク」＝インターネットが誕生した。1989年、ティム・バーナーズ=リーがハイパーリンクで文書をつなぐWorld Wide Webを考案し、専門家だけの道具だったインターネットが一般の人にも使えるものに変わった。半導体の集積度向上（安いコンピュータの普及）と組み合わさって、1990年代に爆発的に広まった。", "keyPoint": "「インターネット」（通信網の土台）と「Web」（その上で動く文書・アプリの仕組み）は別のもの。", "body": [{"label": "分散型設計の理由", "text": "中央集権的な電話網は一点が壊れると全体が止まる。ARPANETはパケット単位でルートを迂回できる設計にして、耐障害性を確保した。"}], "relatedTopics": [{"concept": "telegraph-telephone", "relation": "なかま"}, {"concept": "transistor-semiconductor", "relation": "原因と結果"}, {"concept": "artificial-intelligence", "relation": "原因と結果"}], "referencedBy": [{"id": "movable-type-printing", "title": "活版印刷", "field": "technology"}, {"id": "radio-wave-modulation", "title": "電波に情報がのる仕組み", "field": "technology"}, {"id": "telegraph-telephone", "title": "電信と電話", "field": "technology"}, {"id": "transistor-semiconductor", "title": "トランジスタと半導体", "field": "technology"}]}, {"id": "isomerism", "title": "異性体", "aka": "Isomerism", "field": "chemistry", "area": "有機化学", "section": "かたちと異性", "headline": "原子の数は同じでも、つなぎ方や向きで別物", "summary": "分子式（原子の種類と数）が同じなのに、構造が違って性質も違う化合物どうしを異性体という。つなぎ方が違う『構造異性体』（例：ブタンとイソブタン）、つながり方は同じで空間配置が違う『立体異性体』、鏡像の関係にある『鏡像異性体（エナンチオマー）』がある。炭素数が増えると異性体の数は爆発的に増える。", "easyHeadline": "材料は同じでも、つなぎ方や向きが違うと別物になる", "easyBody": "同じ種類・同じ数の原子でできていても、原子のつなぎ方や向きが違うだけで、まったく性質の違う物質になることがあります。これを異性体と呼びます。薬では、鏡に映したような関係にある2つの形のうち、片方だけが効いてもう片方は効かない、あるいは害になることさえあります。", "keyPoint": "医薬品では、鏡像異性体の片方が薬、もう片方が無効または有害ということがある（サリドマイド事件の一因）。", "figure": "isomers", "body": [{"label": "構造異性", "text": "直鎖と枝分かれ、官能基の位置違いなど。沸点や反応性が変わる。"}, {"label": "立体異性", "text": "シス／トランス（二重結合まわりの回転が止まっている）、光学異性（鏡像）。"}], "relatedTopics": [{"concept": "carbon-bonding", "relation": "関連"}, {"concept": "functional-groups", "relation": "関連"}, {"concept": "chirality", "relation": "構成する"}, {"concept": "amino-acids", "relation": "関連"}], "referencedBy": [{"id": "chirality", "title": "キラリティ（鏡像異性）", "field": "chemistry"}, {"id": "functional-groups", "title": "官能基", "field": "chemistry"}]}, {"id": "isotopes-radioactivity", "title": "同位体と放射線", "aka": "Isotopes & radioactivity", "field": "chemistry", "area": "元素", "section": "原子とは何か", "headline": "同じ元素でも中性子数が違い、一部は崩れて別の元素になる", "summary": "陽子の数が同じでも中性子の数が違う原子どうしを同位体という。化学的性質はほぼ同じ。中性子と陽子のバランスが悪い核は不安定で、放射線（α線・β線・γ線）を出しながら崩壊し、より安定な核へ——ときに別の元素へ変わる。崩壊の速さは核ごとに決まっていて、半減期で表す。", "easyHeadline": "同じ元素でも重さが違うものがあり一部は別の元素に崩れる", "easyBody": "同じ元素でも、原子核の中の中性子の数が違う「兄弟」のような原子(同位体)が存在します。中には不安定で、放射線を出しながら少しずつ崩れて別の元素に変わっていくものもあり、その崩れる速さは種類ごとに決まっています。この決まった速さを利用して、大昔の年代を測定することができます。", "keyPoint": "半減期が一定だから『時計』になる。炭素14で数万年、ウラン系列で数十億年の年代測定ができる。", "body": [{"label": "利用", "text": "医療画像（PET、トレーサー）、がん治療、原子力発電、食品照射、年代測定。"}, {"label": "核分裂と核融合", "text": "重い核が割れる／軽い核が融合する際の質量の減少がE=mc²でエネルギーになる。"}], "relatedTopics": [{"concept": "atom-structure", "relation": "構成する"}, {"concept": "periodic-table", "relation": "関連"}, {"concept": "redox", "relation": "対比"}], "referencedBy": []}, {"id": "lenses-mirrors-and-imaging", "title": "レンズ・鏡と結像", "field": "physics", "area": "波・光・音", "section": "光", "headline": "光を曲げて・跳ね返して像を作る道具のしくみ", "summary": "レンズは光の屈折を、鏡は光の反射を利用して、物体からの光を1点に集めたり広げたりすることで「像」を作る。凸レンズ・凹レンズ、凹面鏡・凸面鏡の違いは光を集めるか広げるかの違いで、カメラ・眼鏡・望遠鏡・顕微鏡はすべてこの原理の組み合わせでできている。", "easyHeadline": "光を曲げたり跳ね返したりして、像をつくる仕組み", "easyBody": "レンズは光を曲げて(屈折)、鏡は光をはね返して(反射)、物からの光を1点に集めたり広げたりすることで「像」をつくります。カメラや眼鏡、望遠鏡、顕微鏡は、この仕組みの組み合わせでできています。", "keyPoint": "像には実際に光が集まってできる「実像」（スクリーンに映せる）と、光が集まったように見えるだけの「虚像」（鏡の中の自分など、スクリーンには映せない）の2種類がある。", "body": [{"label": "レンズ：屈折で光を曲げる", "text": "凸レンズは中央が厚く、光を1点（焦点）に集める性質があり、物体の位置によってスクリーンに映せる実像（カメラ・プロジェクター）や、拡大されて見える虚像（虫眼鏡）を作る。凹レンズは逆に光を広げ、近視の矯正などに使われる。"}, {"label": "鏡：反射で光を跳ね返す", "text": "平面鏡は物体と同じ大きさの虚像を作る（左右が反転して見える）。凹面鏡は光を集めて実像を作れる（反射望遠鏡・パラボラアンテナ）、凸面鏡は視野を広げる虚像を作る（カーブミラー）。"}, {"label": "組み合わせで拡大する道具", "text": "望遠鏡は対物レンズ（または鏡）で遠くの物体からの弱い光を集め、接眼レンズでその像をさらに拡大する。顕微鏡も同様に2段階のレンズで微小な物体を拡大する。天体望遠鏡は集光力（レンズ・鏡の大きさ）が暗い天体をとらえる鍵になる。"}], "relatedTopics": [{"concept": "reflection-refraction-diffraction-interference", "relation": "構成する"}, {"concept": "xray-crystallography", "relation": "対比", "note": "可視光はレンズで像を結べるが、X線は波長が短すぎて普通のレンズで屈折させにくく回折パターンから構造を逆算する"}, {"concept": "cryo-em", "relation": "対比", "note": "光学顕微鏡の解像度の限界を、電子線を使うことで超える技術"}], "referencedBy": []}, {"id": "medical-imaging", "title": "医用画像技術", "aka": "X-ray, CT, MRI", "field": "technology", "area": "見る技術と医学", "section": "見えないものを見る、治す", "year": 1895, "yearLabel": "1895年（X線の発見）", "headline": "体を切らずに、中身を見る技術", "summary": "1895年、レントゲンが発見したX線は、体を通り抜けるが骨には吸収されやすいという性質を使って、体を切らずに骨折や異物を確認できるようにした最初の医用画像技術。CT（コンピュータ断層撮影）はX線を多方向から当てて撮った画像をコンピュータで計算し、体の輪切り像を再構成する技術で、1970年代の実用化には十分な計算能力を持つコンピュータの登場が不可欠だった。MRI（磁気共鳴画像法）は強力な磁場と電波を使い、放射線を使わずに体内の水分（主に水素原子）の分布を画像化する技術で、軟部組織のコントラストに優れる。いずれも物理学の発見（X線・核磁気共鳴）が数十年かけて医療機器という技術に育った例。", "keyPoint": "X線は骨、MRIは柔らかい組織が得意——原理の違いが向き不向きを分ける。", "body": [{"label": "CTに計算機が要る理由", "text": "1枚のX線写真は影を重ねただけの2次元像。多方向からの投影データから3次元的な断面を計算で復元するには大量の演算が必要で、実用化はコンピュータの性能向上を待った。"}], "relatedTopics": [{"concept": "microscope", "relation": "なかま"}, {"concept": "computer-history", "relation": "はたらく相手"}, {"concept": "electromagnetic-spectrum", "relation": "関連"}], "referencedBy": [{"id": "computer-history", "title": "コンピュータの登場", "field": "technology"}]}, {"id": "membrane-trafficking", "title": "小胞輸送", "aka": "Membrane trafficking / vesicular transport", "field": "molecular-biology", "area": "細胞のしくみ", "section": "区画としての細胞", "headline": "膜で包んだ荷物を、行き先ラベルで仕分けて運ぶ", "summary": "細胞内で、タンパク質や脂質を小さな膜の袋（小胞）に包んで目的地へ運ぶ仕組み。分泌するものは小胞体→ゴルジ体→細胞膜へ、外から取り込むものは細胞膜がくびれてエンドソームへ（エンドサイトーシス）。それぞれの小胞に付いた分子タグと、受け取り側の目印が合致して初めて融合する。2013年ノーベル生理学・医学賞。", "easyHeadline": "膜の袋に包んだ荷物を、宛名ラベルで仕分けて運ぶ", "easyBody": "細胞の中で、タンパク質などの荷物を小さな膜の袋に包んで目的地へ運ぶ仕組みです。袋にも受け取り側にも目印が付いていて、正しい組み合わせのときだけ袋が合体して中身を渡します。神経の情報伝達も、実はこの袋が細胞膜と合体して中身を放出する現象です。", "keyPoint": "神経伝達も本質は小胞輸送——神経伝達物質を詰めた小胞が、電気刺激に応じて膜と融合して中身を放出する。", "body": [{"label": "コートタンパク質", "text": "小胞をくびり取るときに膜の外側を覆って形を作る（クラスリンなど）。"}, {"label": "品質管理", "text": "正しく畳めなかったタンパク質は小胞体から先へ進めず、送り返されて分解される。"}], "relatedTopics": [{"concept": "organelles", "relation": "はたらく相手"}, {"concept": "cell-membrane", "relation": "はたらく相手"}, {"concept": "receptor-signaling", "relation": "関連"}, {"concept": "chaperone", "relation": "なかま"}], "referencedBy": [{"id": "cytoskeleton", "title": "細胞骨格", "field": "molecular-biology"}, {"id": "organelles", "title": "細胞小器官", "field": "molecular-biology"}]}, {"id": "membrane-transport", "title": "膜輸送タンパク質", "aka": "Membrane transport proteins", "field": "molecular-biology", "area": "タンパク質", "section": "機能", "headline": "脂質の壁に開けた、選択的な通り道", "summary": "細胞膜は脂質でできていてイオンや糖を通さない。膜に埋まった輸送タンパク質が特定の物質だけを通す。チャネルは『ゲート付きの穴』で濃度勾配に従って高速に流す。ポンプはATPを使って勾配に逆らって汲み上げる。トランスポーターはその中間で、形を変えながら物質を受け渡す。", "easyHeadline": "細胞の壁に開いた、決まったものだけ通す“扉”", "easyBody": "細胞は油の膜で包まれていて、水に溶けるもの（イオンや糖など）は本来通れません。そこで、膜に埋め込まれた専用のタンパク質が「決まった物質だけ通す扉」の役割をして、必要なものを出し入れします。", "keyPoint": "神経の電気信号は、Na⁺/K⁺ポンプが作った勾配を、電位依存性チャネルが一気に開いて放電することで生まれる。", "body": [{"label": "イオンチャネル", "text": "電位・リガンド・機械刺激で開閉。1個で毎秒100万イオンを通す。神経・筋・感覚の基盤。"}, {"label": "ポンプ（能動輸送）", "text": "Na⁺/K⁺-ATPアーゼは細胞の全エネルギーの2〜3割を消費。"}, {"label": "医薬", "text": "カルシウム拮抗薬、プロトンポンプ阻害薬（胃薬）、SGLT2阻害薬（糖尿病薬）はどれも輸送体を標的にする。"}], "relatedTopics": [{"concept": "molecular-motor", "relation": "なかま"}, {"concept": "receptor-signaling", "relation": "関連"}, {"concept": "alpha-helix-beta-sheet", "relation": "構成する"}, {"concept": "cryo-em", "relation": "技術で見る"}], "referencedBy": [{"id": "cell-membrane", "title": "細胞膜", "field": "molecular-biology"}, {"id": "colligative-osmosis", "title": "束一的性質と浸透圧", "field": "chemistry"}, {"id": "cryo-em", "title": "クライオ電子顕微鏡", "field": "molecular-biology"}, {"id": "insulin", "title": "インスリン", "field": "molecular-biology"}, {"id": "mitochondria-atp", "title": "ミトコンドリアとATP合成", "field": "molecular-biology"}, {"id": "molecular-motor", "title": "分子モーター", "field": "molecular-biology"}]}, {"id": "memory-logic-semiconductor", "title": "メモリ半導体とロジック半導体", "aka": "Memory chip vs Logic chip / DRAM・NAND vs CPU・GPU", "field": "technology", "area": "計算とAI", "section": "情報を演算する", "year": 1970, "yearLabel": "1970年前後（DRAMの実用化）", "headline": "「覚える」専門のチップと、「考える」専門のチップは別物", "summary": "半導体チップは大きく2つの役割に分かれる。メモリ半導体は情報を記憶しておくことに特化したチップで、同じ回路（記憶素子）をひたすら規則正しく並べるだけなので大量生産に向く（DRAM・NAND型フラッシュなど）。ロジック半導体は計算・判断を行うことに特化したチップで、CPUやGPUのように多種多様な回路を複雑に組み合わせて作る。同じ「半導体」でも設計の考え方も作る難しさも別物で、得意な会社が分かれているのはこのため。", "keyPoint": "メモリは「同じ回路をひたすら並べる量産型」、ロジックは「違う回路を組み合わせる設計型」——難しさの種類が違う。", "figure": "memory-logic-chip", "body": [{"label": "メモリ半導体の代表", "text": "DRAM（電源が切れると消える、作業用の記憶）、NAND型フラッシュメモリ（電源を切っても残る、SSDやスマホのストレージ）など。回路の繰り返しなので微細化競争が勝負になりやすい。"}, {"label": "ロジック半導体の代表", "text": "CPU（汎用の計算）、GPU（画像処理・AI学習に強い並列計算）、SoC（スマホ用に複数機能を1チップにまとめたもの）など。回路設計の工夫（アーキテクチャ）が性能を左右する。"}, {"label": "なぜ分業するのか", "text": "メモリは『同じものを大量に、安く、微細に』、ロジックは『違うものを精密に設計』と、勝つための勘所が違う。そのため半導体業界では会社ごとにどちらかへ専門特化する傾向が強い。"}], "relatedTopics": [{"concept": "transistor-semiconductor", "relation": "はたらく相手"}, {"concept": "computer-history", "relation": "はたらく相手"}, {"concept": "digital-analog-difference", "relation": "なかま"}], "referencedBy": [{"id": "digital-analog-difference", "title": "デジタル・アナログの違い", "field": "technology"}]}, {"id": "metabolism", "title": "代謝", "aka": "Metabolism", "field": "molecular-biology", "area": "細胞のしくみ", "section": "エネルギーと物質", "headline": "分解でエネルギーを取り、合成で体を作る反応網", "summary": "細胞の中で起きる化学反応の総体。栄養を分解してエネルギーと部品を取り出す『異化』と、その部品とエネルギーを使って必要な分子を組み立てる『同化』の2方向がある。何千もの反応が酵素で触媒され、経路（パスウェイ）として鎖のようにつながり、分岐点で調節されて全体が破綻なく回る。", "easyHeadline": "分解でエネルギーを得て、合成で体を作る反応の網", "easyBody": "細胞の中で起きる化学反応すべてをまとめた言葉です。栄養を分解してエネルギーと部品を取り出す方向と、その部品を使って必要なものを組み立てる方向の2つがあります。何千もの反応が鎖のようにつながり、要所要所で調節されて全体がうまく回っています。", "keyPoint": "ATPが異化と同化をつなぐ共通通貨。異化でATPを稼ぎ、同化でATPを使う。", "body": [{"label": "律速段階", "text": "経路の中で最も遅い反応が全体の速度を決め、そこがしばしば調節点になる。"}, {"label": "代謝の個体差", "text": "薬の効き方や体質の違いの多くは、代謝酵素の遺伝的な違いによる。"}], "relatedTopics": [{"concept": "enzyme", "relation": "はたらく相手"}, {"concept": "mitochondria-atp", "relation": "なかま"}, {"concept": "redox", "relation": "なかま"}, {"concept": "reaction-rate-equilibrium", "relation": "関連"}, {"concept": "photosynthesis", "relation": "なかま"}], "referencedBy": [{"id": "gibbs-free-energy", "title": "ギブズ自由エネルギー", "field": "chemistry"}, {"id": "mitochondria-atp", "title": "ミトコンドリアとATP合成", "field": "molecular-biology"}, {"id": "photosynthesis", "title": "光合成", "field": "molecular-biology"}]}, {"id": "microscope", "title": "顕微鏡", "aka": "Microscope", "field": "technology", "area": "見る技術と医学", "section": "見えないものを見る、治す", "year": 1665, "yearLabel": "1665年ごろ（顕微鏡による細胞の発見）", "headline": "肉眼の限界を超えて「小さな生命」を見せた", "summary": "17世紀、レーウェンフックが自作の顕微鏡でバクテリアや精子を観察し、フックが顕微鏡越しに見た小さな部屋状の構造に「細胞（cell）」と名付けた。これが生物学における「見えないものを見る」技術の出発点。光学顕微鏡はレンズで光を曲げて像を拡大するが、光の波長より小さいものは原理的に見えないという限界（回折限界）がある。20世紀に電子顕微鏡が登場すると、電子線（波長がずっと短い）を使うことでウイルスやタンパク質の形まで見えるようになり、さらにクライオ電子顕微鏡（cryo-EM）は分子1個の立体構造を凍結したまま撮影できる技術として、X線結晶構造解析と並ぶ現代の構造生物学の主力になっている。", "keyPoint": "「見えないものは存在しないのではなく、見る道具がなかっただけ」を繰り返し証明してきた技術。", "figure": "microscope-scale", "body": [{"label": "回折限界", "text": "光学顕微鏡は光の波長（約400〜700nm）より小さい構造を原理的に見分けられない。ウイルスやタンパク質はこれより小さいので、電子顕微鏡やX線が必要になる。"}], "relatedTopics": [{"concept": "germ-theory-vaccines", "relation": "原因と結果"}, {"concept": "cryo-em", "relation": "なかま"}, {"concept": "xray-crystallography", "relation": "対比"}, {"concept": "technology-enables-science", "relation": "なかま"}], "referencedBy": [{"id": "germ-theory-vaccines", "title": "細菌説とワクチン", "field": "technology"}, {"id": "medical-imaging", "title": "医用画像技術", "field": "technology"}, {"id": "technology-enables-science", "title": "技術が科学を進める", "field": "technology"}]}, {"id": "mitochondria-atp", "title": "ミトコンドリアとATP合成", "aka": "Mitochondria / oxidative phosphorylation", "field": "molecular-biology", "area": "細胞のしくみ", "section": "エネルギーと物質", "headline": "食べ物の電子で膜に電池を作り、ATPを回す", "summary": "細胞のエネルギー工場。栄養を分解して得た高エネルギー電子を、ミトコンドリア内膜のタンパク質群が受け渡していき（電子伝達系）、その過程で水素イオンを膜の外へ汲み出す。たまったイオンが逆流する力で、ATP合成酵素という分子タービンが回ってATPを作る（化学浸透）。最終的に電子は酸素が受け取って水になる。", "easyHeadline": "食べ物の力で膜に電池を作り、エネルギー通貨を回す", "easyBody": "ミトコンドリアは細胞のエネルギー工場です。栄養から取り出したエネルギーで、まず膜をはさんでイオンの濃度差（電池のようなもの）を作ります。そのイオンが流れ戻る力で小さなタービンが回り、細胞のエネルギー通貨であるATPが作られます。", "keyPoint": "エネルギーは『膜をまたぐイオンの濃度差』という形で一時保存される。滝の水で水車を回すのと同じ発想。", "body": [{"label": "ATP合成酵素", "text": "実際に軸が回転する分子モーター。1回転で3分子のATPを作る。"}, {"label": "呼吸との関係", "text": "吸う酸素は電子の最終受け取り役、吐くCO2は栄養を分解したときに出る。"}], "relatedTopics": [{"concept": "redox", "relation": "構成する"}, {"concept": "molecular-motor", "relation": "なかま"}, {"concept": "membrane-transport", "relation": "はたらく相手"}, {"concept": "photosynthesis", "relation": "対比"}, {"concept": "metabolism", "relation": "なかま"}], "referencedBy": [{"id": "apoptosis", "title": "アポトーシス", "field": "molecular-biology"}, {"id": "electrochemical-cell", "title": "電池（化学電池）", "field": "chemistry"}, {"id": "forms-of-energy-and-conversion", "title": "エネルギーの形と変換", "field": "physics"}, {"id": "metabolism", "title": "代謝", "field": "molecular-biology"}, {" ルギー", "headline": "「質量×速度」は外力がなければ保存される", "summary": "運動量（質量×速度）は、外から力が加わらない限り総量が変わらない――これが運動量保存則。力を短時間加えたときの効果は「力積」（力×時間）で表され、力積は運動量の変化量に等しい。衝突・反発・ロケットの推進・ビリヤードの球の動きなど、力の詳細が分からなくても前後の運動量から結果を予測できるのが強み。", "easyHeadline": "「重さ×速さ」は、外から力が加わらない限り変わらない", "easyBody": "ものがぶつかったり跳ね返ったりするとき、「重さ×速さ」を合計した量は、外から力が加わらない限り変わりません。この考え方を使うと、ぶつかる瞬間に働いている力の細かい様子が分からなくても、ぶつかる前と後の動きを予測することができます。", "keyPoint": "衝突の瞬間、力の大きさや形は分からなくても「衝突前後で運動量の合計は変わらない」という一点だけで結果を計算できる。", "body": [{"label": "力積＝運動量の変化", "text": "同じ運動量変化でも、時間を長くかければ加わる力は小さくて済む（エアバッグ・受け身の原理）。"}, {"label": "保存則が使える場面", "text": "外力（摩擦や外部からの力）が無視できる短時間の衝突・爆発・分裂で特に有効。"}], "relatedTopics": [{"concept": "newtons-laws-of-motion", "relation": "関連"}, {"concept": "work-and-kinetic-energy", "relation": "対比"}, {"concept": "angular-momentum-and-gyroscopes", "relation": "なかま"}], "referencedBy": [{"id": "angular-momentum-and-gyroscopes", "title": "角運動量とコマ・ジャイロ", "field": "physics"}, {"id": "newtons-laws-of-motion", "title": "ニュートンの運動の3法則", "field": "physics"}, {"id": "work-and-kinetic-energy", "title": "仕事と運動エネルギー", "field": "physics"}]}, {"id": "movable-type-printing", "title": "活版印刷", "aka": "Movable-type printing / グーテンベルクの活版印刷", "field": "technology", "area": "伝える技術", "section": "情報を複製し、送る", "year": 1440, "yearLabel": "1440年ごろ", "headline": "知識を「手書き」から「大量複製」に変えた発明", "summary": "1440年代、ドイツのヨハネス・グーテンベルクが実用化した活版印刷は、金属製の可動活字を組み合わせてページを作り、プレス機で大量に刷る技術。それまで本は写字生が1冊ずつ手で書き写すもので、極めて高価かつ稀少だった。活版印刷によって同じ本を数百部単位で作れるようになり、聖書・学術書・パンフレットが急速に広まった。宗教改革の思想拡散、科学革命での論文・観測データの共有、識字率の向上など、その後500年の知の流通構造を作った「情報革命の第一号」と言える発明。", "keyPoint": "発明そのものは金属加工の技術だが、その影響は「知識が特権階級だけのものではなくなった」という社会変化。", "figure": "printing-press", "body": [{"label": "技術の中身", "text": "活字（凸型の金属文字）・インク・プレス機の3つの組み合わせ。活字は使い回せるので、次のページはただ組み替えるだけでよい。"}, {"label": "インパクト", "text": "1500年までにヨーロッパで印刷された本は推定2000万部。手書き時代とは桁が違う複製速度。"}], "relatedTopics": [{"concept": "telegraph-telephone", "relation": "なかま"}, {"concept": "internet-origin", "relation": "関連"}, {"concept": "science-to-technology", "relation": "関連"}], "referencedBy": [{"id": "telegraph-telephone", "title": "電信と電話", "field": "technology"}]}, {"id": "newtons-laws-of-motion", "title": "ニュートンの運動の3法則", "aka": "Newton's three laws of motion", "field": "physics", "area": "力と運動", "section": "ニュートンの法則", "headline": "力・質量・加速度の関係を定めた3つの法則", "summary": "「力とは何か」を初めて定量的に定義した法則群。第1法則（慣性の法則）は、力が働かなければ物体は静止または等速直線運動を続けると述べる。第2法則は F=ma で力・質量・加速度を結びつけ、力が分かれば未来の運動が計算できるという古典力学の予測力の核になる。第3法則は「作用があれば必ず逆向き・同じ大きさの反作用がある」と主張する。この3つで日常スケールの運動はほぼ説明できる。", "easyHeadline": "力・重さ・動きの変わり方の関係を決めた3つの決まり", "easyBody": "力が働かなければ、物はそのままの動き(止まっている、または同じ速さで真っすぐ進む)を続けます。力が働くと、その大きさと物の重さに応じて動き方が変わります。そして何かを押すと、必ず同じ強さで押し返されます。この3つの決まりだけで、身の回りのほとんどの動きが説明できます。", "keyPoint": "本体は第2法則 F=ma。力が分かれば加速度が分かり、加速度が分かれば未来の位置が計算できる——これが古典力学の予測力の源。", "body": [{"label": "第1法則（慣性）", "text": "力の合計がゼロなら、物体は今の運動状態（静止 or 等速直線運動）を続ける。「動かすのに力がいる」のではなく「運動を変えるのに力がいる」。"}, {"label": "第3法則（作用・反作用）", "text": "壁を押せば壁も同じ力で押し返す。ロケットが後方にガスを噴くと前に進むのもこの法則。二つの力は別々の物体に働くので打ち消し合わない。"}], "relatedTopics": [{"concept": "inertial-frames-and-fictitious-forces", "relation": "関連"}, {"concept": "momentum-and-impulse", "relation": "なかま"}, {"concept": "work-and-kinetic-energy", "relation": "なかま"}], "referencedBy": [{"id": "entropy-and-irreversibility", "title": "エントロピーと不可逆性", "field": "physics"}, {"id": "inertial-frames-and-fictitious-forces", "title": "慣性系と見かけの力", "field": "physics"}, {"id": "momentum-and-impulse", "title": "運動量と力積", "field": "physics"}, {"id": "simple-harmonic-motion-and-resonance", "title": "単振動と共振", "field": "physics"}]}, {"id": "organelles", "title": "細胞小器官", "aka": "Organelles", "field": "molecular-biology", "area": "細胞のしくみ", "section": "区画としての細胞", "headline": "役割ごとに膜で仕切った、細胞の中の作業場", "summary": "真核細胞の中には、膜で囲まれた専門区画がいくつもある。核（DNAの保管と転写）、小胞体（タンパク質・脂質の合成）、ゴルジ体（加工と仕分け）、リソソーム（分解）、ミトコンドリア（エネルギー）。区画に分けることで、相性の悪い反応を隔離し、それぞれに最適な環境（pHなど）を保てる。", "easyHeadline": "役割ごとに膜で仕切った、細胞の中の作業部屋", "easyBody": "細胞の中には、膜で囲まれた専門の部屋がいくつもあります。設計図を保管する部屋、物を作る部屋、加工して仕分ける部屋、ゴミを分解する部屋、エネルギーを作 応と逆反応が同じ速さになった『平衡』で見かけ上止まる。条件（濃度・圧力・温度）を変えると平衡は片寄る（ルシャトリエの原理）。", "easyHeadline": "どれくらい速いか、どこで釣り合って止まって見えるか", "easyBody": "化学反応の速さは、粒どうしがどれだけ激しくぶつかり合うか、そしてその際に乗り越えなければならない壁の高さで決まります。多くの反応は一方通行ではなく、進む反応と戻る反応が同じ速さになったところで、見かけ上止まったように見えます(化学平衡)。", "keyPoint": "触媒は山を低くして速くするだけで、平衡の位置（最終的な量）は動かさない。酵素も同じ。", "body": [{"label": "活性化エネルギー", "text": "反応が始まるのに必要な最小のエネルギー。マッチをこするのは、これを与える行為。"}, {"label": "ルシャトリエ", "text": "平衡系に変化を加えると、それを打ち消す向きに平衡が移動する。アンモニア合成の条件設計に使われる。"}], "relatedTopics": [{"concept": "chemical-reaction", "relation": "構成する"}, {"concept": "enzyme", "relation": "対比"}, {"concept": "combustion", "relation": "関連"}, {"concept": "phase-transition", "relation": "関連"}], "referencedBy": [{"id": "activation-vs-thermodynamics", "title": "速さと向きは別物", "field": "chemistry"}, {"id": "catalysis", "title": "触媒", "field": "chemistry"}, {"id": "chemical-reaction", "title": "化学反応", "field": "chemistry"}, {"id": "combustion", "title": "燃焼", "field": "chemistry"}, {"id": "gibbs-free-energy", "title": "ギブズ自由エネルギー", "field": "chemistry"}, {"id": "metabolism", "title": "代謝", "field": "molecular-biology"}, {"id": "phase-transition", "title": "状態変化", "field": "chemistry"}]}, {"id": "receptor-signaling", "title": "受容体とシグナル伝達", "aka": "Receptor / GPCR / signal transduction", "field": "molecular-biology", "area": "タンパク質", "section": "機能", "headline": "細胞膜のアンテナが外の情報を中へ伝える", "summary": "ホルモンや神経伝達物質など、細胞の外の分子は膜を通れない。膜に刺さった受容体タンパク質がそれを受け取ると自身の形が変わり、その変化が細胞内のタンパク質の連鎖反応（シグナル伝達経路）を起動して、最終的に遺伝子発現や代謝を変える。GPCRはこの受容体の最大ファミリーで、薬の約3割の標的。", "easyHeadline": "細胞の表面にある“アンテナ”が外の情報を中に伝える", "easyBody": "ホルモンなどの信号は細胞の中に直接入れないので、細胞の表面にあるアンテナ役のタンパク質（受容体）がまず受け取ります。受け取ると形が変わり、その変化が細胞の中にリレーのように伝わって、最終的に細胞の働き方が変わります。", "keyPoint": "『1個の分子が結合→内部で何段にも増幅』。少数のシグナルが大きな細胞応答になる（カスケード増幅）。", "body": [{"label": "GPCR", "text": "7回膜貫通ヘリックス。結合するとGタンパク質を活性化し、cAMPなどのセカンドメッセンジャーを生む。"}, {"label": "受容体型チロシンキナーゼ（RTK）", "text": "結合すると二量体化し、互いをリン酸化してMAPK経路などを起動。インスリン受容体もこの仲間。"}, {"label": "増幅と終息", "text": "キナーゼとホスファターゼ、GTPアーゼが『オン』と『オフ』
