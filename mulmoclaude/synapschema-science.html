計算する式があります。それがシュレディンガー方程式です。この式自体は、実はきっちり答えが決まる計算式なのですが、その答え（波動関数）を実際に観測しようとした瞬間だけ、サイコロを振るような不確かさが顔を出す、という少し変わった構造になっています。", "referencedBy": [{"id": "quantum-tunneling", "title": "トンネル効果（走査型トンネル顕微鏡・核融合・半導体）", "field": "quantum"}, {"id": "de-broglie-matter-waves", "title": "ド・ブロイの物質波", "field": "quantum"}, {"id": "atomic-orbitals-quantum-numbers", "title": "原子軌道と量子数", "field": "quantum"}, {"id": "wavefunction-probability", "title": "波動関数と確率解釈（ボルンの規則）", "field": "quantum"}]}, {"id": "science-to-technology", "title": "科学が技術になるとき", "aka": "Science-to-technology pipeline / 基礎研究から応用へ", "field": "technology", "area": "科学と技術のあいだ", "section": "変遷の型", "headline": "基礎研究が応用され、発明になり、社会に広がる", "summary": "科学は「なぜそうなるか」を明らかにする営みで、技術は「それを使って何ができるか」を形にする営み。両者はしばしば別の時間軸で動く——ファラデーが電磁誘導を発見してから実用発電機が普及するまで数十年、量子力学の確立からトランジスタの発明までも数十年かかった。典型的な流れは「基礎研究（原理の発見）→応用研究（使えるかたちにする）→発明（装置・製品にする）→普及（安く・広く使えるようにする）」の4段階で、各段階に別の担い手（科学者・技術者・企業・社会）が関わる。すべての技術がこの順で生まれるわけではなく、逆に技術が先に存在し、あとから科学がその理由を説明する例（蒸気機関と熱力学、望遠鏡と光学）もある。", "keyPoint": "「発見」から「普及」までは一直線ではなく、しばしば何十年もかかる。", "figure": "tech-pipeline", "body": [{"label": "4段階の例：電気", "text": "電磁誘導の発見(1831、ファラデー) → 発電の原理を装置化(応用研究) → 実用発電機の発明(1870年代) → 電力網による普及(20世紀初頭)。"}, {"label": "逆向きの流れもある", "text": "蒸気機関は熱力学の理論より先に実用化された。あとから科学が『なぜ効率に上限があるのか』を説明した(熱力学第二法則)。"}], "relatedTopics": [{"concept": "technology-enables-science", "relation": "なかま"}, {"concept": "steam-engine", "relation": "関連"}, {"concept": "thermal-engines-and-second-law", "relation": "関連"}], "referencedBy": [{"id": "technology-enables-science", "title": "技術が科学を進める", "field": "technology"}, {"id": "antibiotics", "title": "抗生物質", "field": "technology"}, {"id": "movable-type-printing", "title": "活版印刷", "field": "technology"}, {"id": "steam-engine", "title": "蒸気機関", "field": "technology"}]}, {"id": "seasonings-and-umami", "title": "調味料とうま味", "aka": "Seasonings and umami taste", "field": "food", "area": "変える・味わう", "section": "調味料", "headline": "塩・砂糖・うま味は、それぞれ別の味覚受容体に効く", "summary": "舌には甘味・塩味・酸味・苦味・うま味という5つの基本味を感じる受容体があり、それぞれ違う化学物質に反応する。塩味はナトリウムイオン、甘味は糖、酸味は水素イオン(酸)、うま味はグルタミン酸やイノシン酸といったアミノ酸・核酸系の物質を感知する。しょうゆや味噌、だし(昆布・かつお節)がおいしく感じられるのは、発酵や乾燥の過程でタンパク質が分解され、うま味成分が豊富に生まれているため。複数のうま味成分(グルタミン酸+イノシン酸など)を組み合わせると、単独より何倍も強く感じる「相乗効果」が起きることも分かっている。", "keyPoint": "「だしが効いている」とは、グルタミン酸とイノシン酸が同時に舌の受容体を刺激し、うま味が掛け算的に強まっている状態。", "body": [{"label": "うま味の発見", "text": "1908年、日本の池田菊苗が昆布のうま味成分としてグルタミン酸を特定し、5番目の基本味として提唱した。"}, {"label": "塩の役割は味だけではない", "text": "塩はタンパク質の構造を変えたり、水分を引き出したりする作用もあり、味付け以外に食感や保存にも関わる。"}], "relatedTopics": [{"concept": "receptor-signaling", "relation": "技術で見る"}, {"concept": "fermentation-food", "relation": "なかま"}, {"concept": "amino-acids", "relation": "構成する"}], "easyHeadline": "5つの基本の味は、それぞれ別の受容体で感じている", "easyBody": "舌には甘味・塩味・酸味・苦味・うま味という5つの基本の味を感じるセンサーがあり、それぞれ違う物質に反応します。だしがおいしいのは、グルタミン酸とイノシン酸という2種類のうま味成分が同時に舌を刺激し、うま味が掛け算のように強まるためです。", "referencedBy": [{"id": "fermentation-food", "title": "発酵とは何か", "field": "food"}, {"id": "spice-trade-and-exploration", "title": "香辛料が動かした大航海時代", "field": "food"}]}, {"id": "semiconductor-manufacturing", "title": "半導体はどう作られるか", "aka": "Semiconductor Manufacturing (Wafer to Chip)", "field": "industry", "area": "半導体", "section": "チップができるまで", "headline": "シリコンの塊から回路を刻むまでの数百工程", "summary": "半導体チップは、直径30cm程度のシリコン単結晶（ウェハー）の表面に、光や化学反応を使って回路パターンを何十層も重ねて作る。1つのチップを完成させるまでに露光・エッチング・成膜・洗浄といった工程を数百回繰り返し、製造には数か月かかる。回路線幅はナノメートル単位まで微細化しており、最先端工場（ファブ）を1棟建てるだけで数兆円規模の投資が必要になる。この巨大な設備投資こそが、半導体産業を少数の企業しか戦えない寡占市場にしている理由であり、微細化の限界に挑む競争がそのまま国家間の技術覇権競争にもなっている。", "keyPoint": "半導体は「工場そのものが最先端の科学実験装置」であり、微細化の1世代進化に兆円単位の投資が必要になる。", "body": [{"label": "露光というボトルネック", "text": "回路パターンをウェハーに転写する露光装置（リソグラフィ）は、オランダのASML1社がEUV（極端紫外線）露光装置を事実上独占供給している。この1台の値段は数百億円にのぼり、世界で数十台しか出荷されないため、EUVを買えるかどうかが最先端チップを作れるかどうかを直接左右する。"}, {"label": "歩留まりという経営指標", "text": "同じ設計でも、製造過程のわずかなゴミや誤差でチップは不良になる。実際に使えるチップの割合を「歩留まり」と呼び、これを1%改善するだけで数百億円規模の利益差が生まれるため、歩留まり管理は半導体企業の生命線とされる。"}], "relatedTopics": [{"concept": "transistor-semiconductor", "relation": "技術で見る"}, {"concept": "fabless-foundry-model", "relation": "構成する"}, {"concept": "semiconductor-supply-chain", "relation": "関連"}, {"concept": "memory-logic-semiconductor", "relation": "なかま"}], "figure": "semiconductor-pipeline", "referencedBy": [{"id": "fabless-foundry-model", "title": "ファブレスとファウンドリ", "field": "industry"}, {"id": "semiconductor-supply-chain", "title": "半導体サプライチェーンと地政学", "field": "industry"}]}, {"id": "semiconductor-supply-chain", "title": "半導体サプライチェーンと地政学", "field": "industry", "area": "半導体", "section": "チップができるまで", "headline": "1本の指輪のようにつながる世界分業と危うさ", "summary": "1個の最先端チップができるまでには、米国の設計・EDA（設計ソフト）、日本の材料・製造装置、オランダの露光装置、台湾・韓国の製造、東南アジアの組立・検査というように、世界中の国と企業が連携する長い工程が必要になる。どこか1か所が止まるだけで世界中の自動車工場やスマホ生産が止まるほど、この鎖は細く強く依存し合っている。2020年代には米中対立を背景に、先端半導体の製造装置や技術を特定国に渡さないようにする輸出規制が強化され、各国が自国内に工場を誘致する「半導体の内製化（デリスキング）」に巨額の補助金を投じるようになった。半導体はもはや純粋な経済財ではなく、安全保障そのものとして扱われている。", "keyPoint": "半導体は「どこでも作れる部品」ではなく「特定の国・企業にしか作れない工程」の連鎖でできており、その一点が地政学リスクの急所になる。", "body": [{"label": "台湾有事シナリオの重み", "text": "世界最先端チップの9割以上がTSMC（台湾）に集中しているため、台湾周辺で軍事的緊張が高まると世界経済への影響が計り知れないと言われる。この一極集中リスクが、各国が自国内生産にこだわる最大の動機になっている。"}, {"label": "日本の立ち位置", "text": "日本は最終製品の製造こそ台湾・韓国に譲ったが、フォトレジストなどの半導体材料やシリコンウェハー、製造装置の一部で世界的なシェアを維持しており、サプライチェーンの「見えない急所」を握っている。"}], "relatedTopics": [{"concept": "semiconductor-manufacturing", "relation": "構成する"}, {"concept": "fabless-foundry-model", "relation": "関連"}, {"concept": "computer-history", "relation": "関連"}, {"concept": "just-in-time-supply-chain", "relation": "なかま"}], "referencedBy": [{"id": "containerization", "title": "コンテナ化", "field": "industry"}, {"id": "just-in-time-supply-chain", "title": "ジャストインタイムとサプライチェーン", "field": "industry"}, {"id": "fabless-foundry-model", "title": "ファブレスとファウンドリ", "field": "industry"}, {"id": "semiconductor-manufacturing", "title": "半導体はどう作られるか", "field": "industry"}]}, {"id": "silicon-semiconductor-material", "title": "シリコンと半導体材料", "aka": "Silicon as a semiconductor material", "field": "computer", "area": "CPU", "section": "計算の仕組み", "headline": "電気を通す・通さないを調整できる特別な元素", "summary": "シリコンは、単体では電気を通しにくい「半導体」と呼ばれる性質を持つ元素。ここにごく微量の別の元素(不純物)を加える「ドーピング」という処理を行うと、電気の流れやすさを精密にコントロールできるようになる。電子が余る性質にしたもの(n型)と、電子が不足する性質にしたもの(p型)を組み合わせることで、電流のオン・オフを切り替えるトランジスタが作れる。地球上に豊富に存在し、加工しやすく、酸化させると絶縁体の膜(酸化シリコン)を作れる扱いやすさから、コンピュータチップの主材料として選ばれ続けている。", "keyPoint": "シリコンそのものが賢いのではなく、不純物を加えて電気の流れ方を作り分けられることが半導体チップの土台。", "body": [{"label": "なぜシリコンなのか", "text": "ゲルマニウムなど他の半導体材料もあるが、シリコンは資源が豊富・加工技術が成熟・酸化膜が絶縁体として優秀という条件がそろい、業界標準になった。"}], "relatedTopics": [{"concept": "transistor-semiconductor", "relation": "構成する"}, {"concept": "cpu-architecture", "relation": "はたらく相手"}, {"concept": "atom-structure", "relation": "関連"}], "referencedBy": [{"id": "quantum-tunneling", "title": "トンネル効果（走査型トンネル顕微鏡・核融合・半導体）", "field": "quantum"}, {"id": "band-theory", "title": "バンド理論（導体・絶縁体・半導体）", "field": "quantum"}]}, {"id": "simple-harmonic-motion-and-resonance", "title": "単振動と共振", "field": "physics", "area": "波・光・音", "section": "振動と波", "headline": "「行ったり来たり」を支配する共通の数式", "summary": "バネにおもりをつけて引っ張って離す、振り子を揺らす——こうした「元の位置に戻ろうとする力」で起きる往復運動を単振動という。あらゆる振動はこの単振動の数式で近似でき、外から加える力の周期が物体固有の振動数と一致すると振幅が爆発的に増える「共振」が起きる。", "keyPoint": "復元力が変位に比例する（フックの法則型）とき、運動は必ずsin/cos型の単振動になる。", "body": [{"label": "復元力と単振動", "text": "バネの力F=-kx（変位に比例し逆向き）のように「ずれた分だけ元に戻そうとする力」がかかる系は、振幅・周期が一定の単振動を行う。周期は質量と復元力の強さだけで決まり、振れ幅の大きさにはよらない（等時性）。"}, {"label": "共振とは", "text": "すべての物体は固有の振動数（固有振動数）を持つ。外から加える力の周期がこれと一致すると、エネルギーが効率よく注ぎ込まれ振幅がどんどん増大する——これが共振。ブランコを「タイミングよく」押すと大きく揺れるのと同じ原理。"}, {"label": "崩壊した橋の教訓", "text": "1940年のタコマナローズ橋崩壊は、風が生む渦の周期が橋の固有振動数と一致し共振で振動が増幅、構造が持たなかった例として有名（近年は空力的な不安定現象という説明が主流だが、共振の危険性を示す象徴として語られる）。"}], "relatedTopics": [{"concept": "wave-basics-wavelength-period-speed", "relation": "構成する"}, {"concept": "newtons-laws-of-motion", "relation": "関連"}, {"concept": "standing-waves-and-instruments", "relation": "はたらく相手"}], "easyHeadline": "「行ったり来たり」を支配する共通のルール", "easyBody": "バネにつけたおもりや振り子のように、元の位置に戻ろうとする力ではたらく往復運動には共通のパターンがあります。外から揺らす力のタイミングが、そのものが元々揺れたがるタイミングとぴったり合うと、揺れがどんどん大きくなっていきます(共振)。ブランコを良いタイミングで押すとどんどん高くなるのと同じ理屈です。", "referencedBy": [{"id": "standing-waves-and-instruments", "title": "定在波と楽器", "field": "physics"}, {"id": "wave-basics-wavelength-period-speed", "title": "波の基本（波長・周期・速さ）", "field": "physics"}]}, {"id": "solubility-precipitation", "title": "溶解度と沈殿", "aka": "Solubility & precipitation", "field": "chemistry", "area": "溶液と混合物", "section": "混ざりものの性質", "headline": "溶ける量には限界があり、超えると出てくる", "summary": "ある温度で溶媒に溶けられる溶質の最大量が溶解度。それを超えた分は溶けきれずに固体として現れる（析出・沈殿）。多くの固体は高温ほどよく溶け、冷やすと結晶が出る（再結晶による精製に使う）。逆に気体は高温ほど溶けにくい（炭酸飲料、川の酸素）。", "keyPoint": "鍾乳洞、腎臓結石、ボイラーの湯垢——『溶けて運ばれ、条件が変わって出てくる』の繰り返しでできている。", "body": [{"label": "過飽和", "text": "そっと冷やすと溶解度を超えても溶けたまま。刺激で一気に結晶化する（使い捨てカイロの一部）。"}, {"label": "溶解度積", "text": "難溶性の塩がどれだけ溶けるかの目安。沈殿ができるかどうかの判定に使う。"}], "relatedTopics": [{"concept": "dissolution", "relation": "なかま"}, {"concept": "concentration-mole", "relation": "関連"}, {"concept": "phase-transition", "relation": "対比"}, {"concept": "crystals-amorphous", "relation": "関連"}], "easyHeadline": "溶ける量には上限があり超えると固体として現れる", "easyBody": "ある温度で溶かせる量には限界があり、それを超えた分は溶けきれずに固体として出てきます(沈殿)。多くの固体は温度が高いほどよく溶けるので、熱いうちに溶かしてゆっくり冷やすと、余った分が結晶として出てきます。", "referencedBy": [{"id": "colloid-mixture", "title": "コロイドと混合物", "field": "chemistry"}, {"id": "dissolution", "title": "溶解", "field": "chemistry"}, {"id": "concentration-mole", "title": "濃度とモル", "field": "chemistry"}, {"id": "crystals-amorphous", "title": "結晶と非晶質", "field": "chemistry"}]}, {"id": "sound-and-doppler-effect", "title": "音とドップラー効果", "field": "physics", "area": "波・光・音", "section": "波の現象", "headline": "救急車が近づくと高く、遠ざかると低く聞こえる理由", "summary": "音は空気の密度の濃淡（疎密）が伝わる縦波。音源と観測者が近づいているときは波が押し縮められて振動数が高く（音が高く）聞こえ、遠ざかっているときは波が引き伸ばされて振動数が低く聞こえる——これがドップラー効果で、救急車のサイレンや天体の光（赤方偏移）の観測にも応用される。", "keyPoint": "ドップラー効果は「波の速さ」ではなく「観測される振動数（波長）」が変わる現象——音速そのものは変化しない。", "body": [{"label": "音は縦波（疎密波）", "text": "音源が振動すると、その振動で空気が押されて密な部分と薄い部分（疎密）が交互にでき、それが伝わっていく。真空中では伝える媒質がないため音は伝わらない。"}, {"label": "ドップラー効果のしくみ", "text": "音源が観測者に近づいていると、次の波面が前の波面より近い位置から出るため波長が実質的に縮み振動数が上がる（高い音）。遠ざかると逆に波長が伸び振動数が下がる（低い音）。音源・観測者どちらが動いても同様の効果が起きる。"}, {"label": "応用：赤方偏移", "text": "同じ原理は光にも当てはまる。銀河が地球から遠ざかっていると、そこからの光の波長が伸びて赤い方へずれて見える（赤方偏移）。この観測がハッブル・ルメートルの法則＝宇宙膨張の発見につながった。"}], "relatedTopics": [{"concept": "wave-basics-wavelength-period-speed", "relation": "関連"}, {"concept": "standing-waves-and-instruments", "relation": "関連"}], "easyHeadline": "救急車が近づくと高く、遠ざかると低く聞こえる理由", "easyBody": "音を出しているものがこちらに近づいてくると音の波が押し縮められて高い音に聞こえ、遠ざかっていくと波が伸びて低い音に聞こえます。これがドップラー効果で、救急車のサイレンだけでなく、遠くの星の光の観測にも使われています。", "referencedBy": [{"id": "standing-waves-and-instruments", "title": "定在波と楽器", "field": "physics"}, {"id": "wave-basics-wavelength-period-speed", "title": "波の基本（波長・周期・速さ）", "field": "physics"}]}, {"id": "spectroscopy-in-astronomy", "title": "スペクトルから分かること（組成・温度・運動）", "aka": "Astronomical spectroscopy", "field": "space", "area": "観測とスケール", "section": "観測とスケール", "headline": "光を虹のように分解すると、天体の正体が読み取れる", "summary": "天体からの光をプリズムなどで波長ごとに分解すると「スペクトル」と呼ばれる縞模様が得られる。この縞模様には、天体を構成する元素ごとに特有の位置に現れる暗線・輝線が刻まれており、そのパターンを調べることで、天体が何の元素でできているか、表面温度がどれくらいか、さらにはドップラー効果によるずれから天体がどんな速度で運動しているかまで分かる。分光は、直接手に取ることのできない星や銀河の中身を知るための最も基本的な手段である。", "easyHeadline": "光を虹のように分けると天体の中身が分かる", "easyBody": "星の光をプリズムで虹のように分解すると、「スペクトル」という縞模様が現れます。この模様には、その星が何の元素でできているか、どれくらい熱いか、どれくらいの速さで動いているかという情報が、まるで指紋のように刻まれています。手に取れない星の中身を知る、とても強力な方法です。", "keyPoint": "ヘリウムという元素は、地球上でまだ発見されるより先に、太陽のスペクトルの中に見慣れない暗線として1868年に発見された。名前の由来もギリシャ語の太陽神ヘリオス。", "body": [{"label": "吸収線と輝線", "text": "星の表面から出る光がその外側の薄いガス層を通過するときに特定の波長だけ吸収されると暗線（吸収線）が、逆に高温のガス自体が特定の波長で光ると輝線が現れる。"}], "relatedTopics": [{"concept": "wave-particle-duality-of-light", "relation": "関連"}, {"concept": "electromagnetic-spectrum", "relation": "構成する"}, {"concept": "redshift-recession-velocity", "relation": "技術で見る"}, {"concept": "telescope-types", "relation": "はたらく相手"}, {"concept": "exoplanet-detection", "relation": "技術で見る"}], "referencedBy": [{"id": "telescope-types", "title": "望遠鏡（可視・電波・赤外・X線・γ線）", "field": "space"}, {"id": "exoplanet-detection", "title": 弦楽器と管楽器", "text": "弦楽器は弦の長さ・張力・太さで固有振動数を、管楽器は気柱の長さ（穴の開閉やピストンで実効的な長さを変える）で固有振動数を調整して音程を作っている。"}], "relatedTopics": [{"concept": "simple-harmonic-motion-and-resonance", "relation": "はたらく相手"}, {"concept": "reflection-refraction-diffraction-interference", "relation": "原因と結果"}, {"concept": "sound-and-doppler-effect", "relation": "関連"}], "easyHeadline": "逆向きの波が重なって「揺れない点」をつくる", "easyBody": "弦や管の中では、行く波と跳ね返ってくる波が重なり合って、まったく揺れない場所とよく揺れる場所が固定されたパターンができます。弦楽器や管楽器は、この決まったパターンの振動を使って音の高さを鳴らしています。", "referencedBy": [{"id": "simple-harmonic-motion-and-resonance", "title": "単振動と共振", "field": "physics"}, {"id": "reflection-refraction-diffraction-interference", "title": "反射・屈折・回折・干渉", "field": "physics"}, {"id": "sound-and-doppler-effect", "title": "音とドップラー効果", "field": "physics"}]}, {"id": "star-formation", "title": "星の材料（分子雲と重力収縮）", "aka": "Star formation", "field": "space", "area": "恒星と銀河", "section": "星の誕生と一生", "headline": "冷たいガスの雲が自分の重さでつぶれて星になる", "summary": "宇宙空間には水素を主成分とするガスとちりが集まった「分子雲」が漂っている。この雲の中で密度が高い部分は自分自身の重力で収縮を始め、中心部の温度と圧力がどんどん上がっていく。中心温度が約1000万度に達すると水素の核融合が始まり、そこで初めて「星」と呼べる天体が誕生する。1つの分子雲から同時に多数の星が生まれることも多く、星団として観測される。", "easyHeadline": "ガスの雲がギュッと縮んで星が生まれる", "easyBody": "宇宙にはガスやちりが集まった大きな雲があります。この雲の中で少し濃いところは、自分の重さでどんどん縮んでいきます。縮むほど中心が熱くなり、ものすごい高温になると核融合という反応が始まって光り出します。これが星の誕生です。", "keyPoint": "太陽をつくったガス雲の直径はもともと太陽系よりずっと大きく、光年スケールだった。それが自分の重力だけで太陽サイズまで縮んだ。", "body": [{"label": "重力と圧力のせめぎ合い", "text": "収縮するガスは温度が上がると圧力も上がり、これが重力に対抗するブレーキになる。核融合が始まって外向きの圧力と重力が釣り合うと、星は安定した「主系列星」になる。"}, {"label": "原始惑星系円盤", "text": "回転しながら収縮する雲は中心に星を作りつつ、周囲に円盤状のガスとちりを残す。これが後に惑星の材料になる。"}], "relatedTopics": [{"concept": "nuclear-fusion-main-sequence", "relation": "原因と結果"}, {"concept": "stellar-life-by-mass", "relation": "関連"}, {"concept": "nebular-hypothesis", "relation": "なかま"}, {"concept": "universal-gravitation-and-orbits", "relation": "はたらく相手"}], "referencedBy": [{"id": "stellar-life-by-mass", "title": "星の一生は質量で決まる", "field": "space"}, {"id": "nebular-hypothesis", "title": "星雲説と太陽系の形成", 限られた種類の細胞にだけ分化できる幹細胞が残っている。この性質を利用すれば、事故や病気で失われた組織を体外で培養した幹細胞から作り直す再生医療が可能になる。日本発のiPS細胞は、すでに分化した大人の細胞に特定の遺伝子を導入することで、人工的に幹細胞に近い状態へ「巻き戻す」技術であり、倫理的な制約が大きい胚由来の幹細胞を使わずに済む点で大きな注目を集めた。幹細胞研究は、失われた臓器や組織を薬ではなく細胞そのもので治すという、医学の新しい方向性を切り開いている。", "keyPoint": "幹細胞の価値は「自己複製できる」ことと「何にでもなれる」ことの二つを同時に満たす点にある。", "body": [{"label": "分化能力の幅", "text": "受精卵に近い胚性幹細胞はほぼ全種類の細胞になれる万能性を持つのに対し、大人の組織にある幹細胞は血液細胞なら血液細胞というように、変化できる範囲が限定されている。"}, {"label": "iPS細胞という発明", "text": "山中伸弥らは皮膚などの体細胞に4つの遺伝子を導入することで、幹細胞に近い性質を人工的に持たせる方法を開発した。これにより患者自身の細胞から必要な組織を作る道が開けた。"}, {"label": "分化と細胞死のバランス", "text": "幹細胞が新しい細胞を供給し続ける一方で、古くなったり不要になったりした細胞は計画的に取り除かれる仕組みが働いており、この二つのバランスが組織の健全な入れ替わりを支えている。"}], "relatedTopics": [{"concept": "cell-cycle", "relation": "関連"}, {"concept": "apoptosis", "relation": "対比"}, {"concept": "blood-cells", "relation": "原因と結果"}, {"concept": "tissue-types", "relation": "原因と結果"}], "referencedBy": [{"id": "tissue-types", "title": "組織の4タイプ（上皮・結合・筋・神経組織）", "field": "human-body"}, {"id": "blood-cells", "title": "血球——赤血球・白血球・血小板", "field": "human-body"}]}, {"id": "stress-hormones", "title": "ストレスホルモン——アドレナリンとコルチゾール", "aka": "Stress Hormones", "field": "human-body", "area": "ホルモン", "section": "情報を血流で届ける", "headline": "「闘うか逃げるか」を体に準備させる緊急ホルモン", "summary": "危険や強いストレスを感じると、副腎という臓器からアドレナリンとコルチゾールという二つのホルモンが分泌され、体を「闘うか逃げるか」のどちらかにすぐ対応できる状態に切り替える。アドレナリンは神経系からの信号を受けて数秒で分泌され、心拍数と血圧を上げ、筋肉に優先的に血液を送ることで瞬発的な行動に備える即効型のホルモンである。一方コルチゾールは分泌までに数分から数十分かかるが、血糖値を上げてエネルギー源を確保し、免疫反応を一時的に抑えることで炎症よりも今この瞬間の危機対応を優先させる持続型のホルモンである。本来は一時的な危機を乗り切るための仕組みだが、現代人のように精神的なストレスが慢性的に続くとコルチゾールが常に高い状態が続き、血糖値の上昇や免疫力の低下、不眠などの弊害を招くことがある。", "keyPoint": "ストレスホルモンは短期決戦用の仕組みであり、慢性化すると体に負担をかける。", "body": [{"label": "アドレナリンの即効性", "text": "アドレナリンは交感神経の興奮を受けて副腎髄質から分泌され、数秒のうちに心拍数や血圧を上げて瞬発的な運動に備える。まさに緊急ボタンのような速さを持つ。"}, {"label": "コルチゾールの持続性", "text": "コルチゾールは副腎皮質から分泌され、肝臓に糖の放出を促して血糖値を上げるほか、炎症反応を抑える働きも持つ。効果が現れるまでに時間がかかる分、作用は長く続く。"}, {"label": "慢性ストレスの弊害", "text": "短期的には有用なこの仕組みも、ストレスが慢性的に続くとコルチゾールの高い状態が続き、血糖値の上昇や免疫力低下、睡眠の質の悪化につながることが知られている。"}], "rela 。", "easyHeadline": "太陽は中心で核融合を起こして光っている巨大な球", "easyBody": "太陽の中心はものすごい高温・高圧で、水素の核融合が起きています。そこで生まれたエネルギーは、何万年もかけて太陽の中を伝わり、ようやく表面から光として飛び出します。太陽の周りにはコロナという高温の大気もあり、そこから太陽風という粒子の流れが吹き出しています。", "keyPoint": "今太陽の表面から出た光は8分ちょっとで地球に届くが、その光のもとになったエネルギーは中心核で生まれてから表面に届くまでに数万年もかかっている。", "body": [{"label": "層構造", "text": "中心から核、放射層、対流層、光球、彩層、コロナの順に重なっている。層ごとにエネルギーの運ばれ方（放射か対流か）が違う。"}, {"label": "太陽風とオーロラ", "text": "太陽から吹き出す荷電粒子の流れ（太陽風）が地球の磁場に取り込まれることで、極域にオーロラが発生する。"}], "relatedTopics": [{"concept": "nuclear-fusion-main-sequence", "relation": "原因と結果"}, {"concept": "rocky-vs-gas-ice-planets", "relation": "はたらく相手"}, {"concept": "habitable-zone", "relation": "原因と結果"}, {"concept": "nebular-hypothesis", "relation": "なかま"}], "referencedBy": [{"id": "habitable-zone", "title": "ハビタブルゾーン", "field": "space"}, {"id": "asteroid-belt-comets-kuiper-oort", "title": "小惑星帯・彗星・カイパーベルト・オールトの雲", "field": "space"}, {"id": "rocky-vs-gas-ice-planets", "title": "岩石惑星とガス・氷惑星", "field": "space"}, {"id": "nebular-hypothesis", "title": "星雲説と太陽系の形成", "field": "space"}, {"id": "nuclear-fusion-main-sequence", "title": "核融合と主系列星", "field": "space"}]}, {"id": "superconductivity", "title": "超伝導", "aka": "Superconductivity", "field": "quantum", "area": "原子と物質", "section": "原子と物質", "headline": "ある温度以下に冷やすと、電気抵抗が完全にゼロになる現象", "summary": "多くの金属は、絶対零度に近い極低温まで冷やすと、電気抵抗が突然完全にゼロになる。この現象を超伝導といい、1911年に発見されたが、その量子力学的な仕組みは1957年のBCS理論で説明された。通常、電子どうしは反発しあうが、超伝導状態では結晶格子の振動を仲立ちにして電子が2個ペア（クーパー対）を作り、このペアが量子力学的な重ね合わせ状態として結晶全体をエネルギーを失うことなく流れる。超伝導体は電気抵抗ゼロの送電のほか、強力な磁場を作れる性質からMRI装置やリニアモーターカー、そして量子コンピュータの回路（超伝導量子ビット）にも利用されている。", "keyPoint": "超伝導状態では一度流し始めた電流が理論上、宇宙の年齢より長い時間ずっと減衰せずに流れ続けるとされ、実際の実験でも何年もの間、電流の減少が全く検出されなかった例がある。", "body": [{"label": "クーパー対という量子的な仕組み", "text": "個々の電子は互いに反発するはずだが、格子振動（フォノン）を介した間接的な引力によって2個の電子がペアを組み、このペアはボース粒子のようにふるまって同じ量子状態に大量に集まる（凝縮）ことができ、これが抵抗ゼロの流れを生む。"}, {"label": "量子コンピュータへの応用", "text": "現在主流の量子コンピュータの方式の一つは、超伝導状態にした微小な回路をqubit（量子ビット）として利用しており、超伝導は量子技術のハードウェアとしても重要な役割を果たしている。"}], "relatedTopics": [{"concept": "band-theory", "relation": "対比"}, {"concept": "qubit-quantum-computer", "relation": "技術で見る"}], "easyHeadline": "冷やしきると、電気が一切邪魔されずに流れ続ける", "easyBody": "電線に電気を流すと、金属の中を電子が進むときに周りとぶつかって少しずつエネルギーを失います（これが電気抵抗で、発熱の原因にもなります）。ところがある種の金属をものすごく低い温度まで冷やすと、電子が2人組の手をつないで、まるで満員電車をスイスイすり抜ける達人のように、一切邪魔されずに流れ続けるようになります。この現象が超伝導で、リニアモーターカーの強力な磁石などに使われています。", "referencedBy": [{"id": "qubit-quantum-computer", "title": "qubitと量子コンピュータ", "field": "quantum"}, {"id": "band-theory", "title": "バンド理論（導体・絶縁体・半導体）", "field": "quantum"}]}, {"id": "supernova-nucleosynthesis", "title": "超新星爆発と重元素の合成", "aka": "Supernova nucleosynthesis", "field": "space", "area": "恒星と銀河", "section": "星の誕生と一生", "headline": "星の大爆発が鉄より重い元素を宇宙にばらまく", "summary": "太陽の8倍以上重い星は、中心核で水素からヘリウム、炭素、酸素…と次々に重い元素を作る核融合を進め、最後は鉄の核ができたところで核融合が止まる。鉄はそれ以上核融合してもエネルギーを生まないため、中心核は一気に重力崩壊し、はね返りのエネルギーで星全体が吹き飛ぶ「超新星爆発」が起きる。この爆発の一瞬の高エネルギー環境で、金や銀、ウランなど鉄より重い元素の多くが作られ、宇宙空間にまき散らされる。", "easyHeadline": "星の大爆発が金やウランなどの重い元素を作る", "easyBody": "とても重い星は、中心で水素からどんどん重い元素を作っていき、最後に鉄ができると核融合が止まってしまいます。すると星は一気につぶれ、大爆発を起こします。これが超新星爆発です。この爆発のときに、金やウランのような、鉄よりもさらに重い元素が作られて宇宙にばらまかれます。", "keyPoint": "私たちの体に含まれる鉄や、指輪の金は、大昔にどこかの星が起こした超新星爆発の中で作られたもの。人体は星のかけらでできている。", "body": [{"label": "鉄の壁", "text": "鉄は原子核の中で最も安定しており、これ以上核融合させてもエネルギーを取り出せない。星の核融合が鉄で行き止まりになる理由。"}, {"label": "元素の起源の分業", "text": "水素とヘリウムはビッグバン、鉄までの元素は星の内部の核融合、鉄より重い元素は超新星爆発や中性子星合体で作られる、という分業になっている。"}], "relatedTopics": [{"concept": "stellar-life-by-mass", "relation": "原因と結果"}, {"concept": "stellar-remnants", "relation": "原因と結果"}, {"concept": "red-giant-planetary-nebula", "relation": "対比"}, {"concept": "big-bang-nucleosynthesis", "relation": "対比"}, {"concept": "gravitational-wave-observation", "relation": "関連"}], "referencedBy": [{"id": "neutrino-astronomy", "title": "ニュートリノ天文学", "field": "space"}, {"id": "stellar-life-by-mass", "title": "星の一生は質量で決まる", "field": "space"}, {"id": "stellar-remnants", "title": "白色矮星・中性子星・恒星ブラックホール", "field": "space"}, {"id": "red-giant-planetary-nebula", "title": "赤色巨星と惑星状星雲", "field": "space"}, {"id": "big-bang-nucleosynthesis", "title": "軽元素の起源（ビッグバン元素合成）", "field": "space"}, {"id": "gravitational-wave-observation", "title": "重力波観測（LIGO）", "field": "space"}]}, {"id": "superposition-schrodingers-cat", "title": "重ね合わせとシュレディンガーの猫", "aka": "Superposition / Schrödinger's cat", "field": "quantum", "area": "量子のふしぎ", "section": "量子のふしぎ", "headline": "観測するまで、粒子は複数の状態を同時に持っている", "summary": "量子力学では、観測される前の粒子は「Aの状態」と「Bの状態」のどちらか一方に決まっているのではなく、両方が同時に共存する「重ね合わせ」の状態にあると考えられる。1935年、エルヴィン・シュレディンガーは、放射性原子の崩壊（重ね合わせ状態）と連動して猫を殺す毒ガス装置を箱に入れるという思考実験を提示し、量子力学の重ね合わせをそのまま巨視的な物体（猫）に当てはめると「生きていると同時に死んでいる猫」という馬鹿げた状況が生まれてしまうと指摘した。これは重ね合わせを揶揄する批判として考案されたが、皮肉にも量子力学の不思議さを説明する最も有名なたとえ話として広まった。", "keyPoint": "シュレディンガーはこの思考実験を量子力学の正しさを示すためではなく、当時の標準的な解釈（コペンハーゲン解釈）の不備を指摘し批判するために考案した——「量子の代表的なたとえ話」が実は「反論のための皮肉」だったという逸話。", "body": [{"label": "なぜ猫自体は重ね合わせにならないのか", "text": "現代的な理解では、猫のように無数の粒子からなる巨視的な物体は周囲の環境と絶えず相互作用しており、重ね合わせがすぐに壊れてしまう（デコヒーレンス）ため、実際に猫が生死の重ね合わせ状態になることはないと考えられている。"}], "relatedTopics": [{"concept": "double-slit-experiment", "relation": "なかま"}, {"concept": "wavefunction-collapse", "relation": "なかま"}, {"concept": "decoherence", "relation": "原因と結果"}, {"concept": "measurement-problem-interpretations", "relation": "はたらく相手"}, {"concept": "qubit-quantum-computer", "relation": "技術で見る"}], "easyHeadline": "箱を開けるまで、猫は「生きていて同時に死んでいる」？", "easyBody": "箱の中に猫と、ある確率で毒ガスを出す仕掛けを入れます。量子力学のルールをそのまま当てはめると、箱を開けて確認するまで猫は「生きている」と「死んでいる」の両方が重なった状態にある、という奇妙な結論になってしまいます。もちろん実際の猫がそんな状態になることはありません。この思考実験は、電子のような小さな粒子の世界の不思議なルールを、私たちの日常の感覚とぶつけてみせた、量子力学でいちばん有名なたとえ話です。", "referencedBy": [{"id": "qubit-quantum-computer", "title": "qubitと量子コンピュータ", "field": "quantum"}, {"id": "decoherence", "title": "デコヒーレンス（なぜ日常は「古典的」か）", "field": "quantum"}, {"id": "double-slit-experiment", "title": "二重スリット実験（1粒子ずつでも干渉）", "field": "quantum"}, {"id": "measurement-problem-interpretations", "title": "測定問題と各種解釈（コペンハーゲン・多世界）", "field": "quantum"}, {"id": "wavefunction-collapse", "title": "観測による波束の収縮", "field": "quantum"}]}, {"id": "symbolic-ai-expert-systems", "title": "記号主義AIとエキスパートシステム", "aka": "Symbolic AI / Expert System / GOFAI", "field": "ai", "area": "AI史", "section": "AIの歴史", "headline": "人間の知識をルールとして明示的に書き下すAI", "summary": "記号主義AI（シンボリックAI）とは、人間の知識や思考を「もし〜ならば〜する」といった明示的なルールや記号の操作として表現し、それをコンピュータに実行させることで知的な振る舞いを実現しようとするアプローチである。現在主流のディープラーニングが大量のデータからパターンを自動的に学習するのとは対照的に、記号主義AIでは専門家が持つ知識を人手でルール化してシステムに組み込む必要がある。この考え方を実務に応用したのが1980年代に普及した「エキスパートシステム」で、医療診断や化学分析など特定分野の専門知識をルールの集合として蓄積し、質問に答える形で専門家並みの判断を再現しようとした。しかし対象となる分野が広がるほどルールの数が爆発的に増え、矛盾や保守の困難さが表面化したことに加え、明文化しにくい暗黙的な知識（常識など）を扱えないという限界があり、1990年前後の「二度目のAIの冬」の一因になった。", "keyPoint": "記号主義AIは知識を人手でルール化するアプローチで、データから自動学習する現在の機械学習とは根本的に発想が異なる。", "body": [{"label": "エキスパートシステムの実例", "text": "1970年代に開発された医療診断支援システム「MYCIN」は、感染症の診断に関する専門家のルールを数百件蓄積し、症状を入力すると推奨される治療法を提示する仕組みで、エキスパートシステムの代表例として知られる。"}, {"label": "限界と現在の機械学習との違い", "text": "ルールを人手で書き続ける方式は対象分野が広がるほど破綻しやすく、常識のような明文化しにくい知識も扱えなかったため、後にデータから自動的にパターンを学習する統計的機械学習・ディープラーニングへと主流が移っていった。"}], "relatedTopics": [{"concept": "ai-winter-history", "relation": "構成する"}, {"concept": "deep-learning-breakthrough", "relation": "対比"}, {"concept": "artificial-intelligence", "relation": "関連"}], "referencedBy": [{"id": "ai-winter-history", "title": "AIの歴史——ブームと冬の時代", "field": "ai"}]}, {"id": "symmetric-vs-asymmetric-encryption", "title": "共通鍵暗号と公開鍵暗号", "aka": "Symmetric / Asymmetric Encryption", "field": "computer", "area": "暗号", "section": "安全に伝える仕組み", "headline": "同じ鍵か、対になる鍵かという発想の違い", "summary": "暗号には大きく分けて2つの方式がある。「共通鍵暗号」は暗号化と復号に同じ鍵を使う方式で、処理が速い反面、通信する両者が事前に同じ鍵を安全に共有しておく必要があるという難点を持つ。一方「公開鍵暗号」は、誰に公開してもよい「公開鍵」と本人だけが持つ「秘密鍵」という数学的に対になった2つの鍵を使い、公開鍵で暗号化したデータは対応する秘密鍵でしか復号できない仕組みを使うことで、事前に鍵を共有する問題を解決する。ただし公開鍵暗号は計算量が多く速度が遅いため、実際のインターネット通信の多くは、まず公開鍵暗号で共通鍵を安全に受け渡し、その後の本格的なやり取りは高速な共通鍵暗号で行うという、両者を組み合わせたハイブリッド方式を採用している。", "keyPoint": "共通鍵は速いが鍵の受け渡しが難しく、公開鍵は鍵配布の問題を解くが計算が重いため、両者は組み合わせて使われる。", "body": [{"label": "鍵配送問題という壁", "text": "共通鍵暗号では、遠く離れた相手と安全に同じ鍵を共有する方法自体が大きな課題（鍵配送問題）になる。もし鍵そのものを平文で送ってしまえば、途中で盗み見られたときに暗号の意味がなくなってしまう。"}, {"label": "数学的な非対称性", "text": "公開鍵暗号は、大きな数の素因数分解のように「片方向には簡単だが逆方向は極めて困難」な数学的性質を利用して、公開鍵と秘密鍵の対を作り出している。この非対称性こそが、鍵を公開しても安全性が保たれる理由である。"}], "relatedTopics": [{"concept": "hash-functions", "relation": "なかま"}, {"concept": "digital-signatures-tls", "relation": "構成する"}, {"concept": "http-web-protocol", "relation": "はたらく相手"}], "referencedBy": [{"id": "digital-signatures-tls", "title": "デジタル署名とTLS", "field": "computer"}, {"id": "hash-functions", "title": "ハッシュ関数——一方向の指紋", "field": "computer"}, {"id": "blockchain-basics", "title": "ブロックチェーンの基本構造", "field": "computer"}, {"id": "quantum-algorithms", "title": "量子アルゴリズム（ショア・グローバー）", "field": "quantum"}, {"id": "quantum-cryptography", "title": "量子暗号（BB84・量子鍵配送）", "field": "quantum"}]}, {"id": "tcp-ip-basics", "title": "TCP/IP——インターネットの共通言語", "aka": "TCP/IP", "field": "computer", "area": "ネットワーク", "section": "つながる仕組み", "headline": "住所で届け、順番を保証する二層の約束", "summary": "インターネット上で世界中のコンピュータが会話できるのは、すべての機器が「TCP/IP」という共通の通信ルール（プロトコル）に従っているからである。IP（インターネットプロトコル）は各コンピュータに「IPアドレス」という住所を割り当て、データを小さな塊（パケット）に分けて宛先まで届ける役割を担うが、途中で順番が入れ替わったり届かなかったりすることを気にしない「ベストエフォート」な仕組みである。その上に乗るTCP（伝送制御プロトコル）は、パケットが届いたかを確認し、抜け落ちがあれば再送し、正しい順序に並べ直すことで、IPの「気にしない」部分を補い、信頼できる通信を実現する。この2つが役割分担することで、世界中の多種多様な機器がつながる巨大なネットワークが成立している。", "keyPoint": "IPが住所を頼りにパケットを届け、TCPがその抜け漏れや順序を保証するという二段構えになっている。", "body": [{"label": "パケットに分けて送る理由", "text": "大きなデータをそのまま送ると回線を長時間占有してしまうため、TCP/IPは小さなパケットに分割して送り出す。パケットはそれぞれ別々の経路を通ることもあり、受信側で正しい順番に組み立て直される。"}, {"label": "階層で役割を分ける発想", "text": "TCP/IPは複数の層（レイヤー）に分かれており、それぞれの層が自分の担当だけに集中する設計になっている。この階層構造のおかげで、下の層（配線や無線の方式）が変わっても、上の層のアプリケーションは影響を受けずに動き続けられる。"}], "relatedTopics": [{"concept": "internet-origin", "relation": "原因と結果"}, {"concept": "dns-how-it-works", "relation": "はたらく相手"}, {"concept": "http-web-protocol", "relation": "構成する"}, {"concept": "telegraph-telephone", "relation": "対比"}], "referencedBy": [{"id": "dns-how-it-works", "title": "DNS——名前を住所に変える", "field": "computer"}, {"id": "http-web-protocol", "title": "HTTPとウェブの仕組み", "field": "computer"}]}, {"id": "technology-enables-science", "title": "技術が科学を進める", "aka": "Instrument-driven science", "field": "technology", "area": "科学と技術のあいだ", "section": "変遷の型", "headline": "新しい道具が、新しい発見の扉を開く", "summary": "科学と技術の関係は一方通行ではない。望遠鏡がなければガリレオは木星の衛星を見られず、顕微鏡がなければ細胞は発見されなかった。X線回折装置がなければDNAの二重らせんは分からず、次世代シーケンサーがなければヒトゲノム計画は10年で終わらなかった。「見る・測る・計算する」道具の性能が上がるたびに、それまで原理的に見えなかった現象が見えるようになり、新しい科学の扉が開く。逆に言えば、多くの科学的停滞は理論の限界ではなく、道具の限界によって生じている。", "keyPoint": "「何が見えるか」は「どんな道具を持っているか」で決まる。", "body": [{"label": "代表例", "text": "望遠鏡→天文学、顕微鏡→細胞生物学、X線回折→分子構造、シーケンサー→ゲノム科学、加速器→素粒子物理学。"}], "relatedTopics": [{"concept": "science-to-technology", "relation": "なかま"}, {"concept": "microscope", "relation": "関連"}, {"concept": "xray-crystallography", "relation": "関連"}, {"concept": "dna-sequencing", "relation": "関連"}], "referencedBy": [{"id": "artificial-intelligence", "title": "人工知能（AI）", "field": "technology"}, {"id": "science-to-technology", "title": "科学が技術になるとき", "field": "technology"}, {"id": "microscope", "title": "顕微鏡", "field": "technology"}]}, {"id": "telegraph-telephone", "title": "電信と電話", "aka": "Telegraph & telephone", "field": "technology", "area": "伝える技術", "section": "情報を複製し、送る", "headline": "電気信号で、声より速く言葉を届けた", "summary": "1837年にモールスが実用化した電信は、電流のオン・オフ（モールス符号）で文字情報を電線越しに一瞬で送る技術。それまで手紙で数日かかっていた連絡が、大陸間ですら数分になった。1876年にベルが実用化した電話は、音声そのものを電気信号（振動→電流の変化）に変換して送る技術で、符号を覚えなくても誰でも使えるようにした。どちらも電磁気学という基礎科学（電流・電磁誘導）を、遠隔通信という具体的な用途に落とし込んだ最初期の例であり、のちのラジオ・テレビ・インターネットに続く「電気で情報を送る」系譜の起点。", "keyPoint": "電信＝符号を送る、電話＝声そのものを送る。どちらも「電気で距離を消す」発明。", "body": [{"label": "社会への影響", "text": "大陸横断電信線・海底ケーブルにより、株価や戦況がほぼリアルタイムで世界規模に伝わるようになった。"}], "relatedTopics": [{"concept": "movable-type-printing", "relation": "なかま"}, {"concept": "internet-origin", "relation": "原因と結果"}, {"concept": "electric-generator-grid", "relation": "関連"}], "year": 1837, "yearLabel": "1837〜1876年（電信→電話）", "referencedBy": [{"id": "tcp-ip-basics", "title": "TCP/IP——インターネットの共通言語", "field": "computer"}, { 論上の上限がある", "summary": "熱機関（エンジン）は高温源から熱を受け取り、その一部を仕事に変え、残りを低温側に捨てる装置。熱力学第二法則により、受け取った熱をすべて仕事に変換すること（効率100%）は原理的に不可能で、高温と低温の温度差が大きいほど理論上の最大効率（カルノー効率）も高くなる。この「一部は必ず捨てなければならない」という制約が、自動車エンジン・発電所・冷蔵庫などあらゆる熱機関の限界を決めている。", "keyPoint": "熱を100%仕事に変えられる魔法のエンジンは物理法則そのものに反するので、どんなに技術が進歩しても実現しない。", "body": [{"label": "なぜ100%にできないか", "text": "熱を全部仕事に変えてしまうと、系のエントロピーが減ってしまい第二法則に反する。"}, {"label": "冷蔵庫は熱機関の逆回し", "text": "仕事を投入して、低温側から高温側へ熱を汲み上げる装置。"}], "relatedTopics": [{"concept": "thermodynamics-first-law", "relation": "はたらく相手"}, {"concept": "entropy-and-irreversibility", "relation": "構成する"}], "easyHeadline": "熱を仕事に変える効率には、超えられない上限がある", "easyBody": "エンジンは熱の一部を動く力(仕事)に変えて、残りは必ず外に捨てています。受け取った熱を100%すべて仕事に変えることは、物理法則そのものによって不可能とされていて、どんなに技術が進んでも一部は必ず捨てなければなりません。", "referencedBy": [{"id": "engine-mechanism", "title": "エンジンの仕組み", "field": "mechanisms"}, {"id": "entropy-and-irreversibility", "title": "エントロピーと不可逆性", "field": "physics"}, {"id": "heat-transfer-modes", "title": "熱の伝わり方（伝導・対流・放射）", "field": "physics"}, {"id": "thermodynamics-first-law", "title": "熱力学第一法則", "field": "physics"}, {"id": "science-to-technology", "title": "科学が技術になるとき", "field": "technology"}, {"id": "steam-engine", "title": "蒸気機関", "field": "technology"}]}, {"id": "thermochemistry-enthalpy", "title": "反応熱とエンタルピー", "aka": "Thermochemistry / enthalpy", "field": "chemistry", "area": "エネルギーと自発性", "section": "熱の出入り", "headline": "反応熱は、切れた結合と生じた結合の差し引き", "summary": "化学反応では結合の組み替えとともに熱が出入りする。結合を切るにはエネルギーが要り、結合ができるとエネルギーが出る。生成物の結合の方が安定（低エネルギー）なら、差額が熱として放出される（発熱反応）。逆なら周囲から熱を吸う（吸熱反応）。この熱の出入りをエンタルピー変化ΔHで表す。", "keyPoint": "ヘスの法則：反応熱は途中の経路によらず、出発物質と生成物だけで決まる。だから測りにくい反応熱も足し算・引き算で求められる。", "body": [{"label": "燃焼熱と結合エネルギー", "text": "燃料の発熱量は、C−H・C−CをO=C=O・O−Hに組み替えた収支。"}, {"label": "保存則", "text": "エネルギーは形を変えるだけ（熱力学第一法則）。化学エネルギー ⇄ 熱・光・電気。"}], "relatedTopics": [{"concept": "chemical-reaction", "relation": "はたらく相手"}, {"concept": "combustion", "relation": "関連"}, {"concept": "entropy", "relation": "なかま"}, {"concept": "gibbs-free-energy" 化・不活化した病原体やその一部を体に注射することで、実際に感染する前に免疫システムに「これが敵だ」と覚えさせる技術である。獲得免疫は一度出会った病原体の特徴を記憶細胞として長く保持する性質を持つため、ワクチンによる疑似的な出会いのあとにも本物の記憶が形成される。そのため、実際にその病原体に感染したときには、初めて出会うよりもずっと速く強力に抗体や免疫細胞が動員され、症状が出る前、あるいは軽い症状のうちに病原体を排除できる。この仕組みが確立されたのは19世紀、ジェンナーの種痘とパスツール・コッホによる細菌説の確立がきっかけであり、それ以来ワクチンは天然痘の根絶をはじめ数々の感染症の被害を劇的に減らしてきた。ワクチンの効果は「病気を治す」のではなく「病気にかかる前に免疫を鍛えておく」という予防の発想に基づいている。", "keyPoint": "ワクチンが利用しているのは、免疫が一度出会った相手を記憶するという獲得免疫の性質そのものである。", "body": [{"label": "記憶を作るという発想", "text": "ワクチンに含まれる弱毒化・不活化した病原体成分は、実際の病気を起こす力は持たないが、免疫細胞に「敵の特徴」を覚えさせるには十分な刺激を与える。"}, {"label": "二度目の反応の速さ", "text": "記憶細胞ができたあとに本物の病原体が侵入すると、初めての感染時よりもはるかに速く抗体が作られ、症状が出る前に病原体を排除できることが多い。"}, {"label": "細菌説という土台", "text": "ワクチンの仕組みが科学的に整理されたのは、パスツールやコッホが病気の原因が目に見えない微生物であることを実証した細菌説の確立以降である。"}], "relatedTopics": [{"concept": "germ-theory-vaccines", "relation": "関連"}, {"concept": "innate-vs-adaptive-immunity", "relation": "原因と結果"}, {"concept": "immune-cell-lineup", "relation": "はたらく相手"}, {"concept": "antibody", "relation": "関連"}], "referencedBy": [{"id": "autoimmune-allergy", "title": "自己免疫とアレルギー——免疫の暴走", "field": "human-body"}, {"id": "innate-vs-adaptive-immunity", "title": "自然免疫と獲得免疫", "field": "human-body"}]}, {"id": "vascular-tissue", "title": "維管束——水と養分を運ぶパイプ", "aka": "Vascular tissue (xylem & phloem)", "field": "biology", "area": "植物", "section": "光合成する生き物", "headline": "植物を大型化させた、水と栄養分を運ぶ内部の配管", "summary": "維管束とは、植物体の中を通る水や養分の輸送路のことで、根で吸った水を上へ運ぶ「道管（木部）」と、葉で作られた糖などの養分を全身に配る「師管（篩部）」の2種類の管からなる。維管束を持たないコケ植物は体の隅々まで水を行き渡らせる手段が乏しく、背丈を高くできないが、維管束を獲得したシダ植物以降の植物は、体を支える構造とあわせて数十メートルの高さまで成長できるようになった。維管束はいわば植物版の血管であり、光合成を行う葉と、水を吸う根という離れた場所をつなぐことで、器官どうしの分業を可能にしている。", "keyPoint": "維管束の獲得こそが、植物が「背が高くなれる」ようになった最大の技術革新である。", "body": [{"label": "道管と師管の役割分担", "text": "道管は主に死んだ細胞の壁だけが残った管で、根からの水と溶けたミネラルを一方向（上向き）に運ぶ。師管は生きた細胞からなり、葉で作られた光合成産物を、必要としている根や成長点など全身のあらゆる方向へ配分する。"}, {"label": "高さの獲得と競争", "text": "維管束と木質化した組織による体の支えがあってはじめて、植物は他の植物より高く葉を広げて日光を独占する「背比べ」の競争に参加できるようになった。森林の階層構造はこの競争の結果である。"}], "relatedTopics": [{"concept": "plant- の卵（羊膜卵）を獲得したことで、水場から完全に独立して陸上で繁殖できるようになった。"}, {"label": "恒温性という二度の発明", "text": "鳥類と哺乳類はそれぞれ独立に、体温を一定に保つ恒温性を獲得した。これは代謝コストが高い一方、気温に左右されず活動できるという大きな利点をもたらし、寒冷地への進出や夜間活動を可能にした。"}], "relatedTopics": [{"concept": "invertebrate-diversity", "relation": "対比"}, {"concept": "warm-cold-blooded", "relation": "関連"}, {"concept": "common-ancestry-phylogeny", "relation": "関連"}, {"concept": "animal-body-plans", "relation": "構成する"}], "referencedBy": [{"id": "animal-body-plans", "title": "体制の基本——対称性と体腔", "field": "biology"}, {"id": "warm-cold-blooded", "title": "恒温動物と変温動物", "field": "biology"}, {"id": "invertebrate-diversity", "title": "無脊椎動物の多様性", "field": "biology"}]}, {"id": "virtualization-containers", "title": "仮想化とコンテナ", "aka": "Virtualization / Containers", "field": "computer", "area": "クラウド", "section": "クラウドの考え方", "headline": "1台の機械の中に複数の環境を作る技術", "summary": "仮想化とは、1台の物理的なコンピュータの上に、ソフトウェアによって複数の独立した「仮想マシン」を作り出す技術で、それぞれの仮想マシンはあたかも別々のコンピュータのように、独自のOSを持って動くことができる。これにより1台のサーバーで複数の異なる用途のシステムを同時に安全に動かせるようになり、クラウドの効率的な資源配分を支えている。近年ではさらに軽量な「コンテナ」という技術が普及しており、コンテナはOSそのものは1つだけを共有しつつ、アプリケーションの実行環境（必要なライブラリや設定）だけを分離する方式で、仮想マシンより起動が速く軽量に多数の環境を並べられる。この「環境をまるごと切り分ける」という発想は、開発したアプリを「自分のパソコンでは動くのに本番サーバーでは動かない」という問題を減らす効果もあり、現代のソフトウェア開発で広く使われている。", "keyPoint": "仮想マシンはOSごと分離し、コンテナはOSを共有しつつ実行環境だけを軽量に分離する。", "body": [{"label": "仮想マシンの仕組み", "text": "ハイパーバイザーと呼ばれるソフトウェアが物理的なハードウェア資源を仮想的に分割し、各仮想マシンに専用のCPU・メモリ・ディスクがあるかのように見せかける。この仕組みにより、1台のサーバー上でWindowsとLinuxを同時に動かすといったことも可能になる。"}, {"label": "コンテナの軽さの理由", "text": "コンテナはOSのカーネルを複数の環境で共有するため、仮想マシンのようにOSを丸ごと起動する必要がなく、数秒で立ち上げられるほど軽量になる。この軽さは、必要に応じて環境を素早く増減させたいクラウド環境と特に相性が良い。"}], "relatedTopics": [{"concept": "cloud-computing-basics", "relation": "構成する"}, {"concept": "memory-virtualization", "relation": "技術で見る"}, {"concept": "os-role-kernel", "relation": "はたらく相手"}], "referencedBy": [{"id": "os-role-kernel", "title": "OSの役割——カーネルとプロセス管理", "field": "computer"}, {"id": "cloud-computing-basics", "title": "クラウドコンピューティングとは", "field": "computer"}, {"id": "memory-virtualization", "title": "メモリ管理と仮想化", "field": "computer"}]}, {"id": "virus-nature", "title": "ウイルスとは何か——生物か非生物か", "aka": "What is a virus?", "field": "biology", "area": "菌類", "section": "分解者と共生者", "headline": "自分では増えられない、生物と非生物の境界にいる存在", "summary": "ウイルスは、遺伝情報（DNAまたはRNA）をタンパク質の殻（カプシド）が包んだだけの、非常に単純な構造をしている。自分自身では代謝もできず、エネルギーも作れず、増殖するための仕組みも持たないため、必ず宿主となる生きた細胞に侵入し、その細胞の複製装置を乗っ取ることで初めて自分のコピーを作ることができる。この「自力では何もできないが、細胞に入ると爆発的に増える」という性質のために、ウイルスを生物とみなすか非生物とみなすかは今も意見が分かれている。一方で、地球上に存在する生物の細胞数よりもウイルス粒子の数の方がはるかに多いと推定されており、ウイルスは病気の原因であるだけでなく、進化の歴史の中で宿主の遺伝子に入り込み、生物の進化そのものにも影響を与え続けてきた存在でもある。", "keyPoint": "ウイルスは「自分だけでは生きられないが、細胞の中に入ると生命のように振る舞う」という、生物の定義そのものを揺さぶる存在である。", "body": [{"label": "宿主の仕組みを乗っ取る", "text": "ウイルスは自前の代謝系やリボソーム（タンパク質を作る装置）を持たないため、感染した細胞のセントラルドグマの仕組みをそのまま借りて、自分の遺伝情報をコピーさせ、自分のタンパク質を作らせる。"}, {"label": "生物か非生物かの論争", "text": "ウイルスは細胞構造を持たず単独では代謝も増殖もできない点で非生物的だが、遺伝情報を持ち、それが変異・選択を受けて進化する点では生物的である。この中間的な性質のため、生物学の教科書でも「生物と非生物の境界にある存在」として扱われることが多い。"}], "relatedTopics": [{"concept": "central-dogma", "relation": "関連"}, {"concept": "rna-world-noncoding", "relation": "関連"}, {"concept": "prion", "relation": "対比"}, {"concept": "bacteria-archaea", "relation": "対比"}], "referencedBy": [{"id": "bacteria-archaea", "title": "細菌と古細菌——見えない生命の大部分", "field": "biology"}, {"id": "fungi-classification", "title": "菌類とは何か——動物でも植物でもない生き物", "field": "biology"}]}, {"id": "vitamins-and-minerals", "title": "ビタミンとミネラル", "aka": "Vitamins and minerals", "field": "food", "area": "食の歴史と栄養学", "section": "栄養学の基礎", "headline": "微量でも欠かせない、体の潤滑油のような栄養素", "summary": "ビタミンとミネラルはエネルギー源にはならないが、酵素の働きを助けたり骨や血液をつくったりと、体の機能を正しく動かすために微量ながら必須の栄養素。ビタミンは炭素を含む有機化合物で、体内でほとんど合成できないため食べ物からとる必要がある(例外はビタミンDで、皮膚で日光を浴びてつくれる)。ミネラルはカルシウムや鉄、ナトリウムといった無機質の元素そのもので、骨の材料になったり、酵素の構造を保ったり、神経の電気信号(イオンの出入り)を支えたりする。「微量栄養素」と呼ばれるのはこの2つで、三大栄養素(マクロ栄養素)と対になる考え方。", "keyPoint": "ビタミン・ミネラルはエネルギー源ではなく、体の化学反応を「動かす歯車の潤滑油」として働く。", "body": [{"label": "水溶性と脂溶性", "text": "ビタミンC・B群は水に溶けやすく余分は尿で排出されるが、ビタミンA・D・E・Kは脂に溶けやすく体に蓄積するため、とりすぎ(過剰症)にも注意が必要。"}, {"label": "ミネラルは分解されない", "text": "ビタミンは加熱や酸化で壊れることがあるが、ミネラルは元素そのものなので調理で壊れることはなく、水に溶け出すかどうかだけが問題になる。"}], "relatedTopics": [{"concept": "deficiency-diseases-history", "relation": "原因と結果"}, {"concept": "enzyme", "relation": "はたらく相手"}, {"concept": "macronutrients-and-calories", "relation": "対比"}], "easyHeadline": "ビタミン・ミネラルは、体の仕組みを動かす縁の下の力持ち", "easyBody": "ビタミンとミネラルはエネルギーにはなりませんが、酵素の働きを助けたり骨や血をつくったりする、体に欠かせない栄養素です。ビタミンは体でほとんど作れないため食べ物からとる必要があり、ミネラルは鉄やカルシウムのような元素そのものです。", "referencedBy": [{"id": "deficiency-diseases-history", "title": "欠乏症が切り開いた栄養学", "field": "food"}]}, {"id": "warm-cold-blooded", "title": "恒温動物と変温動物", "aka": "Endotherm & ectotherm", "field": "biology", "area": "動物", "section": "動物の分類とからだ", "headline": "体温を自分で作るか環境任せかという生存戦略の分かれ道", "summary": "恒温動物（内温動物）は代謝によって自分で熱を作り、周囲の気温が変化してもほぼ一定の体温を保つ。鳥類と哺乳類がこれにあたる。一方、変温動物（外温動物）は日光浴や物陰への移動など行動によって体温を調整し、気温に応じて体温も代謝も上下する。爬虫類・両生類・魚類・ほとんどの無脊椎動物がここに含まれる。恒温性は寒冷地でも活発に動けるという利点があるが、体温を保つために大量のエネルギー（食物）を消費し続ける必要があり、変温動物は逆に少ない食料で生き延びられる代わりに気温が下がると動きが鈍くなるという特性を持つ。", "keyPoint": "恒温性は「いつでも動ける自由」と引き換えに「大量に食べ続ける義務」を背負う進化的トレードオフである。", "body": [{"label": "エネルギー収支の違い", "text": "恒温動物は摂取エネルギーの大半を体温維持に使うため、同程度の体格の変温動物に比べて何倍もの食物を必要とする。逆に変温動物は代謝を低く抑えられるぶん、食料が乏しい環境や飢餓に強いという利点がある。"}, {"label": "細胞レベルの裏付け", "text": "体温を作り出す元手になっているのは、細胞内のミトコンドリアが行う代謝で発生する熱であり、恒温動物では熱産生そのものを高める仕組みが発達している。"}], "relatedTopics": [{"concept": "vertebrate-classification", "relation": "関連"}, {"concept": "mitochondria-atp", "relation": "はたらく相手"}, {"concept": "mass-extinction", "relation": "関連"}], "referencedBy": [{"id": "mass-extinction", "title": "大量絶滅——生命史の転換点", "field": "biology"}, {"id": "vertebrate-classification", "title": "脊椎動物の分類", "field": "biology"}]}, {"id": "wave-basics-wavelength-period-speed", "title": "波の基本（波長・周期・速さ）", "field": "physics", "area": "波・光・音", "section": "振動と波", "headline": "波を特徴づける3つの数字", "summary": "波は「振動が空間を伝わる現象」で、山から山までの長さ（波長）・1回振動する時間（周期、または1秒間の振動回数=振動数）・波が進む速さの3つの量で特徴づけられる。これらは「速さ＝波長×振動数」という1本の式で結ばれ、音・光・水面波などあらゆる波に共通する。", "keyPoint": "波が運ぶのは「物質」ではなく「エネルギーと形（振動のパターン）」——媒質の各点はその場で振動するだけ。", "body": [{"label": "横波と縦波", "text": "振動の向きが進行方向に垂直なら横波（光・水面波・弦の波）、進行方向と同じなら縦波（音波、疎密波）。媒質の各点自体は大きく移動せず、その場で振動を繰り返すだけで波形だけが進む。"}, {"label": "速さ＝波長×振動数", "text": "波長λ（1回の振動が占める空間の長さ）と振動数f（1秒あたりの振動回数）をかけると波の速さvになる（v=fλ）。同じ速さの波なら波長が長いほど振動数は小さい、というトレードオフがある。"}, {"label": "媒質と速さ", "text": "波の速さは基本的に伝わる媒質（空気・水・弦の張力など）で決まり、振動数を変えても速さは変わらない（波長の方が変わる）。光だけは真空中でも伝わり、真空中の速さは常に一定（光速）という特別な性質を持つ。"}], "relatedTopics": [{"concept": "simple-harmonic-motion-and-resonance", "relation": "構成する"}, {"concept": "sound-and-doppler-effect", "relation": "なかま"}, {"concept": "electromagnetic-spectrum", "relation": "なかま"}], "easyHeadline": "波を特徴づける3つの数字(長さ・時間・速さ)", "easyBody": "波には、山から山までの長さ(波長)、1回揺れるのにかかる時間(周期)、波が進む速さという3つの基本の数字があります。この3つは決まった式で結びついていて、音でも光でも水面の波でも同じルールが成り立ちます。", "referencedBy": [{"id": "simple-harmonic-motion-and-resonance", "title": "単振動と共振", "field": "physics"}, {"id": "reflection-refraction-diffraction-interference", "title": "反射・屈折・回折・干渉", "field": "physics"}, {"id": "electromagnetic-spectrum", "title": "電磁波スペクトル", "field": "physics"}, {"id": "sound-and-doppler-effect", "title": "音とドップラー効果", "field": "physics"}]}, {"id": "wave-particle-duality-of-light", "title": "光は波か粒子か", "field": "physics", "area": "波・光・音", "section": "光", "headline": "光は波なのか、粒なのか——両方である", "summary": "干渉・回折という現象は光が「波」であることを示すが、光電効果（光を当てると金属から電子が飛び出す現象）はエネルギーの塊＝「粒子（光子）」としての性質を示す。20世紀初頭、光は状況に応じて波にも粒子にもふるまう「波と粒子の二重性」を持つことが明らかになり、これが量子力学誕生のきっかけになった。", "keyPoint": "光電効果では、光の「強さ」ではなく「振動数（色）」が電子の飛び出しやすさを決める——これは光が波なら説明できず、光子1個ずつのエネルギーで説明するしかない。", "body": [{"label": "光が波である証拠", "text": "ヤングの二重スリット実験で見られる干渉縞は、光が重なり合って強め合ったり弱め合ったりする波の性質そのもの。19世紀にはマクスウェルの電磁気学で光は電磁波だと理論的にも確立した。"}, {"label": "光が粒子である証拠（光電効果）", "text": "金属に光を当てると電子が飛び出す現象で、電子が飛び出すかどうかは光の強さではなく振動数（色）で決まり、振動数が低いとどれだけ強い光を当てても電子は出ない。アインシュタインは光がエネルギーの決まった塊「光子」の集まりだと考えることでこれを説明し、後にノーベル賞を受けた。"}, {"label": "二重性の受け入れ", "text": "波としての性質（干渉・回折）と粒子としての性質（光電効果、決まったエネルギーの塊）は、日常の感覚では矛盾するが、光は状況に応じてどちらの姿も見せる。この二重性は後に電子など「粒子」とされてきたものにも見つかり（ド・ブロイの物質波）、量子力学全体の出発点になった。"}], "relatedTopics": [{"concept": "reflection-refraction-diffraction-interference", "relation": "関連"}, {"concept": "electromagnetic-spectrum", "relation": "関連"}, {"concept": "atom-structure", "relation": "関連", "note": "光と原子の相互作用の理解が量子力学の原子模型につながった"}], "easyHeadline": "光は波なのか、粒なのか——実は両方の顔を持つ", "easyBody": "光は、重なり合って強め合ったり弱め合ったりする「波」らしい性質を見せる一方で、金属に当てると電子を弾き飛ばすという「粒」らしい性質も見せます。20世紀の初め、光はどちらか一方ではなく両方の性質を持つことが分かり、これが量子力学という新しい物理学の始まりになりました。", "referencedBy": [{"id": "spectroscopy-in-astronomy", "title": "スペクトルから分かること（組成・温度・運動）", "field": "space"}, {"id": "de-broglie-matter-waves", "title": "ド・ブロイの物質波", "field": "quantum"}, {"id": "photoelectric-effect", "title": "光電効果とアインシュタインの光量子", "field": "quantum"}, {"id": "reflection-refraction-diffraction-interference", "title": "反射・屈折・回折・干渉", "field": "physics"}, {"id": "electromagnetic-spectrum", "title": "電磁波スペクトル", "field": "physics"}]}, {"id": "wavefunction-collapse", "title": "観測による波束の収縮", "aka": "Wavefunction collapse", "field": "quantum", "area": "波と粒子", "section": "波と粒子", "headline": "観測した瞬間、複数の可能性は1つの結果に絞り込まれる", "summary": "観測される前の粒子は、波動関数によって表される複数の可能性が同時に重なり合った状態（重ね合わせ）にあると考えられる。しかし、その粒子の位置やエネルギーなどを実際に観測すると、波動関数はその瞬間に1つの確定した結果へと瞬時に切り替わる。この変化を「波束の収縮」と呼ぶ。収縮がなぜ、どのように起きるのかは量子力学の数式そのものからは説明されておらず、この謎は「測定問題」として今も物理学・哲学の両面で議論が続いている。", "keyPoint": "波束の収縮は量子力学の方程式（シュレディンガー方程式）そのものには含まれておらず、観測という行為が起きたときに「後付け」で適用される規則にすぎない——これが測定問題の核心にある違和感の一つ。", "body": [{"label": "収縮はなぜ謎なのか", "text": "シュレディンガー方程式に従う限り波動関数の変化は滑らかで決定論的だが、観測の瞬間だけ突然、確率的かつ不連続な変化（収縮）が起きるように見える。この2つの異なるふるまいがなぜ・どこで切り替わるのかについて、物理学者の間でも統一見解は存在しない。"}], "relatedTopics": [{"concept": "double-slit-experiment", "relation": "原因と結果"}, {"concept": "wavefunction-probability", "relation": "原因と結果"}, {"concept": "measurement-problem-interpretations", "relation": "なかま"}, {"concept": "decoherence", "relation": "対比"}, {"concept": "superposition-schrodingers-cat", "relation": "なかま"}], "easyHeadline": "見た瞬間、あいまいだったものが1つに決まる", "ea function areasOf(fid, items) {
  const declared = Object.keys(STRUCTURE[fid] || {});
  const extra = [...new Set(items.filter(r => r.field === fid).map(r => r.area).filter(Boolean))].filter(a => !declared.includes(a));
  return [...declared, ...extra];
}
function sectionsOf(fid, area, rows) {
  const declared = STRUCTURE[fid] && STRUCTURE[fid][area] || [];
  const extra = [...new Set(rows.map(r => r.section).filter(Boolean))].filter(s => !declared.includes(s));
  return [...declared, ...extra];
}

const AREA_GUIDE = {
  "遺伝子とゲノム": "遺伝子研究の出発点は、遺伝情報を担う分子そのものの形——相補的な2本鎖が寄り添う{{dna-structure}}(DNAの二重らせん)にある。この二重らせんを支えているのが、決まった相手としか結びつかない{{base-pairing}}(塩基対と相補性)というルールで、複製と読み出し両方の土台になっている。ヒトの細胞1個に約2mも入っているDNAは、ヒストンに巻きつけて階層的に折りたたむ{{chromosome-chromatin}}(染色体とクロマチン)という仕組みで核に格納され、細胞分裂の前には2本鎖をほどいてそれぞれを鋳型に新しい鎖を作る{{dna-replication}}(DNA複製)によって情報がそっくりコピーされる。\n\n情報が実際に使われる段階では、「DNA→RNA→タンパク質」という一方向の流れを示す{{central-dogma}}(セントラルドグマ)が全体の地図になる。最初のステップが必要な遺伝子だけをRNAに書き写す{{transcription}}(転写)で、どの遺伝子をいつオンにするかを制御するのが{{gene-regulation}}(遺伝子発現の調節)——全細胞が同じゲノムを持ちながら別々の細胞になれる理由はここにある。配列を変えずに遺伝子のオン/オフを記憶する{{epigenetics}}(エピジェネティクス)がこの調節に長期的な“付箋”を加え、RNAが単なる運び屋にとどまらず道具やスイッチとしても働くという{{rna-world-noncoding}}(RNAの多様な顔)が、セントラルドグマの矢印だけでは捉えきれない奥行きを見せる。\n\n最後はDNAを人間の手で操作・観察する技術群。1本の配列を数時間で数十億本に増やす{{pcr}}(PCR)が土台となり、増やした配列を端から読む{{dna-sequencing}}(DNAシーケンシング)でゲノムの中身がわかるようになった。別々の生物のDNAをつなぎ細胞に運び込む{{recombinant-dna}}(組換えDNA)で遺伝子を「移植」できるようになり、その延長線上に、細菌の免疫システムを借りてゲノムの狙った場所だけを切る{{crispr}}(CRISPR-Cas9)という自在な書き換え技術が登場した。",
