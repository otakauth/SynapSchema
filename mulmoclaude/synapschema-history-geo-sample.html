登録", "ouv": "(i)人類の創造的才能を示す傑作。イスラーム建築とインドの職人技が結晶した比類なき記念建造物。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Taj_Mahal_%28Edited%29.jpeg/960px-Taj_Mahal_%28Edited%29.jpeg", "imageCredit": "Yann（Jim Carter 補正）/ CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Taj_Mahal_(Edited).jpeg"}, {"id": "tang-dynasty", "title": "唐と東アジア世界", "domain": "世界史", "region": "東アジア", "headline": "律令官僚制を完成させ、長安を人口100万の国際都市とした", "startYear": 618, "endYear": 907, "eraLabel": "7〜10世紀", "summary": "618年に隋を継いだ唐は、律令・均田制・府兵制・科挙・大運河という隋の遺産を完成形にまとめた。太宗の貞観の治で東突厥を服属させ、高宗の代に西域・朝鮮半島へ広がる。都・長安は碁盤目状の計画都市で人口100万、ペルシア人・ソグド人・新羅人・日本人が住む国際都市だった。唐は周辺国と冊封関係を結び、そのネットワークが『東アジア世界』となる。新羅・渤海・日本は律令・漢字・仏教・都城制・儒教を文明の標準セットとして持ち帰った。8世紀に均田・府兵制が崩れ、755年の安史の乱で決定的に弱体化、各地の節度使が半独立して907年に滅んだ。", "regionCode": "CN", "lat": 34.27, "lng": 108.95, "factLevel": "定説", "body": [{"label": "律令体制", "text": "行政法の『令』と刑法の『律』からなる成文法典。均田制で国が農民に土地を配り、租庸調で税と労役を課し、府兵制で農民を徴兵する。科挙で試験による官僚登用を制度化。中央集権の官僚国家のモデル。", "source": "batch 10 直接生成"}, {"label": "長安", "text": "東西9.7km・南北8.6kmの左右対称・碁盤目状。北端中央に宮城、朱雀大路が南北に貫く。この都城プランが平城京・平安京、新羅の慶州、渤海の上京にコピーされた。", "source": "batch 10 直接生成"}, {"label": "冊封と朝貢", "text": "唐皇帝が周辺国の王を『国王』に任じ、王は定期的に使節と貢物を送る。見返りに交易と文物の下賜を受ける。対等な国交ではなく上下関係の擬制だが、これが東アジアの国際秩序として機能した。", "source": "batch 10 直接生成"}, {"label": "安史の乱（755〜763）", "text": "辺境の節度使・安禄山らの反乱。鎮圧にウイグルの援軍を仰ぎ、乱後は各地の節度使（藩鎮）が徴税権・軍事権を握って半独立。中央の統制力は戻らず、律令国家としての唐は事実上ここで終わった。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "sui-reunification", "relation": "継承", "note": "律令・均田・科挙・大運河をそのまま受け継いで完成させた"}, {"concept": "han-empire", "relation": "対比", "note": "秦漢が作った中華帝国の型を、律令という成文法で再構築"}, {"concept": "taika-reforms-ritsuryo", "relation": "因果", "note": "日本の律令国家が模倣したモデル。白村江で唐と直接戦った"}, {"concept": "nara-period", "relation": "同時代", "note": "遣唐使が制度・文物・経典を持ち帰った盛唐の時代"}, {"concept": "heian-early-period", "relation": "因果", "note": "894年、唐の衰退を理由に遣唐使が停止される"}, {"concept": "abbasid-caliphate", "relation": "対比", "note": "同時代ユーラシアの二大文明圏。751年タラス河畔で衝 startYear": 1618, "endYear": 1648, "eraLabel": "17世紀前半", "summary": "神聖ローマ帝国内のカトリックとプロテスタントの対立に始まった三十年戦争(1618-1648)は、フランス・スウェーデンなど周辺列強も介入し、ドイツを人口減少・荒廃に追い込む大戦争となった。1648年のウェストファリア条約は、帝国内の諸侯にほぼ完全な主権を認め、教皇や皇帝の上位権威によらず対等な国家同士が条約で関係を律する「主権国家体制」の起点となった。以後のヨーロッパは、宗教ではなく国家利益(レゾン・デタ)に基づく外交・同盟・戦争を繰り広げる時代に入る。", "regionCode": "DE", "lat": 51.9607, "lng": 7.6261, "factLevel": "定説", "body": [{"label": "宗教戦争から国際戦争へ", "text": "神聖ローマ帝国内のボヘミア反乱に端を発したが、フランス(カトリックだが対ハプスブルクで参戦)・スウェーデン・スペインなど周辺列強が介入し、宗教対立の枠を超えた大国間の国際戦争になった。", "source": "MulmoClaude"}, {"label": "ウェストファリア条約の内容", "text": "神聖ローマ帝国内の諸侯・都市にほぼ完全な主権(外交権・条約締結権)を認め、帝国は事実上300以上の領邦の緩やかな連合体となった。スイスとオランダの独立も国際的に承認された。", "source": "MulmoClaude"}, {"label": "「主権国家体制」という発明", "text": "皇帝や教皇という上位権威に頼らず、対等な国家同士が条約によって関係を律するという原則(ウェストファリア体制)が確立し、以後の国際関係の基本枠組みとして現代まで影響を残す。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "reformation", "relation": "継承", "note": "宗教改革が生んだ対立の帰結として起きた戦争"}, {"concept": "french-absolutism-louis-xiv", "relation": "因果", "note": "主権国家体制の中でフランスが最強国として台頭していく"}, {"concept": "qing-dynasty-prosperity", "relation": "同時代", "note": "ヨーロッパが宗教戦争で疲弊する一方、東アジアでは清が新王朝を確立していった"}, {"concept": "ottoman-empire", "relation": "対比", "note": "主権国家体制の外側にあり続けた多民族帝国"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,ヨーロッパ,ウェストファリア,主権国家", "lastUpdated": "2026-09-04"}, {"id": "toraijin-kofun-society", "title": "渡来人と古墳時代の社会", "domain": "日本史", "region": "日本", "headline": "大陸の戦乱が渡来人を列島へ押し出し、文字・須恵器・乗馬の技術が根づいた", "startYear": 400, "endYear": 600, "eraLabel": "5〜6世紀", "summary": "4〜6世紀、朝鮮半島の高句麗・百済・新羅の抗争と中国の南北朝分裂により、多くの技術者・知識人が倭へ渡来した。彼らは硬質の須恵器、鉄生産、機織り（錦・綾）、金工、乗馬の風習、そして漢字による記録・外交文書の作成をもたらした。王仁・阿知使主（東漢氏）・弓月君（秦氏）らの渡来伝承がある。ヤマト王権は史部・錦織部などの品部に彼らを組織し、財政・外交・生産の中枢を担わせた。古墳の副葬品が武器・農具から馬具・装身具・須恵器へ変わり、横穴式石室が九州から広がるのも、この大陸的な文物の流入を映している。", "regionCode": "JP", "lat": 34.56, "lng": 135.61, "factLevel": "有力説", "body": [{"label": "なぜこの時期に集中したか", "text": "313年の楽浪郡滅亡 "source": "batch 11 直接生成"}, {"label": "スワヒリ海岸の都市", "text": "キルワ、モンバサ、ザンジバル、ソファラなどが石造の港市国家として発展。宋の青磁やペルシアの陶器が出土し、インド洋交易圏の西端を担った。スワヒリ語はバントゥー語を基層にアラビア語の語彙を多く取り込んだ。", "source": "batch 11 直接生成"}, {"label": "イスラームの浸透", "text": "商人と学者を通じて、西アフリカ・東アフリカとも支配層・都市住民からイスラーム化が進んだ。農村の在来信仰と併存する『交易のイスラーム』という特徴をもつ。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "indian-ocean-maritime-trade", "relation": "継承", "note": "スワヒリ海岸はインド洋モンスーン交易の西端の受け皿"}, {"concept": "sahara-desert-and-maghreb-geography", "relation": "地理的背景", "note": "砂漠は障壁であると同時に、塩鉱と隊商路のある『交易空間』でもあった"}, {"concept": "sahel-belt-geography", "relation": "地理的背景", "note": "砂漠と森林の間の草原ベルトに交易都市と国家が並んだ"}, {"concept": "seljuk-and-medieval-islamic-dynasties", "relation": "同時代", "note": "ムラービト朝の勃興がガーナ王国衰退の一因"}, {"concept": "song-dynasty", "relation": "関連", "note": "スワヒリ海岸の遺跡から宋の陶磁器が出土する"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "中世,アフリカ,交易,ガーナ,スワヒリ,イスラーム", "lastUpdated": "2026-09-03"}, {"id": "us-civil-war-and-reconstruction", "title": "アメリカ南北戦争と再建", "domain": "世界史", "region": "南北アメリカ", "headline": "奴隷制をめぐり国家が割れ、勝利後も人種平等は遠かった", "startYear": 1861, "endYear": 1877, "eraLabel": "19世紀後半", "summary": "奴隷制拡大の是非をめぐる対立から南部11州が連邦を離脱し、1861年に南北戦争が勃発。1863年の奴隷解放宣言を経て1865年に北部が勝利し、奴隷制は憲法上廃止された。しかし戦後の「再建」期には南部の抵抗が続き、人種平等の達成は大きく後退した。アメリカ史上最大の死者(62万人以上)を出した戦争でもある。", "regionCode": "US", "lat": 38.9072, "lng": -77.0369, "factLevel": "定説", "body": [{"label": "対立の構図", "text": "北部の工業資本主義と南部のプランテーション奴隷制経済という異なる経済体制が、西部準州への奴隷制拡大の是非を巡り先鋭化した。", "source": "MulmoClaude"}, {"label": "奴隷解放宣言と終戦", "text": "1863年リンカンによる奴隷解放宣言、1865年南軍のアポマトックス降伏で終戦。同年、憲法修正第13条で奴隷制が正式廃止された。", "source": "MulmoClaude"}, {"label": "再建の挫折", "text": "1865-77年の再建期に解放黒人の権利拡大が図られたが、南部の抵抗によりジム・クロウ法など人種隔離体制の萌芽が生まれた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "atlantic-slave-trade", "relation": "継承", "note": "大西洋奴隷貿易が持ち込んだ奴隷制経済の帰結として戦争が起きた"}, {"concept": "industr 余国」をなし、楽浪郡（朝鮮北部の漢の出先）に定期的に使者を送ったと記す。『後漢書』東夷伝は、57年に倭の奴国王が後漢の光武帝から金印を授かったこと、107年に倭国王帥升らが生口（奴隷）を献じたことを伝える。福岡・志賀島出土の「漢委奴国王」金印はこの記事に対応するとされる。小国が中国王朝の権威を借りて他の首長より優位に立とうとする、冊封関係の始まりである。", "regionCode": "40", "lat": 33.65, "lng": 130.3, "factLevel": "有力説", "body": [{"label": "百余国の分立", "text": "弥生中期には各地に環濠集落と首長墓（甕棺・墳丘）が現れ、北部九州を中心に小さな『クニ』が分立していた。", "source": ""}, {"label": "金印『漢委奴国王』", "text": "1784年に志賀島で発見。真贋論争はあったが、現在は本物で『後漢書』の57年の記事に対応するとの見方が有力。", "source": "『後漢書』東夷伝"}, {"label": "朝貢という戦略", "text": "中国に朝貢して官職や印綬を得ることは、鉄や威信財の入手ルートを確保し、国内の首長間競争で優位に立つ手段だった。", "source": ""}], "relatedTopics": [{"concept": "han-empire", "relation": "因果", "note": "漢・後漢の冊封体制の中で記録に現れた"}, {"concept": "moated-settlements-yayoi", "relation": "継承", "note": "環濠集落から分立する『クニ』へ"}, {"concept": "yayoi-metal-tools", "relation": "関連", "note": "朝貢で得た鉄や威信財が首長の力の源泉"}, {"concept": "korean-peninsula-geography", "relation": "地理的背景", "note": "楽浪郡を窓口に中国と通交した"}, {"concept": "roman-republic", "relation": "同時代", "note": "『漢書』が倭を記録した前1世紀、地中海ではローマ共和政が内乱の末に帝政へ向かっていた"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ05)", "ref": "data/wiki/sources/rekishi-05-classical-antiquity.md", "date": "2026-09-03"}], "tags": "倭, 漢書地理志, 後漢書東夷伝, 漢委奴国王, 金印, 志賀島, 楽浪郡, 冊封", "lastUpdated": "2026-09-03"}, {"id": "wei-jin-southern-northern-dynasties", "title": "魏晋南北朝", "domain": "世界史", "region": "東アジア", "headline": "中国が300年南北に分かれ、北は遊牧系王朝・南は漢人貴族の世となった", "startYear": 280, "endYear": 589, "eraLabel": "3世紀後半〜6世紀", "summary": "280年に西晋が中国を再統一したが、一族の内乱（八王の乱）で自壊し、匈奴・鮮卑ら遊牧諸族が華北へ流入した（五胡十六国）。311年の永嘉の乱で洛陽が陥落し、晋は江南へ逃れて東晋となる。以後、華北は北魏を中心とする『北朝』、江南は東晋以下の漢人王朝『南朝』に分かれ、589年に隋が統一するまで対立が続いた。北朝では鮮卑拓跋氏の北魏が孝文帝の漢化政策を進め、南朝では門閥貴族の文化と江南開発が進んだ。仏教が国家・社会に深く根を下ろし、雲崗・龍門の石窟寺院が造られた。この動乱が朝鮮諸国や倭への人と技術の移動を加速した。", "regionCode": "CN", "lat": 32.05, "lng": 118.79, "factLevel": "定説", "body": [{"label": "五胡十六国と北魏", "text": "八王の乱から永嘉の乱（311）で洛陽が陥落、晋は江南へ逃れ東晋に。華北は諸族の16国乱立の後、439年に鮮卑の北魏が統一。孝文帝は494年に洛陽遷都し、鮮卑の姓・服・言語を漢式に改める漢化政策をとった。均田制も北魏に始まる。", "source": "詳説世界史"}, {"label": "南朝と江南開発", "text": "東晋のあと宋・斉・梁・陳。北からの移民が長江下流を開発し経済の重心が南へ移り始めた。貴族が官職を独占する九品官人法・門閥社会。梁の武帝は熱心な仏教保護者だった。", "source": "岩波講座 世界歴史"}, {"label": "仏教の定着と求法", "text": "鳩摩羅什が経典を漢訳し、東晋の僧・法顕が399〜412年にインドへ求法の旅をして『仏国記』を残した。石窟寺院、陶淵明・王羲之ら南朝文化。分裂期こそ中国文化が豊かに展開したとも評される。", "source": "詳説世界史"}, {"label": "周辺世界への波及", "text": "中国の分裂と高句麗・百済・新羅の抗争が、倭への渡来人・漢字・のちの仏教伝来と直結する。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "later-han-and-three-kingdoms", "relation": "継承", "note": "三国→西晋の再統一、そして再分裂へ"}, {"concept": "sui-reunification", "relation": "因果", "note": "300年の分裂を隋が終わらせる"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "地理的背景", "note": "長城ラインを越えて遊牧諸族が華北へ流入した"}, {"concept": "north-south-china-divide", "relation": "地理的背景", "note": "淮河の線を境に北朝と南朝が並立した"}, {"concept": "gupta-empire", "relation": "同時代", "note": "法顕が東晋からグプタ朝インドへ求法の旅をした"}, {"concept": "yamato-polity-development", "relation": "同時代", "note": "南北朝の分裂期、倭の五王が南朝に朝貢し官爵を求めた"}, {"concept": "toraijin-kofun-society", "relation": "因果", "note": "華北の戦乱と半島の抗争が渡来人を列島へ押し出した"}, {"concept": "buddhism-official-transmission-japan", "relation": "因果", "note": "中国南朝→百済を経由して倭へ仏教が伝わる下地"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 08 直接生成 / rekishi-08-late-antiquity-to-early-medieval.md", "date": "2026-09-03"}], "tags": "魏晋南北朝 西晋 八王の乱 永嘉の乱 五胡十六国 北魏 孝文帝 漢化政策 東晋 南朝 九品官人法 均田制 石窟寺院 法顕", "lastUpdated": "2026-09-03"}, {"id": "wet-rice-farming-japan", "title": "水稲農耕の伝来", "domain": "日本史", "region": "日本", "headline": "大陸から来た『技術と社会のセット』が、日本の暮らしを作り替えた", "startYear": -900, "endYear": -400, "eraLabel": "弥生時代早期〜前期", "summary": "灌漑式の水田稲作は、朝鮮半島南部を経由して(遠くは長江下流域に起源)前1千年紀に北部九州へ伝わった。福岡の板付遺跡や佐賀の菜畑遺跡で最古級の水田跡が見つかっている。稲作は種籾・農具・環濠集落・墓制まで含む一括のパッケージとして渡来人とともに入り、人口増加と定住の強化をもたらした。余剰の管理をめぐって階層化と集団間の抗争が進んだ。", "regionCode": "JP", "lat": 33.58, "lng": 130.44, "factLevel": "有力説", "body": [{"label": "最古の水田", "text": "菜畑(佐賀県唐津市)や板付(福岡市)で、畦と用水路を備えた小区画水田が縄文晩期末の層から確認されている。", "source": ""}, {"label": "人の移動を伴う", "text": "渡来系の人骨形質や、大陸系の土器・支石墓の分布から、技術だけでなく担い手の集団移住があったとみられる。", "source": ""}], "relatedTopics": [{"concept": "yayoi-period", "relation": "因果", "note": "この技術移転が時代を画した"}, {"concept": "japan-archipelago-geography", "relation": "地理的背景", "note": "夏に雨が集中する気候が水田に向いた"}, {"concept": "yayoi-metal-tools", "relation": "関連", "note": "大陸系の技術パッケージとして金属器もほぼ同時期に入った"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}], "tags": "水稲農耕, 板付遺跡, 菜畑遺跡, 渡来人", "lastUpdated": "2026-09-03"}, {"id": "world-heritage-convention", "title": "世界遺産条約（1972）", "domain": "横断テーマ", "region": "グローバル", "headline": "世界遺産条約＝『人類共通の宝は皆で守る』を国際法にした1972年の枠組み", "summary": "1972年のユネスコ総会で採択された「世界の文化遺産及び自然遺産の保護に関する条約」。文化遺産と自然遺産を同じ枠組みで守るという発想がこの条約の新しさだった。締約国が推薦し、21か国で構成する世界遺産委員会が『顕著な普遍的価値（OUV）』の有無を審査して一覧表に記載する。2020年代で締約国は190超、登録件数は1200件を超えた。", "isWorldHeritage": true, "relatedTopics": [{"concept": "outstanding-universal-value", "relation": "テーマ", "note": "条約が守ろうとしている当のもの"}, {"concept": "registration-criteria", "relation": "テーマ"}, {"concept": "danger-list", "relation": "関連", "note": "条約が用意したもう1つの一覧"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "制度, ユネスコ, OUV, 世界遺産", "lastUpdated": "2026-09-03", "startYear": 1972, "eraLabel": "1972年採択 / 1975年発効", "body": [{"label": "きっかけはアスワン・ハイダム", "text": "1960年代、ダム建設で水没しかけたアブ・シンベル神殿を国際協力で移築した経験が、条約制定の直接の後押しになった。", "source": "パイロット"}, {"label": "文化と自然を1つに", "text": "米国発の『自然保護（国立公園）』の流れと、欧州の『文化財保護』の流れが合流してできた条約。両者を同じ枠組みで扱うのは当時画期的だった。", "source": "パイロット"}], "ouv": "条約の核心概念が『顕著な普遍的価値』。国境を越えて全人類が保護に責任をもつ、という理念そのものが条約の中身。"}, {"id": "world-war-one", "title": "第一次世界大戦", "domain": "世界史", "region": "ヨーロッパ", "headline": "一発の暗殺が同盟網を伝い、人類初の「総力戦」を引き起こした", "startYear": 1914, "endYear": 1918, "eraLabel": "20世紀初頭", "summary": "1914年6月のサライェヴォ事件を発端に、独・オーストリア陣営と英・仏・露の同盟網が連鎖参戦し、陣地に立てこもる膠着戦と新兵器（毒ガス・戦車・航空機）が投入される人類初の総力戦となった。1917年の米参戦とロシアの戦線離脱を経て1918年11月にドイツが降伏した。", "regionCode": "FR", "lat": 48.8566, "lng": 2.3522, "factLevel": "定説", "body": [{"label": "サライェヴォ事件", "text": "1914年6月、オーストリア＝ハンガリー帝位継承者フランツ・フェルディナント夫妻がセルビア系青年に暗殺され、同盟網が連鎖参戦した。", "source": "MulmoClaude"}, {"label": "陣地戦と総力戦", "text": "西部戦線はソンム・ヴェルダンなどで数十万人規模の犠牲を出しながら膠着し、国家の経済・産業・国民生活すべてを動員する「総力戦」となった。", "source": "MulmoClaude"}, {"label": "戦争の終結", "text": "1917年のアメリカ参戦とロシア革命による戦線離脱を経て1918年11月にドイツが降伏し、4年強の戦争が終結した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "german-unification", "relation": "因果", "note": "統一後のドイツの「世界政策」・艦隊建造競争が英独対立の背景となった"}, {"concept": "russo-japanese-war", "relation": "同時代", "note": "日露戦争で示された新兵器・陣地戦の前兆が第一次大戦で世界規模に展開した"}, {"concept": "taisho-democracy", "relation": "同時代", "note": "大戦景気による好況が日本の都市中間層・労働者の台頭を促した"}, {"concept": "russian-revolution", "relation": "因果", "note": "戦争の長期化と国民の疲弊が革命の引き金となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 19 直接生成 / rekishi-19-age-of-total-war.md", "date": "2026-09-05"}], "tags": "第一次世界大戦,総力戦,陣地戦,ヨーロッパ", "lastUpdated": "2026-09-05"}, {"id": "world-war-two", "title": "第二次世界大戦", "domain": "世界史", "region": "グローバル", "headline": "ヨーロッパとアジア・太平洋の2つの戦争が合流し、真の世界戦争となった", "startYear": 1939, "endYear": 1945, "eraLabel": "20世紀中期", "summary": "1939年9月のドイツのポーランド侵攻で欧州戦線が開始し、1941年12月の日本の真珠湾攻撃でアメリカが参戦し太平洋・アジアも巻き込む世界規模の戦争となった。1945年5月ドイツ降伏、8月の原爆投下とソ連参戦を経て日本も降伏した。死者は民間人を含め数千万人規模とされる。", "factLevel": "定説", "body": [{"label": "欧州戦線", "text": "1939年9月のポーランド侵攻で英仏が対独宣戦。1940年フランス降伏、1941年6月の独ソ戦(バルバロッサ作戦)開始。", "source": "MulmoClaude"}, {"label": "太平洋戦線への合流", "text": "1941年12月の日本の真珠湾攻撃でアメリカが参戦し、戦争は真に世界規模となった。", "source": "MulmoClaude"}, {"label": "終結", "text": "1943年のスターリングラード攻防戦・ミッドウェー海戦を転換点に連合国が反攻、1945年5月ドイツ降伏、8月広島・長崎への原爆投下とソ連参戦を経て日本も降伏した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "rise-of-fascism-and-nazism", "relation": "因果", "note": "ドイツの拡張主義が欧州戦線の直接の発端となった"}, {"concept": "pacific-war", "relation": "因果", "note": "日本の大東亜共栄圏構想と対米英開戦が太平洋戦線を形成した"}, {"concept": "versailles-and-interwar-order", "relation": "因果", "note": "ヴェルサイユ体制への復讐が開戦の遠因となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 19 直接生成 / rekishi-19-age-of-total-war.md", "date": "2026-09-05"}], "tags": "第二次世界大戦,太平洋戦線,バルバロッサ作戦,グローバル", "lastUpdated": "2026-09-05"}, {"id": "yamatai-himiko", "title": "邪馬台国と卑弥呼", "domain": "日本史", "region": "日本", "headline": "『倭国大乱』を収めるために共立された女王と、30国の連合", "startYear": 180, "endYear": 248, "eraLabel": "2世紀後半〜3世紀半ば", "summary": "弥生後期、鉄や交易路をめぐる争い（倭国大乱、2世紀後半）を収めるため、諸国は女王・卑弥呼を共立した。卑弥呼は『鬼道』で人心をまとめ、239年に帯方郡経由で魏へ朝貢し『親魏倭王』の称号・金印・銅鏡100枚を得た。邪馬台国連合は租税・刑罰・市場・身分制をもつ成熟した政体だったが、所在地は畿内説と九州北部説が対立している。", "regionCode": "JP", "lat": 34.54, "lng": 135.84, "factLevel": "諸説あり", "body": [{"label": "史料は『魏志倭人伝』", "text": "3世紀末に陳寿が編んだ『三国志』魏書東夷伝倭人条が唯一のまとまった記録。行程記事（帯方郡から水行・陸行の日数）の読み方の違いが、そのまま所在地論争の根になっている。", "source": "岩波日本史辞典"}, {"label": "共立された女王", "text": "『其の国、本亦男子を以て王と為す。住まること七、八十年。倭国乱れ、相攻伐すること歴年、乃ち共に一女子を立てて王と為す』。卑弥呼は弟が政務を補佐し、宮室楼観に千人の女性を従え、めったに姿を見せなかったという。", "source": "魏志倭人伝"}, {"label": "所在地論争", "text": "畿内（大和）説は纒向遺跡の都市的性格と前方後円墳の出現を、九州北部説は行程記事と鉄器・楽浪系遺物の分布を根拠にする。決着していないが、近年は畿内説がやや優勢とされる。", "source": "詳説日本史"}], "relatedTopics": [{"concept": "wa-in-chinese-records", "relation": "継承", "note": "『分かれて百余国』から女王共立へ"}, {"concept": "yayoi-period", "relation": "因果", "note": "弥生後期の国々の抗争の帰結"}, {"concept": "later-han-and-three-kingdoms", "relation": "同時代", "note": "239年、分裂中の中国（魏）へ遣使"}, {"concept": "kofun-emergence", "relation": "因果", "note": "邪馬台国連合が初期ヤマト王権へ発展したとする説"}, {"concept": "roman-principate", "relation": "同時代", "note": "ユーラシアの東西、片や大帝国・片や小国連合"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 07 直接生成 / rekishi-07-ancient-empires-peak.md", "date": "2026-09-03"}], "tags": "邪馬台国 卑弥呼 魏志倭人伝 倭国大乱 親魏倭王 纒向", "lastUpdated": "2026-09-03"}, {"id": "yamato-polity-development", "title": "ヤマト政権の展開（倭の五王と氏姓制度）", "domain": "日本史", "region": "日本", "headline": "倭の五王が南朝に朝貢し、氏姓制度で豪族を束ねたヤマトの大王政権", "startYear": 400, "endYear": 550, "eraLabel": "5〜6世紀（古墳時代中〜後期）", "summary": "4世紀に畿内で成立した初期ヤマト王権は、5世紀に『倭の五王』（讃・珍・済・興・武）として中国南朝へたびたび遣使し、朝鮮半島南部での軍事的地位の承認を求めた（『宋書』倭国伝）。国内では大王を頂点に、有力豪族へ氏（うじ）としてのまとまりと臣・連などの姓（かばね）を与え、伴造・部民制で奉仕させる氏姓制度が形づくられた。大阪平野には大仙陵古墳（伝仁徳陵、全長約486m）など世界最大級の前方後円墳が築かれた。埼玉稲荷山・熊本江田船山の鉄剣・鉄刀銘『獲加多支鹵大王（ワカタケル＝雄略）』は、5世紀後半に大王の支配が関東から九州まで及んでいたことを裏づける。", "regionCode": "JP", "lat": 34.56, "lng": 135.49, "factLevel": "有力説", "body": [{"label": "倭の五王", "text": "『宋書』倭国伝による。421〜478年に少なくとも9回の遣使。最後の『武』の上表文（478年）は雄略天皇に比定するのが通説。半島の高句麗南下に対抗し、宋の権威を借りようとした。", "source": "詳説日本史"}, {"label": "氏姓制度", "text": "血縁・擬制的同族の『氏』に、ヤマト王権が『姓』で身分・職務を格付けした。葛城・平群・大伴・物部・蘇我らが中央、地方豪族は国造に。直接の官僚制ではなく、豪族連合の上に大王が乗る体制。", "source": "岩波日本史辞典"}, {"label": "ワカタケル大王", "text": "稲荷山鉄剣（471年説）と江田船山鉄刀に共通する王名は、文字による支配の記録が地方まで届いた証拠。考古学と『記紀』『宋書』が交差する数少ない結節点。", "source": "詳説日本史"}, {"label": "巨大古墳の頂点と終わり", "text": "5世紀の大阪平野（百舌鳥・古市古墳群）で規模が最大化。6世紀後半には大型前方後円墳が急速に姿を消し、群集墳・横穴式石室が広がる。統治が古墳の誇示から律令的組織へ向かう前段階。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "kofun-emergence", "relation": "継承", "note": "初期ヤマト王権の版図拡大の次の段階"}, {"concept": "yamatai-himiko", "relation": "関連", "note": "邪馬台国連合からヤマト王権への流れ（諸説あり）"}, {"concept": "toraijin-kofun-society", "relation": "因果", "note": "半島からの渡来人が政権の技術・文筆・外交を支えた"}, {"concept": "buddhism-official-transmission-japan", "relation": "因果", "note": "氏姓制の豪族対立（蘇我vs物部）が崇仏論争の舞台"}, {"concept": "wei-jin-southern-northern-dynasties", "relation": "同時代", "note": "中国南北朝の分裂期、倭は南朝に朝貢して官爵を得た"}, {"concept": "germanic-migration-and-western-rome-fall", "relation": "同時代", "note": "西ローマが消滅した5世紀、極東では巨大古墳の時代"}, {"concept": "sui-reunification", "relation": "因果", "note": "隋の統一が倭の中央集権化（遣隋使・冠位十二階）を促した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 08 直接生成 / rekishi-08-late-antiquity-to-early-medieval.md", "date": "2026-09-03"}], "tags": "ヤマト政権 倭の五王 宋書倭国伝 氏姓制度 大王 ワカタケル 稲荷山鉄剣 大仙陵古墳 国造 部民制", "lastUpdated": "2026-09-03"}, {"id": "yayoi-metal-tools", "title": "弥生の金属器 ― 青銅器と鉄器の同時流入", "domain": "日本史", "region": "日本", "headline": "祭りの青銅、仕事の鉄。二つの金属が一度に入ってきた", "startYear": -400, "endYear": 100, "eraLabel": "弥生時代前期末〜後期", "summary": "大陸では青銅器時代のあとに鉄器時代が来るが、日本列島には前1千年紀後半に青銅器と鉄器がほぼ同時に入った。青銅は銅鐸・銅矛・銅剣など祭祀・威信財に、鉄は工具・農具・武器など実用に、という役割分担が生じた。銅鐸は近畿、武器形青銅器は北部九州〜瀬戸内と、地域ごとにまつりの道具が異なる。鉄器の普及は開墾と生産力を押し上げた。", "regionCode": "JP", "lat": 34.69, "lng": 135.5, "factLevel": "有力説", "body": [{"label": "役割の分化", "text": "実用価値の高い鉄が道具に回り、青銅はしだいに大型化・薄型化して『見せる』祭器へと純化した。銅鐸は最大で高さ1mを超える。", "source": ""}, {"label": "まつりの地域色", "text": "銅鐸文化圏(近畿)と武器形祭器文化圏(北部九州)の対比は、弥生の政治的まとまりが地域単位だったことを示す。", "source": ""}], "relatedTopics": [{"concept": "yayoi-period", "relation": "同時代", "note": "弥生文化の物質的な指標"}, {"concept": "wet-rice-farming-japan", "relation": "関連", "note": "渡来技術の一括流入の一部"}, {"concept": "achaemenid-persia", "relation": "対比", "note": "大陸では青銅器→鉄器と段階的、日本では同時"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}], "tags": "銅鐸, 鉄器, 青銅器, 祭祀", "lastUpdated": "2026-09-03"}, {"id": "yayoi-period", "title": "弥生時代", "domain": "日本史", "region": "日本", "headline": "水稲農耕とともに始まり、階層社会と『クニ』が生まれた時代", "startYear": -900, "endYear": 250, "eraLabel": "弥生時代", "summary": "縄文時代に続き、水稲農耕を基盤とする農耕社会が列島に広がった時代。従来は前5〜前4世紀開始とされたが、放射性炭素年代の研究で北部九州では前10〜前9世紀に遡るという説が有力になった(諸説あり)。余剰生産と貯蔵が富の偏りを生み、環濠集落や武器の副葬が現れ、やがて小国分立へ向かう。青銅器・鉄器が大陸からほぼ同時にもたらされた点が、大陸の発展順序と異なる。", "regionCode": "JP", "lat": 33.32, "lng": 130.38, "factLevel": "諸説あり", "body": [{"label": "年代論争", "text": "国立歴史民俗博物館が2003年に示したAMS炭素14年代では、弥生開始が約500年遡る。土器編年に基づく従来説との差は未決着で、地域差も大きい。", "source": "国立歴史民俗博物館 2003"}, {"label": "クニの萌芽", "text": "佐賀・吉野ヶ里のような大規模環濠集落、階層差を示す墳丘墓、鉄鏃が刺さった人骨などから、集団間の緊張と首長の出現が読み取れる。", "source": ""}], "relatedTopics": [{"concept": "wet-rice-farming-japan", "relation": "因果", "note": "水稲農耕の定着が弥生社会を生んだ"}, {"concept": "yayoi-metal-tools", "relation": "同時代", "note": "青銅器と鉄器がほぼ同時に流入した"}, {"concept": "japan-archipelago-geography", "relation": "地理的背景", "note": "モンスーン気候と沖積平野が稲作の条件になった"}, {"concept": "alexander-eastern-campaign", "relation": "同時代", "note": "西方ではアレクサンドロスがオリエントを制覇していた"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}], "tags": "弥生時代, 水稲農耕, 環濠集落, 炭素年代", "lastUpdated": "2026-09-03", "dramaIntro": "ここから先は、魏志倭人伝などのわずかな記録の『すきま』を、完全な創作で埋めた物語です。同じ弥生時代を、二つの視点から描きます――卑弥呼とその周りを描く『中心』の物語と、名もなき人々の暮らしを描く『周辺』の物語。卑弥呼や難升米のように実在が推定される人物も、名もなき人々も、会話や心情はすべてMulmoClaudeによる創作であり、史実そのものではありません。『点』でしか分からない歴史に、想像力で『線』を引いてみる試みとして読んでください。", "dramaScenes": [], "dramaScenesCenter": [{"sceneTitle": "第一幕　倭国、乱れる", "characters": "環濠集落の首長オホヒコ(架空)／隣国の使者(架空)／若者タケル(架空)", "script": "弥生後期、北部九州のとある環濠集落。深い濠の向こうから、隣国の使者が早足でやってくる。\n「首長オホヒコ様! また鉄の産地をめぐって、東の国と西の国が武器を構えております。今年で七年、いくさが止みませぬ」\nオホヒコは濠端に立ち、遠くに立ちのぼる煙を見つめた。\n「……鉄鏃が刺さった骸を、もう何人見た。田を耕す手が足りぬというのに、若者はみな物見櫓に立たされておる」\n若者のタケルが駆け寄る。\n「首長、隣のクニの寄合で、妙な話が出ておるそうです。誰か一人を『共立の王』に立てて、いくさを止めようという話が」\n「一人の王、か……。しかしどの国の血筋を立てても、他の国が納得すまい」\nオホヒコは腕を組み、しばし黙り込んだ後、ぽつりと言った。\n「――女ならば、話は別かもしれぬ」", "note": "『倭国乱れ、相攻伐すること歴年』(魏志倭人伝)という記述が根拠。オホヒコ・タケルは完全な創作の架空人物で、具体的な会話・地名は史料にない。"}, {"sceneTitle": "第二幕　共立の女王", "characters": "卑弥呼(実在推定)／卑弥呼の弟(実在推定、名は伝わらず)／諸国の首長たち(架空)", "script": "諸国の首長が集う祭りの庭。まだ若い巫女、卑弥呼が一段高い座に上がると、ざわめきが静まった。\n弟が一同に向かって声を張る。\n「姉は幼き頃より神を降ろす力に秀で、七十年におよぶこの乱を、天の声によって鎮めると仰せです」\n一人の首長が問う。\n「巫女殿が王になったとして、誰が政をなさる。田の税、いくさの采配、他国との交渉は――」\n卑弥呼は初めて口を開いた。声は静かだが、よく通った。\n「政のことは、この弟に。私は宮の奥にあって、ただ天の声を聞き、事を決めます。私の顔を見た者は、この先ほとんどおりますまい」\n一同は顔を見合わせる。誰も欲しない王位を、誰も傷つかぬ形で分け合う――それが諸国の出した答えだった。\n弟が静かに続ける。\n「今日より、卑弥呼様を共立の王とする。この乱、これにて鎮めん」", "note": "卑弥呼・鬼道・弟が政務を補佐という構図は魏志倭人伝の記述に基づく。共立の経緯・会話・場面設定は創作。"}, {"sceneTitle": "第三幕　千人の侍女と、届かぬ声", "characters": "卑弥呼(実在推定)／侍女ヌナ(架空)／弟(実在推定)", "script": "宮室の奥。千人の侍女が仕える中、卑弥呼の身の回りを世話するのは、幼い頃からの侍女ヌナただ一人だった。\n「王様、今日も食事にはほとんど手をつけられませんでしたね」\n「……鬼道を降ろす日は、いつもこうだ。腹が空くよりも、神の声を聞き逃す方が恐ろしい」\n弟が御簾の外から声をかける。\n「姉上、隣の狗奴国が、また境を越えて兵を動かしております。あちらの王、卑弥弓呼は我らの共立を認めておりませぬ」\n卑弥呼はしばし目を閉じ、やがて言った。\n「……天は、まだ戦うなと言うておる。だが、いつまでもとは言うまい」\nヌナだけが知っていた。千人に囲まれながら、この王がどれほど独りであるかを。", "note": "侍女千人、狗奴国と卑弥弓呼との対立は魏志倭人伝の記述に基づく。侍女ヌナは完全な創作人物で、その名は史料にない。"}, {"sceneTitle": "第四幕　海を渡る使い、難升米", "characters": "難升米(実在推定、魏への正使)／従者(架空)／帯方郡の役人(架空)／魏の役人(架空)", "script": "239年、難升米は倭の産物を積んだ船団を率い、帯方郡を経て、はるか魏の都・洛陽へ向かう。\n従者が心配げに問う。\n「難升米様、これほど遠くまで参って、我らの言葉すら通じるでしょうか」\n「通じずとも構わぬ。持たせてきた生口と布、そして卑弥呼様のお言葉があれば十分だ」\n帯方郡の役人が二人を出迎える。\n「倭国からの使者とは珍しい。これより魏の都まで、われらが手引きしよう」\n数か月後、洛陽の宮廷にて。魏の役人が難升米に告げる。\n「そなたの王、卑弥呼を『親魏倭王』に任ずる、との詔である。金印と紫綬、銅鏡百枚を授ける」\n難升米は深く頭を垂れた。海の向こうの小さな国が、大陸の大帝国から公に認められた瞬間だった。\n「この栄誉、必ずや卑弥呼様にお届けいたします」", "note": "難升米が239年に帯方郡経由で魏へ朝貢し、『親魏倭王』の称号・金印・銅鏡百枚を得たことは魏志倭人伝に明記される史実。会話は創作。"}, {"sceneTitle": "第五幕　王の死と、大きな墓", "characters": "壱与(実在推定、卑弥呼の後継者)／弟(実在推定)／村人たち(架空)", "script": "卑弥呼が世を去ると、国はふたたび乱れかけた。男の王を立てようとする者が現れ、諸国が争いかけたのだ。\n弟は諸国の首長を前に訴える。\n「姉の血を引く者を、次の王に。まだ幼くとも、卑弥呼様の跡を継ぐにふさわしい者がおります」\n選ばれたのは、卑弥呼の一族の少女、壱与だった。まだ十三歳という。\n壱与は震える声で、しかしはっきりと告げた。\n「私に、姉上のように天の声が聞けるかは分かりません。それでも、この国を再び戦の火に沈めたくはありません」\n諸国はふたたび静まった。\n一方、亡き卑弥呼のためには、直径百歩をこえる、見たこともない大きな塚が築かれた。\n土を運ぶ村人の一人がつぶやく。\n「これほど大きな墓を作るとは……。あの王様は、本当にこの国をひとつにしたのだな」\nその巨大な墓の記憶は、やがて列島各地に広がる前方後円墳という、新しい時代の墓の形へと受け継がれていく。", "note": "卑弥呼の死後の男王擁立の失敗、壱与(台与)の共立、直径百余歩の塚の造営は魏志倭人伝に基づく。会話・村人の描写は創作。壱与から前方後円墳(古墳時代)への接続はkofun-emergenceノードに続く。"}], "dramaScenesPeriphery": [{"sceneTitle": "第一幕　濠の上から", "characters": "環濠集落の見張り番クマ(架空)／年上の兵ヨロズ(架空)", "script": "環濠集落の物見台。夜番のクマは、隣に立つ古参の兵ヨロズに小声で話しかけた。\n「ヨロズ、いくさはいつまで続くんだろうな。おれの親父も、隣のクニとの戦で死んだ」\n「さあな。もう七年だ……儂が若い頃はここまでひどくなかった。鉄の産地を取り合って、あちこちのクニが刃を向け合っておる」\n遠くでかがり火が揺れる。クマは濠の底を見下ろした。\n「寄合では、女を王に立てて争いを止めるとかいう話も出ておるらしいが」\nヨロズは鼻で笑った。\n「儂ら下々には、決まったことが伝わってくるだけよ。誰が王になろうが、この濠を守るのはおれたちの仕事に変わりはない」\nそれでもクマは、初めて『終わるかもしれない』といういくさに、かすかな希望を抱いた。", "note": "倭国大乱の長期化・鉄を巡る争いは魏志倭人伝や考古学的知見(鉄鏃が刺さった人骨など)に基づく。クマ・ヨロズは完全な創作の架空人物で、具体的な会話は史料にない。中心編・第一幕と同じ時期のできごと。"}, {"sceneTitle": "第二幕　稲を刈る家族", "characters": "稲作民のハヤト(架空)／妻アカリ(架空)／老いた父(架空)", "script": "環濠集落のはずれ、水田の広がる一角。ハヤトは家族とともに、実った稲を鉄鎌で刈っていた。\n「今年は良い実りだ。これなら高床倉庫にも余裕を持って蓄えられる」\n妻のアカリが汗を拭いながら言う。\n「けれど、蓄えが多ければ多いほど、隣のクニに狙われるとも聞きます」\n老いた父が腰を伸ばしながら口を挟む。\n「わしが若い頃は、争いなど今ほどではなかった。稲を作れば作るほど、なぜ守るための濠と武器がいるようになったのか……」\nハヤトは遠く、集落の物見櫓を見上げた。\n「王様が立って、いくさが鎮まったと聞く。それでも濠は埋めぬ。用心に越したことはない」\nアカリは籠いっぱいの稲穂を抱え、小さく笑った。\n「それでも、こうして刈り入れができる年があるだけ、ましというものです」", "note": "環濠集落・高床倉庫・鉄鎌といった要素は考古学的に確認されている弥生後期の生活。ハヤト一家は完全な創作の架空人物。中心編・第二〜三幕と同じ、卑弥呼共立後の時期。"}, {"sceneTitle": "第三幕　鏡を磨く職人", "characters": "青銅器職人(架空)／弟子(架空)", "script": "工房では、渡来の技術を学んだ職人が、魏から贈られた銅鏡を手本に、新たな鏡を鋳込んでいた。\n弟子が鏡面を布で磨きながら尋ねる。\n「師匠、この模様は何を表しているのですか」\n「これは唐草のような文様よ。海の向こうの国の意匠だ。王様が魏から授かった鏡と同じ形を、こちらでも作れというお達しでな」\n弟子は鏡に映る自分の顔を見つめた。\n「不思議なものです。土から掘った石を溶かして、こうして人の顔を映す道具になるとは」\n職人は笑って答える。\n「鏡だけではない。剣も鏃も、皆この火から生まれる。青銅は祭りのため、鉄は暮らしのため――使い分けを間違えるなよ」\n弟子は頷き、再び鏡を磨き始めた。仕上がった鏡は、やがて有力者の墓に副葬されることになる。", "note": "魏から銅鏡百枚が贈られたこと、国内でも鏡が製作・副葬されたことは考古学的知見に基づく。職人と弟子の名・会話は創作。中心編・第四幕（難升米の遣使）と同じ時期のできごと。"}, {"sceneTitle": "第四幕　塚を築く人々", "characters": "稲作民のハヤト(架空)／幼い息子(架空)／村の年寄り(架空)", "script": "卑弥呼が世を去ってから幾月か過ぎた頃、ハヤトは村の男たちとともに、土を運ぶ夫役に駆り出されていた。目の前には、見たこともない大きさの塚が、日に日に高くなっていく。\n幼い息子が土を運ぶ籠を抱えながら尋ねる。\n「父さん、これはなんのために作っているの」\n「亡くなった王様の墓だそうだ。……これほど大きな墓、儂も見たことがない」\n隣で土を突き固めていた村の年寄りが口を挟む。\n「わしらの村からも、毎年のように夫役が出ておる。米を作る手間が減るのは痛いが……それでも、いくさが鎮まった代わりだと思えば」\nハヤトは汗を拭い、塚の頂を見上げた。\n「王様の顔は、誰も見たことがないというが……この大きな墓を見れば、どれほどの王様だったか分かる気がするな」\n夕暮れ時、土を運ぶ列は途切れることなく続いていた。この塚は、やがて列島各地に広がる前方後円墳という、新しい時代の墓の形の先駆けになる。", "note": "卑弥呼の死後、直径百余歩の塚が築かれたことは魏志倭人伝に基づく。夫役として動員された村人の視点は完全な創作で、ハヤト一家・年寄りは架空人物。中心編・第五幕と同じ時期のできごと。"}]}, {"id": "yellow-river-shang-zhou", "title": "中国文明の始まり（二里頭・殷・周）", "domain": "世界史", "region": "東アジア", "headline": "占いの記録から生まれた漢字と、「天命」で正当化される王朝交替", "startYear": -1900, "endYear": -1046, "eraLabel": "前19〜前11世紀", "summary": "黄河中流域で、前1900年頃の二里頭文化（夏王朝に比定する説がある）に続き、殷（商）が前16世紀頃に成立した。殷では王が亀甲・獣骨を焼いて吉凶を占い、その記録として甲骨文字（漢字の祖形）が刻まれた。高度な青銅器鋳造技術で祭器を作り、王は祖先祭祀を通じて統治した。前1046年頃、西方の周が殷を倒し、「天命が革まった」という理屈で支配を正当化、封建制と宗法で広い領域を治めた。", "regionCode": "CN", "lat": 36.13, "lng": 114.35, "factLevel": "有力説", "body": [{"label": "甲骨文字", "text": "殷墟（河南省安陽）から出土する占いの記録。王の狩り・戦・天候・出産などを問い、結果を刻んだ。表意文字の体系がすでに確立しており、以後3千年以上使われる漢字の直接の祖先にあたる。", "source": ""}, {"label": "青銅器と祭祀", "text": "殷の青銅器は武器より祭器（鼎など）が中心で、精緻な饕餮文で飾られた。金属と職人を独占することが王権の源泉であり、日本の弥生で青銅が祭器に純化したのと似た構図が、より大規模に見られる。", "source": ""}, {"label": "天命という発明", "text": "周は「徳を失った王朝は天に見放され、有徳者に交替する」という論理を立てた。これは以後の中国で王朝交替を説明する枠組み（易姓革命）となり、東アジア全体に影響した。", "source": ""}], "relatedTopics": [{"concept": "birth-of-writing", "relation": "関連", "note": "甲骨文字も宗教的な記録から出発した"}, {"concept": "yayoi-metal-tools", "relation": "対比", "note": "青銅を祭器に用いる構図は弥生の銅鐸文化と通じる"}, {"concept": "jomon-period", "relation": "同時代", "note": "殷が栄えた頃、日本は縄文晩期"}, {"concept": "yayoi-period", "relation": "継承", "note": "のちに中国王朝（漢）との交渉が倭のクニを動かす"}, {"concept": "neolithic-revolution", "relation": "因果", "note": "黄河のアワ作・長江のイネ作が土台"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "殷, 周, 甲骨文字, 青銅器, 天命", "lastUpdated": "2026-09-03"}, {"id": "yellowstone", "title": "イエローストーン国立公園", "domain": "地理", "region": "南北アメリカ", "headline": "イエローストーン＝『国立公園』という制度を世界で初めて生んだ土地", "summary": "1872年、世界で初めて『国立公園』に指定された火山性の台地。間欠泉オールド・フェイスフル、熱水泉、大峡谷を擁し、ハイイログマ・バイソン・オオカミが生息する。世界の『保護地域』概念の原型であり、1978年に世界遺産第1号の1件として登録された。", "isWorldHeritage": true, "relatedTopics": [{"concept": "galapagos", "relation": "関連", "note": "1978年 世界遺産第1号"}, {"concept": "great-barrier-reef", "relation": "関連", "note": "自然遺産保護の国際モデル"}, {"concept": "danger-list", "relation": "因果"}, {"concept": "registration-criteria", "relation": "テーマ"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "国立公園, 地熱, 世界遺産第1号, 世界遺産", "lastUpdated": "2026-09-03", "regionCode": "US", "lat": 44.6, "lng": -110.5, "body": [{"label": "国立公園制度の輸出", "text": "米国のこのモデルが世界に広がり、世界遺産の『自然遺産』カテゴリの土台になった。", "source": "パイロット"}, {"label": "危機遺産の経験", "text": "近隣の鉱山開発・下水・外来魚・バイソン管理をめぐり1995〜2003年に危機遺産リスト入り。対策後に解除された。", "source": "パイロット"}], "country": "アメリカ合衆国", "whType": "自然遺産", "inscriptionYear": 1978, "whCriteria": "vii, viii, ix, x", "whStatus": "登録", "ouv": "(vii)(viii)(ix)(x)。地球上の地熱現象の半数以上がここに集中し、手つかずの温帯生態系が残る。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Grand_Canyon_of_the_Yellowstone_Lower_Falls_%2895819p%29.jpg/960px-Grand_Canyon_of_the_Yellowstone_Lower_Falls_%2895819p%29.jpg", "imageCredit": "Rhododendrites / CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Gra function pushHist(){
  const s = _snap();
  if (s.mode==="home" && !s.domain) return;               // bare トップ is always reachable
  const t = HIST[HIST.length-1];
  if (t && t.mode===s.mode && t.id===s.id && t.domain===s.domain && t.focus===s.focus && t.dramaBranch===s.dramaBranch) return;
  HIST.push(s);
  if (HIST.length > 60) HIST.shift();
}
function goBack(){
  if (!HIST.length) return;
  Object.assign(st, HIST.pop());
  render(); window.scrollTo({top:0,behavior:"smooth"});
}
function jumpHist(i){
  if (i<0 || i>=HIST.length) return;
  const s = HIST[i];
  HIST = HIST.slice(0, i);
  Object.assign(st, s);
  render(); window.scrollTo({top:0,behavior:"smooth"});
}

function go(mode, opts={}){ pushHist(); Object.assign(st, {id:null,domain:null,region:null,focus:null,dramaBranch:null}, opts, {mode}); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function openConcept(id){ const r=BYID[id]; if(!r){return;} if(st.mode==="concept"&&st.id===id){return;} pushHist(); st.mode="concept"; st.id=id; st.dramaBranch=null; if(st.domain!==WH_CAT) st.domain=r.domain; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function focusOnMap(id){ const r=BYID[id]; if(!r || r.lat==null || r.lng==null){return;} pushHist(); st.mode="map"; st.focus=id; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function openDrama(id){ const r=BYID[id]; if(!r){return;} pushHist(); st.mode="drama"; st.id=id; st.dramaBranch=null; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function selectDramaBranch(branch){ pushHist(); st.dramaBranch=branch; render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",
    t.dataset.mode===st.mode || (st.mode==="concept"&&t.dataset.mode==="home") || (st.mode==="cat"&&t.dataset.mode==="home") || (st.mode==="drama"&&t.dataset.mode==="home")));
  renderCrumb();
  const v = document.getElementById("view");
  if (st.mode==="home") v.innerHTML = viewHome();
  else if (st.mode==="cat") v.innerHTML = viewCat(st.domain);
  else if (st.mode==="concept") v.innerHTML = viewConcept(st.id);
  else if (st.mode==="drama") v.innerHTML = viewDrama();
  else if (st.mode==="map") { v.innerHTML = viewMapShell(); drawMap(); }
  else if (st.mode==="timeline") { v.innerHTML = viewTimelineShell(); drawTimeline(); }
  v.classList.remove("rise"); void v.offsetWidth; v.classList.add("rise");
  bindView();
}
function renderCrumb(){
  const c = document.getElementById("crumb");
  let h = "";
  if (HIST.length) h += '<button class="backbtn" data-nav="back">← 戻る</button>';
  h += '<button data-nav="home">シナプスキーマトップ</button>';
  if (st.mode==="map"){
    h += '<span class="sep">/</span><span class="cur">地図</span>';
    if (st.focus && BYID[st.focus]) h += '<span class="sep">/</span><span class="cur">'+esc(BYID[st.focus].title)+'</span>';
  }
  else if (st.mode==="timeline") h += '<span class="sep">/</span><span class="cur">年表</span>';
  else if (st.mode==="cat") h += '<span class="sep">/</span><span class="cur">'+(st.domain===WH_CAT?"🏛️ 世界遺産":esc(st.domain))+'</span>';
  else if (st.mode==="concept"){
    // 辿ってきた概念の連なり（日本史⇄世界史を跨いでも全部並べる）
    const trail = [];
    for (let i=HIST.length-1; i>=0; i--){
      const s = HIST[i];
      if (s.mode==="concept" && s.id && BYID[s.id]) trail.unshift({ id:s.id, i });
      else break;
    }
    trail.push({ id:st.id, i:-1 });
    const seen = [];
    trail.forEach(x=>{ if (!seen.length || seen[seen.length-1].id!==x.id) seen.push(x); });
    const f = BYID[seen[0].id] || {};
    const startsWH = !!f.isWorldHeritage;
    const clab = startsWH ? "🏛️ 世界遺産" : (f.domain || "");
    const cid = startsWH ? WH_CAT : f.domain;
    if (clab) h += '<span class="sep">/</span><button data-nav="cat" data-d="'+esc(cid)+'">'+esc(clab)+'</button>';
    seen.forEach((x,idx)=>{
      h += '<span class="sep">'+(idx===0?'/':'›')+'</span>';
      const t = esc((BYID[x.id]||{}).title || x.id);
      if (idx===seen.length-1) h += '<span class="cur">'+t+'</span>';
      else h += '<button data-nav="jump" data-i="'+x.i+'">'+t+'</button>';
    });
  }
  else if (st.mode==="drama"){
    const f = BYID[st.id] || {};
    if (f.domain) h += '<span class="sep">/</span><button data-nav="cat" data-d="'+esc(f.domain)+'">'+esc(f.domain)+'</button>';
    h += '<span class="sep">›</span><button data-nav="concept" data-id="'+esc(st.id)+'">'+esc(f.title||st.id)+'</button>';
    if (st.dramaBranch) h += '<span class="sep">›</span><button data-nav="drama" data-id="'+esc(st.id)+'">🎭 ドラマ</button>'
      + '<span class="sep">›</span><span class="cur">'+(st.dramaBranch==="center"?"🏛️ 中心":"🌾 周辺")+'</span>';
    else h += '<span class="sep">›</span><span class="cur">🎭 ドラマ</span>';
  }
  c.innerHTML = h;
}

function viewHome(){
  // 日本史 / 世界史 / 地理 / 世界遺産 を対等な「レイヤー」として並べる
  const LAYERS = DOMAINS.filter(d=>d.id!=="横断テーマ");
  let h = '<div class="subhead">レイヤーを選ぶ</div>';
  h += LAYERS.map(d=>{
    const n = RECORDS.filter(r=>r.domain===d.id).length;
    return '<div class="catcard" data-open-cat="'+esc(d.id)+'"><span class="n">'+n+'</span><h2>'+esc(d.id)+'</h2><p>'+esc(d.desc)+'</p></div>';
  }).join("");
  const whN = RECORDS.filter(r=>r.isWorldHeritage).length;
  if (whN) h += '<div class="catcard wh" data-open-cat="'+WH_CAT+'"><span class="n">'+whN+'</span><h2>🏛️ 世界遺産</h2>'
    + '<p>UNESCO 世界遺産に登録された遺跡・自然・都市と、その制度（OUV・登録基準・危機遺産・条約）。日本史・世界史・地理のノードにまたがる横断レイヤー。</p></div>';
  const themeN = RECORDS.filter(r=>r.domain==="横断テーマ").length;
  if (themeN) h += '<div class="subhead">そのほか</div>'
    + '<div class="catcard" data-open-cat="横断テーマ"><span class="n">'+themeN+'</span><h2>横断テーマ</h2><p>時代・地域をまたぐ主題。</p></div>';
  return h;
}

function viewCat(domain){
  const isWH = domain===WH_CAT;
  const list = RECORDS.filter(r=> isWH ? r.isWorldHeritage : r.domain===domain);
  let out = isWH ? '<p style="font-size:12.5px;color:#94a3b8;margin:0 0 12px">遺産のページから、それを生んだ時代・地域の歴史ノードへそのまま辿れる。</p>' : "";
  const groups = {};
  list.forEach(r=>{ (groups[r.region]=groups[r.region]||[]).push(r); });
  const multi = Object.keys(groups).length>1;
  REGION_ORDER.forEach(rg=>{
    const g = groups[rg]; if(!g) return;
    g.sort((a,b)=> isWH ? ((a.inscriptionYear??9e9)-(b.inscriptionYear??9e9)) : ((a.startYear??9e9)-(b.startYear??9e9)));
    if (multi) out += '<div class="subhead">'+esc(rg)+'</div>';
    out += g.map(r=>nodeBtn(r,isWH)).join("");
  });
  return out || '<div class="err">まだノードがありません。</div>';
}
function hasDramaR(r){ return (Array.isArray(r.dramaScenesCenter)&&r.dramaScenesCenter.length) || (Array.isArray(r.dramaScenesPeriphery)&&r.dramaScenesPeriphery.length); }
function nodeBtn(r, whMode){
  const rt = whMode
    ? (r.inscriptionYear ? r.inscriptionYear+"年登録" : (r.eraLabel||""))
    : (r.eraLabel||yrText(r));
  return '<button class="nodebtn" data-open="'+esc(r.id)+'"><div class="row1"><span class="t">'
    +'<span class="dom '+domTag(r.domain)+'" style="margin-right:7px">'+esc(r.domain)+'</span>'
    + (r.isWorldHeritage ? '<span class="whb">🏛 '+esc(r.whType||"世界遺産")+'</span> ' : '')
    + (hasDramaR(r) ? '<span class="dramab">🎭 ドラマ</span> ' : '')
    + esc(r.title)
    + (r.whStatus==="危機遺産" ? ' <span class="whb danger">危機遺産</span>' : '')
    +'</span><span class="y">'+esc(rt)+'</span></div>'
    +'<div class="h">'+esc(r.headline||"")+'</div></button>';
}

function viewConcept(id){
  const r = BYID[id]; if(!r) return '<div class="err">not found</div>';
  let h = '<div class="d-head">';
  h += '<div class="d-meta"><span class="dom '+domTag(r.domain)+'">'+esc(r.domain)+'</span>';
  if (r.isWorldHeritage) h += '<span class="whb">🏛 '+esc(r.whType||"世界遺産")+'</span>';
  h += '<span>📍 '+esc(r.region)+(r.country?'・'+esc(r.country):'')+'</span>';
  if (r.eraLabel || yrText(r)) h += '<span>🕰 '+esc([r.eraLabel, yrText(r)].filter(Boolean).join(" ・ "))+'</span>';
  if (r.inscriptionYear) h += '<span>🗓 '+r.inscriptionYear+'年 登録</span>';
  if (r.factLevel) h += '<span>🔎 '+esc(r.factLevel)+'</span>';
  h += '</div><h1 class="d-title">'+esc(r.title)+'</h1>';
  if (r.headline) h += '<p class="d-headline">'+esc(r.headline)+'</p>';
  if (r.summary) h += '<p class="d-summary">'+esc(r.summary)+'</p>';
  if (r.imageUrl) h += '<figure class="d-photo"><img src="'+esc(r.imageUrl)+'" alt="'+esc(r.title)+'" loading="lazy" referrerpolicy="no-referrer">'
    + '<figcaption>📷 '
    + (r.imageLink ? '<a href="'+esc(r.imageLink)+'" target="_blank" rel="noopener">'+esc(r.imageCredit||'Wikimedia Commons')+'</a>' : esc(r.imageCredit||'Wikimedia Commons'))
    + '</figcaption></figure>';
  {
    const hasDrama = (Array.isArray(r.dramaScenesCenter)&&r.dramaScenesCenter.length) || (Array.isArray(r.dramaScenesPeriphery)&&r.dramaScenesPeriphery.length);
    const hasMap = r.lat!=null && r.lng!=null;
    if (hasMap || hasDrama){
      h += '<div class="d-actions">';
      if (hasMap) h += '<button class="mapbtn" data-map-focus="'+esc(r.id)+'">🗺️ 地図で見る</button>';
      if (hasDrama) h += '<button class="dramabtn" data-open-drama="'+esc(r.id)+'">🎭 ドラマで読む</button>';
      h += '</div>';
    }
  }
  h += '</div>';

  // panel: 世界遺産情報
  if (r.isWorldHeritage && (r.inscriptionYear || r.whCriteria || r.whStatus || r.ouv)){
    h += '<div class="panel wh"><h3>🏛️ 世界遺産情報</h3><div class="p-body">';
    const rows = [];
    if (r.whType) rows.push(["種別", esc(r.whType)]);
    if (r.inscriptionYear) rows.push(["登録年", r.inscriptionYear+"年"]);
    if (r.whCriteria && r.whCriteria!=="—") rows.push(["登録基準", r.whCriteria.split(/[,\s]+/).filter(Boolean).map(x=>"("+x+")").join("")]);
    if (r.whStatus) rows.push(["リスト状態", esc(r.whStatus)]);
    if (rows.length) h += '<div class="whgrid">'+rows.map(x=>'<span class="k">'+x[0]+'</span><span class="v">'+x[1]+'</span>').join("")+'</div>';
    if (r.ouv) h += '<p class="bt" style="margin-top:10px"><b style="color:#fff">顕著な普遍的価値（OUV）</b><br>'+esc(r.ouv)+'</p>';
    h += '</div></div>';
  }

  // panel: 掘り下げ
  if (Array.isArray(r.body) && r.body.length){
    h += '<div class="panel"><h3>🧩 掘り下げ</h3><div class="p-body">'
      + r.body.map(b=>'<div class="item">'
          + (b.label?'<h4>'+esc(b.label)+'</h4>':'')
          + '<p class="bt">'+esc(b.text)+'</p>'
          + (b.source?'<div class="src">— '+esc(b.source)+'</div>':'')
        +'</div>').join("")
      + '</div></div>';
  }

  // panel: 関連ノード grouped by relation
  if (Array.isArray(r.relatedTopics) && r.relatedTopics.length){
    const byRel = {};
    r.relatedTopics.forEach(t=>{ (byRel[t.relation||"関連"]=byRel[t.relation||"関連"]||[]).push(t); });
    h += '<div class="panel"><h3>🔗 関連ノード</h3>';
    Object.keys(byRel).forEach(rel=>{
      const col = REL_COLORS[rel]||"#38bdf8";
      h += '<div class="rel" style="--rc:'+col+'"><div class="rl">'+esc(rel)+'</div>';
      h += byRel[rel].map(t=>chip(t.concept, t.note)).join("");
      h += '</div>';
    });
    h += '</div>';
  }

  // panel: 同時代の世界 (computed bridge) — 地域別にグルーピング
  const bridge = RECORDS.filter(o=> o.id!==r.id && o.region!==r.region && overlap(o,r));
  if (bridge.length){
    const bg = {};
    bridge.forEach(o=> (bg[o.region]=bg[o.region]||[]).push(o));
    h += '<div class="panel"><h3>🌏 同時代の世界（この時代、他地域では）</h3>';
    REGION_ORDER.forEach(rg=>{
      const g = bg[rg]; if(!g) return;
      g.sort((a,b)=>(a.startYear??0)-(b.startYear??0));
      const col = rg==="日本" ? "#fb7185" : "#38bdf8";
      h += '<div class="rel" style="--rc:'+col+'"><div class="rl">'+esc(rg)+'</div>'
        + g.map(o=>chip(o.id, o.eraLabel||yrText(o), o.domain==="日本史"?"rj":"")).join("")
        + '</div>';
    });
    h += '</div>';
  }

  // panel: ここへリンクしているノード
  const back = RECORDS.filter(o=> Array.isArray(o.relatedTopics) && o.relatedTopics.some(t=>t.concept===r.id));
  if (back.length){
    h += '<div class="panel"><h3>↩︎ ここへ言及しているノード</h3><div>'
      + back.map(o=>{
          const t = o.relatedTopics.find(t=>t.concept===r.id) || {};
          return chip(o.id, (t.relation? t.relation+"として":""));
        }).join("")
      + '</div></div>';
  }

  // panel: 出典
  if (Array.isArray(r.sourceArticles) && r.sourceArticles.length){
    h += '<div class="panel"><h3>📚 投入元</h3><div class="p-body" style="font-size:12px;color:#94a3b8">'
      + r.sourceArticles.map(s=>'<div class="item" style="border-color:rgba(255,255,255,.06)">'
          + esc(s.sourceName||"") + (s.date?' <span style="color:#64748b">('+esc(s.date)+')</span>':'')
          + (s.ref?'<br><span style="color:#64748b">'+esc(s.ref)+'</span>':'')
        +'</div>').join("")
      + '</div></div>';
  }

  {
    const cid = st.domain===WH_CAT ? WH_CAT : r.domain;
    const clab = st.domain===WH_CAT ? "🏛️ 世界遺産" : r.domain;
    h += '<button class="tab" data-nav="cat" data-d="'+esc(cid)+'" style="margin-top:6px">← '+esc(clab)+' の一覧へ</button>';
  }

  // 次の時代へ：同じ一覧（同じ区分・同じ地域、一覧と同じ並び順）の次のノードへ直接移動
  {
    const isWH = st.domain === WH_CAT;
    const seq = RECORDS.filter(o => (isWH ? o.isWorldHeritage : o.domain === r.domain) && o.region === r.region);
    seq.sort((a,b)=> isWH ? ((a.inscriptionYear??9e9)-(b.inscriptionYear??9e9)) : ((a.startYear??9e9)-(b.startYear??9e9)));
    const idx = seq.findIndex(o => o.id === r.id);
    const next = idx>=0 ? seq[idx+1] : null;
    if (next) {
      h += '<button class="tab" data-open="'+esc(next.id)+'" style="margin-top:6px;margin-left:6px">次の時代へ：'+esc(next.title)+' →</button>';
    }
  }
  return h;
}

/* ---------- drama drill-down (完全創作、中心／周辺の二分岐) ---------- */
function viewDrama(){
  const r = BYID[st.id]; if(!r) return '<div class="err">not found</div>';
  const cScenes = Array.isArray(r.dramaScenesCenter) ? r.dramaScenesCenter : [];
  const pScenes = Array.isArray(r.dramaScenesPeriphery) ? r.dramaScenesPeriphery : [];
  const backBtn = '<button class="tab" data-nav="concept" data-id="'+esc(r.id)+'" style="margin-top:14px">← '+esc(r.title)+' のページへ</button>';

  if (!st.dramaBranch){
    let h = '<div class="d-head"><span class="dtag">🎭 完全創作ドラマ・史実ではありません</span>'
      + '<h1 class="d-title">'+esc(r.title)+'</h1>';
    if (r.dramaIntro) h += '<p class="d-summary">'+esc(r.dramaIntro)+'</p>';
    h += '</div>';
    h += '<div class="dramabranch">';
    if (cScenes.length) h += '<div class="catcard drama" data-drama-branch="center"><h2>🏛️ 中心</h2><p>その時代を生きた代表的な人々のものがたり。（全'+cScenes.length+'幕）</p></div>';
    if (pScenes.length) h += '<div class="catcard drama" data-drama-branch="periphery"><h2>🌾 周辺</h2><p>その時代を「周辺」として生きた、名もなき人々のものがたり。（全'+pScenes.length+'幕）</p></div>';
    h += '</div>';
    h += backBtn;
    return h;
  }

  const scenes = st.dramaBranch==="center" ? cScenes : pScenes;
  const label = st.dramaBranch==="center" ? "🏛️ 中心" : "🌾 周辺";
  let h = '<div class="d-head"><span class="dtag">🎭 完全創作ドラマ・史実ではありません</span>'
    + '<h1 class="d-title">'+esc(r.title)+'　'+label+'</h1></div>';
  h += '<div class="panel drama"><div class="p-body">'
    + scenes.map(s=>'<div class="item">'
        + (s.sceneTitle?'<h4>'+esc(s.sceneTitle)+'</h4>':'')
        + (s.characters?'<div class="ppl">👤 '+esc(s.characters)+'</div>':'')
        + '<p class="bt">'+esc(s.script)+'</p>'
        + (s.note?'<div class="src">📝 '+esc(s.note)+'</div>':'')
      +'</div>').join("")
    + '</div></div>';
  h += '<button class="tab" data-nav="drama" data-id="'+esc(r.id)+'" style="margin-top:6px">← 中心／周辺を選び直す</button> '
    + backBtn;
  return h;
}

function chip(id, note, extra){
  const r = BYID[id];
  const cls = "chip " + (extra||"") + (r ? (r.domain==="地理"?" gj":"") : " dead");
  const label = r ? r.title : id;
  return '<span class="'+cls+'" '+(r?'data-open="'+esc(id)+'"':'')+'>'+esc(label)
    + (note?'<span class="cn">'+esc(note)+'</span>':'') + '</span>';
}

/* ---------- map ---------- */
function viewMapShell(){
  let banner = "";
  if (st.focus && BYID[st.focus]){
    const r = BYID[st.focus];
    banner = '<div class="focusbanner">📍 <b>'+esc(r.title)+'</b> の位置を赤で表示中'
      + '<button data-map-clear="1">すべて表示</button>'
      + '<button data-back-concept="'+esc(r.id)+'">← ページに戻る</button></div>';
  }
  return banner + '<div id="mapbox"><svg id="mapsvg"></svg>'
    + '<div class="mapzoom"><button data-z="in">＋</button><button data-z="out">−</button><button data-z="reset">⟳</button></div>'
    + '<div class="maphint">地域をクリック → その地域のノード一覧。点は都市・遺跡。ドラッグ／ホイールで移動・拡大。</div></div>'
    + '<p style="font-size:12px;color:#64748b;margin-top:10px">色つき＝ノードのある地域。</p>';
}
let mapZoom=null, mapG=null, mapSvg=null;
function drawMap(){
  const box = document.getElementById("mapbox");
  const W = box.clientWidth, H = box.clientHeight;
  mapSvg = d3.select("#mapsvg").attr("viewBox",[0,0,W,H]).html("");
  const proj = d3.geoNaturalEarth1().fitExtent([[8,10],[W-8,H-10]], {type:"Sphere"});
  const path = d3.geoPath(proj);
  mapG = mapSvg.append("g");
  mapG.append("path").attr("class","sphere").attr("d", path({type:"Sphere"}));

  const geoms = WORLD_TOPO.objects.countries.geometries;
  const haveRegions = new Set(RECORDS.map(r=>r.region));
  const gc = mapG.append("g");
  const gl = mapG.append("g");
  REGION_ORDER.forEach(rg=>{
    if (rg==="グローバル") return;
    const a2 = REGION_A2[rg]||[];
    const nums = new Set(a2.map(a=>A2N[a]).filter(Boolean));
    const gs = geoms.filter(g=>nums.has(String(g.id)));
    if (!gs.length) return;
    const feat = topojson.merge(WORLD_TOPO, gs);
    const has = haveRegions.has(rg);
    gc.append("path").attr("d", path(feat))
      .attr("class","rgn "+(has?"has":"empty"))
      .on("click", ()=> has && openRegionDrawer(rg));
    if (has){
      const c = path.centroid(feat);
      if (c && !isNaN(c[0])) gl.append("text").attr("class","rlabel").attr("x",c[0]).attr("y",c[1]).text(rg);
    }
  });

  const gm = mapG.append("g");
  RECORDS.filter(r=>r.lat!=null && r.lng!=null).forEach(r=>{
    const p = proj([r.lng, r.lat]); if(!p) return;
    const c = gm.append("circle").attr("class","mk "+domClass(r.domain)+(r.isWorldHeritage?" wh":""))
      .attr("cx",p[0]).attr("cy",p[1]).attr("r",r.isWorldHeritage?6:5)
      .style("cursor","pointer")
      .on("click", ()=> openConcept(r.id));
    c.append("title").text(r.title);
  });

  // focus marker (from "地図で見る")
  let focusPt = null;
  if (st.focus){
    const fr = BYID[st.focus];
    if (fr && fr.lat!=null && fr.lng!=null){
      focusPt = proj([fr.lng, fr.lat]);
      const fg = mapG.append("g").attr("class","focusg");
      fg.append("circle").attr("class","focusring").attr("cx",focusPt[0]).attr("cy",focusPt[1]).attr("r",5);
      fg.append("circle").attr("class","focusdot").attr("cx",focusPt[0]).attr("cy",focusPt[1]).attr("r",7)
        .on("click", ()=> openConcept(fr.id))
        .append("title").text(fr.title);
      fg.append("text").attr("x",focusPt[0]).attr("y",focusPt[1]-13).text(fr.title);
    }
  }

  mapZoom = d3.zoom().scaleExtent([1,8]).on("zoom", ev=>{
    mapG.attr("transform", ev.transform);
    mapG.selectAll("path.rgn").attr("stroke-width", .6/ev.transform.k);
    mapG.selectAll("circle.mk").attr("r", 5/ev.transform.k).attr("stroke-width", 1.2/ev.transform.k);
    mapG.selectAll("circle.focusdot").attr("r", 7/ev.transform.k).attr("stroke-width", 2/ev.transform.k);
    mapG.selectAll("circle.focusring").attr("stroke-width", 2/ev.transform.k);
    mapG.selectAll(".focusg text").attr("font-size", (12/ev.transform.k)+"px")
      .attr("stroke-width", 3.5/ev.transform.k).attr("y", focusPt ? focusPt[1]-13/ev.transform.k : null);
  });
  mapSvg.call(mapZoom);
  box.querySelectorAll(".mapzoom button").forEach(b=> b.onclick = ()=>{
    if (b.dataset.z==="in") mapSvg.transition().call(mapZoom.scaleBy, 1.6);
    else if (b.dataset.z==="out") mapSvg.transition().call(mapZoom.scaleBy, .625);
    else mapSvg.transition().call(mapZoom.transform, d3.zoomIdentity);
  });

  if (focusPt){
    const k = 4;
    const tr = d3.zoomIdentity.translate(W/2 - k*focusPt[0], H/2 - k*focusPt[1]).scale(k);
    mapSvg.transition().duration(700).call(mapZoom.transform, tr);
  }
}
function openRegionDrawer(rg){
  const list = RECORDS.filter(r=>r.region===rg).sort((a,b)=>(a.startYear??9e9)-(b.startYear??9e9));
  document.getElementById("dwtitle").textContent = rg + "（"+list.length+"）";
  document.getElementById("dwbody").innerHTML = list.map(r=>
    '<div style="padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer" data-open="'+esc(r.id)+'">'
    + '<span class="dom '+domTag(r.domain)+'">'+esc(r.domain)+'</span>'
    + '<div style="font-weight:800;margin:5px 0 3px">'+esc(r.title)+'</div>'
    + '<div style="font-size:12px;color:#7dd3fc">'+esc(r.headline||"")+'</div>'
    + '<div style="font-size:11px;color:#64748b;margin-top:3px">'+esc(r.eraLabel||yrText(r))+'</div></div>'
  ).join("") || '<div style="padding:20px;color:#64748b">なし</div>';
  document.getElementById("drawer").classList.add("open");
}

/* ---------- timeline ---------- */
const TL_PRESETS = [
  { id:"all",  label:"全期間" },
  { id:"anc",  label:"古代 (〜500)",       min:-3600, max:600 },
  { id:"med",  label:"中世 (500〜1500)",   min:400,   max:1600 },
  { id:"early",label:"近世 (1500〜1800)",  min:1450,  max:1850 },
  { id:"mod",  label:"近現代 (1800〜)",     min:1780,  max:2040 },
];
let tlPreset = "all";
let tlMode = "hist";
function viewTimelineShell(){
  const wh = tlMode==="wh";
  return '<p style="font-size:12.5px;color:#94a3b8;margin:0 0 10px">'
    + (wh ? '世界遺産条約が動き出した1978年から、いつ・どの地域で登録が進んだかを俯瞰する。バーをクリックで解説ページへ。'
          : '日本と世界を同じ時間軸で俯瞰する。バーをクリックで解説ページへ。赤い基準線を動かすと、その年に東西で何が起きていたかが読める。')
    + '</p>'
    + '<div class="tlctl" style="gap:6px">'
      + '<button class="tab tlmode'+(!wh?" on":"")+'" data-m="hist" style="padding:4px 10px;font-size:11px">📜 通史</button>'
      + '<button class="tab tlmode'+(wh?" on":"")+'" data-m="wh" style="padding:4px 10px;font-size:11px">🏛️ 世界遺産（登録年）</button>'
    + '</div>'
    + (wh ? "" : '<div class="tlctl" style="gap:6px">' + TL_PRESETS.map(p=>'<button class="tab tlpreset" data-p="'+p.id+'" style="padding:4px 9px;font-size:11px">'+p.label+'</button>').join("") + '</div>')
    + '<div class="tlctl"><input id="tlyr" type="range"><span class="tlread" id="tlread"></span></div>'
    + '<div class="tlwrap"><div id="tllanes"></div></div>'
    + '<div class="tlchips" id="tlchips"></div>';
}
function drawTimeline(){
  if (tlMode==="wh") return drawTimelineWH();
  const dated = RECORDS.filter(r=>r.startYear!=null);
  const undated = RECORDS.filter(r=>r.startYear==null);
  let MIN, MAX;
  const preset = TL_PRESETS.find(p=>p.id===tlPreset);
  if (preset && preset.min!=null){ MIN = preset.min; MAX = preset.max; }
  else {
    MIN = Math.min(...dated.map(r=>r.startYear)) - 80;
    MAX = Math.max(...dated.map(r=> r.endYear ?? r.startYear)) + 80;
    if (!isFinite(MIN)) { MIN=-1000; MAX=100; }
    MIN = Math.max(MIN, -4200);  // 全期間表示では極端に古い外れ値でスケールを潰さない
  }
  document.querySelectorAll(".tlpreset").forEach(b=> b.classList.toggle("on", b.dataset.p===tlPreset));
  const PXW = Math.max(760, (document.getElementById("tllanes").clientWidth||760));
  const clamp = v => Math.max(0, Math.min(PXW, v));
  const x = y => ((y-MIN)/(MAX-MIN))*PXW;

  const yr = document.getElementById("tlyr");
  yr.min = Math.floor(MIN/10)*10; yr.max = Math.ceil(MAX/10)*10; yr.step = 10;
  if (!yr.value || +yr.value<+yr.min || +yr.value>+yr.max)
    yr.value = (MIN<=-330 && MAX>=-330) ? -330 : Math.round((MIN+MAX)/2/10)*10;

  const byRegion = {};
  dated.forEach(r=> (byRegion[r.region]=byRegion[r.region]||[]).push(r));
  const lanes = document.getElementById("tllanes");
  lanes.style.width = PXW+"px";
  lanes.innerHTML = "";

  REGION_ORDER.forEach(rg=>{
    const recs = byRegion[rg]; if(!recs) return;
    recs.sort((a,b)=>a.startYear-b.startYear);
    const rows=[];
    recs.forEach(r=>{
      const rawS = x(r.startYear), rawE = x(r.endYear ?? r.startYear);
      const s = clamp(rawS), e = Math.max(clamp(Math.max(rawE, rawS+64)), s+8);
      let ri=rows.findIndex(v=>v<=s-4); if(ri<0){ri=rows.length;rows.push(0);}
      rows[ri]=e; r._x=s; r._w=e-s; r._row=ri;
      r._clipL = rawS < -2; r._clipR = rawE > PXW+2;
      r._inRange = rawE >= -2 && rawS <= PXW+2;
    });
    if (!recs.some(r=>r._inRange)) return;
    const isJP = rg==="日本";
    const nm = document.createElement("div");
    nm.className = "laneName "+(isJP?"jp":"world");
    nm.textContent = (isJP?"🇯🇵 ":"🌏 ")+rg;
    lanes.appendChild(nm);
    const track = document.createElement("div");
    track.className = "track";
    track.style.height = (rows.length*26+6)+"px";
    recs.forEach(r=>{
      if (!r._inRange) return;
      const bar=document.createElement("div");
      bar.className = "bar b-"+domClass(r.domain);
      bar.style.cssText = `left:${r._x}px;width:${r._w}px;top:${r._row*26+3}px`;
      bar.textContent = (r._clipL?"◀ ":"") + r.title + (r._clipR?" ▶":"");
      bar.dataset.s = r.startYear; bar.dataset.e = (r.endYear ?? r.startYear);
      bar.dataset.open = r.id;
      bar.title = r.title+"  ["+yrText(r)+"]";
      track.appendChild(bar);
    });
    const cur=document.createElement("div"); cur.className="cursor"; cur.dataset.role="cur";
    cur.innerHTML="<b></b>"; track.appendChild(cur);
    lanes.appendChild(track);
  });

  const axis=document.createElement("div"); axis.className="axis";
  for (let y=Math.ceil(MIN/100)*100; y<=MAX; y+=100){
    const s=document.createElement("span"); s.style.left=x(y)+"px";
    s.textContent = y<0?("前"+(-y)):(y===0?"0":y); axis.appendChild(s);
  }
  lanes.appendChild(axis);

  if (undated.length){
    document.getElementById("tlchips").innerHTML =
      '<div class="subhead">🌏 地誌・年代なし</div>' +
      undated.map(r=>'<span class="chip gj" data-open="'+esc(r.id)+'">'+esc(r.title)+' ｜ '+esc(r.region)+'</span>').join("");
  } else document.getElementById("tlchips").innerHTML = "";

  function upd(){
    const y = +yr.value;
    const px = x(y);
    document.querySelectorAll('.cursor').forEach(c=>{ c.style.left=px+"px"; c.querySelector("b").textContent = y<0?("前"+(-y)):y; });
    const jp=[], wd=[];
    document.querySelectorAll('.bar').forEach(b=>{
      const hit = y>=+b.dataset.s-40 && y<=+b.dataset.e+40;
      b.style.opacity = hit?"1":"0.25";
      if (hit){ const r=BYID[b.dataset.open]; if(r){ (r.region==="日本"?jp:wd).push(r.title); } }
    });
    document.getElementById("tlread").innerHTML =
      '<b>'+(y<0?("前"+(-y)):y)+'年</b> ── 🇯🇵 '+(jp.join("、")||"—")+'　／　🌏 '+(wd.join("、")||"—");
  }
  yr.oninput = upd;
  upd();
}

function drawTimelineWH(){
  const dated = RECORDS.filter(r=>r.isWorldHeritage && r.inscriptionYear!=null);
  const undated = RECORDS.filter(r=>r.isWorldHeritage && r.inscriptionYear==null);
  let MIN = 1975, MAX = new Date().getFullYear()+2;
  if (dated.length){
    MIN = Math.min(MIN, Math.min(...dated.map(r=>r.inscriptionYear))-1);
    MAX = Math.max(MAX, Math.max(...dated.map(r=>r.inscriptionYear))+1);
  }
  const PXW = Math.max(760, (document.getElementById("tllanes").clientWidth||760));
  const clamp = v => Math.max(0, Math.min(PXW, v));
  const x = y => ((y-MIN)/(MAX-MIN))*PXW;
  const yr = document.getElementById("tlyr");
  yr.min = MIN; yr.max = MAX; yr.step = 1;
  if (!yr.value || +yr.value<MIN || +yr.value>MAX) yr.value = 1994;

  const byRegion = {};
  dated.forEach(r=> (byRegion[r.region]=byRegion[r.region]||[]).push(r));
  const lanes = document.getElementById("tllanes");
  lanes.style.width = PXW+"px"; lanes.innerHTML = "";
  REGION_ORDER.forEach(rg=>{
    const recs = byRegion[rg]; if(!recs) return;
    recs.sort((a,b)=>a.inscriptionYear-b.inscriptionYear);
    const rows=[];
    recs.forEach(r=>{
      const rawS = x(r.inscriptionYear);
      const s = clamp(rawS), e = Math.max(s+64, s+8);
      let ri=rows.findIndex(v=>v<=s-4); if(ri<0){ri=rows.length;rows.push(0);}
      rows[ri]=e; r._x=s; r._w=e-s; r._row=ri;
    });
    const isJP = rg==="日本";
    const nm = document.createElement("div");
    nm.className = "laneName "+(isJP?"jp":"world");
    nm.textContent = (isJP?"🇯🇵 ":"🌏 ")+rg+"（"+recs.length+"）";
    lanes.appendChild(nm);
    const track = document.createElement("div");
    track.className = "track";
    track.style.height = (rows.length*26+6)+"px";
    recs.forEach(r=>{
      const bar=document.createElement("div");
      bar.className = "bar b-"+domClass(r.domain);
      bar.style.cssText = `left:${r._x}px;width:${r._w}px;top:${r._row*26+3}px`;
      bar.textContent = r.title;
      bar.dataset.yr = r.inscriptionYear;
      bar.dataset.open = r.id;
      bar.title = r.title+"（"+r.inscriptionYear+"年登録）";
      track.appendChild(bar);
    });
    const cur=document.createElement("div"); cur.className="cursor"; cur.innerHTML="<b></b>"; track.appendChild(cur);
    lanes.appendChild(track);
  });
  const axis=document.createElement("div"); axis.className="axis";
  for (let y=Math.ceil(MIN/5)*5; y<=MAX; y+=5){
    const s=document.createElement("span"); s.style.left=x(y)+"px"; s.textContent=y; axis.appendChild(s);
  }
  lanes.appendChild(axis);
  document.getElementById("tlchips").innerHTML = undated.length
    ? '<div class="subhead">🧭 制度・考え方（登録年なし）</div>' + undated.map(r=>'<span class="chip" data-open="'+esc(r.id)+'">'+esc(r.title)+'</span>').join("")
    : "";
  function upd(){
    const y = +yr.value, px = x(y);
    document.querySelectorAll('.cursor').forEach(c=>{ c.style.left=px+"px"; c.querySelector("b").textContent=y; });
    const hits=[];
    document.querySelectorAll('.bar').forEach(b=>{
      const hit = +b.dataset.yr===y;
      b.style.opacity = hit?"1":"0.28";
      if (hit){ const r=BYID[b.dataset.open]; if(r) hits.push(r.title); }
    });
    document.getElementById("tlread").innerHTML = '<b>'+y+'年</b> に登録 ── '+(hits.join("、")||"（この年の登録はこの図鑑に未収録）");
  }
  yr.oninput = upd; upd();
}

/* ---------- events ---------- */
function bindView(){
  document.getElementById("view").querySelectorAll("[data-open]").forEach(el=>{
    el.style.cursor="pointer";
    el.addEventListener("click", e=>{ e.stopPropagation(); openConcept(el.dataset.open); });
  });
  document.getElementById("view").querySelectorAll("[data-open-cat]").forEach(el=>{
    el.addEventListener("click", ()=> go("cat",{domain:el.dataset.openCat}));
  });
  document.getElementById("view").querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      if (el.dataset.nav==="home") go("home");
      else if (el.dataset.nav==="cat") go("cat",{domain:el.dataset.d});
      else if (el.dataset.nav==="back") goBack();
      else if (el.dataset.nav==="concept") openConcept(el.dataset.id);
      else if (el.dataset.nav==="drama"){ pushHist(); st.dramaBranch=null; render(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
  });
  document.getElementById("view").querySelectorAll("[data-open-drama]").forEach(el=>{
    el.addEventListener("click", e=>{ e.stopPropagation(); openDrama(el.dataset.openDrama); });
  });
  document.getElementById("view").querySelectorAll("[data-drama-branch]").forEach(el=>{
    el.addEventListener("click", ()=> selectDramaBranch(el.dataset.dramaBranch));
  });
  document.getElementById("view").querySelectorAll(".tlpreset").forEach(el=>{
    el.addEventListener("click", ()=>{ tlPreset = el.dataset.p; drawTimeline(); });
  });
  document.getElementById("view").querySelectorAll(".tlmode").forEach(el=>{
    el.addEventListener("click", ()=>{ tlMode = el.dataset.m; render(); });
  });
  document.getElementById("view").querySelectorAll("[data-map-focus]").forEach(el=>{
    el.addEventListener("click", e=>{ e.stopPropagation(); focusOnMap(el.dataset.mapFocus); });
  });
  document.getElementById("view").querySelectorAll("[data-map-clear]").forEach(el=>{
    el.addEventListener("click", ()=>{ st.focus=null; render(); });
  });
  document.getElementById("view").querySelectorAll("[data-back-concept]").forEach(el=>{
    el.addEventListener("click", ()=> openConcept(el.dataset.backConcept));
  });
}
document.getElementById("crumb").addEventListener("click", e=>{
  const b = e.target.closest("[data-nav]"); if(!b) return;
  if (b.dataset.nav==="home") go("home");
  else if (b.dataset.nav==="cat") go("cat",{domain:b.dataset.d});
  else if (b.dataset.nav==="back") goBack();
  else if (b.dataset.nav==="jump") jumpHist(+b.dataset.i);
  else if (b.dataset.nav==="concept") openConcept(b.dataset.id);
  else if (b.dataset.nav==="drama"){ pushHist(); st.dramaBranch=null; render(); window.scrollTo({top:0,behavior:"smooth"}); }
});
document.querySelectorAll(".tab").forEach(t=> t.addEventListener("click", ()=> go(t.dataset.mode)));
document.getElementById("brand").addEventListener("click", ()=> go("home"));
document.getElementById("dwclose").addEventListener("click", ()=> document.getElementById("drawer").classList.remove("open"));
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") document.getElementById("drawer").classList.remove("open");
  else if((e.altKey||e.metaKey) && e.key==="ArrowLeft"){ e.preventDefault(); goBack(); }
});
document.getElementById("drawer").addEventListener("click", e=>{
  const el = e.target.closest("[data-open]"); if(!el) return;
  document.getElementById("drawer").classList.remove("open"); openConcept(el.dataset.open);
});
window.addEventListener("resize", ()=>{ if(st.mode==="map") drawMap(); if(st.mode==="timeline") drawTimeline(); });

/* ---------- load ---------- */
function load(){
  RECORDS = __EMBED;
  BYID = {}; RECORDS.forEach(r=> BYID[r.id]=r);
  render();
}
load();
</script>
