  .nodebtn .t { font-weight:800; font-size:15.5px; color:#fff; }
  .nodebtn .y { font-size:11px; color:#64748b; font-variant-numeric:tabular-nums; white-space:nowrap; }

  .dom { font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; letter-spacing:.03em; }
  .dom-jp { background:#4c0519; color:#fecdd3 } .dom-world { background:#312e81; color:#c7d2fe }
  .dom-geo { background:#134e4a; color:#99f6e4 } .dom-theme { background:#78350f; color:#fde68a }
  .dom-cosmos { background:#1a0b2e; color:#e9d5ff }

  .d-head { margin-bottom:18px; }
  .d-meta { display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:#94a3b8; margin-bottom:8px; align-items:center; }

  .panel { border-radius:14px; padding:15px 16px; background:rgba(255,255,255,.04);

  .panel > h3 { margin:0 0 11px; font-size:13.5px; font-weight:800; padding-bottom:8px;

  .p-body h4 { margin:0 0 3px; font-size:13.5px; color:#fff; }
  .p-body .bt { font-size:13px; line-height:1.85; color:#cbd5e1; margin:0; }
  .p-body .src { font-size:11px; color:#64748b; margin-top:3px; }

  .p-body .item:first-child { border-top:none; padding-top:0; }

  .rel { border-left:2px solid var(--rc,#38bdf8); padding-left:11px; margin-bottom:12px; }

  .rel .rl { font-size:11.5px; font-weight:800; color:var(--rc,#38bdf8); margin-bottom:6px; }
  .chip { display:inline-block; cursor:pointer; font-size:12px; padding:5px 10px; border-radius:8px;

          margin:0 6px 6px 0; }
  .chip:hover { background:rgba(56,189,248,.2); }
  .chip.dead { background:rgba(255,255,255,.04); color:#64748b; border-color:rgba(255,255,255,.1); cursor:default; }
  .chip .cn { display:block; font-size:10.5px; color:#7c8ba1; margin-top:2px; }
  .chip.gj { background:rgba(45,212,191,.1); color:#99f6e4; border-color:rgba(45,212,191,.3); }
  .chip.gj:hover { background:rgba(45,212,191,.2); }
  .chip.rj { background:rgba(251,113,133,.1); color:#fecdd3; border-color:rgba(251,113,133,.3); }

  .panel.wh { background:rgba(250,204,21,.06); border-color:rgba(250,204,21,.3); }

  .panel.drama .item .ppl { font-size:11.5px; color:#a78bfa; margin-bottom:6px; }
  .panel.drama .item .bt { white-space:pre-wrap; }
  .panel.drama .item .src { color:#8b7bb0; }
  .dramabranch { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0 6px; }

  .whb { font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; background:#713f12; color:#fde68a; letter-spacing:.02em; }

            background:#0e1729; height:min(64vh,560px); }

  .rgn { stroke:#0b0f1a; stroke-width:.6px; }
  .rgn.empty { fill:#1e293b; }
  .rgn.has { fill:#3b4d6b; cursor:pointer; }
  .rgn.has:hover { fill:#4f6591; }
  .sphere { fill:#0b1220; stroke:#1e293b; stroke-width:.7px; }
  .rlabel { fill:#cbd5e1; font-size:11px; font-weight:700; text-anchor:middle; pointer-events:none;

  .mk { stroke:#0b0f1a; stroke-width:1.2px; cursor:pointer; }

  .mapbtn { font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:10px; cursor:pointer;

  .mapbtn:hover { background:rgba(244,63,94,.24); }

  .dramabtn:hover { background:rgba(167,139,250,.24); }

  #drawer { position:fixed; top:0; right:0; bottom:0; width:390px; max-width:88vw; z-index:40;

  #drawer header h2 { margin:0; font-size:14px; }

  .b-jp { background:#9f1239 } .b-world { background:#4338ca } .b-geo { background:#0f766e } .b-theme { background:#b45309 } .b-cosmos { background:#581c87 }

  .cursor b { position:absolute; top:-18px; left:3px; font-size:10px; color:#fda4af; background:#0b0f1a; padding:0 4px; border-radius:3px; }
  .axis { position:relative; height:18px; margin-top:4px; }
  .axis span { position:absolute; font-size:10px; color:#64748b; transform:translateX(-50%); }
  .tlchips { margin-top:14px; }
  .err { color:#f87171; font-size:12.5px; padding:10px 0; }

<script>
const __EMBED = [{"id": "abbasid-caliphate", "title": "アッバース朝とバグダード", "domain": "世界史", "region": "西アジア・中東", "headline": "バグダードを中心に、民族を超えた『イスラームの帝国』へ成熟した", "startYear": 750, "endYear": 1258, "eraLabel": "8〜13世紀（最盛期は8〜9世紀）", "summary": "750年の革命でウマイヤ朝を倒したアッバース朝は、762年に新都バグダードを築き、『アラブの帝国』から『イスラームの帝国』へ性格を変えた。民族を問わずムスリムなら官僚・軍人・学者に登用され、ペルシアの行政技術と宮廷文化を取り込んでカリフは専制君主となる。8〜9世紀のバグダードは世界最大級の都市で、ギリシア・ペルシア・インドの学術がアラビア語に翻訳され（知恵の館）、数学・天文学・医学・哲学が花開いた。当時のイスラーム世界は唐と並ぶ二大文明圏だった。9世紀後半から地方総督の自立とトルコ系軍人奴隷の台頭でカリフの実権は衰える。", "regionCode": "IQ", "lat": 33.31, "lng": 44.36, "factLevel": "定説", "body": [{"label": "バグダード（円城、762年）", "text": "ティグリス川岸、旧ペルシア領の中心に円形に設計された計画都市。陸路と水路の結節点で、最盛期の人口は数十万〜百万と推定される。", "source": "batch 10 直接生成"}, {"label": "知恵の館（バイト・アルヒクマ）", "text": "ギリシア語・ペルシア語・サンスクリット語の学術書がアラビア語へ組織的に翻訳された。アリストテレスやプトレマイオス、インドの数字（のちの『アラビア数字』）がここを経由して後世へ伝わった。", "source": "batch 10 直接生成"}, {"label": "普遍的枠組みの確立", "text": "宗教法（シャリーア）にもとづく社会、アラビア語による広域の学問共同体、ムスリム商人が地中海〜インド洋〜中央アジアを結ぶ交易網。これがその後1000年以上のイスラーム世界の骨格になった。", "source": "batch 10 直接生成"}, {"label": "早い分権化", "text": "9世紀、イベリアには逃れたウマイヤ家の後ウマイヤ朝、エジプト・北アフリカにも独立王朝が生まれ、カリフの直接支配は縮小。政治的統一より宗教・文化・交易の統一が実体となった。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "arab-caliphate-expansion", "relation": "継承", "note": "750年の革命でウマイヤ朝から交代"}, {"concept": "rise-of-islam", "relation": "継承", "note": "ウンマの理念が広域帝国の統治原理に"}, {"concept": "achaemenid-persia", "relation": "継承", "note": "ペルシア的な専制君主と宮廷儀礼の再来"}, {"concept": "tang-dynasty", "relation": "対比", "note": "同時代のユーラシアを東西で分け合った二大文明圏"}, {"concept": "silk-road-trade", "relation": "関連", "note": "751年タラス河畔の戦いで唐と接触、製紙法が西伝したとされる"}, {"concept": "indian-ocean-maritime-trade", "relation": "関連", "note": "バスラ・シーラーフからムスリム商人がインド洋交易を主導"}, {"concept": "nara-period", "relation": "同時代", "note": "東大寺大仏開眼（752）とほぼ同時期にバグダード建設"}, {"concept": "mongol-empire-formation", "relation": "因果", "note": "1258年フレグの侵攻でバグダードが陥落しカリフが処刑された"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 10 直接生成 / rekishi-10-medieval-world-formation.md", "date": "2026-09-03"}], "tags": "イスラーム,アッバース朝,バグダード,知恵の館,カリフ,製紙法,シャリーア", "lastUpdated": "2026-09-03"}, {"id": "achaemenid-persia", "title": "アケメネス朝ペルシア", "domain": "世界史", "region": "西アジア・中東", "headline": "オリエントを初めて一つに束ねた、前近代最大の多民族帝国", "startYear": -550, "endYear": -330, "eraLabel": "前6〜前4世紀", "summary": "キュロス2世が前550年頃にメディアを倒して建てた帝国で、最盛期にはエジプトからインダスまで当時世界最大の版図を支配した。全土をサトラップ(総督)制で分け、『王の道』と駅伝で結び、被支配民族の宗教や慣習に寛容だった。ダレイオス1世の時代に統治機構と貨幣制度が整う。前330年、アレクサンドロスに敗れ、ダレイオス3世が臣下に殺されて滅んだ。", "regionCode": "IR", "lat": 29.94, "lng": 52.89, "factLevel": "定説", "body": [{"label": "統治の技術", "text": "約20のサトラップに分け、各地に王直属の監察官(『王の目』)を置いた。ペルシア人以外にも門戸を開き、フェニキア人やイオニアのギリシア人を海軍・交易に用いた。", "source": ""}, {"label": "インフラ", "text": "サルデスからスサまで約2,500kmの『王の道』を整え、駅伝で数日の情報伝達を可能にした。この道はのちにアレクサンドロスの進軍路にもなる。", "source": "ヘロドトス『歴史』"}], "relatedTopics": [{"concept": "alexander-eastern-campaign", "relation": "因果", "note": "前330年、この帝国の滅亡で東征が完成した"}, {"concept": "mesopotamia-geography", "relation": "地理的背景", "note": "バビロニアが経済的中枢。王の道が各地を結んだ"}, {"concept": "yayoi-period", "relation": "同時代", "note": "最盛期(前5世紀)は日本では縄文晚期〜弥生移行期"}, {"concept": "assyrian-empire", "relation": "継承", "note": "オリエント統一と州制のモデルを継ぎ、強制移住をやめて寛容策に転じた"}, {"concept": "neo-babylonian-empire", "relation": "因果", "note": "前539年キュロス2世がバビロンを占領し、捕囚民の帰還を許した"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}], "tags": "アケメネス朝, ペルシア, キュロス, ダレイオス, サトラップ", "lastUpdated": "2026-09-03"}, {"id": "acropolis-athens", "title": "アテネのアクロポリス", "domain": "世界史", "region": "ヨーロッパ", "headline": "アクロポリス＝『西洋建築と民主政の原点』として2500年引用され続ける丘", "summary": "アテネ中心部の岩山に立つ神殿群。政治家ペリクレスの指導下、前5世紀にパルテノン神殿などが建てられた。ドーリア式建築の完成形とされ、以後、西洋の公共建築が繰り返し模倣してきた『引用元』。民主政・哲学・演劇というヨーロッパの理念の象徴としても機能する。", "isWorldHeritage": true, "relatedTopics": [{"concept": "giza-pyramids", "relation": "関連", "note": "古代の記念碑的建造物"}, {"concept": "venice-and-its-lagoon", "relation": "関連", "note": "地中海世界の文化的頂点"}, {"concept": "registration-criteria", "relation": "テーマ"}, {"concept": "greek-classical-age", "relation": "因果", "note": "ペリクレス指導下のアテネ黄金期の国家事業として建設"}, {"concept": "greco-persian-wars", "relation": "因果", "note": "ペルシアに焼かれた旧神殿の再建がパルテノン"}, {"concept": "sparta-and-athens", "relation": "関連", "note": "民主政アテネを象徴する丘"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "古代ギリシャ, 神殿, 文化財返還, 世界遺産", "lastUpdated": "2026-09-03", "startYear": -447, "endYear": -406, "eraLabel": "前5世紀（アテネ古典期）", "regionCode": "GR", "lat": 37.971, "lng": 23.726, "body": [{"label": "パルテノン・マーブルの返還問題", "text": "19世紀に英国のエルギン卿が持ち出した彫刻群は大英博物館蔵。ギリシャが返還を求め続けており、文化財返還論の象徴的な争点。", "source": "パイロット"}, {"label": "修復の思想", "text": "20世紀の鉄補強が錆びて石を割ったため、いまはチタン材で組み直す長期修復が続く。『どの時点の姿に戻すか』を問い直す現場でもある。", "source": "パイロット"}], "country": "ギリシャ", "whType": "文化遺産", "inscriptionYear": 1987, "whCriteria": "i, ii, iii, iv, vi", "whStatus": "登録", "ouv": "(i)(ii)(iii)(iv)(vi)。古典古代の芸術的頂点であり、世界中の新古典主義建築に影響を与えた普遍的シンボル。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/1029_Acropolis_of_Athens_in_Greece_at_night_Photo_by_Giles_Laurent.jpg/960px-1029_Acropolis_of_Athens_in_Greece_at_night_Photo_by_Giles_Laurent.jpg", "imageCredit": "Giles Laurent / CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:1029_Acropolis_of_Athens_in_Greece_at_night_Photo_by_Giles_Laurent.jpg"}, {"id": "aegean-bronze-age", "title": "エーゲ文明（ミノア・ミュケナイ）", "domain": "世界史", "region": "ヨーロッパ", "headline": "宮殿を中心に海で栄え、前12世紀に一斉に崩れた青銅器文明", "startYear": -3000, "endYear": -1100, "eraLabel": "前3千年紀〜前12世紀", "summary": "クレタ島のミノア文明（前2000年頃〜）は、クノッソスなど城壁を持たない宮殿を拠点に、海上交易で繁栄した。前1600年頃からギリシア本土のミュケナイ文明が台頭し、城塞王宮と線文字Bによる行政記録を残した（線文字Bは初期のギリシア語）。前1200年頃、「海の民」の移動や気候変動、交易網の断絶が重なって東地中海の諸王国が次々に倒れ、ギリシアは文字を失う「暗黒時代」に入る。", "regionCode": "GR", "lat": 35.3, "lng": 25.16, "factLevel": "有力説", "body": [{"label": "ミノアとミュケナイ", "text": "ミノアは壁画に海洋生物や跳牛の儀礼を描き、防御施設に乏しい「開かれた」交易社会だった。ミュケナイは対照的に堅固な城塞（獅子門）を築く戦士的な社会で、前15世紀頃にクレタを支配下に置いた。", "source": ""}, {"label": "線文字Bの解読", "text": "20世紀半ば、線文字Bがギリシア語と突き止められた。粘土板の内容は神々への供物、家畜、武具、職人の配分など宮殿経済の帳簿で、王（ワナクス）を頂点とする再分配システムがうかがえる。", "source": ""}, {"label": "後期青銅器時代の崩壊", "text": "前1200年前後、ヒッタイト・ミュケナイ・ウガリトなどが半世紀ほどの間に相次いで滅んだ。単一の原因ではなく、干ばつ・地震・「海の民」・交易途絶が連鎖したシステム崩壊とみる説が有力。", "source": ""}], "relatedTopics": [{"concept": "ancient-egypt-old-to-new", "relation": "同時代", "note": "新王国エジプトと交易・外交で結ばれていた"}, {"concept": "birth-of-writing", "relation": "関連", "note": "線文字Bはギリシア語を記した最古の文字"}, {"concept": "hellenistic-world", "relation": "継承", "note": "暗黒時代を経てポリスが生まれ、千年後ギリシア文化が東方へ広がる"}, {"concept": "jomon-period", "relation": "同時代", "note": "ミュケナイ落城の頃、日本は縄文晩期"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "ミノア文明, ミュケナイ文明, 線文字B, 青銅器時代の崩壊", "lastUpdated": "2026-09-03"}, {"id": "africa-plateau-and-coast-geography", "title": "アフリカ大陸の地誌（台地・海岸線・滝）", "domain": "地理", "region": "アフリカ", "headline": "巨大なテーブル――古い台地と単調な海岸線が、内陸を外から遠ざけた", "factLevel": "定説", "summary": "アフリカは面積約3,000万km²、世界の陸地の約2割を占める2番目に大きな大陸。大部分が標高500〜1,000mの古い安定陸塊で、平野が少なく「巨大なテーブル」に例えられる。南部・東部が高く（高アフリカ）、サハラを含む北部・西部が低い（低アフリカ）。湾や良港となる入り江が少ない単調な海岸線と、内陸の高い台地から海へ下るところで川が作る滝（カタラクト）が、大型船の遡行を阻んで内陸を長く「外から分かりにくい大陸」にした。赤道をまたいで熱帯雨林→サバナ→ステップ→砂漠と、気候帯が南北対称に並ぶ。", "body": [{"label": "台地状の大陸", "text": "先カンブリア時代の岩盤からなる安定陸塊が大部分を占め、標高500〜1,000mの高原が広がる。褶曲山脈はアトラス（北西）とケープ（南）に限られ、大山脈が少ない。", "source": "batch 12 直接生成"}, {"label": "単調な海岸線", "text": "大きな湾・半島・入り江が乏しく、海岸線の総延長は面積のわりに短い。天然の良港が少なく、船で内陸へ入りにくかったことが、近代までの外部との関係を規定した。", "source": "batch 12 直接生成"}, {"label": "滝で分断される川", "text": "コンゴ川・ザンベジ川・ナイル川いずれも河口近くで急な段差（早瀬・滝）を作り、大型船で内陸へ遡れない。この落差は現代では巨大な水力発電ポテンシャルでもある。", "source": "batch 12 直接生成"}, {"label": "左右対称の気候帯と資源の偏在", "text": "赤道の熱帯雨林を中心に、南北へサバナ→ステップ→砂漠→地中海性気候が対称に並び、大陸の約6割が乾燥・半乾燥。金・ダイヤ・銅・コバルト・プラチナ等が南部やカッパーベルトに、石油がギニア湾岸・リビア・アルジェリアに偏在する。", "source": "batch 12 直接生成"}], "relatedTopics": [{"concept": "sahara-desert-and-maghreb-geography", "relation": "関連", "note": "低アフリカの北半分を覆う最大の乾燥帯"}, {"concept": "east-african-rift-geography", "relation": "関連", "note": "高アフリカの背骨を作る、大陸を裂きつつある谷"}, {"concept": "congo-basin-rainforest-geography", "relation": "関連", "note": "台地に囲まれた赤道直下の皿状低地"}, {"concept": "ancient-egypt-old-to-new", "relation": "地理的背景", "note": "乾燥帯のなか、水のある帯（ナイル谷）に人口と国家が集中した典型"}, {"concept": "indian-ocean-maritime-trade", "relation": "関連", "note": "東海岸は単調ながらモンスーン交易の西端として例外的に外へ開いた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 12 直接生成 / rekishi-12-africa-geography.md", "date": "2026-09-03"}], "tags": "地理,アフリカ,地形,気候,資源", "lastUpdated": "2026-09-03"}, {"id": "age-of-exploration", "title": "大航海時代", "domain": "横断テーマ", "region": "グローバル", "headline": "イベリア2国が大西洋とアフリカ南端回りの航路を開き、世界を一つの交易・銀・病の網にした", "startYear": 1415, "endYear": 1600, "eraLabel": "15〜16世紀", "summary": "15世紀、ポルトガルはアフリカ西岸を南下し、1488年ディアスがアフリカ最南端に達し、1498年ヴァスコ・ダ・ガマがインドに達した。スペインは1492年にコロンブスを西回りに送り出し、カリブ海に到達。その動機は『金・神・栄光』——香辛料と貴金属、キリスト教布教、国家の威信である。結果として新大陸の銀がヨーロッパさらに中国へ流れ込み（物価革命）、アメリカ先住民は旧大陸の感染症で人口が激減、大西洋奴隷貿易とプランテーションの原型ができた。ジャガイモ・トウモロコシと、馬・小麦・砂糖の双方向の移動（コロンブス交換）が世界の食と生態系を変えた。", "factLevel": "定説", "body": [{"label": "なぜイベリアか", "text": "地中海交易の末端に位置し、オスマンとヴェネツィアに香辛料貿易を握られていた。レコンキスタ（国土回復運動）で養われた軍事エネルギーと、地中海式・大西洋式の造船・航海術の融合（カラヴェル帆船）があった。", "source": "batch 14 直接生成"}, {"label": "地球を分割する条約", "text": "1494年のトルデシリャス条約でポルトガルとスペインが地球を東西に分割し、1529年のサラゴサ条約でアジア側の境界も定めた。ヨーロッパの2国が世界を線引きする発想自体が新しかった。", "source": "batch 14 直接生成"}, {"label": "コロンブス交換と銀の世界循環", "text": "ポトシ銀・石見銀がマニラ・マカオを経て中国へ流を入り、明の税の銀納化を支えた。ジャガイモ・トウモロコシは旧大陸の人口を支え、天然痘などはアメリカを壊滅させた。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "indian-ocean-maritime-trade", "relation": "因果", "note": "香辛料をムスリム商人を介さず得る海路を求めた"}, {"concept": "ottoman-empire", "relation": "因果", "note": "オスマンが地中海東部・紅海の交易路を握ったことがアフリカ回り航路探索の一因"}, {"concept": "ming-dynasty-and-zheng-he", "relation": "対比", "note": "中国が海から退いたのと入れ替わりにヨーロッパが海へ出た"}, {"concept": "renaissance", "relation": "同時代", "note": "コペルニクスの地動説と同じ知的拡張の時代"}, {"concept": "nanban-trade-and-christianity", "relation": "因果", "note": "ポルトガルのアジア進出の東端が種子島・長崎"}, {"concept": "aztec-empire", "relation": "同時代", "note": "コルテスの征服（1521）は大航海時代のスペインの海外進出の一部"}, {"concept": "inca-empire", "relation": "同時代", "note": "ピサロの征服（1533）も同じ拡張の一環"}, {"concept": "pre-columbian-isolation", "relation": "因果", "note": "接触後の感染症により先住民人口が大きく減少した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "大航海時代,コロンブス,ガマ,マゼラン,トルデシリャス条約,コロンブス交換,銀", "lastUpdated": "2026-09-04"}, {"id": "alexander-eastern-campaign", "title": "アレクサンドロスの東征", "domain": "世界史", "region": "西アジア・中東", "headline": "ギリシアとオリエントを一つの世界につないだ10年の遠征", "startYear": -334, "endYear": -323, "eraLabel": "前4世紀後半", "summary": "マケドニア王アレクサンドロス3世が前334年にヘレスポントを渡り、わずか10年でアケメネス朝ペルシアを征服してインダス川流域まで到達した遠征。グラニコス・イッソス・ガウガメラの三会戦でペルシア軍を破り、前330年にダレイオス3世の死で帝国を手中にした。前326年にインドのヒュダスペス河畔でポロス王を破るが、ヒュファシス川で将兵が進軍を拒み引き返す。前323年にバビロンで急死し、帝国は将軍たちに分割された。", "regionCode": "IR", "lat": 32.54, "lng": 44.42, "factLevel": "定説", "body": [{"label": "三つの決戦", "text": "グラニコス河畔の戦い(前334)で緒戦を制し、イッソスの戦い(前333)でダレイオス3世の本隊を撃破、ガウガメラの戦い(前331)でペルシア帝国の命運を決した。いずれも数で劣るマケドニア軍が、重装歩兵ファランクスと騎兵の連携で勝っている。", "source": "アリアノス『アレクサンドロス東征記』"}, {"label": "融合政策", "text": "征服地の行政機構(サトラップ制)をおおむね温存し、ペルシア人を登用し、部下にペルシア貴族との集団結婚を行わせた。共通ギリシア語(コイネー)と各地に築いた『アレクサンドリア』がのちのヘレニズム文化の骨格になる。", "source": ""}, {"label": "到達限界", "text": "前326年、インド・ヒュファシス川(現ベアス川)で、さらに東を目指すアレクサンドロスに将兵が反乱同然に従わなかった。ここが東征の東端となった。", "source": ""}], "relatedTopics": [{"concept": "achaemenid-persia", "relation": "因果", "note": "征服対象。ダレイオス3世の帝国をそのまま受け継いだ"}, {"concept": "hellenistic-world", "relation": "継承", "note": "東征の遺産。帝国は分裂したが混成文化が残った"}, {"concept": "yayoi-period", "relation": "同時代", "note": "前4世紀後半、日本列島は弥生時代の只中"}, {"concept": "mesopotamia-geography", "relation": "地理的背景", "note": "バビロンを新首都に構想。ガウガメラの戦場もこの平野"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}], "tags": "アレクサンドロス, マケドニア, ヘレニズム, ペルシア", "lastUpdated": "2026-09-03"}, {"id": "alps-and-european-rivers", "title": "アルプスとヨーロッパの大河", "domain": "地理", "region": "ヨーロッパ", "headline": "大陸中央の高い壁から、大河が四方の海へ放射状に流れ出す", "eraLabel": "地理単元", "summary": "アルプス山脈はヨーロッパ中央を東西に走る新期造山帯の高峰群で、大陸の主要な分水嶺をなす。ここを源に、ライン川は北海へ、ドナウ川は黒海へ、ローヌ川は地中海へ、ポー川はアドリア海へと放射状に流れる。これらの川と、それらを結ぶ低い峠（ブレンナー峠など）が、南北・東西の交通路になった。氷河が削った谷と湖、周氷河の堆積が、農地・都市・国境線の位置を強く方向づけている。", "regionCode": "CH", "lat": 46.5, "lng": 9.5, "factLevel": "定説", "body": [{"label": "分水嶺と峠", "text": "アルプスは障壁であると同時に、少数の峠に交通を集中させる『関所』でもあった。峠を押さえる勢力が交易を支配した。", "source": ""}, {"label": "川が国境になる", "text": "ライン・ドナウは古代ローマの北の国境線となり、その後も言語圏・国家の境として繰り返し意識された。", "source": ""}, {"label": "水運の網", "text": "緩流の大河と運河で内陸まで船が入り、河港（ケルン、ウィーン、リヨン）が経済の中心に育った。", "source": ""}], "relatedTopics": [{"concept": "roman-republic", "relation": "地理的背景", "note": "ライン・ドナウがローマ帝国の防衛線になった"}, {"concept": "mediterranean-world-geography", "relation": "関連", "note": "アルプス以南は地中海世界に開ける"}, {"concept": "north-european-plain", "relation": "対比", "note": "山と川が刻むアルプス以北の高地と、障壁のない大平原"}, {"concept": "china-landforms-great-rivers", "relation": "対比", "note": "西から東へ一方向に流れる中国の大河と、四方へ放射するヨーロッパの川"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ06)", "ref": "data/wiki/sources/rekishi-06-europe-geography.md", "date": "2026-09-03"}], "tags": "アルプス, ライン川, ドナウ川, ローヌ川, ポー川, 分水嶺, 峠", "lastUpdated": "2026-09-03"}, {"id": "amazon-basin-geography", "title": "アマゾン盆地と熱帯雨林", "domain": "地理", "region": "南北アメリカ", "headline": "世界最大の川と熱帯雨林、養分は土壌でなく森そのものに蓄えられる", "summary": "アマゾン川は流域面積・流量ともに世界最大で、アンデスの雪解け水と赤道直下の多雨を集めて大西洋に注ぐ。流域の大半は世界最大の熱帯雨林に覆われ「地球の肺」と呼ばれる一方、養分の多くは樹木自身に蓄えられ、土壌はやせている。かつては手つかずの原生林と考えられていたが、近年の研究では、先住民が長期にわたり森を管理し、肥沃な人工の黒い土をつくり、まとまった規模の定住集落を営んでいたことが分かってきている。ただし高温多湿と土壌の制約から、アンデスのような集権的な大国家は生まれなかった。", "regionCode": "BR", "lat": -3.4, "lng": -62.2, "factLevel": "定説", "body": [{"label": "なぜ土壌がやせているのか", "text": "熱帯雨林は栄養分の大半を落ち葉や倒木などの有機物として地表近くに保持しており、土そのものには蓄積されにくい。木を切って農地にすると数年で地力が尽きる理由がここにある。", "source": "batch 15 直接生成"}, {"label": "「手つかずの自然」像の見直し", "text": "人工的に肥沃化された黒い土（テラ・プレタ）の発見などから、先住民が数千年にわたり森を管理・改変してきたことが分かってきた。単なる原野ではなく、人の手が入った景観だったという見方が広がっている。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "andes-mountains-geography", "relation": "地理的背景", "note": "アンデスの雪解け水と急峻な地形が盆地へ大量の水を送り込む"}, {"concept": "congo-basin-rainforest-geography", "relation": "対比", "note": "世界最大と第2位の熱帯雨林どうし。ともに養分が地表付近に集中する"}, {"concept": "neolithic-revolution", "relation": "対比", "note": "旧大陸の農耕開始地帯とは異なり、森の管理という独自の人と自然の関わり方をたどった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "アマゾン,熱帯雨林,テラ・プレタ,生態系", "lastUpdated": "2026-09-04"}, {"id": "american-independence", "title": "アメリカ独立革命", "domain": "世界史", "region": "南北アメリカ", "headline": "「代表なくして課税なし」から生まれた最初の近代共和国", "startYear": 1775, "endYear": 1783, "eraLabel": "18世紀後半", "summary": "七年戦争後の財政難を埋めるためイギリス本国が北米13植民地への課税を強化したことに反発し、1775年に武力衝突(独立戦争)が始まった。1776年の独立宣言は基本的人権と人民主権を掲げ、フランスなど列強の支援も得て1783年のパリ条約でイギリスがアメリカ合衆国の独立を承認した。1787年制定の合衆国憲法は三権分立と連邦制を制度化し、王のいない近代共和国のモデルとして各地の革命運動に影響を与えた。", "regionCode": "US", "lat": 39.9526, "lng": -75.1652, "factLevel": "定説", "body": [{"label": "課税をめぐる対立", "text": "印紙法・茶税法など本国の課税強化に「代表なくして課税なし」のスローガンで反発し、ボストン茶会事件(1773)を経て軍事衝突に発展した。", "source": "MulmoClaude"}, {"label": "独立宣言と戦争", "text": "1776年7月4日の独立宣言はロックの自然権思想に基づき人民の革命権を主張。フランス・スペインの参戦もあり、1781年のヨークタウンの戦いで事実上勝敗が決した。", "source": "MulmoClaude"}, {"label": "合衆国憲法という実験", "text": "1787年制定の合衆国憲法は三権分立・連邦制・権力の抑制と均衡を制度化し、王を戴かない近代共和国の統治モデルを世界に示した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "english-revolution-to-glorious-revolution", "relation": "継承", "note": "権利章典の議会主権・課税同意の理念が植民地にも及んでいた"}, {"concept": "french-revolution", "relation": "因果", "note": "アメリカ独立を支援したフランスの財政悪化が革命の一因になった"}, {"concept": "latin-american-independence", "relation": "継承", "note": "近代共和国の先例としてラテンアメリカ独立運動に影響を与えた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近代,アメリカ,独立革命,南北アメリカ", "lastUpdated": "2026-09-04"}, {"id": "anatolia-geography", "title": "アナトリア（小アジア）の地誌", "domain": "地理", "region": "西アジア・中東", "headline": "三方を海に囲まれた高原の半島。アジアとヨーロッパを結ぶ陸橋", "eraLabel": "地理単元", "summary": "アナトリアは黒海・エーゲ海・地中海に囲まれた半島で、内陸は乾いた中央高原、周縁を北アナトリア山脈やタウロス山脈が縁取る。海に面した西岸・北岸は雨が多く森林と良港に恵まれ、内陸との落差が大きい。銅・鉄・銀・黒曜石など鉱物資源が豊かで、早くから冶金が発達した（ヒッタイトの鉄）。ボスポラス・ダーダネルス両海峡でヨーロッパと接し、東西交通の要衝であり続けた。", "regionCode": "TR", "lat": 39, "lng": 33, "factLevel": "定説", "body": [{"label": "金属の産地", "text": "タウロス山脈の鉱床は青銅器・鉄器時代の資源基盤。黒曜石は新石器時代から遠隔地に運ばれた。", "source": ""}, {"label": "陸橋と海峡", "text": "東西を結ぶ隊商路（のちの『王の道』）が横断し、海峡は黒海と地中海を結ぶ唯一の水路。支配者は常に東西両方向からの圧力を受けた。", "source": ""}, {"label": "高原と沿岸の二重構造", "text": "湿潤な沿岸にギリシア系の港市、乾いた高原に牧畜と灌漑村という住み分けが古代から続いた。", "source": ""}], "relatedTopics": [{"concept": "greek-polis-formation", "relation": "地理的背景", "note": "エーゲ海沿岸（イオニア）にギリシア人の植民市が並んだ"}, {"concept": "iranian-plateau-geography", "relation": "関連", "note": "『王の道』で結ばれた西アジアのもう一つの高原"}, {"concept": "achaemenid-persia", "relation": "地理的背景", "note": "サルデスを西端に『王の道』が高原を横断した"}, {"concept": "aegean-bronze-age", "relation": "地理的背景", "note": "西岸はエーゲ文明圏と接し、ヒッタイトが内陸を支配した"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ04)", "ref": "data/wiki/sources/rekishi-04-west-asia-geography.md", "date": "2026-09-03"}], "tags": "アナトリア, 小アジア, タウロス, 黒曜石, ボスポラス, ヒッタイト", "lastUpdated": "2026-09-03"}, {"id": "ancient-egypt-old-to-new", "title": "古代エジプト文明（古王国〜新王国初期）", "domain": "世界史", "region": "アフリカ", "headline": "ナイルの氾濫が刻む暦とともに、3千年続く王権が築かれた", "startYear": -3100, "endYear": -1550, "eraLabel": "初期王朝〜新王国のはじまり", "summary": "前3100年頃、上エジプトと下エジプトが統一され、ファラオを頂点とする中央集権国家が成立した。古王国期（前27〜前22世紀）にはギザの大ピラミッドが築かれ、王は太陽神ラーの子とされた。第1中間期の分裂を経て中王国期に再統一、その後アジア系のヒクソスが下エジプトを支配する。前16世紀、ヒクソスを追放して新王国が始まり、エジプトは軍事的な拡大に転じた。", "regionCode": "EG", "lat": 29.98, "lng": 31.13, "factLevel": "定説", "body": [{"label": "ナイルという条件", "text": "毎年夏の増水が上流の肥沃な土を運び、水が引いた田に種をまくだけで麦が実った。氾濫の周期が暦（1年365日）と測量技術を発達させ、東西を砂漠、北を海、南を急流に守られて外敵が入りにくかった。この閉じた地形が長期の安定をもたらした。", "source": ""}, {"label": "ピラミッドと王権", "text": "古王国のピラミッドは、王が死後に神々の世界へ還るための装置であり、全国から動員した労働力を組織する国家事業でもあった。中王国以降は規模が縮小し、王の神格も相対化されていく。", "source": ""}, {"label": "ヒクソスの衝撃", "text": "第2中間期、馬と戦車・複合弓を持つヒクソスが東方から侵入して下エジプトを支配した。この技術をエジプト側が取り込んだことが、新王国の軍事帝国化につながった。", "source": ""}], "relatedTopics": [{"concept": "mesopotamia-early-civilization", "relation": "対比", "note": "開けた地形で興亡の激しいメソポタミアと対照的"}, {"concept": "birth-of-writing", "relation": "関連", "note": "ヒエログリフも記録と権威表示のために発達"}, {"concept": "neolithic-revolution", "relation": "因果", "note": "西アジア由来の麦作がナイル谷に定着して国家の基盤に"}, {"concept": "jomon-period", "relation": "同時代", "note": "ギザにピラミッドが築かれた前26世紀、日本は縄文中期"}, {"concept": "giza-pyramids", "relation": "具体例", "note": "古王国の王権を今に伝える墓地遗跡群"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "エジプト, ファラオ, ピラミッド, ナイル, ヒクソス", "lastUpdated": "2026-09-03"}, {"id": "andes-mountains-geography", "title": "アンデス山脈と垂直の生態系", "domain": "地理", "region": "南北アメリカ", "headline": "南米西岸を貫く新期造山帯、標高差が生態系と暮らしを垂直に積み重ねた", "summary": "アンデスは南米西岸を約7000km連なる世界最長の山脈で、ナスカプレートが南米プレートに沈み込むことで隆起し、火山と地震が多い。低地の砂漠、渓谷のトウモロコシ地帯、標高3000〜4000mのジャガイモとキヌアの畑、4000m超のリャマ・アルパカの放牧地と、標高ごとに異なる環境が積み重なる。アンデスの社会は、異なる高度の土地を同時に確保して多様な資源を得る「垂直統御」を発達させ、階段状の耕地や、冷涼な高地でジャガイモを乾燥保存する技術を育んだ。フンボルト海流がもたらす豊かな漁業も、この地理への適応の一つである。", "regionCode": "PE", "lat": -13.5, "lng": -72, "factLevel": "定説", "body": [{"label": "垂直統御という戦略", "text": "低地・中腹・高地でとれる作物や資源が違うため、一つの共同体が複数の標高帯に耕地や放牧地を持ち、季節ごとに移動して補い合う仕組みが発達した。孤立した平地の農業とは異なる、山岳ならではの適応である。", "source": "batch 15 直接生成"}, {"label": "地震と火山の多い理由", "text": "太平洋のナスカプレートが南米プレートの下に沈み込む境界に沿って山脈が隆起し続けており、地震と火山活動が非常に多い。この地質活動が急峻な地形と鉱物資源の両方を生んだ。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "inca-empire", "relation": "因果", "note": "垂直統御という適応戦略を育んだ舞台となった"}, {"concept": "amazon-basin-geography", "relation": "地理的背景", "note": "東側の低地アマゾンとの標高差が対照的な生態系を生む"}, {"concept": "himalaya-and-indian-subcontinent", "relation": "対比", "note": "大きな標高差が社会を規定する点は似るが、こちらはプレート沈み込み型の隆起"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "アンデス,垂直統御,ナスカプレート,リャマ,アルパカ", "lastUpdated": "2026-09-04"}, {"id": "angkor", "title": "アンコール", "domain": "世界史", "region": "南・東南アジア", "headline": "アンコール＝登録と同時に危機遺産へ入れ、国際チームで守った『保全の実験場』", "summary": "クメール王朝の歴代首都に築かれた寺院・貯水池（バライ）・都市の遺跡群。アンコール・ワット、アンコール・トムなど数百の遺構が約400km²に広がる。1992年、内戦直後に世界遺産へ登録されると同時に危機遺産リストに載せられ、20か国以上が参加する国際協力で盗掘・地雷・崩落から守られた。2004年に危機遺産を脱している。", "isWorldHeritage": true, "relatedTopics": [{"concept": "machu-picchu", "relation": "類似", "note": "密林に眠り近代に本格調査された大遺跡"}, {"concept": "danger-list", "relation": "因果", "note": "危機遺産を支援のトリガーとして活用した先例"}, {"concept": "registration-criteria", "relation": "テーマ"}, {"concept": "mainland-and-maritime-southeast-asia", "relation": "地理的背景", "note": "大陸部の大河・平原に築かれた巨大な水利都市"}, {"concept": "indian-ocean-maritime-trade", "relation": "関連", "note": "海路で伝わったヒンドゥー・仏教文化の東端の到達点"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "クメール, 寺院都市, 危機遺産, 国際協力, 世界遺産", "lastUpdated": "2026-09-03", "startYear": 802, "endYear": 1431, "eraLabel": "9〜15世紀（クメール王朝）", "regionCode": "KH", "lat": 13.412, "lng": 103.867, "body": [{"label": "危機遺産の『使い方』を変えた例", "text": "『罰』ではなく『国際支援を呼び込むスイッチ』として危機遺産リストを使った先例。日本（上智大学・JASA）も主要な支援主体のひとつ。", "source": "パイロット"}, {"label": "水利都市だった", "text": "近年のレーザー測量（LiDAR）で、寺院の周囲に広大な都市網と灌漑システムが眠っていたことが分かった。", "source": "パイロット"}], "country": "カンボジア", "whType": "文化遺産", "inscriptionYear": 1992, "whCriteria": "i, ii, iii, iv", "whStatus": "登録", "ouv": "(i)〜(iv)。ヒンドゥー・仏教の世界観を都市と建築で表現したクメール美術の集大成。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Angkor_Wat.jpg/960px-Angkor_Wat.jpg", "imageCredit": "Bjørn Christian Tørrissen / CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Angkor_Wat.jpg"}, {"id": "arab-caliphate-expansion", "title": "アラブの大征服（正統カリフ・ウマイヤ朝）", "domain": "世界史", "region": "西アジア・中東", "headline": "一世代でササン朝を滅ぼし、地中海世界を南北に割った大征服", "startYear": 632, "endYear": 750, "eraLabel": "7〜8世紀", "summary": "ムハンマドの死後、後継者カリフのもとでアラブ軍は爆発的に拡大した。正統カリフ時代（632〜661）にササン朝ペルシアを651年に滅ぼし、ビザンツからシリア・エジプトを奪う。661年からはウマイヤ朝がダマスクスを都にカリフ位を世襲し、西は711年にイベリア半島を制圧、東は中央アジア・インダス川に達した。732年、フランク軍にトゥール・ポワティエ間の戦いで西進を止められる。直前まで戦い疲れたササン朝・ビザンツの弱体と、改宗を強制せず人頭税で信仰を認める寛容な統治が、急拡大を可能にした。ウマイヤ朝はアラブ人を特権化して非アラブ改宗者を差別し、その不満が750年の革命を招いた。", "regionCode": "SY", "lat": 33.51, "lng": 36.29, "factLevel": "定説", "body": [{"label": "カリフ（後継者・代理人）", "text": "ムハンマドには預言者の資格は継げないため、共同体の指導者として『カリフ』が立てられた。最初の4代を正統カリフ、以後は王朝による世襲となる。継承をめぐる対立がのちのスンナ派・シーア派の分裂の源流。", "source": "batch 10 直接生成"}, {"label": "なぜ広がったか", "text": "ササン朝もビザンツも直前まで20年以上戦い合って疲弊。征服地の住民には改宗を強制せず、人頭税（ジズヤ）を払えば『啓典の民』として信仰を保護した。重税と宗教対立に苦しむシリア・エジプトのキリスト教徒にはアラブ支配がむしろ軽く感じられた面もある。", "source": "batch 10 直接生成"}, {"label": "地中海の分断", "text": "南岸（北アフリカ）と東岸（シリア）がイスラーム圏になり、『ローマの内海』だった地中海は北のキリスト教世界と南のイスラーム世界に割れた。西ヨーロッパは地中海交易から切り離されていく。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "rise-of-islam", "relation": "因果", "note": "信仰共同体の理念が征服の原動力"}, {"concept": "parthia-and-sasanian", "relation": "因果", "note": "651年、ササン朝ペルシアを滅ぼす"}, {"concept": "byzantine-medieval-transformation", "relation": "因果", "note": "シリア・エジプト・北アフリカの喪失がビザンツを中世国家へ変えた"}, {"concept": "abbasid-caliphate", "relation": "継承", "note": "750年の革命でアッバース朝へ"}, {"concept": "frankish-kingdom-carolingian", "relation": "対比", "note": "732年トゥール・ポワティエ間の戦いで西進を阻止される"}, {"concept": "achaemenid-persia", "relation": "対比", "note": "オリエントを再び一つに束ねた征服帝国"}, {"concept": "taika-reforms-ritsuryo", "relation": "同時代", "note": "アラブがシリア・エジプトを制圧していた頃、日本では大化改新"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 10 直接生成 / rekishi-10-medieval-world-formation.md", "date": "2026-09-03"}], "tags": "イスラーム,カリフ,ウマイヤ朝,ジハード,ジズヤ,ダマスクス,地中海", "lastUpdated": "2026-09-03"}, {"id": "arabian-peninsula-geography", "title": "アラビア半島の地誌", "domain": "地理", "region": "西アジア・中東", "headline": "大半が砂漠。だが南端の高地には季節風が雨を降らせる", "eraLabel": "地理単元", "summary": "アラビア半島は世界最大級の砂漠（ルブアルハリ＝空虚の四分の一）を中心とする乾燥地だが、南西端のイエメン高地はインド洋の季節風（モンスーン）を受けて雨が降り、古くから灌漑農業（マーリブのダム）が成り立った。半島は乳香・没薬の産地で、これらを地中海世界へ運ぶ『香料の道』が西縁を南北に貫いた。内陸ではラクダを使う遊牧民が隊商の護衛と輸送を担った。東岸のペルシア湾岸は真珠と中継貿易で栄えた。", "regionCode": "SA", "lat": 23, "lng": 45, "factLevel": "定説", "body": [{"label": "幸福のアラビア", "text": "雨のあるイエメンはギリシア・ローマ人に『アラビア・フェリクス（幸福のアラビア）』と呼ばれ、サバア王国などが乳香交易で富んだ。", "source": ""}, {"label": "香料の道", "text": "紅海に沿う隊商路がイエメンからペトラ・ガザへ北上し、レヴァントで地中海交易網につながった。", "source": ""}, {"label": "ラクダと遊牧", "text": "前2千年紀のヒトコブラクダの家畜化が、水のない砂漠の縦断を可能にした。", "source": ""}], "relatedTopics": [{"concept": "levant-geography", "relation": "関連", "note": "香料の道の北の出口がレヴァント"}, {"concept": "monsoon-asia-rice-frontier", "relation": "対比", "note": "同じ季節風でも、雨が届くのは半島南端のわずかな高地だけ"}, {"concept": "mesopotamia-geography", "relation": "関連", "note": "半島北縁の砂漠が沖積平野の西の縁を画する"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ04)", "ref": "data/wiki/sources/rekishi-04-west-asia-geography.md", "date": "2026-09-03"}], "tags": "アラビア半島, ルブアルハリ, 乳香, 香料の道, イエメン, ラクダ", "lastUpdated": "2026-09-03"}, {"id": "assyrian-empire", "title": "アッシリア帝国", "domain": "世界史", "region": "西アジア・中東", "headline": "鉄と騎馬と強制移住で、オリエントを史上初めて一つに束ねた", "startYear": -911, "endYear": -609, "eraLabel": "前9〜前7世紀", "summary": "北メソポタミアのアッシリアは、鉄製武器・戦車・攻城兵器・騎兵を組織的に用い、前8〜7世紀にメソポタミア・シリア・エジプトを史上初めて一つの帝国に統一した。征服地に総督を置き、反抗的な民は各地へ強制移住させて抵抗力を削いだ。首都ニネヴェには粘土板を集めた大図書館が築かれた。だが過酷な支配は各地の反乱を招き、前612年に新バビロニアとメディアの連合軍がニネヴェを陥落させ、帝国は崩壊した。", "regionCode": "IQ", "lat": 36.36, "lng": 43.15, "factLevel": "定説", "body": [{"label": "力による統治", "text": "鉄器の普及で軍隊を安価に大規模化でき、常備軍と工兵で城壁都市を次々に落とした。被征服民の強制移住は、故地との結びつきを断って反乱の芽を摘む狙いだった。", "source": ""}, {"label": "知の集積", "text": "アッシュルバニパル王がニネヴェに集めた文書庫からは『ギルガメシュ叙事詩』などが出土し、メソポタミア数千年の学術が現代に伝わるもとになった。", "source": ""}], "relatedTopics": [{"concept": "neo-babylonian-empire", "relation": "因果", "note": "前612年、新バビロニア・メディア連合がこの帝国を倒した"}, {"concept": "achaemenid-persia", "relation": "継承", "note": "多民族帝国の統治術を継ぎ、寛容策へ転換した"}, {"concept": "mesopotamia-early-civilization", "relation": "継承", "note": "シュメール以来の楔形文字文化を受け継いだ"}, {"concept": "mesopotamia-geography", "relation": "地理的背景", "note": "防御線のない開けた平野が広域支配と反乱を同時に生んだ"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ03)", "ref": "data/wiki/sources/rekishi-03-orient-and-polis.md", "date": "2026-09-03"}], "tags": "アッシリア, ニネヴェ, 鉄器, 強制移住, アッシュルバニパル", "lastUpdated": "2026-09-03"}, {"id": "atlantic-slave-trade", "title": "大西洋奴隷貿易", "domain": "横断テーマ", "region": "グローバル", "headline": "アフリカ・アメリカ・欧州を結ぶ三角貿易、対価は人身売買", "startYear": 1500, "endYear": 1867, "eraLabel": "16〜19世紀（最盛期は17〜18世紀）", "summary": "ヨーロッパの商人はアフリカ西岸で武器・雑貨と引き換えに奴隷を購入し、大西洋を渡ってカリブ海・南北アメリカのプランテーションへ売り渡し、そこで生産された砂糖・タバコ・綿花をヨーロッパへ持ち帰るという「大西洋三角貿易」を17〜18世紀に本格化させた。中間航路(ミドル・パッセージ)では劣悪な環境で多数が死亡し、400年間で1000万人以上のアフリカ人が奴隷として輸送されたと推計される。この貿易はヨーロッパの商業資本蓄積の一因となる一方、西アフリカ社会そのものを深く傷つけた。", "factLevel": "定説", "body": [{"label": "三角貿易の仕組み", "text": "ヨーロッパ→アフリカ(武器・雑貨)→アメリカ(奴隷)→ヨーロッパ(砂糖・タバコ・綿花)という三辺の航路が一巡する貿易構造で、各辺で商人が利益を得た。", "source": "MulmoClaude"}, {"label": "ミドル・パッセージの実態", "text": "アフリカからアメリカへ奴隷を運ぶ航海は数週間から数ヶ月に及び、船内は過密・不衛生で、航海中の死亡率は平均でも1〜2割に達したとされる。", "source": "MulmoClaude"}, {"label": "プランテーション経済との結びつき", "text": "カリブ海や南北アメリカの砂糖・タバコ・綿花プランテーションは大量の労働力を必要とし、その供給源として奴隷貿易が制度的に組み込まれていった。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "age-of-exploration", "relation": "因果", "note": "大航海時代に開かれた航路と植民地が奴隷貿易の舞台になった"}, {"concept": "trans-saharan-trade-states", "relation": "対比", "note": "陸のサハラ交易から海のプランテーション労働力貿易へ需要の性格が変わった"}, {"concept": "french-absolutism-louis-xiv", "relation": "関連", "note": "王権が特許会社を通じて奴隷貿易・植民地貿易を保護した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,グローバル,奴隷貿易,大西洋", "lastUpdated": "2026-09-04"}, {"id": "aztec-empire", "title": "アステカ帝国", "domain": "世界史", "region": "南北アメリカ", "headline": "湖上の人工島に築かれた都、貢納と捕虜供出で周辺を従えた帝国", "startYear": 1345, "endYear": 1521, "eraLabel": "14〜16世紀", "summary": "14世紀、メシカ（アステカ）人はメキシコ盆地の湖の島に首都テノチティトランを建設した。湖に杭と泥で耕地を造成する集約農業で人口を養い、15世紀に周辺の二都市と三国同盟を結んで征服を進め、貢納制の帝国を築いた。征服した地域には貢納と、神殿の儀式に用いる捕虜の供出を課した。首都は運河が走る計画都市で、人口は当時のヨーロッパの大都市を上回る規模だったとされる。1519年、エルナン・コルテスが少人数のスペイン人と、アステカの支配に反発する周辺勢力の大軍を率いて侵入。皇帝を捕らえたのち、天然痘の流行で守備側が大きな打撃を受け、1521年にテノチティトランは陥落した。", "regionCode": "MX", "lat": 19.43, "lng": -99.13, "factLevel": "定説", "body": [{"label": "湖上都市という発想", "text": "湖に杭を打ち、泥と水草を積み上げてつくる浮島式の耕地（チナンパ）で高い収穫を得て、限られた土地に大人口を養った。首都は運河が縦横に走る計画都市として整備された。", "source": "batch 15 直接生成"}, {"label": "征服の連鎖と天然痘", "text": "コルテスは、アステカの支配に不満を持つ周辺の人々を味方につけて進軍した。征服の決め手になったのは戦闘そのものより、旧大陸から持ち込まれた天然痘の流行で、免疫のない住民に壊滅的な被害を与えたことだった。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "mesoamerica-geography", "relation": "地理的背景", "note": "メキシコ高原の湖にテノチティトランが築かれた"}, {"concept": "maya-civilization", "relation": "関連", "note": "同じメソアメリカの都市文明の伝統を受け継ぐ"}, {"concept": "age-of-exploration", "relation": "同時代", "note": "コルテスの征服は大航海時代のスペインの拡張の一部"}, {"concept": "sengoku-and-unification", "relation": "同時代", "note": "テノチティトラン陥落（1521）は日本の戦国時代の只中にあたる"}, {"concept": "pre-columbian-isolation", "relation": "テーマ", "note": "旧大陸と隔絶した条件で独自に発展した帝国の一つ"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "アステカ,テノチティトラン,コルテス,チナンパ,天然痘", "lastUpdated": "2026-09-04"}, {"id": "bakumatsu-prelude-and-foreign-pressure", "title": "開国前夜 ― 異国船の接近と幕府の対応", "domain": "日本史", "region": "日本", "headline": "ロシア・アメリカの船が相次いで現れ、鎖国体制が揺らぎ始めた", "startYear": 1792, "endYear": 1853, "eraLabel": "江戸時代後期〜幕末前夜", "summary": "1792年のロシア使節ラクスマンの根室来航を皮切りに、19世紀に入るとロシア・イギリス・アメリカの船が相次いで日本近海に現れ、通商や薪水の補給を求めるようになった。幕府は1825年に異国船打払令を出して強硬に対応したが、1837年のモリソン号事件やアヘン戦争(1840-42)で清が敗北した衝撃を受け、1842年には薪水給与令に転換し態度を軟化させた。蘭学を通じて西洋の軍事技術・国際情勢への関心も高まり、高島秋帆の砲術導入など危機感を背景にした対応が模索されるなかで、1853年のペリー来航を迎えることになる。", "regionCode": "14", "lat": 35.23, "lng": 139.72, "factLevel": "定説", "body": [{"label": "ロシア船の来航と打払令", "text": "1792年のラクスマン来航(根室)、1804年のレザノフ来航(長崎)など北方からのロシア接近が相次ぎ、幕府は1825年に異国船打払令で強硬姿勢を明確にした。", "source": "MulmoClaude"}, {"label": "モリソン号事件とアヘン戦争の衝撃", "text": "1837年、日本人漂流民の送還と通商を求めて来航したアメリカ商船モリソン号を砲撃した事件が起き、その後アヘン戦争(1840-42)で清が大国イギリスに敗れた情報が幕府に強い衝撃を与えた。", "source": "MulmoClaude"}, {"label": "蘭学と海防への関心の高まり", "text": "衝撃を受けた幕府は1842年に薪水給与令へ転換して穏健化する一方、高島秋帆による西洋砲術の導入など蘭学を通じた海防強化の模索が進んだ。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "sakoku-policy", "relation": "継承", "note": "鎖国体制そのものが対外圧力で揺らぎ始める段階として位置づけられる"}, {"concept": "qing-decline-and-opium-war", "relation": "同時代", "note": "清の開国強制の衝撃が幕府の対外政策の転換を促した"}, {"concept": "tenpo-reforms", "relation": "継承", "note": "内政改革の失敗と並行して対外危機への対応も課題になった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近世,日本,幕末,対外関係", "lastUpdated": "2026-09-04"}, {"id": "big-bang-and-early-universe", "title": "ビッグバンと宇宙の誕生", "domain": "地球・人類史", "region": "グローバル", "headline": "138億年前、時間と空間そのものが始まった", "startYear": -13800000000, "endYear": -13400000000, "eraLabel": "宇宙の初期(ビッグバン〜最初の銀河)", "summary": "約138億年前、宇宙は超高温・超高密度の一点から急激に膨張を始めた(ビッグバン)。最初の3分ほどで水素とヘリウムの原子核ができ、宇宙が『晴れ上がって』光が直進できるようになったのは約38万年後のことだった(このときの光が今も宇宙背景放射として観測される)。その後、重力が物質を集めて最初の星や銀河が生まれた。地球・生命・人類へと続く『大きな歴史』の出発点にあたる。", "regionCode": "", "factLevel": "定説", "body": [{"label": "宇宙背景放射という証拠", "text": "ビッグバンから約38万年後、宇宙の温度が下がって電子と原子核が結びつき、宇宙は『晴れ上がった』。このときの光が今も全天から届いており(宇宙マイクロ波背景放射)、ビッグバン理論を裏付ける最有力の観測証拠になっている。", "source": "WMAP/Planck衛星観測"}, {"label": "星の中で作られる元素", "text": "ビッグバンで作られたのは水素とヘリウムなど軽い元素だけ。炭素・酸素・鉄といった重い元素は、恒星内部の核融合や超新星爆発で作られた。私たちの体を作る原子の多くは、かつて星の中にあった。", "source": ""}], "relatedTopics": [{"concept": "formation-of-earth-and-solar-system", "relation": "継承", "note": "銀河の中で、やがて太陽系が生まれる"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "地球・人類史レイヤー パイロット（最軽量実装）", "date": "2026-09-05"}], "tags": "ビッグバン, 宇宙背景放射, 元素合成, ビッグヒストリー", "lastUpdated": "2026-09-05"}, {"id": "birth-of-writing", "title": "文字の発明", "domain": "横断テーマ", "region": "グローバル", "headline": "帳簿から生まれ、国家と歴史を可能にした技術", "startYear": -3300, "endYear": -1200, "eraLabel": "前4千年紀末〜前2千年紀", "summary": "最古の文字は前3300年頃メソポタミアで、粘土トークンによる数量管理から発展した楔形文字とされる。ほぼ同時期にエジプトのヒエログリフ、やや遅れて前13世紀頃の中国の甲骨文字が現れた。いずれも祭祀や行政の記録から始まり、話し言葉の書き取りへ発展した。文字は徴税・法・条約・年代記を可能にし、「先史」と「歴史」を分ける。中米のマヤ文字を含め、複数地域で独立に発明された。", "regionCode": "", "factLevel": "有力説", "body": [{"label": "複数地域での独立発明", "text": "楔形文字・ヒエログリフ・漢字（甲骨文字）・マヤ文字は、それぞれ別個に生まれたと考えられている（エジプトはメソポタミアの刺激を受けた可能性も議論される）。共通するのは、絵文字→表語文字→表音要素の付加、という発展の道筋。", "source": ""}, {"label": "アルファベットへ", "text": "前2千年紀、レヴァントで子音だけを表す簡便な文字（原カナン文字）が生まれ、フェニキア人が交易とともに広めた。これがギリシア文字・ラテン文字・アラビア文字などの祖になる。", "source": ""}], "relatedTopics": [{"concept": "mesopotamia-early-civilization", "relation": "因果", "note": "楽形文字は神殿の帳簿管理から生まれた"}, {"concept": "ancient-egypt-old-to-new", "relation": "関連", "note": "ヒエログリフは王権の記念碑表示にも使われた"}, {"concept": "yellow-river-shang-zhou", "relation": "関連", "note": "甲骨文字は占いの記録"}, {"concept": "aegean-bronze-age", "relation": "関連", "note": "線文字Bはギリシア語最古の記録"}, {"concept": "maya-civilization", "relation": "対比", "note": "旧大陸と無関係に独自の表音表意文字体系を発達させた"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "文字, 楔形文字, ヒエログリフ, アルファベット", "lastUpdated": "2026-09-03"}, {"id": "black-death", "title": "黒死病（ペストの大流行）", "domain": "横断テーマ", "region": "グローバル", "headline": "モンゴルの交易網に乗ったペストが、ヨーロッパ人口の3分の1を奪った", "startYear": 1347, "endYear": 1353, "eraLabel": "14世紀半ば", "summary": "1340年代、中央アジア起源とされるペスト菌が、モンゴルの交易網とジェノヴァ商船を介して急速に西へ広がった。1347年にシチリア・コンスタンティノープルへ、1348年にイタリア・フランス・イングランドへ達し、数年でヨーロッパ人口の3分の1前後（推計2,500万〜5,000万人）が死んだ。エジプト・シリアなど中東も甚大な被害を受けた。労働力の激減は、西欧では農奴の地位向上・賃金上昇・荘園制の解体を促し、東欧では逆に領主が農民を土地に縛る『再版農奴制』を生んだ。宗教的動揺（鞭打ち苦行団、ユダヤ人迫害）も広がった。", "factLevel": "定説", "body": [{"label": "感染経路", "text": "クリミア半島カッファ（ジェノヴァの植民市）をジョチ・ウルス軍が包囲した際に城内へ病が持ち込まれ、逃れた商船が地中海各港へ運んだ、という記録がある。ネズミノミが媒介する腺ペストに加え、肺ペストの人から人への飛沫感染も流行を加速させた。", "source": "batch 13 直接生成"}, {"label": "東西で分岐した社会的帰結", "text": "西欧では人手不足で農民の交渉力が上がり、貨幣地代化と農奴解放が進んだ。エルベ川以東では領主が輸出用穀物生産のため農民の移動を禁じ、農奴制が強化された（グーツヘルシャフト）。同じ人口減が正反対の結果を生んだ。", "source": "batch 13 直接生成"}, {"label": "モンゴルの平和の負の副産物", "text": "ユーラシアを一体化した交易網は、繁栄と同時に病原体の高速拡散も可能にした。ペストの打撃はイル・ハン国崩壊（1335年）や元末の混乱とも時期が重なり、モンゴル諸政権の弱体化を早めた。", "source": "batch 13 直接生成"}], "relatedTopics": [{"concept": "pax-mongolica-trade", "relation": "因果", "note": "一体化した交易網が病原体の西進経路になった"}, {"concept": "mongol-successor-khanates", "relation": "因果", "note": "ジョチ・ウルス軍の包囲戦がクリミアでの流行の起点とされる"}, {"concept": "feudal-europe-and-papacy", "relation": "因果", "note": "労働力激減が西欧で荘園制の解体を促した"}, {"concept": "crusades", "relation": "関連", "note": "十字軍後に東地中海交易を握ったジェノヴァ商船がペストを運んだ"}, {"concept": "kamakura-shogunate", "relation": "同時代", "note": "ヨーロッパを襲った1347〜52年、日本は鎌倉幕府滅亡後の南北朝動乱、中国も元末の混乱期だった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 13 直接生成 / rekishi-13-mongol-century.md", "date": "2026-09-04"}], "tags": "ペスト,黒死病,疫病,荘園制解体,再版農奴制", "lastUpdated": "2026-09-04"}, {"id": "buddhism-jainism-birth", "title": "仏教・ジャイナ教の誕生", "domain": "世界史", "region": "南・東南アジア", "headline": "祭式を独占するバラモンへの異議として、ガンジス流域の都市から生まれた", "startYear": -600, "endYear": -400, "eraLabel": "前6〜前5世紀（諸説あり）", "summary": "インドでは前1000年以降、社会の中心がインダス流域からガンジス川中流域へ移り、鉄器で森林を開いて農耕都市国家（マガダ国など）が生まれた。バラモンが独占する複雑な祭式への疑問から、内面の思索を重んじるウパニシャッド哲学（輪廻・業・梵我一如）が展開した。前6〜前5世紀、ブッダ（ガウタマ）は苦の原因を欲望に見て中道と八正道による解脱を説き、マハーヴィーラは徹底した不殺生と苦行のジャイナ教を開いた。いずれもヴェーダの権威と祭式主義を批判し、都市の商工業者層に受け入れられた。", "regionCode": "IN", "lat": 25, "lng": 85, "factLevel": "諸説あり", "body": [{"label": "舞台はガンジス中流の都市", "text": "鉄器による開墾で人口と交易が増え、貨幣経済と都市が発達した。バラモンの身分秩序になじまない商人・職人層が、出自を問わない新しい教えの支持基盤になった。", "source": ""}, {"label": "年代論争", "text": "ブッダの入滅を前480年ごろとする長い年代説と、前380年ごろとする短い年代説があり決着していない。", "source": ""}], "relatedTopics": [{"concept": "indus-valley-civilization", "relation": "継承", "note": "文明の中心がインダスからガンジス流域へ移った先で起きた"}, {"concept": "confucius-hundred-schools", "relation": "同時代", "note": "中国の諸子百家と同時期、既存の権威を問い直す動き"}, {"concept": "hellenistic-world", "relation": "関連", "note": "のちアショーカ王のもとで仏教が各地へ広まる素地になった"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ03)", "ref": "data/wiki/sources/rekishi-03-orient-and-polis.md", "date": "2026-09-03"}], "tags": "仏教, ジャイナ教, ブッダ, マハーヴィーラ, ウパニシャッド, マガダ, 輪廻", "lastUpdated": "2026-09-03"}, {"id": "buddhism-official-transmission-japan", "title": "仏教公伝", "domain": "日本史", "region": "日本", "headline": "百済の聖明王が仏像と経論を献じ、受容をめぐって蘇我・物部が争った", "startYear": 538, "endYear": 592, "eraLabel": "6世紀（欽明〜崇峻朝）", "summary": "6世紀半ば、百済の聖明王がヤマト王権に仏像・経論・幡蓋を贈った。伝来年は『日本書紀』の552年と、『上宮聖徳法王帝説』『元興寺縁起』の538年（戊午年）があり、538年説が有力とされる。仏教を『蕃神』として受け入れるか否かで、外来文化に積極的な蘇我氏（崇仏）と、在来の祭祀を担う物部氏・中臣氏（排仏）が対立した（崇仏論争）。587年に蘇我馬子が物部守屋を滅ぼして決着し、以後の飛鳥では蘇我氏の主導で法興寺（飛鳥寺）など本格的な寺院造営が始まった。仏教は個人の信仰であると同時に、大陸の文字・造寺・造仏・暦法をまとめて運ぶ『先進文明のパッケージ』だった。", "regionCode": "JP", "lat": 34.47, "lng": 135.82, "factLevel": "諸説あり", "body": [{"label": "二つの伝来年", "text": "干支『戊午』に合う538年を欽明朝の実年代とみて有力とする説。552年は末法思想に合わせた作為の疑い。いずれにせよ非公式にはそれ以前から渡来人が信仰していた。", "source": "詳説日本史"}, {"label": "崇仏論争の実質", "text": "単なる宗教対立ではなく、渡来系氏族と結んで台頭する蘇我氏と、軍事・祭祀の旧族（物部・中臣）の政治闘争。疫病の流行が『仏を祀った祟り/棄てた祟り』と交互に解釈された。", "source": "岩波日本史辞典"}, {"label": "丁未の乱（587年）", "text": "蘇我馬子が諸皇子・豪族を率いて物部守屋を河内に攻め滅ぼした。厩戸皇子（聖徳太子）も四天王寺建立を誓って参加したと伝わる。", "source": "詳説日本史"}, {"label": "文明のパッケージ", "text": "造寺には設計・瓦・礎石建物・仏師・暦・医が伴う。飛鳥寺の造営には百済から寺工・瓦博士・画工が派遣された。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "buddhism-jainism-birth", "relation": "継承", "note": "前6世紀インドで生まれた仏教が、約1000年かけて日本へ"}, {"concept": "wei-jin-southern-northern-dynasties", "relation": "因果", "note": "中国南朝→百済を経由して倭へ伝わった"}, {"concept": "gupta-empire", "relation": "因果", "note": "グプタ期に東漸を強めた仏教が最終的に列島へ"}, {"concept": "yamato-polity-development", "relation": "因果", "note": "氏姓制の豪族対立（蘇我vs物部）が受容の舞台"}, {"concept": "toraijin-kofun-society", "relation": "関連", "note": "渡来人がもたらした大陸文物の一つ"}, {"concept": "sui-reunification", "relation": "同時代", "note": "隋が中国を統一した頃、倭では崇仏論争が決着し飛鳥仏教が始まる"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 08 直接生成 / rekishi-08-late-antiquity-to-early-medieval.md", "date": "2026-09-03"}], "tags": "仏教公伝 百済 聖明王 欽明天皇 崇仏論争 蘇我馬子 物部守屋 丁未の乱 飛鳥寺 蕃神", "lastUpdated": "2026-09-03"}, {"id": "byzantine-medieval-transformation", "title": "ビザンツ帝国の中世的再編", "domain": "世界史", "region": "ヨーロッパ", "headline": "領土の半分を失い、ギリシア語とテマ制の中世国家として再出発した", "startYear": 610, "endYear": 900, "eraLabel": "7〜9世紀", "summary": "7世紀のビザンツは存亡の危機に立った。ササン朝との20年戦争で消耗した直後、アラブの征服でシリア・エジプト・北アフリカを永久に失い、領土は小アジアとバルカン、南イタリアに縮む。この縮んだ帝国を守るため、民政と軍事を一体化した軍管区（テマ）制がしかれ、兵士は土地を与えられて自弁で従軍する屯田兵となった。公用語はラテン語からギリシア語へ、皇帝の称号もバシレウスへ変わる。8〜9世紀には聖像禁止令をめぐる1世紀以上の論争が続き、この間にローマ教会との対立が深まって東西教会分裂への道が開いた。ここでビザンツは『東ローマ』からギリシア語・正教・テマ制の中世国家へと変わり、なお600年続く。", "regionCode": "TR", "lat": 41.01, "lng": 28.98, "factLevel": "有力説", "body": [{"label": "テマ（軍管区）制", "text": "属州をテマに再編し、その司令官（ストラテゴス）が軍事も民政も統轄。兵士には土地が与えられ、その収益で武具を自弁して従軍する。中央財政が乏しいなかで安価に常備兵力を保つ仕組みで、7〜8世紀の防衛を支えた。", "source": "batch 10 直接生成"}, {"label": "聖像禁止令（726〜843）", "text": "レオン3世が教会の聖像（イコン）崇拝を偶像崇拝として禁じた。聖像を持たないイスラーム・ユダヤ教への対抗意識と、修道院の富・影響力を削ぐ狙い。843年に聖像崇拝が復活して決着したが（『正教勝利の日』）、その間にローマ教皇との溝が深まった。", "source": "batch 10 直接生成"}, {"label": "ギリシア化", "text": "支配層・行政・軍がアナトリアとバルカンに集中した結果、ラテン語は実務から消え、ギリシア語が唯一の公用語に。自称は『ローマ人（ロマイオイ）』のままだが、実質はギリシア語圏の正教国家となった。", "source": "batch 10 直接生成"}, {"label": "存続の意味", "text": "コンスタンティノープルの三重城壁と『ギリシアの火』（燃える液体兵器）が、674〜678年と717〜718年の二度のアラブ大攻囲を退けた。ビザンツの防波堤がなければ、イスラーム勢力はより早くバルカン・東欧へ及んでいたとされる。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "eastern-roman-empire", "relation": "継承", "note": "ユスティニアヌスの地中海再統一のあと、縮小して中世国家へ"}, {"concept": "arab-caliphate-expansion", "relation": "因果", "note": "シリア・エジプト・北アフリカ喪失が再編を強いた"}, {"concept": "frankish-kingdom-carolingian", "relation": "対比", "note": "西のもう一人の『ローマ皇帝』、教会も東西に分岐へ"}, {"concept": "rise-of-islam", "relation": "対比", "note": "聖像を禁じる一神教との対抗が聖像禁止令の一因"}, {"concept": "anatolia-geography", "relation": "地理的背景", "note": "縮小後の帝国の中核。テマの人的・経済的基盤"}, {"concept": "nara-period", "relation": "同時代", "note": "聖像禁止令のころ、日本では東大寺大仏の造立"}, {"concept": "ottoman-empire", "relation": "継承", "note": "1453年メフメト2世がコンスタンティノープルを陥落させ滅ぼした"}, {"concept": "renaissance", "relation": "因果", "note": "滅亡によりギリシア人学者と写本がイタリアへ流入した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 10 直接生成 / rekishi-10-medieval-world-formation.md", "date": "2026-09-03"}], "tags": "ビザンツ,東ローマ,テマ制,聖像禁止令,ギリシア化,正教,コンスタンティノープル", "lastUpdated": "2026-09-03"}, {"id": "caucasus-highlands-geography", "title": "コーカサス山脈と高地", "domain": "地理", "region": "西アジア・中東", "headline": "黒海とカスピ海をつなぐ壁。多言語の山岳避難地帯", "eraLabel": "地理単元", "summary": "コーカサス山脈は黒海とカスピ海の間を北西〜南東に走る大山脈で、ヨーロッパとアジアの境の一つとされる。大コーカサスは5000m級の障壁となり、南麓（南コーカサス＝ジョージア・アルメニア・アゼルバイジャン）は温暖で葡萄・穀物が育つ。山がちで谷ごとに集団が孤立するため、非常に多くの言語・民族が併存する『言語の山』。金・銅の鉱床に恵まれ、冶金と葡萄酒醸造の最古級の遺跡がある。", "regionCode": "GE", "lat": 42.5, "lng": 44, "factLevel": "定説", "body": [{"label": "南北の関門", "text": "大コーカサスを越える峠（ダリアル峠など）は少なく、北のステップ遊牧民と南の農耕文明を隔てる自然国境になった。", "source": ""}, {"label": "冶金と葡萄酒の古地", "text": "前6千年紀の葡萄酒醸造跡、前4千年紀の金属加工（クラ・アラクセス文化）など、技術の早期中心の一つ。", "source": ""}, {"label": "避難地帯", "text": "険しい地形が征服を阻み、平野で滅びた言語や信仰が山中に残った。", "source": ""}], "relatedTopics": [{"concept": "iranian-plateau-geography", "relation": "関連", "note": "イラン高原の北西に連なる山岳地帯"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "対比", "note": "山脈が農耕民と遊牧民を分ける、東アジアの長城ラインの西版"}, {"concept": "neolithic-revolution", "relation": "関連", "note": "葡萄酒醸造・金属加工の最古級の遺跡がある"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ04)", "ref": "data/wiki/sources/rekishi-04-west-asia-geography.md", "date": "2026-09-03"}], "tags": "コーカサス, ジョージア, 葡萄酒, クラ・アラクセス文化, 言語の山", "lastUpdated": "2026-09-03"}, {"id": "china-landforms-great-rivers", "title": "中国の地形と大河（黄河・長江）", "domain": "地理", "region": "東アジア", "headline": "西から東へ三段に下る大地を、黄河と長江が横切って海へ注ぐ", "eraLabel": "地理単元", "summary": "中国の地形は西のチベット高原、内陸の高原・盆地、東の平野へと階段状に低くなる。主要な大河はこの傾斜に沿って西から東へ流れ、北の黄河と南の長江が二大水系をなす。黄河は黄土高原の細かい土を大量に運び、下流の華北平原で河床を上げて洪水と流路変更を繰り返した。長江は水量が豊かで流れが安定し、古くから水運の大動脈となった。人口と政治の中心は、沖積土の厚い東部低地に偏った。", "regionCode": "CN", "lat": 35, "lng": 110, "factLevel": "定説", "body": [{"label": "黄河と治水", "text": "運んだ黄土が下流でたまり、堤防で締め切ると河床がまわりの平野より高い『天井川』になる。決壊すれば広大な範囲が水没し流路も変わるため、堤防と分流の維持管理が歴代王朝の最重要事業だった。", "source": ""}, {"label": "長江という動脈", "text": "三峡を抜けると流れがゆるみ、支流と湖沼が網の目状に広がる。年間を通じて船が通え、稲作地帯と都市を結ぶ物流路として華北より優位に立つ時期が長かった。", "source": ""}, {"label": "東の平野に人が集まる", "text": "第三段の華北平原・長江下流平野は沖積土が厚く、灌漑と排水さえ整えば高い収量が得られる。中国史の人口と政治の中心はこの東部低地に偏った。", "source": ""}], "relatedTopics": [{"concept": "yellow-river-shang-zhou", "relation": "地理的背景", "note": "黄河中流の黄土地帯で初期王朝が興った"}, {"concept": "north-south-china-divide", "relation": "関連", "note": "同じ大地を南北に分ける気候の境"}, {"concept": "japan-archipelago-geography", "relation": "対比", "note": "大河の沖積平野を持つ大陸と、短い急流しかない列島"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ02)", "ref": "data/wiki/sources/rekishi-02-east-asia-geography.md", "date": "2026-09-03"}], "tags": "中国, 黄河, 長江, 華北平原, 黄土高原, 天井川", "lastUpdated": "2026-09-03"}, {"id": "chinese-civil-war-and-prc", "title": "国共内戦と中華人民共和国の成立", "domain": "世界史", "region": "東アジア", "startYear": 1946, "endYear": 1949, "eraLabel": "中国革命", "headline": "共産党が国民党を破り中国大陸を統一", "summary": "日本の敗戦後、中国国内で国民党（蒋介石）と共産党（毛沢東）の内戦が再燃。共産党が農村部の支持を集めて勝利し、1949年に中華人民共和国の成立を宣言した。敗れた国民党政府は台湾に逃れ、以後「二つの中国」問題が続く。", "factLevel": "定説", "body": [{"label": "内戦再燃の背景", "text": "日中戦争中は両党が一時的に手を組んでいた（国共合作）が、日本降伏後に主導権争いが再燃。国民党は都市部と正規軍で優勢に見えたが、汚職・インフレで民心を失った。"}, {"label": "共産党の戦略", "text": "毛沢東は農村を根拠地に土地改革（地主から農民への土地再分配）で農民の支持を獲得し、農村から都市を包囲する戦略で勝利を収めた。"}, {"label": "分断の固定化", "text": "1949年、蒋介石ら国民党政府は台湾へ撤退し中華民国を存続。大陸の中華人民共和国との「二つの中国」対立は今日まで続く外交上の火種になっている。"}], "relatedTopics": [{"concept": "qing-late-reform-and-decline", "relation": "継承", "note": "清朝崩壊後の混乱と軍閥割拠の延長線上にある内戦"}, {"concept": "pacific-war", "relation": "継承", "note": "日本の敗戦で空いた権力の空白を巡る内戦が再燃した"}, {"concept": "cold-war", "relation": "テーマ", "note": "共産党政権の成立はアジアにおける冷戦構造を決定づけた"}, {"concept": "korean-war", "relation": "因果", "note": "成立直後の中国が義勇軍を送り朝鮮戦争に介入"}]}, {"id": "cold-war", "title": "冷戦", "domain": "世界史", "region": "グローバル", "startYear": 1945, "endYear": 1989, "eraLabel": "冷戦時代", "headline": "米ソが直接戦わずに対立した半世紀", "summary": "第二次世界大戦後、資本主義陣営（アメリカ中心）と社会主義陣営（ソ連中心）が世界を二分し、核兵器を背景に直接の全面戦争は避けながら、軍拡競争・代理戦争・体制間の宣伝合戦を続けた対立構造。1989年のベルリンの壁崩壊、1991年のソ連解体で終結した。", "factLevel": "定説", "body": [{"label": "なぜ「冷たい」戦争か", "text": "米ソは互いに核兵器を持ち、直接ぶつかれば人類全体が滅びかねない（相互確証破壊）。だから両国の軍隊が正面から撃ち合う「熱い戦争」は避け、代わりに他国での代理戦争（朝鮮戦争・ベトナム戦争など）、宇宙開発競争、経済体制の優劣アピールで戦った。"}, {"label": "陣営の形成", "text": "西側はアメリカを中心にNATO（北大西洋条約機構、1949）、東側はソ連を中心にワルシャワ条約機構（1955）を結成。ヨーロッパは「鉄のカーテン」で東西に分断され、ドイツも東西に分裂した。"}, {"label": "終わり方", "text": "1980年代後半、ソ連のゴルバチョフ書記長がペレストロイカ（改革）とグラスノスチ（情報公開）を進め、東欧の共産党政権が次々崩壊。1989年ベルリンの壁が壊され、1991年ソ連自体が解体して冷戦は終わった。"}], "relatedTopics": [{"concept": "russian-revolution", "relation": "継承", "note": "ソ連という当事国自体がロシア革命で誕生"}, {"concept": "world-war-two", "relation": "因果", "note": "戦後の主導権争いから東西対立が始まった"}, {"concept": "korean-war", "relation": "具体例", "note": "冷戦下の代理戦争の代表例"}, {"concept": "decolonization", "relation": "テーマ", "note": "独立した新興国の多くが米ソどちらに付くか揺れた"}, {"concept": "german-unification", "relation": "対比", "note": "1871年の統一とは逆に、冷戦下では一度ドイツが東西に分裂した"}]}, {"id": "confucius-hundred-schools", "title": "孔子と諸子百家の始まり", "domain": "世界史", "region": "東アジア", "headline": "乱世をどう立て直すか──孔子が「仁」と「礼」で答え、多くの学派が続いた", "startYear": -551, "endYear": -403, "eraLabel": "前6〜前5世紀", "summary": "春秋末の魯に生まれた孔子（前551ごろ〜前479ごろ）は、乱れた世を、周初の礼と「仁」（人を思いやる心）に立ち返ることで正そうと説いた。各国を巡って理想の政治を求めたが用いられず、弟子の教育に専念した。その言行は後に『論語』にまとめられ、儒家の出発点となった。戦国期にかけて法家・道家・墨家など多くの学派（諸子百家）が現れる。孔子の実像や『論語』の成立には諸説がある。", "regionCode": "CN", "lat": 35.6, "lng": 116.98, "factLevel": "有力説", "body": [{"label": "問いは「秩序の回復」", "text": "諸子百家に共通するのは、どうすれば乱世を終わらせ人が安んじて暮らせるかという実践的な問い。孔子は道徳と教育に、のちの法家は法と刑罰に、道家は作為の否定に答えを求めた。", "source": ""}, {"label": "同時代の精神運動", "text": "ギリシアの自然哲学、インドの仏教・ジャイナ教とほぼ同時期に、中国でも既存の権威を問い直す思想が噴き出した。ヤスパースはこれらをまとめて『枢軸時代』と呼んだ。", "source": ""}], "relatedTopics": [{"concept": "zhou-eastern-spring-autumn", "relation": "因果", "note": "下剋上の乱世が思想を生む土壌になった"}, {"concept": "yellow-river-shang-zhou", "relation": "関連", "note": "孔子は西周初期の礼制を理想として振り返った"}, {"concept": "buddhism-jainism-birth", "relation": "同時代", "note": "インドの仏教・ジャイナ教と同じ前6〜前5世紀の思想の噴出（枢軸時代）"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ03)", "ref": "data/wiki/sources/rekishi-03-orient-and-polis.md", "date": "2026-09-03"}], "tags": "孔子, 論語, 儒家, 諸子百家, 仁, 礼, 枢軸時代", "lastUpdated": "2026-09-03"}, {"id": "congo-basin-rainforest-geography", "title": "コンゴ盆地の熱帯雨林", "domain": "地理", "region": "アフリカ", "headline": "アマゾンに次ぐ「地球の第2の肺」――皿状の低地と滝が、外部の侵入を阻んだ", "factLevel": "定説", "regionCode": "CD", "lat": -1, "lng": 22, "summary": "コンゴ盆地は赤道直下の巨大な低地で、周囲を台地に囲まれた「皿」状の地形。アマゾンに次ぐ世界第2の熱帯雨林が広がる。年降水量1,500〜2,000mm、年較差が小さく高温多湿。コンゴ川は流量でアマゾンに次ぐ世界2位で、赤道を2度またぐ弧を描くため常にどこかが雨季で流量が安定している。濃い森林と河口近くのリヴィングストン瀑布群が外部からの侵入・開発を長く阻んだ。現代では違法伐採・鉱物採掘（コバルト・コルタン）と生物多様性・炭素貯蔵の保全がせめぎ合う。", "body": [{"label": "皿状の地形", "text": "盆地の中央が標高300〜400m、縁が1,000m級の台地。かつては巨大な内陸湖で、その堆積層が肥沃度の低い砂質土壌を作った。", "source": "batch 12 直接生成"}, {"label": "コンゴ川の安定した流量", "text": "赤道を2回横切るため北半球と南半球の雨季が交互に流域を潤し、季節変動が小さい。河口手前のリヴィングストン瀑布群（落差約270m）で大型船が遡れず、内陸交通は分断された。", "source": "batch 12 直接生成"}, {"label": "森の住み分け", "text": "狩猟採集民（バカ・ムブティなどピグミー系）と、鉄器・農耕をもって拡散したバントゥー系農耕民が、交換関係を保ちながら住み分けてきた。", "source": "batch 12 直接生成"}, {"label": "地球規模の意義", "text": "「地球の第2の肺」と呼ばれ、泥炭湿地（クヴェット・サントラル）に大量の炭素を蓄える。コバルト・コルタン採掘と森林減少が、気候・人権の両面で国際的争点になっている。", "source": "batch 12 直接生成"}], "relatedTopics": [{"concept": "africa-plateau-and-coast-geography", "relation": "関連", "note": "台地に囲まれた赤道直下の皿状低地。滇で分断される川の典型"}, {"concept": "east-african-rift-geography", "relation": "対比", "note": "西の低い森林盆地と、東の高い地溝帯高原という東西の対照"}, {"concept": "sahel-belt-geography", "relation": "対比", "note": "多雨で人が入りにくい森林と、少雨で交易都市が並ぶ草原の対照"}, {"concept": "amazon-basin-geography", "relation": "対比", "note": "世界最大と第2位の熱帯雨林どうし"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 12 直接生成 / rekishi-12-africa-geography.md", "date": "2026-09-03"}], "tags": "地理,アフリカ,熱帯雨林,コンゴ川,炭素,鉱物", "lastUpdated": "2026-09-03"}, {"id": "crusades", "title": "十字軍", "domain": "世界史", "region": "西アジア・中東", "headline": "聖地回復の名のもとに西欧が東地中海へ──結果は地中海交易の活性化", "startYear": 1096, "endYear": 1291, "eraLabel": "11〜13世紀", "factLevel": "定説", "regionCode": "IL", "lat": 31.78, "lng": 35.23, "summary": "セルジューク朝の進出に脅かされたビザンツ皇帝の救援要請を受け、1095年に教皇ウルバヌス2世がクレルモン教会会議で聖地回復を呼びかけて始まった一連の遠征。第1回（1096〜99）はエルサレムを占領してイェルサレム王国を建てたが、13世紀までに聖地はイスラーム側に戻った。宗教的動機のほか、諸侯の領土欲、商人の利権、贖罪の願望が入り混じっていた。最大の歴史的影響は聖地の帰属ではなく、ヴェネツィア・ジェノヴァなどイタリア諸都市が東方交易の中継で巨富を得て台頭したことにある。", "body": [{"label": "きっかけ", "text": "1071年マンジケルトの戦いでセルジューク朝がビザンツを破りアナトリアに進出。皇帝アレクシオス1世の救援要請に、教皇が『神がそれを望んでいる』と応えた。", "source": "batch 11 直接生成"}, {"label": "第1回十字軍", "text": "諸侯軍が1099年にエルサレムを陥落させ住民を虐殺、イェルサレム王国など十字軍国家を建てた。以後サラディンの奪回（1187）などを経て第3回以降は成果が乏しくなる。", "source": "batch 11 直接生成"}, {"label": "第4回の逸脱", "text": "1204年、第4回十字軍はヴェネツィアの誘導で同じキリスト教国のコンスタンティノープルを攻略・略奪し、ラテン帝国を建てた。十字軍運動の変質を象徴する事件。", "source": "batch 11 直接生成"}, {"label": "副産物としての交易", "text": "遠征の輸送・補給を担ったイタリア海港都市が東地中海の商業拠点を獲得。香辛料・絹・砂糖の交易で富み、のちのルネサンスの経済的土台になった。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "seljuk-and-medieval-islamic-dynasties", "relation": "因果", "note": "セルジューク朝のアナトリア進出が直接の引き金"}, {"concept": "byzantine-medieval-transformation", "relation": "因果", "note": "ビザンツの救援要請が発端。だが第4回で首都を奪われる皮肉"}, {"concept": "feudal-europe-and-papacy", "relation": "同時代", "note": "教皇権の絶頂期、封建諸侯の対外エネルギーの発露"}, {"concept": "mediterranean-world-geography", "relation": "地理的背景", "note": "内海の交易ネットワークが遠征を可能にし、遠征が交易を太らせた"}, {"concept": "insei-period", "relation": "同時代", "note": "白河院政の開始（1086）と第1回十字軍（1096）はほぼ同時。ともに『本来の権力者の上に立つ権威』の構図"}, {"concept": "pax-mongolica-trade", "relation": "関連", "note": "十字軍後に東地中海交易を握ったジェノヴァ・ヴェネツィアが黒海でモンゴル交易網に接続した"}, {"concept": "black-death", "relation": "因果", "note": "ジェノヴァ商船が黒海のペストを地中海へ運んだ"}, {"concept": "renaissance", "relation": "因果", "note": "東方交易で富を得たイタリア都市がルネサンスのパトロンとなった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "中世,ヨーロッパ,宗教,交易,イスラーム", "lastUpdated": "2026-09-03"}, {"id": "danger-list", "title": "危機にさらされている世界遺産リスト", "domain": "横断テーマ", "region": "グローバル", "headline": "危機遺産リスト＝『罰』にも『国際支援のスイッチ』にもなる両刃の一覧", "summary": "武力紛争、災害、開発、観光圧などで顕著な普遍的価値が脅かされている世界遺産を載せる別リスト。載ると国際的な注目と資金・技術支援が集まる一方、当事国は『管理失敗の烙印』と受け取ることも多い。改善すれば外れ、価値が失われたと判断されれば『登録抹消』もありうる。", "isWorldHeritage": true, "relatedTopics": [{"concept": "world-heritage-convention", "relation": "テーマ"}, {"concept": "angkor", "relation": "因果", "note": "危機遺産を支援のトリガーとして活用"}, {"concept": "venice-and-its-lagoon", "relation": "関連", "note": "危機遺産入りが繰り返し勧告される代表例"}, {"concept": "great-barrier-reef", "relation": "関連", "note": "気候変動を理由とする危機遺産勧告"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "制度, 保全, 登録抹消, 世界遺産", "lastUpdated": "2026-09-03", "body": [{"label": "登録抹消は3例", "text": "アラビアオリックスの保護区（オマーン・2007、油田開発）、ドレスデン・エルベ渓谷（ドイツ・2009、橋の建設）、リヴァプール海商都市（英国・2021、再開発）。", "source": "パイロット"}, {"label": "『前向きな危機遺産』", "text": "カンボジアのアンコールは、国際支援を呼び込む目的で登録と同時に危機遺産入りし、整備後に脱した。リストの使い方を変えた先例。", "source": "パイロット"}]}, {"id": "deccan-plateau-and-south-india", "title": "デカン高原と南インド", "domain": "地理", "region": "南・東南アジア", "headline": "玄武岩の台地と、山脈に隔てられて独自の言語・文化を保った半島南部", "eraLabel": "地形（約6600万年前の噴火以降）", "summary": "インド半島の大部分を占めるデカン高原は、約6600万年前の大規模噴火（デカン・トラップ）が作った玄武岩の台地で、東西のガーツ山脈に縁取られて西へゆるく傾く。西ガーツが西からの湿った季節風を遮るため、内陸は乾燥した黒色綿花土（レグール）が広がる。北のインド・アーリヤ語圏に対し、南インドはドラヴィダ語族（タミル、テルグ、カンナダ、マラヤーラム）の世界で、北の諸帝国の支配が及びにくく、チョーラ朝など独自の海洋国家が栄えた。半島南端と対岸のスリランカは交易と仏教・ヒンドゥー教の南限を担った。", "regionCode": "IN", "lat": 17.4, "lng": 78.47, "factLevel": "定説", "body": [{"label": "デカン・トラップ", "text": "インドがレユニオン・ホットスポットの上を通過した際の洪水玄武岩。厚さは最大2000mに及ぶ。肥沃な黒色土の母材。", "source": "新詳地理"}, {"label": "二つのガーツと雨陰", "text": "西ガーツ風上は多雨（年3000mm超）、越えた内陸のデカンは半乾燥。綿花・雑穀、後に綿工業。", "source": "新詳地理"}, {"label": "ドラヴィダの南", "text": "ヴィンディヤ山脈・デカンが北からの征服を鈍らせ、南インドは言語的・文化的な独自性を保った。タミル文学（サンガム）。", "source": "詳説世界史"}, {"label": "海のつながり", "text": "チョーラ朝（後代）はスリランカ・東南アジアへ海軍遠征。ローマ金貨も南インドで多出。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "himalaya-and-indian-subcontinent", "relation": "対比", "note": "北の三大河平野に対し、半島は古い岩盤の台地"}, {"concept": "south-asian-monsoon", "relation": "因果", "note": "西ガーツの雨陰がデカン内陸を乾燥させる"}, {"concept": "indian-ocean-maritime-trade", "relation": "地理的背景", "note": "南インドの港がローマ―東南アジア交易の要"}, {"concept": "maurya-empire", "relation": "対比", "note": "マウリヤの支配も半島南端までは及ばなかった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 09 直接生成 / rekishi-09-south-southeast-asia-geography.md", "date": "2026-09-03"}], "tags": "デカン高原 デカン・トラップ 玄武岩 ガーツ山脈 雨陰 レグール ドラヴィダ語族 タミル サンガム文学", "lastUpdated": "2026-09-03"}, {"id": "decolonization", "title": "脱植民地化", "domain": "世界史", "region": "グローバル", "startYear": 1945, "endYear": 1975, "eraLabel": "独立の波", "headline": "アジア・アフリカが次々に独立した時代", "summary": "第二次世界大戦で疲弊した欧州列強（イギリス・フランスなど）の支配力が弱まり、1940年代後半から70年代にかけてアジア・アフリカの植民地が相次いで独立した。多くの新興国は冷戦下で米ソどちらに付くか、あるいは非同盟の道を選ぶかの選択を迫られた。", "factLevel": "定説", "body": [{"label": "きっかけ", "text": "戦争で欧州本国が疲弊し植民地を維持する余力を失ったこと、大戦中に日本が「アジア人のアジア」を掲げてヨーロッパの威信を傷つけたこと、国連憲章が民族自決を掲げたことが重なった。"}, {"label": "代表例", "text": "インド・パキスタンが1947年に独立（同時にヒンドゥー・ムスリムの分離と大量の避難民・宗教対立を伴った）。アフリカでは1960年だけで17か国が独立し「アフリカの年」と呼ばれた。"}, {"label": "独立後の課題", "text": "植民地時代の境界線をそのまま国境として引き継いだため、民族・宗教の分布と一致せず内戦や対立の火種になった国が多い（アフリカ分割の負の遺産）。"}], "relatedTopics": [{"concept": "scramble-for-africa", "relation": "因果", "note": "分割統治の境界線がそのまま独立後の国境として残った"}, {"concept": "cold-war", "relation": "テーマ", "note": "新興国は東西どちらの陣営に付くか、非同盟かの選択を迫られた"}, {"concept": "middle-east-wars-and-israel", "relation": "具体例", "note": "イギリス委任統治領パレスチナの独立問題が中東戦争に直結"}, {"concept": "mainland-and-maritime-southeast-asia", "relation": "地理的背景", "note": "東南アジアも同時期に相次いで独立した"}]}, {"id": "delhi-sultanate", "title": "デリー・スルタン朝", "domain": "世界史", "region": "南・東南アジア", "headline": "北インドに定着した最初の本格的イスラーム政権、そしてモンゴルの防波堤", "startYear": 1206, "endYear": 1526, "eraLabel": "13〜16世紀", "summary": "12世紀末、アフガニスタンのゴール朝が北インドへ侵攻し、その武将アイバクが1206年にデリーで自立して奴隷王朝を開いた。以後、ハルジー朝・トゥグルク朝など五王朝が交替しながら約320年続く。これがインド亜大陸で本格的にイスラーム政権が定着した最初で、ヒンドゥー教社会の上に少数のムスリム支配層が乗る構造が生まれた。トゥグルク朝は一時デカン高原まで版図を広げたが無理な政策で混乱。1398年にはティムールの侵攻でデリーが略奪され、以後は北インドの一地方政権に縮小し、1526年にムガル帝国のバーブルに滅ぼされた。", "regionCode": "IN", "lat": 28.65, "lng": 77.23, "factLevel": "定説", "body": [{"label": "モンゴルの防波堤", "text": "13世紀を通じてチャガタイ・ハン国のモンゴル軍が北西からたびたび侵入したが、ハルジー朝のアラー・ウッディーンらがこれを撃退した。インドがモンゴルの直接支配を免れた一因である。", "source": "batch 13 直接生成"}, {"label": "社会への影響", "text": "都市を中心にイスラームが広がり、スーフィズム（神秘主義教団）が民衆に浸透した。ペルシア語が行政・文学の言語となり、のちにヒンディー語と混じってウルドゥー語が形成される素地ができた。北インドの仏教はこの時期に事実上消滅した。", "source": "batch 13 直接生成"}, {"label": "五王朝の交替", "text": "奴隷王朝→ハルジー朝→トゥグルク朝→サイイド朝→ローディー朝。いずれもテュルク系・アフガン系の軍事エリートによる政権で、王位継承は暴力的で不安定だった。", "source": "batch 13 直接生成"}], "relatedTopics": [{"concept": "himalaya-and-indian-subcontinent", "relation": "地理的背景", "note": "北西の山道（カイバル峠）から侵入してきた"}, {"concept": "gupta-empire", "relation": "対比", "note": "ヒンドゥー古典文化の時代から、ムスリム支配層が上に乗る構造へ"}, {"concept": "buddhism-jainism-birth", "relation": "関連", "note": "北インドの仏教がこの時期に事実上消滅した"}, {"concept": "mongol-successor-khanates", "relation": "対比", "note": "チャガタイ軍の再三の侵入を撃退した"}, {"concept": "seljuk-and-medieval-islamic-dynasties", "relation": "継承", "note": "ゴール朝を経てトルコ系軍人政権の系譜に連なる"}, {"concept": "kamakura-shogunate", "relation": "同時代", "note": "奴隷王朝の成立（1206）は源頼朝死後まもなく、北条執権政治の開始期にあたる"}, {"concept": "safavid-and-mughal-empires", "relation": "継承", "note": "1526年バーブルがデリー・スルタン朝を破りムガル帝国を開いた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 13 直接生成 / rekishi-13-mongol-century.md", "date": "2026-09-04"}], "tags": "デリー,スルタン,奴隷王朝,ハルジー朝,トゥグルク朝,イスラーム", "lastUpdated": "2026-09-04"}, {"id": "east-african-rift-geography", "title": "東アフリカ地溝帯（グレート・リフト・バレー）", "domain": "地理", "region": "アフリカ", "headline": "大陸が裂けつつある6,000kmの谷――「人類のゆりかご」であり、いまも広がる地球の割れ目", "factLevel": "定説", "regionCode": "KE", "lat": 0.5, "lng": 36, "summary": "東アフリカ地溝帯は、アフリカ大陸が東西に引き裂かれつつある巨大な断層の谷で、紅海からモザンビークまで南北約6,000km続く。プレートの発散境界で、両側が隆起して東アフリカ高原（標高1,000〜2,000m、赤道直下でも冷涼で人が住みやすい熱帯高地）を作り、谷底には細長い湖（タンガニーカ湖＝世界第2の水深）と火山（キリマンジャロ、ケニア山）が並ぶ。地質学的に重要なのは、堆積層から初期人類の化石が集中して見つかること。断層運動で古い地層が露出し火山灰で年代測定ができるため「化石が読める」土地になっている。", "body": [{"label": "でき方", "text": "アフリカプレートがヌビア側とソマリア側に分裂しつつある発散境界。年数mmの速さで開き続け、数千万年後には新しい海になると考えられている。マグマの上昇で両肩が隆起した。", "source": "batch 12 直接生成"}, {"label": "熱帯高地という恵み", "text": "赤道直下でも標高が高く冷涼で、マラリア蚊が少なく、農業に適する。エチオピア高原、ケニア高地、大湖地方など、東アフリカの人口密集地はこの隆起帯に集中する。", "source": "batch 12 直接生成"}, {"label": "人類化石の宝庫", "text": "オルドヴァイ峡谷、トゥルカナ湖、ハダール（アウストラロピテクスの「ルーシー」）など。断層で古地層が露出し、火山灰層で正確な年代が測れるため、人類進化研究の中心地になった。", "source": "batch 12 直接生成"}, {"label": "水系と火山", "text": "西の枝（アルバーティーン地溝帯）沿いにナイルの水源の一つヴィクトリア湖がある。エチオピア高原は玄武岩溶岩の高地で、青ナイルの水源としてエジプトの氾濫を支えてきた。", "source": "batch 12 直接生成"}], "relatedTopics": [{"concept": "africa-plateau-and-coast-geography", "relation": "関連", "note": "高アフリカの背骨。台地を隆起させた張本人"}, {"concept": "neolithic-revolution", "relation": "関連", "note": "初期人類の起源地。ここから人類は世界へ拡散し、各地で農耕を始めた"}, {"concept": "ancient-egypt-old-to-new", "relation": "地理的背景", "note": "エチオピア高原（地溝帯の隆起肩）の雨が青ナイルとなりエジプトの氾濫を生む"}, {"concept": "indian-ocean-maritime-trade", "relation": "地理的背景", "note": "地溝帯高原の産物（金・象牙）が東アフリカ岸から海の交易に流れた"}, {"concept": "congo-basin-rainforest-geography", "relation": "対比", "note": "東の高い地溝帯高原と、西の低い森林盆地"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 12 直接生成 / rekishi-12-africa-geography.md", "date": "2026-09-03"}], "tags": "地理,アフリカ,地溝帯,プレート,人類進化,高地", "lastUpdated": "2026-09-03"}, {"id": "eastern-roman-empire", "title": "東ローマ帝国の存続とユスティニアヌス", "domain": "世界史", "region": "ヨーロッパ", "headline": "ローマは東で生き延びた──法典と大聖堂を残し、千年続く帝国へ", "startYear": 330, "endYear": 610, "eraLabel": "4世紀〜7世紀初頭", "summary": "330年、コンスタンティヌス帝がボスフォラス海峡のビザンティオンに新首都コンスタンティノープルを建設した。人口と富の中心が東地中海にあり、首都は三方を海に守られた要害だったため、395年の東西分割後に西が崩れても東は存続した。6世紀のユスティニアヌス帝は北アフリカ・イタリアを一時奪回し、『ローマ法大全』を編纂、ハギア・ソフィア聖堂を再建した。だが戦費と541年からのペスト大流行が国力を削り、征服は長続きしなかった。7世紀にはギリシア語を公用語とし、イスラーム勢力に押されて中世的な国家（ビザンツ帝国）へ変質していく。", "regionCode": "TR", "lat": 41.01, "lng": 28.98, "factLevel": "定説", "body": [{"label": "なぜ東は残ったか", "text": "人口と富の中心が東地中海にあり、コンスタンティノープルは三方を海に守られ穀倉エジプトを押さえていた。ゲルマン諸族の圧力を金と外交でドナウの外へ逸らす余力があった。", "source": "詳説世界史"}, {"label": "ユスティニアヌスの復興（527〜565）", "text": "将軍ベリサリウスがヴァンダル王国・東ゴート王国を滅ぼし地中海をほぼ『ローマの内海』に戻した。『ローマ法大全』は後世ヨーロッパ法学の土台に。ただし戦費と541年に始まるペスト大流行（ユスティニアヌスの疫病）が国力を深く傷つけた。", "source": "岩波講座 世界歴史"}, {"label": "ビザンツへの変質", "text": "ヘラクレイオス帝期に公用語がラテン語からギリシア語へ。ササン朝との総力戦の直後にアラブ・イスラーム軍が現れ、シリア・エジプトを喪失。『ローマ帝国』を自称し続けたが実質は別の国家になった。", "source": "岩波講座 世界歴史"}], "relatedTopics": [{"concept": "roman-principate", "relation": "継承", "note": "帝国の東半分がそのまま存続した"}, {"concept": "germanic-migration-and-western-rome-fall", "relation": "対比", "note": "西は消え、東は千年続いた"}, {"concept": "parthia-and-sasanian", "relation": "対比", "note": "7世紀まで続いた東の宿敵。総力戦で共倒れ気味に"}, {"concept": "silk-road-trade", "relation": "関連", "note": "絹の一大消費地。6世紀に養蚕技術が中国から伝わる"}, {"concept": "yamato-polity-development", "relation": "同時代", "note": "ユスティニアヌスの地中海再征服のころ、倭は継体・欽明朝"}, {"concept": "byzantine-medieval-transformation", "relation": "継承", "note": "ユスティニアヌス以後、アラブの征服で縮小しテマ制・ギリシア語の中世国家へ"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 08 直接生成 / rekishi-08-late-antiquity-to-early-medieval.md", "date": "2026-09-03"}], "tags": "東ローマ帝国 ビザンツ帝国 コンスタンティノープル ユスティニアヌス ローマ法大全 ハギア・ソフィア ベリサリウス", "lastUpdated": "2026-09-03"}, {"id": "edo-shogunate-bakuhan-system", "title": "江戸幕府の成立と幕藩体制", "domain": "日本史", "region": "日本", "headline": "関ヶ原の勝者が、将軍と大名を束ねる二重統治を制度化した", "startYear": 1603, "endYear": 1651, "eraLabel": "江戸時代初期", "summary": "関ヶ原の戦い(1600)で勝利した徳川家康は1603年に征夷大将軍となり江戸幕府を開いた。豊臣氏を大坂の陣(1614-15)で滅ぼしたのち、武家諸法度・参勤交代・大名の統制策を整え、将軍が全国を直接統治するのではなく、多数の大名(藩)に領地統治を委ねつつ従わせる「幕藩体制」を作り上げた。3代将軍家光の頃までにこの支配の枠組みはほぼ完成し、以後260年余り続く江戸時代の土台となった。", "regionCode": "13", "lat": 35.6762, "lng": 139.6503, "factLevel": "定説", "body": [{"label": "関ヶ原から江戸開幕へ", "text": "1600年の関ヶ原の戦いで石田三成ら西軍を破った徳川家康が、1603年に朝廷から征夷大将軍に任じられ、江戸に幕府を開いた。", "source": "MulmoClaude"}, {"label": "大坂の陣と豊臣氏の滅亡", "text": "大坂冬の陣(1614)・夏の陣(1615)で豊臣秀頼を滅ぼし、徳川家に対抗しうる勢力を完全に排除して支配を安定させた。", "source": "MulmoClaude"}, {"label": "幕藩体制という仕組み", "text": "武家諸法度で大名を統制し、参勤交代で大名の財力・軍事力を消耗させる一方、各藩の内政には一定の自治を認めるという中央集権と地方分権を組み合わせた統治構造を築いた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "sengoku-and-unification", "relation": "継承", "note": "信長・秀吉の統一事業を徳川氏が引き継ぎ完成させた"}, {"concept": "nanban-trade-and-christianity", "relation": "関連", "note": "禁教・貿易統制の強化が後の鎖国政策につながっていく"}, {"concept": "sakoku-policy", "relation": "継承", "note": "幕藩体制の対外関係管理として鎖国政策が完成する"}, {"concept": "thirty-years-war-and-westphalia", "relation": "同時代", "note": "ヨーロッパが宗教戦争で分裂する頃、日本は幕藩体制で統一秩序を完成させた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,日本,江戸幕府,幕藩体制", "lastUpdated": "2026-09-04"}, {"id": "english-revolution-to-glorious-revolution", "title": "清教徒革命と名誉革命", "domain": "世界史", "region": "ヨーロッパ", "headline": "国王を処刑し、また招いた末に議会主権を確立した", "startYear": 1642, "endYear": 1689, "eraLabel": "17世紀", "summary": "課税をめぐる国王と議会の対立から始まった清教徒革命(1642-49)はチャールズ1世の処刑と共和政(クロムウェルの護国卿政治)をもたらしたが長続きせず、王政復古を迎えた。1688年の名誉革命では議会がジェームズ2世を追放しオランダから新王を迎え、翌年の権利章典で「議会の同意なしに課税・立法できない」という立憲君主政の原則を確定させた。この結果イギリスは大陸の絶対王政とは異なる道を歩み、財政基盤の安定が18世紀の対外進出を支えた。", "regionCode": "GB", "lat": 51.5074, "lng": -0.1278, "factLevel": "定説", "body": [{"label": "清教徒革命と共和政の実験", "text": "議会派と王党派に分かれた内戦の末、1649年にチャールズ1世が処刑され共和政(コモンウェルス)が樹立されたが、クロムウェルの死後まもなく王政が復活した。", "source": "MulmoClaude"}, {"label": "名誉革命と権利章典", "text": "専制強化を図るジェームズ2世を議会が追放し、オランダ総督ウィリアム3世夫妻を新王として迎え入れた無血のクーデタ。翌1689年の権利章典が議会主権の原則を法文化した。", "source": "MulmoClaude"}, {"label": "なぜ「無血」だったか", "text": "議会・貴族・国教会がほぼ一致してジェームズ2世に反対し、軍の抵抗もほとんどなかったため大きな流血なしに政権交代が実現した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "french-absolutism-louis-xiv", "relation": "対比", "note": "王権を強化する大陸と、制限するイギリスという対照的な道"}, {"concept": "thirty-years-war-and-westphalia", "relation": "同時代", "note": "大陸が宗教戦争を戦う頃、イギリスは国内の王権対議会の争いに向かった"}, {"concept": "scientific-revolution", "relation": "関連", "note": "王立協会が名誉革命と同時代に知の制度化を進めた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,ヨーロッパ,イギリス,議会政治", "lastUpdated": "2026-09-04"}, {"id": "european-atlantic-facade-climate", "title": "西岸海洋性気候（偏西風と北大西洋海流）", "domain": "地理", "region": "ヨーロッパ", "headline": "高緯度なのに冬でも凍らない──暖流と偏西風がもたらす温和な西ヨーロッパ", "eraLabel": "地理単元", "summary": "西ヨーロッパは日本の北海道より高緯度にあるが、大西洋を渡ってくる偏西風と、暖流である北大西洋海流のおかげで冬の寒さがやわらぎ、年間を通じて雨が平均して降る（西岸海洋性気候）。夏は涼しく乾きすぎず、牧草と麦・じゃがいも・根菜がよく育ち、酪農と混合農業が発達した。東へ内陸に進むほど海の影響が弱まり、冬が寒く夏が暑い大陸性気候に変わる。この気候の東西勾配が、農業と人口分布の差になっている。", "regionCode": "IE", "lat": 53, "lng": -8, "factLevel": "定説", "body": [{"label": "暖流と偏西風", "text": "メキシコ湾流の続きが熱を運び、卓越する西風が海の温和さを陸に運ぶ。同緯度のカナダ東岸やサハリンよりずっと温暖。", "source": ""}, {"label": "平均した降水", "text": "まとまった乾季がなく、牧草地と冬麦に向く。地中海の『夏乾く』気候とは対照的。", "source": ""}, {"label": "東ほど大陸的", "text": "ロンドン→ベルリン→モスクワと東へ行くほど気温の年較差が大きくなり、栽培できる作物と農法が変わる。", "source": ""}], "relatedTopics": [{"concept": "mediterranean-world-geography", "relation": "対比", "note": "冬雨・夏乾燥の地中海と、一年中降る大西洋岸"}, {"concept": "monsoon-asia-rice-frontier", "relation": "対比", "note": "夏の季節風が農業を決めるアジアと、偏西風と暖流が決めるヨーロッパ"}, {"concept": "north-european-plain", "relation": "地理的背景", "note": "温和で湿った気候が平原の混合農業を支えた"}, {"concept": "japan-archipelago-geography", "relation": "対比", "note": "同じ中緯度の島国でも、夏に雨が集中する日本と一年中降る西欧"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ06)", "ref": "data/wiki/sources/rekishi-06-europe-geography.md", "date": "2026-09-03"}], "tags": "西岸海洋性気候, 偏西風, 北大西洋海流, メキシコ湾流, 混合農業, 大陸性気候", "lastUpdated": "2026-09-03"}, {"id": "european-integration-origins", "title": "ヨーロッパ統合の始まり", "domain": "世界史", "region": "ヨーロッパ", "startYear": 1951, "endYear": 1967, "eraLabel": "EU前史", "headline": "「もう戦争をしない」ための経済統合", "summary": "二度の世界大戦を引き起こした独仏対立を経済的に解消するため、1951年に石炭・鉄鋼という戦争の資源を共同管理する欧州石炭鉄鋼共同体（ECSC）が発足。これが発展して1967年に欧州共同体（EC）となり、後のEU（欧州連合）へつながる統合の出発点となった。", "factLevel": "定説", "body": [{"label": "発想の転換", "text": "石炭と鉄鋼は武器生産に不可欠な資源。これを国家間で共同管理すれば、そもそも独仏が互いに戦争の準備をすることが物理的に難しくなる、という逆転の発想がシューマン・プランの核心だった。"}, {"label": "参加国と発展", "text": "フランス・西ドイツ・イタリア・ベネルクス3国の6か国で始まり、経済統合（関税同盟・共通市場）を段階的に深め、1967年にEC（欧州共同体）として統合。後にイギリスなどが加わり拡大していった。"}, {"label": "戦後復興との関係", "text": "アメリカのマーシャル・プラン（欧州復興援助計画）による資金援助も統合の土台を後押しし、冷戦下で西側陣営の結束を固める狙いも重なっていた。"}], "relatedTopics": [{"concept": "world-war-two", "relation": "因果", "note": "二度と大戦を起こさないための制度的な仕掛けとして始まった"}, {"concept": "german-unification", "relation": "対比", "note": "武力で一つになった19世紀の統一とは逆に、統合は主権を譲り合う平和的な仕組み"}, {"concept": "cold-war", "relation": "同時代", "note": "西側陣営の結束を固める狙いも冷戦の文脈にあった"}]}, {"id": "european-peninsulas-and-seas", "title": "ヨーロッパの半島と海洋", "domain": "地理", "region": "ヨーロッパ", "headline": "大陸自体が『半島の半島』。海岸線が長く、内陸は海から遠くない", "eraLabel": "地理単元", "summary": "ヨーロッパはユーラシア大陸の西端に突き出た大きな半島で、さらにその先にイベリア・イタリア・バルカン・スカンディナヴィア・ユトランドといった半島が分岐する。地中海・黒海・バルト海・北海という付属海と、深く入り込んだ湾・フィヨルドのおかげで海岸線が極端に長く、大陸のどこも海からそう遠くない。この『海への近さ』が、漁業・海運・海軍、そして近代の海外進出の下地になった。", "regionCode": "DK", "lat": 56, "lng": 10, "factLevel": "定説", "body": [{"label": "海岸線の長さ", "text": "面積の割に海岸線が長く、多くの地域が港を持てた。半島・島が多いことは政治的分立（小国分立）の一因でもある。", "source": ""}, {"label": "付属海ごとの世界", "text": "バルト海（のちハンザ同盟）、北海、地中海と、それぞれに固有の交易圏が発達した。", "source": ""}, {"label": "大西洋への front", "text": "西縁が外洋に直接開くため、羅針盤と帆船技術が整うと大西洋航路へ最初に乗り出す位置にあった。", "source": ""}], "relatedTopics": [{"concept": "mediterranean-world-geography", "relation": "関連", "note": "付属海の一つ、地中海が最古の交易圏を育てた"}, {"concept": "japan-archipelago-geography", "relation": "対比", "note": "海に囲まれ分立しやすい点は日本列島と似るが、ヨーロッパは大陸と地続き"}, {"concept": "european-atlantic-facade-climate", "relation": "関連", "note": "外洋に開けた西縁が偏西風と暖流を受ける"}, {"concept": "aegean-bronze-age", "relation": "地理的背景", "note": "半島と島の海が最初期の海洋文明を生んだ"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ06)", "ref": "data/wiki/sources/rekishi-06-europe-geography.md", "date": "2026-09-03"}], "tags": "半島, 付属海, フィヨルド, バルト海, 北海, ハンザ同盟, 海岸線", "lastUpdated": "2026-09-03"}, {"id": "evolution-and-mass-extinctions", "title": "生物の大進化と大量絶滅", "domain": "地球・人類史", "region": "グローバル", "headline": "単純な細胞から多様な生命へ、幾度もの大量絶滅を越えて", "startYear": -541000000, "endYear": -66000000, "eraLabel": "古生代〜中生代", "summary": "約20億年前に細胞の中に核を持つ真核生物が現れ、約6億年前には多細胞生物が広がり始めた。約5億4100万年前の『カンブリア爆発』では、現在につながる動物の主要なグループがほぼ出そろい、目や殻を持つ生物が急増した。その後の地球史では、火山活動・気候変動・小天体の衝突などによる大量絶滅が生命の歴史を何度も塗り替えている。約2億5200万年前のペルム紀末には海洋生物の9割以上が絶滅し、約6600万年前には巨大隕石の衝突で恐竜を含む多くの生物種が姿を消した(K-Pg境界)。この絶滅が、恐竜に代わって哺乳類が多様化する道を開いた。", "regionCode": "", "factLevel": "定説", "body": [{"label": "カンブリア爆発", "text": "約5億4100万年前から、地質学的には短い期間のうちに、節足動物や脊索動物など現在の動物グループのほとんどが出そろった。眼や硬い殻の獲得が『見る・食べる・逃げる』の進化を加速させたとする説がある。", "source": ""}, {"label": "K-Pg境界の天体衝突", "text": "メキシコ・ユカタン半島に残る大きなクレーターは、直径10km級の小天体が衝突した跡とされる。まき上がった塵が太陽光を遮り、恐竜を含む多くの種が絶滅した。生き延びた小型の哺乳類や鳥類が、その後の世界を引き継いだ。", "source": ""}], "relatedTopics": [{"concept": "origin-of-life-on-earth", "relation": "継承", "note": "単細胞の生命が多細胞化し、多様化していく"}, {"concept": "human-evolution-and-out-of-africa", "relation": "継承", "note": "哺乳類の多様化の先に、やがて人類が現れる"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "地球・人類史レイヤー パイロット（最軽量実装）", "date": "2026-09-05"}], "tags": "カンブリア爆発, 大量絶滅, 恐竜, 哺乳類, ビッグヒストリー", "lastUpdated": "2026-09-05"}, {"id": "fertile-crescent", "title": "肥沃な三日月地帯", "domain": "地理", "region": "西アジア・中東", "headline": "ザグロス山麓から地中海岸へ弧を描く、麦と家畜のふるさと", "eraLabel": "地理単元", "summary": "肥沃な三日月地帯は、ペルシア湾岸からティグリス・ユーフラテス上流、シリア北部を通ってレヴァントの地中海岸へと弧（三日月）を描く一帯を指す考古学・地理の呼称。野生のムギ類とヤギ・ヒツジ・ウシ・ブタの原種がそろって分布し、約1万年前にここで農耕・牧畜が始まった（新石器革命）。山麓部は天水（雨）だけで麦が実る一方、南の沖積平野は灌漑が要る。この降水の差が、初期農村と後の都市文明の立地を分けた。", "regionCode": "IQ", "lat": 34, "lng": 40, "factLevel": "定説", "body": [{"label": "天水農業の北縁", "text": "弧の北側（丘陵）は年降水250mm以上で雨だけで農業ができる。最初の農村はこの帯に並んだ。", "source": ""}, {"label": "灌漑文明の南縁", "text": "弧の南端（メソポタミア沖積平野）は乾くが土地が肥え、灌漑で高い収量を得て都市が生まれた。", "source": ""}, {"label": "作物と家畜の出発点", "text": "ここで栽培化・家畜化された小麦・大麦・マメ類・ヒツジ・ヤギが、のちにヨーロッパ・インド・北アフリカへ広がった。", "source": ""}], "relatedTopics": [{"concept": "neolithic-revolution", "relation": "地理的背景", "note": "新石器革命が最初に起きた具体的な土地"}, {"concept": "mesopotamia-geography", "relation": "関連", "note": "三日月の南端が乾いた沖積平野"}, {"concept": "levant-geography", "relation": "関連", "note": "三日月の西端が地中海岸"}, {"concept": "mesopotamia-early-civilization", "relation": "因果", "note": "灌漑農業の余剰が南端で都市文明を生んだ"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ04)", "ref": "data/wiki/sources/rekishi-04-west-asia-geography.md", "date": "2026-09-03"}], "tags": "肥沃な三日月地帯, 天水農業, 灌漑, 新石器革命, 栽培化, 家畜化", "lastUpdated": "2026-09-03"}, {"id": "feudal-europe-and-papacy", "title": "封建ヨーロッパと教皇権の伸長", "domain": "世界史", "region": "ヨーロッパ", "headline": "王権が最も弱かった時代──主従の契約と荘園、そして教皇が皇帝の上に立つ", "startYear": 900, "endYear": 1200, "eraLabel": "10〜12世紀", "factLevel": "定説", "regionCode": "FR", "summary": "カロリング帝国の分裂とノルマン人・マジャール人・イスラーム勢力の侵入を背景に、西ヨーロッパでは封建制（土地＝封を介した主君と臣下の双務的な主従関係）と荘園制（領主が農奴を使う自給的な農業単位）が広がった。王権は名目的で、政治の実体は地方の諸侯・騎士が握った。一方で教会はクリュニー改革を進め、叙任権闘争（1075〜1122、カノッサの屈辱1077）を経て教皇権が皇帝権の上に立った。11〜12世紀は農業技術の普及で人口が増え、都市が復活し大開墾が進んだ『中世の成長期』でもある。", "body": [{"label": "封建制と荘園制", "text": "主君は臣下に封（土地）を与えて保護し、臣下は軍役と助言で応える。契約的な主従関係が幾重にも積み重なった。経済の基礎は荘園で、賦役と貢納で領主を支える農奴が人口の大半を占めた。", "source": "batch 11 直接生成"}, {"label": "叙任権闘争", "text": "聖職者の任命権をめぐり教皇グレゴリウス7世と皇帝ハインリヒ4世が対立。1077年、破門された皇帝が雪のカノッサで教皇に赦しを乞うた（カノッサの屈辱）。1122年のヴォルムス協約で妥協が成立し、教皇の優位が確立した。", "source": "batch 11 直接生成"}, {"label": "中世の成長期", "text": "重量有輪犂・三圃制・水車・馬の首輪の普及で農業生産が伸び、10〜13世紀に人口はほぼ倍増。森林の開墾、都市の再生、貨幣経済の復活が進んだ。", "source": "batch 11 直接生成"}, {"label": "普遍的権威としての教会", "text": "分権化した政治世界で、ラテン語・教会組織・巡礼路が西欧を一つの『キリスト教世界』としてまとめる役割を果たした。大学（ボローニャ・パリ）もこの枠内で生まれた。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "frankish-kingdom-carolingian", "relation": "因果", "note": "カロリング帝国の三分（843）と外敵侵入が分権化を決定づけた"}, {"concept": "crusades", "relation": "同時代", "note": "教皇権の絶頂が十字軍の号令を可能にした"}, {"concept": "insei-period", "relation": "対比", "note": "上皇＝家父長の権威／教皇＝宗教の権威が、本来の君主の上に立つ点で似た構図"}, {"concept": "north-european-plain", "relation": "地理的背景", "note": "障壁のない大平原が外敵の侵入路であり、大開墾のフロンティアでもあった"}, {"concept": "black-death", "relation": "因果", "note": "14世紀の人口激減が西欧で荘園制の解体と農奴解放を促した"}, {"concept": "reformation", "relation": "因果", "note": "教皇の普遍的権威への異議が西欧キリスト教世界を分裂させた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "中世,ヨーロッパ,封建制,教会,荘園", "lastUpdated": "2026-09-03"}, {"id": "first-sino-japanese-war", "title": "日清戦争", "domain": "日本史", "region": "東アジア", "headline": "朝鮮の宗主権をめぐる戦争は、近代化に勝る日本の勝利に終わった", "startYear": 1894, "endYear": 1895, "eraLabel": "明治中期", "summary": "朝鮮での農民反乱鎮圧をきっかけに1894年に開戦。黄海海戦・旅順占領などで日本が勝利し、1895年の下関条約で清は朝鮮の独立承認・遼東半島と台湾の割譲・賠償金支払いを受け入れた。伝統的な中華秩序(冊封体制)の終焉を告げ、日本が列強の一員として台頭する転機となった。", "regionCode": "JP", "lat": 33.95, "lng": 130.94, "factLevel": "定説", "body": [{"label": "開戦の経緯", "text": "朝鮮の甲午農民戦争(東学党の乱)鎮圧のため清・日双方が出兵したことが直接のきっかけとなり、1894年8月に開戦した。", "source": "MulmoClaude"}, {"label": "戦況と下関条約", "text": "黄海海戦で北洋艦隊を破り旅順・威海衛を制圧。1895年の下関条約で清は朝鮮独立の承認、遼東半島・台湾・澎湖諸島の割譲、賠償金支払いに応じた。", "source": "MulmoClaude"}, {"label": "三国干渉", "text": "ロシア・フランス・ドイツによる三国干渉で遼東半島は清に返還され、日本国内の対露感情を悪化させ日露戦争の伏線となった。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "meiji-constitution-and-modernization", "relation": "継承", "note": "近代化を終えた国力が勝利の基盤になった"}, {"concept": "qing-late-reform-and-decline", "relation": "因果", "note": "この敗北が変法運動を後押しし清の衰退を加速させた"}, {"concept": "korean-peninsula-geography", "relation": "地理的背景", "note": "大陸と列島をつなぐ回廊としての朝鮮半島の宗主権が争点となった"}, {"concept": "russo-japanese-war", "relation": "継承", "note": "三国干渉への屈辱感がロシアとの対立、そして日露戦争の伏線となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "日清戦争,下関条約,朝鮮,明治,東アジア", "lastUpdated": "2026-09-05"}, {"id": "formation-of-earth-and-solar-system", "title": "太陽系と地球の誕生", "domain": "地球・人類史", "region": "グローバル", "headline": "46億年前、ガスとちりの円盤から太陽と惑星が生まれた", "startYear": -4600000000, "endYear": -4000000000, "eraLabel": "太陽系形成期(冥王代)", "summary": "約46億年前、太陽系はガスとちりからなる円盤(原始太陽系円盤)から生まれた。中心に太陽が誕生し、残った物質が集まって微惑星となり、やがて地球を含む惑星ができた。誕生直後の地球はマグマの海に覆われた灼熱の天体で、隕石の衝突が続いた。有力な仮説(ジャイアント・インパクト説)では、火星ほどの原始惑星が地球に衝突し、飛び散った破片から月ができたとされる。地球はやがて冷えて地殻ができ、大気と海が形成された。", "regionCode": "", "factLevel": "有力説", "body": [{"label": "ジャイアント・インパクト説", "text": "月の起源として最も有力な仮説。火星サイズの原始惑星が地球に衝突し、飛び散った物質が集まって月ができたとする。月の岩石組成が地球のマントルと似ていることなどが根拠とされる。", "source": ""}, {"label": "海はいつできたか", "text": "冷えた地球の大気中の水蒸気が雨として降り注ぎ、原始海洋ができたのは誕生から数億年後、遅くとも約40億年前までには存在していたと考えられている。オーストラリアで見つかった最古級の鉱物(ジルコン)がその手がかりとされる。", "source": ""}], "relatedTopics": [{"concept": "big-bang-and-early-universe", "relation": "継承", "note": "銀河の中の一恒星系として太陽系が生まれた"}, {"concept": "origin-of-life-on-earth", "relation": "継承", "note": "冷えた地球に海ができ、生命の舞台が整った"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "地球・人類史レイヤー パイロット（最軽量実装）", "date": "2026-09-05"}], "tags": "太陽系, 地球誕生, ジャイアントインパクト, 原始海洋, ビッグヒストリー", "lastUpdated": "2026-09-05"}, {"id": "frankish-kingdom-carolingian", "title": "フランク王国とカロリング朝", "domain": "世界史", "region": "ヨーロッパ", "headline": "800年、西欧に『ローマ皇帝』が復活し、キリスト教世界が生まれた", "startYear": 751, "endYear": 843, "eraLabel": "8〜9世紀", "summary": "ゲルマン諸王国のうち最も長く続いたフランク王国で、8世紀に宮宰カール・マルテルが732年にイスラーム軍を撃退し、その子ピピンが751年にローマ教皇の承認を得て王位を簒奪した（カロリング朝）。ピピンはランゴバルドから奪った土地を教皇に寄進（教皇領の起源）。その子カール大帝は西ヨーロッパの大半を統一し、800年のクリスマスに教皇レオ3世からローマ皇帝の冠を受けた。西ローマ滅亡から300年、ローマ教会と結んだラテン・キリスト教世界の皇帝が誕生する。帝国は814年のカールの死後に分裂し、843年のヴェルダン条約で東・西・中フランクに三分された（ドイツ・フランス・イタリアの原型）。", "regionCode": "DE", "lat": 50.77, "lng": 6.08, "factLevel": "定説", "body": [{"label": "カールの戴冠（800年12月25日）", "text": "ローマのサン・ピエトロ大聖堂で教皇がカールに帝冠を授けた。西欧における『ローマ皇帝』の復活であり、教皇（宗教的権威）と皇帝（世俗的権力）が相互に承認し合う中世西欧の政治構造の出発点。ビザンツはこれを僭称とみなした。", "source": "batch 10 直接生成"}, {"label": "カロリング・ルネサンス", "text": "カールは各地の修道院・司教座に学校を置き、古典ラテン文献の写本収集を奨励。現存する古代ローマの文学作品の多くは、このとき作られたカロリング小文字体の写本を通じて伝わっている。", "source": "batch 10 直接生成"}, {"label": "ヴェルダン条約（843年）", "text": "カールの孫3人が帝国を分割。西フランク（→フランス）、東フランク（→ドイツ）、中フランク（イタリア＋ロレーヌ地方）。中フランクはさらに分解し、独仏の国境問題の遠い起源となった。", "source": "batch 10 直接生成"}, {"label": "地中海からの切断", "text": "アラブの征服で地中海南岸・東岸を失い、西欧は交易の海から切り離された。経済の重心が内陸の農村へ移り、土地を媒介とした主従関係（
