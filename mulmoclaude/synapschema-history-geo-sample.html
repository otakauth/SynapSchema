制下でフランスが台頭する条件が整った"}, {"concept": "english-revolution-to-glorious-revolution", "relation": "対比", "note": "同じ17世紀に王権を強めたフランスと、逆に制限したイギリス"}, {"concept": "genroku-culture", "relation": "同時代", "note": "ヴェルサイユの宮廷文化と江戸の元禄文化がほぼ同時期に花開いた"}, {"concept": "scientific-revolution", "relation": "関連", "note": "フランス科学アカデミーなど王権が学問を庇護した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,ヨーロッパ,絶対王政,フランス", "lastUpdated": "2026-09-04"}, {"id": "french-revolution", "title": "フランス革命", "domain": "世界史", "region": "ヨーロッパ", "headline": "「自由・平等・友愛」を掲げ、身分制の旧体制を覆した", "startYear": 1789, "endYear": 1799, "eraLabel": "18世紀末", "summary": "財政破綻に対応するため招集された三部会をきっかけに、1789年のバスティーユ牢獄襲撃で革命が始まった。人権宣言で封建的特権の廃止と人民主権を宣言し、1793年には国王ルイ16世が処刑され共和政に移行、ロベスピエールらによる恐怖政治も経験した。革命は身分制(アンシャン・レジーム)を法的に解体し、国民国家・国民軍という近代の枠組みを生み出したが、その急進化と混乱は後のナポレオンの台頭を招くことになる。", "regionCode": "FR", "lat": 48.8566, "lng": 2.3522, "factLevel": "定説", "body": [{"label": "財政危機から革命へ", "text": "度重なる対外戦争と宮廷浪費で破綻寸前だった王室財政の再建策として三部会が招集されたが、第三身分が国民議会を宣言し革命へ転化した。", "source": "MulmoClaude"}, {"label": "人権宣言と共和政", "text": "1789年の人権宣言は自由・平等・国民主権を謳い、1792年に王政を廃止して共和政(第一共和政)を樹立、翌年ルイ16世が処刑された。", "source": "MulmoClaude"}, {"label": "恐怖政治とその反動", "text": "対外戦争と内乱への対応としてロベスピエールらが恐怖政治(1793-94)を敷き数万人を処刑したが、テルミドールのクーデタで失脚し反動を招いた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "french-absolutism-louis-xiv", "relation": "因果", "note": "絶対王政期の対外戦争と宮廷浪費の蓄積が財政破綻を招いた"}, {"concept": "american-independence", "relation": "因果", "note": "独立戦争支援の戦費がフランス財政悪化に拍車をかけた"}, {"concept": "napoleonic-era", "relation": "継承", "note": "革命の混乱を収拾する形でナポレオンが台頭した"}, {"concept": "qing-decline-and-opium-war", "relation": "同時代", "note": "フランスが革命の混乱にある頃、清は乾隆帝末期の停滞が始まっていた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近代,フランス革命,ヨーロッパ", "lastUpdated": "2026-09-04"}, {"id": "fujiwara-regency", "title": "摂関政治と国風文化", "domain": "日本史", "region": "日本", "headline": "娘を天皇に嫁がせ、外祖父として実権を握る──藤原道長・頼通の全盛", "startYear": 894, "endYear": 1086, "eraLabel": "10〜11世紀（平安中期）", "factLevel": "定説", "regionCode": "26", "lat": 35.01, "lng": 135.77, "summary": "894年の遣唐使停止後、日本は輸入した大陸の制度を消化して独自化する『国風』の時代に入った。藤原氏北家は娘を天皇に嫁がせ、生まれた皇子を幼くして即位させ、自らは外祖父として摂政・関白の地位を独占して実権を握った。11世紀前半の藤原道長・頼通父子が全盛で、平等院鳳凰堂がその象徴。仮名文字が確立し『源氏物語』『枕草子』などの国風文化が花開いた。地方では律令の土地公有が崩れ、荘園の拡大と受領による徴税請負が進んだ。", "body": [{"label": "摂関政治のしくみ", "text": "天皇が幼少なら摂政、成人後は関白として、藤原氏の氏長者が政務を代行・後見した。天皇の外戚（母方の祖父・伯父）という私的な地位が、公的権力の源泉になった。", "source": "batch 11 直接生成"}, {"label": "道長・頼通の全盛", "text": "道長は4人の娘を中宮・皇太子妃とし『この世をば我が世とぞ思ふ』と詠んだ。子の頼通は約50年間摂関を務め、末法初年とされた1052年の翌年に平等院鳳凰堂を建てた。", "source": "batch 11 直接生成"}, {"label": "国風文化", "text": "仮名文字の成立で、紫式部『源氏物語』、清少納言『枕草子』、紀貫之ら『古今和歌集』が生まれた。寝殿造、大和絵、浄土教（空也・源信『往生要集』）も特徴。", "source": "batch 11 直接生成"}, {"label": "地方の変質", "text": "班田制が機能を停止し、有力農民（田堵）や開発領主が土地を集積。国司の最上席（受領）が徴税を請け負い、私腹を肥やした。寄進地系荘園が広がり、公領との二本立てになった。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "heian-early-period", "relation": "継承", "note": "遣唐使停止（894）を境に、輸入期から国風化の摂関期へ"}, {"concept": "insei-period", "relation": "因果", "note": "藤原氏を外戚としない天皇の登場が院政への転換点"}, {"concept": "song-dynasty", "relation": "対比", "note": "宋は科挙の能力主義官僚制、日本は家柄（摂関家）による世襲へ"}, {"concept": "japan-archipelago-geography", "relation": "地理的背景", "note": "都は内陸の京、地方支配は受領任せで、分権の素地が育った"}, {"concept": "kyoto-monuments", "relation": "具体例", "note": "平等院鳳凰堂（宇治）は摂関期・浄土教の建築として構成資産に含まれる"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "平安,摂関政治,藤原氏,国風文化,荘園", "lastUpdated": "2026-09-03"}, {"id": "galapagos", "title": "ガラパゴス諸島", "domain": "地理", "region": "南北アメリカ", "headline": "ガラパゴス＝ダーウィンに進化論を着想させた『生きた実験室』", "summary": "南米大陸から約1000km離れた太平洋上の火山群島。海流と孤立の結果、ゾウガメ、ウミイグアナ、ダーウィンフィンチなどの固有種が独自に進化した。1835年にチャールズ・ダーウィンが訪れ、自然選択説の着想を得た。1978年、記念すべき世界遺産『第1号』12件のうちの1件として登録された。", "isWorldHeritage": true, "re 5.5023, "factLevel": "定説", "body": [{"label": "経済成長と町人の台頭", "text": "新田開発による石高増加と貨幣経済・流通の発達により、京都・大坂の町人層が経済力を蓄え、文化の担い手として台頭した。", "source": "MulmoClaude"}, {"label": "文学・演劇・美術の担い手", "text": "井原西鶴が町人の恋愛・金銭欲を描く浮世草子を、近松門左衛門が義理と人情の人形浄瑠璃を、松尾芭蕉が『奥の細道』などで俳諧を芸術の域に高めた。尾形光琳は装飾的な琳派絵画を大成した。", "source": "MulmoClaude"}, {"label": "「武」から「町人文化」への転換", "text": "戦国時代までの武家中心の文化と異なり、経済力を持つ庶民(町人)の生活感情や娯楽が文化の中心的なテーマとなった点が画期的だった。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "sakoku-policy", "relation": "因果", "note": "管理された対外関係のもとでの内政の安定が経済成長を支えた"}, {"concept": "french-absolutism-louis-xiv", "relation": "同時代", "note": "ヴェルサイユの宮廷文化と元禄の町人文化がほぼ同時期に花開いた"}, {"concept": "scientific-revolution", "relation": "対比", "note": "ヨーロッパが自然科学を発展させた同時期、日本は町人文化を花開かせた"}, {"concept": "kyoto-monuments", "relation": "地理的背景", "note": "元禄文化の中心地の一つである京都の寺社・町並みが舞台となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,日本,元禄文化,江戸時代", "lastUpdated": "2026-09-04"}, {"id": "german-unification", "title": "ドイツ統一", "domain": "世界史", "region": "ヨーロッパ", "headline": "鉄と血の宰相ビスマルクが、3つの戦争でドイツ帝国を作り上げた", "startYear": 1864, "endYear": 1871, "eraLabel": "19世紀後半", "summary": "プロイセン宰相ビスマルクは、デンマーク戦争・普墺戦争・普仏戦争という3つの戦争を巧みな外交で勝ち抜き、1871年ヴェルサイユ宮殿でドイツ帝国の成立を宣言した。統一は議会の理想論ではなく「上から」軍事力によって達成された。関税同盟による経済統合が下地を作っていた。同時期に近代国家建設を進めていた明治日本と構造的に似ている。", "regionCode": "DE", "lat": 52.52, "lng": 13.405, "factLevel": "定説", "body": [{"label": "3つの戦争", "text": "デンマーク戦争(1864)→普墺戦争(1866、7週間戦争)→普仏戦争(1870-71)と、ビスマルクは敵を各個撃破し孤立させる外交を駆使した。", "source": "MulmoClaude"}, {"label": "帝国宣言", "text": "1871年1月18日、占領下のヴェルサイユ宮殿・鏡の間でプロイセン王ヴィルヘルム1世がドイツ皇帝に即位。敗れたフランスにとって屈辱の場所での宣言となった。", "source": "MulmoClaude"}, {"label": "「上から」の統一", "text": "1848年革命(自由主義者による議会統一の試み)が失敗した後、軍事力と外交による現実政治(レアルポリティーク)で統一が達成された。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "italian-unification", "relation": "同時代", "note": "ほぼ同時期に外交と武力で分裂国家を統一した「後発国家形成」の並走事例"}, {"concept": "meiji-restoration", "relation": "同時代", "note": "旧体制解体と近代国家建設が同じ19世紀後半に世界各地で進行した一例"}, {"concept": "us-civil-war-and-reconstruction", "relation": "同時代", "note": "国家統一・再編を武力で決着させた点で並行する"}, {"concept": "industrial-revolution", "relation": "因果", "note": "工業化による国力・軍事力の向上が統一戦争を可能にした"}, {"concept": "scramble-for-africa", "relation": "因果", "note": "統一後のドイツが「遅れてきた帝国」として植民地獲得競争に参入する動機になった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "帝国主義,国民国家,近代,ヨーロッパ,ビスマルク", "lastUpdated": "2026-09-05"}, {"id": "germanic-migration-and-western-rome-fall", "title": "ゲルマン諸族の大移動と西ローマ帝国の滅亡", "domain": "世界史", "region": "ヨーロッパ", "headline": "フン人に押されたゲルマン諸族の移動が、西ローマ帝国を内側から溶かした", "startYear": 375, "endYear": 476, "eraLabel": "4世紀後半〜5世紀", "summary": "375年、フン人の西進に押された西ゴート族がドナウ川を越えてローマ領内へ移住したのが大移動の始まり。378年アドリアノープルの戦いでローマ軍が大敗し、以後ローマは諸族を『同盟部族』として取り込むうち軍の中核をゲルマン人が占めた。410年に西ゴートがローマ市を略奪、5世紀前半にヴァンダル（北アフリカ）・フランク（ガリア北部）・東ゴート（イタリア）らが帝国領内に王国を建てた。476年、ゲルマン人傭兵隊長オドアケルが幼帝ロムルス・アウグストゥルスを廃し、西ローマ皇帝位そのものが消滅した。東ローマは存続した。", "regionCode": "IT", "lat": 41.9, "lng": 12.5, "factLevel": "定説", "body": [{"label": "引き金はフン人", "text": "中央アジア由来の遊牧民フン人が4世紀後半に黒海北岸へ進出し、東ゴートを征服、西ゴートを圧迫した。フン人はアッティラ王のもと451年にガリアへ侵入するがカタラウヌムの戦いで阻まれ、453年のアッティラ急死で勢力は瓦解した。", "source": "詳説世界史"}, {"label": "帝国領内に建つゲルマン諸王国", "text": "西ゴート（イベリア）、ヴァンダル（北アフリカ）、フランク（ガリア北部）、ブルグント（ガリア東部）、東ゴート（イタリア）。多くは形式上ローマ皇帝の承認を受け、ローマの官僚制・ラテン語・キリスト教を引き継いだため、断絶より連続の面も大きい。", "source": "岩波講座 世界歴史"}, {"label": "476年の意味", "text": "同時代人には決定的事件と映らなかった。オドアケルは西の帝位記章を東ローマ皇帝に送り名目上の統一を演出。『西ヨーロッパにローマ皇帝がいない世界』に入ったことが、のちに古代の終わりとされた。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "roman-principate", "relation": "継承", "note": "3世紀の危機で弱った帝国の西半分が崩れた"}, {"concept": "eastern-roman-empire", "relation": "対比", "note": "東は存続し、西だけが消えた"}, {"concept": "parthia-and-sasanian", "relation": "関連", "note": "ローマを東西から挟んだ外圧のうち西の圧力"}, {"concept": "silk-road-trade", "relation": "関連", "note": "フン人＝匈奴とみる説。ユー _Necropolis.jpg", "imageCredit": "KennyOMG / CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Pyramids_of_the_Giza_Necropolis.jpg"}, {"id": "great-barrier-reef", "title": "グレート・バリア・リーフ", "domain": "地理", "region": "オセアニア", "headline": "グレート・バリア・リーフ＝宇宙から見える唯一の『生物が造った構造物』", "summary": "オーストラリア北東岸に約2300kmにわたって連なる世界最大のサンゴ礁。約400種のサンゴ、1500種の魚、ジュゴンやウミガメが生きる。自然遺産の4基準すべてを満たす数少ない物件。近年は海水温の上昇による大規模な白化（ブリーチング）が繰り返し発生し、生態系の危機が指摘されている。", "isWorldHeritage": true, "relatedTopics": [{"concept": "galapagos", "relation": "類似", "note": "種の進化を今も観察できる海洋自然遺産"}, {"concept": "yellowstone", "relation": "関連", "note": "自然遺産保護の国際的モデル"}, {"concept": "danger-list", "relation": "因果", "note": "気候変動を理由とする危機遺産勧告"}, {"concept": "registration-criteria", "relation": "テーマ"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "サンゴ礁, 生物多様性, 気候変動, 世界遺産", "lastUpdated": "2026-09-03", "regionCode": "AU", "lat": -18.29, "lng": 147.7, "body": [{"label": "気候変動の最前線", "text": "2016年以降、数年おきに大規模白化。UNESCOは危機遺産リスト入りを再三勧告してきたが、豪州政府の働きかけで見送られてきた経緯がある。", "source": "パイロット"}, {"label": "『進行中のプロセス』を守る難しさ", "text": "個々の建造物と違い、実質的な保全対象が地球規模の気候そのもの。世界遺産条約が気候変動に対して非力である現実を象徴する。", "source": "パイロット"}], "country": "オーストラリア", "whType": "自然遺産", "inscriptionYear": 1981, "whCriteria": "vii, viii, ix, x", "whStatus": "登録", "ouv": "(vii)極めて優れた自然美、(viii)地球の歴史の記録、(ix)進行中の生態学的・生物学的過程、(x)生物多様性の宝庫。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/ISS-45_StoryOfWater%2C_Great_Barrier_Reef%2C_Australia.jpg/960px-ISS-45_StoryOfWater%2C_Great_Barrier_Reef%2C_Australia.jpg", "imageCredit": "NASA / Kjell Lindgren（パブリックドメイン）", "imageLink": "https://commons.wikimedia.org/wiki/File:ISS-45_StoryOfWater,_Great_Barrier_Reef,_Australia.jpg"}, {"id": "great-depression", "title": "世界恐慌", "domain": "世界史", "region": "グローバル", "headline": "ウォール街の株価暴落が世界を巡り、「持てる国」と「持たざる国」の格差を決定的にした", "startYear": 1929, "endYear": 1939, "eraLabel": "1930年代", "summary": "1929年10月24日の「暗黒の木曜日」のニューヨーク株価大暴落を発端に、世界的な大不況が始まった。各国はブロック経済で自国円を囲い込み、植民地を持たない「持たざる国」(独・伊・日)との格差が決定的になった。アメリカはニューディール政策で対応した。", "regionCode": "US", "lat": 40.7128, "lng": -74.006, "factLevel": "定説", "body": [{"label": "暗黒の木曜日", "text": "1929年10月24日、ニューヨーク証券取引所で株価が大暴落し、銀行の連鎖崩壊と失業の急増（最大で約25％）が世界に波及した。", "source": "MulmoClaude"}, {"label": "ブロック経済", "text": "英・仏は広大な植民地で自国の通貨圏を囲い込めたが、植民地を持たない独・伊・日は市場も資源も乏しく、悪循環に陥った。", "source": "MulmoClaude"}, {"label": "ニューディール政策", "text": "ローズヴェルト大統領は公共事業・社会保障による政府主導の需要創出で対応し、金本位制を離脱しドル安を進めた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "rise-of-fascism-and-nazism", "relation": "因果", "note": "大量失業を背景にナチスの支持が急拡大した"}, {"concept": "showa-militarism-and-manchurian-incident", "relation": "因果", "note": "日本でも深刻な不況が満州事変への突破口を求める動きを後押しした"}, {"concept": "russian-revolution", "relation": "対比", "note": "資本主義側の危機を尻目にしてソ連の計画経済の優位性が一時注目された"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 19 直接生成 / rekishi-19-age-of-total-war.md", "date": "2026-09-05"}], "tags": "世界恐慌,ウォール街,ブロック経済,ニューディール", "lastUpdated": "2026-09-05"}, {"id": "great-wall-of-china", "title": "万里の長城", "domain": "世界史", "region": "東アジア", "headline": "万里の長城＝2000年かけて継ぎ足された『農耕世界と遊牧世界の境界線』そのもの", "summary": "農耕世界と遊牧世界の境界に、秦から明まで歴代王朝が築き足した城壁の総体。単一の構造物ではなく、総延長2万kmを超える城壁・望楼・関所のネットワーク。観光地になっている堅固な磚（せんが）積みの壁の大部分は16世紀の明代のもの。人類最大の軍事建造物であると同時に、東アジアの『内と外』を地表に引いた線でもある。", "isWorldHeritage": true, "relatedTopics": [{"concept": "giza-pyramids", "relation": "対比", "note": "国家が総力を挙げた巨大構造物どうし"}, {"concept": "registration-criteria", "relation": "テーマ"}, {"concept": "outstanding-universal-value", "relation": "テーマ"}, {"concept": "qin-unification", "relation": "因果", "note": "始皇帝が戦国諸国の長城をつなげたのが『万里の長城』の起点"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "地理的背景", "note": "年降水量400mmの農牧境界線に沿って築かれた"}, {"concept": "yuan-dynasty", "relation": "テーマ", "note": "モンゴルは長城を越えて中国を支配した。現存の石積みの長城は、元を退けた明がモンゴル再来に備えて大改修したもの"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "巨大構造物, 中国, 防御施設, 世界遺産", "lastUpdated": "2026-09-03", "startYear": -220, "endYear": 1600, "eraLabel": "秦〜明", "regionCode": "CN", "lat": 40.356, "lng": 116.008, "body": [{"label": "『ひとつの壁』ではない", "text": "『万里の長城』は固有名詞ではなく歴代の長城の総称で、ルートも時代ごとに大きく違う。秦の長城と明の長城は別物と考えてよい。", "source": "パイロット"}, {"label": "明代の再建", "text": "モンゴル（北元）への防衛のため、明が磚積みの堅固な壁に造り替えた。八達嶺・慕田峪など整備された区間はこの明長城。", "source": "パイロット"}, {"label": "広すぎて守れない", "text": "全長が膨大で、無管理区間の風化・盗掘・開発が慢性的な脅威。保全対象をどう区切るかが世界遺産としての難題。", "source": "パイロット"}], "country": "中国", "whType": "文化遺産", "inscriptionYear": 1987, "whCriteria": "i, ii, iii, iv, vi", "whStatus": "登録", "ouv": "(i)人類の創造的才能を示す傑作、(ii)長期にわたる価値観の交流、(iii)中華文明の証拠、(iv)防御建築技術の集大成、(vi)中国の歴史と文学に深く結びつく。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/The_Great_Wall_of_China_at_Jinshanling-edit.jpg/960px-The_Great_Wall_of_China_at_Jinshanling-edit.jpg", "imageCredit": "Severin.stalder / CC BY-SA 3.0", "imageLink": "https://commons.wikimedia.org/wiki/File:The_Great_Wall_of_China_at_Jinshanling-edit.jpg"}, {"id": "greco-persian-wars", "title": "ペルシア戦争", "domain": "世界史", "region": "ヨーロッパ", "headline": "小国連合のギリシアが大帝国ペルシアを退けた、前5世紀初めの防衛戦", "startYear": -499, "endYear": -449, "eraLabel": "前5世紀前半", "summary": "イオニア（アナトリア西岸）のギリシア人植民市の反乱をきっかけに、アケメネス朝ペルシアが前492年以降ギリシア本土へ遠征した。前490年のマラトンの戦いでアテネが、前480年のサラミスの海戦で連合艦隊が、前479年のプラタイアの戦いで陸軍がペルシアを破り、侵攻を退けた。勝利はアテネの海軍力と自信を高め、以後アテネはデロス同盟の盟主として『帝国』化していく。東西の世界が正面から衝突した最初の大事件とされる。", "factLevel": "定説", "body": [{"label": "サラミスの逆転", "text": "テミストクレスの主導でアテネは国庫をつぎ込み三段櫂船を建造。狭い海峡に大艦隊を誘い込んで撃破し、制海権が戦争を決めることを示した。", "source": ""}, {"label": "勝利の代償", "text": "防衛のためのデロス同盟の資金と艦隊をアテネが握り、同盟は次第にアテネの支配網に変わった。これがのちのペロポネソス戦争の火種になる。", "source": ""}, {"label": "東西衝突の記憶", "text": "ヘロドトスは『歴史』でこの戦争を「自由な市民」対「専制の帝国」として描き、後世のヨーロッパの自己像に長く影響した。", "source": "ヘロドトス『歴史』"}], "relatedTopics": [{"concept": "achaemenid-persia", "relation": "因果", "note": "イオニア反乱への懲罰遠征が発端"}, {"concept": "sparta-and-athens", "relation": "関連", "note": "スパルタの陸軍とアテネの海軍が共同で防いだ"}, {"concept": "greek-classical-age", "relation": "因果", "note": "勝利がアテネ黄金時代の起点になった"}, {"concept": "anatolia-geography", "relation": "地理的背景", "note": "発端のイオニア諸市はアナトリア西岸にあった"}, {"concept": "yayoi-period", "relation": "同時代", "note": "前5世紀、日本は弥生時代で水田稲作が各地に広がる時期"}, {"concept": "acropolis-athens", "relation": "具体例", "note": "戦争で破壊された神殿の再建がパルテノン"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ05)", "ref": "data/wiki/sources/rekishi-05-classical-antiquity.md", "date": "2026-09-03"}], "tags": "ペルシア戦争, マラトン, サラミス, テミストクレス, デロス同盟, ヘロドトス", "lastUpdated": "2026-09-03"}, {"id": "greek-classical-age", "title": "ギリシア古典期（アテネの黄金時代）", "domain": "世界史", "region": "ヨーロッパ", "headline": "ペルシア戦争の勝利からポリス衰退まで、民主政と哲学が花開いた1世紀半", "startYear": -479, "endYear": -323, "eraLabel": "前5〜前4世紀", "summary": "ペルシア戦争後、アテネはペリクレスの下で直接民主政を完成させ、成年男性市民が民会と抽選の役職で国政を担った（女性・在留外人・奴隷は除外）。パルテノン神殿の再建、悲劇・喜劇、ソクラテス以下の哲学、実証的な歴史叙述など文化が集中的に開花した。一方でアテネとスパルタの覇権争いがペロポネソス戦争（前431〜前404）を招き、アテネは敗北。以後ポリスは相互抗争で疲弊し、前4世紀後半に北方のマケドニアに従属した。", "factLevel": "定説", "body": [{"label": "アテネ民主政の仕組み", "text": "民会が最高機関で、評議会（500人）と陪審員は抽選、任期1年・再任制限つき。報酬制で貧しい市民も参加できたが、市民権は血統で厳しく限られた。", "source": ""}, {"label": "ペロポネソス戦争", "text": "海のアテネ（デロス同盟）対陸のスパルタ（ペロポネソス同盟）の総力戦。疫病でペリクレスを失い、シチリア遠征の壊滅を経て、ペルシアの資金を得たスパルタに屈した。", "source": "トゥキュディデス『戦史』"}, {"label": "知の遺産", "text": "悲劇三大詩人、トゥキュディデスの実証的歴史、ソクラテス・プラトン・アリストテレスの哲学が、この混乱期にむしろ深まった。", "source": ""}], "relatedTopics": [{"concept": "greco-persian-wars", "relation": "因果", "note": "戦争の勝利が黄金時代の起点"}, {"concept": "sparta-and-athens", "relation": "継承", "note": "両ポリスの対照が古典期の覇権争いとして噪き出した"}, {"concept": "greek-polis-formation", "relation": "継承", "note": "前8〜前6世紀のポリス形成の到達点"}, {"concept": "alexander-eastern-campaign", "relation": "因果", "note": "ポリスの疲弊がマケドニア台頭の余地を作った"}, {"concept": "confucius-hundred-schools", "relation": "同時代", "note": "同じ頃、中国でも乱世を背景に諸子百家が思索を深めた"}, {"concept": "acropolis-athens", "relation": "具体例", "note": "黄金期アテネが丘の上に残した神殿群"}, {"concept": "renaissance", "relation": "継承", "note": "古典期の文芸・哲学が15〜16世紀の復興の規範となった"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ05)", "ref": "data/wiki/sources/rekishi-05-classical-antiquity.md", "date": "2026-09-03"}], "tags": "ギリシア古典期, ペリクレス, アテネ民主政, パルテノン, ペロポネソス戦争, ソクラテス", "lastUpdated": "2026-09-03"}, {"id": "greek-polis-formation", "title": "ギリシアのポリス形成", "domain": "世界史", "region": "ヨーロッパ", "headline": "暗黒時代のあと、丘のふもとに集まり住んで生まれた市民の共同体", "startYear": -800, "endYear": -500, "eraLabel": "前8〜前6世紀", "summary": "ミュケナイ文明崩壊後の暗黒時代に人口が減り文字も失われたが、前8世紀ごろから回復し、人々が丘（アクロポリス）のふもとに集まり住む集住（シノイキスモス）が進んでポリス（都市国家）が生まれた。中心の広場アゴラで成年男子市民が政治・軍事・祭祀を共同で担った。人口増と土地不足から市民団は地中海・黒海沿岸に多数の植民市を築いた。フェニキア文字に母音を加えたギリシア文字が普及し、オリンピアの祭典など「ギリシア人」という共通意識も育った。", "regionCode": "GR", "lat": 39, "lng": 22.5, "factLevel": "定説", "body": [{"label": "市民という単位", "text": "王や神官ではなく、武具を自弁して密集隊（ファランクス）で戦う中小農民が政治の主体になった。戦力の担い手＝政治の担い手という結びつきが、のちの民主政の芽になる。", "source": ""}, {"label": "植民と交易", "text": "前8〜前6世紀に南イタリア・シチリア・黒海沿岸へ植民市が広がり、穀物と工芸品の交易網ができた。マルセイユ（マッサリア）もこの時の植民市。", "source": ""}], "relatedTopics": [{"concept": "aegean-bronze-age", "relation": "継承", "note": "ミュケナイ崩壊と暗黒時代を経て、まったく新しい政治体が現れた"}, {"concept": "sparta-and-athens", "relation": "関連", "note": "同じポリスから対照的な二つの型が育った"}, {"concept": "birth-of-writing", "relation": "継承", "note": "フェニキア文字を借り、母音つきのアルファベットに改良した"}, {"concept": "hellenistic-world", "relation": "継承", "note": "ポリスの文化が東方へ広がりヘレニズムになる"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ03)", "ref": "data/wiki/sources/rekishi-03-orient-and-polis.md", "date": "2026-09-03"}], "tags": "ポリス, シノイキスモス, アゴラ, 植民市, ギリシア文字, ファランクス", "lastUpdated": "2026-09-03"}, {"id": "gupta-empire", "title": "グプタ朝", "domain": "世界史", "region": "南・東南アジア", "headline": "『インド古典文化の黄金時代』──ゼロの概念とヒンドゥー教が形を整えた", "startYear": 320, "endYear": 550, "eraLabel": "4〜6世紀", "summary": "320年頃、チャンドラグプタ1世がガンジス流域のマガダで即位して建国。孫のチャンドラグプタ2世（在位380頃〜415頃）の時代に北インドの大半を支配下に置いたが、征服地の王を存続させる緩やかな連合型の統治だった。この時期にサンスクリット文学（カーリダーサ）、天文学・数学（アーリヤバタ、十進法の位取り記数法と『ゼロ』の体系化）、アジャンター石窟の壁画が花開いた。バラモン教が民間信仰を取り込みヒンドゥー教として定着する一方、仏教は勢いを失っていく。5世紀後半から中央アジアのエフタル（白フン）の侵入で衰え、6世紀半ばに崩壊した。", "regionCode": "IN", "lat": 25.61, "lng": 85.14, "factLevel": "定説", "body": [{"label": "ゆるやかな統一", "text": "マウリヤ朝のような官僚的中央集権ではなく、征服地の王を存続させる封建的な支配。だからこそ文化の地方的多様性が保たれた。", "source": "詳説世界史"}, {"label": "数学と天文学", "text": "十進法の位取りと『ゼロ』を記号・概念として扱う体系はこの時期のインドで確立し、後にイスラーム世界を経てヨーロッパへ伝わり『アラビア数字』となった。", "source": "岩波講座 世界歴史"}, {"label": "ヒンドゥー教の成立", "text": "『マヌ法典』の整備、ヴィシュヌ・シヴァ信仰、バクティ（信愛）。カースト（ヴァルナ・ジャーティ）秩序が社会に根を下ろした。", "source": "詳説世界史"}, {"label": "東アジアとの接点", "text": "東晋の僧・法顕が5世紀初めにグプタ朝下のインドを訪れ『仏国記』を残した。仏教はこの頃から中国・朝鮮・倭へと東漸していく。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "maurya-empire", "relation": "対比", "note": "同じマガダ発祥だが、こちらは緩やかな連合型の統一"}, {"concept": "kushan-empire", "relation": "継承", "note": "クシャーナ衰退後の北インドを再統合した"}, {"concept": "buddhism-jainism-birth", "relation": "関連", "note": "仏教が衰退へ向かい、ヒンドゥー教が主流になった"}, {"concept": "wei-jin-southern-northern-dynasties", "relation": "同時代", "note": "法顕が東晋からグプタ朝インドへ求法の旅をした"}, {"concept": "buddhism-official-transmission-japan", "relation": "因果", "note": "グプタ期に東漸を強めた仏教が最終的に列島へ届く"}, {"concept": "silk-road-trade", "relation": "関連", "note": "海路（インド洋）交易でも栄えた"}, {"concept": "delhi-sultanate", "relation": "対比", "note": "のちヒンドゥー社会の上に少数のムスリム支配層が乗る構造へ変わる"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 08 直接生成 / rekishi-08-late-antiquity-to-early-medieval.md", "date": "2026-09-03"}], "tags": "グプタ朝 チャンドラグプタ2世 カーリダーサ アーリヤバタ ゼロ ヒンドゥー教 マヌ法典 法顕 エフタル アジャンター", "lastUpdated": "2026-09-03"}, {"id": "han-empire", "title": "漢帝国（前漢）", "domain": "世界史", "region": "東アジア", "headline": "秦の枠組みに儒教の衣を着せ、400年続く『中国』の型を作った", "startYear": -202, "endYear": 8, "eraLabel": "前2世紀〜後1世紀初頭", "summary": "劉邦（高祖）が項羽を破り前202年に建てた漢は、秦の郡県制を引き継ぎつつ当初は一部に諸侯王を置く郡国制をとった。武帝（在位前141〜前87）の時に中央集権を強め、儒教を官学とし、匈奴へ大規模に反撃し、張騫を西域に派遣して交易路（のちのシルクロード）を開いた。塩・鉄の専売など財政策も進めた。官吏登用や暦・文書行政が整い、『漢』は民族・文字・王朝の呼び名として定着した。前1世紀末に外戚の王莽が帝位を奪い前漢は途切れる。", "factLevel": "定説", "body": [{"label": "郡国制から中央集権へ", "text": "建国時の諸侯王は呉楚七国の乱を経て力を削がれ、武帝期に実質郡県制へ回帰した。", "source": ""}, {"label": "儒教の国教化", "text": "董仲舒の建議で儒学が官学となり、経書の知識が官僚の資格になった。法家的な統治実務を儒教の理念で覆う『外儒内法』の型ができた。", "source": ""}, {"label": "西域への道", "text": "対匈奴で月氏との同盟を求めた張騫の旅が、中央アジア経由の東西交易と情報の路を開いた。", "source": "『史記』"}], "relatedTopics": [{"concept": "qin-unification", "relation": "継承", "note": "郡県制と統一制度を受け継いだ"}, {"concept": "confucius-hundred-schools", "relation": "継承", "note": "諸子百家の一つだった儒家が国家の学になった"}, {"concept": "achaemenid-persia", "relation": "対比", "note": "多民族を州制と幹線道路で束ねる帝国の東アジア版"}, {"concept": "wa-in-chinese-records", "relation": "因果", "note": "漢の冊封体制の中で倭の小国が朝貢し記録に現れた"}, {"concept": "hellenistic-world", "relation": "同時代", "note": "張騫が西域に達した頃、西方ではヘレニズム諸国をローマが併合しつつあった"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ05)", "ref": "data/wiki/sources/rekishi-05-classical-antiquity.md", "date": "2026-09-03"}], "tags": "前漢, 劉邦, 武帝, 儒教の国教化, 張騫, 郡国制, 塩鉄専売", "lastUpdated": "2026-09-03"}, {"id": "heian-early-period", "title": "平安京遷都と平安初期", "domain": "日本史", "region": "日本", "headline": "平安京遷都と遣唐使停止 ― 大陸の輸入期が終わり、国風化へ", "startYear": 784, "endYear": 894, "eraLabel": "平安時代初期", "summary": "桓武天皇は奈良の寺院勢力と旧来の貴族から離れるため、784年に長岡京、794年に平安京（京都）へ遷都した。同時に東北の蝦夷との戦争を進め、坂上田村麻呂が802年に胆沢地方を制圧する。行政では班田の間隔を延ばし、軍団・防人を廃して健児制へ切り替えるなど、律令の負担を実態に合わせて手直しした。9世紀初め、最澄が天台宗、空海が真言宗を開き、山にこもる新しい仏教が貴族の信仰を集めた。9世紀後半に藤原氏が天皇の外戚として実権を握り始め、894年には菅原道真の建議で遣唐使が停止される。大陸の制度を輸入する段階が終わり、それを日本の実情に合わせて作り替える国風化の時代へ移る。", "regionCode": "26", "lat": 35.01, "lng": 135.77, "factLevel": "定説", "body": [{"label": "平安京遷都（794年）", "text": "桓武天皇は仏教勢力の強い平城京を捨て、まず長岡京（784）へ、造営の混乱と怨霊への恐れからさらに平安京（794）へ。以後1000年以上、京都が都であり続けた。", "source": "batch 10 直接生成"}, {"label": "蝦夷征討", "text": "東北の蝦夷を支配下に置くため大規模な遠征を繰り返し、789年には手痛い敗北も喫した。797年に坂上田村麻呂を征夷大将軍に任じ、802年に胆沢城、803年に志波城を築いて支配を北へ広げた。", "source": "batch 10 直接生成"}, {"label": "律令の手直し（軍事）", "text": "農民徴兵の軍団・防人を廃止し、郡司の子弟から選ぶ少数精鋭の健児制に転換。負担軽減と実効性の両立をはかった、律令の現実化の一例。", "source": "batch 10 直接生成"}, {"label": "新しい仏教と遣唐使停止", "text": "804年の遣唐使で渡った最澄・空海が天台宗（比叡山）・真言宗（高野山）をもたらし、密教と山林修行が貴族に広まった。894年、菅原道真は唐の衰退と渡航の危険を理由に遣唐使停止を建議。制度輸入の時代が終わる。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "nara-period", "relation": "継承", "note": "律令体制を引き継ぎつつ、寺院勢力から距離を置いて再出発"}, {"concept": "tang-dynasty", "relation": "因果", "note": "894年、唐の衰退を理由に遣唐使が停止された"}, {"concept": "taika-reforms-ritsuryo", "relation": "対比", "note": "唐の丸写しだった律令を、負担・兵制の面で日本の実態に合わせ手直し"}, {"concept": "frankish-kingdom-carolingian", "relation": "同時代", "note": "桓武朝の平安京・蝦夷征討とカール大帝の戴冠（800）がほぼ同時期"}, {"concept": "abbasid-caliphate", "relation": "同時代", "note": "遣唐使停止のころ、アッバース朝でも地方分権化が進行"}, {"concept": "kyoto-monuments", "relation": "具体例", "note": "平安京遷都に始まる都の建築・庭園の集成"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 10 直接生成 / rekishi-10-medieval-world-formation.md", "date": "2026-09-03"}], "tags": "平安京,桓武天皇,遷都,蝦夷,坂上田村麻呂,健児制,最澄,空海,遣唐使停止,国風化", "lastUpdated": "2026-09-03"}, {"id": "hellenistic-world", "title": "ヘレニズム世界", "domain": "世界史", "region": "グローバル", "headline": "アレクサンドロス亡き後、東地中海に生まれたギリシア系諸王国の時代", "startYear": -323, "endYear": -30, "eraLabel": "前3〜前1世紀", "summary": "アレクサンドロスの死後、後継者(ディアドコイ)戦争を経て帝国はプトレマイオス朝エジプト・セレウコス朝・アンティゴノス朝マケドニアなどに分裂した。共通ギリシア語(コイネー)が東地中海に広がり、アレクサンドリアやペルガモンが学術都市として栄えた。ギリシア文化とオリエント文化が混ざり、彫刻・天文学・数学が発展した。前30年、最後のプトレマイオス朝がローマに併合されて時代は幕を閉じる。", "regionCode": "EG", "lat": 31.2, "lng": 29.92, "factLevel": "定説", "body": [{"label": "知の中心地", "text": "プトレマイオス朝はアレクサンドリアに王立研究所(ムセイオン)と大図書館を設け、エウクレイデスやエラトステネスらが集った。", "source": ""}, {"label": "文化の混成", "text": "ガンダーラ美術のように、ギリシア様式は仏教美術など遠方の文化にまで痕跡を残した。", "source": ""}], "relatedTopics": [{"concept": "alexander-eastern-campaign", "relation": "継承", "note": "ディアドコイ戦争で将軍たちが帝国を分割相続した"}, {"concept": "yayoi-period", "relation": "同時代", "note": "ヘレニズム諸王国の時代は日本では弥生中期〜後期"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}], "tags": "ヘレニズム, プトレマイオス朝, セレウコス朝, アレクサンドリア", "lastUpdated": "2026-09-03"}, {"id": "himalaya-and-indian-subcontinent", "title": "ヒマラヤ山脈とインド亜大陸", "domain": "地理", "region": "南・東南アジア", "headline": "大陸の衝突が生んだ世界最高の壁が、亜大陸を半ば閉じた地理単位にした", "eraLabel": "地形（約5000万年前の衝突以降）", "summary": "インド亜大陸はもとゴンドワナ大陸の一部で、約5000万年前にユーラシアへ衝突してヒマラヤ山脈とチベット高原を隠起させた。標高8000m級の壁は北からの寒気と南からのモンスーンの水分を遮り、亜大陸を気候的にも文化的にも半ば閉じた世界にした。山脈から流れ出すインダス川・ガンジス川・ブラマプトラ川が肥沃な沖積平野を作り、人口の大半がそこに集中する。陸の出入口は北西のカイバル峠などに限られ、歴史上の侵入路もそこに集中した。", "regionCode": "IN", "lat": 27.99, "lng": 86.93, "factLevel": "定説", "body": [{"label": "衝突と隠起", "text": "インド・プレートが年約5cmで北上し、今もヒマラヤは隠起を続けている。大規模な地震帯でもある。", "source": "新詳地理"}, {"label": "三大河の平野", "text": "インダス（パンジャブ）、ガンジス（ヒンドスタン平野）、ブラマプトラ（アッサム）。ガンジス平野は世界有数の人口稠密地帯。", "source": "新詳地理"}, {"label": "閉じた亜大陸", "text": "北はヒマラヤ、東は密林、西はバローチ砂漠、南は海。侵入はカイバル峠・ボーラン峠経由に限られ、アーリヤ人・ギリシア・クシャーナ・ムスリム勢力もこの北西ルート。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "indus-valley-civilization", "relation": "地理的背景", "note": "インダス川の沖積平野に成立した"}, {"concept": "maurya-empire", "relation": "地理的背景", "note": "ガンジス平野の生産力がマガダの覇権を支えた"}, {"concept": "buddhism-jainism-birth", "relation": "地理的背景", "note": "ガンジス中流域の都市で生まれた"}, {"concept": "alexander-eastern-campaign", "relation": "地理的背景", "note": "東征はカイバル峠経由でインダス川まで"}, {"concept": "south-asian-monsoon", "relation": "因果", "note": "ヒマラヤ・チベット高原の加熱がモンスーンを強める"}, {"concept": "monsoon-asia-rice-frontier", "relation": "対比", "note": "東アジアの夏雨と同じ現象だが、山脈で雔てられた別世界"}, {"concept": "andes-mountains-geography", "relation": "対比", "note": "大陸衝突起源の高い壁という点で似るが、こちらはプレート沈み込み型の隆起"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 09 直接生成 / rekishi-09-south-southeast-asia-geography.md", "date": "2026-09-03"}], "tags": "ヒマラヤ山脈 インド亜大陸 チベット高原 インド・プレート ガンジス平野 カイバル峠 インダス川", "lastUpdated": "2026-09-03"}, {"id": "human-evolution-and-out-of-africa", "title": "人類の進化と『出アフリカ』", "domain": "地球・人類史", "region": "グローバル", "headline": "アフリカで生まれた人類が、数万年かけて世界へ広がった", "startYear": -7000000, "endYear": -12000, "eraLabel": "新生代〜更新世(旧石器時代)", "summary": "約700万年前、アフリカでヒトとチンパンジーの共通祖先から人類の系統が分かれた。二足歩行を獲得した猿人、道具と火を使うようになった原人、そして約30万〜20万年前にアフリカで現生人類(ホモ・サピエンス)が現れた。ホモ・サピエンスは約6万〜5万年前から大規模な移動(『出アフリカ』)を始め、数万年かけてユーラシア大陸・オーストラリア・アメリカ大陸へと広がった。この過程で、先に世界へ広がっていた旧人類と出会い、交雑した痕跡が現代人のゲノムにも残る。約1万2000年前に最終氷期が終わると、各地で農耕と定住が始まり、長く続いた旧石器時代が幕を閉じる。", "regionCode": "", "factLevel": "有力説", "body": [{"label": "複数回の『出アフリカ』", "text": "現生人類より前の旧人類も、既に数十万年以上前にアフリカを出てユーラシアへ広がっていた。現生人類の『出アフリカ』はその中でも最も新しく、かつ全世界に広がった決定的な波だったとされる。", "source": ""}, {"label": "旧人類との交雑", "text": "ゲノム解析により、アフリカ以外に住む現代人はゲノムの数パーセントを旧人類に由来する遺伝子として受け継いでいることが分かっている。異なる人類が同じ時代・同じ土地に共存し、混血していた証拠とされる。", "source": ""}], "relatedTopics": [{"concept": "evolution-and-mass-extinctions", "relation": "継承", "note": "哺乳類の多様化の先に人類が現れた"}, {"concept": "jomon-period", "relation": "継承", "note": "列島に渡った人々の暮らしが、旧石器から縄文へ続いていく"}, {"concept": "neolithic-revolution", "relation": "関連", "note": "最終氷期の終わりが世界各地の農耕開始につながった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "地球・人類史レイヤー パイロット（最軽量実装）", "date": "2026-09-05"}], "tags": "人類の進化, 出アフリカ, ホモサピエンス, 旧石器時代, ビッグヒストリー", "lastUpdated": "2026-09-05"}, {"id": "inca-empire", "title": "インカ帝国", "domain": "世界史", "region": "南北アメリカ", "headline": "文字を持たず結び目の記録で、南北4000kmの道路網国家を統治した", "startYear": 1438, "endYear": 1533, "eraLabel": "15〜16世紀", "summary": "インカは15世紀にクスコを都に急拡大し、最盛期には現在のエクアドルからチリ中部まで南北約4000kmを支配した。文字を持たないが、結び目のついた紐（キープ）で行政記録を管理し、全土に総延長数万kmとされる石畳の道路網と倉庫、飛脚の中継所を整備した。土地と労働力を国家が編成し、余剰を倉庫に備蓄して飢饉に備える再分配の経済を運営した。1532年、フランシスコ・ピサロが少人数のスペイン人で侵入。折しも帝国は皇位継承をめぐる内戦と天然痘で弱っており、ピサロは皇帝を捕らえて処刑し、1533年にクスコを占領した。", "regionCode": "PE", "lat": -13.53, "lng": -71.97, "factLevel": "定説", "body": [{"label": "キープという記録システム", "text": "文字の代わりに、紐の色・結び方・位置で数量や情報を記録するキープを使い、広大な帝国の税収や人口を管理した。読み解きは専門の役人の仕事だった。", "source": "batch 15 直接生成"}, {"label": "内戦と疫病という弱点", "text": "スペイン人到来の直前、天然痘がすでに帝国内に広まり皇帝が死去、その後継をめぐる内戦が起きていた。少人数のスペイン軍が広大な帝国を短期間で制圧できた背景には、この内部の弱体化があった。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "andes-mountains-geography", "relation": "地理的背景", "note": "垂直統御と道路網によって山岳地帯を一つの国家にまとめた"}, {"concept": "aztec-empire", "relation": "対比", "note": "文字を持たず紐の結び目（キープ）で記録した点が対照的"}, {"concept": "age-of-exploration", "relation": "同時代", "note": "ピサロによる征服（1533）は大航海時代のスペインの拡張の一部"}, {"concept": "pre-columbian-isolation", "relation": "テーマ", "note": "旧大陸と隔絶した条件で独自に発展した帝国の一つ"}, {"concept": "machu-picchu", "relation": "具体例", "note": "標高の高さゆえにスペイン人に発見されなかったインカの都市遺跡"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "インカ,クスコ,キープ,道路網,ピサロ", "lastUpdated": "2026-09-04"}, {"id": "indian-ocean-maritime-trade", "title": "インド洋の海洋交易世界", "domain": "横断テーマ", "region": "南・東南アジア", "headline": "季節風に乗って香辛料・絯布・金が行き交う、陸のシルクロードと並ぶ大動脈", "eraLabel": "紀元前後〜近世", "summary": "紀元前後から、アラビア海・ベンガル湾・南シナ海の三つの海区を季節風帆船が結び、東アフリカ・アラビア・インド・東南アジア・中国を一つの交易網にした。西からは金・銀・馬・ガラス、インドからは絯布・胡椒・宝石、東南アジアからは香料・錫、中国からは絹・陶磁器が運ばれた。陸路より大量輸送が安く、モンスーンの規則性で往復の予定が立った。港市が交易で富み、そこを通じてヒンドゥー教・仏教・のちにイスラーム教が海路で東南アジアへ広がった。", "regionCode": "LK", "lat": 2.5, "lng": 101.3, "factLevel": "定説", "body": [{"label": "三つの海区", "text": "アラビア海（西）・ベンガル湾（中）・南シナ海（東）。季節風のタイミングが違うため、港市で積み替えされた。", "source": "岩波講座 世界歴史"}, {"label": "運ばれたもの", "text": "ローマの金貨がインド南部で大量出土し、大プリニウスは『帝国の富がインドへ流出する』と嘆いた。1世紀の『エリュトラー海案内記』が港と商品を列挙する。", "source": "エリュトラー海案内記"}, {"label": "宗教の海路伝播", "text": "南インド商人とともにヒンドゥー・仏教文化が東南アジアへ（『インド化』）。扶南・チャンパー・シュリーヴィジャヤ。", "source": "詳説世界史"}, {"label": "陸路との比較", "text": "海路は嵩張る安価な品も運べ、政治的分断の影響を受けにくい。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "silk-road-trade", "relation": "対比", "note": "陸のシルクロードと並ぶもう一本の東西交易路。海路は大量・安価"}, {"concept": "south-asian-monsoon", "relation": "因果", "note": "季節風の往復性が定期航海の前提"}, {"concept": "mainland-and-maritime-southeast-asia", "relation": "地理的背景", "note": "東南アジアの海峽・港市が中継拠点"}, {"concept": "roman-principate", "relation": "関連", "note": "ローマの金がインド交易で東へ流出"}, {"concept": "hellenistic-world", "relation": "関連", "note": "プトレマイオス朝エジプトが紅海ルートを開いた"}, {"concept": "angkor", "relation": "関連", "note": "海路で伝播したインド文化が結実した寺院都市"}, {"concept": "age-of-exploration", "relation": "因果", "note": "ポルトガルが喉希望峯経由で参入し既存交易網に食い込んだ"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 09 直接生成 / rekishi-09-south-southeast-asia-geography.md", "date": "2026-09-03"}], "tags": "インド洋交易 季節風 アラビア海 ベンガル湾 マラッカ海峡 港市 エリュトラー海案内記 インド化", "lastUpdated": "2026-09-03"}, {"id": "indus-valley-civilization", "title": "インダス文明（ハラッパー文化）", "domain": "世界史", "region": "南・東南アジア", "headline": "王も神殿も見あたらない、規格化された煉瓦の都市網", "startYear": -2600, "endYear": -1900, "eraLabel": "前26〜前19世紀", "summary": "インダス川流域に、モヘンジョダロ・ハラッパーなど数百の都市・集落が広がった青銅器文明。焼成煉瓦の規格が統一され、格子状の街路、下水道、公衆浴場のような施設をもつ計画都市が特徴。印章に刻まれた文字は未解読で、突出した王墓や巨大神殿が見つからないため、統治の形は諸説ある。前1900年頃、河川の流路変化や気候乾燥化などで都市は衰退し、人々は東方へ分散した。", "regionCode": "PK", "lat": 27.33, "lng": 68.14, "factLevel": "有力説", "body": [{"label": "均質な都市計画", "text": "遠く離れた都市でも煉瓦の寸法や度量衡がそろい、広域の標準が共有されていた。城塞部と居住区が分かれ、井戸と排水設備が各戸に行き渡っていた。強い中央権力の跡が薄いまま、これだけの均質性が保たれた点が謎とされる。", "source": ""}, {"label": "交易ネットワーク", "text": "メソポタミアの文書に見える「メルッハ」はインダスを指すとされ、紅玉髄のビーズや象牙、木材が西方へ運ばれた。ペルシア湾を介した海上交易でシュメールと結ばれていた。", "source": ""}, {"label": "衰退とアーリヤ人", "text": "かつては「アーリヤ人の侵入で滅んだ」とされたが、現在は気候変動と河川環境の悪化による緩やかな解体という見方が主流。インド・アーリヤ語を話す人々の移入はその後の時代に重なる。", "source": ""}], "relatedTopics": [{"concept": "mesopotamia-early-civilization", "relation": "同時代", "note": "シュメールと海上交易で結ばれていた"}, {"concept": "neolithic-revolution", "relation": "因果", "note": "麦作と牧畜がインダス平原に広がった先に成立"}, {"concept": "jomon-period", "relation": "同時代", "note": "モヘンジョダロの最盛期は日本の縄文後期"}, {"concept": "japan-archipelago-geography", "relation": "対比", "note": "大河の氾濫原に立つインダスと、山がちで小河川の日本列島"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "インダス文明, モヘンジョダロ, ハラッパー, 未解読文字", "lastUpdated": "2026-09-03"}, {"id": "industrial-revolution", "title": "産業革命", "domain": "世界史", "region": "ヨーロッパ", "headline": "蒸気機関と工場制が、生産と社会のあり方を根本から変えた", "startYear": 1760, "endYear": 1840, "eraLabel": "18世紀後半〜19世紀前半", "summary": "イギリスで1760年代以降、綿工業を中心に紡績・織布の機械化が進み、ワットの改良蒸気機関が動力源として工場に導入されることで、家内制手工業から工場制機械工業への転換(産業革命)が起きた。豊富な石炭・鉄鉱資源、初期の貿易・農業革命による資本蓄積、広大な海外市場と植民地帝国が、この転換をイギリスで最初に可能にした条件だった。19世紀前半にはベルギー・フランス・ドイツ・アメリカへと波及し、都市への人口集中、労働者階級の形成、環境汚染など近代工業社会特有の課題も生み出した。", "regionCode": "GB", "lat": 53.4808, "lng": -2.2426, "factLevel": "定説", "body": [{"label": "綿工業と機械化", "text": "ジェニー紡績機・水力紡績機・ミュール紡績機などの発明で紡績が機械化され、力織機の普及で織布も工場に集約されていった。", "source": "MulmoClaude"}, {"label": "蒸気機関という動力革命", "text": "ジェームズ・ワットが改良した蒸気機関は水力に依存しない立地の自由を工場にもたらし、鉄道・蒸気船にも応用されて輸送革命を引き起こした。", "source": "MulmoClaude"}, {"label": "イギリスで最初に起きた条件", "text": "囲い込みによる農業生産性向上と余剰労働力、石炭・鉄鉱石という資源、海外植民地という市場と原料供給地、名誉革命後の安定した所有権制度が組み合わさった。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "scientific-revolution", "relation": "継承", "note": "科学革命の実験的・数学的方法論が技術応用へとつながっていった"}, {"concept": "atlantic-slave-trade", "relation": "関連", "note": "奴隷労働による原綿・砂糖の供給と交易利潤が資本蓄積を下支えした"}, {"concept": "french-revolution", "relation": "同時代", "note": "イギリスが工業化を進める同時期、フランスは政治革命の渦中にあった"}, {"concept": "latin-american-independence", "relation": "因果", "note": "工業化後のイギリスが自由貿易市場を求めたことが独立を後押しした一因"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近代,産業革命,イギリス,ヨーロッパ", "lastUpdated": "2026-09-04"}, {"id": "inner-asia-farming-pastoral-frontier", "title": "農耕と遊牧の境界（長城ライン）", "domain": "地理", "region": "東アジア", "headline": "年降水量400mmの線が、畑を耕す世界と家畜を追う世界を分けた", "eraLabel": "地理単元", "summary": "東アジア内陸では、南東の湿潤な農耕地帯と、北西の乾燥した草原・砂漠の遊牧地帯が、年降水量およそ400mmの線で接する。この境界帯では定住農耕民と移動する遊牧民が交易と衝突を繰り返した。中国の歴代王朝が築いた長城群は、おおむねこの生態的な境界に沿って走る。遊牧勢力の南下と農耕帝国の北進が、東アジア史の大きなリズムを作った。", "regionCode": "CN", "lat": 40.5, "lng": 113, "factLevel": "定説", "body": [{"label": "長城は生態境界", "text": "万里の長城は単なる防壁ではなく、農耕が成り立つ限界線の目印でもある。線の内と外で生業・社会・軍事の形が大きく違った。", "source": ""}, {"label": "草原の機動力", "text": "乾燥地では騎馬による移動と戦闘が発達し、少人数でも農耕国家に大きな軍事的圧力をかけられた。", "source": ""}], "relatedTopics": [{"concept": "yellow-river-shang-zhou", "relation": "対比", "note": "周の外側に広がる非農耕世界"}, {"concept": "north-south-china-divide", "relation": "関連", "note": "同じ大地を分けるもう一つの気候境界"}, {"concept": "china-landforms-great-rivers", "relation": "地理的背景", "note": "内陸の乾燥高原と東部湿潤平野の境"}, {"concept": "great-wall-of-china", "relation": "具体例", "note": "この農牧境界線そのものを可視化した構造物"}, {"concept": "north-american-great-plains-geography", "relation": "対比", "note": "農耕限界を分けるのが降水量か大型家畜の有無かという違い"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ02)", "ref": "data/wiki/sources/rekishi-02-east-asia-geography.md", "date": "2026-09-03"}], "tags": "遊牧, 農耕, 万里の長城, 400mm等降水量線, 草原, 生態境界", "lastUpdated": "2026-09-03"}, {"id": "insei-period", "title": "院政の開始", "domain": "日本史", "region": "日本", "headline": "上皇が『治天の君』として院庁から専制──天皇の父という立場が最強の権力に", "startYear": 1086, "endYear": 1185, "eraLabel": "11世紀末〜12世紀（平安後期）", "factLevel": "定説", "regionCode": "26", "summary": "藤原氏を外戚としない後三条天皇が荘園整理令で藤原氏の経済基盤を削った後、白河天皇が1086年に幼い堀河天皇へ譲位し、上皇（院）として院庁から political 主導権を握った。天皇の父・祖父という家父長の立場で、摂関にも公卿にも縛られず人事と裁定を握る新しい専制で、白河・鳥羽・後白河の三上皇が約100年続けた。上皇は荘園の最大の寄進先となり、北面の武士を組織して武力を蓄えた。この過程で地方で成長した源氏・平氏が中央政界に引き込まれた。", "body": [{"label": "院政のしくみ", "text": "上皇は天皇の後見人として、私的な家政機関である院庁で院宣・院庁下文を出して政治を動かした。律令の官職に縛られず、側近（院近臣）を登用できる点が強みだった。", "source": "batch 11 直接生成"}, {"label": "経済基盤", "text": "後三条の延久の荘園整理令で不正荘園を停止した後、逆に院自身が全国の荘園の寄進を受ける本家となり、膨大な院領荘園群（八条院領・長講堂領など）を築いた。", "source": "batch 11 直接生成"}, {"label": "武士の中央進出", "text": "院や大寺院が武力を必要とし、北面の武士や僧兵への対抗として、伊勢平氏・河内源氏が京へ呼ばれた。1156年の保元の乱で武士の実力が誰の目にも明らかになった。", "source": "batch 11 直接生成"}, {"label": "文化", "text": "『今昔物語集』『梁塵秘抄』（後白河編）、絵巻物（源氏物語絵巻・信貴山縁起）、平泉の中尊寺金色堂（奥州藤原氏）など、地方と庶民を含む多様な文化が展開した。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "fujiwara-regency", "relation": "継承", "note": "外戚の摂関に代わり、家父長の上皇が実権を握る形へ"}, {"concept": "taira-clan-government", "relation": "因果", "note": "院政下で中央に進出した平氏が、やがて院をしのぐ"}, {"concept": "crusades", "relation": "同時代", "note": "第1回十字軍（1096）とほぼ同時。宗教的・家父長的権威が君主の上に立つ"}, {"concept": "feudal-europe-and-papacy", "relation": "対比", "note": "教皇が皇帝の上に立つ叙任権闘争と、上皇が天皇の上に立つ院政"}, {"concept": "kamakura-shogunate", "relation": "継承", "note": "院政期の内乱（治承・寿永の乱）から鎌倉幕府が生まれた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "平安,院政,白河上皇,荘園,武士", "lastUpdated": "2026-09-03"}, {"id": "iranian-plateau-geography", "title": "イラン高原の地誌", "domain": "地理", "region": "西アジア・中東", "headline": "山に囲まれた乾いた高原。水は地下水路カナートで運ぶ", "eraLabel": "地理単元", "summary": "イラン高原はザグロス山脈とアルボルズ山脈に囲まれた標高1000m級の内陸高原で、中央部にはカヴィール（塩の砂漠）とルート砂漠が広がる。降水は山地に偏り、平野の多くは乾燥する。人々は山麓の扇状地に集落を作り、地下水路カナート（カレーズ）で山の水を数十km引いて灌漑した。高原は東西南北の交易路が交わる結節点で、周縁のオアシス都市が隊商を中継した。", "regionCode": "IR", "lat": 33, "lng": 54, "factLevel": "定説", "body": [{"label": "カナートの世界", "text": "地表を流さず地下トンネルで導水するため蒸発が少ない。掘削と維持に高度な技術と共同体の統率が要り、水利権が社会秩序の基礎になった。", "source": ""}, {"label": "囲まれた要害", "text": "周囲の山脈が防壁となり、高原に拠る勢力（メディア、アケメネス朝、パルティア、ササン朝）は繰り返し大帝国の核になった。", "source": ""}, {"label": "馬と遊牧の辺境", "text": "高原北東部のステップは良馬を産し、騎馬勢力の圧力を絶えず受ける辺境でもあった。", "source": ""}], "relatedTopics": [{"concept": "achaemenid-persia", "relation": "地理的背景", "note": "山に囲まれた高原に拠る勢力が繰り返し大帝国の核になった"}, {"concept": "mesopotamia-geography", "relation": "対比", "note": "灌漑依存の低地平野に対し、山の水をカナートで引く高原"}, {"concept": "anatolia-geography", "relation": "関連", "note": "『王の道』で結ばれた西アジアのもう一つの高原"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "対比", "note": "農耕民と遊牧民が接する境界は西アジアの高原北縁にもある"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ04)", "ref": "data/wiki/sources/rekishi-04-west-asia-geography.md", "date": "2026-09-03"}], "tags": "イラン高原, ザグロス, カナート, 塩砂漠, オアシス", "lastUpdated": "2026-09-03"}, {"id": "italian-unification", "title": "イタリア統一（リソルジメント）", "domain": "世界史", "region": "ヨーロッパ", "headline": "カヴール外交とガリバルディの千人隊が、分裂半島を一つの王国にした", "startYear": 1859, "endYear": 1871, "eraLabel": "19世紀後半", "summary": "「地理的表現に過ぎない」とまで言われた分裂状態のイタリア半島で、サルデーニャ王国のカヴール首相が外交でオーストリアを孤立させ、ガリバルディの義勇軍「千人隊」が南部を征服。1861年にイタリア王国が成立し、1870年のローマ併合で統一が完成した。ドイツ統一とほぼ並行し、両国とも遅れて帝国主義競争に参入する。", "regionCode": "IT", "lat": 41.9028, "lng": 12.4964, "factLevel": "定説", "body": [{"label": "カヴールの外交", "text": "1858年プロンビエール密約でフランスの支持を取り付け、翌年オーストリアと開戦(イタリア統一戦争)。北イタリアを併合した。", "source": "MulmoClaude"}, {"label": "ガリバルディの千人隊", "text": "1860年、赤シャツ隊と呼ばれる義勇軍約1000人で両シチリア王国(南イタリア)を征服し、その成果をサルデーニャ王ヴィットーリオ・エマヌエーレ2世に献上した。", "source": "MulmoClaude"}, {"label": "統一の完成", "text": "1866年ヴェネト併合、1870年普仏戦争でフランス軍撤退の隙にローマを併合。教皇領は消滅し、教皇と王国の対立(ローマ問題)は1929年まで続いた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "german-unification", "relation": "同時代", "note": "ほぼ同時期に進んだ「後発国家形成」の並走事例"}, {"concept": "napoleonic-era", "relation": "継承", "note": "ナポレオンが作ったイタリア諸共和国での経験がナショナリズムの萌芽になったとされる"}, {"concept": "scramble-for-africa", "relation": "因果", "note": "統一後のイタリアが遅れて植民地獲得(エリトリア・リビア等)に乗り出す動機になった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "帝国主義,国民国家,近代,ヨーロッパ,リソルジメント", "lastUpdated": "2026-09-05"}, {"id": "japan-archipelago-geography", "title": "日本列島の地誌", "domain": "地理", "region": "日本", "headline": "山がちで平野は狭い。だが夏に雨が集中する気候が水田に向いた", "eraLabel": "地理単元", "summary": "日本列島は国土の約7割が山地・丘陵で、平野は河川下流の沖積低地に限られる。中緯度モンスーンの影響で夏は高温多湿、梅雨と台風で雨が生育期に集中し、水稲栽培に適する。火山灰起源の土壌と豊富な水系も稲作を支えた。周囲を海に囲まれるため大陸からの軍事的圧力は緩和され、文化や技術は選択的・段階的に受容された。", "regionCode": "JP", "lat": 36, "lng": 138, "factLevel": "定説", "body": [{"label": "気候と稲", "text": "梅雨から盛夏にかけての降水と高温が、南方原産の稲の生育期と重なる。これが弥生以降、水稲が列島に定着できた自然的条件になった。", "source": ""}, {"label": "海という緩衝", "text": "対馬海峡は交流を妨げない程度に狭く、大軍の渡海を許さない程度に広い。渡来は少人数・断続的で、在来文化と融合しやすかった。", "source": ""}, {"label": "稲作の北限", "text": "列島は南北に長く、東北北部から北海道は前近代には稲作が難しい冷涼地だった。北海道で水田が広がるのは寒地向け品種が育つ明治以降で、自然の境界を技術が押し広げた例。", "source": ""}], "relatedTopics": [{"concept": "wet-rice-farming-japan", "relation": "地理的背景", "note": "温暖湿潤・夏雨型の気候が水稲に適する"}, {"concept": "yayoi-period", "relation": "地理的背景", "note": "海が大陸の軍事的圧力を緩和し、文化は選択的に伝わった"}, {"concept": "monsoon-asia-rice-frontier", "relation": "地理的背景", "note": "列島が夏雨型モンスーン圏に入る"}, {"concept": "korean-peninsula-geography", "relation": "関連", "note": "対馬海峡をはさんで大陸文化を受け渡す"}, {"concept": "china-landforms-great-rivers", "relation": "対比", "note": "大河の沖積平野を持つ大陸と、短い急流の列島"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}, {"sourceName": "MulmoClaude直接生成(バッチ02 拡張)", "ref": "data/wiki/sources/rekishi-02-east-asia-geography.md", "date": "2026-09-03"}], "tags": "日本列島, モンスーン, 沖積平野, 対馬海峡, 稲作の北限", "lastUpdated": "2026-09-03"}, {"id": "japan-kasei-culture", "title": "化政文化", "domain": "日本史", "region": "日本", "headline": "江戸が担い手となった、庶民のパロディと娯楽の爛熟文化", "startYear": 1804, "endYear": 1830, "eraLabel": "江戸時代後期（文化・文政年間）", "summary": "11代将軍徳川家斉の治世下、文化・文政年間(1804-1830頃)を中心に、それまで文化の中心だった上方(京都・大坂)に代わり江戸が主役となる町人文化が花開いた。十返舎一九の滑稽本、曲亭馬琴の読本、葛飾北斎・歌川広重の浮世絵風景画、川柳や狂歌といった機知とパロディを好む娯楽が広がり、寺子屋の普及で庶民の識字率も上昇した。一方で幕府財政は悪化を続け、爛熟した文化の裏側で社会不安も静かに広がっていた。", "regionCode": "13", "lat": 35.6762, "lng": 139.6503, "factLevel": "定説", "body": [{"label": "江戸中心の町人文化", "text": "上方に代わり江戸が経済・文化の中心となり、十返舎一九『東海道中膝栗毛』の滑稽本や曲亭馬琴『南総里見八犬伝』などの読本が庶民に広く読まれた。", "source": "MulmoClaude"}, {"label": "浮世絵と出版文化の隆盛", "text": "葛飾北斎『富嶽三十六景』、歌川広重『東海道五十三次』など多色刷り浮世絵版画が量産され、川柳・狂歌といった機知とパロディの文芸も流行した。", "source": "MulmoClaude"}, {"label": "教育の広がりと財政の陰り", "text": "寺子屋の普及で庶民の識字率・計算能力が向上した一方、幕府・諸藩の財政は悪化を続け、爛熟文化の裏で社会不安が静かに広がっていた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "genroku-culture", "relation": "継承", "note": "上方中心の町人文化が江戸中心へと重心を移した"}, {"concept": "tenpo-reforms", "relation": "因果", "note": "文化の爛熟の裏で進んだ財政悪化が改革を必要とした"}, {"concept": "industrial-revolution", "relation": "対比", "note": "ヨーロッパが工業化に向かう同時期、日本は手工業と出版文化の爛熟にとどまった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近世,日本,化政文化,江戸時代", "lastUpdated": "2026-09-04"}, {"id": "japan-postwar-economic-miracle", "title": "高度経済成長", "domain": "日本史", "region": "日本", "startYear": 1955, "endYear": 1973, "eraLabel": "高度成長期", "headline": "「もはや戦後ではない」年平均10%成長の時代", "summary": "1950年代半ばから1973年のオイルショックまで、日本経済は年平均10%前後という異例の成長を続け、わずか20年弱でGDP世界第2位の経済大国に躍進した。東京オリンピック（1964）・新幹線開通・「三種の神器」の普及などが象徴する時代。", "factLevel": "定説", "body": [{"label": "成長の要因", "text": "占領改革で整った制度基盤に加え、朝鮮特需で得た資金、安価で質の高い労働力、政府主導の産業政策（傾斜生産方式など）、終身雇用・年功序列という企業慣行が組み合わさり、輸出主導の重化学工業化が急速に進んだ。"}, {"label": "生活の変化", "text": "「三種の神器」（白黒テレビ・洗濯機・冷蔵庫）、続いて「新・三種の神器（3C）」（カー・クーラー・カラーテレビ）が一般家庭に普及し、都市部への人口集中と核家族化が進んだ。"}, {"label": "終わりの合図", "text": "1973年の第一次オイルショックで原油価格が急騰し、資源を輸入に頼る高度成長型経済は大打撃を受けて狂乱物価と呼ばれるインフレが発生、高度経済成長は終わりを告げた。"}], "relatedTopics": [{"concept": "occupation-reforms-japan", "relation": "継承", "note": "改革で整った制度基盤の上に成長が築かれた"}, {"concept": "korean-war", "relation": "因果", "note": "朝鮮特需が復興から成長への転換点になった"}, {"concept": "oil-crisis-and-stable-growth", "relation": "継承", "note": "オイルショックで成長は終わり安定成長期へ移行した"}, {"concept": "european-integration-origins", "relation": "対比", "note": "同じ戦後復興でもヨーロッパは統合、日本は輸出主導の一国成長という別の道を歩んだ"}]}, {"id": "jomon-period", "title": "縄文時代", "domain": "日本史", "region": "日本", "headline": "農耕なしで1万年続いた、世界的にも珍しい定住的な狩猟採集社会", "startYear": -6000, "endYear": -900, "eraLabel": "縄文時代", "summary": "最終氷期の終わり（およそ前14000年頃、諸説あり）から水稲農耕が本格化する前900年頃まで続いた時代。世界の多くの地域では定住は農耕とともに始まるが、縄文人は豊かな森と海の資源を利用し、農耕なしに竪穴住居の集落・土器・漆・大規模な祭祀（環状列石）を発達させた。青森の三内丸山遺跡は前3900〜前2200年頃の大集落で、クリ林の管理など半栽培的な資源利用が行われた。後期〜晩期には気候の寒冷化で人口が減り、大陸との接触のなかで農耕を受け入れる素地ができた。", "regionCode": "JP", "lat": 40.81, "lng": 140.7, "factLevel": "諸説あり", "body": [{"label": "縄文土器と定住", "text": "世界最古級の土器（前1万年紀）を持ち、煮炊きによって木の実や貝を食べやすくした。食料の季節変動を貯蔵と多様な資源利用で乗り切り、数十人規模のムラを定着させた。", "source": ""}, {"label": "三内丸山遺跡", "text": "大型掘立柱建物、長期間使われた住居群、遠隔地産のヒスイや黒曜石が出土。クリのDNA分析から人が植生を管理していた可能性が示され、「採集」と「栽培」の中間的な暮らしが議論されている。", "source": ""}, {"label": "年代論争と終わり方", "text": "縄文の開始・終了年代は測定法により幅がある。終末期（前10〜前9世紀、諸説あり）に北部九州へ水稲農耕が伝わり、縄文的な世界は東日本に残りつつ弥生へ移行した。断絶ではなく重なりながらの転換とみられる。", "source": ""}], "relatedTopics": [{"concept": "wet-rice-farming-japan", "relation": "因果", "note": "縄文晩期の社会が水稲農耕を受け入れる受け皿になった"}, {"concept": "yayoi-period", "relation": "継承", "note": "縄文から弥生へは断絶でなく重なりながらの移行"}, {"concept": "japan-archipelago-geography", "relation": "地理的背景", "note": "森と海の資源が豊かで、農耕なしの定住を可能にした"}, {"concept": "neolithic-revolution", "relation": "対比", "note": "「定住＝農耕」という世界の一般則から外れた事例"}, {"concept": "mesopotamia-early-civilization", "relation": "同時代", "note": "シュメールに都市が栄えた頃、日本は縄文の集落社会"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "縄文時代, 縄文土器, 三内丸山遺跡, 狩猟採集", "lastUpdated": "2026-09-03"}, {"id": "kamakura-shogunate", "title": "鎌倉幕府の成立と展開", "domain": "日本史", "region": "日本", "headline": "御恩と奉公で結ばれた東国武士の政権、北条氏の執権政治", "startYear": 1185, "endYear": 1333, "eraLabel": "鎌倉時代", "summary": "源頼朝は1180年代の内乱（治承・寿永の乱）で東国武士団を組織し、守護・地頭の設置権を朝廷に認めさせて（1185年）、1192年に征夷大将軍となった。特徴は、将軍と御家人が『御恩（所領の保障・新恩給与）』と『奉公（軍役）』で結ばれた封建的主従関係にある。頼朝死後は北条氏が執権として実権を握り、1221年の承久の乱で後鳥羽上皇の討幕計画を破ると、六波羅探題を置いて全国的な支配を確立した。3代執権北条泰時は御成敗式目（1232年）を定め、武士社会の慣習を成文法にした。元寇後は御家人の窮乏と得宗専制への不満が高まり、1333年に滅亡した。", "regionCode": "14", "lat": 35.32, "lng": 139.55, "factLevel": "定説", "body": [{"label": "承久の乱（1221年）", "text": "後鳥羽上皇が北条義時追討の兵を挙げたが、幕府軍が短期間で京都を制圧。上皇は隠岐に流され、朝廷を監視する六波羅探題が置かれた。以後、幕府の権威が朝廷を上回る二元的支配が確立した。", "source": "batch 13 直接生成"}, {"label": "御成敗式目（貞永式目、1232年）", "text": "北条泰時が制定した51条の武家法。頼朝以来の先例と武士の『道理』に基づき、所領争いの裁定基準などを定めた。律令とは別系統の、実務的な武家の法として長く手本にされた。", "source": "batch 13 直接生成"}, {"label": "衰退の構造", "text": "分割相続で御家人の所領は細分化し、貨幣経済の浸透で困窮する者が増えた。元寇の防衛戦では新恩給与ができず、恩賞への不満が蓄積。北条氏得宗家への権力集中（得宗専制）も御家人の離反を招いた。", "source": "batch 13 直接生成"}], "relatedTopics": [{"concept": "taira-clan-government", "relation": "継承", "note": "平氏を倒した源頼朝が東国武士団を基盤に樹立"}, {"concept": "insei-period", "relation": "継承", "note": "院政期の内乱の中から武家政権が生まれた"}, {"concept": "mongol-invasions-of-japan", "relation": "因果", "note": "防衛戦で恩賞を出せず御家人の信頼を失った"}, {"concept": "mongol-empire-formation", "relation": "同時代", "note": "承久の乱（1221）はチンギス・ハンの西征と同時期"}, {"concept": "song-dynasty", "relation": "関連", "note": "日宋貿易・宋銭の流入と禅宗の伝来が鎌倉文化を支えた"}, {"concept": "muromachi-shogunate", "relation": "継承", "note": "建武の新政を経て足利尊氏が京都に開いた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 13 直接生成 / rekishi-13-mongol-century.md", "date": "2026-09-04"}], "tags": "鎌倉幕府,源頼朝,北条氏,執権,承久の乱,御成敗式目", "lastUpdated": "2026-09-04"}, {"id": "kofun-emergence", "title": "古墳の出現と初期ヤマト王権", "domain": "日本史", "region": "日本", "headline": "定型化した前方後円墳の広がりが、畿内の王を頂点とする秩序を映す", "startYear": 250, "endYear": 350, "eraLabel": "3世紀後半〜4世紀", "summary": "3世紀半ば〜後半、奈良盆地南東部（纒向）に定型化した巨大前方後円墳が突如現れる。箸墓古墳（全長約280m）がその画期とされる。共通の墓制と三角縁神獣鏡などの副葬品の配布は、畿内の王を頂点とする広域の政治秩序（初期ヤマト王権）が列島中西部に及んだことを示す。弥生墳丘墓からの連続性はあるが、規模と規格性の飛躍は明らかである。", "regionCode": "JP", "lat": 34.54, "lng": 135.84, "factLevel": "有力説", "body": [{"label": "箸墓古墳の画期", "text": "前方後円という定型、葺石と埴輪の祖形、後円部の竪穴式石室――これらが一気にそろう最初の巨大墳が箸墓とされる。築造は3世紀後半とみる説が有力で、被葬者を卑弥呼または後継のトヨに擬する説もある。", "source": "詳説日本史"}, {"label": "墓制の共有＝政治秩序", "text": "前方後円墳の規模には序列があり、最大のものは常に畿内にある。地方首長がこの形式と規格を採用したこと自体が、畿内の王権への従属や同盟を示すと解釈される（前方後円墳体制）。", "source": "岩波日本史辞典"}, {"label": "弥生からの連続と飛躍", "text": "吉備や出雲の弥生墳丘墓（特殊器台・特殊壺）が埴輪や墳形の源流にある。連続性を認めつつ、規模・規格・分布の広さの飛躍を『古墳時代の開始』と呼ぶ。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "yamatai-himiko", "relation": "継承", "note": "前方後円墳の広がり＝ヤマト王権の版図の可視化"}, {"concept": "yayoi-period", "relation": "継承", "note": "弥生墳丘墓から定型化した古墳へ"}, {"concept": "japan-archipelago-geography", "relation": "地理的背景", "note": "奈良盆地・大阪平野が王権の中枢"}, {"concept": "later-han-and-three-kingdoms", "relation": "対比", "note": "中国は三国に分裂、倭は統合へ向かう"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 07 直接生成 / rekishi-07-ancient-empires-peak.md", "date": "2026-09-03"}], "tags": "古墳時代 前方後円墳 箸墓古墳 三角縁神獣鏡 ヤマト王権 纒向", "lastUpdated": "2026-09-05", "dramaIntro": "弥生時代の物語のつづきです。卑弥呼・壱与の時代が終わると、大陸の記録から倭の姿が百数十年ほど消えます――その『空白の4世紀』を、完全な創作で描きます。同じ古墳時代の始まりを、二つの視点から。奈良盆地に前例のない巨大な墓を築かせた大王とその周りを描く『中心』と、その墓を実際に土を運んで築いた名もなき人々を描く『周辺』。壱与(台与)のように実在が推定される人物も、名もなき人々も、会話や心情はすべてMulmoClaudeの創作で、史実そのものではありません。記録がほとんど残らない時代だからこそ、想像力で『点』と『点』を線でつないでみる試みとして読んでください。", "dramaScenesCenter": [{"sceneTitle": "第一幕　神の声より、見える形を", "characters": "壱与／トヨ(実在推定、卑弥呼の後継者。ここでは老年)／若き大王ミマキ(架空)", "script": "奈良盆地の東のふもと、まきむくと呼ばれる地。老いた女王トヨが、若い大王ミマキに座を譲ろうとしていた。\n「私も、姉の卑弥呼のように、はっきりと神の声を聞けたわけではない。共立の王という枠を、どうにか保ってきただけだ」\nミマキは静かに問う。\n「では、これからの王は、何をよりどころにすればよいのですか」\n「神の声が細るなら、目に見える形で力を示すしかあるまい。国じゅうの民が仰ぎ見て、『あれが王だ』と分かるものを」\nミマキはしばらく黙り、やがて西の空ではなく足もとの土を見て言った。\n「では、天より地に。丘そのものを王の形にして、まきむくに築きましょう。誰も見たことのない大きさで」\nトヨは深くうなずいた。彼女が最後に見届けたのは、神をまつる女王の時代が終わり、土と石で語る王の時代が始まる瞬間だった。", "note": "壱与(台与)の晩年やミマキという大王は史料になく、崇神天皇(ハツクニシラススメラミコト)の伝承を下敷きにした完全な創作。まきむく(纒向)へ政治的中枢が移ることは考古学的知見に基づく。弥生時代・中心編 第七幕(壱与の共立と大きな塚)の直後にあたる。"}, {"sceneTitle": "第二幕　国々の土器が集まる里", "characters": "大王ミマキ(架空)／豪族オホトモ(架空)／各地から来た民(架空)", "script": "まきむくの里には、東海から、北陸から、吉備や山陰から、次々に土器と人が運び込まれていた。\n豪族オホトモが目録を読み上げる。\n「今月もはるか遠くの国から、二十を超える家族が移り住んでまいりました。連れてきた土器の形が、どれも違います」\nミマキは、まっすぐに掘られた水路と、柱の太い大型の建物を見渡した。\n「ここは神をまつるだけの土地ではない。人とモノが集まり、王がそれを分ける都だ。だからこそ、諸国から人を呼ぶ」\n遠国から来たばかりの民の一人が、隣の者に小声で言う。\n「故郷の村とは、土の匂いまで違う。だが、ここに来れば飢えぬというなら……」\nオホトモがミマキに向き直る。\n「諸国の首長も、競うように人と貢ぎ物を送ってきます。まきむくとつながることが、力の証になりつつあります」", "note": "纒向遺跡からは各地の搬入土器が大量に出土し、他地域からの人・物の集中がうかがえる(考古学的事実)。オホトモや個々の会話は創作。中心編 第二幕は周辺編 第一幕と同じ時期。"}, {"sceneTitle": "第三幕　かつてない墓", "characters": "大王ミマキ(架空)／吉備の技術者イクメ(架空)／豪族オホトモ(架空)", "script": "吉備から招かれた技術者イクメが、粘土でこしらえた模型を王の前に置いた。\n「前が方形、後ろが円。二つをつないだ丘そのものを、王の墓の形といたします。斜面には河原の石を葺き、頂と裾には土の器を並べます」\n「その形に、意味はあるのか」\n「吉備では、首長の墓に特殊な器台を立て、墳丘を石でおおってきました。それを、これまでのどの墓より大きくするのです。長さは二百八十歩に及びます」\nオホトモが息をのむ。\n「二百八十歩……。何千人の手が、何年も要りますぞ」\nイクメは静かに答えた。\n「ですが、王が世を去っても、この形は千年残ります。遠い国の民が見ても、ひと目で『王の墓だ』と分かる」\nミマキは模型の円の部分に手を置いた。\n「よい。ここに、神の声に代わるものを建てる」", "note": "箸墓古墳(全長約280m)が定型化した前方後円墳の画期とされること、吉備の特殊器台・特殊壺が埴輪や墳形の源流にあること、葺石を伴うことは有力説(被葬者を卑弥呼またはトヨとする説もある)。イクメは架空。中心編 第三幕は周辺編 第二幕と同じ時期。"}, {"sceneTitle": "第四幕　同じ鏡を持つ者", "characters": "大王ミマキ(架空)／各地の首長たち(架空)／豪族オホトモ(架空)", "script": "箸墓の完成に前後して、まきむくには各地の首長が集まっていた。ミマキは、そろいの文様をもつ銅鏡を一枚ずつ手渡していく。\n「この鏡を受け取った者は、まきむくの大王と結ばれた証を持つことになる」\n一人の首長がおそるおそる問う。\n「われらは、何をすればよいのでしょう」\n「そなたの国で人が死ねば、小さくとも同じ形の墓を築くがよい。前が方形、後ろが円。大きさは、この鏡の格に見合うだけ」\nオホトモが補う。\n「最も大きな墓は、常にこのまきむくにある。地方の墓が大王の墓を越えることは、決してない。その序列こそが、国のかたちです」\n首長たちは鏡を押しいただいて帰っていった。数十年のうちに、九州から東国まで、同じ形の墓が点々と築かれ始める。", "note": "前方後円墳の規模には序列があり最大墳は常に畿内にあること、共通の墓制と副葬品(三角縁神獣鏡など)の配布が畿内王権を頂点とする政治秩序を示すという解釈(前方後円墳体制)に基づく。会話・首長は創作。中心編 第四幕は周辺編 第三幕と同じ時期。"}, {"sceneTitle": "第五幕　海の向こうへ、名を告げに", "characters": "数代あとの大王(架空)／使者(架空)／老いたオホトモの孫(架空)", "script": "ミマキから数えて何代かのち。大王の墓は代を追って大きくなり、その版図は筑紫から東国まで届いていた。\n若い大王が、海の向こうへ使いを出そうとしている。\n「祖父の代から、中国の宮廷に使いを送っていない。もう一度、倭に一人の大王がいることを、はっきり告げに行かせる」\nオホトモの孫が巻物を広げる。\n「朝鮮半島の国々とも、鉄をめぐって関わりが深くなっております。南の中国の宮廷は、称号を与えてくれるはずです」\n「では、そう名乗れる時が来たということだ。『倭王』と」\n使者の船が、難升米が渡ったのと同じ海へ漕ぎ出していく。記録に残らなかった百数十年を経て、倭はふたたび大陸の史書に現れようとしていた。", "note": "4世紀は中国史料が乏しい『空白の4世紀』で、5世紀になると『倭の五王』が南朝へ朝貢する(次のノード yamato-polity-development)。この幕は古墳前期から次の時代への接続で、人物・会話はすべて創作。"}], "dramaScenesPeriphery": [{"sceneTitle": "第一幕　東へ移された村", "characters": "クワ(架空、弥生・周辺編のハヤトの孫という設定)／クワの父(架空)／村の年寄り(架空)", "script": "北部九州の村に、まきむくの大王からの使いが来た。『土木に長けた家族を、幾組か東へ移せ』という。\n選ばれた中に、クワの一家がいた。\n「なぜ、うちなんだ」と若いクワ。\n父が荷をまとめながら答える。\n「おまえの曾祖父のハヤト、その前の代から、うちは水田の土手も、村の濠も築いてきた。土を扱う家だと知られておるのだ」\n村の年寄りが、火のそばで昔語りをする。\n「ハヤトどのは若い頃、女王さまの大きな塚に土を運んだと言うておった。籠を担いで、何日も列に並んだと。……その孫が、また同じことをしに東へ行くとはな」\nクワは、見たこともない奈良の盆地を思い浮かべた。\n「また、土を運ぶために、そんな遠くまで」", "note": "纒向への各地からの人の移動は搬入土器から推定される。クワを弥生・周辺編のハヤト(卑弥呼の塚に土を運んだ稲作民)の孫とするのは、二つの時代の物語をつなぐための完全な創作。中心編 第二幕と同じ時期。"}, {"sceneTitle": "第二幕　土を突き固める日々", "characters": "クワ(架空)／夫役の男たち(架空)／監督の下役(架空)", "script": "箸墓の造営現場。数えきれないほどの人が、籠で土を運び、薄く敷いては丸太で突き固める。それを何百層とくり返す。\n下役が声を張る。\n「土を厚く盛るな! 薄く、固く! この丘は千年もたせるのだ!」\n昼、配られるのは稗と玄米の粥。クワは椀を手に、丘の頂を見上げた。\n「王様の顔は、爺さまの代から誰も見たことがないという。それでも、この山の大きさを見れば、どれほどの王か分かる気がする」\n隣の男が汗を拭う。\n「儂の村じゃ、田を作る手が半分に減った。それでも夫役は断れん」\nクワは籠を担ぎ直した。曾祖父のハヤトも、同じように籠を担いで、女王の塚の列に並んだのだろうか、と思いながら。", "note": "前方後円墳が薄く土を敷いて突き固める工法(版築に近い)や葺石・埴輪列を伴うこと、大規模な労働力動員を要したことは考古学的知見に基づく。『王の顔は誰も見たことがない』のせりふは弥生・周辺編 第四幕の反響で創作。中心編 第三幕と同じ時期。"}, {"sceneTitle": "第三幕　はにわを並べる娘", "characters": "クワ(架空)／はにわ工人の娘ニヒ(架空、弥生・周辺編の青銅器職人の血筋という設定)／ニヒの父(架空)", "script": "墳丘の裾では、吉備から来た工人の一家が、粘土をひも状にして積み上げ、筒のような土の器を作っていた。焼き上がった器は、墳丘の上にぐるりと並べられる。\n土を運ぶ合間、クワは工人の娘ニヒに話しかけた。\n「不思議な仕事だな。何のために、この器を並べるんだ」\n「聖なる場所と、外とを分ける印だと父は言います。……うちは昔、鏡を磨く家だったそうです。海の向こうの国の文様を、銅の面に写していたと」\n「それが、なぜ土の器に」\nニヒはろくろのない手だけで、粘土の縁をならしながら笑った。\n「鏡も器も、火と土から生まれます。金属が手に入らない年でも、土だけはある。生き延びるほうへ、家業も移るのです」\nクワは、その手つきをしばらく見ていた。", "note": "円筒埴輪が吉備の特殊器台・特殊壺に源流をもつことは有力説。ニヒを弥生・周辺編の青銅器職人(魏の鏡を手本に鏡を作っていた)の子孫とするのは、中心に近い血筋(職人・侍女筋)と周辺の血筋(稲作民)が時代を下って交わっていくという長期構想の一歩としての創作。中心編 第三〜四幕と同じ時期。"}, {"sceneTitle": "第四幕　墓は完成し、また次の墓へ", "characters": "クワ(架空)／ニヒ(架空)／村の年寄り(架空)", "script": "何年もかけて、丘は完成した。頂には土の器がめぐらされ、斜面は一面、河原の石で白く光っている。\nその頃、クワとニヒは、ささやかに夫婦になった。稲作の家と、土をこねる家が、一つの竪穴の家で暮らし始める。\nだが、夫役は終わらなかった。\n村の年寄りが言う。\n「王が代替わりするたび、前より大きな墓が要るそうな。東の国でも、西の国でも、同じ形の墓を築き始めたと聞く」\nクワはニヒと、生まれたばかりの子を見た。\n「おれたちの子や孫も、きっとまた土を運ぶのだろう。……だが、この墓の形は、この国がひとつだという印なんだと、大王の使いが言っていた」\nニヒは子をあやしながら、まだ見ぬ次の時代へ、そっと目をやった。", "note": "前方後円墳はこの後さらに巨大化し(5世紀の大王墓)、列島各地へ広がる。クワとニヒの婚姻は、中心と周辺の子孫が時代を追って交わっていくという長期構想上の創作。中心編 第五幕(次の時代への橋渡し)につながる。"}]}, {"id": "korean-peninsula-geography", "title": "朝鮮半島の地誌", "domain": "地理", "region": "東アジア", "headline": "大陸と列島をつなぐ回廊。山は東に偏り、平野と人は西に寄る", "eraLabel": "地理単元", "summary": "朝鮮半島は東側に太白山脈が背骨のように走り、川は西・南へ流れて黄海側に平野を作る。人口と農地はこの西岸・南岸の低地に集中する。半島は北で中国東北部・沿海州と陸続きになり、南は対馬海峡を隔てて日本列島に近い。このため大陸の文化・技術・人の流れを日本へ中継する位置にあり続けた。冬は大陸の寒気で厳しく冷え込み、北部は稲作の北限に近い。", "regionCode": "KR", "lat": 37, "lng": 127.5, "factLevel": "定説", "body": [{"label": "渡来のルート", "text": "水稲農耕、青銅器・鉄器、漢字、仏教などの多くが、中国から朝鮮半島を経由して日本列島へ伝わった。半島南部と北部九州は先史から連続した交流圏だった。", "source": ""}, {"label": "東高西低", "text": "険しい東岸には良港が少なく、なだらかな西岸に大河の河口平野と潮汐の大きい海岸が広がる。政治の中心も西側に置かれることが多かった。", "source": ""}], "relatedTopics": [{"concept": "japan-archipelago-geography", "relation": "地理的背景", "note": "対馬海峡をはさんで文化を受け渡す関係"}, {"concept": "wet-rice-farming-japan", "relation": "地理的背景", "note": "稲作は半島南部を経て北部九州へ"}, {"concept": "china-landforms-great-rivers", "relation": "関連", "note": "北で中国東北部と陸続き"}, {"concept": "yayoi-period", "relation": "地理的背景", "note": "半島経由の渡来が弥生社会を形づくった"}, {"concept": "mongol-invasions-of-japan", "relation": "関連", "note": "服属した高麗が艦隊建造と兵員を担った"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ02)", "ref": "data/wiki/sources/rekishi-02-east-asia-geography.md", "date": "2026-09-03"}], "tags": "朝鮮半島, 太白山脈, 対馬海峡, 回廊, 渡来ルート", "lastUpdated": "2026-09-03"}, {"id": "korean-war", "title": "朝鮮戦争", "domain": "世界史", "region": "東アジア", "startYear": 1950, "endYear": 1953, "eraLabel": "冷戦の代理戦争", "headline": "南北分断を固定化した東西の代理戦争", "summary": "1950年、北朝鮮が北緯38度線を越えて韓国に侵攻し勃発。アメリカ中心の国連軍が韓国を、中国の義勇軍とソ連の支援が北朝鮮を後押しする冷戦の代理戦争となり、1953年に休戦（平和条約は結ばれず今日も休戦状態）。日本には米軍向けの特需をもたらし復興を後押しした。", "factLevel": "定説", "body": [{"label": "経過", "text": "北朝鮮軍が一時ほぼ全土を制圧するが、国連軍の仁川上陸作戦で反攻。逆に中国国境近くまで攻め込んだところで中国義勇軍が参戦し、戦線は38度線付近で膠着した。"}, {"label": "日本への影響（朝鮮特需）", "text": "在日米軍基地からの物資調達・修理需要が日本経済に「朝鮮特需」をもたらし、戦後復興から高度経済成長への足がかりになった。同時にGHQは日本に警察予備隊（後の自衛隊）の設置を認めた。"}, {"label": "今も続く休戦", "text": "1953年の休戦協定は「戦争の一時停止」であり平和条約ではない。板門店を挟んで南北朝鮮は法的には今も戦争状態が続いている。"}], "relatedTopics": [{"concept": "cold-war", "relation": "具体例", "note": "米ソが直接戦わず代理国同士が戦った典型例"}, {"concept": "chinese-civil-war-and-prc", "relation": "因果", "note": "成立直後の中国が義勇軍を送り介入した"}, {"concept": "occupation-reforms-japan", "relation": "同時代", "note": "占領下の日本に朝鮮特需と再軍備のきっかけをもたらした"}, {"concept": "japan-postwar-economic-miracle", "relation": "因果", "note": "特需が復興から高度経済成長への転換点になった"}]}, {"id": "kushan-empire", "title": "クシャーナ朝", "domain": "世界史", "region": "南・東南アジア", "headline": "中央アジアの遊牧民が築いた、仏教と交易の十字路の帝国", "startYear": 30, "endYear": 375, "eraLabel": "1〜4世紀", "summary": "月氏の一支族クシャーンが1世紀にヒンドゥークシュ山脈の南北を統合。最盛期のカニシカ王（年代に諸説あり）のもと、中央アジアからガンダーラ、ガンジス中流域までを支配した。後漢・パルティア・インド諸王国・ローマ市場を結ぶ陸上交易の要衝を押さえ、金貨を大量発行。ガンダーラ美術と大乗仏教がここで育ち、隊商とともに中国へ伝わった。", "regionCode": "PK", "lat": 34.01, "lng": 71.54, "factLevel": "有力説", "body": [{"label": "月氏からクシャーナへ", "text": "匈奴に追われて中央アジアへ移った月氏のうち、クシャーン族が他の四翕侯を併せて王朝を樹立した。カニシカ王の即位年は西暦78年説・127年前後説などがあり、確定していない。", "source": "岩波講座 世界歴史"}, {"label": "交易の十字路", "text": "クシャーナ領はインド（海路でローマへ）・中国（陸のシルクロード）・パルティア（西方）の交通が交わる場所にあり、ローマ金貨をまねた良質の金貨を発行した。南インドではローマ金貨の退蔵が多数出土している。", "source": "エリュトラー海案内記（関連）"}, {"label": "仏教美術と大乗仏教", "text": "ガンダーラでは、ギリシア・ローマ彫刻の写実技法で初めて仏像が刻まれた。菩薩信仰を核とする大乗仏教がこの地で体系化し、西域の僧を介して後漢末〜三国期の中国へ伝わっていった。", "source": "詳説世界史"}], "relatedTopics": [{"concept": "maurya-empire", "relation": "継承", "note": "インド北西部・ガンダーラの後継勢力"}, {"concept": "buddhism-jainism-birth", "relation": "継承", "note": "大乗仏教と仏像表現がここで育った"}, {"concept": "hellenistic-world", "relation": "継承", "note": "ギリシア様式の彫刻技法（ガンダーラ美術）"}, {"concept": "silk-road-trade", "relation": "地理的背景", "note": "インド・中国・ローマを結ぶ陸の結節点"}, {"concept": "later-han-and-three-kingdoms", "relation": "同時代", "note": "仏教東伝の担い手"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 07 直接生成 / rekishi-07-ancient-empires-peak.md", "date": "2026-09-03"}], "tags": "クシャーナ 月氏 カニシカ ガンダーラ美術 大乗仏教", "lastUpdated": "2026-09-03"}, {"id": "kyoto-monuments", "title": "古都京都の文化財", "domain": "日本史", "region": "日本", "headline": "古都京都の文化財＝17か所の寺社・城を束ねた『分散型』の世界遺産", "summary": "京都市・宇治市・大津市にまたがる17件の資産（清水寺、金閣寺、二条城、平等院、延暦寺など）をまとめて1件の世界遺産にしたもの。794年の平安京遷都から近世まで、日本の木造建築と庭園文化が連続的に発展した中心地であることが評価された。個々の建物ではなく『都市が育てた文化の総体』を守る構成。", "isWorldHeritage": true, "relatedTopics": [{"concept": "registration-criteria", "relation": "テーマ"}, {"concept": "outstanding-universal-value", "relation": "テーマ", "note": "木造建築の『真正性』論の当事国"}, {"concept": "venice-and-its-lagoon", "relation": "類似", "note": "都市全体を守る発想"}, {"concept": "heian-early-period", "relation": "因果", "note": "794年の平安京遷都に始まる千年の都の文化財"}, {"concept": "nara-period", "relation": "関連", "note": "前代の平城京から都と寺院文化を受け継ぐ"}, {"concept": "fujiwara-regency", "relation": "因果", "note": "平等院鳳凰堂（宇治）は摂関期・浄土教の代表建築として構成資産に含まれる"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "日本, 木造建築, 庭園, シリアル遺産, 世界遺産", "lastUpdated": "2026-09-03", "startYear": 794, "endYear": 1868, "eraLabel": "平安〜江戸", "regionCode": "26", "lat": 35.03, "lng": 135.79, "body": [{"label": "『シリアル・ノミネーション』", "text": "複数の物件を1件の遺産としてまとめて登録する方式。白川郷・五箇山、明治日本の産業革命遺産、北海道・北東北の縄文遺跡群なども同じ形。", "source": "パイロット"}, {"label": "バッファゾーンと景観", "text": "資産そのものは守られても、周辺の高層建築や眺望が課題。京都市は独自の高さ規制・屋外広告規制を敷いている。", "source": "パイロット"}], "country": "日本", "whType": "文化遺産", "inscriptionYear": 1994, "whCriteria": "ii, iv", "whStatus": "登録", "ouv": "(ii)日本の建築・造園への決定的な影響、(iv)各時代の宗教建築と庭園の傑出した見本。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Kinkakuji_2004-09-21.jpg/960px-Kinkakuji_2004-09-21.jpg", "imageCredit": "Keith Pomakis / CC BY-SA 2.5", "imageLink": "https://commons.wikimedia.org/wiki/File:Kinkakuji_2004-09-21.jpg"}, {"id": "later-han-and-three-kingdoms", "title": "後漢と三国時代", "domain": "世界史", "region": "東アジア", "headline": "王莽の簒奪をはさんで漢が復活し、黄巾の乱を経て魏・呉・蜀へ割れた", "startYear": 25, "endYear": 280, "eraLabel": "25〜280年", "summary": "前漢を簒奪した新（8〜23年）が15年で崩れ、25年に劉秀（光武帝）が漢を再興した（後漢、都・洛陽）。1世紀末には班超が西域を服属させ交易路を確保。2世紀後半、宦官と外戚の争い・184年の黄巾の乱で後漢は瓦解し、220年に滅亡、魏・呉・蜀の三国時代に入る。280年、魏を継いだ西晋が呉を滅ぼしていったん再統一する。", "regionCode": "CN", "lat": 34.62, "lng": 112.45, "factLevel": "定説", "body": [{"label": "後漢の再興と西域経営", "text": "光武帝は豪族連合を基盤に漢を立て直した。1世紀末、班超は少数の兵と外交でオアシス諸国を服属させ、97年には甘英を大秦（ローマ）へ派遣した（ペルシア湾岸で引き返したと伝わる）。これで陸のシルクロードが再び安定した。", "source": "詳説世界史"}, {"label": "崩壊と三国分裂", "text": "外戚と宦官の権力闘争、党錮の禁で中央が麻痺し、184年に太平道の張角が黄巾の乱を起こす。鎮圧のために各地の軍閥が自立し、220年に曹丕が献帝から禅譲を受けて後漢は名実ともに滅んだ。", "source": "岩波日本史辞典（関連項目）"}, {"label": "倭との接触", "text": "魏は朝鮮半島の楽浪・帯方郡を通じて倭と交渉し、239年に卑弥呼へ『親魏倭王』の称号を与えた。三国分裂期の中国が、統合に向かう倭と外交関係を結んだ点が対照的である。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "han-empire", "relation": "継承", "note": "新の簒奪をはさんで漢が復活（前漢→後漢）"}, {"concept": "silk-road-trade", "relation": "因果", "note": "班超の西域経営が交易路を再び開いた"}, {"concept": "yamatai-himiko", "relation": "同時代", "note": "239年、魏が卑弥呼に称号と銅鏡を授ける"}, {"concept": "wa-in-chinese-records", "relation": "継承", "note": "『後漢書』が57年の倭の朝貢と金印を記す"}, {"concept": "kushan-empire", "relation": "同時代", "note": "西域経由で仏教が中国へ入り始める"}, {"concept": "kofun-emergence", "relation": "対比", "note": "中国は分裂、倭は前方後円墳の広がりで統合へ"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 07 直接生成 / rekishi-07-ancient-empires-peak.md", "date": "2026-09-03"}], "tags": "後漢 光武帝 班超 黄巾の乱 三国 魏 呉 蜀 西晋", "lastUpdated": "2026-09-03"}, {"id": "latin-american-independence", "title": "ラテンアメリカ諸国の独立", "domain": "世界史", "region": "南北アメリカ", "headline": "ナポレオンの半島占領が引き金となり、次々に独立国が生まれた", "startYear": 1808, "endYear": 1826, "eraLabel": "19世紀前半", "summary": "1808年、ナポレオンがスペイン・ポルトガル本国を占領し王を廃したことで、中南米植民地における本国の統制が事実上失われた。シモン・ボリバルやサン・マルティンらの指導のもと、クリオーリョ(現地生まれの白人)を中心とする独立運動が各地で展開し、1810年代から20年代にかけてアルゼンチン・チリ・大コロンビア・メキシコ・ブラジルなど大半の地域が独立を達成した。しかし独立後も広大な旧植民地は複数の国家に分裂し、クリオーリョ支配層による社会構造(先住民・黒人の従属的地位)は大きくは変わらなかった。", "factLevel": "定説", "body": [{"label": "ナポレオンの半島占領という引き金", "text": "1808年のナポレオンによるスペイン王廃位・傀儡王擁立は本国の正統性を揺るがし、植民地エリートが自治・独立を志向する契機となった。", "source": "MulmoClaude"}, {"label": "ボリバルとサン・マルティンの解放戦争", "text": "シモン・ボリバルは大コロンビア方面、サン・マルティンはアルゼンチン・チリ・ペルー方面で解放戦争を主導し、1820年代半ばまでに南米本土の大半が独立した。", "source": "MulmoClaude"}, {"label": "独立後の分裂と社会構造の連続性", "text": "大コロンビアなど広域国家は独立後まもなく複数国に分裂し、先住民・黒人・混血層の従属的な社会構造は独立後も大きくは変わらなかった。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "napoleonic-era", "relation": "因果", "note": "本国占領による統制の空白が独立運動を可能にした"}, {"concept": "american-independence", "relation": "継承", "note": "近代共和国というモデルが先行事例として参照された"}, {"concept": "aztec-empire", "relation": "地理的背景", "note": "かつてのメソアメリカ文明圏がメキシコ独立運動の舞台となった"}, {"concept": "inca-empire", "relation": "地理的背景", "note": "かつてのインカ帝国領がペルー・ボリビア独立運動の舞台となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近代,ラテンアメリカ,独立運動,南北アメリカ", "lastUpdated": "2026-09-04"}, {"id": "levant-geography", "title": "レヴァント（東地中海岸）の地誌", "domain": "地理", "region": "西アジア・中東", "headline": "海と砂漠にはさまれた細長い回廊。大国の間の通り道", "eraLabel": "地理単元", "summary": "レヴァントは地中海と内陸の砂漠・山地にはさまれた南北に細長い低地で、現在のシリア・レバノン・イスラエル・パレスチナ・ヨルダン西部にあたる。海岸平野・山地・地溝（ヨルダン地溝帯）・砂漠縁が東西に狭く並ぶ。エジプトとメソポタミアという二大文明を結ぶ唯一の陸路にあたり、隊商路と軍隊が絶えず往来した。海に開けた北部にはフェニキアの港市が、内陸縁にはオアシス都市が発達した。", "regionCode": "LB", "lat": 33.5, "lng": 35.5, "factLevel": "定説", "body": [{"label": "二大文明の架け橋", "text": "『肥沃な三日月地帯』の西半分。エジプト新王国とヒッタイト／ミタンニ／アッシリアがこの地の支配権を争い続けた。", "source": ""}, {"label": "フェニキアの海", "text": "レバノン山地のレバノン杉と天然の良港が、地中海交易とアルファベットを生む基盤になった。", "source": ""}, {"label": "南北の道", "text": "海岸沿いの『海の道』と内陸の『王の道』が南北に走り、都市はこの街道の結節点に立地した。", "source": ""}], "relatedTopics": [{"concept": "mesopotamia-geography", "relation": "関連", "note": "肥沃な三日月地帯の西の端。南東の端が沖積平野"}, {"concept": "ancient-egypt-old-to-new", "relation": "地理的背景", "note": "エジプトが北方へ勢力を伸ばす際の通り道"}, {"concept": "assyrian-empire", "relation": "地理的背景", "note": "強制移住と征服の対象になった西方の交易地帯"}, {"concept": "fertile-crescent", "relation": "関連", "note": "弧の西端にあたる地中海岸"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ04)", "ref": "data/wiki/sources/rekishi-04-west-asia-geography.md", "date": "2026-09-03"}], "tags": "レヴァント, フェニキア, レバノン杉, ヨルダン地溝帯, 海の道", "lastUpdated": "2026-09-03"}, {"id": "machu-picchu", "title": "マチュ・ピチュの歴史保護区", "domain": "世界史", "region": "南北アメリカ", "headline": "マチュ・ピチュ＝スペイン人に『見つからなかった』ことが価値になったインカ都市", "summary": "標高約2400mのアンデス山中に築かれたインカの王領・宗教都市。15世紀半ばに造営され、16世紀のスペイン征服前後に放棄された。征服者に知られず破壊を免れたため、石組み・段々畑・水路がほぼ完全な姿で残る。1911年に米国人ハイラム・ビンガムが世界へ紹介した。文化と自然の両面をもつ複合遺産。", "isWorldHeritage": true, "relatedTopics": [{"concept": "angkor", "relation": "類似", "note": "密林・山中に眠り、近代に本格調査された大遗跡"}, {"concept": "danger-list", "relation": "関連", "note": "観光圧で危機遗産入りが議論される"}, {"concept": "registration-criteria", "relation": "テーマ", "note": "複合遗産の代表例"}, {"concept": "inca-empire", "relation": "具体例", "note": "インカ帝国が築いた標高2400mの都市遺跡、スペイン人に発見されなかった"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "複合遺産, インカ, 観光圧, 山岳, 世界遺産", "lastUpdated": "2026-09-03", "startYear": 1450, "endYear": 1540, "eraLabel": "15世紀（インカ帝国）", "regionCode": "PE", "lat": -13.163, "lng": -72.545, "body": [{"label": "複合遺産である理由", "text": "インカの建築・農業技術（文化）と、アンデスの生態系（自然）の両方が評価された。複合遺産は世界で40件ほどしかない。", "source": "パイロット"}, {"label": "オーバーツーリズム", "text "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 09 直接生成 / rekishi-09-south-southeast-asia-geography.md", "date": "2026-09-03"}], "tags": "東南アジア 大陸部 島嶼部 メコン川 マラッカ海峡 スンダ列島 香料諸島 アンコール インド化", "lastUpdated": "2026-09-03"}, {"id": "maurya-empire", "title": "マウリヤ朝とアショーカ王", "domain": "世界史", "region": "南・東南アジア", "headline": "インド亜大陸をほぼ初めて統一し、征服王が仏教で統治理念を転換した", "startYear": -322, "endYear": -185, "eraLabel": "前4〜前2世紀", "summary": "アレクサンドロス撤退後の混乱の中、チャンドラグプタ・マウリヤがガンジス流域のマガダ国を奪って前322年頃に建国し、北西インドのギリシア勢力も退けて亜大陸の大部分を統一した。孫のアショーカ王は南部カリンガ征服の惨状を悔い、ダルマ（法・倫理）による統治を掲げ、仏教を保護して各地に石柱・磨崖の詔勅を刻んだ。官僚制・スパイ網・幹線道路を備えた中央集権国家だったが、アショーカの死後は急速に分裂し前185年に滅んだ。", "factLevel": "定説", "body": [{"label": "統一の条件", "text": "ガンジス中流の鉄・米の生産力とマガダの軍事力、アレクサンドロス東征が残した政治的空白が重なった。", "source": ""}, {"label": "アショーカの詔勅", "text": "帝国各地の岩や石柱に複数言語で倫理の教えを刻んだ。仏教が地方宗教から広域宗教へ広がる転機になった。", "source": ""}, {"label": "短い統一", "text": "広大な多言語地域を1代の個人的統率で束ねたため、王権が弱まると地方勢力が離反した。", "source": ""}], "relatedTopics": [{"concept": "alexander-eastern-campaign", "relation": "因果", "note": "東征後の空白と接触がマウリヤ統一を促した"}, {"concept": "buddhism-jainism-birth", "relation": "継承", "note": "ガンジス都市で生まれた仏教が、アショーカの保護で亜大陸全体へ"}, {"concept": "hellenistic-world", "relation": "同時代", "note": "西のヘレニズム諸王国と使節を交換した"}, {"concept": "yayoi-period", "relation": "同時代", "note": "前3世紀のアショーカ王の頃、日本は弥生中期"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ05)", "ref": "data/wiki/sources/rekishi-05-classical-antiquity.md", "date": "2026-09-03"}], "tags": "マウリヤ朝, チャンドラグプタ, アショーカ王, ダルマ, 磨崖詔勅, マガダ", "lastUpdated": "2026-09-03"}, {"id": "maya-civilization", "title": "マヤ文明", "domain": "世界史", "region": "南北アメリカ", "headline": "統一されない都市国家群が、独自の文字と精密な天文学を発達させた", "startYear": -1000, "endYear": 1697, "eraLabel": "先古典期〜スペイン征服まで", "summary": "マヤは、ユカタン半島とグアテマラの熱帯林に、統一されない多数の都市国家（ティカル、カラクムル、パレンケなど）を営んだ。古典期（3〜9世紀）に石碑・神殿・宮殿の建設がピークを迎え、独自の表音表意文字を完成させ、ゼロの概念を含む位取り記数法と精密な天文観測を発達させた。9世紀に南部の諸都市が相次いで放棄される「古典期マヤの崩壊」が起き、干ばつ・農地の疲弊・都市間の戦争・政治体制の限界などが複合した原因と考えられている。ただしマヤ社会が消えたわけではなく、北部の都市が後古典期に栄え、スペイン到来時にも小王国が存続していた。", "regionCode": "GT", "lat": 17.22, "lng": -89.62, "factLevel": "有力説", "body": [{"label": "文字と暦の完成度", "text": "音と意味を組み合わせた文字体系で王の事績を石碑に刻み、金星の動きを精密に観測して暦に組み込んだ。旧大陸と接触せずに、これほど精緻な天文・数学の体系を築いた点が際立つ。", "source": "batch 15 直接生成"}, {"label": "古典期の崩壊の謎", "text": "9世紀、南部の大都市が次々と放棄され新たな建造がやんだ。単一の原因ではなく、干ばつ・人口過密による環境の疲弊・都市間戦争・支配体制のゆらぎが重なった結果と考えられている。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "mesoamerica-geography", "relation": "地理的背景", "note": "石灰岩の半島とセノーテがマヤ都市の立地を決めた"}, {"concept": "birth-of-writing", "relation": "対比", "note": "旧大陸の文字発明とは無関係に、独自の表音表意文字体系を発達させた"}, {"concept": "pre-columbian-isolation", "relation": "テーマ", "note": "旧大陸から隔絶した条件のもとで独自に発展した高度な文明の一つ"}, {"concept": "age-of-exploration", "relation": "同時代", "note": "スペイン人到来のころには古典期はすでに終わり、北部の小王国群が残っていた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "マヤ,ティカル,古典期,暦法,天文学", "lastUpdated": "2026-09-04"}, {"id": "mediterranean-world-geography", "title": "地中海世界の地誌", "domain": "地理", "region": "ヨーロッパ", "headline": "陸に囲まれた穏やかな内海が、三大陸の岸を一つの世界に結んだ", "eraLabel": "地理単元", "summary": "地中海はヨーロッパ・アジア・アフリカに囲まれた閉じた内海で、潮の干満が小さく、夏は乾いて晴れ、冬に雨が降る（地中海性気候）。この気候はオリーブ・ぶどう・小麦の栽培に向き、その北限がヨーロッパの南北を分ける文化境界になった。半島（イベリア・イタリア・バルカン）と島（シチリア・クレタ・キプロス）が多く、陸路より海路が速く安全だったため、沿岸都市どうしが密に交易・植民した。ジブラルタル海峡が大西洋への唯一の出口である。", "regionCode": "IT", "lat": 38, "lng": 15, "factLevel": "定説", "body": [{"label": "海が結び、山が隔てる", "text": "沿岸は険しい山が背後に迫り内陸との往来は難しい。かわりに港から港への航海が容易で、文明は『点（港市）』の連なりとして広がった。", "source": ""}, {"label": "オリーブラインの意味", "text": "オリーブが育つ範囲＝地中海式生活の範囲。ローマ帝国の版図もほぼこの線と重なった。", "source": ""}, {"label": "植民の海", "text": "フェニキア人・ギリシア人が沿岸各地に姉妹都市を築き、のちにローマが『我らの海（マレ・ノストルム）』として一円支配した。", "source": ""}], "relatedTopics": [{"concept": "greek-polis-formation", "relation": "地理的背景", "note": "海路で結ばれた沿岸に植民市が並んだ"}, {"concept": "roman-republic", "relation": "地理的背景", "note": "オリーブラインとほぼ重なる範囲を一円支配した"}, {"concept": "levant-geography", "relation": "関連", "note": "地中海の東岸がレヴァント"}, {"concept": "aegean-bronze-age", "relation": "地理的背景", "note": "島と半島の海で宮殿文明が栄えた"}, {"concept": "venice-and-its-lagoon", "relation": "具体例", "note": "内海交易を独占した海洋都市国家の首都"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ06)", "ref": "data/wiki/sources/rekishi-06-europe-geography.md", "date": "2026-09-03"}], "tags": "地中海, 地中海性気候, オリーブ, 半島, ジブラルタル海峡, マレ・ノストルム", "lastUpdated": "2026-09-03"}, {"id": "meiji-constitution-and-modernization", "title": "明治の近代化と大日本帝国憲法", "domain": "日本史", "region": "日本", "headline": "岩倉使節団の衝撃から大日本帝国憲法まで、上からの近代化を急いだ", "startYear": 1871, "endYear": 1890, "eraLabel": "明治前期", "summary": "1871〜73年の岩倉使節団は欧米との国力差を痛感させ、「殖産興業・富国強兵」路線を加速させた。徴兵令・地租改正などの近代化政策と並行して自由民権運動が高まり、1889年にプロイセン憲法を範とする大日本帝国憲法が発布、1890年に帝国議会が開設された。", "regionCode": "JP", "lat": 35.6762, "lng": 139.6503, "factLevel": "定説", "body": [{"label": "岩倉使節団(1871-73)", "text": "岩倉具視を全権大使とする使節団が欧米を視察し、条約改正の困難と国力差を痛感して帰国、近代化政策を加速させた。", "source": "MulmoClaude"}, {"label": "殖産興業と地租改正", "text": "官営工場の設立、徴兵令(1873)、地租改正(1873)により近代的な財政・軍事基盤が整備された。", "source": "MulmoClaude"}, {"label": "大日本帝国憲法(1889)", "text": "自由民権運動の圧力と天皇の権威を軸にした国家統合という要請の妥協点として、プロイセン型の欽定憲法が発布され、1890年に帝国議会が開設された。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "meiji-restoration", "relation": "継承", "note": "廃藩置県後の中央集権国家を土台にさらに近代化を進めた"}, {"concept": "german-unification", "relation": "関連", "note": "大日本帝国憲法はプロイセン憲法を直接のモデルとした"}, {"concept": "qing-late-reform-and-decline", "relation": "対比", "note": "同じ立憲君主制を模索しながら、日本は成功し清は失敗した"}, {"concept": "first-sino-japanese-war", "relation": "継承", "note": "近代化を終えた国力が日清戦争の勝利につながった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "明治,岩倉使節団,大日本帝国憲法,殖産興業,日本史", "lastUpdated": "2026-09-05"}, {"id": "meiji-restoration", "title": "明治維新", "domain": "日本史", "region": "日本", "headline": "黒船来航から廃藩置県まで、260年の幕藩体制が18年で解体された", "startYear": 1853, "endYear": 1871, "eraLabel": "幕末〜明治初期", "summary": "1853年のペリー来航を契機に、260年余り続いた幕藩体制の矛盾が噴出した。尊皇攘夷運動から倒幕運動へと転じ、1867年の大政奉還、1868〜69年の戊辰戦争を経て旧幕府勢力は一掃された。1871年の廃藩置県で藩は消滅し、中央集権的な近代国家の骨格が18年という短期間で作られた。", "regionCode": "JP", "lat": 35.6762, "lng": 139.6503, "factLevel": "定説", "body": [{"label": "黒船来航(1853)と開国", "text": "ペリー率いる艦隊の来航が幕府の権威を揺るがし、1854年の日米和親条約で開国。以降、尊皇攘夷運動が高まった。", "source": "MulmoClaude"}, {"label": "大政奉還と戊辰戦争", "text": "1867年、徳川慶喜が政権を朝廷に返上(大政奉還)。王政復古の大号令ののち、1868〜69年の戊辰戦争で旧幕府勢力・奥羽越列藩同盟が一掃された。", "source": "MulmoClaude"}, {"label": "廃藩置県(1871)", "text": "版籍奉還に続き藩を廃止し府県を置く廃藩置県が断行され、中央集権的な統治機構が確立した。260年続いた幕藩体制の解体はわずか18年で完了した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "bakumatsu-prelude-and-foreign-pressure", "relation": "継承", "note": "異国船の接近と幕府の動揺という開国前夜からの直接の帰結"}, {"concept": "sakoku-policy", "relation": "継承", "note": "鎖国体制の完全な終焉として位置づけられる"}, {"concept": "german-unification", "relation": "同時代", "note": "旧体制解体と近代国家建設が同じ19世紀後半に世界各地で進行した一例"}, {"concept": "us-civil-war-and-reconstruction", "relation": "同時代", "note": "国家統一・再編を武力で決着させた点で並行する"}, {"concept": "meiji-constitution-and-modernization", "relation": "継承", "note": "廃藩置県後の中央集権国家がさらに近代化を進める段階"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "明治維新,幕末,黒船,廃藩置県,日本史", "lastUpdated": "2026-09-05"}, {"id": "mesoamerica-geography", "title": "メソアメリカの地誌（メキシコ高原とユカタン）", "domain": "地理", "region": "南北アメリカ", "headline": "火山に囲まれた高原と、水のない石灰岩の半島に文明が育った", "summary": "メソアメリカは現在のメキシコ中部から中米北部にかけての文化圏を指す。中央には標高2000m級のメキシコ高原があり、周囲を火山に囲まれた盆地に大都市が営まれた。東のユカタン半島は石灰岩の平坦な低地で地表を流れる川がほとんどなく、水は地下の陥没穴と貯水池に頼る。共通の要素として、トウモロコシ・豆・カボチャの栽培、二つの暦を組み合わせた暦法、絵文字による記録、ピラミッド型の神殿がある。鉄器・車輪の実用利用・大型家畜を欠いたまま、これだけの都市文明を築いた点が特筆される。", "regionCode": "MX", "lat": 19.4, "lng": -99.1, "factLevel": "定説", "body": [{"label": "水のない半島", "text": "ユカタン半島は石灰岩でできており雨水がすぐ地下に浸透してしまうため、地表の川や湖がほとんどない。人々は地下水がむき出しになった陥没穴（セノーテ）を水源とし、これは聖なる場所ともされた。", "source": "batch 15 直接生成"}, {"label": "トウモロコシという基盤作物", "text": "トウモロコシ・豆・カボチャの組み合わせは互いの生育を助け合い栄養も補い合う、メソアメリカ農業の基本セットとなった。この作物の余剰が都市と神殿を支える人口を養った。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "maya-civilization", "relation": "地理的背景", "note": "ユカタン半島の石灰岩地帯とセノーテがマヤ都市の立地を決めた"}, {"concept": "aztec-empire", "relation": "地理的背景", "note": "メキシコ高原の湖上にテノチティトランが築かれた"}, {"concept": "fertile-crescent", "relation": "対比", "note": "鉄器・車輪・大型家畜を欠いたまま都市文明を築いた対照的な事例"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "メソアメリカ,ユカタン半島,セノーテ,メキシコ高原", "lastUpdated": "2026-09-04"}, {"id": "mesopotamia-early-civilization", "title": "メソポタミア文明の成立（シュメール〜古バビロニア）", "domain": "世界史", "region": "西アジア・中東", "headline": "灌漑・都市・文字・法典が一度にそろって現れた沖積平野", "startYear": -3500, "endYear": -1595, "eraLabel": "前4千年紀〜前16世紀", "summary": "前3500年頃、ティグリス・ユーフラテス下流の沖積平野にウルクなどのシュメール都市国家が生まれた。神殿を中心に灌漑農業を組織し、記録のために楔形文字を発明、車輪・青銅器・60進法も使われた。前24世紀にはアッカドのサルゴンが最初の「帝国」を築き、以後ウル第三王朝、アムル人の古バビロニア（ハンムラビ王）と支配者が交替した。前1595年にヒッタイトの略奪でバビロン第一王朝が倒れる。", "regionCode": "IQ", "lat": 31.32, "lng": 45.64, "factLevel": "定説", "body": [{"label": "都市国家の仕組み", "text": "各都市は守護神の神殿（ジッグラト）と、それに仕える王・神官団が統治した。粘土板の帳簿で穀物・家畜・労働力を管理し、余剰は交易や戦争の原資になった。都市どうしは水利権をめぐって頻繁に争った。", "source": ""}, {"label": "ハンムラビ法典", "text": "前18世紀、古バビロニアのハンムラビが発布。「目には目を」の同害報復で知られるが、身分によって刑罰が異なり、契約・家族・商取引まで広く定めた成文法として画期的だった。", "source": ""}, {"label": "開かれた地形の宿命", "text": "石材も木材も乏しく交易に依存し、平坦で自然の防壁がないため征服が繰り返された。この「通り道」の性格は、のちのアッシリア・アケメネス朝・アレクサンドロスの時代まで続く。", "source": ""}], "relatedTopics": [{"concept": "neolithic-revolution", "relation": "因果", "note": "農耕の余剰が神殿都市を支えた"}, {"concept": "mesopotamia-geography", "relation": "地理的背景", "note": "乾燥沖積平野の灌漑と、防御困難な地形"}, {"concept": "birth-of-writing", "relation": "関連", "note": "楔形文字は神殿の帳簿から始まった"}, {"concept": "ancient-egypt-old-to-new", "relation": "対比", "note": "同じ大河文明でも、閉じた地形のエジプトは安定、開けたメソポタミアは興亡が激しい"}, {"concept": "jomon-period", "relation": "同時代", "note": "ウルクに都市が生まれた頃、日本は縄文時代"}, {"concept": "achaemenid-persia", "relation": "継承", "note": "千年後、同じ土地がペルシア帝国の経済的中枢になる"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "シュメール, アッカド, バビロニア, 楔形文字, ハンムラビ法典", "lastUpdated": "2026-09-03"}, {"id": "mesopotamia-geography", "title": "メソポタミアの地誌", "domain": "地理", "region": "西アジア・中東", "headline": "乾いた沖積平野。灌漑がなければ何も実らず、守るものもない土地", "eraLabel": "地理単元", "summary": "ティグリス川とユーフラテス川が運ぶ土砂が作った広大な沖積平野。年降水量は南部で200mm前後と少なく、農業は両河の水を引く灌漑に全面的に依存する。石材・木材・金属をほとんど産まず、これらは交易で得るしかなかった。平坦で自然の障壁がなく、四方から征服を受けやすい『通り道』の地形でもある。", "regionCode": "IQ", "lat": 33, "lng": 44, "factLevel": "定説", "body": [{"label": "灌漑という宿命", "text": "上流の融雪で春に増水し、作付け期の夏は水が乏しい。人工的な貯水と水路網、その維持管理の組織が、早くから集権的な国家を要求した。", "source": ""}, {"label": "開かれた地形", "text": "砂漠と山地の縁はあるが平野内部に防御線がなく、アッカド・バビロン・アッシリア・ペルシア・マケドニアと支配者が次々に替わった。", "source": ""}, {"label": "三日月のかなめ", "text": "『肥沃な三日月地帯』の南の端にあたり、北の丘陵では雨で麦が実るのに対し、ここは灌漑がなければ一粒も実らない。その代わり沖積土は肥沃で、水さえ引けば大きな人口を養えた。", "source": ""}], "relatedTopics": [{"concept": "achaemenid-persia", "relation": "地理的背景", "note": "乾燥沖積平野の灌漑農業が帝国の富を支えた"}, {"concept": "alexander-eastern-campaign", "relation": "地理的背景", "note": "開けた平野は防御が難しく、征服の通り道になった"}, {"concept": "fertile-crescent", "relation": "関連", "note": "三日月の南端。北の天水農業帯に対し灌漑に全面依存"}, {"concept": "iranian-plateau-geography", "relation": "対比", "note": "山の水をカナートで引く高原と、大河の水を運河で引く平野"}, {"concept": "levant-geography", "relation": "関連", "note": "肥沃な三日月地帯の東西の両端"}], "sourceArticles": [{"sourceName": "パイロット(MulmoClaude手動作成)", "date": "2026-09-03"}], "tags": "メソポタミア, 沖積平野, 灌漑, ティグリス, ユーフラテス", "lastUpdated": "2026-09-03"}, {"id": "middle-east-wars-and-israel", "title": "中東戦争とイスラエル建国", "domain": "世界史", "region": "西アジア・中東", "startYear": 1948, "endYear": 1973, "eraLabel": "中東紛争の起点", "headline": "イスラエル建国から4次にわたる戦争へ", "summary": "1948年、ユダヤ人国家イスラエルがパレスチナの地に建国を宣言すると同時に周辺アラブ諸国と第一次中東戦争が勃発。以後1973年の第四次中東戦争まで断続的に戦争が起き、多数のパレスチナ難民を生んだ。第四次中東戦争はオイルショックの引き金にもなった。", "factLevel": "定説", "body": [{"label": "建国の背景", "text": "ホロコースト後の国際世論とシオニズム運動（ユダヤ人の故郷再建を求める運動）を背景に、国連がパレスチナ分割案を可決。1948年にイスラエルが独立を宣言すると即座に周辺アラブ諸国が侵攻した。"}, {"label": "パレスチナ難民問題", "text": "戦争のたびに多数のパレスチナ・アラブ人が故郷を追われ難民となり、周辺国のキャンプでの生活を強いられた。この未解決の難民問題が現在まで続く紛争の核心にある。"}, {"label": "第四次中東戦争と石油", "text": "1973年の第四次中東戦争でアラブ産油国が石油輸出を制限・値上げする「石油戦略」を発動、これが第一次オイルショックの引き金となり世界経済に打撃を与えた。"}], "relatedTopics": [{"concept": "decolonization", "relation": "具体例", "note": "イギリス委任統治の終了と独立問題が戦争の直接の引き金"}, {"concept": "oil-crisis-and-stable-growth", "relation": "因果", "note": "第四次中東戦争のアラブ産油国の石油戦略がオイルショックを引き起こした"}, {"concept": "cold-war", "relation": "テーマ", "note": "米ソがそれぞれイスラエル・アラブ側を支援する代理対立の一面もあった"}]}, {"id": "ming-dynasty-and-zheng-he", "title": "明朝と鄭和の南海遠征", "domain": "世界史", "region": "東アジア", "headline": "朝貢体制を再建し、一時は大艦隊をインド洋へ送ったがやがて内向きに", "startYear": 1368, "endYear": 1644, "eraLabel": "14〜17世紀", "summary": "紅巾の乱の中から台頭した朱元璋（洪武帝）は1368年に明を建国し、元を長城以北へ追った。皇帝がみずから全ての政務を統括する独裁体制を敷き、民間の海上交易を禁じて（海禁）貿易を国家管理の朝貢に限った。第3代永楽帝は都を北京へ移し、皇帝の側近であるムスリムの鄭和に7回の大航海（1405〜1433年）を命じた。100隻超・2万人規模の艦隊は東南アジア・インド・アラビア・アフリカ東岸まで到達したが、財政負担と北方優先の官僚の反対で中止され、以後明は内向きに転じた。16世紀には北のモンゴル（北虜）と南方沿岸を脅かす海賊集団（南倭）に悩み、長城を現在見られる姿に大改修した。", "regionCode": "CN", "lat": 32.06, "lng": 118.8, "factLevel": "定説", "body": [{"label": "海禁と朝貢体制", "text": "民間の自由な海外貿易を禁じ、周辺諸国の君主が使節と献上物を送り、明が回賜を与える形式に貿易を一元化した。日本の勘合貿易もこの枠組みの中にある。", "source": "batch 14 直接生成"}, {"label": "鄭和の遠征が続かなかった理由", "text": "遠征は領土獲得ではなく威信の誇示と朝貢の勧誘が目的で、直接の経済的見返りは乏しかった。皇帝側近が主導する事業を科挙官僚が嫌い、北方国境の防衛に資源を回すべきだとした。", "source": "batch 14 直接生成"}, {"label": "16世紀の銀と一条鞭法", "text": "日本（石見）とアメリカ（ポトシ）の銀が大量に流入し、税を銀に一本化して納めさせる一条鞭法が広まった。明経済は世界の銀の流れに組み込まれた。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "yuan-dynasty", "relation": "継承", "note": "紅巾の乱の中から朱元璋が元を長城以北へ追った"}, {"concept": "age-of-exploration", "relation": "対比", "note": "鄭和の遠征は1433年に中止、中国が海から退いたのと入れ替わりにヨーロッパが海へ出た"}, {"concept": "indian-ocean-maritime-trade", "relation": "関連", "note": "鄭和艦隊は既存のインド洋交易網を航行した"}, {"concept": "muromachi-shogunate", "relation": "同時代", "note": "足利義満が明と勘合貿易を始めた（1404）"}, {"concept": "silk-road-trade", "relation": "対比", "note": "陸の交易より海禁と朝貢を優先した"}, {"concept": "great-wall-of-china", "relation": "テーマ", "note": "現在観光で見る石積みの長城は、明が16世紀に北虜（モンゴル）対策で大改修したもの"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "明,洪武帝,永楽帝,鄭和,海禁,朝貢,銀", "lastUpdated": "2026-09-04"}, {"id": "moated-settlements-yayoi", "title": "環濠集落の成立（弥生早期〜前期）", "domain": "日本史", "region": "日本", "headline": "濠をめぐらせ、蓄えを守る。争いとともに「クニ」への分化が始まった", "startYear": -800, "endYear": -400, "eraLabel": "弥生時代早期〜前期", "summary": "北部九州（板付・菜畑など）で始まった水田稲作は、前期のうちに西日本へ広がった。ムラは周囲に濠をめぐらせた環濠集落となり、収穫物を高床倉庫に蓄えた。余剰と貯蔵は、それを管理する有力者と、水利や土地をめぐるムラ同士の争いを生む。矢じりの刺さった人骨や防御的な立地の集落が増えるのはこの時期からで、のちの「クニ」へ向かう社会分化の出発点になった。弥生開始年代には前10世紀説〜前5世紀説の幅がある。", "regionCode": "JP", "lat": 33.6, "lng": 130.42, "factLevel": "有力説", "body": [{"label": "濠が語るもの", "text": "環濠は排水・区画の役割もあるが、集落を囲む深い濠と土塁は防御施設でもある。守るべき蓄えができ、奪おうとする相手がいた——定住農耕社会の負の側面が形になった。", "source": ""}, {"label": "東へ広がる稲作", "text": "前期のうちに稲作は近畿・東海へ達した。地域ごとに在来の縄文的な生活と混ざりながら受容され、伝播の速度や様相には地域差があった。", "source": ""}], "relatedTopics": [{"concept": "wet-rice-farming-japan", "relation": "因果", "note": "稲作がもたらした余剰と貯蔵が、争いと階層を生んだ"}, {"concept": "yayoi-period", "relation": "関連", "note": "弥生社会が『クニ』へ向かう最初の段階"}, {"concept": "yayoi-metal-tools", "relation": "関連", "note": "同じころ青銅器・鉄器が流入し始める"}, {"concept": "greek-polis-formation", "relation": "同時代", "note": "環濠集落ができたころ、地中海ではポリスが形づくられていた"}, {"concept": "zhou-eastern-spring-autumn", "relation": "同時代", "note": "中国は春秋の乱世。列島でもムラ同士の争いが始まった"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ03)", "ref": "data/wiki/sources/rekishi-03-orient-and-polis.md", "date": "2026-09-03"}], "tags": "弥生時代, 環濠集落, 板付, 菜畑, 高床倉庫, クニ, 稲作の東進", "lastUpdated": "2026-09-03"}, {"id": "mongol-empire-formation", "title": "チンギス・ハンとモンゴル帝国の形成", "domain": "世界史", "region": "東アジア", "headline": "モンゴル高原の遊牧諸部族を統一し、三世代でユーラシアを席巻した", "startYear": 1206, "endYear
