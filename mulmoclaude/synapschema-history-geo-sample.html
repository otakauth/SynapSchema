": 1260, "eraLabel": "13世紀前半", "summary": "モンゴル高原は農耕に向かず、遊牧民が小集団で分立していた。テムジンは抗争を勝ち抜き、1206年のクリルタイでチンギス・ハンの称号を得る。彼は血縁ではなく十進法の軍事組織（千戸制）で遊牧民を再編し、忠誠と略奪の分配を制度化した。抵抗する都市は破壊し、降伏した都市の職人は保護・移送する『恐怖と実利のセット』で、金・西遼・ホラズム朝を征服。オゴデイはカラコルムを都に金を滅ぼし（1234年）、バトゥの西征軍は1241年にハンガリーまで到達した。フレグはバグダードを陥落させ（1258年）、フビライは南宋攻略を進めた。", "regionCode": "MN", "lat": 47.2, "lng": 102.8, "factLevel": "定説", "body": [{"label": "千戸制という発明", "text": "旧来の部族単位を解体し、成年男子を十戸・百戸・千戸・万戸に編成し直した。指揮官はハンが任命し、部族長の世襲的権力を奪った。これにより遊牧民の動員力と忠誠が飛躍的に高まった。", "source": "batch 13 直接生成"}, {"label": "急拡大を支えた論理", "text": "騎馬の機動力と複合弓に加え、抵抗都市の徹底破壊で恐怖を広め、降伏都市の技術者（攻城技術者・行政官）は取り込んだ。略奪品の公平な分配がハンへの求心力を保った。", "source": "batch 13 直接生成"}, {"label": "西方への衝撃", "text": "1219年からのホラズム朝遠征で中央アジア・イランの大都市が壊滅。1241年のワールシュタットの戦いでポーランド・ドイツ諸侯連合を破ったが、オゴデイの訃報で撤退し、西欧本土は難を逃れた。", "source": "batch 13 直接生成"}], "relatedTopics": [{"concept": "yuan-dynasty", "relation": "継承", "note": "フビライの元は帝国東方の継承政権"}, {"concept": "mongol-successor-khanates", "relation": "継承", "note": "モンケ死後に四つの政権へ分裂"}, {"concept": "abbasid-caliphate", "relation": "因果", "note": "1258年フレグがバグダードを陥落させアッバース朝カリフを処刑"}, {"concept": "song-dynasty", "relation": "因果", "note": "金に続き南宋も征服対象となった"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "地理的背景", "note": "農耕に不向きな高原の遊牧社会から興った"}, {"concept": "kamakura-shogunate", "relation": "同時代", "note": "承久の乱で幕府が朝廷に優位した1221年、西征軍はホラズム朝を崩壊させていた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 13 直接生成 / rekishi-13-mongol-century.md", "date": "2026-09-04"}], "tags": "モンゴル,遊牧,チンギス・ハン,ユーラシア", "lastUpdated": "2026-09-04"}, {"id": "mongol-invasions-of-japan", "title": "元寇（文永・弘安の役）", "domain": "日本史", "region": "日本", "headline": "二度の来襲を防いだが、恩賞を出せず幕府衰退の遠因となった", "startYear": 1274, "endYear": 1281, "eraLabel": "鎌倉時代後期", "summary": "フビライは高麗を服属させたのち日本にも朝貢を要求し、鎌倉幕府（執権北条時宗）が拒否すると、1274年（文永の役）に元・高麗連合軍約3万が博多湾に上陸した。集団戦法と火薬兵器『てつはう』に御家人は苦戦したが、元軍は一日で撤退した（暴風雨説、偵察的侵攻説がある）。幕府は博多湾岸に石築地（防塁）を築いて備え、1281年（弘安の役）には約14万の大軍が来襲したが上陸できず、約2か月の膠着のあと台風で艦隊が壊滅した。二度の勝利は『神風』神話を生む一方、防衛戦ゆえに新たな領地を得られず、動員された御家人へ十分な恩賞を与えられなかった。", "regionCode": "40", "lat": 33.6, "lng": 130.35, "factLevel": "定説", "body": [{"label": "文永の役（1274年）", "text": "元・高麗軍約3万が対馬・壱岐を制圧し博多湾に上陸。日本側は騎馬一騎打ちの慣習で集団戦法に苦しんだが、一日の戦闘後に元軍は撤退した。損害の主因を暴風雨とする通説に対し、補給不足や当初から限定的な威力偵察だったとする説もある。", "source": "batch 13 直接生成"}, {"label": "弘安の役（1281年）", "text": "旧南宋軍主体の江南軍（約10万）と高麗発の東路軍（約4万）が来襲。幕府が築いた高さ2〜3mの石築地に阻まれて上陸できず、艦隊は海上で膠着した。2か月後の台風で多くの船が沈み、置き去りにされた兵は掃討された。", "source": "batch 13 直接生成"}, {"label": "無恩賞という後遺症", "text": "征服地を得ない防衛戦のため、動員された御家人（九州の武士や、警固番役を課された全国の御家人）に与える新恩がなかった。竹崎季長が恩賞を求めて鎌倉へ直訴した経緯は『蒙古襲来絵詞』に描かれている。永仁の徳政令（1297年）も窮乏対策として効果は限定的だった。", "source": "batch 13 直接生成"}], "relatedTopics": [{"concept": "yuan-dynasty", "relation": "因果", "note": "フビライの朝貢要求を執権北条時宗が拒否したことが発端"}, {"concept": "kamakura-shogunate", "relation": "因果", "note": "石築地の負担と無恩賞が幕府衰退を早めた"}, {"concept": "korean-peninsula-geography", "relation": "関連", "note": "高麗が艦隊建造と兵員を提供、江南軍は旧南宋軍だった"}, {"concept": "pax-mongolica-trade", "relation": "同時代", "note": "南宋併合（1279）によるモンゴルの東アジア統合事業の最東端の一コマ"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 13 直接生成 / rekishi-13-mongol-century.md", "date": "2026-09-04"}], "tags": "元寇,文永の役,弘安の役,北条時宗,神風,石築地", "lastUpdated": "2026-09-04"}, {"id": "mongol-successor-khanates", "title": "モンゴル帝国の分裂と四ハン国", "domain": "世界史", "region": "グローバル", "headline": "帝国は四つの継承政権にゆるく分かれ、通商路の安全は保たれた", "startYear": 1260, "endYear": 1370, "eraLabel": "13〜14世紀", "summary": "1259年のモンケ急死後、フビライと末弟アリクブケの帝位争いを機に、帝国は『大ハン（＝元の皇帝）を名目上の宗主とする複数の自立政権の連合』へ変質した。西北ユーラシアのジョチ・ウルス（キプチャク＝ハン国、都サライ）はロシア諸公国を間接支配し『タタールのくびき』と呼ばれた。中央アジアのチャガタイ・ハン国は定住民支配と遊牧的性格の間で揺れた。イラン・イラクのイル・ハン国はフレグの子孫が統治し、13世紀末にイスラームを国教化してペルシア的官僚制を採り入れた。四政権は互いに争うこともあったが、東西を結ぶ交易路の安全は概ね維持された。", "factLevel": "定説", "body": [{"label": "ジョチ・ウルス（キプチャク＝ハン国）", "text": "ヴォルガ川下流のサライを拠点に、ロシア諸公国から貢納を取り立てモスクワ大公国などに徴税を代行させた。イスラーム化が進み、後の中央ユーラシアのテュルク系諸ハン国の母体となる。1502年まで存続。", "source": "batch 13 直接生成"}, {"label": "イル・ハン国", "text": "フレグがアッバース朝滅亡後のイラン・イラクに建てた。ガザン・ハンの改革（1295年〜）でイスラームを国教化し、ラシード・ウッディーンの『集史』などペルシア語の歴史学が花開いた。1335年に事実上解体。", "source": "batch 13 直接生成"}, {"label": "ゆるやかな連合という統治形態", "text": "四政権は自立しつつ、クリルタイの承認、共通の法慣習（ヤサ）、駅伝の相互利用、通商保護という点で一体性を残した。この『分かれても切れない』構造がユーラシア交易の枠組みを支えた。", "source": "batch 13 直接生成"}], "relatedTopics": [{"concept": "mongol-empire-formation", "relation": "継承", "note": "モンケ死後の帝位争いを機に分裂"}, {"concept": "yuan-dynasty", "relation": "関連", "note": "大ハン＝元の皇帝を名目上の宗主とした"}, {"concept": "abbasid-caliphate", "relation": "因果", "note": "イル・ハン国はアッバース朝滅亡後のイラン・イラクを支配"}, {"concept": "seljuk-and-medieval-islamic-dynasties", "relation": "継承", "note": "イル・ハン国は13世紀末にイスラームを国教化しペルシア官僚制を吸収"}, {"concept": "black-death", "relation": "因果", "note": "交易網の一体化がペストの西進を可能にした"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 13 直接生成 / rekishi-13-mongol-century.md", "date": "2026-09-04"}], "tags": "ハン国,キプチャク,イル・ハン国,チャガタイ,タタールのくびき", "lastUpdated": "2026-09-04"}, {"id": "monsoon-asia-rice-frontier", "title": "モンスーンアジアと稲作の北限", "domain": "地理", "region": "東アジア", "headline": "夏の高温と多雨がそろう範囲が稲作圏。その北限が東アジアを横切る", "eraLabel": "地理単元", "summary": "稲は南方原産で、生育期に高温と豊富な水を必要とする。東アジアでは夏に太平洋から吹き込む季節風（モンスーン）が雨と暑さをもたらし、この夏雨型の気候が水稲栽培を可能にする。ただし夏が短く冷涼な高緯度・内陸では稲が実りにくく、華北北部から朝鮮半島北部、東北日本を結ぶあたりに前近代の稲作の北限があった。北限の外側では雑穀やムギが主食となる。近代以降は寒さに強い品種改良で北限が北上し、北海道でも稲作が広がった。", "regionCode": "CN", "lat": 40, "lng": 124, "factLevel": "定説", "body": [{"label": "夏に雨が来ることの意味", "text": "地中海性気候（夏に乾く）や砂漠と違い、モンスーンアジアは作物が最も水を要する盛夏に雨が集中する。天水でも稲がある程度育つのはこのためで、灌漑前提のメソポタミアと対照的。", "source": ""}, {"label": "北限は動く", "text": "江戸期まで本州北端でも凶作が多く、北海道の稲作は明治以降。品種と栽培技術が自然の境界を押し広げた実例。", "source": ""}], "relatedTopics": [{"concept": "wet-rice-farming-japan", "relation": "地理的背景", "note": "列島が夏雨型モンスーン圏に入るため稲作が定着"}, {"concept": "japan-archipelago-geography", "relation": "関連", "note": "列島の気候をアジア規模で位置づける"}, {"concept": "north-south-china-divide", "relation": "関連", "note": "同じ気候傾斜が中国の南北差も生む"}, {"concept": "yayoi-period", "relation": "地理的背景", "note": "稲作圏への編入が弥生社会の前提"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ02)", "ref": "data/wiki/sources/rekishi-02-east-asia-geography.md", "date": "2026-09-03"}], "tags": "モンスーン, 季節風, 稲作の北限, 夏雨型気候, 品種改良", "lastUpdated": "2026-09-03"}, {"id": "mont-saint-michel", "title": "モン・サン＝ミシェルとその湾", "domain": "世界史", "region": "ヨーロッパ", "headline": "モン・サン＝ミシェル＝潮の干満で『島』と『陸』を行き来する垂直の修道院都市", "summary": "ノルマンディーとブルターニュの境の湾に浮かぶ岩山と、その頂に積み上げられたベネディクト会修道院。966年の創建以来、増改築を重ねて『垂直の中世都市』になった。ヨーロッパ有数の巡礼地であり、百年戦争では難攻不落の要塞でもあった。大潮のときだけ海に囲まれる特異な景観をもつ。", "isWorldHeritage": true, "relatedTopics": [{"concept": "venice-and-its-lagoon", "relation": "類似", "note": "潮汐・水辺と一体の中世都市"}, {"concept": "registration-criteria", "relation": "テーマ"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "修道院, 巡礼, 潮汐, 景観回復, 世界遺産", "lastUpdated": "2026-09-03", "startYear": 966, "endYear": 1520, "eraLabel": "10〜16世紀（中世）", "regionCode": "FR", "lat": 48.636, "lng": -1.511, "body": [{"label": "湾の環境回復", "text": "堆積で陸続きになりつつあったため、2014年に橋を架け替え、川の流量を戻して『島』の景観を回復させる大工事を実施した。", "source": "パイロット"}, {"label": "観光圧", "text": "年間300万人が訪れる一方、常住者は数十人。生活と観光の両立が課題。", "source": "パイロット"}], "country": "フランス", "whType": "文化遺産", "inscriptionYear": 1979, "whCriteria": "i, iii, vi", "whStatus": "登録", "ouv": "(i)(iii)(vi)。自然の岩山と宗教建築が一体化した傑作で、中世キリスト教世界の象徴。", "imageUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Mont-Saint-Michel_vu_du_ciel.jpg/960px-Mont-Saint-Michel_vu_du_ciel.jpg", "imageCredit": "Amaustan / CC BY-SA 4.0", "imageLink": "https://commons.wikimedia.org/wiki/File:Mont-Saint-Michel_vu_du_ciel.jpg"}, {"id": "muromachi-shogunate", "title": "室町幕府と勘合貿易", "domain": "日本史", "region": "日本", "headline": "南北朝を合一し明との貿易で潤ったが、応仁の乱で統制力を失った", "startYear": 1336, "endYear": 1573, "eraLabel": "室町時代", "summary": "1336年、足利尊氏が京都に幕府を開き、南朝（吉野）と北朝が並立する動乱を経て、3代義満が1392年に南北朝を合一した。義満は明と国交を結び、朝貢形式の勘合貿易（1404年〜）で銅銭・生糸・書画を輸入し、莫大な利益を得た。だが将軍権力は守護大名との連合の上に立つもろいもので、6代義教の暗殺、そして8代義政期の応仁の乱（1467〜77年）で京都は焼け、幕府の統制力は失われた。地方では下剋上が広がり、惣村の自治・土一揆・水墨画・能・茶の湯・書院造など、のちの日本文化の骨格がこの時代に形づくられた。", "regionCode": "26", "lat": 35.03, "lng": 135.73, "factLevel": "定説", "body": [{"label": "勘合貿易の位置づけ", "text": "明の海禁・朝貢体制の中で、倒幕後の足利義満が『日本国王』として明に臣下の礼をとる形で行われた。倭寇と区別するための勘合（勘合符）を用いた。輸入された大量の明銭が国内の貨幣経済を支えた。", "source": "batch 14 直接生成"}, {"label": "応仁の乱と下剋上", "text": "将軍家・管領家の後継争いが絡み合い、東軍・西軍に分かれて京都で11年間戦った。乱後、守護代や国人が守護大名の地位を実力で奪う下剋上が全国に広がった。", "source": "batch 14 直接生成"}, {"label": "文化史上の意義", "text": "北山文化（金閣・能の完成）と東山文化（銀閣・書院造・喫茶文化としての茶の湯）は、現代に続く「和風」の原型となった。連歌、水墨画（雪舟）もこの時代。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "kamakura-shogunate", "relation": "継承", "note": "建武の新政の崩壊後、足利尊氏が京都に開いた"}, {"concept": "ming-dynasty-and-zheng-he", "relation": "同時代", "note": "義満の勘合貿易（1404〜）で銅銭・生糸を輸入"}, {"concept": "sengoku-and-unification", "relation": "因果", "note": "応仁の乱で幕府の統制力が失われ戦国へ"}, {"concept": "song-dynasty", "relation": "関連", "note": "宋銭に続き明銭が流通し、貨幣経済がさらに浸透した"}, {"concept": "renaissance", "relation": "同時代", "note": "15世紀、東西で古典回帰と洗練された宮廷・都市文化が花開いた"}, {"concept": "kyoto-monuments", "relation": "具体例", "note": "鹿苑寺（金閣）・慈照寺（銀閣）など北山・東山文化の建築"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "室町幕府,足利義満,勘合貿易,南北朝,応仁の乱,下剋上,東山文化", "lastUpdated": "2026-09-04"}, {"id": "nanban-trade-and-christianity", "title": "南蛮貿易とキリスト教の伝来", "domain": "日本史", "region": "日本", "headline": "ポルトガル船が鉄砲と福音をもたらし、日本の銀と中国産生糸を結んだ", "startYear": 1543, "endYear": 1614, "eraLabel": "戦国〜安土桃山時代", "summary": "1549年、イエズス会のフランシスコ・ザビエルが鹿児島に上陸し、日本布教を始めた。ポルトガル船は中国産生糸・鉄砲・火薬を積んで平戸・長崎などに来航し、日本の銀（石見銀山など、当時世界の産銀の3割前後を占めたとされる）と交換した。これが南蛮貿易で、貿易の利を求めて洗礼を受けるキリシタン大名も現れ、大友・大村・有馬は1582年に少年使節をローマへ送った。信徒は九州を中心に数十万に達したとされるが、秀吉は宣教師の影響力と教会の領地化を警戒し、1587年にバテレン追放令を出した（貿易は継続）。江戸幕府はこれを全面禁教と貿易統制（いわゆる「鎖国」）へと進めていく。", "regionCode": "42", "lat": 32.74, "lng": 129.87, "factLevel": "定説", "body": [{"label": "なぜ大名は改宗したか", "text": "ポルトガル船の寄港地を自領に引き寄せれば貿易の利と鉄砲・火薬が手に入る。宣教師の保護はその条件でもあった。純粋な信仰と現実的利害が重なっていた。", "source": "batch 14 直接生成"}, {"label": "銀の島国", "text": "石見銀山などの灰吹法（朝鮮経由で伝来）による銀量産が、日本を世界の銀供給の一角にした。この銀がポルトガル船・後にオランダ船を介して中国へ流れた。", "source": "batch 14 直接生成"}, {"label": "統一政権とキリスト教", "text": "一向一揆と同じく、キリスト教は支配の外にある忠誠の源泉と見なされた。秀吉のバテレン追放令から家康の禁教令（1612〜14）へ、統制は段階的に厳しくなった。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "age-of-exploration", "relation": "因果", "note": "ヴァスコ・ダ・ガマのインド航路とマラッカ占領の延長で東アジア海域へ"}, {"concept": "reformation", "relation": "因果", "note": "対抗宗教改革のイエズス会（ザビエル）が布教した"}, {"concept": "sengoku-and-unification", "relation": "関連", "note": "貿易の利を求めてキリシタン大名が現れ、秀吉はバテレン追放令（1587）"}, {"concept": "silk-road-trade", "relation": "対比", "note": "中国産生糸と日本銀の交換＝海の交易"}, {"concept": "ming-dynasty-and-zheng-he", "relation": "関連", "note": "石見銀山の銀が明へ流れ税の銀納化を支えた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "南蛮貿易,ザビエル,キリシタン大名,石見銀山,バテレン追放令,天正遣欧使節", "lastUpdated": "2026-09-04"}, {"id": "napoleonic-era", "title": "ナポレオンの時代", "domain": "世界史", "region": "ヨーロッパ", "headline": "革命の申し子が皇帝となり、ヨーロッパを戦火と法典で塗り替えた", "startYear": 1799, "endYear": 1815, "eraLabel": "19世紀初頭", "summary": "革命の混乱を収拾する軍人として台頭したナポレオン・ボナパルトは1799年のクーデタで権力を握り、1804年に皇帝に即位した。ナポレオン法典で私有財産権や法の下の平等など革命の成果を制度化し、ヨーロッパ大陸の大半を軍事的に制圧して従属国・同盟国網を築いた。しかしロシア遠征(1812)の大敗を機に勢力は急速に崩れ、1815年のワーテルローの戦いで最終的に敗北し、大陸にナショナリズムを刺激する遺産を残して失脚した。", "regionCode": "BE", "lat": 50.68, "lng": 4.4, "factLevel": "定説", "body": [{"label": "クーデタから皇帝即位へ", "text": "1799年のブリュメール18日のクーデタで統領政府の第一統領となり、1804年の国民投票を経て世襲皇帝に即位した。", "source": "MulmoClaude"}, {"label": "ナポレオン法典とヨーロッパ支配", "text": "私有財産の保護や法の下の平等を明文化したナポレオン法典は占領地にも導入され、革命の成果を制度として定着させる一方、大陸の大半を軍事的従属下に置いた。", "source": "MulmoClaude"}, {"label": "ロシア遠征とワーテルローの敗北", "text": "1812年のロシア遠征は厳冬と焦土戦術で大敗に終わり、1814年に退位、復位後の1815年ワーテルローの戦いで決定的に敗北しセントヘレナ島に流された。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "french-revolution", "relation": "継承", "note": "革命の混乱と成果を引き継ぎ制度として固定化した"}, {"concept": "latin-american-independence", "relation": "因果", "note": "スペイン本国占領が植民地統制を弱め独立運動の契機になった"}, {"concept": "industrial-revolution", "relation": "同時代", "note": "大陸が戦乱の時代を過ごす一方、イギリスは工業化を進めた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近代,ナポレオン,フランス,ヨーロッパ", "lastUpdated": "2026-09-04"}, {"id": "nara-period", "title": "奈良時代と平城京", "domain": "日本史", "region": "日本", "headline": "平城京と大仏 ― 律令と国家仏教の頂点、そして早くもほころび", "startYear": 710, "endYear": 784, "eraLabel": "奈良時代", "summary": "710年、都を藤原京から平城京（奈良）へ移した。平城京は唐の長安を縮小コピーした碁盤目状の都で、律令官僚制の中枢だった。この時代に『古事記』『日本書紀』が編まれて国家の歴史が公式化され、『万葉集』が集められ、和同開珎が鋳造され、東大寺の大仏が752年に開眼した。聖武天皇は国分寺・国分尼寺を全国に建て、仏教で国を鎮護する体制を築く。遣唐使が制度・文物・経典を持ち帰り、正倉院にはペルシアやインドに由来する品まで納められた。だが農民の逃亡・偽籍・墾田私有（743年の墾田永年私財法）で公地公民は早くも崩れ、仏教勢力の政治介入（道鏡）への反動が次の遷都を招いた。", "regionCode": "29", "lat": 34.69, "lng": 135.79, "factLevel": "定説", "body": [{"label": "平城京", "text": "唐の長安の設計思想を取り入れた条坊制の都。北端中央の平城宮に大極殿・内裏・官庁を置き、朱雀大路が南北に貫く。人口は約10万と推定。ただし長安のような城壁はほぼ無かった。", "source": "batch 10 直接生成"}, {"label": "鎮護国家と大仏", "text": "聖武天皇は疫病（天然痘の大流行、735〜737）と貴族の反乱に直面し、仏の力で国を守る思想に傾いた。国分寺・国分尼寺を諸国に建立し、その総本山として東大寺と盧舎那仏（大仏、752年開眼）を造営した。", "source": "batch 10 直接生成"}, {"label": "歴史書と和歌", "text": "『古事記』（712、稗田阿礼の誦習を太安万侶が筆録）と『日本書紀』（720、漢文の正史）で王権の由来を公式化。『万葉集』は天皇から農民・防人まで幅広い作者の和歌約4500首を収める。", "source": "batch 10 直接生成"}, {"label": "律令制のほころび", "text": "重い調庸と兵役を避けて農民が逃亡・浮浪し、戸籍を偽る例が増えた。723年の三世一身法、743年の墾田永年私財法で開墾地の私有が認められ、貴族・寺社の私有地（初期荘園）が拡大。公地公民の原則が内側から崩れ始めた。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "taika-reforms-ritsuryo", "relation": "継承", "note": "大宝律令の体制のうえに立つ奈良の官僚国家"}, {"concept": "tang-dynasty", "relation": "対比", "note": "平城京は長安の縮小コピー。遣唐使で盛唐の文物を吸収"}, {"concept": "heian-early-period", "relation": "因果", "note": "寺院勢力の政治介入への反動が長岡・平安遷都を招いた"}, {"concept": "silk-road-trade", "relation": "関連", "note": "正倉院宝物はシルクロードの東端に届いた品々を伝える"}, {"concept": "buddhism-official-transmission-japan", "relation": "継承", "note": "6世紀の仏教公伝が、国家仏教（鎮護国家）として結実"}, {"concept": "abbasid-caliphate", "relation": "同時代", "note": "大仏開眼（752）とバグダード建設（762）がほぼ同時期"}, {"concept": "kyoto-monuments", "relation": "関連", "note": "平城京の都と国家仏教を京都が受け継ぐ"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 10 直接生成 / rekishi-10-medieval-world-formation.md", "date": "2026-09-03"}], "tags": "奈良時代,平城京,東大寺,大仏,鎮護国家,古事記,日本書紀,万葉集,墾田永年私財法,正倉院", "lastUpdated": "2026-09-03"}, {"id": "neo-babylonian-empire", "title": "新バビロニア（カルデア）", "domain": "世界史", "region": "西アジア・中東", "headline": "バビロン捕囚を行い、半世紀でペルシアに呑まれた最後のメソポタミア王朝", "startYear": -626, "endYear": -539, "eraLabel": "前7〜前6世紀", "summary": "アッシリア滅亡後、バビロンを都に南メソポタミアを支配した王朝。ネブカドネザル2世のもとで最盛期を迎え、「空中庭園」や巨大なジッグラトが築かれた。前586年にユダ王国を滅ぼし、住民の多くをバビロンへ連行した（バビロン捕囚）。この経験がユダヤ教の一神教と律法の整備を促した。前539年、アケメネス朝のキュロス2世がバビロンを占領し、捕囚民の帰還を許して王朝は幕を閉じた。", "regionCode": "IQ", "lat": 32.54, "lng": 44.42, "factLevel": "定説", "body": [{"label": "バビロン捕囚", "text": "ユダの王・貴族・技術者が数次にわたりバビロンへ移された。神殿を失った人々が聖典編集と安息日・割礼など律法の遵守で結束し、土地に依存しない宗教共同体の原型ができた。", "source": ""}, {"label": "短命の栄華", "text": "文化的には華やかだったが軍事的基盤は弱く、キュロスの進軍にほとんど抵抗できずに開城した。メソポタミアを本拠とする王朝はこれが最後になる。", "source": ""}], "relatedTopics": [{"concept": "assyrian-empire", "relation": "継承", "note": "アッシリアを倒し、その南半を引き継いだ"}, {"concept": "achaemenid-persia", "relation": "因果", "note": "前539年キュロス2世が征服し帝国に併合した"}, {"concept": "mesopotamia-geography", "relation": "地理的背景", "note": "灌漑農業の富がバビロンの繁栄を支えた"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ03)", "ref": "data/wiki/sources/rekishi-03-orient-and-polis.md", "date": "2026-09-03"}], "tags": "新バビロニア, カルデア, ネブカドネザル2世, バビロン捕囚, ユダヤ教", "lastUpdated": "2026-09-03"}, {"id": "neolithic-revolution", "title": "農耕・牧畜の始まり（新石器革命）", "domain": "横断テーマ", "region": "グローバル", "headline": "食料を「採る」から「作る」へ──定住と人口増、文明の前提を用意した転換", "startYear": -8000, "endYear": -4000, "eraLabel": "前1万年紀〜前4千年紀", "summary": "最終氷期が終わって温暖化すると、西アジアの「肥沃な三日月地帯」で麦類の栽培とヤギ・ヒツジの家畜化が始まった。同様の転換は中国の黄河・長江流域（アワ・イネ）、メソアメリカ（トウモロコシ）など各地で独立に起きた。農耕は定住・食料貯蔵・人口増加をもたらし、余剰をめぐる格差と分業、やがて都市と国家の土台になった。一方で労働時間の増加、感染症、階層社会という代償も伴ったとみられる。", "regionCode": "", "lat": 36.5, "lng": 40, "factLevel": "定説", "body": [{"label": "肥沃な三日月地帯", "text": "現在のイラク〜シリア〜トルコ南部〜レヴァントにかけての弧状の地域。野生のコムギ・オオムギや、家畜化に向く大型草食獣が集中しており、前9000年頃から農耕村落（イェリコなど）が現れた。", "source": ""}, {"label": "各地で独立に発生", "text": "農耕は一か所から広まったのではなく、中国（前8000年頃、アワ・キビ、のちイネ）、ニューギニア、アンデス、メソアメリカなどで別々に始まった。栽培化されたのはその土地の在来植物だった。", "source": ""}, {"label": "代償", "text": "骨の分析では、初期の農耕民は狩猟採集民より低身長で栄養状態が悪く、齲歯や過労性の関節症が増えた。人口は増えたが一人あたりの暮らしは必ずしも良くならなかった、という見方が有力。", "source": ""}], "relatedTopics": [{"concept": "mesopotamia-early-civilization", "relation": "因果", "note": "農耕の余剰が神殿都市を生んだ"}, {"concept": "yellow-river-shang-zhou", "relation": "関連", "note": "中国では独自にアワ・イネの農耕が発達"}, {"concept": "wet-rice-farming-japan", "relation": "対比", "note": "日本の農耕開始は数千年遅れ、大陸からの技術移転として"}, {"concept": "jomon-period", "relation": "対比", "note": "縄文は農耕なしで定住・土器・人口を実現した例外"}, {"concept": "pre-columbian-isolation", "relation": "対比", "note": "旧大陸と独立した経路でトウモロコシなどの農耕化が進んだ"}], "sourceArticles": [{"sourceName": "MulmoClaude 直接生成（バッチ01）", "date": "2026-09-03"}], "tags": "新石器革命, 農耕, 肥沃な三日月地帯, 家畜化", "lastUpdated": "2026-09-03"}, {"id": "north-american-great-plains-geography", "title": "北米大平原（グレートプレーンズ）とプレーリー", "domain": "地理", "region": "南北アメリカ", "headline": "肥沃な土に恵まれながら、大型家畜の不在が農耕の広がりを長く阻んだ", "summary": "ロッキー山脈の東麓からミシシッピ川へ向かって、なだらかに東へ傾く半乾燥から湿潤の大草原が広がる。氷期の氷河が運んだ肥沃な土が厚く積もり、近代には世界有数の穀倉地帯となるが、先コロンブス期には家畜化できる大型動物が乏しく（在来のバイソンは家畜化できなかった）、農耕はミシシッピ川流域など東部の森林に近い一帯に限られていた。大平原の本格的な利用は、スペイン人が持ち込んだ馬が先住民社会に広まってから、騎馬でバイソンを狩る文化が生まれた近代以降のことである。", "regionCode": "US", "lat": 41, "lng": -100, "factLevel": "定説", "body": [{"label": "馬が来る前の平原", "text": "馬もいなければ牛もいない状態では、広大な草原を効率よく利用する手段が限られていた。狩猟や小規模な採集が中心で、大河沿いの一部だけがトウモロコシなどの農耕地となった。", "source": "batch 15 直接生成"}, {"label": "馬の再導入が変えたもの", "text": "もともと北米に馬の仲間はいたが絶滅しており、スペイン人が持ち込んだ馬が18世紀に先住民社会へ再び広まったことで、騎馬でバイソンを追う移動的な生活文化が花開いた。これは先コロンブス期の姿とは大きく異なる、接触後の変化である。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "inner-asia-farming-pastoral-frontier", "relation": "対比", "note": "農耕限界を分けるのが降水量か大型家畜の有無かという違い"}, {"concept": "mesoamerica-geography", "relation": "関連", "note": "同じ北米大陸でも、南のメソアメリカとは対照的に大規模な定住農耕文明を生まなかった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "グレートプレーンズ,プレーリー,バイソン,馬", "lastUpdated": "2026-09-04"}, {"id": "north-european-plain", "title": "北ヨーロッパ平原と森林", "domain": "地理", "region": "ヨーロッパ", "headline": "大西洋岸からロシアへ、障壁のない大平原が広がる", "eraLabel": "地理単元", "summary": "北ヨーロッパ平原はフランス北部・低地地方・北ドイツ・ポーランドを経てロシア平原へと続く、ほぼ切れ目のない低地帯。氷期の氷床が削り運んだ砂・粘土・レス（黄土状の細粒土）が積もり、レス帯は肥沃な農地になった。天然の障壁が乏しいため、東西方向の人・軍隊の移動が容易で、諸民族の移動と大国の興亡の舞台になった。もとは温帯落葉樹林に覆われ、中世を通じて森を切り開いて耕地を広げた。", "regionCode": "PL", "lat": 52.5, "lng": 19, "factLevel": "定説", "body": [{"label": "開かれた回廊", "text": "山も大河の障壁も少なく、東からの遊牧民の侵入も西からの征服も通しやすい。近代まで大陸国家の防衛の弱点だった。", "source": ""}, {"label": "レスの農地", "text": "平原南縁のレス帯（パリ盆地〜ウクライナ）は肥沃で、ヨーロッパの主要な穀倉になった。", "source": ""}, {"label": "森の開墾", "text": "原生の広葉樹林を中世の農民が重い犂と三圃制で切り開き、人口と村落が北・東へ広がった。", "source": ""}], "relatedTopics": [{"concept": "alps-and-european-rivers", "relation": "対比", "note": "山と川が刻む高地と、障壁のない大平原"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "関連", "note": "ユーラシアのステップ回廊の西の出口にあたる"}, {"concept": "north-south-china-divide", "relation": "対比", "note": "降水でなく氷河と森が土地の性格を決めたヨーロッパの平原"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ06)", "ref": "data/wiki/sources/rekishi-06-europe-geography.md", "date": "2026-09-03"}], "tags": "北ヨーロッパ平原, レス, 氷床, 三圃制, 穀倉, 開墾", "lastUpdated": "2026-09-03"}, {"id": "north-south-china-divide", "title": "中国の南北差（秦嶺・淮河線）", "domain": "地理", "region": "東アジア", "headline": "畑作・小麦の華北と、水田・米の華南を分ける降水の境界線", "eraLabel": "地理単元", "summary": "秦嶺山脈と淮河を結ぶ線は、年降水量およそ800mm・冬の平均気温0℃の境にほぼ一致し、中国を南北に分ける自然の境界とされる。北は乾燥に強いアワ・キビ、のちにムギを育てる畑作地帯で水は貴重。南は降水が多く、水を張った田で稲を作る。食べ物・家屋・生活様式、さらに歴史上の政治・軍事のパターンまで、この線を境に対照的だった。", "regionCode": "CN", "lat": 33, "lng": 112, "factLevel": "定説", "body": [{"label": "文明の出発点は北", "text": "初期の黄河文明は乾燥に強い雑穀の畑作から始まった。稲作の長江流域も古いが、大規模な国家形成は当初は華北が先行した。", "source": ""}, {"label": "経済の重心は南へ", "text": "6世紀以降に長江以南の開発が進み、宋代には人口と税収の多くを江南が占めるようになる。乾いた北で政権を立て、豊かな南を養分にする構図が定着した。", "source": ""}], "relatedTopics": [{"concept": "china-landforms-great-rivers", "relation": "関連", "note": "西高東低の地形と一体の気候傾斜"}, {"concept": "yellow-river-shang-zhou", "relation": "地理的背景", "note": "雑穀畑作の華北で王朝が始まった"}, {"concept": "monsoon-asia-rice-frontier", "relation": "関連", "note": "稲作の可能な範囲を決める同じ気候の傾斜"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ02)", "ref": "data/wiki/sources/rekishi-02-east-asia-geography.md", "date": "2026-09-03"}], "tags": "中国, 秦嶺淮河線, 華北, 華南, 畑作, 稲作, 800mm等降水量線", "lastUpdated": "2026-09-03"}, {"id": "occupation-reforms-japan", "title": "占領改革", "domain": "日本史", "region": "日本", "startYear": 1945, "endYear": 1952, "eraLabel": "戦後改革期", "headline": "GHQ主導で日本の国のかたちを作り替えた7年間", "summary": "敗戦後の日本はGHQ（連合国軍総司令部）の占領下に置かれ、日本国憲法の制定・農地改革・財閥解体・労働改革・教育改革など、国のあり方を根本から作り替える改革が進められた。1951年のサンフランシスコ平和条約で1952年に主権を回復した。", "factLevel": "定説", "body": [{"label": "日本国憲法", "text": "1946年公布・1947年施行。天皇を「象徴」と位置づけ主権を国民に置き、戦争放棄（第9条）を明記した。旧大日本帝国憲法（天皇主権）からの断絶を象徴する改革の柱。"}, {"label": "農地改革・財閥解体", "text": "地主から農地を強制的に買い上げ小作農に安く売り渡す農地改革で寄生地主制を解体、三井・三菱などの財閥も解体して経済の民主化を図った。これらは戦前の軍国主義を支えた経済構造を壊す狙いがあった。"}, {"label": "「逆コース」への転換", "text": "冷戦の激化と朝鮮戦争を背景に、GHQの方針は当初の「非軍事化・民主化」から一転、日本を反共の防波堤とするため警察予備隊創設や公職追放解除などの「逆コース」に転じた。"}], "relatedTopics": [{"concept": "pacific-war", "relation": "継承", "note": "敗戦の結果として占領統治が始まった"}, {"concept": "meiji-constitution-and-modernization", "relation": "対比", "note": "天皇主権の大日本帝国憲法から国民主権の日本国憲法へ転換した"}, {"concept": "korean-war", "relation": "同時代", "note": "朝鮮戦争を機にGHQの方針が非軍事化から「逆コース」へ転じた"}, {"concept": "japan-postwar-economic-miracle", "relation": "継承", "note": "改革で作られた制度基盤の上に高度経済成長が築かれた"}]}, {"id": "oil-crisis-and-stable-growth", "title": "オイルショックと安定成長期", "domain": "日本史", "region": "日本", "startYear": 1973, "endYear": 1990, "eraLabel": "安定成長期", "headline": "高度成長の終わりと省エネ・技術立国への転換", "summary": "1973年の第一次オイルショックで高度経済成長は終わりを告げ、日本経済は狂乱物価と呼ばれるインフレを経験。以後は省エネルギー技術・軽薄短小型のハイテク産業へ産業構造を転換し、年5%前後の「安定成長」を続けて欧米に匹敵する経済大国となった。この延長線上に1980年代後半のバブル経済が生まれる。", "factLevel": "定説", "body": [{"label": "オイルショックの衝撃", "text": "第四次中東戦争を機にアラブ産油国が石油価格を引き上げ、資源のほとんどを輸入に頼る日本は原油価格の急騰に直撃された。トイレットペーパー買い占め騒動に象徴される混乱と「狂乱物価」と呼ばれる激しいインフレが起きた。"}, {"label": "産業構造の転換", "text": "エネルギーを大量消費する重厚長大型産業（鉄鋼・造船など）から、省エネルギーで高付加価値な軽薄短小型の産業（電子機器・自動車・半導体）へ主軸を移し、円高にも対応できる国際競争力を身につけた。"}, {"label": "バブル経済への布石", "text": "1985年のプラザ合意による急激な円高不況を、日銀の低金利政策で乗り切ろうとした結果、余った資金が株式・不動産に流れ込み1980年代後半のバブル経済につながっていった。"}], "relatedTopics": [{"concept": "middle-east-wars-and-israel", "relation": "因果", "note": "第四次中東戦争のアラブ産油国の石油戦略が引き金"}, {"concept": "japan-postwar-economic-miracle", "relation": "継承", "note": "高度成長の終わりを受けて次の成長モデルへ転換した"}]}, {"id": "origin-of-life-on-earth", "title": "生命の誕生", "domain": "地球・人類史", "region": "グローバル", "headline": "40億年ほど前、化学反応が『生きているもの』に変わった", "startYear": -4000000000, "endYear": -3500000000, "eraLabel": "太古代", "summary": "生命がいつ・どのように生まれたかは、科学の大きな謎のひとつである。有力な仮説では、原始の海や熱水噴出孔で、アミノ酸や核酸などの有機分子が化学反応を繰り返すうちに、自己複製できるしくみが生まれたとされる。オーストラリアの地層には、約35億年前にはすでに単純な微生物(原核生物)がいた証拠が残る。以後20億年以上、生命は肉眼で見えない単細胞のまま地球に存在し続けた。約27億〜24億年前には光合成を行う微生物が現れ、大気中の酸素濃度を大きく変えていった。", "regionCode": "", "factLevel": "諸説あり", "body": [{"label": "最古の生命の証拠", "text": "オーストラリア・ピルバラ地域の約35億年前の地層から見つかったストロマトライト(微生物が作る層状構造)が、最古級の生命の痕跡のひとつとされる。", "source": ""}, {"label": "大酸化イベント", "text": "約27億〜24億年前、シアノバクテリアが光合成で酸素を放出し始め、大気中の酸素濃度が急上昇した(大酸化イベント)。当時の多くの嫌気性生物にとっては環境の激変だったが、その後の複雑な生命の土台にもなった。", "source": ""}], "relatedTopics": [{"concept": "formation-of-earth-and-solar-system", "relation": "継承", "note": "冷えた地球の海が生命誕生の舞台になった"}, {"concept": "evolution-and-mass-extinctions", "relation": "継承", "note": "単細胞の生命が多細胞化し、多様な生物へ広がっていく"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "地球・人類史レイヤー パイロット（最軽量実装）", "date": "2026-09-05"}], "tags": "生命の起源, ストロマトライト, 光合成, 大酸化イベント, ビッグヒストリー", "lastUpdated": "2026-09-05"}, {"id": "ottoman-empire", "title": "オスマン帝国", "domain": "世界史", "region": "西アジア・中東", "headline": "コンスタンティノープルを落として東ローマを滅ぼし、三大陸にまたがる多民族帝国を築いた", "startYear": 1299, "endYear": 1922, "eraLabel": "13〜20世紀", "summary": "アナトリア西北の小侯国から興ったオスマン朝は、1453年にメフメト2世がコンスタンティノープルを陥落させて東ローマ帝国を滅ぼし、ここを都（イスタンブル）とした。スレイマン1世（在位1520〜66）の時代に最盛期を迎え、バルカン・ハンガリー・北アフリカ・アラブ地域・メソポタミアを支配し、1529年には第1次ウィーン包囲を行った。スルタンはメッカ・メディナの保護者となり、スンナ派イスラーム世界の盟主を任じた。異教徒共同体（ミッレト）に自治を認め、キリスト教徒の少年を登用するデヴシルメ制で官僚・軍（イェニチェリ）を組織する、柔軟な多民族統治が特徴だった。", "regionCode": "TR", "lat": 41.01, "lng": 28.98, "factLevel": "定説", "body": [{"label": "コンスタンティノープル陥落（1453年）", "text": "巨大な青銅砲で三重の城壁を破り、千年続いた東ローマ帝国を滅ぼした。この事件はヨーロッパで『中世の終わり』の画期としても語られる。", "source": "batch 14 直接生成"}, {"label": "地中海交易への影響", "text": "エジプト（マムルーク朝を併合、1517）とレヴァントを押さえ、インド産香辛料の陸路・紅海ルートを管理下に置いた。これがポルトガルにアフリカ南端回りの新航路を探させる動機の一つになった。", "source": "batch 14 直接生成"}, {"label": "多民族統治の仕組み", "text": "宗教共同体ごとに徒長を通じて自治を認め、税を取る代わりに信仰には干渉しない。この寛容さがバルカンのキリスト教徒やユダヤ人の定住を可能にした。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "byzantine-medieval-transformation", "relation": "継承", "note": "1453年にコンスタンティノープルを落とし東ローマを滅ぼした"}, {"concept": "seljuk-and-medieval-islamic-dynasties", "relation": "継承", "note": "アナトリアのトルコ系諸侯国の一つから興った"}, {"concept": "safavid-and-mughal-empires", "relation": "対比", "note": "スンナ派の盟主としてシーア派のサファヴィー朝と対立した"}, {"concept": "age-of-exploration", "relation": "因果", "note": "交易路の管理がヨーロッパに新航路を探させた"}, {"concept": "reformation", "relation": "同時代", "note": "スレイマンのウィーン包囲（1529）が皇帝カール5世を東西から圧迫し、プロテスタント諸侯への譲歩を余儀なくさせた"}, {"concept": "venice-and-its-lagoon", "relation": "関連", "note": "地中海東部の交易覇権をめぐる長い抗争の相手"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "オスマン,メフメト2世,スレイマン1世,イスタンブル,ミッレト,デヴシルメ", "lastUpdated": "2026-09-04", "bridgeLinks": [{"node": "venice-and-its-lagoon", "nodeTitle": "ヴェネツィアとその潟", "relation": "関連", "note": "地中海東部の交易覇権をめぐる長い抗争の相手"}]}, {"id": "outstanding-universal-value", "title": "顕著な普遍的価値（OUV）", "domain": "横断テーマ", "region": "グローバル", "headline": "顕著な普遍的価値（OUV）＝『国の宝』を『人類の宝』に格上げする唯一の物差し", "summary": "ある物件が世界遺産に登録されるかどうかを決める中心概念。国や地域を超えて全人類にとって重要で、いま守り将来へ伝える価値がある、と認められること。OUVの証明には『10の登録基準のうち1つ以上を満たす』『真正性（オーセンティシティ）』『完全性（インテグリティ）』『保護管理の仕組みがある』の4点が必要になる。", "isWorldHeritage": true, "relatedTopics": [{"concept": "registration-criteria", "relation": "テーマ", "note": "OUVを証明する10の物差し"}, {"concept": "world-heritage-convention", "relation": "テーマ"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "制度, 審査, 真正性, 完全性, 世界遺産", "lastUpdated": "2026-09-03", "body": [{"label": "真正性と完全性", "text": "真正性＝形・素材・用途などが本物であること。木造建築を建て替えながら受け継ぐ文化をどう評価するかで、日本と欧州の間に議論があった（『奈良ドキュメント』）。完全性＝価値を示す要素が過不足なく含まれていること。", "source": "パイロット"}, {"label": "『普遍的』の難しさ", "text": "登録がヨーロッパ・キリスト教建築・都市に偏っているという長年の批判があり、アフリカ・無形の価値・20世紀建築・自然を増やす是正（グローバル・ストラテジー）が続いている。", "source": "パイロット"}], "ouv": "OUVは自己言及的な概念。これ自体が世界遺産という制度の定義であり、あらゆる登録審査はこの一語をめぐって行われる。"}, {"id": "pacific-war", "title": "日中戦争と太平洋戦争", "domain": "日本史", "region": "東アジア", "headline": "盧溝橋事件から真珠湾へ――大陸の泥沼化が対米英全面戦争へと拡大していった", "startYear": 1937, "endYear": 1945, "eraLabel": "昭和戦前期", "summary": "1937年7月の盧溝橋事件を機に日中全面戦争が始まり、資源確保のためのフランス領インドシナ進駐が米英との対立を深め、1941年12月の真珠湾攻撃で太平洋戦争が開始した。1942年のミッドウェー海戦で主力空母を失い不利な戦局に転じ、1945年8月の広島・長崎への原爆投下とソ連参戦を経て降伏した。", "regionCode": "JP", "lat": 35.6762, "lng": 139.6503, "factLevel": "定説", "body": [{"label": "盧溝橋事件と日中戦争(1937)", "text": "北京郊外での小競り合いを契機に全面戦争へ拡大。南京占領を含め戦線は泥沼化した。", "source": "MulmoClaude"}, {"label": "対米英開戦(1941)", "text": "仏印進駐を契機にABCD包囲網(対日石油禁輸)が強化され、真珠湾攻撃・マレー作戦で対米英開戦。", "source": "MulmoClaude"}, {"label": "戦局の転換と降伏", "text": "1942年ミッドウェー海戦で主力空母4隻を失い劣勢に。1945年3月の東京大空襲、4〜6月の沖縄戦、8月の原爆投下とソ連参戦を経て降伏した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "showa-militarism-and-manchurian-incident", "relation": "継承", "note": "大陸進出路線の延長上に日中戦争がある"}, {"concept": "world-war-two", "relation": "同時代", "note": "欧州戦線とほぼ同時並行で進行し、1945年に両戦線がほぼ同時に降伏した"}, {"concept": "korean-peninsula-geography", "relation": "関連", "note": "日本の植民地支配下で徴兵・徴労働の動員地となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 19 直接生成 / rekishi-19-age-of-total-war.md", "date": "2026-09-05"}], "tags": "日中戦争,太平洋戦争,真珠湾,原爆投下,日本史", "lastUpdated": "2026-09-05"}, {"id": "parthia-and-sasanian", "title": "パルティアとササン朝ペルシア", "domain": "世界史", "region": "西アジア・中東", "headline": "ユーフラテスを挟んで400年、ローマの東進を止め続けたイランの帝国", "startYear": -247, "endYear": 651, "eraLabel": "前247〜後651年", "summary": "前247年ごろ遊牧民出身のアルサケス家がセレウコス朝から自立してパルティアを建て、騎馬弓兵と重装騎兵でローマの東進を阻んだ。224年、ファールスの領主アルダシール1世がパルティアを倒してササン朝を開き、『アケメネス朝の再興』を掲げてゾロアスター教を国教化。260年にはローマ皇帝ウァレリアヌスを捕虜にした。", "regionCode": "IR", "lat": 33.09, "lng": 44.58, "factLevel": "定説", "body": [{"label": "パルティアの騎馬戦術", "text": "前53年のカルラエの戦いで、パルティアの騎馬弓兵は退却しながら振り向いて射る『パルティアン・ショット』でクラッスス率いるローマ軍を壊滅させた。以後ローマの国境はおおむねユーフラテス川に固定される。", "source": "岩波講座 世界歴史"}, {"label": "ササン朝への交替", "text": "224年、アルダシール1世がパルティア王アルタバノス4世を破り、翌年クテシフォンで戴冠。ササン朝はゆるやかな諸侯連合だったパルティアより中央集権的で、神官階層と結んだ国家宗教（ゾロアスター教）を整えた。", "source": "詳説世界史"}, {"label": "交易国家としての性格", "text": "首都クテシフォンや隊商都市は、中国の絹とローマの金を仲介する中継貿易で潤った。ローマとの戦争の多くは、この交易路と国境都市（ニシビス、ドゥラ・エウロポスなど）の争奪でもあった。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "achaemenid-persia", "relation": "継承", "note": "ササン朝は『アケメネスの再興』を国是に掲げた"}, {"concept": "hellenistic-world", "relation": "継承", "note": "パルティアがセレウコス朝を東方から駆逐"}, {"concept": "roman-principate", "relation": "対比", "note": "400年におよぶローマとの二正面抗争"}, {"concept": "silk-road-trade", "relation": "地理的背景", "note": "東西交易の中継料が国家財政の柱"}, {"concept": "iranian-plateau-geography", "relation": "地理的背景", "note": "乾いた高原と隊商都市・カナートが国の骨格"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 07 直接生成 / rekishi-07-ancient-empires-peak.md", "date": "2026-09-03"}], "tags": "パルティア ササン朝 ペルシア アルサケス アルダシール カルラエ", "lastUpdated": "2026-09-03"}, {"id": "pax-mongolica-trade", "title": "モンゴルの平和とユーラシア交易", "domain": "横断テーマ", "region": "グローバル", "headline": "駅伝で結ばれたユーラシアを、商人・宣教師・そして疫病が行き交った", "startYear": 1250, "endYear": 1350, "eraLabel": "13〜14世紀", "summary": "モンゴルは商業を重んじ、隊商に融資するオルトク（御用商人組合）を保護し、駅伝制（ジャムチ）で使節と物資を高速輸送した。銀が共通の価値基準として東西に流通し、中国の火薬・羅針盤・印刷術、ペルシアの天文学・医学・染付の青（コバルト）が相互に伝わった。マルコ・ポーロ、カトリック宣教師モンテ・コルヴィノ、モロッコのイブン・バットゥータの旅は、この一体化した空間があって初めて可能だった。ただし人と物の高速移動は、1340年代のペスト（黒死病）を東から西へ運ぶ経路にもなった。『モンゴルの平和』は約1世紀の現象で、諸ハン国の弱体化とともに終わる。", "factLevel": "有力説", "body": [{"label": "駅伝制（ジャムチ）", "text": "主要路に約30〜40kmごとに駅を置き、通行証（パイザ）を持つ使節に馬・食料・宿を提供した。情報と軍の移動速度が飛躍的に上がり、広域帝国の統治を可能にした。", "source": "batch 13 直接生成"}, {"label": "技術と文化の双方向移動", "text": "中国の火薬・活字・磁器技術が西へ、イスラーム世界の天文表・医学・コバルト顔料が東へ流れた。元代の染付磁器はペルシア産コバルトと中国の窯業が結びついた産物である。", "source": "batch 13 直接生成"}, {"label": "『世界システム』の前段階", "text": "この時期、陸のユーラシア交易網とインド洋海上交易網が接続し、13世紀に西欧・中東・インド・中国を結ぶ広域経済圏が成立していた、と評価する研究がある（アブー＝ルゴド『ヨーロッパ覇権以前』）。", "source": "batch 13 直接生成"}], "relatedTopics": [{"concept": "silk-road-trade", "relation": "継承", "note": "陸のシルクロードが単一政治圏に束ねられた最盛期"}, {"concept": "yuan-dynasty", "relation": "関連", "note": "大都・泉州が交易網の東の結節点"}, {"concept": "mongol-successor-khanates", "relation": "関連", "note": "四政権の相互通行と通商保護が枠組みを支えた"}, {"concept": "indian-ocean-maritime-trade", "relation": "対比", "note": "陸路の一体化と並行して海路交易も活発化し両者が接続した"}, {"concept": "black-death", "relation": "因果", "note": "人と物の高速移動が疫病も運んだ"}, {"concept": "crusades", "relation": "関連", "note": "十字軍後の地中海商人（ジェノヴァ・ヴェネツィア）が黒海で東方交易網に接続"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 13 直接生成 / rekishi-13-mongol-century.md", "date": "2026-09-04"}], "tags": "ジャムチ,駅伝,銀,マルコ・ポーロ,イブン・バットゥータ,染付", "lastUpdated": "2026-09-04"}, {"id": "pre-columbian-isolation", "title": "先コロンブス期アメリカの「隔絶」という条件", "domain": "横断テーマ", "region": "南北アメリカ", "headline": "1万年以上の孤立と、大型家畜・鉄・車輪の不在が歴史の速度を分けた", "startYear": -13000, "endYear": 1492, "eraLabel": "先史〜1492年", "summary": "アメリカ大陸の諸文明が旧大陸と決定的に異なったのは、長期にわたりユーラシア・アフリカと事実上隔絶していたこと、家畜化できる大型動物がリャマ・アルパカにほぼ限られ牛や馬による畜力運搬や騎馬戦を欠いたこと、鉄の利用が広まらなかったこと、そして南北に長い大陸ゆえに作物や技術が緯度を越えて伝わりにくかったことである。その結果、旧大陸の感染症に対する免疫を持たず、16世紀の接触後およそ1世紀で先住民人口は地域によって大きく減少したと推計される。この免疫の差こそが、少数のスペイン人が二つの大帝国を短期間で倒せた最大の要因だった。", "factLevel": "解釈的整理", "body": [{"label": "南北軸という不利", "text": "旧大陸のユーラシアは東西に長く同じ気候帯が続くため作物や技術が伝わりやすかったが、南北に長いアメリカ大陸は緯度をまたぐたびに気候が変わり、伝播に時間がかかったとする議論がある（ジャレド・ダイアモンドらの説）。", "source": "batch 15 直接生成"}, {"label": "感染症という決定的な差", "text": "旧大陸では家畜との長い共生の中で天然痘などの感染症が生まれ、住民はある程度の免疫を獲得していた。アメリカ大陸にはこの過程がなく、接触後の感染症は先住民社会に壊滅的な打撃を与えた。", "source": "batch 15 直接生成"}], "relatedTopics": [{"concept": "maya-civilization", "relation": "具体例", "note": "旧大陸から隔絶した条件で独自に発展した文明"}, {"concept": "aztec-empire", "relation": "具体例", "note": "旧大陸から隔絶した条件で独自に発展した帝国"}, {"concept": "inca-empire", "relation": "具体例", "note": "旧大陸から隔絶した条件で独自に発展した帝国"}, {"concept": "age-of-exploration", "relation": "因果", "note": "接触後の感染症により先住民人口が大きく減少した"}, {"concept": "neolithic-revolution", "relation": "対比", "note": "旧大陸とは独立した経路でトウモロコシなどの農耕化が進んだ"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 15 直接生成 / rekishi-15-americas-geography-precolumbian.md", "date": "2026-09-04"}], "tags": "先コロンブス期,免疫,コロンブス交換,南北軸", "lastUpdated": "2026-09-04"}, {"id": "qin-unification", "title": "秦の統一と始皇帝", "domain": "世界史", "region": "東アジア", "headline": "500年の分裂を初めて一つにし、度量衡と文字をそろえた15年の帝国", "startYear": -221, "endYear": -206, "eraLabel": "前3世紀後半", "summary": "戦国七雄の一つ秦は、法家の富国強兵策と地の利（関中盆地）で勢力を伸ばし、前221年に他の六国を滅ぼして中国を初めて統一した。王は『皇帝』を名乗り（始皇帝）、全土を郡県制で直接支配し、文字・度量衡・貨幣・車輪の幅を統一、思想統制（焚書坑儒）も行った。北方の匈奴に備えて長城を連結し、宮殿・陵墓（兵馬俑）・道路に民を酷使した。始皇帝の死後まもなく反乱が続発し、前206年に滅亡。統治の枠組みは次の漢が受け継いだ。", "factLevel": "定説", "body": [{"label": "郡県制", "text": "貴族に領地を分ける封建をやめ、中央が任命する官僚が郡・県を治めた。以後2千年の中国の行政の原型になった。", "source": ""}, {"label": "標準化", "text": "文字（小篆）、尺・升・斤、半両銭を全国共通にした。地域を越えた統治と徴税を可能にする基盤整備だった。", "source": ""}, {"label": "短命の理由", "text": "急速な統一事業と重い労役・刑罰が民の反発を招き、統一からわずか15年で崩れた。『秦のやり方』は苛政の代名詞になった。", "source": ""}], "relatedTopics": [{"concept": "zhou-eastern-spring-autumn", "relation": "因果", "note": "春秋戦国の分裂を終わらせた"}, {"concept": "confucius-hundred-schools", "relation": "対比", "note": "儒家の徳治に対し、秦は法家の法治で統一を成した"}, {"concept": "han-empire", "relation": "継承", "note": "郡県制と統一制度を漢が受け継いだ"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "地理的背景", "note": "匈奴に備えて既存の長城を連結した"}, {"concept": "yayoi-period", "relation": "同時代", "note": "前3世紀末、日本は弥生中期"}, {"concept": "great-wall-of-china", "relation": "具体例", "note": "始皇帝が諸国の長城をつなげたものが後世の世界遺産に"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ05)", "ref": "data/wiki/sources/rekishi-05-classical-antiquity.md", "date": "2026-09-03"}], "tags": "秦, 始皇帝, 郡県制, 焚書坑儒, 兵馬俑, 万里の長城", "lastUpdated": "2026-09-03"}, {"id": "qing-decline-and-opium-war", "title": "清の停滞とアヘン戦争", "domain": "世界史", "region": "東アジア", "headline": "貿易制限と人口爆発の末、アヘンと大砲で開国を強いられた", "startYear": 1793, "endYear": 1842, "eraLabel": "18世紀末〜19世紀前半", "summary": "乾隆帝末期以降の清朝は、人口爆発による一人当たり耕地の減少、官僚の腐敗、白蓮教徒の乱など内部の矛盾を抱え始めた。対外貿易は広州一港に限定し公行という特権商人組合を通じてのみ許可する体制(広東システム)を敷いていたが、イギリスは大幅な輸入超過を埋めるためインド産アヘンを大量に密輸し、銀の流出と中毒の蔓延を招いた。清がアヘンを厳禁して没収・廃棄したことを口実にイギリスがアヘン戦争(1840-42)を起こして勝利し、南京条約で香港割譲・五港開港・関税自主権の喪失を強いられ、以後「半植民地化」への道が始まった。", "regionCode": "CN", "lat": 23.13, "lng": 113.26, "factLevel": "定説", "body": [{"label": "内部の矛盾の蓄積", "text": "乾隆帝末期以降、人口の急増に対し耕地拡大が追いつかず一人当たり生活水準が低下、官僚の腐敗と白蓮教徒の乱(1796-1804)など反乱も頻発した。", "source": "MulmoClaude"}, {"label": "広東システムとアヘン密輸", "text": "対外貿易を広州一港・公行(特権商人組合)経由に限定していたが、イギリスは茶の輸入超過を埋めるためインド産アヘンを密輸し、清国内で銀の流出と中毒が深刻化した。", "source": "MulmoClaude"}, {"label": "アヘン戦争と南京条約", "text": "欽差大臣林則徐によるアヘン没収・廃棄を口実にイギリスが開戦(1840-42)、清が敗北して結んだ南京条約で香港島割譲・五港開港・関税自主権喪失などを強いられた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "qing-dynasty-prosperity", "relation": "継承", "note": "盛世のあとの停滞局面として位置づけられる"}, {"concept": "french-revolution", "relation": "同時代", "note": "ヨーロッパが革命の時代を迎える頃、清では乾隆帝末期の統治疲労が始まっていた"}, {"concept": "bakumatsu-prelude-and-foreign-pressure", "relation": "同時代", "note": "清の開国強制とほぼ同時期に日本近海にも異国船が現れ始めた"}, {"concept": "industrial-revolution", "relation": "因果", "note": "産業革命後のイギリスが市場拡大を求めたことが戦争の背景にある"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 17 直接生成 / rekishi-17-age-of-revolutions.md", "date": "2026-09-04"}], "tags": "近代,東アジア,清,アヘン戦争", "lastUpdated": "2026-09-04"}, {"id": "qing-dynasty-prosperity", "title": "清の成立と盛世（康熙・雍正・乾隆）", "domain": "世界史", "region": "東アジア", "headline": "満洲人の王朝が明を継ぎ、中国史上最大の版図を築いた", "startYear": 1636, "endYear": 1795, "eraLabel": "17〜18世紀", "summary": "満洲族のヌルハチ・ホンタイジが建てた清は1644年に明の滅亡に乗じて北京に入城、以後三藩の乱などを平定して中国全土を支配した。康熙・雍正・乾隆の三代(17世紀後半〜18世紀末)は「盛世」と呼ばれる最盛期で、モンゴル・チベット・新疆を編入して版図は史上最大に達し、人口も爆発的に増加した。満洲人は科挙官僚制など明の統治機構を継承しつつ、辮髪の強制など満洲式の支配も併用する二重体制をとった。", "regionCode": "CN", "lat": 39.9042, "lng": 116.4074, "factLevel": "定説", "body": [{"label": "明清交替", "text": "李自成の反乱で明が滅亡した混乱に乗じ、明の武将呉三桂の手引きで清軍が山海関を越えて北京に入城、1644年に中国支配を開始した。", "source": "MulmoClaude"}, {"label": "三代の盛世と版図拡大", "text": "康熙帝(在位1661-1722)、雍正帝、乾隆帝(-1795)の治世で三藩の乱・ジュンガル部の平定を通じモンゴル・チベット・新疆を編入し、版図と人口が史上最大規模に達した。", "source": "MulmoClaude"}, {"label": "満洲と漢人の二重体制", "text": "科挙による漢人官僚登用など明の統治機構を継承する一方、辮髪の強制や八旗制度など満洲固有の支配装置も維持する複合的な統治を行った。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "ming-dynasty-and-zheng-he", "relation": "継承", "note": "明の滅亡を受けて中国支配を引き継いだ"}, {"concept": "sakoku-policy", "relation": "同時代", "note": "明清交替の混乱と日本の鎖国完成がほぼ同時期に進んだ"}, {"concept": "great-wall-of-china", "relation": "関連", "note": "満洲人の入関により長城の軍事的境界としての意味が失われた"}, {"concept": "mongol-successor-khanates", "relation": "継承", "note": "モンゴル系勢力が清の版図に編入されていく"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,東アジア,中国,清", "lastUpdated": "2026-09-04"}, {"id": "qing-late-reform-and-decline", "title": "清末の変法と衰退", "domain": "世界史", "region": "東アジア", "headline": "洋務運動も変法も間に合わず、清は日清戦争と義和団で瓦解へ向かった", "startYear": 1861, "endYear": 1901, "eraLabel": "19世紀後半〜20世紀初頭", "summary": "アヘン戦争後の清朝は洋務運動で西洋技術を導入したが統治制度は変えなかった。日清戦争の敗北がその限界を露呈させ、1898年の急進改革「戊戌の変法」も西太后のクーデターで挫折。1900年の排外運動「義和団事件」は8か国連合軍に鎮圧され、清は主権侵害と巨額賠償を受け入れた。日本の近代化との明暗が際立つ。", "regionCode": "CN", "lat": 39.9042, "lng": 116.4074, "factLevel": "定説", "body": [{"label": "洋務運動(1861〜)", "text": "曾国藩・李鴻章らが「中体西用」(中国の伝統的な体制を保ちつつ西洋の技術のみ利用)を掲げ、兵器工場・海軍などを整備したが制度改革は伴わなかった。", "source": "MulmoClaude"}, {"label": "戊戌の変法(1898)", "text": "日清戦争敗北を受け、光緒帝のもと康有為・梁啓超らが立憲君主制を目指す急進改革を試みたが、西太后のクーデターでわずか103日で挫折した。", "source": "MulmoClaude"}, {"label": "義和団事件(1900)", "text": "排外主義の民衆運動「義和団」が北京の外国公使館を包囲したが、日本を含む8か国連合軍に鎮圧され、北京議定書(1901)で主権制限と巨額賠償が課された。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "qing-decline-and-opium-war", "relation": "継承", "note": "アヘン戦争後の停滞局面がさらに深化していく段階"}, {"concept": "first-sino-japanese-war", "relation": "因果", "note": "この戦争での敗北が変法運動を後押しした"}, {"concept": "meiji-constitution-and-modernization", "relation": "対比", "note": "同じプロイセン型立憲君主制を模索しながら、日本は成功し清は失敗した"}, {"concept": "scramble-for-africa", "relation": "対比", "note": "アフリカは直接の植民地分割、清は主権を残した「勢力範囲」への切り分けという違い"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "清,洋務運動,戊戌の変法,義和団,東アジア", "lastUpdated": "2026-09-05"}, {"id": "reformation", "title": "宗教改革", "domain": "世界史", "region": "ヨーロッパ", "headline": "『信仰のみ』『聖書のみ』が教皇の権威を否定し、西欧キリスト教世界を割った", "startYear": 1517, "endYear": 1600, "eraLabel": "16世紀", "summary": "1517年、神学者マルティン・ルターが免罪符の販売を批判する『95か条の論題』を公表した。彼は『人は信仰によってのみ義とされる』『聖書のみが権威』と説き、教皇の権威を否定した。印刷術に乗って主張はまたたく間に広がり、諸侯の政治的思惑（教会領の世俗化）とも結びついてドイツを二分した。スイスではツヴィングリ、ジュネーヴではカルヴァンが改革を進め、カルヴァンの予定説と勤労倫理は商工業者に受け入れられた。イングランドではヘンリ8世が国王を首長とする国教会を樹立した。カトリック側もトリエント公会議（1545〜63）で自己改革を進め、イエズス会が海外布教に乗り出した。", "regionCode": "DE", "lat": 51.87, "lng": 12.65, "factLevel": "定説", "body": [{"label": "印刷術という増幅装置", "text": "ルターの小冊子やドイツ語訳聖書は短期間に大量印刷された。宗教改革は、ルネサンス期の印刷インフラなしにはこれほどの速度では広がらなかった。", "source": "batch 14 直接生成"}, {"label": "宗教と政治の結合", "text": "ドイツ諸侯にとってルター支持は、皮肉なことに教会領を手に入れ皇帝・教皇から自立する手段でもあった。1555年のアウクスブルクの和議で『君主の宗教がその領国の宗教』とされた。", "source": "batch 14 直接生成"}, {"label": "世界への波及", "text": "対抗宗教改革でカトリックが海外布教を強化し、アジア・アメリカへ宣教師を送った。フランシスコ・ザビエルの来日（1549）もその一環で、ヨーロッパの宗派対立が地球の反対側の政策（禁教）にまで及んだ。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "renaissance", "relation": "因果", "note": "活版印刷と人文主義の聖書研究が土壌をつくった"}, {"concept": "feudal-europe-and-papacy", "relation": "対比", "note": "中世を通じて高まった教皇の普遍的権威を正面から否定した"}, {"concept": "age-of-exploration", "relation": "関連", "note": "対抗宗教改革のイエズス会が海外布教（ザビエル来日）へ"}, {"concept": "nanban-trade-and-christianity", "relation": "因果", "note": "対抗宗教改革の布教活動が日本へ及んだ"}, {"concept": "ottoman-empire", "relation": "同時代", "note": "1520年代、ルターの改革とスレイマンのウィーン包囲が同時に皇帝カール5世を圧迫した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "宗教改革,ルター,カルヴァン,免罪符,イエズス会,対抗宗教改革", "lastUpdated": "2026-09-04"}, {"id": "registration-criteria", "title": "世界遺産の登録基準（i〜x）", "domain": "横断テーマ", "region": "グローバル", "headline": "登録基準（i〜x）＝『なぜ人類の宝なのか』を10通りの物差しで言語化したもの", "summary": "世界遺産のOUVを証明するための10項目。かつては文化6項目（i〜vi）と自然4項目（vii〜x）に分かれていたが、2005年に統合され通し番号になった。(i)人類の傑作 (ii)価値観の交流 (iii)文明の証拠 (iv)建築・技術の見本 (v)伝統的集落と土地利用 (vi)出来事や思想との関連 (vii)自然美 (viii)地球の歴史 (ix)生態系の進行 (x)生物多様性。", "isWorldHeritage": true, "relatedTopics": [{"concept": "outstanding-universal-value", "relation": "テーマ"}, {"concept": "world-heritage-convention", "relation": "テーマ"}], "sourceArticles": [{"sourceName": "MulmoClaude 知識生成（パイロット）", "ref": "バッチ00 世界の代表的遺産ミックス", "date": "2026-09-03"}], "tags": "制度, 審査, 複合遺産, 世界遺産", "lastUpdated": "2026-09-03", "body": [{"label": "複合遺産", "text": "文化基準（i〜vi）と自然基準（vii〜x）の両方を満たすと『複合遺産』。マチュ・ピチュやトンガリロ（NZ）など世界で40件ほどしかない。", "source": "パイロット"}, {"label": "基準(vi)の慎重運用", "text": "『思想・信仰・出来事との関連』は主観が入りやすく、原則として他の基準と組み合わせて使う。単独適用はごく例外（原爆ドーム、アウシュヴィッツなど負の遺産）。", "source": "パイロット"}], "ouv": "10基準のうち少なくとも1つを満たすことがOUV認定の必要条件。基準の組み合わせがその遺産の『語り口』になる。"}, {"id": "renaissance", "title": "ルネサンス", "domain": "世界史", "region": "ヨーロッパ", "headline": "古典古代を規範に、人間と現世を肯定する新しい文化が都市から興った", "startYear": 1400, "endYear": 1600, "eraLabel": "14〜16世紀", "summary": "14〜16世紀、まずイタリアの都市（フィレンツェ、ヴェネツィア、ローマ）で、古代ギリシア・ローマの文芸と美術を規範とする文化運動が起こった。東方交易で富を蓄えたメディチ家らのパトロンが、ダ・ヴィンチ、ミケランジェロ、ラファエロらを支えた。人間そのものと現世を肯定する『人文主義（ヒューマニズム）』が、神学中心の中世的世界観に新しい視座を与えた。グーテンベルクの活版印刷（1450年代）は書物を安くし、思想の伝播速度を一変させた。コペルニクスの地動説（1543年）もこの知的空気の中から生まれた。のちアルプスを越え、エラスムスら『北方人文主義』として各国に広がった。", "regionCode": "IT", "lat": 43.77, "lng": 11.26, "factLevel": "定説", "body": [{"label": "なぜイタリアか", "text": "東方貿易の結節点で都市に富が集中し、古代ローマの遺跡が目の前にあり、1453年の東ローマ滅亡でギリシア語写本と学者が流入した。共和政都市の市民的風土も人間中心の価値観と相性がよかった。", "source": "batch 14 直接生成"}, {"label": "印刷革命", "text": "活版印刷により写本時代に比べ書物の価格が極端に下がった。古典の普及だけでなく、のちの宗教改革や科学革命の思想を瞬く間に拡散させるインフラになった。", "source": "batch 14 直接生成"}, {"label": "中世との連続と断絶", "text": "『暗黒の中世からのめざめ』という古典的理解に対し、今日の研究は中世の学問・技術の蓄積を土台として連続的にとらえる。『ルネサンス』の区分自体が19世紀の歴史家の構想である。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "greek-classical-age", "relation": "継承", "note": "古代ギリシア・ローマの文芸を規範に復興した"}, {"concept": "crusades", "relation": "因果", "note": "東方交易で富を得たイタリア都市がパトロンに"}, {"concept": "reformation", "relation": "因果", "note": "活版印刷と人文主義が宗教改革の前提"}, {"concept": "byzantine-medieval-transformation", "relation": "関連", "note": "1453年の東ローマ滅亡で学者と写本がイタリアへ流入した"}, {"concept": "muromachi-shogunate", "relation": "同時代", "note": "北山・東山文化と同じころ15世紀、東西で古典回帰の文化が花開いた"}, {"concept": "venice-and-its-lagoon", "relation": "具体例", "note": "東方交易で富を得たルネサンス期の海洋交易国家"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "ルネサンス,人文主義,メディチ家,活版印刷,フィレンツェ", "lastUpdated": "2026-09-04"}, {"id": "rise-of-fascism-and-nazism", "title": "ファシズムとナチズムの台頭", "domain": "世界史", "region": "ヨーロッパ", "headline": "経済危機と屈辱感が、「強い指導者」への待望を膨らませた", "startYear": 1922, "endYear": 1939, "eraLabel": "1920〜1930年代", "summary": "1922年の「ローマ進軍」でムッソリーニがイタリアに世界初のファシズム体制を樹立。ドイツでは世界恐慌による大量失業を背景にヒトラーのナチスが支持を拡大、1933年に首相就任、全権委任法で独裁体制を確立した。", "regionCode": "DE", "lat": 52.52, "lng": 13.405, "factLevel": "定説", "body": [{"label": "イタリアファシズム（1922）", "text": "ムッソリーニ率いるファシスト党が「ローマ進軍」で政権を掌握し、世界初のファシズム体制が成立した。", "source": "MulmoClaude"}, {"label": "ナチスの台頭", "text": "大不況による大量失業を背景にヒトラーのナチスが支持を拡大、1933年首相就任、全権委任法で独裁体制を確立した。", "source": "MulmoClaude"}, {"label": "ヴェルサイユ体制の覆し", "text": "ニュルンベルク法（1935）によるユダヤ人の強制的な取り締まり、再軍備宣言、ラインラント進駐（1936）と、ヴェルサイユ条約の制限を次々と覆した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "versailles-and-interwar-order", "relation": "因果", "note": "懲罰的講和への屈辱感がナチスのイデオロギーの土壌になった"}, {"concept": "great-depression", "relation": "因果", "note": "大量失業がナチス支持拡大の直接の契機となった"}, {"concept": "showa-militarism-and-manchurian-incident", "relation": "対比", "note": "「持たざる国」の全体主義化という共通の文脈を持つ一方、天皇制を軸とする国体イデオロギーでは異なる"}, {"concept": "world-war-two", "relation": "因果", "note": "ドイツの拡張政策が第二次大戦開戦の直接の引き金となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 19 直接生成 / rekishi-19-age-of-total-war.md", "date": "2026-09-05"}], "tags": "ファシズム,ナチス,ヒトラー,ムッソリーニ", "lastUpdated": "2026-09-05"}, {"id": "rise-of-islam", "title": "イスラームの成立とムハンマド", "domain": "世界史", "region": "西アジア・中東", "headline": "アラビアの辺境から、宗教と政治が一体の共同体が生まれた", "startYear": 610, "endYear": 632, "eraLabel": "7世紀初め", "summary": "隊商都市メッカの商人ムハンマドが、610年ごろから唯一神アッラーの啓示を説き始めた。多神教の聖地の支配層と対立し、622年に信者とともにメディナへ移住する（ヒジュラ＝イスラーム暦の紀元）。メディナで彼は預言者であると同時に共同体（ウンマ）の指導者・裁判官・軍事指導者となり、宗教と政治が一体の共同体を築いた。血縁を超えて信仰で人を結ぶ理念は、たえず抗争するアラブ諸部族を初めてまとめる新しい社会原理となり、632年の死までに半島の大半をイスラームのもとに置いた。", "regionCode": "SA", "lat": 21.42, "lng": 39.83, "factLevel": "定説", "body": [{"label": "ヒジュラ（聖遷、622年）", "text": "メッカでの迫害を逃れ、信者とともにメディナへ移住した年。イスラーム暦（ヒジュラ暦）はこの年を紀元1年とする。ここでウンマ（信仰共同体）が政治体として成立した。", "source": "batch 10 直接生成"}, {"label": "五行", "text": "信仰告白・礼拝（1日5回）・喜捨（ザカート）・断食（ラマダーン）・巡礼（メッカへのハッジ）という簡潔な実践。アラビア語の聖典クルアーンとともに、急速な広がりを支えた。", "source": "batch 10 直接生成"}, {"label": "一神教の系譜", "text": "ユダヤ教・キリスト教と同じ唯一神の系譜に連なり、アブラハムやイエスを預言者と認めつつ、ムハンマドを最後にして最大の預言者と位置づける。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "arab-caliphate-expansion", "relation": "因果", "note": "この宗教運動が一世代でのアラブ大征服の原動力になった"}, {"concept": "abbasid-caliphate", "relation": "継承", "note": "ウンマの理念はやがて広域のイスラーム帝国へ"}, {"concept": "arabian-peninsula-geography", "relation": "地理的背景", "note": "隊商交易の要衝メッカ、砂漠のなかのオアシス都市メディナ"}, {"concept": "parthia-and-sasanian", "relation": "同時代", "note": "ムハンマドの死の直後にアラブ軍がササン朝を滅ぼす"}, {"concept": "eastern-roman-empire", "relation": "同時代", "note": "ヘラクレイオス帝がササン朝と死闘を演じていた時期"}, {"concept": "buddhism-jainism-birth", "relation": "対比", "note": "どちらも交易で栄える都市の商人層を担い手に生まれた宗教運動"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 10 直接生成 / rekishi-10-medieval-world-formation.md", "date": "2026-09-03"}], "tags": "イスラーム,ムハンマド,ヒジュラ,一神教,アラビア半島,中世", "lastUpdated": "2026-09-03"}, {"id": "roman-principate", "title": "ローマ帝政（プリンキパトゥス）", "domain": "世界史", "region": "ヨーロッパ", "headline": "共和政の看板を残したまま、地中海を200年の平和で包んだ元首政", "startYear": -27, "endYear": 284, "eraLabel": "前27〜後284年", "summary": "前27年、アウグストゥスが共和政の形式を保ったまま事実上の君主政（元首政）を始めた。五賢帝期（96〜180年）に帝国は最大版図に達し、街道網・統一通貨・市民権拡大が地中海を一つの経済圏に変えた（パクス・ロマーナ）。3世紀の危機（軍人皇帝の乱立・通貨劣化・二正面の外圧）を経て、ディオクレティアヌスの専制君主政へ移行する。", "regionCode": "IT", "lat": 41.9, "lng": 12.49, "factLevel": "定説", "body": [{"label": "元首政というしくみ", "text": "オクタウィアヌスは前27年に権力を元老院へ「返上」する形をとり、代わりに『第一の市民（プリンケプス）』として軍事指揮権と護民官職権を握った。共和政の官職や元老院は存続したため、当初は君主政と意識されにくかった。", "source": "詳説世界史"}, {"label": "パクス・ロマーナ", "text": "五賢帝時代に帝国はブリテン島からメソポタミア北部、ライン・ドナウからサハラの縁までを囲い込んだ。総延長8万km超の舗装街道、デナリウス銀貨、212年の全自由民への市民権付与（アントニヌス勅令）が広域統合を支えた。", "source": "岩波講座 世界歴史"}, {"label": "3世紀の危機", "text": "235〜284年の約50年に皇帝が20人以上交替し、通貨の銀含有量が急落。ゲルマン諸族とササン朝の同時圧力で帝国は分裂寸前に陥り、ディオクレティアヌスの改革で立て直されるが、その体制はもはや古代的な共和政の残り香を捨てた専制だった。", "source": "岩波講座 世界歴史"}], "relatedTopics": [{"concept": "roman-republic", "relation": "継承", "note": "共和政の崩壊から元首政へ"}, {"concept": "parthia-and-sasanian", "relation": "対比", "note": "東方の宿敵。ユーフラテスが事実上の国境"}, {"concept": "hellenistic-world", "relation": "継承", "note": "東地中海のギリシア文化圏をまるごと吸収"}, {"concept": "silk-road-trade", "relation": "関連", "note": "絹・香辛料・宝石の最大の消費地"}, {"concept": "later-han-and-three-kingdoms", "relation": "同時代", "note": "ユーラシアの両端で大帝国が並立"}, {"concept": "yamatai-himiko", "relation": "同時代", "note": "ローマの平和のころ、日本列島は小国の分立と大乱"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 07 直接生成 / rekishi-07-ancient-empires-peak.md", "date": "2026-09-03"}], "tags": "ローマ 帝政 アウグストゥス パクス・ロマーナ 五賢帝", "lastUpdated": "2026-09-03"}, {"id": "roman-republic", "title": "ローマ共和政", "domain": "世界史", "region": "ヨーロッパ", "headline": "王を追放した都市国家が、元老院と民会の均衡で地中海帝国に育った", "startYear": -509, "endYear": -27, "eraLabel": "前6〜前1世紀", "summary": "前509年頃、ローマ人は王を追放し、任期1年の執政官（コンスル）2名、貴族の助言機関である元老院、平民の民会からなる共和政を築いた。平民は身分闘争を通じて護民官や十二表法を勝ち取り、参政権を広げた。イタリア半島統一の後、カルタゴとのポエニ戦争（前264〜前146）に勝って西地中海の覇権を握り、東方へも進出した。しかし征服の富の偏在と大土地所有の拡大が社会を裂き、前1世紀の内乱を経て共和政は事実上崩れ、アウグストゥスの帝政に移行した。", "factLevel": "定説", "body": [{"label": "混合政体", "text": "執政官（君主的）・元老院（貴族的）・民会（民主的）の三要素が抑制しあう仕組みを、ポリュビオスはローマ強大化の理由と説明した。", "source": "ポリュビオス『歴史』"}, {"label": "ポエニ戦争", "text": "三次にわたるカルタゴとの戦争。ハンニバルのイタリア侵入（カンナエの戦い）を耐え、前146年にカルタゴを滅ぼして西地中海を制した。", "source": ""}, {"label": "共和政の自壊", "text": "属州支配の富が一部に集中し、無産市民と私兵化した軍団が有力者に従った。グラックス兄弟の改革失敗以降、内乱が常態化した。", "source": ""}], "relatedTopics": [{"concept": "greek-polis-formation", "relation": "対比", "note": "同じ都市国家でも、ローマは市民権を征服地へ広げて拡大した"}, {"concept": "hellenistic-world", "relation": "因果", "note": "東方進出でヘレニズム諸王国を次々に併合した"}, {"concept": "mediterranean-world-geography", "relation": "地理的背景", "note": "オリーブが育つ範囲＝ローマの版図とほぼ一致"}, {"concept": "yayoi-period", "relation": "同時代", "note": "ポエニ戦争の頃（前3〜前2世紀）、日本は弥生中期でクニの形成が進んだ"}], "sourceArticles": [{"sourceName": "MulmoClaude直接生成(バッチ05)", "ref": "data/wiki/sources/rekishi-05-classical-antiquity.md", "date": "2026-09-03"}], "tags": "ローマ共和政, 元老院, 執政官, ポエニ戦争, ハンニバル, グラックス兄弟", "lastUpdated": "2026-09-03"}, {"id": "russian-revolution", "title": "ロシア革命とソ連の成立", "domain": "世界史", "region": "ヨーロッパ", "headline": "戦争の疲弊が帝政を倒し、世界初の社会主義国家を生んだ", "startYear": 1917, "endYear": 1922, "eraLabel": "20世紀初頭", "summary": "1917年3月の二月革命でロマノフ朝が崩壊した後、同年11月の十月革命でレーニン率いるボリシェヴィキが自由主義臨時政府を倒し世界初の社会主義政権を樹立した。1918〜22年の内戦を経て、1922年にソ連が成立。世界に資本主義以外の選択肢を示した。", "regionCode": "RU", "lat": 59.93, "lng": 30.34, "factLevel": "定説", "body": [{"label": "二月革命", "text": "1917年3月、食糧不足と戦争の疲弊による民衆の不満がペトログラードで爆発し、ロマノフ朝が崩壊した。", "source": "MulmoClaude"}, {"label": "十月革命", "text": "1917年11月、レーニンのボリシェヴィキが「土地・平和・パン」を掲げ臨時政府を武力で倒し、世界初の社会主義政権を樹立した。", "source": "MulmoClaude"}, {"label": "内戦とソ連成立", "text": "1918〜22年の赤軍対白軍の内戦を勝ち抜き、1922年にソヴィエト社会主義共和国連邦(ソ連)が成立した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "world-war-one", "relation": "因果", "note": "戦争の長期化による経済の行き詰まりと戦争への嫌気が革命の引き金となった"}, {"concept": "great-depression", "relation": "対比", "note": "世界恐慌下でもソ連の計画経済は影響を受けず、資本主義との対比が意識された"}, {"concept": "rise-of-fascism-and-nazism", "relation": "対比", "note": "反共産主義を前面に出すファシズムが台頭する相手ともなった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 19 直接生成 / rekishi-19-age-of-total-war.md", "date": "2026-09-05"}], "tags": "ロシア革命,レーニン,ボリシェヴィキ,ソ連,社会主義", "lastUpdated": "2026-09-05"}, {"id": "russo-japanese-war", "title": "日露戦争", "domain": "日本史", "region": "東アジア", "headline": "アジアの新興国が初めて欧州列強を破り、世界に衝撃を与えた", "startYear": 1904, "endYear": 1905, "eraLabel": "明治後期", "summary": "満州・朝鮮の権益を巡る対立から、日英同盟を背景に1904年開戦。旅順攻囲戦・奉天会戦の陸戦に続き、1905年の日本海海戦で連合艦隊がバルチック艦隊をほぼ壊滅させた。アメリカ仲介のポーツマス条約で日本は韓国の優越権や樺太南半分を得たが、賠償金は得られず国内で不満が噴出した。アジアが欧州列強を破った初の事例として世界に衝撃を与えた。", "regionCode": "JP", "lat": 34.2, "lng": 129.3, "factLevel": "定説", "body": [{"label": "開戦の背景", "text": "三国干渉で日本が失った遼東半島にロシアが進出したことへの反発と、朝鮮半島の権益確保が直接の動機。1902年の日英同盟が他列強の介入を防いだ。", "source": "MulmoClaude"}, {"label": "旅順・奉天・日本海海戦", "text": "乃木希典による旅順攻囲戦、陸軍主力同士の奉天会戦を経て、1905年5月、東郷平八郎率いる連合艦隊が日本海海戦でバルチック艦隊をほぼ壊滅させた。", "source": "MulmoClaude"}, {"label": "ポーツマス条約と国内の不満", "text": "セオドア・ルーズベルト仲介の講和で韓国優越権・樺太南半分・遼東半島租借権を得たが賠償金なし。国内では日比谷焼打ち事件など不満が噴出した。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "first-sino-japanese-war", "relation": "継承", "note": "三国干渉への屈辱感と朝鮮・満州権益をめぐる対立が直接つながる"}, {"concept": "korean-peninsula-geography", "relation": "地理的背景", "note": "朝鮮半島の権益確保が開戦の主要動機だった"}, {"concept": "scramble-for-africa", "relation": "対比", "note": "分割される側ではなく、分割する側の帝国主義国へと転じた日本の事例"}, {"concept": "us-civil-war-and-reconstruction", "relation": "関連", "note": "講和を仲介したセオドア・ルーズベルトのアメリカが国際政治の表舞台に登場する布石となった"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "日露戦争,日本海海戦,ポーツマス条約,明治,東アジア", "lastUpdated": "2026-09-05"}, {"id": "safavid-and-mughal-empires", "title": "サファヴィー朝とムガル帝国（火薬帝国）", "domain": "世界史", "region": "西アジア・中東", "headline": "イランはシーア派を国教化し、インドではチンギスとティムールの子孫が帝国を開いた", "startYear": 1501, "endYear": 1736, "eraLabel": "16〜18世紀", "summary": "イランでは、神秘主義教団を母体とするサファヴィー朝が1501年に成立し、シーア派（十二イマーム派）を国教と定めた。これによりイランは、スンナ派のオスマン・中央アジアに囲まれた『シーア派の島』として独自のアイデンティティを固め、アッバース1世の下でイスファハーンを壮麗な首都とした。インドでは、ティムールとチンギスの血を引くバーブルが1526年にデリー・スルタン朝を破り、ムガル帝国を開いた。孫のアクバル（在位1556〜1605）は非ムスリムへの人頭税（ジズヤ）を廃し、ヒンドゥー諸侯を政権に取り込む融和策で北インドを安定させた。オスマン・サファヴィー・ムガルはいずれも火砲を大規模に運用して広域を支配した『火薬帝国』で、宮廷文化・細密画・建築で豊かな成果を残した。", "regionCode": "IR", "lat": 32.65, "lng": 51.67, "factLevel": "定説", "body": [{"label": "シーア派国教化の重み", "text": "サファヴィー朝がシーア派を国教にしたことで、イランは今日に至るまでシーア派が多数を占める国となった。オスマンとの対立は宗派対立と国境紛争が重なり、今の中東の宗派地図の原型を作った。", "source": "batch 14 直接生成"}, {"label": "アクバルの融和策", "text": "インドの圧倒的多数であるヒンドゥー教徒を支配するため、ラージプートの王女との婚姻、ジズヤ廃止、ヒンドゥー教徒の高官登用を行った。この対照で、のちアウラングゼーブの厳格化が帝国の不安定化を招いたとされる。", "source": "batch 14 直接生成"}, {"label": "『火薬帝国』という括り", "text": "大砲・銃を中核にした常備軍で広域を一元支配する体制を、オスマン・サファヴィー・ムガル・明・ロシアなどが共有したとする見方。日本の織豊政権も同じ技術的文脈に置ける。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "delhi-sultanate", "relation": "継承", "note": "1526年バーブルがデリー・スルタン朝を破りムガル帝国が成立"}, {"concept": "ottoman-empire", "relation": "対比", "note": "スンナ派のオスマンに対しサファヴィーはシーア派を国教化し対抗"}, {"concept": "iranian-plateau-geography", "relation": "地理的背景", "note": "山に囲まれた高原が『シーア派の島』としての独自性を支えた"}, {"concept": "gupta-empire", "relation": "対比", "note": "ムガルもヒンドゥー諸侯を取り込む融和策（アクバル）で北インドを安定させた"}, {"concept": "mongol-empire-formation", "relation": "継承", "note": "バーブルはティムールとチンギス・ハンの血を引く"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "サファヴィー,ムガル,バーブル,アクバル,シーア派,イスファハーン,火薬帝国", "lastUpdated": "2026-09-04"}, {"id": "sahara-desert-and-maghreb-geography", "title": "サハラ砂漠と地中海岸（マグリブ）", "domain": "地理", "region": "アフリカ", "headline": "世界最大の砂漠は障壁であり、オアシスとラクダで結ばれた交易空間でもあった", "factLevel": "定説", "regionCode": "DZ", "lat": 23.4, "lng": 12.6, "summary": "サハラは世界最大の砂漠（約860万km²、ほぼアメリカ本土に匹敵）。年降水量25mm未満の地帯が広がり、砂丘は全体の2割ほどで大半は岩石砂漠・礫砂漠。約6,000〜5,000年前までは湿潤で草原と湖があり（「緑のサハラ」）、その後の乾燥化で人々がナイル谷などへ移動したことがエジプト文明成立の背景の一つとされる。北の地中海岸＝マグリブは、アトラス山脈が冬の地中海性気候の雨を受け止めて麦作とオリーブが可能な帯状の可住地で、古代から地中海世界に属し、サハラ交易の北の窓口になった。", "body": [{"label": "砂漠の中身", "text": "「砂の海」というイメージに反し、砂丘（エルグ）は約2割。大半は岩盤がむき出しのハマダと礫砂漠のレグ。中央部にはアハガル山地・ティベスティ山地の火山高地もある。", "source": "batch 12 直接生成"}, {"label": "緑のサハラ", "text": "完新世前期は湿潤で、タッシリ・ナジェールの岩絵に牛・キリン・河馬が描かれる。地球の歳差運動によるモンスーンの北上が原因で、約5,000年前に急速に乾燥化した。", "source": "batch 12 直接生成"}, {"label": "障壁から交易空間へ", "text": "3世紀ごろラクダが北アフリカに普及し、オアシスを結節点とするサハラ縦断交易が成立。塩（北）と金（南）を運ぶキャラバンの道になった（→サハラ交易と交易国家）。", "source": "batch 12 直接生成"}, {"label": "マグリブ", "text": "「日の沈む地」の意。アトラス山脈の北・西側斜面が地中海の雨を受け、細い可住の帯を作る。フェニキア（カルタゴ）・ローマ・イスラームの地中海世界の一部で、サハラ交易の北端。", "source": "batch 12 直接生成"}], "relatedTopics": [{"concept": "africa-plateau-and-coast-geography", "relation": "関連", "note": "低アフリカの北半分を覆う"}, {"concept": "sahel-belt-geography", "relation": "関連", "note": "砂漠の南縁に接する半乾燥のへり。交易の相手側"}, {"concept": "ancient-egypt-old-to-new", "relation": "因果", "note": "サハラ乾燥化がナイル谷への人口集中を促した"}, {"concept": "trans-saharan-trade-states", "relation": "地理的背景", "note": "岩塩鉱とオアシス隊商路が、砂漠を「交易空間」にした"}, {"concept": "mediterranean-world-geography", "relation": "地理的背景", "note": "マグリブは地中海性気候の帯として地中海世界に属した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 12 直接生成 / rekishi-12-africa-geography.md", "date": "2026-09-03"}], "tags": "地理,アフリカ,サハラ,砂漠,マグリブ,交易", "lastUpdated": "2026-09-03"}, {"id": "sahel-belt-geography", "title": "サヘル（サハラ南縁の半乾燥ベルト）", "domain": "地理", "region": "アフリカ", "headline": "砂漠と森林の間を東西5,000km走る「岸」――交易国家のゆりかごで、砂漠化の最前線", "factLevel": "定説", "regionCode": "NE", "lat": 15, "lng": 5, "summary": "サヘルはアラビア語で「岸」「へり」の意。サハラ砂漠の南縁を東西5,000km以上にわたって帯状に走る半乾燥のステップ・サバナ地帯で、年降水量はおよそ150〜600mm、北へ行くほど乾く明瞭な勾配がある。雨季は夏に短く集中し、ソルガム・ミレット（雑穀）と牧畜が生業。歴史的にサハラ交易の南の玄関口で、ガーナ・マリ・ソンガイの交易国家、トンブクトゥ・ジェンネの隊商都市・学問都市が並んだ。降水量の年々変動が激しく、干ばつと過放牧・薪採取による砂漠化が深刻な脆弱地帯でもある。", "body": [{"label": "位置と気候", "text": "セネガルから紅海まで、サハラとスーダン・サバナ地帯の間の遷移帯。南北の幅は数百km。雨季は7〜9月に集中し、その量と開始時期の年較差が非常に大きい。", "source": "batch 12 直接生成"}, {"label": "交易国家の帯", "text": "サハラ交易の金と塩がここで積み替えられ、関税と仲介で王権が富んだ。ガーナ（8〜11世紀）、マリ（13〜15世紀、マンサ・ムーサ）、ソンガイ（15〜16世紀）が興亡した。", "source": "batch 12 直接生成"}, {"label": "脆弱性と砂漠化", "text": "1970〜80年代の大干ばつで数十万人が犠牲に。過放牧・過耕作・薪採取で植生が失われ「サハラが南下する」現象が問題化。近年は「グレート・グリーン・ウォール」（緑の長城）構想で植林による食い止めが試みられている。", "source": "batch 12 直接生成"}, {"label": "現代の不安定", "text": "気候変動、人口増、国家統治の弱さが重なり、21世紀は武装勢力の活動地帯にもなっている。地理的脆弱性が安全保障問題に直結する例。", "source": "batch 12 直接生成"}], "relatedTopics": [{"concept": "sahara-desert-and-maghreb-geography", "relation": "関連", "note": "砂漠の南のへり。交易でつながる相手側"}, {"concept": "trans-saharan-trade-states", "relation": "地理的背景", "note": "草原ベルトに交易都市と国家が並んだ舞台そのもの"}, {"concept": "africa-plateau-and-coast-geography", "relation": "関連", "note": "乾燥帯のなか、人口と国家が集中した「水のある帯」の一つ"}, {"concept": "monsoon-asia-rice-frontier", "relation": "対比", "note": "アジアの稲作北限と同様、降水量の等値線が生業と社会の境界になる"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 12 直接生成 / rekishi-12-africa-geography.md", "date": "2026-09-03"}], "tags": "地理,アフリカ,サヘル,半乾燥,砂漠化,交易国家", "lastUpdated": "2026-09-03"}, {"id": "sakoku-policy", "title": "「鎖国」政策の完成", "domain": "日本史", "region": "日本", "headline": "禁教とポルトガル船来航禁止で「四つの窓口」体制が固まった", "startYear": 1633, "endYear": 1639, "eraLabel": "江戸時代初期", "summary": "キリスト教の広がりを警戒した江戸幕府は、島原・天草一揆(1637-38)後の1639年にポルトガル船の来航を禁止し、日本人の海外渡航・帰国も禁じる一連の法令(いわゆる「鎖国令」)を完成させた。ただし完全な孤立ではなく、長崎(オランダ・中国)、対馬(朝鮮)、薩摩(琉球)、松前(アイヌ)という「四つの窓口」を通じて情報と貿易は管理下で継続した。近年の研究ではこの体制を「鎖国」ではなく幕府による対外関係の一元管理(海禁)と捉える見方が有力になっている。", "regionCode": "42", "lat": 32.7503, "lng": 129.8779, "factLevel": "有力説", "body": [{"label": "島原・天草一揆と禁教の徹底", "text": "重税とキリシタン弾圧に反発した島原・天草一揆(1637-38)の鎮圧後、幕府はキリスト教根絶と貿易統制を一段と強化した。", "source": "MulmoClaude"}, {"label": "「四つの窓口」", "text": "長崎(オランダ商館・中国船)、対馬藩(朝鮮との通信)、薩摩藩(琉球経由の中国交易)、松前藩(アイヌとの交易)という4つの管理された窓口を通じ、情報と物資の流通は途絶えなかった。", "source": "MulmoClaude"}, {"label": "「鎖国」という語をめぐる見直し", "text": "「鎖国」という言葉自体は後世(18世紀末以降)に定着したもので、近年の学界では幕府による対外関係の一元的統制・管理貿易(海禁)と捉える見方が有力になっている。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "nanban-trade-and-christianity", "relation": "因果", "note": "南蛮貿易とキリスト教布教への警戒が鎖国政策を引き起こした"}, {"concept": "edo-shogunate-bakuhan-system", "relation": "継承", "note": "幕藩体制の対外関係管理策として位置づけられる"}, {"concept": "qing-dynasty-prosperity", "relation": "同時代", "note": "明清交替の混乱と日本の対外関係再編がほぼ同時期に進んだ"}, {"concept": "genroku-culture", "relation": "因果", "note": "管理された安定のもとで泰平の元禄文化が花開く条件が整った"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,日本,鎖国,対外関係", "lastUpdated": "2026-09-04"}, {"id": "scientific-revolution", "title": "科学革命", "domain": "横断テーマ", "region": "ヨーロッパ", "headline": "コペルニクスからニュートンへ、自然を数学で読む知が定着した", "startYear": 1543, "endYear": 1687, "eraLabel": "16世紀半ば〜17世紀末", "summary": "1543年のコペルニクスの地動説提唱に始まり、ケプラーの惑星運動法則、ガリレイの望遠鏡観測と力学、そして1687年のニュートン『プリンキピア』による万有引力の法則の定式化に至る一連の知的転換を「科学革命」と呼ぶ。観察・実験・数学的記述を組み合わせる新しい方法論が、権威(アリストテレスや教会)への依拠に代わって自然理解の基準となった。イギリスの王立協会やフランスの科学アカデミーなど国家が学問を組織的に支援する制度も同時期に生まれ、啓蒙思想や産業革命への土台を用意した。", "regionCode": "GB", "lat": 51.5074, "lng": -0.1278, "factLevel": "定説", "body": [{"label": "天動説から地動説へ", "text": "コペルニクス(1543)、ケプラー(惑星運動の3法則)、ガリレイ(望遠鏡観測と地動説擁護)と段階的に観測・数学が天動説を置き換えていった。", "source": "MulmoClaude"}, {"label": "ニュートンと『プリンキピア』", "text": "1687年刊行の『自然哲学の数学的諸原理(プリンキピア)』で運動の三法則と万有引力の法則を定式化し、天体と地上の運動を単一の数式で統一的に説明した。", "source": "MulmoClaude"}, {"label": "学会という制度", "text": "1660年設立のイギリス王立協会、1666年設立のフランス科学アカデミーなど、国家が学問活動を組織的に支援・検証する制度がこの時期に整った。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "renaissance", "relation": "継承", "note": "古典古代の知への回帰から出発し、それを乗り越えていった"}, {"concept": "reformation", "relation": "関連", "note": "既存の権威への懐疑という点で宗教改革と同じ土壌を持つ"}, {"concept": "english-revolution-to-glorious-revolution", "relation": "同時代", "note": "王立協会の設立(1660)は王政復古期のイギリスで実現した"}, {"concept": "french-absolutism-louis-xiv", "relation": "関連", "note": "フランス科学アカデミーも王権の庇護下で設立された"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 16 直接生成 / rekishi-16-early-modern-order.md", "date": "2026-09-04"}], "tags": "近世,科学革命,ヨーロッパ,横断テーマ", "lastUpdated": "2026-09-04"}, {"id": "scramble-for-africa", "title": "アフリカ分割（スクランブル・フォー・アフリカ）", "domain": "世界史", "region": "アフリカ", "headline": "ベルリン会議が定めた「先取り原則」で、アフリカは列強に切り分けられた", "startYear": 1881, "endYear": 1914, "eraLabel": "19世紀末〜20世紀初頭", "summary": "1884〜85年のベルリン会議でヨーロッパ列強がアフリカ分割のルールを取り決めたが、アフリカ側の代表は一人も参加していなかった。産業資本主義が求める資源・市場、統一を終えたドイツ・イタリアの参入意欲、スエズ運河やキニーネといった条件が分割を加速させ、1900年頃にはエチオピアとリベリアを除く全土が植民地化された。", "factLevel": "定説", "body": [{"label": "ベルリン会議(1884-85)", "text": "ビスマルクの提唱で開催。「実効支配していることを他国に通告すれば領有が認められる」という先取り原則を決めた。アフリカ人の意思は一切問われなかった。", "source": "MulmoClaude"}, {"label": "コンゴ自由国の惨劇", "text": "ベルギー国王レオポルド2世の私領となったコンゴでは、ゴム採集のノルマ未達に対する虐待・虐殺が横行し、犠牲者数は諸説あるが数百万人規模とされる。", "source": "MulmoClaude"}, {"label": "分割を可能にした条件", "text": "産業革命後の資本主義が原材料と市場を求めたこと、スエズ運河(1869開通)の戦略的価値、キニーネによるマラリア対策の進歩が内陸進出を可能にした。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "sahara-desert-and-maghreb-geography", "relation": "地理的背景", "note": "北アフリカはフランス・イタリアの勢力圏に切り分けられた"}, {"concept": "east-african-rift-geography", "relation": "地理的背景", "note": "東アフリカ高原は英・独の争奪の場となった"}, {"concept": "trans-saharan-trade-states", "relation": "継承", "note": "従来のサハラ交易国家群の政治秩序が植民地国境によって分断された"}, {"concept": "german-unification", "relation": "因果", "note": "統一を終えたドイツが「遅れてきた帝国」として分割競争に加わった"}, {"concept": "italian-unification", "relation": "因果", "note": "統一を終えたイタリアがエリトリア・リビアなどへ進出した"}, {"concept": "qing-late-reform-and-decline", "relation": "対比", "note": "アフリカは直接の植民地分割、清は主権を残した「勢力範囲」への切り分けという違い"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 18 直接生成 / rekishi-18-imperialism-and-nation-states.md", "date": "2026-09-05"}], "tags": "帝国主義,植民地,アフリカ,ベルリン会議,コンゴ", "lastUpdated": "2026-09-05"}, {"id": "seljuk-and-medieval-islamic-dynasties", "title": "セルジューク朝とイスラーム諸王朝の分立", "domain": "世界史", "region": "西アジア・中東", "headline": "カリフは名だけ──スルタンが実権を握り、イスラーム世界が多王朝に割れる", "startYear": 909, "endYear": 1194, "eraLabel": "10〜12世紀", "factLevel": "定説", "regionCode": "IR", "summary": "10世紀にはアッバース朝カリフは実権を失い、イスラーム世界は多くの王朝に分かれた。エジプトにはシーア派のファーティマ朝がカイロを築いてカリフを自称し、イベリアには後ウマイヤ朝、イラクにはブワイフ朝が並んだ。11世紀半ば、中央アジアから来たスンナ派トルコ系のセルジューク朝が1055年にバグダードへ入り、カリフからスルタンの称号を得て、宗教的権威（カリフ）と世俗的実権（スルタン）の分業体制を生んだ。政治的分裂の一方で、イブン・シーナーやガザーリーが活躍し、マドラサが整備される学問の充実期でもあった。", "body": [{"label": "カリフ権の空洞化", "text": "軍人集団（トルコ系マムルーク、ブワイフ朝など）が実権を握り、カリフは金曜礼拝で名を唱えられ、貨幣に名を刻まれる象徴的存在に退いた。", "source": "batch 11 直接生成"}, {"label": "ファーティマ朝", "text": "909年に北アフリカで興ったシーア派（イスマーイール派）王朝。969年にエジプトを制してカイロを建設し、アズハル学院を設立。バグダードのスンナ派カリフに対抗する『もう一人のカリフ』を立てた。", "source": "batch 11 直接生成"}, {"label": "セルジューク朝とスルタン制", "text": "トゥグリル・ベクが1055年バグダード入城。カリフを『保護』しつつスルタン（支配者）の称号を公認させた。宰相ニザーム・アルムルクがマドラサ網（ニザーミーヤ学院）を整備した。", "source": "batch 11 直接生成"}, {"label": "マンジケルトと十字軍への連鎖", "text": "1071年、セルジューク朝がマンジケルトの戦いでビザンツ皇帝を捕らえアナトリアに進出。この衝撃がビザンツの救援要請と十字軍を呼び込んだ。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "abbasid-caliphate", "relation": "継承", "note": "アッバース朝カリフの権威は残しつつ、実権はスルタンへ"}, {"concept": "crusades", "relation": "因果", "note": "アナトリア進出→ビザンツの要請→十字軍"}, {"concept": "arab-caliphate-expansion", "relation": "関連", "note": "初期の統一カリフ国家から、多王朝分立への長い変化"}, {"concept": "trans-saharan-trade-states", "relation": "同時代", "note": "同じころムラービト朝が北西アフリカで興り、ガーナ王国を圧迫した"}, {"concept": "iranian-plateau-geography", "relation": "地理的背景", "note": "中央アジア草原から来た遊牧トルコ系が高原を越えて西進した"}, {"concept": "mongol-successor-khanates", "relation": "継承", "note": "イル・ハン国が13世紀末にイスラームを国教化しペルシア的官僚制を継いだ"}, {"concept": "delhi-sultanate", "relation": "継承", "note": "ゴール朝を経て北インドのトルコ系軍人政権へ連なる"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "中世,イスラーム,セルジューク,カリフ,トルコ", "lastUpdated": "2026-09-03"}, {"id": "sengoku-and-unification", "title": "戦国の分裂と織豊政権", "domain": "日本史", "region": "日本", "headline": "下剋上の分裂を、信長・秀吉が鉄砲と検地で短期間に再統一した", "startYear": 1467, "endYear": 1600, "eraLabel": "戦国〜安土桃山時代", "summary": "応仁の乱後、各地に戦国大名が割拠した。彼らは分国法を定め、家臣団を城下町に集住させ、鉱山開発・治水・楽市で領国経営を競った。1543年に種子島へ鉄砲が伝わり、戦術（長篠の戦い、1575）と築城（石垣と天守）を変えた。尾張の織田信長は桑名・上洛・将軍追放で室町幕府を終わらせ（1573）、関所撤廃・楽市楽座で流通を促し、宗教勢力の武装解除を進めたが、1582年本能寺の変で倒れた。豊臣秀吉は太閣検地と刀狩（1588、兵農分離）で近世的支配の基礎を築き、1590年に全国統一を達成した。1592・97年には明征服を掛げて朝鮮に出兵したが、明・朝鮮の抵抗と秀吉の死（1598）で撤退した。", "regionCode": "25", "lat": 35.16, "lng": 136.14, "factLevel": "定説", "body": [{"label": "鉄砲が変えたもの", "text": "種子島への伝来後、国友・根来などの職人集団によって国産化され、十年で戦場の標準装備になった。集団運用のために足軽の役割が高まり、城は石垣のない土造りのものから、石垣と天守を備えたものへと変わった。", "source": "batch 14 直接生成"}, {"label": "太閣検地と刀狩", "text": "全国の土地の生産力を石高で統一的に把握し、年貢と軍役の基準を一元化した。刀狩で農民から武器を取り上げ、武士と農民の身分を分けた（兵農分離）。これが江戸時代の身分制の基礎になる。", "source": "batch 14 直接生成"}, {"label": "朝鮮出兵の波及", "text": "文禄・慶長の役は明を東アジアの国際戦争に引き込み、明の財政を圧迫してのちの明滅亡（1644）の一因となった。朝鮮の国土も荒廃した。", "source": "batch 14 直接生成"}], "relatedTopics": [{"concept": "muromachi-shogunate", "relation": "継承", "note": "応仁の乱後の下剋上から戦国大名が割拠、信長が室町幕府を終わらせた（1573）"}, {"concept": "age-of-exploration", "relation": "因果", "note": "1543年伝来の鉄砲が戦術と築城を変えた"}, {"concept": "nanban-trade-and-christianity", "relation": "関連", "note": "南蛮貿易の利と鉄砲・火薬が大名の競争を左右した"}, {"concept": "ming-dynasty-and-zheng-he", "relation": "因果", "note": "秀吉の朝鮮出兵（1592〜98）が明の財政を圧迫した"}, {"concept": "mongol-invasions-of-japan", "relation": "対比", "note": "外征に転じた点で、防衛戦だった元寇と逆の構図"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 14 直接生成 / rekishi-14-age-of-interchange.md", "date": "2026-09-04"}], "tags": "戦国時代,織田信長,豊臣秀吉,鉄砲,太閣検地,刀狩,朝鮮出兵", "lastUpdated": "2026-09-04"}, {"id": "showa-militarism-and-manchurian-incident", "title": "満州事変と軍部の台頭", "domain": "日本史", "region": "東アジア", "headline": "関東軍の自作自演の謀略が、政党政治を終わらせ、軍部主導への道を開いた", "startYear": 1931, "endYear": 1937, "eraLabel": "昭和初期", "summary": "1931年9月、関東軍が奉天郊外で自ら鉄道を爆破し中国側の仕業として満州を占領(柳条湖事件・満州事変)。1932年に満州国を建国したが国際連盟が承認せず、1933年に日本は連盟を脱退。国内では五・一五事件や二・二六事件など軍部のテロが相次ぎ、政党政治は事実上終焉した。", "regionCode": "CN", "lat": 41.8057, "lng": 123.4315, "factLevel": "定説", "body": [{"label": "柳条湖事件と満州占領", "text": "1931年9月、関東軍が奉天郊外の南満州鉄道を自ら爆破し中国側の仕業として満州全土を軍事占領した。", "source": "MulmoClaude"}, {"label": "満州国建国と連盟脱退", "text": "1932年満州国を建国したが、リットン調査団がこれを認めず、日本は1933年に国際連盟を脱退し国際的孤立を深めた。", "source": "MulmoClaude"}, {"label": "軍部のテロと政党政治の終焉", "text": "1932年の五・一五事件(犬養毅首相暗殺)、1936年の二・二六事件と軍部のテロ・クーデターが相次ぎ、政党政治は事実上終焉を迎えた。", "source": "MulmoClaude"}], "relatedTopics": [{"concept": "great-depression", "relation": "因果", "note": "昭和恐慌の深刻な痛手が満蒙を「生命線」と見なす軍部の危機感を強めた"}, {"concept": "rise-of-fascism-and-nazism", "relation": "同時代", "note": "国際連盟脱退はドイツの脱退(1933)とほぼ同時期であった"}, {"concept": "russo-japanese-war", "relation": "継承", "note": "日露戦争で獲得した満州権益の延長線上に満州事変が位置づけられる"}, {"concept": "pacific-war", "relation": "継承", "note": "大陸進出路線の延長上に日中戦争・太平洋戦争がある"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 19 直接生成 / rekishi-19-age-of-total-war.md", "date": "2026-09-05"}], "tags": "満州事変,関東軍,五・一五事件,二・二六事件,日本史", "lastUpdated": "2026-09-05"}, {"id": "silk-road-trade", "title": "シルクロードと東西交易", "domain": "横断テーマ", "region": "グローバル", "headline": "四つの帝国を絹・金貨・仏教・疫病がつないだ、古代のグローバル化", "eraLabel": "前2世紀〜後3世紀（この号の範囲）", "summary": "前2世紀、前漢の武帝が匈奴挟撃の同盟相手を求めて張騫を西域に送ったことが公式な東西交通路の始まりとされる。中国の絹、中央アジアの馬・玉、インドの香料・綿布、ローマの金貨・ガラスが、オアシス都市とパルティアの隊商路を経て行き交った。海路ではモンスーンを使うローマ商人がインド洋を渡り胡椒を買った。物だけでなく仏教や疫病も運ばれた。", "regionCode": "", "lat": 39.47, "lng": 75.99, "factLevel": "解釈的整理", "body": [{"label": "陸のルート", "text": "敦煌から西はタリム盆地の南北ふちのオアシス（楼蘭・亀茲・和田など）を伝い、パミールを越えてサマルカンド、さらにパルティア領を通って地中海へ。関所と隊商宿を帝国が整えたことで長距離輸送が成り立った。", "source": "岩波講座 世界歴史"}, {"label": "海のルート", "text": "1世紀の『エリュトラー海案内記』は、エジプトから紅海・インド洋をモンスーンで渡り、南インドのムジリスでローマ金貨と胡椒を交換する交易の実態を伝える。ローマ側では『インドとの貿易で金が流出する』と嘆く記述も残る。", "source": "エリュトラー海案内記（村川堅太郎訳注）"}, {"label": "運ばれたのは物だけではない", "text": "大乗仏教は西域経由で中国へ、ヘレニズム美術はガンダーラへ、そして165年ごろの『アントニヌスの疫病』は東方遠征のローマ軍が持ち帰ったとされ、交易網が感染症の高速道路にもなった。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "han-empire", "relation": "因果", "note": "前2世紀の張騫の西域派遣が起点"}, {"concept": "roman-principate", "relation": "関連", "note": "ローマ金貨がインドで大量に出土"}, {"concept": "parthia-and-sasanian", "relation": "関連", "note": "陸路の中継貿易を握る要"}, {"concept": "kushan-empire", "relation": "関連", "note": "陸路の十字路"}, {"concept": "iranian-plateau-geography", "relation": "地理的背景", "note": "オアシス都市とカナートが隊商路を支えた"}, {"concept": "anatolia-geography", "relation": "地理的背景", "note": "交易路の西端、アジアとヨーロッパの陸橋"}, {"concept": "tang-dynasty", "relation": "関連", "note": "長安が東の終点。ソグド商人が交易を担い、751年タラス河畔で唐とアッバース朝が接触"}, {"concept": "abbasid-caliphate", "relation": "関連", "note": "バグダードが西の結節点。製紙法の西伝ルート"}, {"concept": "nara-period", "relation": "関連", "note": "正倉院宝物にペルシア・インド由来の品が残る（東端）"}, {"concept": "pax-mongolica-trade", "relation": "継承", "note": "モンゴルが単一政治圏に束ね、駅伝で結んだ最盛期"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 07 直接生成 / rekishi-07-ancient-empires-peak.md", "date": "2026-09-03"}], "tags": "シルクロード 張騫 隊商 モンスーン交易 エリュトラー海案内記", "lastUpdated": "2026-09-03"}, {"id": "song-dynasty", "title": "宋（北宋・南宋）と東アジア交易圏", "domain": "世界史", "region": "東アジア", "headline": "軍事は弱いが経済は前近代の頂点──紙幣・火薬・羅針盤と海の交易帝国", "startYear": 960, "endYear": 1279, "eraLabel": "10〜13世紀", "factLevel": "定説", "regionCode": "CN", "summary": "唐滅亡後の分裂を収めて960年に趙匡胤が建てた王朝。科挙を拡充して皇帝直属の文官官僚制を完成させた一方、軍人を抑えた結果、北方の遼・金・西夏に対して歳幣で和平を買う劣勢が続き、1127年には華北を金に奪われて南宋となった。しかし経済・技術は前近代の頂点で、占城稲による人口1億超、世界初の紙幣、火薬・羅針盤・印刷術が実用化された。海上交易が国家財政の柱となり、市舶司を通じて高麗・日本・東南アジア・インド洋方面と結ばれた広域の交易圏を生んだ。", "body": [{"label": "文治主義と対外劣勢", "text": "科挙官僚が武将にとって代わり、軍閥割拠の再来は防げたが、遼との澶淵の盟（1004）以降、銀・絹の贈与で平和を買う体制になった。1127年の靖康の変で華北を失い、臨安（杭州）を都に南宋として存続した。", "source": "batch 11 直接生成"}, {"label": "経済革命", "text": "早稲の占城稲で長江下流の米が倍増し人口が1億を突破。交子・会子という世界初の紙幣が流通し、都市に商業組合ができ、貨幣経済が農村まで浸透した。", "source": "batch 11 直接生成"}, {"label": "三大発明の実用化", "text": "火薬（火器）・羅針盤（航海）・活版印刷（木版と膠泥活字）がこの時代に社会へ普及し、のちヨーロッパへ伝わって世界史を動かした。", "source": "batch 11 直接生成"}, {"label": "海の交易圏", "text": "泉州・広州・明州に市舶司（海関）を置き、宋の海商が東シナ海・南シナ海・インド洋へ進出。日本の平氏政権が推進した日宋貿易もこの交易圏の一部で、宋銭が日本の貨幣経済化を促した。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "tang-dynasty", "relation": "継承", "note": "唐滅亡→五代十国→宋。律令的貴族制から科挙官僚制へ"}, {"concept": "silk-road-trade", "relation": "継承", "note": "陸路が北方勢力に阻まれ、交易の主軸が海路へ移った"}, {"concept": "indian-ocean-maritime-trade", "relation": "関連", "note": "宋の青磁がスワヒリ海岸まで運ばれた"}, {"concept": "taira-clan-government", "relation": "同時代", "note": "清盛の日宋貿易で日本が宋の交易圏に接続"}, {"concept": "inner-asia-farming-pastoral-frontier", "relation": "地理的背景", "note": "遼・金・西夏との境界は農耕と遊牧の境界とほぼ重なる"}, {"concept": "yuan-dynasty", "relation": "因果", "note": "1279年に元に併合され南宋は滅んだ"}, {"concept": "kamakura-shogunate", "relation": "関連", "note": "日宋貿易・禅宗・宋銭の流入が鎌倉文化を支えた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "中世,中国,宋,交易,技術史", "lastUpdated": "2026-09-03"}, {"id": "south-asian-monsoon", "title": "南アジアのモンスーン（季節風）", "domain": "地理", "region": "南・東南アジア", "headline": "6月に南西から吹き込む湿った風が、亜大陸の農業と暮らしの時計を決める", "eraLabel": "気候", "summary": "インド洋の海と大陸の温度差、そしてヒマラヤ・チベット高原の夏の加熱が季節風を駆動する。夏（6〜9月）は南西モンスーンが海からの湿った空気を運んで大雨を降らせ、冬は乾いた北東モンスーンに逆転する。西ガーツ山脈の風上側やアッサムは世界有数の多雨地帯、内陸のデカン高原やタール砂漠は乾燥する。モンスーンの到来の早遅・強弱が凶作と飢锱を左右し、農事暦や祭りもこのリズムに従う。同じ季節風は古代からアラビア海の帆船航海に利用され、往復の定期交易を可能にした。", "regionCode": "IN", "factLevel": "定説", "body": [{"label": "夏と冬の逆転", "text": "陸と海の比熱差＋ヒマラヤ・チベット高原の加熱が駆動。熱帯収束帯（ITCZ）の南北移動がスイッチにあたる。", "source": "新詳地理"}, {"label": "雨の偏り", "text": "西ガーツ風上・ベンガル湾岸・アッサム（チェラプンジ）は多雨、デカン内陸・タール砂漠・スリランカ北部は少雨。年降水量の地域差が極端。", "source": "新詳地理"}, {"label": "モンスーンと社会", "text": "到来の遅れ＝干ばつ＝飢锱。英領期の大飢锱も雨の欠損が引き金。今もGDPや株価がモンスーン予報に反応する。", "source": "MulmoClaude 整理"}, {"label": "交易風として", "text": "ヒッパロスの風（1世紀にギリシア人が外洋横断への利用を『発見』）。夏は紅海→インド、冬はインド→紅海。ローマ・インド交易の基盤。", "source": "エリュトラー海案内記"}], "relatedTopics": [{"concept": "monsoon-asia-rice-frontier", "relation": "対比", "note": "東アジアの稲作モンスーンと連続した現象の亜大陸版"}, {"concept": "indian-ocean-maritime-trade", "relation": "因果", "note": "季節風の往復性が定期航海を可能にした"}, {"concept": "himalaya-and-indian-subcontinent", "relation": "地理的背景", "note": "ヒマラヤ・チベット高原の加熱がモンスーンを強める"}, {"concept": "roman-principate", "relation": "関連", "note": "ヒッパロスの風でローマ―インドの直行交易"}, {"concept": "gupta-empire", "relation": "地理的背景", "note": "モンスーン農業の余剰がグプタ期の繁栄を支えた"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 09 直接生成 / rekishi-09-south-southeast-asia-geography.md", "date": "2026-09-03"}], "tags": "モンスーン 季節風 南西モンスーン ITCZ 西ガーツ山脈 チェラプンジ ヒッパロスの風 飢锱", "lastUpdated": "2026-09-03"}, {"id": "southern-africa-geography", "title": "南部アフリカ（高原・カラハリ・鉱物の富）", "domain": "地理", "region": "アフリカ", "headline": "台地＋大断崖に、世界有数の金・ダイヤ・プラチナ――鉱物の富が近代史を規定した", "factLevel": "定説", "regionCode": "ZA", "lat": -26, "lng": 24, "summary": "南部アフリカは、標高1,000m超の内陸高原（ハイフェルト）を中心に、周囲を急な崖（大断崖、ドラケンスバーグ山脈）が縁取る典型的な「台地＋大断崖」地形。内陸には半乾燥のカラハリ（乾燥サバナ）、南西の海岸沿いには冷たいベンゲラ海流がもたらす極度の乾燥地ナミブ砂漠がある。大陸最南端付近は西岸の地中海性気候（ケープタウン、独自のフィンボス植生）と東岸の湿潤気候が対照的。金（ウィットウォーターズランド）、ダイヤモンド（キンバリー）、プラチナ・クロム・マンガンで世界の埋蔵量の大半を占め、この鉱物の富が植民・アパルトヘイト・工業化という南アフリカ近代史を強く規定した。", "body": [{"label": "台地と大断崖", "text": "内陸のハイフェルトが海岸へ落ちるところに、急峻な大断崖（グレート・エスカープメント）が弧を描く。海岸平野が狭く、内陸と沿岸の往来が難しい地形。", "source": "batch 12 直接生成"}, {"label": "カラハリとナミブ", "text": "カラハリは砂に覆われるが年降水量150〜500mmの乾燥サバナで「真の砂漠」ではない。ナミブは沖合のベンゲラ寒流で雨がほぼ降らず、海霧が独特の生態系を支える世界最古級の砂漠。", "source": "batch 12 直接生成"}, {"label": "南端の二つの気候", "text": "西のケープタウン周辺は冬雨型の地中海性気候で、固有の低木植生フィンボスが分布。東岸はインド洋の暖流アガラス海流の影響で温暖湿潤。喜望峰は大西洋とインド洋を結ぶ航路の転回点。", "source": "batch 12 直接生成"}, {"label": "鉱物が決めた歴史", "text": "1867年キンバリーのダイヤ、1886年ウィットウォーターズランドの金の発見が、大量の資本と労働力の流入、鉄道建設、アフリカ人労働者の管理制度を生み、2 line": "300年ぶりに中国を一つにし、大運河と科挙で唐の土台を築いた短命王朝", "startYear": 581, "endYear": 618, "eraLabel": "6世紀末〜7世紀初頭", "summary": "581年、北朝の外戚だった楊堅（文帝）が北周を奪って隋を建て、589年に南朝の陳を滅ぼして西晋以来約300年ぶりに中国を統一した。文帝は均田制・租庸調・府兵制を整え、家柄によらず試験で官吏を登用する科挙の原型を始めた。2代煬帝は南北を結ぶ大運河を完成させ東都洛陽を造営したが、大土木事業と3度の高句麗遠征の失敗で民衆が疲弊し、反乱が続発して618年に隋は滅び唐に代わった。制度と統一の枠組みは唐がそのまま受け継いだ。", "regionCode": "CN", "lat": 34.27, "lng": 108.95, "factLevel": "定説", "body": [{"label": "統一の意味", "text": "淮河で南北に分かれていた社会・経済・言語を再び一つの王朝の下に置いた。北朝の軍事力と南朝の経済・文化が結合した。", "source": "詳説世界史"}, {"label": "唐へ引き継がれた制度", "text": "均田制・租庸調・府兵制・三省六部・科挙・律令。『隋唐帝国』と一括りにされるのはこのため。", "source": "詳説世界史"}, {"label": "なぜ短命だったか", "text": "大運河・長城修築・洛陽造営・高句麗遠征を同時期に強行した。秦と同じく『事業は大きく寿命は短い』王朝の典型とされる。", "source": "岩波講座 世界歴史"}, {"label": "東アジアへの衝撃", "text": "統一帝国の再登場は高句麗・百済・新羅・倭に強い緊張を与え、倭では607年の遣隋使（小野妹子）・冠位十二階・十七条憲法など中央集権化の動きを促した。", "source": "MulmoClaude 整理"}], "relatedTopics": [{"concept": "wei-jin-southern-northern-dynasties", "relation": "継承", "note": "300年の南北分裂を終わらせた"}, {"concept": "qin-unification", "relation": "対比", "note": "統一の枠組みを作りながら大事業で自壊した点が秦と重なる"}, {"concept": "silk-road-trade", "relation": "関連", "note": "統一で東西交易路が再び安定した"}, {"concept": "yamato-polity-development", "relation": "因果", "note": "統一帝国の再登場が倭の遣隋使・国政改革を促した"}, {"concept": "buddhism-official-transmission-japan", "relation": "同時代", "note": "隋が中国を統一した頃、倭では崇仏論争が決着し飛鳥仏教が始まる"}, {"concept": "tang-dynasty", "relation": "継承", "note": "律令・均田・科挙・大運河を唐がそのまま受け継いで完成させた"}, {"concept": "taika-reforms-ritsuryo", "relation": "因果", "note": "遣隋使で持ち帰った制度知識が大化改新の下地に"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 08 直接生成 / rekishi-08-late-antiquity-to-early-medieval.md", "date": "2026-09-03"}], "tags": "隋 楊堅 文帝 煬帝 大運河 科挙 均田制 府兵制 三省六部 遣隋使 高句麗遠征", "lastUpdated": "2026-09-03"}, {"id": "taika-reforms-ritsuryo", "title": "大化改新と律令国家の形成", "domain": "日本史", "region": "日本", "headline": "白村江の敗戦を挟み、唐をモデルに中央集権の律令国家へ転回した", "startYear": 645, "endYear": 701, "eraLabel": "7世紀後半（飛鳥時代）", "summary": "645年、中大兄皇子と中臣鎌足が蘇我本宗家を滅ぼし（乙巳の変）、大王中心の中央集権化に着手した。公地公民・班田収授・国郡制・租庸調が唐の律令をモデルに整えられていく。663年、日本は百済復興のため朝鮮へ大軍を送るが唐・新羅連合に白村江で大敗し、対外拡張を放棄して国内体制の整備に全力を向けた。672年の壬申の乱に勝った天武・持統朝が中央集権化を加速し、689年の飛鳥浄御原令、701年の大宝律令で日本は名実ともに律令国家となった。巨大な唐と、その冊封下で強国化した新羅を前に、独立を保つには唐と同じ官僚国家になるしかなかった。", "regionCode": "29", "lat": 34.47, "lng": 135.82, "factLevel": "定説", "body": [{"label": "乙巳の変（645年）と大化改新", "text": "宮中で蘇我入鹿を暗殺し、蘇我本宗家を打倒。孝徳朝で『改新の詔』が出され、公地公民・班田・国郡制・税制の方針が示された（詔の文面には後世の潤色があるとの説も強い）。", "source": "batch 10 直接生成"}, {"label": "白村江の戦い（663年）", "text": "百済滅亡後の復興軍を支援して派遣した倭の水軍が、白村江（錦江河口）で唐・新羅連合に壊滅的敗北。以後、対外進出路線は完全に放棄され、大宰府に水城、西日本各地に朝鮮式山城を築いて防衛体制を固めた。", "source": "batch 10 直接生成"}, {"label": "壬申の乱（672年）", "text": "天智の後継争いで大海人皇子が大友皇子を破り、天武天皇として即位。強力な王権のもとで八色の姓、律令編纂、藤原京造営、『日本』国号・『天皇』号の成立が進んだ。", "source": "batch 10 直接生成"}, {"label": "大宝律令（701年）", "text": "刑部親王・藤原不比等らが編纂。唐の律令にならった体系的な法典で、二官八省の官制、班田収授、租庸調、五刑八虐などを定めた。これで律令国家の骨格が完成した。", "source": "batch 10 直接生成"}], "relatedTopics": [{"concept": "tang-dynasty", "relation": "因果", "note": "律令・官制・都城のモデル。白村江で直接対決した相手"}, {"concept": "yamato-polity-development", "relation": "継承", "note": "氏姓制で豪族を束ねたヤマト政権から中央集権国家へ"}, {"concept": "buddhism-official-transmission-japan", "relation": "関連", "note": "受容をめぐる蘇我・物部の争いの延長に乙巳の変がある"}, {"concept": "korean-peninsula-geography", "relation": "地理的背景", "note": "百済・新羅・高句麗の抗争と白村江の敗戦が転回点"}, {"concept": "nara-period", "relation": "因果", "note": "この律令体制のうえに平城京と奈良の官僚国家が立つ"}, {"concept": "sui-reunification", "relation": "関連", "note": "遣隋使（600〜）で導入が始まった制度輸入の本格化"}, {"concept": "arab-caliphate-expansion", "relation": "同時代", "note": "アラブがシリア・エジプトを制圧した頃、日本では大化改新"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 10 直接生成 / rekishi-10-medieval-world-formation.md", "date": "2026-09-03"}], "tags": "大化改新,乙巳の変,白村江,壬申の乱,大宝律令,律令国家,公地公民,飛鳥", "lastUpdated": "2026-09-03"}, {"id": "taira-clan-government", "title": "平氏政権と日宋貿易", "domain": "日本史", "region": "日本", "headline": "武士初の政権──だが手法は摂関政治そのまま、財源は宋との貿易", "startYear": 1156, "endYear": 1185, "eraLabel": "12世紀後半（平安末期）", "factLevel": "定説", "regionCode": "28", "lat": 34.67, "lng": 135.18, "summary": "1156年の保元の乱、1159年の平治の乱を勝ち抜いた平清盛が武家の棟梁の地位を固めた。清盛は1167年に太政大臣となり、娘徳子を高倉天皇に嫁がせ、その子安徳天皇の外祖父となって——摂関政治と同じ手法で——権力の頂点に立った。大輪田泊（現在の神戸港）を修築して日宋貿易を国家的に推進し、宋銭の大量流入は日本の貨幣経済化を促した。しかし公家・寺社・旧勢力の反発を招き、1180年の以仁王の令旨を機に源平の内乱が全国化、1185年の壇ノ浦で平氏は滅んだ。", "body": [{"label": "保元・平治の乱", "text": "保元の乱（1156）は天皇家・摂関家の内紛に源平の武士が動員された戦い。平治の乱（1159）で清盛が源義朝を破り、源氏は没落、平氏の独走が始まった。", "source": "batch 11 直接生成"}, {"label": "権力掌握の方法", "text": "『平氏にあらずんば人にあらず』。一門で高位高官を占め、知行国・荘園を集積した。天皇の外戚になるという構造は摂関家と同じで、武力を背景にした点だけが新しい。", "source": "batch 11 直接生成"}, {"label": "日宋貿易", "text": "清盛は摂津の大輪田泊を改修し、瀬戸内航路を整え、宋船を畿内近くまで招いた。輸入された大量の宋銭が国内で貨幣として流通し、日本経済の転換点になった。厳島神社の造営もこの海の路線の象徴。", "source": "batch 11 直接生成"}, {"label": "崩壊", "text": "反平氏の動きに対し福原遷都（1180）などで強硬に対応したが逆効果。清盛の死（1181）後、木曾義仲・源頼朝・義経に追われ、1185年壇ノ浦で安徳天皇とともに滅亡した。", "source": "batch 11 直接生成"}], "relatedTopics": [{"concept": "insei-period", "relation": "継承", "note": "院政下で中央進出した平氏が、院をしのぐ武家政権へ"}, {"concept": "fujiwara-regency", "relation": "対比", "note": "外戚として天皇を後見する手法は同じ。違いは背景の武力"}, {"concept": "song-dynasty", "relation": "同時代", "note": "南宋の海上交易圏に日本が本格的に接続した"}, {"concept": "japan-archipelago-geography", "relation": "地理的背景", "note": "瀬戸内海の内海航路が日宋貿易と平氏の勢力基盤を支えた"}, {"concept": "kamakura-shogunate", "relation": "継承", "note": "壇ノ浦で滅び、源頼朝の武家政権に交代した"}], "sourceArticles": [{"sourceName": "MulmoClaude", "ref": "batch 11 直接生成 / rekishi-11-decentralization-and-trade.md", "date": "2026-09-03"}], "tags": "平安,平清盛,武士,日宋貿易,宋銭", "lastUpdated": "2026-09-03"}, {"id": "taisho-democracy", "title": "大正デモクラシー", "domain": "日本史", "region": "日本", "headline": "大戦景気と米騒動が後押しした、普通選挙と政党内閣への民主化の波", "startYear": 1912, "endYear": 1926, "eraLabel": "大正期", "summary": "明治天皇の死(1912年)以降、政党内閣制・普通選挙・言論の自由の拡大を求める風潮が高まった。1913年の第一次護憲運動、1918年の米騒動を経て本格的な政党内閣(原敬内閣)が成立、1925年に普通選挙法が制定された一方、同年の治安維持法で社会主義は厳しく取り締まられた。", "regionCode": "JP", "lat": 35.6762, "lng": 139.6503, "factLevel": "定説", "body": [{"label": "第一次護憲運動（1913）", "text": "一部の藩出身者による専制的
