              {TIMELINE.map((item, idx) => (
                <div key={idx} className="relative group flex items-start justify-between gap-4 p-4 rounded-xl bg-white/[.03] ring-1 ring-white/10 hover:bg-white/[.06] transition">
                  <div className="absolute -left-[19px] top-5 w-2.5 h-2.5 rounded-full bg-sky-400 ring-4 ring-[#090d16]" />
                  <div>
                    <span className="font-mono text-[12px] font-bold text-sky-400 block mb-0.5">{item.year}</span>
                    <h3 className="font-bold text-[15px] text-white">{item.title}</h3>
                  </div>
                  {item.conceptId && (
                    <button onClick={() => goConcept(item.conceptId)} className="flex-shrink-0 px-3 py-1 rounded-lg text-[12px] font-semibold bg-sky-500/10 text-sky-300 hover:bg-sky-500/20 transition border border-sky-500/30">
                      詳細を見る
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
